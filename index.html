<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:'Century Gothic','Segoe UI',sans-serif;}
        body{background:#0a1620;color:#e8ddb0;}
        .container{max-width:1200px;margin:0 auto;padding:20px;}
        
        /* Header */
        .header{background:#07161f;border-bottom:2px solid #d4af37;padding:20px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;}
        .logo h1{color:#d4af37;font-size:1.8rem;}
        .logo p{font-size:0.7rem;color:#aaa;}
        .abn{font-size:0.7rem;background:#0a1822;padding:6px 12px;border-radius:20px;border:1px solid #d4af37;}
        
        /* Buttons */
        button{background:#d4af37;color:#0a1620;font-weight:bold;border:none;cursor:pointer;padding:12px 24px;border-radius:10px;font-size:1rem;}
        button:active{transform:scale(0.98);}
        .btn-outline{background:transparent;border:1px solid #d4af37;color:#d4af37;}
        .btn-danger{background:#8b3a2a;color:white;}
        
        /* Cards */
        .card{background:#0f212e;border-radius:16px;padding:25px;border:1px solid #d4af3730;margin-bottom:20px;}
        .card h2{color:#d4af37;margin-bottom:20px;border-left:3px solid #d4af37;padding-left:12px;}
        
        /* Forms */
        input,select,textarea{width:100%;padding:12px;border-radius:10px;border:1px solid #2c4a5e;background:#0a1822;color:#fff;margin:8px 0;font-size:1rem;}
        
        /* Grid */
        .grid-2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px;}
        .grid-3{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:20px;}
        
        /* Product Card */
        .product-card{background:#07161f;border-radius:12px;padding:15px;text-align:center;border-left:3px solid #d4af37;}
        .product-price{color:#d4af37;font-size:1.2rem;margin:10px 0;}
        .product-qty input{width:80px;text-align:center;margin:5px auto;}
        
        /* Cart */
        .cart-item{display:flex;justify-content:space-between;align-items:center;padding:12px;border-bottom:1px solid #2c4a5e;}
        .total-box{background:#07161f;padding:20px;border-radius:12px;text-align:center;margin:20px 0;}
        .total-amount{font-size:2rem;color:#d4af37;font-weight:bold;}
        
        /* Tables */
        table{width:100%;border-collapse:collapse;font-size:0.75rem;}
        th{background:#d4af37;color:#0a1620;padding:10px;text-align:left;}
        td{padding:8px;border-bottom:1px solid #2c4a5e;}
        
        /* Tabs */
        .tabs{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap;}
        .tab-btn{background:#0f212e;border:none;padding:10px 20px;border-radius:30px;cursor:pointer;color:#e8ddb0;}
        .tab-btn.active{background:#d4af37;color:#0a1620;font-weight:bold;}
        .tab-content{display:none;}
        .tab-content.active{display:block;}
        
        /* Orders */
        .orders-list{max-height:500px;overflow-y:auto;}
        .order-item{background:#07161f;border-radius:12px;padding:15px;margin-bottom:10px;border-left:3px solid #d4af37;}
        .status-pending{background:#8b6b2c;padding:2px 10px;border-radius:20px;font-size:0.7rem;display:inline-block;}
        .status-completed{background:#2c6e3a;padding:2px 10px;border-radius:20px;font-size:0.7rem;display:inline-block;}
        
        .footer{text-align:center;font-size:0.65rem;margin-top:30px;padding-top:20px;border-top:1px solid #2c4a5e;}
        .error{color:#cc6666;font-size:0.8rem;}
        .success{color:#6aab5a;font-size:0.8rem;}
        
        @media(max-width:700px){.header{flex-direction:column;text-align:center;gap:10px;}}
    </style>
</head>

<script>

// ========== 12 ITALIAN PASTAS ==========
const pastas = [
    { id: 1, name: "Spaghetti", code: "BLF-SPG-001", basePrice: 12.90, description: "Classic long pasta, perfect with tomato sauces" },

    { id: 8, name: "Orecchiette", code: "BLF-ORE-008", basePrice: 14.90, description: "Ear-shaped, captures vegetable sauces" },
    { id: 9, name: "Fusilli", code: "BLF-FUS-009", basePrice: 11.90, description: "Spiral shapes, great for pasta salads" },
    { id: 10, name: "Gnocchi", code: "BLF-GNO-010", basePrice: 16.90, description: "Soft potato dumplings, very digestible" },
    { id: 11, name: "Cannelloni", code: "BLF-CAN-011", basePrice: 13.90, description: "Large tubes for stuffing and baking" },
    { id: 12, name: "Lasagne Sheets", code: "BLF-LAS-012", basePrice: 12.90, description: "Flat sheets for layered baked pasta" }

let prices = {};
let customers = {};
let currentUser = null;
let cart = {};
let ordersListener = null;

// ========== LOAD DATA FROM FIREBASE ==========
async function loadPrices() {
    const doc = await db.collection("settings").doc("pastaPrices").get();
    if (doc.exists) {
        prices = doc.data();
    } else {
        pastas.forEach(p => { prices[p.name] = p.basePrice; });
        await db.collection("settings").doc("pastaPrices").set(prices);
    }
}

async function loadCustomers() {
    const snapshot = await db.collection("customers").get();
    customers = {};
    snapshot.forEach(doc => {
        customers[doc.id] = doc.data();
    });
    if (Object.keys(customers).length === 0) {
        const defaultCustomers = {
            "marios": { password: "pasta123", name: "Mario's Restaurant", email: "mario@example.com", phone: "0412 345 678" },
            "olivia": { password: "italian456", name: "Olivia", email: "olivia@example.com", phone: "0423 456 789" }
        };
        for (let [user, data] of Object.entries(defaultCustomers)) {
            await db.collection("customers").doc(user).set(data);
            customers[user] = data;
        }
    }
}

async function savePrices() {
    for (let p of pastas) {
        const input = document.getElementById(`price_${p.id}`);
        if (input) prices[p.name] = parseFloat(input.value);
    }
    await db.collection("settings").doc("pastaPrices").set(prices);
    alert("Prices saved");
}

// ========== LOGIN ==========
function showLogin(type) {
    document.getElementById("app").innerHTML = `
        <div class="container" style="max-width:400px;margin:100px auto;">
            <div class="card">
                <h2 style="text-align:center;">${type === "admin" ? "Admin Login" : "Customer Login"}</h2>
                <input type="text" id="username" placeholder="Username">
                <input type="password" id="password" placeholder="Password">
                <button id="loginBtn">Login</button>
                <button id="backBtn" class="btn-outline" style="margin-top:10px;">Back to Home</button>
                <div id="loginError" class="error" style="margin-top:10px;text-align:center;"></div>
            </div>
        </div>
    `;
    
    document.getElementById("loginBtn").onclick = async () => {
        const username = document.getElementById("username").value;
        const password = document.getElementById("password").value;
        
        if (type === "admin") {
            if (username === "andrew" && password === "belfioti2024") {
                currentUser = { username: "andrew", name: "Andrew", type: "admin" };
                await loadPrices();
                await loadCustomers();
                renderAdminDashboard();
            } else {
                document.getElementById("loginError").innerText = "Invalid admin credentials";
            }
        } else {
            await loadCustomers();
            if (customers[username] && customers[username].password === password) {
                currentUser = { username: username, name: customers[username].name, email: customers[username].email, phone: customers[username].phone, type: "customer" };
                await loadPrices();
                renderCustomerShop();
            } else {
                document.getElementById("loginError").innerText = "Invalid customer credentials";
            }
        }
    };
    document.getElementById("backBtn").onclick = renderLandingPage;
}

// ========== CUSTOMER SHOPPING CART PAGE ==========
function renderCustomerShop() {
    cart = JSON.parse(localStorage.getItem(`cart_${currentUser.username}`) || "{}");
    
    let pastaHtml = "";
    for (let p of pastas) {
        const qty = cart[p.name] || 0;
        pastaHtml += `
            <div class="product-card">
                <div><strong>${p.name}</strong><br><span style="font-size:0.65rem;">${p.code}</span></div>
                <div class="product-price">$${(prices[p.name] || p.basePrice).toFixed(2)} / 500g</div>
                <div class="product-qty">
                    <input type="number" id="qty_${p.id}" value="${qty}" min="0" max="99" step="1">
                </div>
            </div>
        `;
    }
    
    document.getElementById("app").innerHTML = `
        <div class="header">
            <div class="logo">
                <h1>Belfioti Pasta</h1>
                <p>Welcome, ${currentUser.name}</p>
            </div>
            <div class="abn">ABN: ${company.abn}</div>
        </div>
        <div class="container">
            <div style="display:flex;justify-content:space-between;margin-bottom:20px;">
                <button id="logoutBtn" class="btn-outline">Logout</button>
            </div>
            <div class="grid-2">
                <div class="card">
                    <h2>Our Pastas</h2>
                    <div class="grid-2" id="pastaGrid">${pastaHtml}</div>
                </div>
                <div class="card">
                    <h2>Shopping Cart</h2>
                    <div id="cartItems"></div>
                    <div class="total-box">
                        <div>Subtotal (excl. GST)</div>
                        <div class="total-amount" id="subtotal">$0.00</div>
                        <div>GST (10%)</div>
                        <div class="total-amount" id="gstAmount">$0.00</div>
                        <div>Total (incl. GST)</div>
                        <div class="total-amount" id="cartTotal">$0.00</div>
                    </div>
                    <button id="checkoutBtn">Proceed to Checkout</button>
                    <button id="clearCartBtn" class="btn-outline">Clear Cart</button>
                </div>
            </div>
            <div class="footer">${company.name} · ${company.address} · ${company.gst}</div>
        </div>
    `;
    
    for (let p of pastas) {
        const input = document.getElementById(`qty_${p.id}`);
        if (input) {
            input.onchange = () => {
                const val = parseInt(input.value) || 0;
                if (val === 0) delete cart[p.name];
                else cart[p.name] = val;
                localStorage.setItem(`cart_${currentUser.username}`, JSON.stringify(cart));
                updateCartDisplay();
            };
        }
    }
    
    document.getElementById("logoutBtn").onclick = () => { currentUser = null; renderLandingPage(); };
    document.getElementById("clearCartBtn").onclick = () => { cart = {}; localStorage.setItem(`cart_${currentUser.username}`, "{}"); updateCartDisplay(); for(let p of pastas){ const inp = document.getElementById(`qty_${p.id}`); if(inp) inp.value = 0; } };
    document.getElementById("checkoutBtn").onclick = generateInvoice;
    
    updateCartDisplay();
}

function updateCartDisplay() {
    const cartDiv = document.getElementById("cartItems");
    let subtotal = 0;
    let html = "";
    for (let [name, qty] of Object.entries(cart)) {
        const price = prices[name] || pastas.find(p => p.name === name)?.basePrice || 0;
        const itemTotal = price * qty;
        subtotal += itemTotal;
        html += `<div class="cart-item"><span>${name} x${qty}</span><span>$${itemTotal.toFixed(2)}</span></div>`;
    }
    if (Object.keys(cart).length === 0) html = "<p>Cart is empty</p>";
    cartDiv.innerHTML = html;
    
    const gst = subtotal * 0.1;
    const total = subtotal + gst;
    document.getElementById("subtotal").innerText = `$${subtotal.toFixed(2)}`;
    document.getElementById("gstAmount").innerText = `$${gst.toFixed(2)}`;
    document.getElementById("cartTotal").innerText = `$${total.toFixed(2)}`;
}

async function generateInvoice() {
    if (Object.keys(cart).length === 0) {
        alert("Cart is empty");
        return;
    }
    
    let subtotal = 0;
    const items = [];
    for (let [name, qty] of Object.entries(cart)) {
        const price = prices[name] || pastas.find(p => p.name === name)?.basePrice || 0;
        const itemTotal = price * qty;
        subtotal += itemTotal;
        items.push({ name, code: pastas.find(p => p.name === name)?.code, qty, price, subtotal: itemTotal });
    }
    const gst = subtotal * 0.1;
    const total = subtotal + gst;
    
    const invoice = {
        invoiceNumber: "BELF-" + Date.now(),
        date: new Date().toLocaleString(),
        customerName: currentUser.name,
        customerEmail: currentUser.email,
        customerPhone: currentUser.phone,
        items: items,
        subtotal: subtotal,
        gst: gst,
        total: total,
        status: "pending"
    };
    
    await db.collection("orders").add({
        ...invoice,
        customerUsername: currentUser.username,
        timestamp: firebase.firestore.FieldValue.serverTimestamp()
    });
    
    // Generate PDF Invoice
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();
    
    let y = 20;
    doc.setFont("helvetica");
    doc.setFontSize(18);
    doc.text("Belfioti Pasta Artisans", 20, y);
    y += 8;
    doc.setFontSize(10);
    doc.text(company.address, 20, y);
    y += 5;
    doc.text(`ABN: ${company.abn} | ${company.gst}`, 20, y);
    y += 5;
    doc.text(`Phone: ${company.phone} | Email: ${company.email}`, 20, y);
    y += 15;
    
    doc.setFontSize(12);
    doc.text(`INVOICE`, 20, y);
    y += 8;
    doc.setFontSize(10);
    doc.text(`Invoice Number: ${invoice.invoiceNumber}`, 20, y);
    y += 5;
    doc.text(`Date: ${invoice.date}`, 20, y);
    y += 5;
    doc.text(`Customer: ${invoice.customerName}`, 20, y);
    y += 5;
    if (invoice.customerEmail) doc.text(`Email: ${invoice.customerEmail}`, 20, y);
    y += 5;
    if (invoice.customerPhone) doc.text(`Phone: ${invoice.customerPhone}`, 20, y);
    y += 10;
    
    doc.setFillColor(212, 175, 55);
    doc.rect(20, y, 170, 8, "F");
    doc.setTextColor(10, 22, 32);
    doc.text("Product", 25, y + 5);
    doc.text("Qty", 100, y + 5);
    doc.text("Price", 130, y + 5);
    doc.text("Total", 160, y + 5);
    y += 10;
    doc.setTextColor(232, 221, 176);
    
    for (let item of items) {
        doc.text(item.name.substring(0, 20), 25, y);
        doc.text(`${item.qty}`, 105, y);
        doc.text(`$${item.price.toFixed(2)}`, 130, y);
        doc.text(`$${item.subtotal.toFixed(2)}`, 160, y);
        y += 6;
        if (y > 270) { doc.addPage(); y = 20; }
    }
    
    y += 10;
    doc.text(`Subtotal: $${invoice.subtotal.toFixed(2)}`, 130, y);
    y += 6;
    doc.text(`GST (10%): $${invoice.gst.toFixed(2)}`, 130, y);
    y += 8;
    doc.setFontSize(12);
    doc.setTextColor(212, 175, 55);
    doc.text(`TOTAL: $${invoice.total.toFixed(2)}`, 130, y);
    
    doc.save(`Belfioti_Invoice_${invoice.invoiceNumber}.pdf`);
    
    alert(`Invoice generated!\nTotal: $${invoice.total.toFixed(2)} (incl. GST)\nPDF downloaded.`);
    
    cart = {};
    localStorage.setItem(`cart_${currentUser.username}`, "{}");
    renderCustomerShop();
}

    document.getElementById("logoutBtn").onclick = () => { if(ordersListener) ordersListener(); currentUser = null; renderLandingPage(); };
    
    // Customers list
    async function renderCustomersList() {
        await loadCustomers();
        const container = document.getElementById("customersList");
        if (container) {
            container.innerHTML = "<h3>Existing Customers</h3>";
            for (let [user, data] of Object.entries(customers)) {
                container.innerHTML += `<div style="padding:10px;border-bottom:1px solid #2c4a5e;"><strong>${user}</strong> - ${data.name} - ${data.email || 'No email'} - ${data.phone || 'No phone'}</div>`;
            }
        }
    }
    
    document.getElementById("addCustomerBtn").onclick = async () => {
        const username = document.getElementById("newUsername").value.trim();
        const password = document.getElementById("newPassword").value;
        const name = document.getElementById("newName").value;
        const email = document.getElementById("newEmail").value;
        const phone = document.getElementById("newPhone").value;
        
        if (!username || !password || !name) {
            document.getElementById("customerMsg").innerText = "Username, password and name required";
            return;
        }
        
        if (customers[username]) {
            document.getElementById("customerMsg").innerText = "Username already exists";
            return;
        }
        
        await db.collection("customers").doc(username).set({ password, name, email, phone });
        await loadCustomers();
        renderCustomersList();
        document.getElementById("customerMsg").innerText = `Customer ${username} added successfully`;
        document.getElementById("newUsername").value = "";
        document.getElementById("newPassword").value = "";
        document.getElementById("newName").value = "";
        document.getElementById("newEmail").value = "";
        document.getElementById("newPhone").value = "";
        setTimeout(() => document.getElementById("customerMsg").innerText = "", 3000);
    };
    
    // Live orders listener
    if (ordersListener) ordersListener();
    ordersListener = db.collection("orders").orderBy("timestamp", "desc").onSnapshot((snapshot) => {
        const container = document.getElementById("liveOrders");
        if (!container) return;
        if (snapshot.empty) { container.innerHTML = "<div style='padding:20px;text-align:center;'>No orders yet</div>"; return; }
        let html = "";
        snapshot.forEach(doc => {
            const o = doc.data();
            const date = o.timestamp?.toDate?.() ? o.timestamp.toDate().toLocaleString() : "Just now";
            let itemsHtml = "";
            if (o.items && o.items.length) {
                for (let item of o.items) itemsHtml += `<div>${item.name} x${item.qty} - $${item.subtotal.toFixed(2)}</div>`;
            }
            html += `<div class="order-item">
                        <div><strong>${o.customerName}</strong> - ${o.invoiceNumber || "Order"}</div>
                        <div style="font-size:0.7rem;">${date}</div>
                        <div style="font-size:0.75rem;margin:8px 0;">${itemsHtml || `${o.items?.length || 0} items`}</div>
                        <div>Subtotal: $${(o.subtotal || 0).toFixed(2)} | GST: $${(o.gst || 0).toFixed(2)}</div>
                        <div><strong>Total (incl. GST): $${(o.total || 0).toFixed(2)}</strong></div>
                        <div style="margin-top:8px;"><span class="status-${o.status || 'pending'}">${o.status || 'pending'}</span>
                        ${(o.status === 'pending' || !o.status) ? `<button onclick="markOrderComplete('${doc.id}')" style="width:auto;padding:4px 12px;margin-left:10px;font-size:0.7rem;">Mark Complete</button>` : ''}</div>
                    </div>`;
        });
        container.innerHTML = html;
    });
    
    window.markOrderComplete = async (id) => { await db.collection("orders").doc(id).update({ status: "completed" }); };
    
    // Tab switching
    document.querySelectorAll(".tab-btn").forEach(btn => {
        btn.onclick = () => {
            document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
            btn.classList.add("active");
            document.querySelectorAll(".tab-content").forEach(t => t.classList.remove("active"));
            document.getElementById(btn.dataset.tab + "Tab").classList.add("active");
            if (btn.dataset.tab === "customers") renderCustomersList();
        };
    });
}

// ========== START ==========
renderLandingPage();
</script>
</body>
</html>
