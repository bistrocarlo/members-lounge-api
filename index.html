    </div>

// ---------- HELPER FUNCTIONS ----------
function formatDate(dateStr) {
    return new Date(dateStr).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
}

function generateRandomCode() {
    const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ0123456789';
    let result = '';
    for (let i = 0; i < 6; i++) {
        result += chars.charAt(Math.floor(Math.random() * chars.length));
    }
    return result;
}

function escapeHtml(str) {
    return str.replace(/[&<>]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[m] || m));
}

function showToast() {
    const toast = document.getElementById('toast');
    toast.style.display = 'block';
    setTimeout(() => { toast.style.display = 'none'; }, 2200);
}

function showMessage(containerId, text, type) {
    const container = document.getElementById(containerId);
    if (!container) return;
    container.textContent = text;
    container.className = type === 'success' ? 'success-msg' : 'error-msg';
    container.classList.remove('hidden');
    setTimeout(() => container.classList.add('hidden'), 3000);
}

// ---------- PERMANENT LOCAL STORAGE ----------
function loadFromLocal() {
    const saved = localStorage.getItem('membersLoungeData2026');
    if (saved) {
        const data = JSON.parse(saved);
        if (data.employees) employees = data.employees;
        if (data.submissions) submissions = data.submissions;
        if (data.events) events = data.events;
        if (data.eventSettings) eventSettings = data.eventSettings;
        sortEvents();
        return true;
    }
    return false;
}

function saveToLocal() {
    const data = { employees, submissions, events, eventSettings };
    localStorage.setItem('membersLoungeData2026', JSON.stringify(data));
}

function sortEvents() {
    events.sort((a, b) => new Date(a.date) - new Date(b.date));
}

function loadLocalDefault() {
    let baseId = 1742740000000;
    employees = [];
    for (let i = 0; i < defaultEmployeesRaw.length; i++) {
        const emp = defaultEmployeesRaw[i];
        employees.push({
            id: baseId + i + 1,
            empCode: emp.code,
            name: emp.name,
            section: emp.section
        });
    }
    submissions = {};
    events = [...defaultEvents];
    sortEvents();
    eventSettings = {};
}

function initData() {
    const loaded = loadFromLocal();
    if (!loaded) {
        loadLocalDefault();
        saveToLocal();
    }
}

// ---------- CAPACITY & PRE-ASSIGNMENT HELPERS (unchanged) ----------
function getCapacityForEvent(eventId, section) {
    const settings = eventSettings[eventId];
    if (settings && settings.capacities && settings.capacities[section] !== undefined) {
        return settings.capacities[section];
    }
    return DEFAULT_CAPACITIES[section];
}

function getPreAssignedCount(eventId, section) {
    const settings = eventSettings[eventId];
    if (!settings || !settings.preAssignments) return 0;
    const preEmpIds = settings.preAssignments;
    let count = 0;
    for (const empId of preEmpIds) {
        const emp = employees.find(e => e.id == empId);
        if (emp && emp.section === section) count++;
    }
    return count;
}

function getSelfAssignedCount(eventId, section) {
    let count = 0;
    for (let empId in submissions) {
        const emp = employees.find(e => e.id == empId);
        if (emp && emp.section === section && submissions[empId].includes(eventId)) count++;
    }
    return count;
}

function remainingSlots(eventId, section) {
    const capacity = getCapacityForEvent(eventId, section);
    const pre = getPreAssignedCount(eventId, section);
    const self = getSelfAssignedCount(eventId, section);
    return capacity - pre - self;
}

function isEmployeePreAssigned(employeeId, eventId) {
    const settings = eventSettings[eventId];
    if (!settings || !settings.preAssignments) return false;
    return settings.preAssignments.includes(employeeId);
}

// ---------- RENDER DATES ----------
let currentEmployeeId = null;
async function renderDates() {
    const container = document.getElementById('dates-container');
    if (!container || !currentEmployeeId) return;
    const employee = employees.find(e => e.id === currentEmployeeId);
    if (!employee) return;
    const section = employee.section;
    container.innerHTML = '';
    for (const event of events) {
        const remaining = remainingSlots(event.id, section);
        const isCurrentlyAvailable = (submissions[currentEmployeeId] || []).includes(event.id);
        const isPreAssigned = isEmployeePreAssigned(currentEmployeeId, event.id);
        const isChecked = isPreAssigned || isCurrentlyAvailable;
        const isDisabled = isPreAssigned || (remaining <= 0 && !isCurrentlyAvailable);
        const slotsInfo = isPreAssigned ? ' (You are pre-assigned)' : ` slots left: ${remaining}`;
        const div = document.createElement('div');
        div.className = 'date-item';
        div.innerHTML = `
            <div class="event-info">
                <strong>${formatDate(event.date)}</strong><br>
                ${event.venue}
            </div>
            <div class="slots-info">
                ${section.charAt(0).toUpperCase() + section.slice(1)}${slotsInfo}
            </div>
            <label>
                <input type="checkbox" data-id="${event.id}" ${isChecked ? 'checked' : ''} ${isDisabled ? 'disabled' : ''}>
                Available
            </label>
        `;
        container.appendChild(div);
    }
}

// ---------- SUBMIT AVAILABILITY (PERMANENT) ----------
async function submitAvailability() {
    if (!currentEmployeeId) {
        showMessage('staff-message', 'Please load your employee details first.', 'error');
        return;
    }
    const checkboxes = document.querySelectorAll('#dates-container input[type="checkbox"]');
    const selected = [];
    checkboxes.forEach(cb => {
        if (cb.checked) selected.push(cb.getAttribute('data-id'));
    });

    const employee = employees.find(e => e.id === currentEmployeeId);
    const section = employee.section;

    for (let eventId of selected) {
        if (isEmployeePreAssigned(currentEmployeeId, eventId)) continue;
        const remaining = remainingSlots(eventId, section);
        const isAlreadyIn = (submissions[currentEmployeeId] || []).includes(eventId);
        if (!isAlreadyIn && remaining <= 0) {
            showMessage('staff-message', `Cannot add ${section} for ${events.find(e => e.id === eventId)?.venue}: capacity full.`, 'error');
            return;
        }
    }

    submissions[currentEmployeeId] = selected;
    saveToLocal();
    showToast();
    showMessage('staff-message', `Availability saved for ${employee.name}. Thank you!`, 'success');
    renderDates();
    if (managerAuthenticated) {
        renderAvailabilityMatrix(document.querySelector('.filter-btn.active')?.dataset.section || 'all');
    }
}

// ---------- ADMIN FUNCTIONS ----------
async function addEvent(date, venue) {
    if (!date || !venue) { alert('Please enter both date and venue'); return false; }
    if (events.some(e => e.date === date && e.venue === venue)) { alert('Event already exists'); return false; }
    const newId = Date.now().toString();
    events.push({ id: newId, date, venue });
    sortEvents();
    saveToLocal();
    refreshAllViews();
    return true;
}

async function deleteEvent(eventId) {
    if (confirm('Delete this event?')) {
        events = events.filter(e => e.id !== eventId);
        for (let empId in submissions) {
            submissions[empId] = submissions[empId].filter(eid => eid !== eventId);
        }
        delete eventSettings[eventId];
        saveToLocal();
        refreshAllViews();
    }
}

function refreshAllViews() {
    if (managerAuthenticated) {
        renderAdminEmployees();
        renderAdminEventsList();
        renderAvailabilityMatrix(document.querySelector('.filter-btn.active')?.dataset.section || 'all');
    }
    if (currentEmployeeId) renderDates();
}

function renderAdminEventsList() {
    const container = document.getElementById('event-list');
    container.innerHTML = '';
    events.forEach(event => {
        const div = document.createElement('div');
        div.style.display = 'flex';
        div.style.justifyContent = 'space-between';
        div.style.alignItems = 'center';
        div.style.padding = '8px';
        div.style.borderBottom = '1px solid #eee';
        div.innerHTML = `
            <span>${formatDate(event.date)} – ${event.venue}</span>
            <div>
                <button class="edit-event-settings" data-id="${event.id}" style="background:#2196f3; margin-right:5px;">Edit Settings</button>
                <button class="delete-event" data-id="${event.id}" style="background:#ff4444;">Delete</button>
            </div>
        `;
        container.appendChild(div);
    });
    document.querySelectorAll('.delete-event').forEach(btn => {
        btn.addEventListener('click', () => deleteEvent(btn.getAttribute('data-id')));
    });
    document.querySelectorAll('.edit-event-settings').forEach(btn => {
        btn.addEventListener('click', () => openEventSettingsModal(btn.getAttribute('data-id')));
    });
}

// ---------- EVENT SETTINGS ----------
let currentEventIdForSettings = null;
function openEventSettingsModal(eventId) {
    currentEventIdForSettings = eventId;
    const event = events.find(e => e.id === eventId);
    document.getElementById('eventSettingsTitle').innerText = `Settings for ${formatDate(event.date)} – ${event.venue}`;
    const container = document.getElementById('eventSettingsContent');
    const settings = eventSettings[eventId] || { capacities: {}, preAssignments: [] };

    let capacitiesHtml = '<div class="capacity-row">';
    const sections = ['kitchen', 'floor', 'bar', 'cleaner', 'setup', 'manager'];
    for (const sec of sections) {
        const currentVal = settings.capacities[sec] !== undefined ? settings.capacities[sec] : DEFAULT_CAPACITIES[sec];
        capacitiesHtml += `
            <div class="capacity-field">
                <label>${sec.charAt(0).toUpperCase() + sec.slice(1)}</label>
                <input type="number" id="cap-${sec}" value="${currentVal}" min="0" step="1">
            </div>
        `;
    }
    capacitiesHtml += '</div>';

    const preAssignments = settings.preAssignments || [];
    const employeesBySection = {};
    for (const emp of employees) {
        if (!employeesBySection[emp.section]) employeesBySection[emp.section] = [];
        employeesBySection[emp.section].push(emp);
    }

    let preHtml = '<h4>Pre-assign Staff</h4><div style="margin-bottom:10px;">Select employees to pre-assign (they cannot unassign themselves).</div>';
    for (const sec of sections) {
        const emps = employeesBySection[sec] || [];
        if (emps.length === 0) continue;
        preHtml += `<div style="margin-top:10px;"><strong>${sec.charAt(0).toUpperCase() + sec.slice(1)}</strong></div>`;
        preHtml += '<div class="preassign-list" id="preassign-list-'+sec+'">';
        for (const emp of emps) {
            const isChecked = preAssignments.includes(emp.id);
            preHtml += `
                <div class="preassign-item">
                    <label>${emp.name} (${emp.empCode})</label>
                    <input type="checkbox" class="preassign-checkbox" data-id="${emp.id}" ${isChecked ? 'checked' : ''}>
                </div>
            `;
        }
        preHtml += '</div>';
    }

    container.innerHTML = capacitiesHtml + preHtml;
    document.getElementById('eventSettingsModal').style.display = 'flex';
}

async function saveEventSettings() {
    if (!currentEventIdForSettings) return;
    const capacities = {};
    const sections = ['kitchen', 'floor', 'bar', 'cleaner', 'setup', 'manager'];
    for (const sec of sections) {
        const input = document.getElementById(`cap-${sec}`);
        if (input) capacities[sec] = parseInt(input.value, 10);
    }
    const preAssignments = [];
    document.querySelectorAll('.preassign-checkbox:checked').forEach(cb => {
        preAssignments.push(parseInt(cb.getAttribute('data-id')));
    });
    eventSettings[currentEventIdForSettings] = { capacities, preAssignments };
    saveToLocal();
    showToast();
    closeEventSettingsModal();
    refreshAllViews();
}

function closeEventSettingsModal() {
    document.getElementById('eventSettingsModal').style.display = 'none';
    currentEventIdForSettings = null;
}

// ---------- EMPLOYEE MANAGEMENT ----------
let editingEmployeeId = null;
function openEditModal(empId) {
    const employee = employees.find(e => e.id === empId);
    if (!employee) return;
    editingEmployeeId = empId;
    document.getElementById('edit-emp-name').value = employee.name;
    document.getElementById('edit-emp-section').value = employee.section;
    document.getElementById('edit-emp-code').value = employee.empCode;
    document.getElementById('edit-error').classList.add('hidden');
    document.getElementById('editModal').style.display = 'flex';
}

function closeEditModal() {
    document.getElementById('editModal').style.display = 'none';
    editingEmployeeId = null;
}

async function saveEdit() {
    const newName = document.getElementById('edit-emp-name').value.trim();
    const newSection = document.getElementById('edit-emp-section').value;
    const newCode = document.getElementById('edit-emp-code').value.trim();
    if (!newName || !newCode) {
        document.getElementById('edit-error').textContent = 'Name and code are required.';
        document.getElementById('edit-error').classList.remove('hidden');
        return;
    }
    if (employees.some(e => e.id !== editingEmployeeId && e.empCode === newCode)) {
        document.getElementById('edit-error').textContent = 'Employee code already exists.';
        document.getElementById('edit-error').classList.remove('hidden');
        return;
    }
    const index = employees.findIndex(e => e.id === editingEmployeeId);
    if (index !== -1) {
        employees[index].name = newName;
        employees[index].section = newSection;
        employees[index].empCode = newCode;
        saveToLocal();
        closeEditModal();
        refreshAllViews();
    }
}

function renderAdminEmployees() {
    const container = document.getElementById('employee-list');
    container.innerHTML = '';
    employees.forEach(emp => {
        const card = document.createElement('div');
        card.className = 'employee-card';
        card.innerHTML = `
            <div class="name">${escapeHtml(emp.name)} <span class="code">${emp.empCode}</span></div>
            <div class="sections">Section: ${emp.section.charAt(0).toUpperCase() + emp.section.slice(1)}</div>
            <div>
                <button class="edit-btn" data-id="${emp.id}">Edit</button>
                <button class="generate-code-btn" data-id="${emp.id}">Regenerate Code</button>
                <button class="remove-emp" data-id="${emp.id}">Remove</button>
            </div>
        `;
        container.appendChild(card);
    });
    document.querySelectorAll('.edit-btn').forEach(btn => btn.addEventListener('click', () => openEditModal(parseInt(btn.getAttribute('data-id')))));
    document.querySelectorAll('.generate-code-btn').forEach(btn => {
        btn.addEventListener('click', async () => {
            const id = parseInt(btn.getAttribute('data-id'));
            const emp = employees.find(e => e.id === id);
            if (emp) {
                emp.empCode = generateRandomCode();
                saveToLocal();
                renderAdminEmployees();
            }
        });
    });
    document.querySelectorAll('.remove-emp').forEach(btn => {
        btn.addEventListener('click', async () => {
            const id = parseInt(btn.getAttribute('data-id'));
            if (confirm('Remove this employee?')) {
                employees = employees.filter(e => e.id !== id);
                delete submissions[id];
                for (let eventId in eventSettings) {
                    if (eventSettings[eventId].preAssignments) {
                        eventSettings[eventId].preAssignments = eventSettings[eventId].preAssignments.filter(pid => pid !== id);
                    }
                }
                saveToLocal();
                renderAdminEmployees();
                refreshAllViews();
            }
        });
    });
}

// ---------- AVAILABILITY MATRIX ----------
async function renderAvailabilityMatrix(sectionFilter = 'all') {
    const container = document.getElementById('availability-matrix');
    let filteredEmployees = sectionFilter === 'all' ? employees : employees.filter(emp => emp.section === sectionFilter);
    let html = '<table style="min-width:600px;"><thead><tr><th>Event</th>';
    filteredEmployees.forEach(emp => {
        html += `<th>${escapeHtml(emp.name)}<br><small>${emp.empCode}</small></th>`;
    });
    html += '</tr></thead><tbody>';
    for (const event of events) {
        html += `<tr><td><strong>${formatDate(event.date)}<br>${event.venue}</strong></td>`;
        for (const emp of filteredEmployees) {
            const available = (submissions[emp.id] || []).includes(event.id) || isEmployeePreAssigned(emp.id, event.id);
            html += `<td style="text-align:center;">${available ? '<span class="available-yes">✓</span>' : '<span class="available-no">✗</span>'}</td>`;
        }
        html += '</tr>';
    }
    html += '</tbody></table>';

    // Summary
    html += '<div style="margin-top:30px;"><h3>Summary by Section</h3>';
    const sections = ['kitchen','floor','bar','cleaner','setup','manager'];
    sections.forEach(section => {
        const sectionEmps = employees.filter(e => e.section === section);
        if (sectionEmps.length === 0) return;
        html += `<h4>${section.charAt(0).toUpperCase() + section.slice(1)}</h4><table><thead><tr><th>Event</th><th>Assigned / Capacity</th><th>Remaining</th></tr></thead><tbody>`;
        for (const event of events) {
            const pre = getPreAssignedCount(event.id, section);
            const self = getSelfAssignedCount(event.id, section);
            const total = pre + self;
            const cap = getCapacityForEvent(event.id, section);
            const rem = cap - total;
            html += `<tr><td>${formatDate(event.date)} – ${event.venue}</td><td>${total} / ${cap}</td><td style="color:#D4AF37;font-weight:bold;">${rem < 0 ? 0 : rem} left</td></tr>`;
        }
        html += '</tbody></table>';
    });
    container.innerHTML = html;
}

// ---------- OTHER ADMIN FUNCTIONS ----------
async function addEmployee() {
    const name = document.getElementById('new-employee-name').value.trim();
    const section = document.getElementById('new-employee-section').value;
    let code = document.getElementById('new-employee-code').value.trim();
    if (!name) return alert('Please enter name');
    if (!code) code = generateRandomCode();
    if (employees.some(e => e.empCode === code)) return alert('Code already exists');
    const newId = Date.now();
    employees.push({ id: newId, empCode: code, name, section });
    saveToLocal();
    document.getElementById('new-employee-name').value = '';
    document.getElementById('new-employee-code').value = '';
    renderAdminEmployees();
    refreshAllViews();
}

function exportCSV() {
    let csv = 'Employee Code,Name,Section,Date,Venue,Available\n';
    for (const emp of employees) {
        const av = submissions[emp.id] || [];
        for (const ev of events) {
            const yes = av.includes(ev.id) || isEmployeePreAssigned(emp.id, ev.id);
            csv += `"${emp.empCode}","${emp.name}","${emp.section}","${formatDate(ev.date)}","${ev.venue}",${yes ? 'Yes' : 'No'}\n`;
        }
    }
    const blob = new Blob([csv], { type: 'text/csv' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'staff-availability.csv';
    a.click();
}

function exportEmployeeCodes() {
    let csv = 'Name,Code,Section\n';
    employees.forEach(emp => csv += `"${emp.name}","${emp.empCode}","${emp.section}"\n`);
    const blob = new Blob([csv], { type: 'text/csv' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'employee-codes.csv';
    a.click();
}

function exportData() {
    const data = { employees, submissions, events, eventSettings };
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'members-lounge-data.json';
    a.click();
}

async function importData(file) {
    const reader = new FileReader();
    reader.onload = async function(e) {
        try {
            const data = JSON.parse(e.target.result);
            if (data.submissions) Object.assign(submissions, data.submissions);
            if (data.events) events = data.events;
            if (data.eventSettings) Object.assign(eventSettings, data.eventSettings);
            saveToLocal();
            const status = document.getElementById('import-status');
            status.textContent = 'Import successful!';
            status.classList.remove('hidden');
            setTimeout(() => status.classList.add('hidden'), 3000);
            refreshAllViews();
        } catch(err) { alert('Invalid file'); }
    };
    reader.readAsText(file);
}

function showCodeList() {
    const container = document.getElementById('code-list-container');
    const textarea = document.getElementById('code-list-textarea');
    let text = '';
    employees.forEach(emp => text += `${emp.name} – ${emp.empCode} – ${emp.section}\n`);
    textarea.value = text;
    container.classList.remove('hidden');
}

function copyCodeList() {
    const ta = document.getElementById('code-list-textarea');
    ta.select();
    document.execCommand('copy');
    alert('Copied!');
}

function switchTab(tabId) {
    if ((tabId === 'admin' || tabId === 'availability') && !managerAuthenticated) {
        const pwd = prompt('Manager password:');
        if (pwd === MANAGER_PASSWORD) {
            managerAuthenticated = true;
            sessionStorage.setItem('managerAuthenticated', 'true');
        } else {
            alert('Wrong password');
            return;
        }
    }
    document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.getElementById(tabId + '-pane').classList.add('active');
    document.querySelector(`[data-tab="${tabId}"]`).classList.add('active');
    if (tabId === 'admin') {
        renderAdminEmployees();
        renderAdminEventsList();
    } else if (tabId === 'availability') {
        renderAvailabilityMatrix('all');
    }
}

function initFilters() {
    document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderAvailabilityMatrix(btn.dataset.section);
        });
    });
}

function loadEmployeeByCode() {
    const code = document.getElementById('employee-code').value.trim().toUpperCase();
    if (!code) return alert('Enter code');
    const employee = employees.find(e => e.empCode === code);
    if (!employee) return alert('Code not found');
    currentEmployeeId = employee.id;
    document.getElementById('display-name').innerText = employee.name;
    document.getElementById('display-section').innerText = employee.section.charAt(0).toUpperCase() + employee.section.slice(1);
    document.getElementById('staff-details').classList.remove('hidden');
    renderDates();
}

async function init() {
    initData();
    initFilters();

    // Modals
    document.querySelectorAll('.close-modal').forEach(c => c.addEventListener('click', () => {
        document.getElementById('editModal').style.display = 'none';
        document.getElementById('eventSettingsModal').style.display = 'none';
    }));

    document.getElementById('save-edit').addEventListener('click', saveEdit);
    document.getElementById('edit-generate-random').addEventListener('click', () => {
        document.getElementById('edit-emp-code').value = generateRandomCode();
    });
    document.getElementById('generate-random-code').addEventListener('click', () => {
        document.getElementById('new-employee-code').value = generateRandomCode();
    });
    document.getElementById('saveEventSettings').addEventListener('click', saveEventSettings);

    // Buttons
    document.getElementById('load-employee').addEventListener('click', loadEmployeeByCode);
    document.getElementById('submit-availability').addEventListener('click', submitAvailability);
    document.getElementById('add-employee').addEventListener('click', addEmployee);
    document.getElementById('add-event').addEventListener('click', async () => {
        const date = document.getElementById('new-event-date').value;
        const venue = document.getElementById('new-event-venue').value.trim();
        if (await addEvent(date, venue)) {
            document.getElementById('new-event-date').value = '';
            document.getElementById('new-event-venue').value = '';
        }
    });
    document.getElementById('export-csv').addEventListener('click', exportCSV);
    document.getElementById('export-codes').addEventListener('click', exportEmployeeCodes);
    document.getElementById('export-data').addEventListener('click', exportData);
    document.getElementById('import-data').addEventListener('click', () => document.getElementById('import-file').click());
    document.getElementById('import-file').addEventListener('change', e => {
        if (e.target.files[0]) importData(e.target.files[0]);
    });
    document.getElementById('show-code-list').addEventListener('click', showCodeList);
    document.getElementById('copy-code-list').addEventListener('click', copyCodeList);
    document.getElementById('clear-all-data').addEventListener('click', () => {
        if (confirm('Clear ALL data and reset?')) {
            localStorage.removeItem('membersLoungeData2026');
            location.reload();
        }
    });
    document.getElementById('save-data').addEventListener('click', () => {
        saveToLocal();
        showMessage('save-status', 'Data saved permanently!', 'success');
    });

    // Tab switching
    document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.addEventListener('click', () => switchTab(btn.getAttribute('data-tab')));
    });

    // Preload if manager already logged in
    if (managerAuthenticated) renderAvailabilityMatrix('all');
}

init();
</script>
