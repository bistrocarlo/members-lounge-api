    <style>
        :root {
            --primary: #00d4ff;
            --yellow: #ffd700;
            --orange: #ff6b00;
        }
        *{margin:0;padding:0;box-sizing:border-box;}
        body{background:#0f172a;font-family:'Inter',sans-serif;color:#e2e8f0;}
        .app{max-width:500px;margin:0 auto;background:#0f172a;min-height:100vh;box-shadow:0 0 30px rgba(0,212,255,0.15);}
        
        .header{
            background:linear-gradient(135deg,#1e2937,#0f172a);
            padding:16px 20px;
            text-align:center;
            border-bottom:2px solid var(--primary);
            position:relative;
        }
        .logo-icon{
            width:68px;height:68px;
            background:linear-gradient(135deg,var(--primary),#0099cc);
            border-radius:50%;

            margin:0 auto 8px;
            box-shadow:0 0 25px rgba(0,212,255,0.6);
            animation:pulse 2s infinite;
        }
        @keyframes pulse { 0%,100%{transform:scale(1);} 50%{transform:scale(1.08);} }
        
        .header h1{font-size:22px;font-weight:800;letter-spacing:-0.5px;}
        .user-row{background:rgba(255,255,255,0.1);padding:6px 14px;border-radius:50px;display:inline-flex;align-items:center;gap:8px;font-size:13px;margin-top:8px;}

        .top-nav{
            background:#1e2937;
            padding:12px 8px;
            display:flex;flex-wrap:wrap;justify-content:center;gap:6px;
            position:sticky;top:0;z-index:100;border-bottom:1px solid #334155;
        }
        .nav-module{
            background:#334155;
            border:none;padding:10px 14px;border-radius:50px;font-size:13px;font-weight:600;
            color:#cbd5e1;display:flex;align-items:center;gap:6px;
            transition:all 0.2s;
        }
        .nav-module.active{
            background:var(--primary);
            color:#0f172a;
            box-shadow:0 0 15px rgba(0,212,255,0.5);
        }

        .module-container{padding:16px;display:none;}
        .module-container.active-module{display:block;}

        .card{
            background:#1e2937;
            border-radius:24px;
            padding:20px;
            margin-bottom:16px;
            border:1px solid #334155;
            box-shadow:0 10px 15px -3px rgba(0,0,0,0.3);
        }
        .card h2{
            font-size:18px;font-weight:700;margin-bottom:16px;
            border-left:4px solid var(--primary);padding-left:12px;
        }

        .attendance-card{
            background:linear-gradient(135deg,#00d4ff,#0099cc);
            color:#0f172a;
            border-radius:28px;
            padding:28px 20px;
            text-align:center;
            margin-bottom:20px;
            box-shadow:0 0 30px rgba(0,212,255,0.4);
        }

        .btn-play-big{
            background:#22c55e;
            flex:1;padding:16px;
            border-radius:60px;
            font-weight:800;font-size:18px;
            border:none;color:white;
            box-shadow:0 8px 0 #16a34a;
        }
        .btn-sit-big{
            background:#ef4444;
            flex:1;padding:16px;
            border-radius:60px;
            font-weight:800;font-size:18px;
            border:none;color:white;
            box-shadow:0 8px 0 #dc2626;
        }

        .playing-list, .guest-section{
            background:#1e2937;
            border-radius:20px;
            padding:18px;
            margin-bottom:16px;
        }

        .attendee-tag{
            display:inline-flex;align-items:center;gap:8px;
            background:#334155;padding:8px 14px;
            border-radius:50px;font-size:14px;margin:4px 2px;
        }

        .toast{
            position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
            background:#22c55e;color:white;padding:12px 24px;
            border-radius:50px;font-weight:600;
            box-shadow:0 10px 15px rgba(0,0,0,0.3);
            z-index:9999;animation:toastPop 0.3s;
        }
        @keyframes toastPop{ from{transform:translate(-50%,50px);opacity:0;} to{transform:translateX(-50%);opacity:1;} }

        /* Confetti Canvas */
        #confetti-canvas{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:99999;}
    </style>
</head>

    function showToast(message, color = "#22c55e") {
        const toast = document.createElement('div');
        toast.className = 'toast';
        toast.style.background = color;
        toast.textContent = message;
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 2800);

    function launchConfetti() {
        const canvas = document.createElement('canvas');
        canvas.id = "confetti-canvas";
        document.body.appendChild(canvas);
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const colors = ['#00d4ff', '#ffd700', '#ff6b00', '#22c55e'];
        let particles = [];

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height - canvas.height;
                this.size = Math.random() * 12 + 6;
                this.speed = Math.random() * 6 + 4;
                this.color = colors[Math.floor(Math.random()*colors.length)];
                this.angle = Math.random() * 360;
            }
            update() {
                this.y += this.speed;
                this.angle += 5;
            }
            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.angle * Math.PI / 180);
                ctx.fillStyle = this.color;
                ctx.fillRect(-this.size/2, -this.size/2, this.size, this.size);
                ctx.restore();
            }
        }

        for(let i = 0; i < 150; i++) particles.push(new Particle());

        let frame = 0;
        function animate() {
            ctx.clearRect(0,0,canvas.width,canvas.height);
            particles.forEach((p,i) => {
                p.update();
                p.draw();
                if(p.y > canvas.height) particles.splice(i,1);
            });
            if(particles.length > 0 && frame < 180) {
                requestAnimationFrame(animate);
                frame++;
            } else {
                canvas.remove();
            }
        }
        animate();
    }
