<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Monday Night Soccer – Ultimate Hub 2026</title>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: linear-gradient(135deg, #f0f2f5 0%, #e0e5ec 100%); font-family: 'Inter', sans-serif; padding: 16px; min-height: 100vh; }
        .container { max-width: 1480px; margin: 0 auto; }
        .header { text-align: center; margin-bottom: 24px; background: #1a1a1a; border-radius: 60px; padding: 20px 32px; box-shadow: 0 10px 30px rgba(0,0,0,0.25); border-bottom: 5px solid #cc0000; position: relative; overflow: hidden; }
        .header h1 { font-family: 'Poppins', sans-serif; font-size: 2rem; font-weight: 800; background: linear-gradient(90deg, #ffffff, #ff6666, #ffffff); background-clip: text; -webkit-background-clip: text; color: transparent; }
        .header p { color: #aaa; font-size: 0.85rem; margin-top: 6px; }
        .tabs { display: flex; gap: 10px; justify-content: center; margin-bottom: 28px; flex-wrap: wrap; background: rgba(255,255,255,0.7); padding: 12px; border-radius: 60px; backdrop-filter: blur(4px); }
        .tab-btn { background: white; border: none; padding: 12px 24px; border-radius: 60px; font-weight: 700; cursor: pointer; color: #cc0000; font-size: 0.9rem; min-width: 110px; box-shadow: 0 5px 0 #999; transition: all 0.08s linear; font-family: 'Poppins', sans-serif; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .tab-btn.active { background: #cc0000; color: white; box-shadow: 0 5px 0 #8b0000; transform: translateY(2px); }
        .panel { display: none; animation: fadeIn 0.3s ease; }
        .panel.active-panel { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .card { background: white; border-radius: 28px; padding: 24px; margin-bottom: 24px; border: 1px solid rgba(0,0,0,0.05); box-shadow: 0 12px 30px -10px rgba(0,0,0,0.1); transition: all 0.2s; }
        .card h2, .card h3 { font-family: 'Poppins', sans-serif; font-weight: 700; margin-bottom: 18px; color: #1a1a1a; border-left: 5px solid #cc0000; padding-left: 16px; font-size: 1.3rem; }
        label { font-weight: 600; display: block; margin-top: 12px; margin-bottom: 6px; color: #333; font-size: 0.85rem; }
        select, input, button, textarea { padding: 12px 18px; border-radius: 60px; border: 2px solid #eee; font-size: 0.9rem; background: white; width: 100%; margin: 6px 0; font-family: 'Inter', sans-serif; }
        button { background: #cc0000; color: white; font-weight: 700; border: none; cursor: pointer; width: auto; min-width: 130px; padding: 12px 24px; box-shadow: 0 5px 0 #8b0000; transition: all 0.08s linear; }
        button:active { transform: translateY(3px); box-shadow: 0 2px 0 #8b0000; }
        .login-card { max-width: 420px; margin: 60px auto; background: white; border-radius: 48px; padding: 40px 32px; text-align: center; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25); }
        .pitch { background: linear-gradient(145deg, #2e7d32, #1b5e20); border-radius: 32px; border: 4px solid white; padding: 20px; position: relative; box-shadow: 0 0 0 5px #cc0000; min-height: 280px; }
        .pitch::before { content: ""; position: absolute; top: 0; left: 50%; width: 3px; height: 100%; background: white; transform: translateX(-50%); opacity: 0.6; }
        .pitch::after { content: ""; position: absolute; top: 50%; left: 50%; width: 70px; height: 70px; border: 2px solid white; border-radius: 50%; transform: translate(-50%, -50%); opacity: 0.4; }
        .teams-row { display: flex; flex-wrap: wrap; gap: 20px; position: relative; z-index: 2; }
        .team-box { flex: 1; background: rgba(0,0,0,0.7); backdrop-filter: blur(8px); border-radius: 24px; padding: 18px; color: white; }
        .team-title { font-size: 1.4rem; font-weight: 800; text-align: center; margin-bottom: 12px; font-family: 'Poppins', sans-serif; }
        .yellow-title { color: #ffea00; text-shadow: 1px 1px 0 #b45f00; }
        .orange-title { color: #ff9800; text-shadow: 1px 1px 0 #b45f00; }
        .player-list { display: flex; flex-direction: column; gap: 8px; max-height: 350px; overflow-y: auto; }
        .player-badge { background: rgba(255,255,255,0.15); border-radius: 60px; padding: 8px 14px; text-align: center; font-size: 0.85rem; font-weight: 500; }
        .flex-btns { display: flex; gap: 15px; flex-wrap: wrap; margin-top: 16px; justify-content: center; }
        .attending-in { background: #2e7d5e; box-shadow: 0 5px 0 #1a4a3a; }
        .attending-out { background: #cc0000; box-shadow: 0 5px 0 #8b0000; }
        .count-box { background: #2c3e50; color: white; border-radius: 24px; padding: 16px; text-align: center; box-shadow: 0 4px 0 #1a2a3a; }
        .count-number { font-size: 2rem; font-weight: 800; }
        .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; }
        .data-table { width: 100%; border-collapse: collapse; background: white; border-radius: 20px; overflow: hidden; margin-top: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.03); }
        .data-table th, .data-table td { padding: 12px 10px; text-align: left; border-bottom: 1px solid #f0f0f0; font-size: 0.85rem; }
        .data-table th { background: #fafafa; color: #cc0000; font-weight: 700; }
        .chat-container { background: #f5f5f5; border-radius: 24px; overflow: hidden; display: flex; flex-direction: column; height: 480px; }
        .chat-messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; background: #e5ddd5; }
        .chat-message { display: flex; flex-direction: column; max-width: 70%; }
        .chat-message.sent { align-self: flex-end; }
        .chat-message.received { align-self: flex-start; }
        .chat-bubble { padding: 10px 14px; border-radius: 18px; background: white; word-break: break-word; }
        .chat-message.sent .chat-bubble { background: #dcf8c5; border-bottom-right-radius: 4px; }
        .chat-message.received .chat-bubble { background: white; border-bottom-left-radius: 4px; }
        .chat-name { font-weight: 700; font-size: 0.75rem; margin-bottom: 4px; color: #cc0000; }
        .chat-time { font-size: 0.6rem; color: #888; margin-top: 4px; text-align: right; }
        .chat-footer { padding: 12px; background: white; display: flex; gap: 10px; align-items: center; }
        .chat-footer input { flex: 1; margin: 0; border-radius: 30px; }
        .chat-footer button { min-width: 80px; margin: 0; padding: 10px 20px; }
        .admin-tag { background: #cc0000; color: white; font-size: 0.6rem; border-radius: 12px; padding: 2px 8px; margin-left: 8px; display: inline-block; }
        .alert { background: #fff3cd; padding: 12px; border-radius: 20px; color: #856404; margin-top: 10px; }
        @media (max-width: 700px) { .teams-row { flex-direction: column; } .chat-message { max-width: 85%; } .tab-btn { padding: 8px 16px; min-width: 90px; font-size: 0.75rem; } }
        .goal-row { background: #f9f9f9; border-radius: 60px; padding: 8px 16px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
    </style>
</head>
<body>
<div class="container" id="appContainer"></div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyCWlFqDJyENgrUOhiLXCjSEi4Mk_54SA1w",
        authDomain: "monday-night-soccer-hub.firebaseapp.com",
        projectId: "monday-night-soccer-hub",
        storageBucket: "monday-night-soccer-hub.firebasestorage.app",
        messagingSenderId: "634335208908",
        appId: "1:634335208908:web:dca705b65fc52de0606969"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // Full player list (alphabetical)
    let players = [
        "Alex Rowe", "Ali Mekawy", "Carlo", "Charlie", "Chris Del Monaco", "Chris M", "Chris S", "Danny", "Dante", "David", "Dimitri",
        "Enzo", "Farid", "Faros", "Frank", "George B", "George T", "Ivan", "James Zoumis", "James", "Joe T", "Joey", "Kia", "Leo", 
        "Manoli", "Marco", "Mario", "Maurice", "Nector", "Paul", "Perri", "Peter", "Ralph", "Rocco", "Stav", "Stevan", "Theo", "Tony EH", "Vasilis"
    ].sort();

    let teamAssignments = {};
    let matchResults = {};
    let payments = [];
    let attendance = [];
    let isAdminLoggedIn = false;
    let currentUser = null;

    // Firestore references
    const playersRef = db.collection("config").doc("players");
    const teamsRef = db.collection("config").doc("teamAssignments");
    const resultsRef = db.collection("config").doc("matchResults");
    const paymentsRef = db.collection("payments");
    const attendanceRef = db.collection("attendance");
    const messagesRef = db.collection("messages");

    // Date utilities (AEST Monday weeks)
    function getCurrentAESTDate() {
        const now = new Date();
        const utc = now.getTime() + (now.getTimezoneOffset() * 60000);
        return new Date(utc + (10 * 3600000)).toISOString().split('T')[0];
    }
    function generateAllGameWeeks() {
        const year = new Date().getFullYear();
        let start = new Date(year, 0, 1);
        while (start.getDay() !== 1) start.setDate(start.getDate() + 1);
        let end = new Date(year, 11, 31);
        let lastMonday = new Date(end);
        while (lastMonday.getDay() !== 1) lastMonday.setDate(lastMonday.getDate() - 1);
        let secondLast = new Date(lastMonday);
        secondLast.setDate(secondLast.getDate() - 7);
        let weeks = [], cur = new Date(start);
        while (cur <= secondLast) {
            weeks.push({ dateStr: cur.toISOString().split('T')[0], label: `Monday ${cur.toLocaleDateString('en-AU', { day:'numeric', month:'short' })}` });
            cur.setDate(cur.getDate() + 7);
        }
        return weeks;
    }
    const ALL_GAME_WEEKS = generateAllGameWeeks();
    function getFutureWeeks() { return ALL_GAME_WEEKS.filter(w => w.dateStr >= getCurrentAESTDate()); }
    function getPastWeeks() { return ALL_GAME_WEEKS.filter(w => w.dateStr < getCurrentAESTDate()).reverse(); }

    async function loadPlayers() { const doc = await playersRef.get(); if (doc.exists && doc.data().list) players = doc.data().list.sort(); else await playersRef.set({ list: players }); }
    async function savePlayers() { await playersRef.set({ list: players }); }
    async function loadData() {
        await loadPlayers();
        const teamsDoc = await teamsRef.get(); teamAssignments = teamsDoc.exists ? teamsDoc.data() : {};
        const resultsDoc = await resultsRef.get(); matchResults = resultsDoc.exists ? resultsDoc.data() : {};
        const paymentsSnap = await paymentsRef.get(); payments = []; paymentsSnap.forEach(doc => payments.push(doc.data()));
        const attendanceSnap = await attendanceRef.get(); attendance = []; attendanceSnap.forEach(doc => attendance.push(doc.data()));
    }
    async function saveTeams() { await teamsRef.set(teamAssignments); }
    async function saveResults() { await resultsRef.set(matchResults); }
    async function savePayment(p) { await paymentsRef.doc(`${p.player}_${p.gameDate}`).set(p); }
    async function saveAttendance(a) { await attendanceRef.doc(`${a.player}_${a.gameDate}`).set(a); }

    function loginAsPlayer(name) { currentUser = { name, role: "player" }; isAdminLoggedIn = false; localStorage.setItem("soccer_user", JSON.stringify(currentUser)); renderMainApp(); }
    function adminLogin(password) { if (password === "admin123") { currentUser = { name: "admin", role: "admin" }; isAdminLoggedIn = true; localStorage.setItem("soccer_user", JSON.stringify(currentUser)); renderMainApp(); return true; } return false; }
    function logout() { currentUser = null; isAdminLoggedIn = false; localStorage.removeItem("soccer_user"); renderLoginScreen(); }

    async function renderLoginScreen() {
        await loadData();
        document.getElementById("appContainer").innerHTML = `
            <div class="login-card">
                <h1 style="font-size:3rem;">⚽</h1>
                <h2 style="font-family:'Poppins'; color:#cc0000; margin-bottom:20px;">MONDAY NIGHT SOCCER</h2>
                <p style="margin-bottom:24px;">Select your name or login as admin</p>
                <label>👤 YOUR NAME</label>
                <select id="playerNameSelect"><option value="">-- Select your name --</option>${players.map(p => `<option value="${escapeHtml(p)}">${escapeHtml(p)}</option>`).join('')}</select>
                <button id="playerLoginBtn">Enter as Player</button>
                <hr style="margin: 24px 0;">
                <label>🔐 ADMIN LOGIN</label>
                <input type="password" id="adminPassword" placeholder="Admin password">
                <button id="adminLoginBtn">Admin Login</button>
                <div id="loginError" style="display:none; margin-top:16px; color:#cc0000;"></div>
            </div>
        `;
        document.getElementById("playerLoginBtn").onclick = () => { const name = document.getElementById("playerNameSelect").value; if (!name) { showError("Select your name"); return; } loginAsPlayer(name); };
        document.getElementById("adminLoginBtn").onclick = () => { const ok = adminLogin(document.getElementById("adminPassword").value); if (!ok) showError("Wrong admin password"); };
        function showError(msg) { const errDiv = document.getElementById("loginError"); errDiv.innerText = msg; errDiv.style.display = "block"; setTimeout(()=>errDiv.style.display="none",2000); }
    }

    async function renderMainApp() {
        await loadData();
        const container = document.getElementById("appContainer");
        container.innerHTML = `
            <div class="header"><h1>⚽ MONDAY NIGHT SOCCER ⚽</h1><p>${currentUser.role === "admin" ? "ADMIN MODE" : "Player: " + currentUser.name}</p><button id="logoutBtn" style="margin-top:10px; background:#444; padding:6px 18px; min-width:auto;">Logout</button></div>
            <div class="tabs" id="tabs"></div><div id="panelContainer"></div>
            <footer style="text-align:center; margin-top:40px; font-size:0.7rem; color:#777;">⚡ Live sync via Firebase • Monday Night Hub</footer>
        `;
        document.getElementById("logoutBtn").onclick = logout;
        const tabs = [
            { id: "attendance", label: "📋 ATTENDANCE" }, { id: "teams", label: "🏟️ TEAMS" }, 
            { id: "chat", label: "💬 CHAT" }, { id: "topscorer", label: "⚽ TOP SCORER" }, 
            { id: "pastgames", label: "📆 PAST GAMES" }, { id: "rules", label: "📜 RULES" }
        ];
        if (isAdminLoggedIn) tabs.push({ id: "admin", label: "👑 ADMIN" });
        document.getElementById("tabs").innerHTML = tabs.map(t => `<button class="tab-btn" data-tab="${t.id}">${t.label}</button>`).join('');
        document.getElementById("panelContainer").innerHTML = tabs.map(t => `<div id="${t.id}Panel" class="panel"></div>`).join('');
        document.getElementById("attendancePanel").classList.add("active-panel");
        if(document.querySelector(".tab-btn")) document.querySelector(".tab-btn").classList.add("active");
        renderAttendancePanel(); renderTeamsPanel(); renderChatPanel(); renderTopScorerPanel(); renderPastGamesPanel(); renderRulesPanel();
        if (isAdminLoggedIn) renderAdminPanel();
        document.querySelectorAll(".tab-btn").forEach(btn => {
            btn.onclick = () => {
                document.querySelectorAll(".panel").forEach(p => p.classList.remove("active-panel"));
                document.getElementById(`${btn.dataset.tab}Panel`).classList.add("active-panel");
                document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
                btn.classList.add("active");
                if (btn.dataset.tab === "attendance") renderAttendancePanel();
                if (btn.dataset.tab === "teams") renderTeamsPanel();
                if (btn.dataset.tab === "chat") renderChatPanel();
                if (btn.dataset.tab === "topscorer") renderTopScorerPanel();
                if (btn.dataset.tab === "pastgames") renderPastGamesPanel();
                if (btn.dataset.tab === "admin") renderAdminPanel();
            };
        });
    }

    function renderAttendancePanel() {
        const weeks = getFutureWeeks();
        if (!weeks.length) { document.getElementById("attendancePanel").innerHTML = `<div class="card"><div class="alert">No upcoming weeks available.</div></div>`; return; }
        document.getElementById("attendancePanel").innerHTML = `
            <div class="card"><h2>📅 MARK YOUR ATTENDANCE</h2><label>📅 GAME WEEK</label><select id="attWeekSelect">${weeks.map(w => `<option value="${w.dateStr}">${w.label}</option>`).join('')}</select>
            <label>👤 YOUR NAME</label><select id="attPlayerSelect"></select><div class="flex-btns"><button id="attendingBtn" class="attending-in">✅ I AM ATTENDING</button><button id="notAttendingBtn" class="attending-out">❌ I AM NOT ATTENDING</button></div><div id="attMsg" style="margin-top:12px; display:none;"></div></div>
            <div class="card"><h2>📊 ATTENDANCE COUNTS</h2><div id="attCounts" class="stat-grid"></div></div>
            <div class="card"><h2>🏟️ THIS WEEK'S PITCH & TEAMS</h2><select id="pitchWeekSelect">${weeks.map(w => `<option value="${w.dateStr}">${w.label}</option>`).join('')}</select>
            <div class="pitch"><div class="teams-row"><div class="team-box"><div class="team-title yellow-title">🟡 YELLOW</div><div class="player-list" id="yellowList"></div></div><div class="team-box"><div class="team-title orange-title">🟠 ORANGE</div><div class="player-list" id="orangeList"></div></div></div></div>
            <div id="matchResultDisplay" style="margin-top:16px; text-align:center; font-weight:600;"></div></div>
        `;
        document.getElementById("attPlayerSelect").innerHTML = '<option value="">-- Select your name --</option>' + players.map(p => `<option value="${escapeHtml(p)}">${escapeHtml(p)}</option>`).join('');
        document.getElementById("attWeekSelect").onchange = renderAttendanceCounts;
        document.getElementById("attendingBtn").onclick = () => setAttendance("in");
        document.getElementById("notAttendingBtn").onclick = () => setAttendance("out");
        document.getElementById("pitchWeekSelect").onchange = renderPitchAndMatch;
        renderAttendanceCounts(); renderPitchAndMatch();
    }

    async function setAttendance(status) {
        const player = document.getElementById("attPlayerSelect").value;
        const gameDate = document.getElementById("attWeekSelect").value;
        const msgDiv = document.getElementById("attMsg");
        if (!player || !gameDate) { msgDiv.innerHTML = "Select name and week"; msgDiv.style.display = "block"; setTimeout(() => msgDiv.style.display = "none", 2000); return; }
        await saveAttendance({ player, gameDate, status, timestamp: new Date().toISOString() });
        const idx = attendance.findIndex(a => a.player === player && a.gameDate === gameDate);
        if (idx !== -1) attendance[idx] = { player, gameDate, status };
        else attendance.push({ player, gameDate, status });
        msgDiv.innerHTML = `✅ ${player} marked as ${status === 'in' ? 'attending' : 'NOT attending'}`;
        msgDiv.style.display = "block";
        setTimeout(() => msgDiv.style.display = "none", 2000);
        renderAttendanceCounts();
        if (isAdminLoggedIn) { renderAdminAttendanceOverview(); renderTeamAssignmentUI(); }
    }

    async function renderAttendanceCounts() {
        const week = document.getElementById("attWeekSelect").value;
        if (!week) return;
        const attending = attendance.filter(a => a.gameDate === week && a.status === 'in').map(a => a.player);
        const notAttending = attendance.filter(a => a.gameDate === week && a.status === 'out').map(a => a.player);
        document.getElementById("attCounts").innerHTML = `
            <div class="count-box"><div>Attending</div><div class="count-number">${attending.length}</div><div>${attending.join(', ') || 'none'}</div></div>
            <div class="count-box" style="background:#cc0000;"><div>Not attending</div><div class="count-number">${notAttending.length}</div><div>${notAttending.join(', ') || 'none'}</div></div>
        `;
    }

    async function renderPitchAndMatch() {
        const gameDate = document.getElementById("pitchWeekSelect")?.value;
        if(!gameDate) return;
        const assignments = teamAssignments[gameDate] || {};
        const yellow = Object.keys(assignments).filter(p => assignments[p] === "yellow").sort();
        const orange = Object.keys(assignments).filter(p => assignments[p] === "orange").sort();
        const match = matchResults[gameDate] || { yellowScore: 0, orangeScore: 0, goals: {} };
        const goalsText = Object.entries(match.goals || {}).filter(([_,g]) => g>0).map(([p,g]) => `${p} (${g})`).join(", ");
        document.getElementById("yellowList").innerHTML = yellow.map(p => `<div class="player-badge">${escapeHtml(p)}</div>`).join('') || "<div class='player-badge'>—</div>";
        document.getElementById("orangeList").innerHTML = orange.map(p => `<div class="player-badge">${escapeHtml(p)}</div>`).join('') || "<div class='player-badge'>—</div>";
        document.getElementById("matchResultDisplay").innerHTML = `<strong>SCORE:</strong> 🟡 ${match.yellowScore} - ${match.orangeScore} 🟠 &nbsp;|&nbsp; ⚽ Goals: ${goalsText || "none"}`;
    }

    function renderTeamsPanel() {
        const weeks = getFutureWeeks();
        if (!weeks.length) { document.getElementById("teamsPanel").innerHTML = `<div class="card"><div class="alert">No upcoming weeks.</div></div>`; return; }
        document.getElementById("teamsPanel").innerHTML = `<div class="card"><h2>🏟️ TEAM LINEUPS</h2><label>Select week</label><select id="teamsWeekSelect">${weeks.map(w => `<option value="${w.dateStr}">${w.label}</option>`).join('')}</select><div class="pitch" style="margin-top:20px;"><div class="teams-row"><div class="team-box"><div class="team-title yellow-title">🟡 YELLOW</div><div class="player-list" id="teamsYellowList"></div></div><div class="team-box"><div class="team-title orange-title">🟠 ORANGE</div><div class="player-list" id="teamsOrangeList"></div></div></div></div></div>`;
        document.getElementById("teamsWeekSelect").onchange = renderTeamsLineup;
        renderTeamsLineup();
    }

    async function renderTeamsLineup() {
        const gameDate = document.getElementById("teamsWeekSelect").value;
        const assignments = teamAssignments[gameDate] || {};
        const yellow = Object.keys(assignments).filter(p => assignments[p] === "yellow").sort();
        const orange = Object.keys(assignments).filter(p => assignments[p] === "orange").sort();
        document.getElementById("teamsYellowList").innerHTML = yellow.map(p => `<div class="player-badge">${escapeHtml(p)}</div>`).join('') || "<div class='player-badge'>—</div>";
        document.getElementById("teamsOrangeList").innerHTML = orange.map(p => `<div class="player-badge">${escapeHtml(p)}</div>`).join('') || "<div class='player-badge'>—</div>";
    }

    function renderChatPanel() {
        document.getElementById("chatPanel").innerHTML = `<div class="card"><h2>💬 LIVE CHAT</h2><div class="chat-container"><div id="chatMessages" class="chat-messages">Loading...</div><div class="chat-footer"><input type="text" id="chatInput" placeholder="Type a message..."><button id="sendChatBtn">Send</button></div></div></div>`;
        document.getElementById("sendChatBtn").onclick = sendChatMessage;
        document.getElementById("chatInput").addEventListener("keypress", (e) => { if(e.key === "Enter") sendChatMessage(); });
        listenForMessages();
    }
    async function sendChatMessage() { const message = document.getElementById("chatInput").value.trim(); if (!message) return; await messagesRef.add({ name: currentUser.name, message: message, isAdmin: currentUser.role === "admin", timestamp: firebase.firestore.FieldValue.serverTimestamp() }); document.getElementById("chatInput").value = ""; }
    function listenForMessages() {
        messagesRef.orderBy("timestamp", "asc").onSnapshot(snapshot => {
            const container = document.getElementById("chatMessages"); if (!container) return;
            let html = "";
            snapshot.forEach(doc => { const d = doc.data(); const time = d.timestamp ? d.timestamp.toDate().toLocaleTimeString([], { hour:'2-digit', minute:'2-digit' }) : ""; const isSent = d.name === currentUser.name; const displayName = d.isAdmin ? `${d.name} <span class="admin-tag">ADMIN</span>` : d.name;
                html += `<div class="chat-message ${isSent ? 'sent' : 'received'}"><div class="chat-bubble"><div class="chat-name">${escapeHtml(displayName)}</div><div>${escapeHtml(d.message)}</div><div class="chat-time">${time}</div></div></div>`;
            });

    }

    async function renderTopScorerPanel() {
        const goals = new Map();
        for (let match of Object.values(matchResults)) if (match.goals) for (let [player, goalCount] of Object.entries(match.goals)) goals.set(player, (goals.get(player) || 0) + goalCount);
        let sorted = Array.from(goals.entries()).map(([name, total]) => ({ name, total })).sort((a,b) => b.total - a.total);
        if (!sorted.length) { document.getElementById("topscorerPanel").innerHTML = `<div class="card"><div class="alert">No goals recorded yet.</div></div>`; return; }
        let html = `<div class="card"><h2>⚽ TOP GOAL SCORERS</h2><table class="data-table"><thead><tr><th>#</th><th>Player</th><th>Goals</th></tr></thead><tbody>`;
        sorted.forEach((p, i) => html += `<tr><td style="color:#cc0000;">${i+1}</td><td>${escapeHtml(p.name)}</td><td>${p.total}</td></tr>`);
        html += `</tbody></table></div>`; document.getElementById("topscorerPanel").innerHTML = html;
    }

    async function renderPastGamesPanel() {
        const pastWeeks = getPastWeeks();
        if (!pastWeeks.length) { document.getElementById("pastgamesPanel").innerHTML = `<div class="card"><div class="alert">No past games yet.</div></div>`; return; }
        let html = `<div class="card"><h2>📆 PAST GAMES</h2><table class="data-table"><thead><tr><th>Week</th><th>🟡 Yellow Team</th><th>🟠 Orange Team</th><th>Result</th><th>Goal Scorers</th></tr></thead><tbody>`;
        for (let week of pastWeeks) {
            const assignments = teamAssignments[week.dateStr] || {}; const yellow = Object.keys(assignments).filter(p => assignments[p] === "yellow").sort(); const orange = Object.keys(assignments).filter(p => assignments[p] === "orange").sort();
            const match = matchResults[week.dateStr] || { yellowScore: 0, orangeScore: 0, goals: {} };
            const goalsText = Object.entries(match.goals || {}).filter(([_,g]) => g>0).map(([p,g]) => `${p} (${g})`).join(", ");
            html += `<tr><td><strong>${week.label}</strong></td><td>${yellow.join(', ') || '—'}</td><td>${orange.join(', ') || '—'}</td><td>🟡 ${match.yellowScore} - ${match.orangeScore} 🟠</td><td>${goalsText || '—'}</td></tr>`;
        }
        html += `</tbody></table></div>`; document.getElementById("pastgamesPanel").innerHTML = html;
    }
