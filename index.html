<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Portal - Backend CSV Ready</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; }
        .section { display: none; }
        .section.active { display: block; }
        .booking-card { transition: all 0.2s; }
        .booking-card:hover { transform: translateY(-2px); box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1); }
    </style>
</head>
<body class="bg-gray-50">
    <!-- Login Screen -->
    <div id="login-screen" class="min-h-screen flex items-center justify-center bg-gray-900">
        <div class="bg-white p-8 rounded-xl shadow-2xl w-full max-w-md">
            <div class="text-center mb-8">
                <i class="fas fa-shield-alt text-4xl text-blue-600 mb-4"></i>
                <h1 class="text-3xl font-bold text-gray-900">Staff Portal</h1>
                <p class="text-gray-600 mt-2">Secure access only</p>
            </div>
            
            <form id="login-form" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                    <input type="email" id="login-email" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="your@email.com" required>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                    <input type="password" id="login-password" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="••••••••" required>
                </div>
                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-3 rounded-lg font-medium transition flex items-center justify-center">
                    <span id="login-btn-text">Sign In</span>
                </button>
            </form>
            
            <div class="mt-6 text-center text-xs text-gray-500">
                Demo mode: Use any email + password "demo123" for testing.<br>
                Replace with Firebase Auth in production.
            </div>
        </div>
    </div>

    <!-- Main App -->
    <div id="app-screen" class="hidden min-h-screen">
        <nav class="bg-white border-b shadow-sm">
            <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <i class="fas fa-shield-alt text-blue-600 text-2xl"></i>
                    <div>
                        <h1 class="font-bold text-xl">Staff Portal</h1>
                        <p id="user-info" class="text-sm text-gray-600"></p>
                    </div>
                </div>
                
                <div class="flex items-center gap-4">
                    <div class="px-3 py-1 bg-green-100 text-green-800 rounded-full text-sm flex items-center gap-2">
                        <i class="fas fa-circle text-green-500"></i>
                        <span>Secure Session</span>
                    </div>
                    <button onclick="logout()" class="px-4 py-2 text-red-600 hover:bg-red-50 rounded-lg flex items-center gap-2">
                        <i class="fas fa-sign-out-alt"></i>
                        <span>Logout</span>
                    </button>
                </div>
            </div>
        </nav>

        <div class="max-w-7xl mx-auto px-6 pt-6">
            <div class="flex border-b">
                <button onclick="showSection('bookings')" class="tab-btn px-6 py-3 font-medium border-b-2 border-blue-600 text-blue-600" data-section="bookings">Bookings</button>
                <button onclick="showSection('notices')" class="tab-btn px-6 py-3 font-medium text-gray-600 hover:text-gray-900" data-section="notices">Notices</button>
                <button onclick="showSection('chat')" class="tab-btn px-6 py-3 font-medium text-gray-600 hover:text-gray-900" data-section="chat">Staff Chat</button>
            </div>
        </div>

        <!-- Bookings Section -->
        <div id="bookings" class="section active max-w-7xl mx-auto px-6 py-8">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-2xl font-bold">Bookings</h2>
                <div class="flex gap-3">
                    <button onclick="showAddBookingModal()" class="px-4 py-2 bg-blue-600 text-white rounded-lg flex items-center gap-2 hover:bg-blue-700">
                        <i class="fas fa-plus"></i> Add Booking
                    </button>
                    <button onclick="loadCSVFromBackend()" class="px-4 py-2 border border-gray-300 rounded-lg flex items-center gap-2 hover:bg-gray-50">
                        <i class="fas fa-cloud-download-alt"></i> Load CSV from Backend
                    </button>
                    <button onclick="importCSV()" class="px-4 py-2 border border-gray-300 rounded-lg flex items-center gap-2 hover:bg-gray-50">
                        <i class="fas fa-file-csv"></i> Import Local CSV
                    </button>
                </div>
            </div>

            <div id="bookings-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                <!-- Bookings populated by JS -->
            </div>
        </div>

        <!-- Notices Section -->
        <div id="notices" class="section max-w-7xl mx-auto px-6 py-8">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-2xl font-bold">Notices</h2>
                <button onclick="addNotice()" class="px-4 py-2 bg-blue-600 text-white rounded-lg flex items-center gap-2">
                    <i class="fas fa-plus"></i> Add Notice
                </button>
            </div>
            <div id="notices-list" class="space-y-4"></div>
        </div>

        <!-- Chat Section -->
        <div id="chat" class="section max-w-7xl mx-auto px-6 py-8">
            <h2 class="text-2xl font-bold mb-6">Staff Chat</h2>
            <div id="chat-messages" class="bg-white border rounded-xl p-4 h-96 overflow-y-auto mb-4"></div>
            <div class="flex gap-2">
                <input id="chat-input" type="text" class="flex-1 border rounded-lg px-4 py-2" placeholder="Type a message...">
                <button onclick="sendChatMessage()" class="px-6 py-2 bg-blue-600 text-white rounded-lg">Send</button>
            </div>
        </div>
    </div>

    <!-- Booking Modal -->
    <div id="booking-modal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center">
        <div class="bg-white rounded-xl p-6 w-full max-w-md">
            <h3 id="modal-title" class="text-xl font-bold mb-4">Add Booking</h3>
            <form id="booking-form" class="space-y-4">
                <input type="hidden" id="booking-id">
                <div class="grid grid-cols-2 gap-4">
                    <div><label class="text-sm">Room</label><input type="text" id="room-name" class="w-full border rounded px-3 py-2" required></div>
                    <div><label class="text-sm">Date</label><input type="date" id="event-date" class="w-full border rounded px-3 py-2" required></div>
                </div>
                <div><label class="text-sm">Customer Name</label><input type="text" id="customer-name" class="w-full border rounded px-3 py-2" maxlength="80" required></div>
                <div class="grid grid-cols-2 gap-4">
                    <div><label class="text-sm">Email</label><input type="email" id="customer-email" class="w-full border rounded px-3 py-2" maxlength="120"></div>
                    <div><label class="text-sm">Mobile</label><input type="tel" id="customer-mobile" class="w-full border rounded px-3 py-2" maxlength="30"></div>
                </div>
                <div class="grid grid-cols-3 gap-4">
                    <div><label class="text-sm">Tickets</label><input type="number" id="ticket-count" class="w-full border rounded px-3 py-2" min="1" max="100" value="1"></div>
                    <div><label class="text-sm">Time</label><input type="text" id="event-time" class="w-full border rounded px-3 py-2" maxlength="30"></div>
                    <div><label class="text-sm">Seat</label><input type="text" id="seat" class="w-full border rounded px-3 py-2" maxlength="30"></div>
                </div>
                <div><label class="text-sm">Notes</label><textarea id="notes" class="w-full border rounded px-3 py-2" maxlength="300" rows="2"></textarea></div>
                
                <div class="flex gap-3 pt-2">
                    <button type="button" onclick="closeBookingModal()" class="flex-1 py-2 border rounded-lg">Cancel</button>
                    <button type="submit" class="flex-1 py-2 bg-blue-600 text-white rounded-lg">Save Booking</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        let bookings = [];
        let notices = [];
        let chatMessages = [];
        let currentUser = null;

        function showSection(section) {
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.getElementById(section).classList.add('active');
            
            document.querySelectorAll('.tab-btn').forEach(b => {
                b.classList.remove('border-b-2', 'border-blue-600', 'text-blue-600');
                if (b.dataset.section === section) {
                    b.classList.add('border-b-2', 'border-blue-600', 'text-blue-600');
                }
            });
            
            if (section === 'bookings') renderBookings();
            if (section === 'notices') renderNotices();
            if (section === 'chat') renderChat();
        }

        function login(e) {
            e.preventDefault();
            const email = document.getElementById('login-email').value.trim();
            const password = document.getElementById('login-password').value;
            
            if (!email || !password) {
                alert('Please enter both email and password.');
                return;
            }
            
            if (password !== 'demo123') {
                alert('Invalid credentials (demo: use password "demo123")');
                return;
            }
            
            currentUser = { 
                email: email, 
                name: email.split('@')[0], 
                role: email.includes('admin') ? 'admin' : 'staff' 
            };
            
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('app-screen').classList.remove('hidden');
            document.getElementById('user-info').innerHTML = `${currentUser.name} <span class="text-xs px-2 py-0.5 bg-gray-200 rounded">${currentUser.role}</span>`;
            
            // Auto-load backend CSV after login
            setTimeout(() => {
                loadCSVFromBackend(true);
            }, 500);
        }

        function logout() {
            currentUser = null;
            document.getElementById('app-screen').classList.add('hidden');
            document.getElementById('login-screen').classList.remove('hidden');
            document.getElementById('login-form').reset();
        }

        function sanitize(str) {
            return String(str || '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
        }

        function renderBookings() {
            const container = document.getElementById('bookings-list');
            container.innerHTML = '';
            
            if (bookings.length === 0) {
                container.innerHTML = '<p class="text-gray-500 col-span-full">No bookings yet. Load from backend or add manually.</p>';
                return;
            }
            
            bookings.forEach(booking => {
                const card = document.createElement('div');
                card.className = 'booking-card bg-white border rounded-xl p-5';
                card.innerHTML = `
                    <div class="flex justify-between items-start mb-3">
                        <div>
                            <div class="font-semibold">${sanitize(booking.roomName)}</div>
                            <div class="text-sm text-gray-600">${sanitize(booking.customerName)}</div>
                        </div>
                        <div class="text-right">
                            <div class="text-sm font-medium">${booking.eventDate}</div>
                            <div class="text-xs text-gray-500">${booking.eventTime || ''}</div>
                        </div>
                    </div>
                    <div class="text-sm space-y-1 text-gray-700">
                        <div><i class="fas fa-ticket-alt w-4"></i> ${booking.ticketCount} tickets • Seat: ${sanitize(booking.seat || '—')}</div>
                        ${booking.customerEmail ? `<div><i class="fas fa-envelope w-4"></i> ${sanitize(booking.customerEmail)}</div>` : ''}
                        ${booking.notes ? `<div class="text-xs text-gray-500 mt-2">${sanitize(booking.notes)}</div>` : ''}
                    </div>
                    <div class="flex gap-2 mt-4">
                        <button onclick="editBooking(${booking.id})" class="flex-1 text-sm py-1.5 border rounded hover:bg-gray-50">Edit</button>
                        <button onclick="deleteBooking(${booking.id})" class="flex-1 text-sm py-1.5 text-red-600 border border-red-200 rounded hover:bg-red-50">Delete</button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function showAddBookingModal() {
            document.getElementById('booking-modal').classList.remove('hidden');
            document.getElementById('modal-title').textContent = 'Add Booking';
            document.getElementById('booking-form').reset();
            document.getElementById('booking-id').value = '';
        }

        function editBooking(id) {
            const booking = bookings.find(b => b.id === id);
            if (!booking) return;
            
            document.getElementById('booking-modal').classList.remove('hidden');
            document.getElementById('modal-title').textContent = 'Edit Booking';
            document.getElementById('booking-id').value = id;
            document.getElementById('room-name').value = booking.roomName || '';
            document.getElementById('event-date').value = booking.eventDate || '';
            document.getElementById('customer-name').value = booking.customerName || '';
            document.getElementById('customer-email').value = booking.customerEmail || '';
            document.getElementById('customer-mobile').value = booking.customerMobile || '';
            document.getElementById('event-time').value = booking.eventTime || '';
            document.getElementById('ticket-count').value = booking.ticketCount || 1;
            document.getElementById('seat').value = booking.seat || '';
            document.getElementById('notes').value = booking.notes || '';
        }

        function closeBookingModal() {
            document.getElementById('booking-modal').classList.add('hidden');
        }

        document.getElementById('booking-form').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const id = document.getElementById('booking-id').value;
            const data = {
                roomName: document.getElementById('room-name').value.trim(),
                eventDate: document.getElementById('event-date').value,
                customerName: document.getElementById('customer-name').value.trim(),
                customerEmail: document.getElementById('customer-email').value.trim(),
                customerMobile: document.getElementById('customer-mobile').value.trim(),
                eventTime: document.getElementById('event-time').value.trim(),
                ticketCount: parseInt(document.getElementById('ticket-count').value) || 1,
                seat: document.getElementById('seat').value.trim(),
                notes: document.getElementById('notes').value.trim()
            };
            
            if (!data.roomName || !data.eventDate || !data.customerName) {
                alert('Room, Date, and Customer Name are required.');
                return;
            }
            if (data.ticketCount < 1 || data.ticketCount > 100) {
                alert('Ticket count must be between 1 and 100.');
                return;
            }
            
            if (id) {
                const index = bookings.findIndex(b => b.id == id);
                bookings[index] = { ...bookings[index], ...data };
            } else {
                data.id = Date.now();
                bookings.push(data);
            }
            
            closeBookingModal();
            renderBookings();
        });

        function deleteBooking(id) {
            if (!confirm('Delete this booking?')) return;
            bookings = bookings.filter(b => b.id !== id);
            renderBookings();
        }

        // Load CSV from your backend (Firebase Storage / Firestore path)
        async function loadCSVFromBackend(silent = false) {
            // Replace this URL with your actual backend CSV endpoint or Firebase Storage URL
            const backendCsvUrl = 'https://your-backend.com/data/bookings.csv'; // ← UPDATE THIS
            
            try {
                const response = await fetch(backendCsvUrl);
                if (!response.ok) throw new Error('Backend CSV not found or inaccessible');
                
                const csvText = await response.text();
                const lines = csvText.split(/\r?\n/);
                let imported = 0;
                
                for (let i = 1; i < lines.length; i++) {
                    if (!lines[i].trim()) continue;
                    const cols = lines[i].split(',').map(c => c.trim());
                    if (cols.length < 3) continue;
                    
                    // Parse ticket count from "Order items" (e.g., "20 x Bistroteca...")
                    let ticketCount = 1;
                    const orderItems = cols[5] || '';
                    const match = orderItems.match(/(\d+)\s*x/);
                    if (match) ticketCount = parseInt(match[1]);
                    
                    const booking = {
                        id: Date.now() + i,
                        roomName: cols[7] || cols[6] || 'Unknown Venue', // Event name
                        customerName: (cols[10] + ' ' + cols[12]).trim() || cols[9], // Name
                        eventDate: cols[8] ? cols[8].split(' ')[0] : cols[4], // Event start or Order date
                        ticketCount: ticketCount,
                        eventTime: cols[8] ? cols[8].split(' ').slice(1).join(' ') : '',
                        seat: '',
                        customerEmail: cols[13] || '',
                        notes: (cols[17] || '') + ' ' + (cols[18] || '') + ' ' + (cols[19] || '')
                    };
                    
                    if (booking.roomName && booking.customerName && booking.eventDate) {
                        const exists = bookings.some(b => 
                            b.roomName === booking.roomName && 
                            b.customerName === booking.customerName && 
                            b.eventDate === booking.eventDate
                        );
                        if (!exists) {
                            bookings.push(booking);
                            imported++;
                        }
                    }
                }
                
                if (!silent) alert(`${imported} bookings loaded from backend CSV.`);
                renderBookings();
            } catch (error) {
                if (!silent) {
                    alert('Could not load CSV from backend. Make sure the file is accessible and the URL is correct.');
                    console.error(error);
                }
            }
        }

        function importCSV() {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = '.csv';
            input.onchange = function() {
                const file = this.files[0];
                if (!file) return;
                if (file.size > 2 * 1024 * 1024) {
                    alert('File too large (max 2MB)');
                    return;
                }
                const reader = new FileReader();
                reader.onload = function(ev) {
                    const lines = ev.target.result.split(/\r?\n/);
                    let imported = 0;
                    for (let i = 1; i < lines.length; i++) {
                        if (!lines[i].trim()) continue;
                        const cols = lines[i].split(',').map(c => c.trim());
                        if (cols.length < 3) continue;
                        
                        let ticketCount = 1;
                        const orderItems = cols[5] || '';
                        const match = orderItems.match(/(\d+)\s*x/);
                        if (match) ticketCount = parseInt(match[1]);
                        
                        const booking = {
                            id: Date.now() + i,
                            roomName: cols[7] || cols[6] || 'Unknown Venue',
                            customerName: (cols[10] + ' ' + cols[12]).trim() || cols[9],
                            eventDate: cols[8] ? cols[8].split(' ')[0] : cols[4],
                            ticketCount: ticketCount,
                            eventTime: cols[8] ? cols[8].split(' ').slice(1).join(' ') : '',
                            seat: '',
                            customerEmail: cols[13] || '',
                            notes: (cols[17] || '') + ' ' + (cols[18] || '') + ' ' + (cols[19] || '')
                        };
                        
                        if (booking.roomName && booking.customerName && booking.eventDate) {
                            const exists = bookings.some(b => 
                                b.roomName === booking.roomName && 
                                b.customerName === booking.customerName && 
                                b.eventDate === booking.eventDate
                            );
                            if (!exists) {
                                bookings.push(booking);
                                imported++;
                            }
                        }
                    }
                    alert(`${imported} bookings imported successfully.`);
                    renderBookings();
                };
                reader.readAsText(file);
            };
            input.click();
        }

        function renderNotices() {
            const container = document.getElementById('notices-list');
            container.innerHTML = '';
            if (notices.length === 0) {
                container.innerHTML = '<p class="text-gray-500">No notices yet.</p>';
                return;
            }
            notices.forEach(notice => {
                const div = document.createElement('div');
                div.className = 'bg-white border rounded-xl p-5';
                div.innerHTML = `
                    <div class="font-medium">${sanitize(notice.title)}</div>
                    <div class="text-sm text-gray-600 mt-1">${sanitize(notice.content)}</div>
                    <div class="text-xs text-gray-400 mt-2">${notice.date}</div>
                `;
                container.appendChild(div);
            });
        }

        function addNotice() {
            const title = prompt('Notice title:');
            if (!title) return;
            const content = prompt('Notice content:');
            notices.unshift({ 
                title: title.trim(), 
                content: content ? content.trim() : '', 
                date: new Date().toLocaleDateString() 
            });
            renderNotices();
        }

        function renderChat() {
            const container = document.getElementById('chat-messages');
            container.innerHTML = '';
            chatMessages.forEach(msg => {
                const div = document.createElement('div');
                div.className = 'mb-3 p-3 bg-gray-100 rounded-lg max-w-[80%]';
                div.innerHTML = `<div class="font-medium text-sm">${sanitize(msg.user)}</div><div>${sanitize(msg.text)}</div>`;
                container.appendChild(div);
            });
            container.scrollTop = container.scrollHeight;
        }

        function sendChatMessage() {
            const input = document.getElementById('chat-input');
            const text = input.value.trim();
            if (!text || !currentUser) return;
            
            chatMessages.push({ user: currentUser.name, text: text });
            input.value = '';
            renderChat();
        }

        // Initialize
        document.getElementById('login-form').addEventListener('submit', login);
        
        window.onload = function() {
            notices = [
                { title: 'System Maintenance', content: 'Portal will be down for 30 minutes tonight.', date: '2026-05-08' }
            ];
        };
    </script>
</body>
</html>
