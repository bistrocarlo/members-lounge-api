<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Monday Night Soccer | Match Hub + Report</title>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        body{background:#eef2f5;font-family:'Inter',sans-serif;}
        .app{max-width:500px;margin:0 auto;background:#eef2f5;min-height:100vh;}
        .header{background:white;padding:14px 20px;text-align:center;border-bottom:1px solid #e2e8f0;}
        .logo-icon{width:56px;height:56px;background:#1a73e8;border-radius:24px;display:inline-flex;align-items:center;justify-content:center;margin:0 auto 6px;}
        .logo-icon i{font-size:28px;color:white;}
        .header h1{font-size:18px;font-weight:800;color:#1e293b;}
        .user-row{background:#f1f5f9;padding:5px 12px;border-radius:60px;display:inline-flex;align-items:center;gap:8px;margin-top:6px;font-size:12px;}
        .user-row button{background:#dc3545;border:none;padding:4px 12px;border-radius:40px;color:white;font-weight:600;font-size:11px;cursor:pointer;}
        .top-nav{background:white;padding:10px 12px;display:flex;flex-wrap:wrap;justify-content:center;gap:6px;border-bottom:1px solid #e2e8f0;position:sticky;top:0;z-index:10;}
        .nav-module{background:#f8fafc;border:none;padding:8px 14px;border-radius:60px;font-size:12px;font-weight:600;color:#475569;cursor:pointer;}
        .nav-module.active{background:#1a73e8;color:white;}
        .module-container{padding:16px;display:none;}
        .module-container.active-module{display:block;}
        .card{background:white;border-radius:24px;padding:18px;margin-bottom:14px;border:1px solid #e2e8f0;box-shadow:0 2px 6px rgba(0,0,0,0.02);}
        .card h2{font-size:17px;font-weight:700;margin-bottom:14px;border-left:4px solid #1a73e8;padding-left:12px;}
        .attendance-card{background:linear-gradient(135deg,#1a73e8,#0d5bbf);color:white;border-radius:28px;padding:24px 20px;text-align:center;margin-bottom:16px;}
        .big-buttons{display:flex;gap:14px;margin:16px 0 12px;}
        .btn-play-big{background:#28a745;flex:1;padding:14px;border-radius:60px;font-weight:800;font-size:17px;border:none;color:white;cursor:pointer;}
        .btn-sit-big{background:#dc3545;flex:1;padding:14px;border-radius:60px;font-weight:800;font-size:17px;border:none;color:white;cursor:pointer;}
        .profile-item{background:#f8fafc;border-radius:20px;padding:14px;margin-bottom:10px;display:flex;align-items:center;gap:12px;}
        .profile-avatar{width:50px;height:50px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:white;font-weight:700;font-size:20px;}
        .player-avatar-small{width:36px;height:36px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:white;font-weight:600;font-size:14px;margin-right:4px;}
        .profile-badge{background:white;border-radius:40px;padding:4px 12px;font-size:11px;font-weight:600;display:inline-block;margin-right:6px;margin-bottom:4px;}
        .edit-profile-btn{background:#475569;padding:6px 14px;font-size:12px;border-radius:40px;border:none;color:white;cursor:pointer;}
        .match-card{background:white;border-radius:24px;margin-bottom:14px;border:1px solid #e2e8f0;overflow:hidden;}
        .match-header{background:#f8fafc;padding:12px 16px;display:flex;justify-content:space-between;}
        .match-result{background:#1a73e8;color:white;padding:4px 14px;border-radius:40px;font-weight:700;}
        .teams-section{padding:16px;background:linear-gradient(145deg,#2e7d32,#1b5e20);}
        .team-row{display:flex;gap:12px;}
        .team-box{flex:1;background:rgba(0,0,0,0.65);border-radius:18px;padding:12px;}
        .team-yellow{background:#ffc107;color:#2c2c2c;font-weight:800;text-align:center;padding:6px;border-radius:60px;margin-bottom:8px;}
        .team-orange{background:#fd7e14;color:white;font-weight:800;text-align:center;padding:6px;border-radius:60px;margin-bottom:8px;}
        .player-list{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;}
        .player-tag{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,0.2);border-radius:40px;padding:4px 10px;font-size:11px;color:white;}
        .score-big{text-align:center;margin-top:12px;font-size:22px;font-weight:800;background:rgba(0,0,0,0.6);border-radius:60px;padding:8px;color:white;}
        .goals-section,.comments-section{padding:12px 16px;background:#fefce8;}
        .goals-list{display:flex;flex-wrap:wrap;gap:8px;}
        .goal-badge{background:white;border-radius:40px;padding:5px 12px;font-size:12px;font-weight:600;border-left:3px solid #eab308;}
        .add-comment{display:flex;gap:8px;margin-top:10px;}
        .add-comment input{flex:1;padding:12px;border-radius:60px;border:1.5px solid #e2e8f0;font-size:14px;}
        .comment-item{background:#f8fafc;border-radius:16px;padding:10px;margin-bottom:8px;font-size:13px;}
        .weather-card{background:linear-gradient(135deg,#0f2027,#203a43);color:white;border-radius:24px;padding:20px;text-align:center;}
        .admin-team-item{display:flex;justify-content:space-between;align-items:center;margin:8px 0;background:#f1f5f9;border-radius:60px;padding:8px 16px;flex-wrap:wrap;gap:8px;}
        .admin-action-btn{background:white;border:2px solid #1a73e8;color:#1a73e8;padding:12px;border-radius:60px;font-weight:700;font-size:14px;text-align:center;cursor:pointer;margin-bottom:8px;width:100%;}
        .guest-tag{background:#d4edda;color:#155724;border-radius:40px;padding:6px 12px;font-size:13px;display:inline-flex;align-items:center;gap:6px;}
        .playing-list,.guest-section{background:#e8f0fe;border-radius:20px;padding:16px;margin-bottom:14px;}
        .guest-section{background:#f0fdf4;border:1px solid #bbf7d0;}
        .attendee-tag{display:inline-flex;align-items:center;gap:6px;background:#e2e8f0;padding:6px 12px;border-radius:40px;font-size:13px;margin:4px;}
        .data-table{width:100%;border-collapse:collapse;font-size:13px;}
        .data-table th,.data-table td{padding:10px;text-align:left;border-bottom:1px solid #e2e8f0;}
        .modal{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.5);display:flex;align-items:center;justify-content:center;z-index:1000;}
        .modal-content{background:white;border-radius:32px;padding:24px;max-width:380px;width:90%;}
        .login-box{background:white;border-radius:48px;padding:40px 28px;margin:40px 20px;text-align:center;}
        .login-logo{width:90px;height:90px;background:linear-gradient(135deg,#1a73e8,#0d5bbf);border-radius:32px;display:inline-flex;align-items:center;justify-content:center;margin:0 auto 20px;}
        select,input{width:100%;padding:14px;border:1.5px solid #e2e8f0;border-radius:60px;margin:8px 0;font-size:16px;}
        button{background:#1a73e8;color:white;border:none;padding:12px 20px;border-radius:60px;font-weight:700;cursor:pointer;}
        .flex-btns{display:flex;gap:12px;margin-top:12px;}
        .btn-outline{background:white;color:#1a73e8;border:2px solid #1a73e8;}
        .chat-message{margin-bottom:12px;}
        .chat-bubble{background:#f1f5f9;padding:10px 14px;border-radius:18px;font-size:14px;}
        .chat-name{font-weight:700;font-size:12px;color:#1a73e8;margin-bottom:4px;}
        .info-bar{background:#e8f0fe;border-radius:16px;padding:12px;font-size:12px;margin-bottom:16px;text-align:center;color:#1a73e8;font-weight:500;}
        .timer-container{background:linear-gradient(135deg,#1e293b,#0f172a);border-radius:28px;padding:20px;text-align:center;margin-bottom:16px;}
        .timer-display{font-size:56px;font-weight:800;font-family:monospace;color:#10b981;letter-spacing:4px;background:#00000030;border-radius:20px;padding:12px;margin-bottom:16px;}
        .timer-controls{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-bottom:16px;}
        .timer-btn{padding:10px 20px;border-radius:60px;font-weight:700;font-size:14px;border:none;cursor:pointer;}
        .timer-btn.start{background:#10b981;color:white;}
        .timer-btn.pause{background:#f59e0b;color:white;}
        .timer-btn.reset{background:#ef4444;color:white;}
        .half-status{font-size:14px;color:#94a3b8;margin-top:10px;}
        .loading{text-align:center;padding:40px;color:#64748b;}
        .report-card{background:#f8fafc;border-radius:24px;padding:18px;margin-top:16px;border-left:5px solid #28a745;}
        .goal-entry{background:#eef2ff;border-radius:20px;padding:12px;margin-bottom:10px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
        .share-wa-btn{background:#25D366;color:white;display:block;text-align:center;margin-top:16px;}
    </style>
</head>
<body>
<div class="app" id="app"><div class="loading"><i class="fas fa-spinner fa-spin"></i> Loading...</div></div>

<script>
    // ---------- CORE DATA ----------
    const DEFAULT_PLAYERS = ["Alex Rowe","Ali Mekawy","Carlo","Charlie","Chris Del Monaco","Chris M","Chris S","Danny","Dante","David","Dimitri","Enzo","Farid","Faros","Frank","George B","George T","Ivan","James Zoumis","James","Joe T","Joey","Kia","Leo","Manoli","Marco","Mario","Maurice","Nector","Paul","Perri","Peter","Ralph","Rocco","Stav","Stevan","Theo","Tony EH","Vasilis"].sort();
    
    // Firebase config (read-only mode, existing project)
    const firebaseConfig = {
        apiKey: "AIzaSyCWlFqDJyENgrUOhiLXCjSEi4Mk_54SA1w",
        authDomain: "monday-night-soccer-hub.firebaseapp.com",
        projectId: "monday-night-soccer-hub",
        storageBucket: "monday-night-soccer-hub.firebasestorage.app",
        messagingSenderId: "634335208908",
        appId: "1:634335208908:web:dca705b65fc52de0606969"
    };
    
    let db = null, firebaseReady = false;
    try { firebase.initializeApp(firebaseConfig); db = firebase.firestore(); firebaseReady = true; } catch(e) { console.warn("Demo mode"); }
    
    let players = [...DEFAULT_PLAYERS];
    let playerProfiles = {};
    let teamAssignments = {};
    let matchResults = {};          // stores { yellowScore, orangeScore, goals, assists, injuries }
    let attendance = [];
    let guests = [];
    let matchComments = {};
    let isAdminLoggedIn = false, currentUser = null;
    let weeklyCaptain = "Carlo";
    let weatherData = { temp: "18°C", condition: "Clear", icon: "fa-sun", rainChance: 10 };
    let rulesText = "• ⏰ 8:00pm SHARP kickoff at Clifton Park\n• 👑 Captain rotates weekly\n• ✅ RSVP is mandatory\n• 🎭 Guests welcome!";
    let chatUnsubscribe = null;
    
    // ------ TIMER LOGIC (unchanged) ------
    let timerInterval = null;
    let currentHalf = 1;
    let timeLeft = 45 * 60;
    let isTimerRunning = false;
    function playAlarm() { try { new Audio('data:audio/wav;base64,U3RlYWx0aC...').play().catch(e=>{}); } catch(e){} }
    function formatTime(sec) { return `${Math.floor(sec/60).toString().padStart(2,'0')}:${(sec%60).toString().padStart(2,'0')}`; }
    function updateTimerDisplay() { const d=document.getElementById("timerDisplay"); if(d) d.textContent=formatTime(timeLeft); const hs=document.getElementById("currentHalf"); if(hs) hs.textContent=currentHalf===1?"FIRST HALF":"SECOND HALF"; }
    function timerTick() { if(timeLeft<=0){ if(timerInterval) clearInterval(timerInterval); isTimerRunning=false; playAlarm(); if(currentHalf===1){ alert("🔔 HALF TIME! Start second half?"); currentHalf=2; timeLeft=45*60; updateTimerDisplay(); } else { alert("🔔 FULL TIME! Match ended."); currentHalf=1; timeLeft=45*60; updateTimerDisplay(); } return; } timeLeft--; updateTimerDisplay(); }
    function startTimer() { if(timerInterval) clearInterval(timerInterval); isTimerRunning=true; timerInterval=setInterval(timerTick,1000); }
    function pauseTimer() { if(timerInterval) { clearInterval(timerInterval); timerInterval=null; isTimerRunning=false; } }
    function resetTimer() { pauseTimer(); currentHalf=1; timeLeft=45*60; updateTimerDisplay(); }
    
    function escapeHtml(str) { return String(str).replace(/[&<>]/g, m => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;' }[m])); }
    function getInitials(name) { return name.split(' ').map(n=>n[0]).join('').toUpperCase().substring(0,2); }
    function getAvatarColor(name) { const colors=['#1a73e8','#28a745','#dc3545','#fd7e14','#6f42c1']; let hash=0; for(let i=0;i<name.length;i++) hash=((hash<<5)-hash)+name.charCodeAt(i); return colors[Math.abs(hash)%colors.length]; }
    function renderAvatar(name,size=50){return `<div class="profile-avatar" style="background:${getAvatarColor(name)};width:${size}px;height:${size}px;font-size:${size/2.5}px;">${getInitials(name)}</div>`;}
    function renderMiniAvatar(name,size=28){return `<div class="player-avatar-small" style="background:${getAvatarColor(name)};width:${size}px;height:${size}px;font-size:${size/2}px;">${getInitials(name)}</div>`;}
    
    function getAESTNow() { const now=new Date(); const utc=now.getTime()+(now.getTimezoneOffset()*60000); return new Date(utc+(10*3600000)); }
    function getCurrentGameDate() { const aest=getAESTNow(); const day=aest.getDay(); let daysToMon = day===0?6:(day===1?0:day-1); let target=new Date(aest); target.setDate(aest.getDate()-daysToMon); target.setHours(0,0,0,0); if(day===1 && (aest.getHours()>21 || (aest.getHours()===21 && aest.getMinutes()>=30))) target.setDate(target.getDate()+7); return target; }
    function getCurrentGameLabel() { const d=getCurrentGameDate(); return `Mon ${d.toLocaleDateString('en-AU',{day:'numeric',month:'short'})}`; }
    const CURRENT_GAME_STR = getCurrentGameDate().toISOString().split('T')[0];
    function getPastWeeks() { 
        let weeks=[]; let year=new Date().getFullYear(); let start=new Date(year,0,1); while(start.getDay()!==1) start.setDate(start.getDate()+1);
        let cur=new Date(start); let lastMon=new Date(year,11,31); while(lastMon.getDay()!==1) lastMon.setDate(lastMon.getDate()-1);
        while(cur<=lastMon) { if(cur.toISOString().split('T')[0] < CURRENT_GAME_STR) weeks.push({dateStr:cur.toISOString().split('T')[0], label:`Mon ${cur.toLocaleDateString('en-AU',{day:'numeric',month:'short'})}`}); cur.setDate(cur.getDate()+7); }
        return weeks.reverse();
    }
    function getAllParticipants(gameDate) { return { players: attendance.filter(a=>a.gameDate===gameDate && a.status==='in').map(a=>a.player), guests: guests.filter(g=>g.gameDate===gameDate).map(g=>({name:g.guestName,isGuest:true,addedBy:g.addedBy})) }; }
    
    async function fetchWeather() { try { const r=await fetch('https://api.open-meteo.com/v1/forecast?latitude=-37.77&longitude=144.97&hourly=temperature_2m,precipitation_probability,weathercode&timezone=Australia/Melbourne&forecast_days=1'); const d=await r.json(); const nextMon=new Date(); nextMon.setDate(nextMon.getDate()+((1+7-nextMon.getDay())%7)); nextMon.setHours(20,0,0,0); const monStr=nextMon.toISOString().split('T')[0]; for(let i=0;i<d.hourly.time.length;i++) { const hDate=d.hourly.time[i].split('T')[0]; const hour=parseInt(d.hourly.time[i].split('T')[1].substring(0,2)); if(hDate===monStr && hour===20) { weatherData.temp=`${Math.round(d.hourly.temperature_2m[i])}°C`; const code=d.hourly.weathercode[i]; weatherData.condition=code===0?"Clear":(code<=2?"Partly cloudy":"Rainy"); weatherData.icon=code===0?"fa-sun":"fa-cloud-rain"; weatherData.rainChance=d.hourly.precipitation_probability[i]||0; break; } } } catch(e){} renderWeatherPage(); }
    
    async function loadData() { if(!firebaseReady||!db) return; try { const [pDoc,profDoc,tDoc,rDoc,attSnap,guestSnap,commentsSnap] = await Promise.all([ db.collection("config").doc("players").get(), db.collection("config").doc("playerProfiles").get(), db.collection("config").doc("teamAssignments").get(), db.collection("config").doc("matchResults").get(), db.collection("attendance").get(), db.collection("guests").get(), db.collection("matchComments").get()]); if(pDoc?.exists) players=pDoc.data().list.sort(); if(profDoc?.exists) playerProfiles=profDoc.data(); if(tDoc?.exists) teamAssignments=tDoc.data(); if(rDoc?.exists) matchResults=rDoc.data(); attendance=attSnap.docs.map(d=>d.data()); guests=guestSnap.docs.map(d=>d.data()); matchComments={}; commentsSnap.docs.forEach(doc=>{const data=doc.data(); if(!matchComments[data.gameDate]) matchComments[data.gameDate]=[]; matchComments[data.gameDate].push(data);}); for(let p of players) if(!playerProfiles[p]) playerProfiles[p]={age:'—',position:'—',yearJoined:'—',gamesPlayed:0}; } catch(e){} }
    async function saveAttendance(a) { if(firebaseReady&&db) await db.collection("attendance").doc(`${a.player}_${a.gameDate}`).set(a); const idx=attendance.findIndex(x=>x.player===a.player&&x.gameDate===a.gameDate); if(idx!==-1) attendance[idx]=a; else attendance.push(a); refreshAll(); }
    async function saveGuest(g) { if(firebaseReady&&db) await db.collection("guests").doc(`${g.guestName}_${g.gameDate}`).set(g); guests.push(g); refreshAll(); }
    async function removeGuest(name,date) { if(firebaseReady&&db) await db.collection("guests").doc(`${name}_${date}`).delete(); guests=guests.filter(g=>!(g.guestName===name&&g.gameDate===date)); if(teamAssignments[date]){delete teamAssignments[date][name]; delete teamAssignments[date][`guest_${name}`]; if(firebaseReady&&db) await db.collection("config").doc("teamAssignments").set(teamAssignments);} refreshAll(); }
    async function saveTeamAssignments(date,assign) { teamAssignments[date]=assign; if(firebaseReady&&db) await db.collection("config").doc("teamAssignments").set(teamAssignments); refreshAll(); }
    async function saveComment(date,author,text) { const c={gameDate:date,author,text,timestamp:Date.now()}; if(firebaseReady&&db) await db.collection("matchComments").add(c); if(!matchComments[date]) matchComments[date]=[]; matchComments[date].push(c); renderHistoryPage(); }
    async function saveMatchResult(date,yellow,orange,goals,assists,injuries) { matchResults[date]={yellowScore:yellow,orangeScore:orange,goals:goals||{},assists:assists||{},injuries:injuries||[]}; if(firebaseReady&&db) await db.collection("config").doc("matchResults").set(matchResults); renderHistoryPage(); renderScoreboardPage(); if(isAdminLoggedIn) renderAdminPage(); }
    async function saveChatMessage(msg) { if(!currentUser||!msg.trim()) return; if(firebaseReady&&db) await db.collection("chatMessages").add({name:currentUser.name,message:msg.trim(),timestamp:firebase.firestore.FieldValue.serverTimestamp()}); }
    async function setAttendance(status) { if(!currentUser) return; await saveAttendance({player:currentUser.name, gameDate:CURRENT_GAME_STR, status:status}); }
    async function addGuest(name) { if(guests.some(g=>g.gameDate===CURRENT_GAME_STR&&g.guestName===name.trim())) return; await saveGuest({guestName:name.trim(), gameDate:CURRENT_GAME_STR, addedBy:currentUser?.name||"Admin"}); const inp=document.getElementById("guestNameInput"); if(inp) inp.value=""; }
    function showEditProfile(name) { /* unchanged but minimal */ const ex=playerProfiles[name]||{age:'',position:'Midfielder',yearJoined:'',openingBalanceGames:0}; const modal=document.createElement('div'); modal.className='modal'; modal.innerHTML=`<div class="modal-content"><h3>Edit ${escapeHtml(name)}</h3><label>Age</label><input id="editAge" value="${escapeHtml(ex.age)}"><label>Position</label><select id="editPosition"><option>Goalkeeper</option><option>Defender</option><option>Midfielder</option><option>Striker</option></select><div class="flex-btns"><button id="saveBtn">Save</button><button id="cancelBtn">Cancel</button></div></div>`; document.body.appendChild(modal); document.getElementById('saveBtn').onclick=async()=>{ playerProfiles[name]={age:document.getElementById('editAge').value||'—',position:document.getElementById('editPosition').value,yearJoined:ex.yearJoined,gamesPlayed:0}; if(firebaseReady&&db) await db.collection("config").doc("playerProfiles").set(playerProfiles); modal.remove(); renderProfilesPage(); }; document.getElementById('cancelBtn').onclick=()=>modal.remove(); }
    function refreshAll(){ renderHomePage(); renderTeamsPage(); renderHistoryPage(); renderProfilesPage(); renderScoreboardPage(); if(isAdminLoggedIn) renderAdminPage(); }
    
    // ----- MATCH REPORT GENERATOR (WhatsApp ready) -----
    function generateMatchReport(dateStr, resultData, teamsData) {
        const label = getCurrentGameLabel();
        const yellowScore = resultData.yellowScore || 0;
        const orangeScore = resultData.orangeScore || 0;
        const goalsMap = resultData.goals || {};
        const assistsMap = resultData.assists || {};
        const injuries = resultData.injuries || [];
        // group goals by scorer
        let goalEntries = Object.entries(goalsMap).map(([player,cnt])=>({player,goals:cnt,assists:assistsMap[player]||0}));
        goalEntries.sort((a,b)=>b.goals-a.goals);
        let goalLines = goalEntries.map(g=>`⚽ ${g.player}: ${g.goals} goal${g.goals!==1?'s':''}${g.assists>0?` (${g.assists} assist${g.assists!==1?'s':''})`:''}`).join('\n');
        let injuryLine = injuries.length ? `\n🤕 INJURIES:\n${injuries.map(i=>`• ${i.player} - ${i.detail || 'knock'}`).join('\n')}` : '\n✅ No injuries reported.';
        let weatherText = `${weatherData.condition}, ${weatherData.temp}, rain ${weatherData.rainChance}%`;
        return `⚽ *MONDAY NIGHT SOCCER MATCH REPORT* ⚽\n📅 ${label} | Clifton Park\n🌦️ ${weatherText}\n\n🟡 YELLOW ${yellowScore} - ${orangeScore} 🟠 ORANGE\n\n${goalLines || '🔹 No goals recorded'}\n${injuryLine}\n\n👏 Great game everyone! See you next Monday. #MondayNightSoccer`;
    }
    
    // ----- ADMIN MATCH REPORT BUILDER (replaces financials)-----
    function renderMatchReportBuilder() {
        const nextWeek = getPastWeeks()[0] || {dateStr:CURRENT_GAME_STR, label:getCurrentGameLabel()}; // latest past week or current
        const currentResult = matchResults[nextWeek.dateStr] || { yellowScore:0, orangeScore:0, goals:{}, assists:{}, injuries:[] };
        const allPlayersList = players;
        return `<div class="card" style="margin-top:12px;">
            <h2>📋 MATCH REPORT (${nextWeek.label})</h2>
            <div style="display:flex;gap:12px;margin-bottom:16px;">
                <input type="number" id="reportYellowScore" placeholder="Yellow Score" value="${currentResult.yellowScore||0}" style="width:50%;">
                <input type="number" id="reportOrangeScore" placeholder="Orange Score" value="${currentResult.orangeScore||0}" style="width:50%;">
            </div>
            <div><strong>⚽ GOALS & ASSISTS</strong><div id="goalsAssistsContainer"></div><button id="addGoalBtn" class="admin-action-btn" style="background:#1a73e8;color:white;margin-top:6px;">+ Add Goal/Assist</button></div>
            <div style="margin-top:16px;"><strong>🤕 INJURIES</strong><div id="injuriesContainer"></div><button id="addInjuryBtn" class="admin-action-btn" style="background:#dc3545;color:white;">+ Record Injury</button></div>
            <div class="flex-btns" style="margin-top:20px;"><button id="saveReportBtn" style="background:#28a745;">💾 Save Match Report</button><button id="shareWhatsAppBtn" class="share-wa-btn" style="background:#25D366;"><i class="fab fa-whatsapp"></i> Send via WhatsApp</button></div>
        </div>`;
    }
    
    function renderAdminPage() {
        if(!isAdminLoggedIn){ const c=document.getElementById("page-admin"); if(c) c.innerHTML=`<div class="card"><h2>🔒 Admin</h2><p>Admin login required</p></div>`; return; }
        const nextWeek = getPastWeeks()[0] || {dateStr:CURRENT_GAME_STR, label:getCurrentGameLabel()};
        const parts = getAllParticipants(nextWeek.dateStr);
        const allList = [...parts.players.map(p=>({name:p,isGuest:false})), ...parts.guests.map(g=>({name:g.name,isGuest:true,addedBy:g.addedBy}))];
        const currAssign = teamAssignments[nextWeek.dateStr]||{};
        let html = `<div class="card"><h2>✍️ Match Setup & Report</h2><p><strong>📅 Game:</strong> ${nextWeek.label}</p><div class="admin-team-item"><label>👑 Weekly Captain: <input type="text" id="captainEdit" value="${weeklyCaptain}" style="width:150px;padding:8px;"></label><button id="updateCaptainBtn">Set</button></div></div>`;
        html += `<div class="card"><h2>🎭 Manage Guests</h2>`;
        for(let g of parts.guests) html += `<div class="admin-team-item"><span>${escapeHtml(g.name)} (by ${escapeHtml(g.addedBy)})</span><button class="remove-guest-btn" data-guest="${escapeHtml(g.name)}" data-date="${nextWeek.dateStr}">Remove</button></div>`;
        html += `<div><input id="adminGuestName" placeholder="New guest"><button id="adminAddGuestBtn">+ Add Guest</button></div></div>`;
        html += `<div class="card"><h2>⚽ Assign Teams</h2>`;
        for(let p of allList){
            const currTeam = currAssign[p.name] || currAssign[`guest_${p.name}`] || "";
            html += `<div class="admin-team-item"><div>${renderMiniAvatar(p.name,28)} ${escapeHtml(p.name)} ${p.isGuest?'<span class="guest-tag">GUEST</span>':''}</div><select class="team-select" data-name="${escapeHtml(p.name)}" data-isguest="${p.isGuest}"><option value="">— Team —</option><option value="yellow" ${currTeam==="yellow"?"selected":""}>🟡 Yellow</option><option value="orange" ${currTeam==="orange"?"selected":""}>🟠 Orange</option></select></div>`;
        }
        html += `<div class="flex-btns"><button id="autoBalanceBtn">🎲 Auto-Balance</button><button id="saveTeamsBtn">💾 Save Teams</button></div></div>`;
        html += renderMatchReportBuilder(); // match report replaces financials
        const container = document.getElementById("page-admin");
        if(container) container.innerHTML = html;
        document.getElementById("adminAddGuestBtn")?.addEventListener("click",async()=>{const gn=document.getElementById("adminGuestName")?.value.trim(); if(gn) await addGuest(gn); document.getElementById("adminGuestName").value=""; renderAdminPage();});
        document.querySelectorAll(".remove-guest-btn").forEach(btn=>btn.addEventListener("click",()=>removeGuest(btn.dataset.guest,btn.dataset.date)));
        document.getElementById("autoBalanceBtn")?.addEventListener("click",()=>{ if(allList.length===0) return; const shuffled=[...allList]; for(let i=shuffled.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[shuffled[i],shuffled[j]]=[shuffled[j],shuffled[i]];} const mid=Math.ceil(shuffled.length/2); const newAssign={}; shuffled.slice(0,mid).forEach(p=>{newAssign[p.isGuest?`guest_${p.name}`:p.name]="yellow";}); shuffled.slice(mid).forEach(p=>{newAssign[p.isGuest?`guest_${p.name}`:p.name]="orange";}); teamAssignments[nextWeek.dateStr]=newAssign; saveTeamAssignments(nextWeek.dateStr,teamAssignments[nextWeek.dateStr]); renderAdminPage(); renderTeamsPage();});
        document.getElementById("saveTeamsBtn")?.addEventListener("click",async()=>{ const selects=document.querySelectorAll(".team-select"); const newAssign={}; selects.forEach(sel=>{const name=sel.dataset.name, isGuest=sel.dataset.isguest==="true", team=sel.value; if(team) newAssign[isGuest?`guest_${name}`:name]=team;}); teamAssignments[nextWeek.dateStr]=newAssign; await saveTeamAssignments(nextWeek.dateStr,teamAssignments[nextWeek.dateStr]); alert("Teams saved!");});
        document.getElementById("updateCaptainBtn")?.addEventListener("click",()=>{ const newCap=document.getElementById("captainEdit")?.value.trim(); if(newCap) weeklyCaptain=newCap; renderAdminPage(); renderTeamsPage(); });
        // goal + injury dynamic logic
        let goalEntries = Object.entries(matchResults[nextWeek.dateStr]?.goals || {}).map(([p,c])=>({player:p,goals:c,assists:matchResults[nextWeek.dateStr]?.assists?.[p]||0}));
        let injuriesArr = matchResults[nextWeek.dateStr]?.injuries || [];
        function refreshReportUI() { const gDiv=document.getElementById("goalsAssistsContainer"); if(gDiv){ gDiv.innerHTML=goalEntries.map((g,idx)=>`<div class="goal-entry"><select class="goal-player-select" data-idx="${idx}">${players.map(p=>`<option ${p===g.player?'selected':''}>${escapeHtml(p)}</option>`).join('')}</select><input type="number" class="goal-count" data-idx="${idx}" value="${g.goals}" style="width:70px;" placeholder="goals"><input type="number" class="assist-count" data-idx="${idx}" value="${g.assists}" style="width:70px;" placeholder="assists"><button class="remove-goal-btn" data-idx="${idx}" style="background:#dc3545;padding:6px 12px;">✖</button></div>`).join('')||'<div style="color:gray;">No goals recorded yet.</div>'; attachGoalEvents();}
        function attachGoalEvents(){ document.querySelectorAll(".goal-player-select").forEach(sel=>{ sel.addEventListener("change",function(){ const idx=parseInt(this.dataset.idx); goalEntries[idx].player=this.value; });}); document.querySelectorAll(".goal-count").forEach(inp=>{ inp.addEventListener("change",function(){ const idx=parseInt(this.dataset.idx); goalEntries[idx].goals=parseInt(this.value)||0; });}); document.querySelectorAll(".assist-count").forEach(inp=>{ inp.addEventListener("change",function(){ const idx=parseInt(this.dataset.idx); goalEntries[idx].assists=parseInt(this.value)||0; });}); document.querySelectorAll(".remove-goal-btn").forEach(btn=>{ btn.addEventListener("click",function(){ const idx=parseInt(this.dataset.idx); goalEntries.splice(idx,1); refreshReportUI(); });}); }
        function refreshInjuriesUI(){ const iDiv=document.getElementById("injuriesContainer"); if(iDiv){ iDiv.innerHTML=injuriesArr.map((inj,idx)=>`<div class="goal-entry" style="background:#ffe8e8;"><select class="injury-player-select" data-idx="${idx}">${players.map(p=>`<option ${p===inj.player?'selected':''}>${escapeHtml(p)}</option>`).join('')}</select><input type="text" class="injury-detail" data-idx="${idx}" value="${escapeHtml(inj.detail||'injury')}" placeholder="injury description"><button class="remove-injury-btn" data-idx="${idx}" style="background:#dc3545;">✖</button></div>`).join('')||'<div>No injuries recorded.</div>'; attachInjuryEvents();}
        function attachInjuryEvents(){ document.querySelectorAll(".injury-player-select").forEach(sel=>{ sel.addEventListener("change",function(){ const idx=parseInt(this.dataset.idx); injuriesArr[idx].player=this.value; });}); document.querySelectorAll(".injury-detail").forEach(inp=>{ inp.addEventListener("change",function(){ const idx=parseInt(this.dataset.idx); injuriesArr[idx].detail=this.value; });}); document.querySelectorAll(".remove-injury-btn").forEach(btn=>{ btn.addEventListener("click",function(){ const idx=parseInt(this.dataset.idx); injuriesArr.splice(idx,1); refreshInjuriesUI(); });}); }
        document.getElementById("addGoalBtn")?.addEventListener("click",()=>{ goalEntries.push({player:players[0]||"Unknown",goals:0,assists:0}); refreshReportUI(); });
        document.getElementById("addInjuryBtn")?.addEventListener("click",()=>{ injuriesArr.push({player:players[0]||"Unknown",detail:"muscle strain"}); refreshInjuriesUI(); });
        document.getElementById("saveReportBtn")?.addEventListener("click",async()=>{ const yellowS=parseInt(document.getElementById("reportYellowScore")?.value)||0; const orangeS=parseInt(document.getElementById("reportOrangeScore")?.value)||0; const goalsMap={}, assistsMap={}; goalEntries.forEach(g=>{ if(g.goals>0) goalsMap[g.player]=g.goals; if(g.assists>0) assistsMap[g.player]=g.assists; }); await saveMatchResult(nextWeek.dateStr,yellowS,orangeS,goalsMap,assistsMap,injuriesArr); alert("Match report saved!"); renderHistoryPage(); renderAdminPage(); });
        document.getElementById("shareWhatsAppBtn")?.addEventListener("click",()=>{ const yellowS=parseInt(document.getElementById("reportYellowScore")?.value)||0; const orangeS=parseInt(document.getElementById("reportOrangeScore")?.value)||0; const goalsMap={}, assistsMap={}; goalEntries.forEach(g=>{ if(g.goals>0) goalsMap[g.player]=g.goals; if(g.assists>0) assistsMap[g.player]=g.assists; }); const reportText = generateMatchReport(nextWeek.dateStr,{yellowScore:yellowS,orangeScore:orangeS,goals:goalsMap,assists:assistsMap,injuries:injuriesArr}); window.open(`https://wa.me/?text=${encodeURIComponent(reportText)}`,'_blank'); });
        refreshReportUI(); refreshInjuriesUI();
    }
    
    // ----- RENDER PAGES (home, profiles, teams, history, etc) -----
    function renderHomePage(){ const c=document.getElementById("homeContainer"); if(!c) return; const status=attendance.find(a=>a.gameDate===CURRENT_GAME_STR&&a.player===currentUser?.name)?.status; const parts=getAllParticipants(CURRENT_GAME_STR); c.innerHTML=`<div class="attendance-card"><h2>⚽ ${getCurrentGameLabel()} • 8pm</h2><div>Clifton Park, Brunswick</div><div class="big-buttons"><button id="homePlayBtn" class="btn-play-big">✅ I'M PLAYING</button><button id="homeSitBtn" class="btn-sit-big">❌ CAN'T PLAY</button></div><div>${status==='in'?'✓ You are PLAYING':(status==='out'?'✗ Sitting out':'Tap above')}</div></div><div class="playing-list"><div>🟢 Playing (${parts.players.length})</div><div>${parts.players.map(p=>`<span class="attendee-tag">${renderMiniAvatar(p,28)} ${escapeHtml(p)}</span>`).join('')||'None'}</div></div><div class="guest-section"><div>🎭 Guests (${parts.guests.length})</div><div>${parts.guests.map(g=>`<span class="guest-tag"><i class="fas fa-user-plus"></i> ${escapeHtml(g.name)}</span>`).join('')||'None'}</div><div><input id="guestNameInput" placeholder="Guest name"><button id="addGuestBtnPlayer" style="width:100%;margin-top:8px;">➕ Bring a Guest</button></div></div>`; document.getElementById("homePlayBtn")?.addEventListener("click",()=>setAttendance("in")); document.getElementById("homeSitBtn")?.addEventListener("click",()=>setAttendance("out")); document.getElementById("addGuestBtnPlayer")?.addEventListener("click",()=>{ const gn=document.getElementById("guestNameInput")?.value.trim(); if(gn) addGuest(gn); });}
    function renderProfilesPage(){ const c=document.getElementById("page-profiles"); if(!c) return; let html=`<div class="card"><h2>👤 Player Profiles</h2>`; for(let p of players){ const prof=playerProfiles[p]||{age:'—',position:'—',yearJoined:'—',gamesPlayed:0}; html+=`<div class="profile-item">${renderAvatar(p,50)}<div><div>⚽ ${escapeHtml(p)} <button class="edit-profile-btn" data-player="${escapeHtml(p)}">Edit</button></div><div><span class="profile-badge">🎂 ${escapeHtml(prof.age)}</span><span class="profile-badge">⚽ ${escapeHtml(prof.position)}</span><span class="profile-badge">🏆 ${prof.gamesPlayed||0} games</span></div></div></div>`; } c.innerHTML=html; document.querySelectorAll(".edit-profile-btn").forEach(btn=>btn.addEventListener("click",()=>showEditProfile(btn.dataset.player)));}
    function renderScoreboardPage(){ const c=document.getElementById("page-scoreboard"); if(!c) return; let stats=new Map(); for(let p of players) stats.set(p,{goals:0,apps:0}); attendance.forEach(a=>{if(a.status==='in'&&stats.has(a.player)) stats.get(a.player).apps++;}); for(let m of Object.values(matchResults)) if(m.goals) for(let [scorer,count] of Object.entries(m.goals)) if(stats.has(scorer)) stats.get(scorer).goals+=count; const all=Array.from(stats.entries()).map(([n,st])=>({name:n,goals:st.goals,apps:st.apps})); const topGoals=[...all].sort((a,b)=>b.goals-a.goals).slice(0,10); c.innerHTML=`<div class="card"><h2>🏆 Stats</h2><div><h3>⚽ Top Scorers</h3><table class="data-table">${topGoals.map((p,i)=>`<tr><td>${i+1}</td><td>${renderMiniAvatar(p.name,24)} ${escapeHtml(p.name)}</td><td><strong>${p.goals}</strong></td></tr>`).join('')}</table></div></div>`; }
    function renderTeamsPage(){ const c=document.getElementById("page-teamswk"); if(!c) return; const parts=getAllParticipants(CURRENT_GAME_STR); const allList=[...parts.players.map(p=>({name:p,isG:false})),...parts.guests.map(g=>({name:g.name,isG:true}))]; const assign=teamAssignments[CURRENT_GAME_STR]||{}; const yellow=[], orange=[]; for(let p of allList){ const team=assign[p.name]||assign[`guest_${p.name}`]; if(team==="yellow") yellow.push(p); else if(team==="orange") orange.push(p);} c.innerHTML=`<div class="card"><div class="team-row"><div class="team-box"><div class="team-yellow">🟡 YELLOW (${yellow.length})</div><div class="player-list">${yellow.map(p=>`<div class="player-tag">${renderMiniAvatar(p.name,24)} ${escapeHtml(p.name)}${p.isG?' <span style="background:#28a745;">Guest</span>':''}</div>`).join('')||'—'}</div></div><div class="team-box"><div class="team-orange">🟠 ORANGE (${orange.length})</div><div class="player-list">${orange.map(p=>`<div class="player-tag">${renderMiniAvatar(p.name,24)} ${escapeHtml(p.name)}${p.isG?' <span style="background:#28a745;">Guest</span>':''}</div>`).join('')||'—'}</div></div></div><div style="text-align:center;margin-top:12px;">👑 Captain: ${weeklyCaptain}</div></div>`; }
    function renderHistoryPage(){ const c=document.getElementById("page-history"); if(!c) return; const past=getPastWeeks(); if(past.length===0){c.innerHTML=`<div class="card"><h2>📖 History</h2><p>No past games</p></div>`; return;} let html=`<div class="card"><h2>📖 Match History + Reports</h2></div>`; for(let w of past){ const m=matchResults[w.dateStr]||{yellowScore:0,orangeScore:0,goals:{},assists:{},injuries:[]}; const goalsDisplay=Object.entries(m.goals||{}).map(([p,c])=>`⚽ ${p} ×${c}`).join(' · '); const injuriesDisplay=(m.injuries||[]).map(i=>`🤕 ${i.player} (${i.detail})`).join(' · '); html+=`<div class="match-card"><div class="match-header"><div>${w.label}</div><div class="match-result">🟡 ${m.yellowScore} - ${m.orangeScore} 🟠</div></div><div class="goals-section"><strong>⚽ Goals & Assists</strong><div>${goalsDisplay||'None recorded'}</div>${injuriesDisplay?`<div style="margin-top:8px;"><strong>🤕 Injuries</strong><br>${injuriesDisplay}</div>`:''}</div></div>`;} c.innerHTML=html; }
    function renderWeatherPage(){ const c=document.getElementById("page-weather"); if(c) c.innerHTML=`<div class="card"><h2>🌤️ Forecast</h2><div class="weather-card"><i class="fas ${weatherData.icon}" style="font-size:56px;"></i><h3>${weatherData.condition}</h3><h1>${weatherData.temp}</h1><p>Rain: ${weatherData.rainChance}%</p></div></div>`; }
    function renderRulesPage(){ const c=document.getElementById("page-rules"); if(c) c.innerHTML=`<div class="card"><h2>📜 Rules</h2><div style="white-space:pre-line">${escapeHtml(rulesText)}</div></div>`; }
    function renderChatPage(){ const c=document.getElementById("page-chat"); if(!c) return; c.innerHTML=`<div class="card"><h2>💬 Team Chat</h2><div id="chatMessagesList" style="height:400px;overflow-y:auto;background:#f8fafc;border-radius:20px;padding:12px;"></div><div><input id="chatInput" placeholder="Type..."><button id="chatSendBtn">Send</button></div></div>`; if(firebaseReady&&db){ if(chatUnsubscribe) chatUnsubscribe(); chatUnsubscribe=db.collection("chatMessages").orderBy("timestamp","asc").onSnapshot(snap=>{ const div=document.getElementById("chatMessagesList"); if(!div) return; let html=""; snap.forEach(doc=>{ const msg=doc.data(); const time=msg.timestamp?new Date(msg.timestamp.toDate()).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}):""; html+=`<div class="chat-message"><div class="chat-name">${escapeHtml(msg.name)} <span style="font-size:10px;">${time}</span></div><div class="chat-bubble">${escapeHtml(msg.message)}</div></div>`;}); div.innerHTML=html||"<div>No messages</div>"; div.scrollTop=div.scrollHeight;}); } document.getElementById("chatSendBtn")?.addEventListener("click",async()=>{ const inp=document.getElementById("chatInput"); if(inp?.value.trim()){ await saveChatMessage(inp.value.trim()); inp.value=""; } }); }
    function renderTimerPage(){ const c=document.getElementById("page-timer"); if(!c) return; c.innerHTML=`<div class="timer-container"><div class="timer-display" id="timerDisplay">45:00</div><div class="timer-controls"><button class="timer-btn start" id="timerStartBtn">Start</button><button class="timer-btn pause" id="timerPauseBtn">Pause</button><button class="timer-btn reset" id="timerResetBtn">Reset</button></div><div class="half-status">Current Half: <span id="currentHalf">FIRST HALF</span></div></div>`; updateTimerDisplay(); document.getElementById("timerStartBtn")?.addEventListener("click",startTimer); document.getElementById("timerPauseBtn")?.addEventListener("click",pauseTimer); document.getElementById("timerResetBtn")?.addEventListener("click",resetTimer); }
    function initNav() { const mods=[{id:"home",name:"🏠 HOME"},{id:"profiles",name:"👤 PROFILES"},{id:"scoreboard",name:"🏆 STATS"},{id:"teamswk",name:"⚽ THIS WEEK"},{id:"history",name:"📖 HISTORY"},{id:"weather",name:"🌤️ WEATHER"},{id:"timer",name:"⏱️ TIMER"},{id:"chat",name:"💬 CHAT"},{id:"rules",name:"📜 RULES"}]; if(isAdminLoggedIn) mods.push({id:"admin",name:"⚙️ ADMIN"}); const nav=document.getElementById("topNavBar"); if(nav) nav.innerHTML=mods.map(m=>`<button class="nav-module" data-module="${m.id}">${m.name}</button>`).join(''); document.querySelectorAll(".nav-module").forEach(btn=>{ btn.addEventListener("click",()=>{ const id=btn.dataset.module; document.querySelectorAll(".module-container").forEach(c=>c.classList.remove("active-module")); document.getElementById(`module-${id}`)?.classList.add("active-module"); document.querySelectorAll(".nav-module").forEach(b=>b.classList.remove("active")); btn.classList.add("active"); if(id==="chat") renderChatPage(); if(id==="timer") renderTimerPage(); }); }); document.querySelector('.nav-module[data-module="home"]')?.click(); }
    async function renderApp() { await loadData(); await fetchWeather(); const app=document.getElementById("app"); app.innerHTML=`<div class="header"><div class="logo-icon"><i class="fas fa-futbol"></i></div><h1>MONDAY NIGHT SOCCER</h1><div class="user-row"><i class="fas fa-user-circle"></i> <strong>${currentUser?.role==="admin"?"ADMIN":currentUser?.name||"Player"}</strong> <button id="logoutBtnMain">Exit</button></div></div><div class="top-nav" id="topNavBar"></div><div id="module-home" class="module-container"><div id="homeContainer"></div></div><div id="module-profiles" class="module-container"><div id="page-profiles"></div></div><div id="module-scoreboard" class="module-container"><div id="page-scoreboard"></div></div><div id="module-teamswk" class="module-container"><div id="page-teamswk"></div></div><div id="module-history" class="module-container"><div id="page-history"></div></div><div id="module-weather" class="module-container"><div id="page-weather"></div></div><div id="module-timer" class="module-container"><div id="page-timer"></div></div><div id="module-chat" class="module-container"><div id="page-chat"></div></div><div id="module-rules" class="module-container"><div id="page-rules"></div></div>${isAdminLoggedIn ? `<div id="module-admin" class="module-container"><div id="page-admin"></div></div>` : ''}`; document.getElementById("logoutBtnMain").onclick=()=>{ if(chatUnsubscribe) chatUnsubscribe(); currentUser=null; localStorage.removeItem("soccer_user"); renderLogin(); }; renderHomePage(); renderProfilesPage(); renderScoreboardPage(); renderTeamsPage(); renderHistoryPage(); renderWeatherPage(); renderTimerPage(); renderChatPage(); renderRulesPage(); if(isAdminLoggedIn) renderAdminPage(); initNav(); }
    async function renderLogin() { await loadData(); const app=document.getElementById("app"); app.innerHTML=`<div class="login-box"><div class="login-logo"><i class="fas fa-futbol"></i></div><h2>Monday Night Soccer</h2><p>8pm Kickoff • Clifton Park</p><select id="playerSelectLogin"><option value="">-- Select Player --</option>${players.map(p=>`<option value="${escapeHtml(p)}">${escapeHtml(p)}</option>`).join('')}</select><button id="playerLoginBtn">Enter as Player</button><hr><input type="password" id="adminPwLogin" placeholder="Admin Password"><button id="adminLoginBtn">Admin Login</button></div>`; document.getElementById("playerLoginBtn").onclick=()=>{ const n=document.getElementById("playerSelectLogin")?.value; if(n){ currentUser={name:n,role:"player"}; isAdminLoggedIn=false; localStorage.setItem("soccer_user",JSON.stringify(currentUser)); renderApp(); } else alert("Select name"); }; document.getElementById("adminLoginBtn").onclick=()=>{ const pw=document.getElementById("adminPwLogin")?.value; if(pw==="admin123"){ currentUser={name:"Admin",role:"admin"}; isAdminLoggedIn=true; localStorage.setItem("soccer_user",JSON.stringify(currentUser)); renderApp(); } else alert("Wrong password"); }; }
    const stored=localStorage.getItem("soccer_user"); if(stored){ try{ const u=JSON.parse(stored); if(u.role==="admin"){ isAdminLoggedIn=true; currentUser={name:"Admin",role:"admin"}; } else { currentUser={name:u.name,role:"player"}; } renderApp(); } catch(e){ renderLogin(); } } else { renderLogin(); }
</script>
