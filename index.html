<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Monday Night Soccer | 8pm Kickoff</title>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #eef2f5; font-family: 'Inter', sans-serif; padding: 0; min-height: 100vh; display: flex; flex-direction: column; }
        
        /* Main App Container */
        .app-wrapper { display: flex; flex-direction: column; height: 100vh; max-width: 500px; margin: 0 auto; background: #eef2f5; box-shadow: 0 0 20px rgba(0,0,0,0.05); }
        
        /* Header */
        .app-header { background: white; padding: 16px 20px; text-align: center; border-bottom: 1px solid #e2e8f0; }
        .logo-icon { width: 48px; height: 48px; background: #1a73e8; border-radius: 20px; display: inline-flex; align-items: center; justify-content: center; margin-bottom: 8px; }
        .logo-icon i { font-size: 24px; color: white; }
        .app-header h1 { font-size: 20px; font-weight: 800; color: #1e293b; }
        .user-badge { background: #f1f5f9; padding: 6px 12px; border-radius: 60px; display: inline-flex; align-items: center; gap: 8px; margin-top: 8px; font-size: 12px; }
        .user-badge button { background: #dc3545; border: none; padding: 4px 12px; border-radius: 40px; color: white; font-weight: 600; font-size: 12px; }
        
        /* Hero Attendance Banner */
        .hero-attendance { background: linear-gradient(135deg, #1a73e8, #0d5bbf); color: white; padding: 20px; text-align: center; margin: 12px; border-radius: 24px; }
        .hero-attendance h2 { font-size: 20px; margin-bottom: 4px; }
        .hero-attendance .kickoff { font-size: 13px; opacity: 0.9; margin-bottom: 12px; }
        .attendance-buttons { display: flex; gap: 12px; justify-content: center; }
        .btn-play { background: #28a745; padding: 12px 24px; border-radius: 60px; font-weight: 800; font-size: 16px; border: none; color: white; cursor: pointer; }
        .btn-sit { background: #dc3545; padding: 12px 24px; border-radius: 60px; font-weight: 800; font-size: 16px; border: none; color: white; cursor: pointer; }
        
        /* Alert Banner */
        .alert-banner { background: linear-gradient(90deg, #ff4757, #ff6b6b); color: white; padding: 10px; text-align: center; font-weight: 700; font-size: 13px; margin: 0 12px 12px; border-radius: 60px; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { opacity: 0.9; } 50% { opacity: 1; background: #ff4757; } 100% { opacity: 0.9; } }
        
        /* Page Content */
        .page-container { flex: 1; overflow-y: auto; padding: 12px; }
        .page { display: none; }
        .page.active-page { display: block; animation: fadeIn 0.25s ease; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        
        /* Bottom Tab Bar */
        .bottom-tab-bar { background: white; border-top: 1px solid #e2e8f0; display: flex; justify-content: space-around; padding: 8px 12px 12px; position: sticky; bottom: 0; }
        .tab-item { display: flex; flex-direction: column; align-items: center; gap: 4px; background: none; border: none; cursor: pointer; padding: 8px 12px; border-radius: 40px; transition: all 0.2s; color: #94a3b8; font-size: 12px; }
        .tab-item i { font-size: 22px; }
        .tab-item.active { color: #1a73e8; background: #e8f0fe; }
        
        /* Cards */
        .card { background: white; border-radius: 20px; padding: 16px; margin-bottom: 12px; border: 1px solid #e2e8f0; }
        .card h2 { font-size: 16px; font-weight: 700; margin-bottom: 12px; border-left: 3px solid #1a73e8; padding-left: 10px; }
        .card h3 { font-size: 14px; font-weight: 600; margin: 12px 0 8px; }
        
        /* Match Cards */
        .match-card { background: white; border-radius: 20px; margin-bottom: 12px; border: 1px solid #e2e8f0; overflow: hidden; }
        .match-header { background: #f8fafc; padding: 12px 16px; display: flex; justify-content: space-between; flex-wrap: wrap; }
        .match-date { font-weight: 800; font-size: 14px; }
        .match-result-badge { background: #1a73e8; color: white; padding: 4px 12px; border-radius: 60px; font-weight: 800; font-size: 14px; }
        .teams-section { padding: 16px; background: linear-gradient(145deg, #2e7d32, #1b5e20); }
        .teams-flex { display: flex; gap: 12px; flex-wrap: wrap; }
        .team-card-mini { flex: 1; background: rgba(0,0,0,0.65); border-radius: 16px; padding: 12px; min-width: 140px; }
        .team-name-yellow { background: #ffc107; color: #2c2c2c; font-weight: 800; text-align: center; padding: 6px; border-radius: 60px; font-size: 14px; margin-bottom: 8px; }
        .team-name-orange { background: #fd7e14; color: white; font-weight: 800; text-align: center; padding: 6px; border-radius: 60px; font-size: 14px; margin-bottom: 8px; }
        .player-list-mini { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
        .player-badge-mini { background: rgba(255,255,255,0.2); border-radius: 40px; padding: 4px 8px; font-size: 11px; color: white; }
        .score-display-big { text-align: center; margin-top: 12px; font-size: 22px; font-weight: 800; background: rgba(0,0,0,0.6); border-radius: 60px; padding: 8px; color: white; }
        .goals-section { padding: 12px 16px; background: #fefce8; }
        .goals-list { display: flex; flex-wrap: wrap; gap: 8px; }
        .goal-item { background: white; border-radius: 40px; padding: 6px 12px; font-size: 12px; font-weight: 600; border-left: 3px solid #eab308; }
        .comments-section { padding: 12px 16px; }
        .add-comment { display: flex; gap: 8px; margin-top: 10px; }
        .add-comment input { flex: 1; padding: 10px 14px; border-radius: 60px; border: 1.5px solid #e2e8f0; font-size: 14px; }
        .comment-item { background: #f8fafc; border-radius: 16px; padding: 10px; margin-bottom: 8px; font-size: 13px; }
        
        select, input { width: 100%; padding: 12px 14px; border: 1.5px solid #e2e8f0; border-radius: 60px; margin: 4px 0; font-size: 14px; }
        button { background: #1a73e8; color: white; border: none; padding: 12px 20px; border-radius: 60px; font-weight: 700; cursor: pointer; font-size: 14px; }
        .btn-outline { background: white; color: #1a73e8; border: 2px solid #1a73e8; }
        .flex-btns { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 12px; }
        .stat-card { background: #f8fafc; border-radius: 16px; padding: 12px; text-align: center; }
        .attendee-tags { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
        .attendee-tag { background: #e2e8f0; padding: 6px 12px; border-radius: 40px; font-size: 13px; }
        .data-table { width: 100%; border-collapse: collapse; font-size: 13px; }
        .data-table th, .data-table td { padding: 10px; text-align: left; border-bottom: 1px solid #e2e8f0; }
        .profile-grid { display: flex; flex-direction: column; gap: 10px; }
        .profile-item { background: #f8fafc; border-radius: 16px; padding: 12px; border-left: 3px solid #1a73e8; }
        .profile-header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
        .profile-name { font-weight: 800; font-size: 15px; }
        .profile-details { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0 0; }
        .profile-badge { background: white; border-radius: 30px; padding: 4px 10px; font-size: 11px; font-weight: 600; }
        .badge-paid { background: #28a745; color: white; border-radius: 40px; padding: 3px 10px; font-size: 11px; }
        .badge-owing { background: #dc3545; color: white; border-radius: 40px; padding: 3px 10px; font-size: 11px; }
        .captain-card { background: linear-gradient(135deg, #667eea, #764ba2); color: white; border-radius: 16px; padding: 12px; margin-bottom: 12px; text-align: center; font-size: 13px; }
        .weather-card { background: linear-gradient(135deg, #0f2027, #203a43, #2c5364); color: white; border-radius: 20px; padding: 16px; text-align: center; }
        .modal { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 1000; }
        .modal-content { background: white; border-radius: 28px; padding: 20px; max-width: 350px; width: 90%; max-height: 80vh; overflow-y: auto; }
        .rule-box { background: #fef3c7; border-left: 3px solid #f59e0b; padding: 12px; border-radius: 12px; margin-bottom: 12px; font-size: 13px; }
    </style>
</head>
<body>
<div class="app-wrapper">
    <div class="app-header">
        <div class="logo-icon"><i class="fas fa-futbol"></i></div>
        <h1>MONDAY NIGHT SOCCER</h1>
        <div class="user-badge" id="userBadge"><i class="fas fa-user-circle"></i> <span id="userName">Loading...</span> <button id="logoutBtn">Exit</button></div>
    </div>
    
    <div id="heroContainer"></div>
    <div id="alertContainer"></div>
    
    <div class="page-container" id="pageContainer">
        <div id="page-profiles" class="page"></div>
        <div id="page-scoreboard" class="page"></div>
        <div id="page-teamselect" class="page"></div>
        <div id="page-history" class="page"></div>
        <div id="page-rsvp" class="page"></div>
        <div id="page-weather" class="page"></div>
        <div id="page-chat" class="page"></div>
        <div id="page-finance" class="page"></div>
        <div id="page-rules" class="page"></div>
    </div>
    
    <div class="bottom-tab-bar" id="bottomTabBar"></div>
</div>

<script>
    // Firebase Config
    const firebaseConfig = {
        apiKey: "AIzaSyCWlFqDJyENgrUOhiLXCjSEi4Mk_54SA1w",
        authDomain: "monday-night-soccer-hub.firebaseapp.com",
        projectId: "monday-night-soccer-hub",
        storageBucket: "monday-night-soccer-hub.firebasestorage.app",
        messagingSenderId: "634335208908",
        appId: "1:634335208908:web:dca705b65fc52de0606969"
    };
    let db = null;
    try { firebase.initializeApp(firebaseConfig); db = firebase.firestore(); } catch(e) { console.warn("Demo mode"); }
    
    const POSITIONS = ["Goalkeeper","Defender","Defensive Midfielder","Midfielder Centre","Midfielder Attacking","Wing Back Right","Wing Back Left","Attacking Midfielder","Striker","Winger Left","Winger Right"];
    
    let players = ["Alex Rowe","Ali Mekawy","Carlo","Charlie","Chris Del Monaco","Chris M","Chris S","Danny","Dante","David","Dimitri","Enzo","Farid","Faros","Frank","George B","George T","Ivan","James Zoumis","James","Joe T","Joey","Kia","Leo","Manoli","Marco","Mario","Maurice","Nector","Paul","Perri","Peter","Ralph","Rocco","Stav","Stevan","Theo","Tony EH","Vasilis"].sort();
    let playerProfiles = {};
    let teamAssignments = {};
    let matchResults = {};
    let payments = [];
    let attendance = [];
    let matchComments = {};
    let isAdminLoggedIn = false, currentUser = null;
    
    let allCaptainsList = [];
    let currentCaptainIndex = 0;
    let weeklyCaptain = "";
    let lastRotationWeek = "";
    const teamCaptainsOrder = ["Carlo", "Charlie", "Chris Del Monaco", "Danny", "David", "Frank", "James Zoumis", "Joe T", "Leo", "Marco", "Paul", "Peter", "Rocco", "Stav", "Theo", "Ali Mekawy", "George B", "Vasilis"];
    
    let weatherData = { temp: "18°C", condition: "Clear", icon: "fa-sun", rainChance: 10, wind: "12 km/h", humidity: "65%" };
    
    // Firestore Refs
    const playersRef = db?.collection("config").doc("players");
    const profilesRef = db?.collection("config").doc("playerProfiles");
    const teamsRef = db?.collection("config").doc("teamAssignments");
    const resultsRef = db?.collection("config").doc("matchResults");
    const paymentsRef = db?.collection("payments");
    const attendanceRef = db?.collection("attendance");
    const commentsRef = db?.collection("matchComments");
    const captainRef = db?.collection("config").doc("captainRotation");
    
    function getCurrentAESTDate() {
        const now = new Date(); const utc = now.getTime() + (now.getTimezoneOffset() * 60000);
        return new Date(utc + (10 * 3600000)).toISOString().split('T')[0];
    }
    
    function getCurrentGameWeek() {
        const now = new Date(); const utc = now.getTime() + (now.getTimezoneOffset() * 60000);
        const aestNow = new Date(utc + (10 * 3600000));
        const day = aestNow.getDay();
        const currentMonday = new Date(aestNow);
        if (day === 1 && aestNow.getHours() >= 20) currentMonday.setDate(aestNow.getDate() + 7);
        else if (day !== 1) currentMonday.setDate(aestNow.getDate() + ((8 - day) % 7));
        currentMonday.setHours(20,0,0,0);
        return currentMonday.toISOString().split('T')[0];
    }
    
    function generateAllGameWeeks() {
        const year = new Date().getFullYear();
        let start = new Date(year, 0, 1);
        while (start.getDay() !== 1) start.setDate(start.getDate() + 1);
        let weeks = [], cur = new Date(start);
        let dec31 = new Date(year, 11, 31);
        let lastMonday = new Date(dec31);
        while (lastMonday.getDay() !== 1) lastMonday.setDate(lastMonday.getDate() - 1);
        let secondLast = new Date(lastMonday);
        secondLast.setDate(secondLast.getDate() - 7);
        while (cur <= secondLast) {
            weeks.push({ dateStr: cur.toISOString().split('T')[0], label: `Mon ${cur.toLocaleDateString('en-AU', { day:'numeric', month:'short' })}` });
            cur.setDate(cur.getDate() + 7);
        }
        return weeks;
    }
    const ALL_GAME_WEEKS = generateAllGameWeeks();
    const getFutureWeeks = () => ALL_GAME_WEEKS.filter(w => w.dateStr >= getCurrentAESTDate());
    const getPastWeeks = () => ALL_GAME_WEEKS.filter(w => w.dateStr < getCurrentAESTDate()).reverse();
    
    function updateEligibleCaptains() {
        const attendingPlayers = new Set();
        attendance.forEach(a => { if (a.status === 'in') attendingPlayers.add(a.player); });
        allCaptainsList = teamCaptainsOrder.filter(c => attendingPlayers.has(c));
        if (allCaptainsList.length === 0 && teamCaptainsOrder.length > 0) allCaptainsList = [teamCaptainsOrder[0]];
    }
    
    async function updateCaptainForCurrentWeek() {
        const currentWeek = getCurrentGameWeek();
        updateEligibleCaptains();
        if (allCaptainsList.length === 0) { weeklyCaptain = "Admin"; return; }
        if (lastRotationWeek !== currentWeek) {
            if (currentCaptainIndex === 0 && weeklyCaptain === "") weeklyCaptain = allCaptainsList[0];
            else currentCaptainIndex = (currentCaptainIndex + 1) % allCaptainsList.length;
            weeklyCaptain = allCaptainsList[currentCaptainIndex];
            lastRotationWeek = currentWeek;
            await saveCaptainRotation();
        }
    }
    
    async function fetchMelbourneWeather() {
        try {
            const response = await fetch('https://api.open-meteo.com/v1/forecast?latitude=-37.77&longitude=144.97&hourly=temperature_2m,precipitation_probability,relativehumidity_2m,windspeed_10m,weathercode&timezone=Australia/Melbourne&forecast_days=7');
            const data = await response.json();
            const nextMonday = new Date(); nextMonday.setDate(nextMonday.getDate() + ((1 + 7 - nextMonday.getDay()) % 7)); nextMonday.setHours(20,0,0,0);
            const mondayDateStr = nextMonday.toISOString().split('T')[0];
            for (let i = 0; i < data.hourly.time.length; i++) {
                const hourDate = data.hourly.time[i].split('T')[0];
                const hour = parseInt(data.hourly.time[i].split('T')[1].substring(0,2));
                if (hourDate === mondayDateStr && hour === 20) {
                    const temp = Math.round(data.hourly.temperature_2m[i]);
                    const code = data.hourly.weathercode[i];
                    let condition = "Clear", icon = "fa-sun";
                    if (code === 0) { condition = "Clear sky"; icon = "fa-sun"; }
                    else if (code === 1 || code === 2) { condition = "Partly cloudy"; icon = "fa-cloud-sun"; }
                    else if (code === 3) { condition = "Overcast"; icon = "fa-cloud"; }
                    else if (code >= 51 && code <= 67) { condition = "Light rain"; icon = "fa-cloud-rain"; }
                    else if (code >= 80 && code <= 99) { condition = "Rain/storm"; icon = "fa-cloud-bolt"; }
                    weatherData = { temp: `${temp}°C`, condition, icon, rainChance: data.hourly.precipitation_probability[i] || 0, humidity: `${data.hourly.relativehumidity_2m[i] || 65}%`, wind: `${data.hourly.windspeed_10m[i] || 12} km/h` };
                    break;
                }
            }
        } catch(e) { console.warn("Weather fetch failed"); }
    }
    
    async function loadData() {
        if(!db) return;
        try {
            const pDoc = await playersRef?.get(); if(pDoc?.exists) players = pDoc.data().list.sort();
            const profileDoc = await profilesRef?.get(); if(profileDoc?.exists) playerProfiles = profileDoc.data();
            const tDoc = await teamsRef?.get(); if(tDoc?.exists) teamAssignments = tDoc.data();
            const rDoc = await resultsRef?.get(); if(rDoc?.exists) matchResults = rDoc.data();
            const paySnap = await paymentsRef?.get(); payments = []; paySnap?.forEach(d => payments.push(d.data()));
            const attSnap = await attendanceRef?.get(); attendance = []; attSnap?.forEach(d => attendance.push(d.data()));
            const commentsSnap = await commentsRef?.get();
            matchComments = {};
            commentsSnap?.forEach(doc => { const data = doc.data(); if (!matchComments[data.gameDate]) matchComments[data.gameDate] = []; matchComments[data.gameDate].push(data); });
            const captainDoc = await captainRef?.get();
            if(captainDoc?.exists) { currentCaptainIndex = captainDoc.data().index || 0; weeklyCaptain = captainDoc.data().captain || ""; lastRotationWeek = captainDoc.data().lastWeek || ""; }
            await updateCaptainForCurrentWeek();
            for (let player of players) {
                const gamesFromAttendance = attendance.filter(a => a.player === player && a.status === 'in').length;
                const opening = playerProfiles[player]?.openingBalanceGames || 0;
                if (playerProfiles[player]) playerProfiles[player].gamesPlayed = gamesFromAttendance + opening;
                else playerProfiles[player] = { age: '—', position: '—', yearJoined: '—', gamesPlayed: gamesFromAttendance + opening, openingBalanceGames: 0 };
            }
        } catch(e) { console.warn(e); }
    }
    async function saveProfiles() { if(db && profilesRef) await profilesRef.set(playerProfiles); }
    async function saveTeams() { if(db && teamsRef) await teamsRef.set(teamAssignments); }
    async function savePayment(p) { if(db && paymentsRef) await paymentsRef.doc(`${p.player}_${p.gameDate}`).set(p); const idx = payments.findIndex(pay => pay.player === p.player && pay.gameDate === p.gameDate); if(idx !== -1) payments[idx] = p; else payments.push(p); }
    async function saveAttendance(a) {
        if(db && attendanceRef) await attendanceRef.doc(`${a.player}_${a.gameDate}`).set(a);
        const idx = attendance.findIndex(x => x.player === a.player && x.gameDate === a.gameDate);
        if(idx !== -1) attendance[idx] = a; else attendance.push(a);
        const gamesFromAttendance = attendance.filter(att => att.player === a.player && att.status === 'in').length;
        const opening = playerProfiles[a.player]?.openingBalanceGames || 0;
        if (playerProfiles[a.player]) playerProfiles[a.player].gamesPlayed = gamesFromAttendance + opening;
        else playerProfiles[a.player] = { age: '—', position: '—', yearJoined: '—', gamesPlayed: gamesFromAttendance + opening, openingBalanceGames: 0 };
        await saveProfiles();
        await updateCaptainForCurrentWeek();
        renderAllPages();
        updateHero();
    }
    async function saveComment(gameDate, author, text) {
        const comment = { gameDate, author, text, timestamp: Date.now() };
        if(db && commentsRef) await commentsRef.add(comment);
        if (!matchComments[gameDate]) matchComments[gameDate] = [];
        matchComments[gameDate].push(comment);
        renderHistoryPage();
    }
    async function saveCaptainRotation() { if(db && captainRef) await captainRef.set({ index: currentCaptainIndex, captain: weeklyCaptain, lastWeek: lastRotationWeek }); }
    
    function autoAssignTeams(weekDate) {
        const signed = attendance.filter(a => a.gameDate === weekDate && a.status === 'in').map(a => a.player);
        if (signed.length === 0) return;
        const shuffled = [...signed];
        for (let i = shuffled.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]]; }
        const mid = Math.ceil(shuffled.length / 2);
        if (!teamAssignments[weekDate]) teamAssignments[weekDate] = {};
        shuffled.slice(0, mid).forEach(p => teamAssignments[weekDate][p] = "yellow");
        shuffled.slice(mid).forEach(p => teamAssignments[weekDate][p] = "orange");
        saveTeams();
    }
    
    function loginAsPlayer(name) { currentUser = { name, role: "player" }; isAdminLoggedIn = false; localStorage.setItem("soccer_user", JSON.stringify(currentUser)); renderApp(); }
    function adminLogin(pw) { if(pw === "admin123") { currentUser = { name: "Admin", role: "admin" }; isAdminLoggedIn = true; localStorage.setItem("soccer_user", JSON.stringify(currentUser)); renderApp(); return true; } return false; }
    function logout() { currentUser = null; localStorage.removeItem("soccer_user"); renderLogin(); }
    async function setAttendance(status) {
        if (!currentUser) return;
        const currentWeek = getFutureWeeks()[0];
        if (!currentWeek) { alert("No upcoming matches scheduled"); return; }
        await saveAttendance({ player: currentUser.name, gameDate: currentWeek.dateStr, status: status });
    }
    
    function showEditProfileModal(playerName) {
        const existing = playerProfiles[playerName] || { age: '', position: POSITIONS[0], yearJoined: '', gamesPlayed: 0, openingBalanceGames: 0 };
        const modalDiv = document.createElement('div'); modalDiv.className = 'modal';
        modalDiv.innerHTML = `<div class="modal-content"><h3>✏️ Edit Profile</h3><label>Name</label><input id="editName" value="${escapeHtml(playerName)}"><label>Age</label><input id="editAge" value="${escapeHtml(existing.age || '')}"><label>Position</label><select id="editPosition">${POSITIONS.map(p => `<option ${existing.position === p ? 'selected' : ''}>${p}</option>`).join('')}</select><label>Year Joined</label><input id="editYear" value="${escapeHtml(existing.yearJoined || '')}"><label>Opening Games</label><input id="editOpeningGames" type="number" value="${existing.openingBalanceGames || 0}"><div class="flex-btns"><button id="saveBtn">Save</button><button id="cancelBtn" class="btn-outline">Cancel</button></div></div>`;
        document.body.appendChild(modalDiv);
        document.getElementById('saveBtn').onclick = async () => {
            const newName = document.getElementById('editName').value.trim();
            const newAge = document.getElementById('editAge').value.trim();
            const newPosition = document.getElementById('editPosition').value;
            const newYear = document.getElementById('editYear').value.trim();
            const newOpening = parseInt(document.getElementById('editOpeningGames').value) || 0;
            if (!newName) { alert("Name required"); return; }
            const gamesFromAttend = attendance.filter(a => a.player === playerName && a.status === 'in').length;
            const totalGames = gamesFromAttend + newOpening;
            if (newName !== playerName) {
                if (players.includes(newName)) { alert("Name exists"); return; }
                const idx = players.indexOf(playerName);
                if (idx !== -1) players[idx] = newName; else players.push(newName);
                players.sort();
                if (db && playersRef) await playersRef.set({ list: players });
                playerProfiles[newName] = { age: newAge || '—', position: newPosition, yearJoined: newYear || '—', gamesPlayed: totalGames, openingBalanceGames: newOpening };
                delete playerProfiles[playerName];
                if (currentUser?.name === playerName) currentUser.name = newName;
            } else {
                playerProfiles[playerName] = { ...playerProfiles[playerName], age: newAge || '—', position: newPosition, yearJoined: newYear || '—', gamesPlayed: totalGames, openingBalanceGames: newOpening };
            }
            await saveProfiles();
            modalDiv.remove();
            renderAllPages();
        };
        document.getElementById('cancelBtn').onclick = () => modalDiv.remove();
    }
    
    // Page Renderers
    function renderProfilesPage() {
        let html = `<div class="card"><h2>👤 Player Profiles</h2><div class="profile-grid">`;
        for(let player of players) {
            const p = playerProfiles[player] || { age: '—', position: '—', yearJoined: '—', gamesPlayed: 0 };
            const canEdit = (currentUser?.name === player) || isAdminLoggedIn;
            html += `<div class="profile-item"><div class="profile-header"><div class="profile-name">⚽ ${escapeHtml(player)}</div>${canEdit ? `<button class="edit-profile-btn" data-player="${escapeHtml(player)}" style="padding:6px 12px; font-size:12px;">Edit</button>` : ''}</div>
                <div class="profile-details"><span class="profile-badge">🎂 ${escapeHtml(p.age)}</span><span class="profile-badge">⚽ ${escapeHtml(p.position)}</span><span class="profile-badge">📅 ${escapeHtml(p.yearJoined)}</span><span class="profile-badge">🏆 ${p.gamesPlayed || 0} games</span></div></div>`;
        }
        html += `</div></div>`;
        document.getElementById("page-profiles").innerHTML = html;
        document.querySelectorAll(".edit-profile-btn").forEach(btn => btn.addEventListener("click", () => showEditProfileModal(btn.dataset.player)));
    }
    
    function renderScoreboardPage() {
        let stats = new Map();
        players.forEach(p => stats.set(p, { goals: 0, appearances: 0 }));
        attendance.forEach(a => { if(a.status === 'in') stats.get(a.player).appearances++; });
        for(let match of Object.values(matchResults)) if(match.goals) for(let [scorer, count] of Object.entries(match.goals)) if(stats.has(scorer)) stats.get(scorer).goals += count;
        const topGoals = Array.from(stats.entries()).map(([n,s]) => ({ name:n, goals:s.goals })).sort((a,b)=>b.goals - a.goals).slice(0,8);
        const topApps = Array.from(stats.entries()).map(([n,s]) => ({ name:n, apps:s.appearances + (playerProfiles[n]?.openingBalanceGames||0) })).sort((a,b)=>b.apps - a.apps).slice(0,8);
        document.getElementById("page-scoreboard").innerHTML = `<div class="card"><h2>🏆 Leaderboard</h2><div><h3>⚽ Top Scorers</h3><table class="data-table">${topGoals.map((p,i)=>`<tr><td>${i+1}</td><td><strong>${escapeHtml(p.name)}</strong></td><td>${p.goals} goals</td>`).join('')}</table></div><div style="margin-top:12px;"><h3>🏃 Most Games</h3><table class="data-table">${topApps.map((p,i)=>`<tr><td>${i+1}</td><td><strong>${escapeHtml(p.name)}</strong></td><td>${p.apps} games</td>`).join('')}</table></div></div>`;
    }
    
    function renderFinancePage() {
        if (!isAdminLoggedIn) { document.getElementById("page-finance").innerHTML = `<div class="card"><h2>💰 Finance</h2><p>🔒 Admin only</p></div>`; return; }
        const currentWeek = getFutureWeeks()[0];
        const totalCollected = payments.reduce((sum, p) => sum + 5, 0);
        let debts = [];
        for(let player of players) {
            let unpaid = 0;
            attendance.filter(a => a.player === player && a.status === 'in').forEach(g => { if(!payments.some(p => p.player === player && p.gameDate === g.gameDate)) unpaid += 5; });
            if(unpaid > 0) debts.push({ player, debt: unpaid });
        }
        let html = `<div class="card"><h2>💰 Financial Ledger</h2><div class="stat-card"><strong>🏦 Treasury: $${totalCollected}</strong></div>`;
        if (currentWeek) {
            const signed = attendance.filter(a => a.gameDate === currentWeek.dateStr && a.status === 'in').map(a => a.player);
            html += `<h3>📅 ${currentWeek.label}</h3><table class="data-table"><thead><tr><th>Player</th><th>Status</th><th>Action</th></tr></thead><tbody>`;
            for (let player of signed) {
                const isPaid = payments.some(p => p.player === player && p.gameDate === currentWeek.dateStr);
                html += `<tr><td>${escapeHtml(player)}</td><td>${isPaid ? '<span class="badge-paid">PAID</span>' : '<span class="badge-owing">OWING</span>'}</td>
                    <td>${!isPaid ? `<button class="markPaidBtn" data-player="${escapeHtml(player)}" data-date="${currentWeek.dateStr}" style="padding:6px 12px;">Mark Paid</button>` : '—'}</td></tr>`;
            }
            html += `</tbody></table>`;
        }
        html += `<h3>📜 Outstanding Debts</h3><table class="data-table">${debts.map(d=>`<tr><td>${escapeHtml(d.player)}</td><td class="badge-owing">$${d.debt}</td></tr>`).join('')||'<tr><td colspan="2">No debts! 🎉</td></tr>'}</table></div>`;
        document.getElementById("page-finance").innerHTML = html;
        document.querySelectorAll(".markPaidBtn").forEach(btn => btn.addEventListener("click", async () => { await savePayment({ player: btn.dataset.player, gameDate: btn.dataset.date, amount: 5 }); renderFinancePage(); }));
    }
    
    function renderTeamSelectPage() {
        const weeks = getFutureWeeks();
        if (!weeks.length) { document.getElementById("page-teamselect").innerHTML = `<div class="card"><h2>⚽ Team Selection</h2><p>No upcoming games</p></div>`; return; }
        const week = weeks[0];
        const signed = attendance.filter(a => a.gameDate === week.dateStr && a.status === 'in').map(a => a.player);
        let html = `<div class="card"><h2>⚽ Team Selection for ${week.label}</h2><div class="captain-card"><i class="fas fa-crown"></i> Captain: <strong>${weeklyCaptain}</strong><br><small>Only attending players can be captain</small></div>`;
        if(currentUser?.name === weeklyCaptain || isAdminLoggedIn) {
            html += `<button id="autoAssignBtn" class="btn-outline" style="margin-bottom:12px;">🎲 Auto-Balance</button><div id="teamAssignList"></div><button id="saveTeamsBtn">💾 Save Teams</button>`;
        } else {
            const assignments = teamAssignments[week.dateStr] || {};
            const yellow = Object.keys(assignments).filter(p => assignments[p] === "yellow");
            const orange = Object.keys(assignments).filter(p => assignments[p] === "orange");
            html += `<div class="rule-box">Only ${weeklyCaptain} or admin can assign teams.</div><div class="teams-flex"><div class="team-card-mini"><div class="team-name-yellow">🟡 YELLOW</div><div class="player-list-mini">${yellow.map(p=>`<span class="player-badge-mini">${escapeHtml(p)}</span>`).join('') || '—'}</div></div>
                <div class="team-card-mini"><div class="team-name-orange">🟠 ORANGE</div><div class="player-list-mini">${orange.map(p=>`<span class="player-badge-mini">${escapeHtml(p)}</span>`).join('') || '—'}</div></div></div>`;
        }
        html += `</div>`;
        document.getElementById("page-teamselect").innerHTML = html;
        if(currentUser?.name === weeklyCaptain || isAdminLoggedIn) {
            if(!teamAssignments[week.dateStr]) teamAssignments[week.dateStr] = {};
            const renderList = () => {
                let listHtml = `<h3>Assign Players:</h3>`;
                for(let player of signed) {
                    const current = teamAssignments[week.dateStr][player] || "";
                    listHtml += `<div style="display:flex; justify-content:space-between; margin:8px 0; background:#f1f5f9; border-radius:60px; padding:8px 12px;">
                        <span><strong>${escapeHtml(player)}</strong></span>
                        <select class="team-select" data-player="${escapeHtml(player)}"><option value="">—</option><option value="yellow" ${current==="yellow"?"selected":""}>🟡 Yellow</option><option value="orange" ${current==="orange"?"selected":""}>🟠 Orange</option></select></div>`;
                }
                document.getElementById("teamAssignList").innerHTML = listHtml;
                document.querySelectorAll(".team-select").forEach(sel => sel.addEventListener("change", () => { teamAssignments[week.dateStr][sel.dataset.player] = sel.value; }));
            };
            renderList();
            document.getElementById("autoAssignBtn")?.addEventListener("click", () => { autoAssignTeams(week.dateStr); renderTeamSelectPage(); });
            document.getElementById("saveTeamsBtn")?.addEventListener("click", async () => { await saveTeams(); alert("Teams saved!"); renderTeamSelectPage(); renderHistoryPage(); });
        }
    }
    
    async function renderHistoryPage() {
        const past = getPastWeeks();
        if (!past.length) { document.getElementById("page-history").innerHTML = `<div class="card"><h2>📖 Match History</h2><p>No past games</p></div>`; return; }
        let html = `<div class="card"><h2>📖 Match History</h2></div>`;
        for (let week of past.slice(0, 10)) {
            const assignments = teamAssignments[week.dateStr] || {};
            const yellow = Object.keys(assignments).filter(p => assignments[p] === "yellow");
            const orange = Object.keys(assignments).filter(p => assignments[p] === "orange");
            const match = matchResults[week.dateStr] || { yellowScore: 0, orangeScore: 0, goals: {} };
            const goals = match.goals || {};
            const yellowGoals = [], orangeGoals = [];
            for (let [player, count] of Object.entries(goals)) if (count>0) { if(yellow.includes(player)) yellowGoals.push({player,count}); else if(orange.includes(player)) orangeGoals.push({player,count}); }
            const comments = matchComments[week.dateStr] || [];
            const safeId = week.dateStr.replace(/-/g, '');
            html += `<div class="match-card"><div class="match-header"><div class="match-date">${week.label}</div><div class="match-result-badge">🟡 ${match.yellowScore} - ${match.orangeScore} 🟠</div></div>
                <div class="teams-section"><div class="teams-flex"><div class="team-card-mini"><div class="team-name-yellow">🟡 YELLOW</div><div class="player-list-mini">${yellow.map(p=>`<span class="player-badge-mini">${escapeHtml(p)}</span>`).join('')}</div></div>
                <div class="team-card-mini"><div class="team-name-orange">🟠 ORANGE</div><div class="player-list-mini">${orange.map(p=>`<span class="player-badge-mini">${escapeHtml(p)}</span>`).join('')}</div></div></div><div class="score-display-big">${match.yellowScore} - ${match.orangeScore}</div></div>
                <div class="goals-section"><div class="goals-title">⚽ Goals</div><div class="goals-list">${yellowGoals.map(g=>`<div class="goal-item">🟡 ${g.player} ×${g.count}</div>`).join('')}${orangeGoals.map(g=>`<div class="goal-item">🟠 ${g.player} ×${g.count}</div>`).join('')}</div></div>
                <div class="comments-section"><div>💬 Comments</div><div id="comments-${safeId}">${comments.map(c=>`<div class="comment-item"><strong>${escapeHtml(c.author)}</strong><div>${escapeHtml(c.text)}</div></div>`).join('')||'<div>No comments</div>'}</div>
                <div class="add-comment"><input id="commentInput-${safeId}" placeholder="Add comment..."><button onclick="window.addComment('${week.dateStr}')">Comment</button></div></div></div>`;
        }
        document.getElementById("page-history").innerHTML = html;
    }
    window.addComment = async function(gameDate) {
        const input = document.getElementById(`commentInput-${gameDate.replace(/-/g, '')}`);
        if(input?.value.trim()) { await saveComment(gameDate, currentUser.name, input.value.trim()); input.value = ""; renderHistoryPage(); }
    };
    
    function renderRSVPage() {
        const weeks = getFutureWeeks();
        if (!weeks.length) { document.getElementById("page-rsvp").innerHTML = `<div class="card"><h2>📋 RSVP</h2><p>No upcoming matches</p></div>`; return; }
        document.getElementById("page-rsvp").innerHTML = `<div class="card"><h2>📋 RSVP</h2><select id="rsvpWeek">${weeks.map(w=>`<option value="${w.dateStr}">${w.label}</option>`)}</select><select id="rsvpPlayer"><option>-- My Name --</option>${players.map(p=>`<option>${escapeHtml(p)}</option>`)}</select><div class="flex-btns"><button id="rsvpYesBtn">✅ I'm Playing</button><button id="rsvpNoBtn">❌ Can't Play</button></div><div id="rsvpMsg"></div></div><div class="card"><h2>Signed Players</h2><div id="attendeesList"></div></div>`;
        document.getElementById("rsvpYesBtn").onclick = async () => { const p = document.getElementById("rsvpPlayer").value; const w = document.getElementById("rsvpWeek").value; if(p && p !== "-- My Name --") { await saveAttendance({player:p, gameDate:w, status:"in"}); renderRSVPage(); renderProfilesPage(); } };
        document.getElementById("rsvpNoBtn").onclick = async () => { const p = document.getElementById("rsvpPlayer").value; const w = document.getElementById("rsvpWeek").value; if(p) { await saveAttendance({player:p, gameDate:w, status:"out"}); renderRSVPage(); } };
        document.getElementById("rsvpWeek").onchange = () => { const week = document.getElementById("rsvpWeek").value; const attending = attendance.filter(a => a.gameDate === week && a.status === 'in').map(a=>a.player); document.getElementById("attendeesList").innerHTML = `<div class="attendee-tags">${attending.map(p=>`<span class="attendee-tag">${escapeHtml(p)}</span>`).join('')||'<span>None'}</div>`; };
        const week = document.getElementById("rsvpWeek")?.value;
        if(week) { const attending = attendance.filter(a => a.gameDate === week && a.status === 'in').map(a=>a.player); document.getElementById("attendeesList").innerHTML = `<div class="attendee-tags">${attending.map(p=>`<span class="attendee-tag">${escapeHtml(p)}</span>`).join('')||'<span>None'}</div>`; }
    }
    
    function renderWeatherPage() {
        const nextMonday = new Date(); nextMonday.setDate(nextMonday.getDate() + ((1 + 7 - nextMonday.getDay()) % 7)); nextMonday.setHours(20,0,0,0);
        const formatted = nextMonday.toLocaleString('en-AU', { weekday:'long', day:'numeric', month:'long', hour:'2-digit', minute:'2-digit' });
        document.getElementById("page-weather").innerHTML = `<div class="card"><h2>🌤️ Match Forecast</h2><div class="weather-card"><div style="text-align:center;"><i class="fas ${weatherData.icon}" style="font-size:48px;"></i><h3>${weatherData.condition}</h3><h1 style="font-size:48px;">${weatherData.temp}</h1><p>🌧️ Rain: ${weatherData.rainChance}% | 💨 Wind: ${weatherData.wind} | 💧 Humidity: ${weatherData.humidity}</p><hr style="margin:12px 0;"><p><strong>${formatted}</strong><br>8:00pm AEST • Clifton Park, Brunswick</p></div></div></div>`;
    }
    
    function renderChatPage() {
        document.getElementById("page-chat").innerHTML = `<div class="card"><h2>💬 Live Chat</h2><div id="chatMsgs" style="height:350px; overflow-y:auto; background:#f8fafc; border-radius:16px; padding:12px;"></div><div style="display:flex; gap:8px; margin-top:12px;"><input id="chatInput" placeholder="Type..."><button id="chatSendBtn">Send</button></div></div>`;
        if(db) db.collection("messages").orderBy("timestamp","asc").onSnapshot(snap => { const c=document.getElementById("chatMsgs"); if(!c) return; let h=""; snap.forEach(d=>{ const m=d.data(); h+=`<div style="margin-bottom:10px;"><strong>${escapeHtml(m.name)}</strong><div style="background:white; border-radius:12px; padding:8px 10px; margin-top:4px;">${escapeHtml(m.message)}</div></div>`; }); c.innerHTML=h||"<div>No messages</div>"; c.scrollTop=c.scrollHeight; });
        document.getElementById("chatSendBtn").onclick = async () => { const msg = document.getElementById("chatInput").value.trim(); if(msg && db) { await db.collection("messages").add({ name: currentUser.name, message: msg, timestamp: firebase.firestore.FieldValue.serverTimestamp() }); document.getElementById("chatInput").value = ""; } };
    }
    
    function renderRulesPage() { document.getElementById("page-rules").innerHTML = `<div class="card"><h2>📜 Rules</h2><ul style="margin-left:20px; font-size:13px;"><li>⏰ 8:00pm SHARP kickoff</li><li>💰 $5 weekly fee - Admin collects</li><li>👑 Captain rotates - only attending players eligible</li><li>✅ RSVP is most important</li><li>🏆 Opening balance for historic games</li></ul></div>`; }
    
    function updateHero() {
        const nextWeek = getFutureWeeks()[0];
        const currentStatus = nextWeek ? attendance.find(a => a.gameDate === nextWeek.dateStr && a.player === currentUser?.name)?.status : null;
        document.getElementById("heroContainer").innerHTML = `<div class="hero-attendance"><h2><i class="fas fa-futbol"></i> ${nextWeek?.label || "This Monday"} • 8pm</h2><div class="kickoff">Clifton Park, Brunswick</div><div class="attendance-buttons"><button id="heroPlayBtn" class="btn-play">✅ I'M PLAYING</button><button id="heroSitBtn" class="btn-sit">❌ CAN'T PLAY</button></div><div style="margin-top:8px; font-size:12px;">${currentStatus === 'in' ? '✓ You are PLAYING' : (currentStatus === 'out' ? '✗ You are NOT PLAYING' : 'Tap above to set attendance')}</div></div>`;
        document.getElementById("heroPlayBtn")?.addEventListener("click", () => setAttendance("in"));
        document.getElementById("heroSitBtn")?.addEventListener("click", () => setAttendance("out"));
        document.getElementById("alertContainer").innerHTML = `<div class="alert-banner"><i class="fas fa-exclamation-triangle"></i> ${weeklyCaptain} is this week's Captain! Only attending players can be captain</div>`;
    }
    
    function renderAllPages() {
        renderProfilesPage();
        renderScoreboardPage();
        renderTeamSelectPage();
        renderHistoryPage();
        renderRSVPage();
        renderWeatherPage();
        renderChatPage();
        renderFinancePage();
        renderRulesPage();
        updateHero();
    }
    
    function initTabs() {
        const tabs = [
            { id: "profiles", icon: "fa-id-card", label: "Profile" },
            { id: "scoreboard", icon: "fa-trophy", label: "Stats" },
            { id: "teamselect", icon: "fa-users", label: "Teams" },
            { id: "history", icon: "fa-history", label: "History" },
            { id: "rsvp", icon: "fa-calendar", label: "RSVP" },
            { id: "weather", icon: "fa-cloud-sun", label: "Weather" },
            { id: "chat", icon: "fa-comments", label: "Chat" },
            { id: "finance", icon: "fa-dollar-sign", label: "Finance" },
            { id: "rules", icon: "fa-book", label: "Rules" }
        ];
        const bar = document.getElementById("bottomTabBar");
        bar.innerHTML = tabs.map(t => `<button class="tab-item" data-page="${t.id}"><i class="fas ${t.icon}"></i><span>${t.label}</span></button>`).join('');
        document.querySelectorAll(".tab-item").forEach(btn => {
            btn.addEventListener("click", () => {
                const pageId = btn.dataset.page;
                document.querySelectorAll(".page").forEach(p => p.classList.remove("active-page"));
                document.getElementById(`page-${pageId}`).classList.add("active-page");
                document.querySelectorAll(".tab-item").forEach(b => b.classList.remove("active"));
                btn.classList.add("active");
            });
        });
        document.querySelector(".tab-item").click();
    }
    
    function escapeHtml(str) { return String(str).replace(/[&<>]/g, m => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;' }[m])); }
    
    async function renderApp() {
        await loadData();
        await fetchMelbourneWeather();
        document.getElementById("userName").innerText = currentUser.role === "admin" ? "ADMIN" : currentUser.name;
        document.getElementById("logoutBtn").onclick = logout;
        renderAllPages();
        initTabs();
    }
    
    async function renderLogin() {
        await loadData();
        document.body.innerHTML = `<div style="background:white; border-radius:32px; padding:32px; max-width:380px; margin:60px auto; text-align:center;"><div style="width:56px; height:56px; background:#1a73e8; border-radius:20px; display:flex; align-items:center; justify-content:center; margin:0 auto 16px;"><i class="fas fa-futbol" style="font-size:28px; color:white;"></i></div><h2>Monday Night Soccer</h2><p style="margin-bottom:16px;">8pm Kickoff • Clifton Park, Brunswick</p><select id="playerSelect"><option>-- Select Player --</option>${players.map(p=>`<option>${escapeHtml(p)}</option>`)}</select><button id="playerLoginBtn" style="width:100%; margin-top:8px;">Enter as Player</button><hr style="margin:16px 0;"><input type="password" id="adminPw" placeholder="Admin Password"><button id="adminLoginBtn" style="width:100%; margin-top:8px;">Admin Login</button><div id="loginErr" style="color:red; margin-top:12px;"></div></div>`;
        document.getElementById("playerLoginBtn").onclick = () => { const n = document.getElementById("playerSelect").value; if(n && n !== "-- Select Player --") loginAsPlayer(n); else document.getElementById("loginErr").innerText = "Select name"; };
        document.getElementById("adminLoginBtn").onclick = () => { if(!adminLogin(document.getElementById("adminPw").value)) document.getElementById("loginErr").innerText = "Wrong password (admin123)"; };
    }
    
    (async () => {
        const stored = localStorage.getItem("soccer_user");
        if(stored) {
            try { const u = JSON.parse(stored); if(u.role==="admin"){ isAdminLoggedIn=true; currentUser={name:"Admin",role:"admin"}; } else { currentUser={name:u.name,role:"player"}; } await loadData(); renderApp(); return; } catch(e){}
        }
        renderLogin();
    })();
</script>
