<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Member's Lounge – Staff Availability</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #000000;
            color: #ffffff;
            font-family: 'Segoe UI', 'Roboto', sans-serif;
            line-height: 1.6;
            padding: 20px;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 2px solid #D4AF37;
            padding-bottom: 10px;
        }
        .tab-btn {
            background: #1E1E1E;
            border: none;
            padding: 10px 20px;
            cursor: pointer;
            color: #ffffff;
            border-radius: 8px 8px 0 0;
            transition: background 0.3s;
        }
        .tab-btn.active {
            background: #D4AF37;
            color: #000000;
            font-weight: bold;
        }
        .tab-pane {
            display: none;
        }
        .tab-pane.active {
            display: block;
        }
        .card {
            background: #1E1E1E;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid #333;
        }
        .card h2, .card h3 {
            color: #D4AF37;
            margin-bottom: 15px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            color: #B0B0B0;
        }
        input, select, button {
            padding: 10px;
            background: #2D2D2D;
            border: 1px solid #444;
            border-radius: 6px;
            color: #ffffff;
            font-size: 14px;
        }
        button {
            background: #D4AF37;
            color: #000000;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background: #C6A22E;
        }
        .btn-secondary {
            background: #444;
            color: white;
        }
        .date-list {
            max-height: 500px;
            overflow-y: auto;
            margin-top: 15px;
            border: 1px solid #333;
            border-radius: 8px;
        }
        .date-item {
            display: flex;
            align-items: center;
            padding: 10px;
            border-bottom: 1px solid #333;
        }
        .date-item label {
            flex: 1;
            margin: 0;
            cursor: pointer;
        }
        .date-item input {
            margin-right: 10px;
            transform: scale(1.2);
        }
        .employee-list {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 20px;
        }
        .employee-card {
            background: #2D2D2D;
            padding: 12px;
            border-radius: 8px;
            min-width: 280px;
        }
        .employee-card .name {
            font-weight: bold;
            color: #D4AF37;
            font-size: 1.1em;
        }
        .employee-card .sections {
            font-size: 0.8rem;
            color: #B0B0B0;
            margin: 5px 0;
        }
        .employee-card .link {
            font-family: monospace;
            background: #1E1E1E;
            padding: 4px;
            border-radius: 4px;
            word-break: break-all;
            margin: 5px 0;
            font-size: 12px;
        }
        .employee-card button {
            background: #ff4444;
            padding: 4px 8px;
            font-size: 12px;
            margin-top: 5px;
            margin-right: 5px;
        }
        .copy-btn {
            background: #D4AF37;
            color: #000;
            padding: 2px 6px;
            font-size: 11px;
            margin-left: 5px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }
        th, td {
            padding: 8px;
            text-align: left;
            border-bottom: 1px solid #333;
        }
        th {
            color: #D4AF37;
            position: sticky;
            top: 0;
            background: #1E1E1E;
        }
        .available-yes {
            background: #1e4620;
            color: #a5d6a5;
            padding: 2px 6px;
            border-radius: 4px;
            display: inline-block;
        }
        .available-no {
            background: #4a1c1c;
            color: #ffb3b3;
            padding: 2px 6px;
            border-radius: 4px;
            display: inline-block;
        }
        .section-filter {
            margin-bottom: 15px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .filter-btn {
            background: #2D2D2D;
            padding: 5px 12px;
            border-radius: 20px;
            cursor: pointer;
        }
        .filter-btn.active {
            background: #D4AF37;
            color: #000;
        }
        .success-msg, .error-msg {
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 15px;
        }
        .success-msg {
            background: #1e4620;
            color: #a5d6a5;
        }
        .error-msg {
            background: #4a1c1c;
            color: #ffb3b3;
        }
        .hidden {
            display: none;
        }
        .scrollable-table {
            overflow-x: auto;
        }
        .private-warning {
            background: #D4AF37;
            color: #000;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 20px;
        }
        @media (max-width: 768px) {
            .date-item {
                flex-wrap: wrap;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="tabs" id="tab-bar">
        <button class="tab-btn" data-tab="staff">Staff Availability</button>
        <button class="tab-btn" data-tab="admin">Admin Panel</button>
        <button class="tab-btn" data-tab="availability">Availability Matrix</button>
    </div>

    <!-- Staff Panel -->
    <div id="staff-pane" class="tab-pane">
        <div class="private-warning" id="private-message">
            You are using a private link.
        </div>
        <div class="card">
            <h2 id="staff-welcome"></h2>
            <div id="staff-message" class="hidden"></div>
            <div class="form-group">
                <label>Your Name</label>
                <input type="text" id="employee-name-display" readonly style="background:#444;">
            </div>
            <div class="form-group">
                <label>Your Sections</label>
                <div id="employee-sections-display"></div>
            </div>
            <div class="form-group">
                <label>Select Dates You Can Work</label>
                <div id="dates-container" class="date-list"></div>
            </div>
            <button id="submit-availability">Save My Availability</button>
        </div>
    </div>

    <!-- Admin Panel -->
    <div id="admin-pane" class="tab-pane">
        <div class="card">
            <h2>Manage Employees & Sections</h2>
            <div id="employee-list" class="employee-list"></div>
            <div style="display: flex; gap: 10px; flex-wrap: wrap;">
                <input type="text" id="new-employee-name" placeholder="Employee name" style="flex:1;">
                <div>
                    <label>Assign Sections:</label>
                    <div style="display: flex; gap: 10px; flex-wrap: wrap; margin-top: 5px;">
                        <label><input type="checkbox" value="kitchen"> Kitchen</label>
                        <label><input type="checkbox" value="floor"> Floor</label>
                        <label><input type="checkbox" value="bar"> Bar</label>
                        <label><input type="checkbox" value="cleaner"> Cleaner</label>
                        <label><input type="checkbox" value="setup"> Setup Crew</label>
                    </div>
                </div>
                <button id="add-employee" style="align-self: flex-end;">Add Employee</button>
            </div>
        </div>
        <div class="card">
            <h2>Manage Events</h2>
            <div style="display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 15px;">
                <input type="date" id="new-event-date" placeholder="YYYY-MM-DD">
                <input type="text" id="new-event-venue" placeholder="Venue name" style="flex:2;">
                <button id="add-event">Add Event</button>
            </div>
            <div id="event-list" style="margin-top: 10px; max-height: 300px; overflow-y: auto;">
                <!-- list of existing events with delete buttons -->
            </div>
        </div>
        <div class="card">
            <h2>Export Data</h2>
            <button id="export-csv">Export All Submissions (CSV)</button>
        </div>
    </div>

    <!-- Availability Matrix Panel -->
    <div id="availability-pane" class="tab-pane">
        <div class="card">
            <h2>Availability by Section & Event</h2>
            <div class="section-filter" id="section-filters">
                <button class="filter-btn active" data-section="all">All Sections</button>
                <button class="filter-btn" data-section="kitchen">Kitchen</button>
                <button class="filter-btn" data-section="floor">Floor</button>
                <button class="filter-btn" data-section="bar">Bar</button>
                <button class="filter-btn" data-section="cleaner">Cleaner</button>
                <button class="filter-btn" data-section="setup">Setup Crew</button>
            </div>
            <div class="scrollable-table" id="availability-matrix"></div>
        </div>
    </div>
</div>

<script>
    // ---------- DATA MODELS ----------
    let employees = [];        // { id, name, sections[] }
    let submissions = {};      // key: employeeId, value: array of eventIds where available
    let events = [];           // { id, date, venue } will be loaded from localStorage or default

    // Default events (44 from your list)
    const defaultEvents = [
        { id: '1', date: '2026-03-28', venue: 'Sala Reggio Ballroom' },
        { id: '2', date: '2026-04-18', venue: 'Fior Events' },
        { id: '3', date: '2026-05-09', venue: 'Fior Events' },
        { id: '4', date: '2026-05-17', venue: 'Sala Reggio Ballroom' },
        { id: '5', date: '2026-05-22', venue: 'Sala Reggio Ballroom' },
        { id: '6', date: '2026-05-23', venue: 'Sala Reggio Ballroom' },
        { id: '7', date: '2026-05-24', venue: 'Sala Reggio Ballroom' },
        { id: '8', date: '2026-05-29', venue: 'Sala Reggio Ballroom' },
        { id: '9', date: '2026-05-30', venue: 'Sala Reggio Ballroom' },
        { id: '10', date: '2026-05-31', venue: 'Sala Reggio Ballroom' },
        { id: '11', date: '2026-06-07', venue: 'Sala Reggio Ballroom' },
        { id: '12', date: '2026-06-07', venue: 'Fior Events' },
        { id: '13', date: '2026-06-12', venue: 'Sala Reggio Ballroom' },
        { id: '14', date: '2026-06-13', venue: 'Sala Reggio Ballroom' },
        { id: '15', date: '2026-06-20', venue: 'Sala Reggio Ballroom' },
        { id: '16', date: '2026-06-21', venue: 'Sala Reggio Ballroom' },
        { id: '17', date: '2026-07-19', venue: 'Sala Reggio Ballroom' },
        { id: '18', date: '2026-07-25', venue: 'Sala Reggio Ballroom' },
        { id: '19', date: '2026-07-25', venue: 'Fior Events' },
        { id: '20', date: '2026-07-26', venue: 'Sala Reggio Ballroom' },
        { id: '21', date: '2026-08-01', venue: 'Sala Reggio Ballroom' },
        { id: '22', date: '2026-08-02', venue: 'Sala Reggio Ballroom' },
        { id: '23', date: '2026-08-08', venue: 'Sala Reggio Ballroom' },
        { id: '24', date: '2026-08-15', venue: 'Sala Reggio Ballroom' },
        { id: '25', date: '2026-08-16', venue: 'Fior Events' },
        { id: '26', date: '2026-08-22', venue: 'Sala Reggio Ballroom' },
        { id: '27', date: '2026-08-23', venue: 'Sala Reggio Ballroom' },
        { id: '28', date: '2026-08-30', venue: 'Sala Reggio Ballroom' },
        { id: '29', date: '2026-09-13', venue: 'Sala Reggio Ballroom' },
        { id: '30', date: '2026-09-13', venue: 'Fior Events' },
        { id: '31', date: '2026-09-18', venue: 'Sala Reggio Ballroom' },
        { id: '32', date: '2026-09-20', venue: 'Fior Events' },
        { id: '33', date: '2026-10-03', venue: 'Fior Events' },
        { id: '34', date: '2026-10-17', venue: 'Sala Reggio Ballroom' },
        { id: '35', date: '2026-11-13', venue: 'Sala Reggio Ballroom' },
        { id: '36', date: '2026-11-21', venue: 'Sala Reggio Ballroom' },
        { id: '37', date: '2026-12-11', venue: 'Fior Events' },
        { id: '38', date: '2026-12-12', venue: 'Fior Events' },
        { id: '39', date: '2026-12-14', venue: 'Sala Reggio Ballroom' },
        { id: '40', date: '2026-12-15', venue: 'Sala Reggio Ballroom' },
        { id: '41', date: '2026-12-17', venue: 'Sala Reggio Ballroom' },
        { id: '42', date: '2027-02-27', venue: 'Fior Events' },
        { id: '43', date: '2027-02-28', venue: 'Fior Events' },
        { id: '44', date: '2027-03-27', venue: 'Fior Events' }
    ];

    // Helper: format date
    function formatDate(dateStr) {
        return new Date(dateStr).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
    }

    // Load/save data from localStorage
    function loadData() {
        const storedEmployees = localStorage.getItem('ml_employees');
        if (storedEmployees) {
            employees = JSON.parse(storedEmployees);
        } else {
            employees = [];
            saveEmployees();
        }

        const storedSubmissions = localStorage.getItem('ml_submissions');
        if (storedSubmissions) {
            submissions = JSON.parse(storedSubmissions);
        } else {
            submissions = {};
            saveSubmissions();
        }

        const storedEvents = localStorage.getItem('ml_events');
        if (storedEvents) {
            events = JSON.parse(storedEvents);
        } else {
            events = [...defaultEvents];
            saveEvents();
        }
        // Ensure events are sorted chronologically
        sortEvents();
    }

    function sortEvents() {
        events.sort((a, b) => new Date(a.date) - new Date(b.date));
    }

    function saveEvents() {
        localStorage.setItem('ml_events', JSON.stringify(events));
    }

    function saveEmployees() {
        localStorage.setItem('ml_employees', JSON.stringify(employees));
    }

    function saveSubmissions() {
        localStorage.setItem('ml_submissions', JSON.stringify(submissions));
    }

    // Add a new event
    function addEvent(date, venue) {
        if (!date || !venue) {
            alert('Please enter both date and venue');
            return false;
        }
        // Check for duplicate date+venue (optional)
        const exists = events.some(e => e.date === date && e.venue === venue);
        if (exists) {
            alert('Event already exists');
            return false;
        }
        const newId = Date.now().toString();
        events.push({ id: newId, date, venue });
        sortEvents();
        saveEvents();
        // After adding event, need to refresh all UI components
        refreshAllViews();
        return true;
    }

    // Delete an event
    function deleteEvent(eventId) {
        if (confirm('Delete this event? Staff availability for this event will also be removed.')) {
            events = events.filter(e => e.id !== eventId);
            // Remove this event from all submissions
            for (let empId in submissions) {
                submissions[empId] = submissions[empId].filter(eid => eid !== eventId);
            }
            saveEvents();
            saveSubmissions();
            refreshAllViews();
        }
    }

    // Refresh all UI after data changes
    function refreshAllViews() {
        renderAdminEmployees();
        renderAdminEventsList();
        renderDates();           // staff date list
        renderAvailabilityMatrix(document.querySelector('.filter-btn.active')?.dataset.section || 'all');
        // If currently viewing staff panel and an employee is selected, reload their availability
        if (currentEmployeeId) {
            loadEmployeeAvailability(currentEmployeeId);
        }
    }

    // Render admin event list with delete buttons
    function renderAdminEventsList() {
        const container = document.getElementById('event-list');
        if (!container) return;
        container.innerHTML = '';
        events.forEach(event => {
            const div = document.createElement('div');
            div.style.display = 'flex';
            div.style.justifyContent = 'space-between';
            div.style.alignItems = 'center';
            div.style.padding = '8px';
            div.style.borderBottom = '1px solid #333';
            div.innerHTML = `
                <span>${formatDate(event.date)} – ${event.venue}</span>
                <button class="delete-event" data-id="${event.id}" style="background:#ff4444; padding:2px 8px;">Delete</button>
            `;
            container.appendChild(div);
        });
        document.querySelectorAll('.delete-event').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const id = btn.getAttribute('data-id');
                deleteEvent(id);
            });
        });
    }

    // Render admin employee list with personal links
    function renderAdminEmployees() {
        const container = document.getElementById('employee-list');
        if (!container) return;
        container.innerHTML = '';
        employees.forEach(emp => {
            const personalLink = `${window.location.origin}${window.location.pathname}?employee=${encodeURIComponent(emp.name)}`;
            const card = document.createElement('div');
            card.className = 'employee-card';
            card.innerHTML = `
                <div class="name">${escapeHtml(emp.name)}</div>
                <div class="sections">Sections: ${emp.sections.length ? emp.sections.map(s => `<span style="background:#D4AF37;color:#000;padding:2px 4px;border-radius:3px;">${s}</span>`).join(' ') : 'None'}</div>
                <div class="link">${personalLink}</div>
                <button class="copy-link" data-link="${personalLink}">Copy Link</button>
                <button class="remove-emp" data-id="${emp.id}">Remove Employee</button>
            `;
            container.appendChild(card);
        });

        // Add copy link listeners
        document.querySelectorAll('.copy-link').forEach(btn => {
            btn.addEventListener('click', () => {
                const link = btn.getAttribute('data-link');
                navigator.clipboard.writeText(link);
                alert('Link copied to clipboard!');
            });
        });

        // Add remove listeners
        document.querySelectorAll('.remove-emp').forEach(btn => {
            btn.addEventListener('click', () => {
                const id = parseInt(btn.getAttribute('data-id'));
                if (confirm('Remove this employee? All their availability data will be lost.')) {
                    employees = employees.filter(e => e.id !== id);
                    delete submissions[id];
                    saveEmployees();
                    saveSubmissions();
                    renderAdminEmployees();
                    refreshAllViews();
                    // If current employee is removed, reset staff view
                    if (currentEmployeeId === id) {
                        currentEmployeeId = null;
                        document.getElementById('employee-name-display').value = '';
                        document.getElementById('employee-sections-display').innerHTML = '';
                    }
                }
            });
        });
    }

    // Render dates with checkboxes (staff panel)
    function renderDates() {
        const container = document.getElementById('dates-container');
        if (!container) return;
        container.innerHTML = '';
        events.forEach(event => {
            const div = document.createElement('div');
            div.className = 'date-item';
            div.innerHTML = `
                <input type="checkbox" data-id="${event.id}" id="date-${event.id}">
                <label for="date-${event.id}">${formatDate(event.date)} – ${event.venue}</label>
            `;
            container.appendChild(div);
        });
    }

    // Load employee's saved availability when viewing via personal link
    function loadEmployeeAvailability(employeeId) {
        const saved = submissions[employeeId] || [];
        const checkboxes = document.querySelectorAll('#dates-container input[type="checkbox"]');
        checkboxes.forEach(cb => {
            const eventId = cb.getAttribute('data-id');
            cb.checked = saved.includes(eventId);
        });
    }

    // Submit availability for the current employee (private link)
    function submitAvailability() {
        if (!currentEmployeeId) {
            showMessage('staff-message', 'No employee selected. Please use your personal link.', 'error');
            return;
        }
        const checkboxes = document.querySelectorAll('#dates-container input[type="checkbox"]');
        const selected = [];
        checkboxes.forEach(cb => {
            if (cb.checked) selected.push(cb.getAttribute('data-id'));
        });
        submissions[currentEmployeeId] = selected;
        saveSubmissions();
        const emp = employees.find(e => e.id === currentEmployeeId);
        showMessage('staff-message', `Availability saved for ${emp.name}. Thank you!`, 'success');
        renderAvailabilityMatrix(document.querySelector('.filter-btn.active')?.dataset.section || 'all');
    }

    function showMessage(containerId, text, type) {
        const container = document.getElementById(containerId);
        if (!container) return;
        container.textContent = text;
        container.className = type === 'success' ? 'success-msg' : 'error-msg';
        container.classList.remove('hidden');
        setTimeout(() => container.classList.add('hidden'), 3000);
    }

    // Render availability matrix
    function renderAvailabilityMatrix(sectionFilter = 'all') {
        const container = document.getElementById('availability-matrix');
        if (!container) return;

        let filteredEmployees = employees;
        if (sectionFilter !== 'all') {
            filteredEmployees = employees.filter(emp => emp.sections.includes(sectionFilter));
        }

        if (filteredEmployees.length === 0) {
            container.innerHTML = '<p>No employees in this section.</p>';
            return;
        }

        let html = '<div class="scrollable-table"><table style="min-width:600px;"><thead> tr><th>Event</th>';
        filteredEmployees.forEach(emp => {
            html += `<th>${escapeHtml(emp.name)}</th>`;
        });
        html += '</tr></thead><tbody>';

        events.forEach(event => {
            html += `<tr><td><strong>${formatDate(event.date)}<br>${event.venue}</strong></td>`;
            filteredEmployees.forEach(emp => {
                const available = (submissions[emp.id] || []).includes(event.id);
                html += `<td>${available ? '<span class="available-yes">✓</span>' : '<span class="available-no">✗</span>'}</td>`;
            });
            html += '</tr>';
        });
        html += '</tbody></table></div>';

        // Summary per section
        const sections = ['kitchen', 'floor', 'bar', 'cleaner', 'setup'];
        html += '<div style="margin-top:20px;"><h3>Summary by Section</h3>';
        sections.forEach(section => {
            const sectionEmployees = employees.filter(emp => emp.sections.includes(section));
            if (sectionEmployees.length === 0) return;
            html += `<h4>${section.charAt(0).toUpperCase() + section.slice(1)}</h4><div class="scrollable-table"><table><thead><tr><th>Event</th><th>Available / Total</th></tr></thead><tbody>`;
            events.forEach(event => {
                const availableCount = sectionEmployees.filter(emp => (submissions[emp.id] || []).includes(event.id)).length;
                const total = sectionEmployees.length;
                html += `<tr><td>${formatDate(event.date)} – ${event.venue}</td><td>${availableCount} / ${total}</td></tr>`;
            });
            html += '</tbody></table></div>';
        });
        html += '</div>';

        container.innerHTML = html;
    }

    // Add employee (admin)
    function addEmployee() {
        const nameInput = document.getElementById('new-employee-name');
        const name = nameInput.value.trim();
        if (!name) {
            alert('Please enter a name');
            return;
        }
        const sectionCheckboxes = document.querySelectorAll('#admin-pane input[type="checkbox"]:checked');
        const sections = Array.from(sectionCheckboxes).map(cb => cb.value);
        if (sections.length === 0) {
            alert('Please assign at least one section');
            return;
        }
        const newId = Date.now();
        employees.push({ id: newId, name, sections });
        saveEmployees();
        nameInput.value = '';
        sectionCheckboxes.forEach(cb => cb.checked = false);
        renderAdminEmployees();
        refreshAllViews();
    }

    // Export CSV
    function exportCSV() {
        let csv = 'Employee,Section,Event Date,Venue,Available\n';
        for (const emp of employees) {
            const empSections = emp.sections.join(';');
            const availableEvents = submissions[emp.id] || [];
            for (const event of events) {
                const isAvailable = availableEvents.includes(event.id);
                csv += `"${emp.name}","${empSections}","${formatDate(event.date)}","${event.venue}",${isAvailable ? 'Yes' : 'No'}\n`;
            }
        }
        const blob = new Blob([csv], { type: 'text/csv' });
        const a = document.createElement('a');
        const url = URL.createObjectURL(blob);
        a.href = url;
        a.download = 'staff-availability.csv';
        a.click();
        URL.revokeObjectURL(url);
    }

    // Tab switching
    function switchTab(tabId) {
        document.querySelectorAll('.tab-pane').forEach(pane => pane.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        document.getElementById(`${tabId}-pane`).classList.add('active');
        document.querySelector(`.tab-btn[data-tab="${tabId}"]`).classList.add('active');
        if (tabId === 'admin') {
            renderAdminEmployees();
            renderAdminEventsList();
        } else if (tabId === 'availability') {
            renderAvailabilityMatrix(document.querySelector('.filter-btn.active')?.dataset.section || 'all');
        }
    }

    // Section filter buttons
    function initFilters() {
        const filters = document.querySelectorAll('.filter-btn');
        filters.forEach(btn => {
            btn.addEventListener('click', () => {
                filters.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                const section = btn.getAttribute('data-section');
                renderAvailabilityMatrix(section);
            });
        });
    }

    // Escape HTML
    function escapeHtml(str) {
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    // ---------- PRIVATE LINK HANDLING ----------
    let currentEmployeeId = null;

    function checkUrlEmployee() {
        const params = new URLSearchParams(window.location.search);
        const empName = params.get('employee');
        if (empName) {
            const employee = employees.find(e => e.name === empName);
            if (employee) {
                currentEmployeeId = employee.id;
                document.getElementById('employee-name-display').value = employee.name;
                const sectionsDiv = document.getElementById('employee-sections-display');
                sectionsDiv.innerHTML = employee.sections.map(s => `<span class="role-badge" style="background:#D4AF37;color:#000;padding:4px 8px;border-radius:4px;margin-right:5px;">${s}</span>`).join('') || 'None';
                // Load their availability
                loadEmployeeAvailability(employee.id);
                // Automatically switch to staff tab
                switchTab('staff');
                return true;
            } else {
                document.getElementById('employee-name-display').value = 'Employee not found';
                document.getElementById('employee-sections-display').innerHTML = 'Please contact admin.';
                document.getElementById('submit-availability').disabled = true;
                return false;
            }
        }
        // If no employee in URL, maybe we are admin – we'll keep staff tab disabled? Or allow fallback.
        document.getElementById('employee-name-display').value = '';
        document.getElementById('employee-sections-display').innerHTML = 'Please use your personal link.';
        document.getElementById('submit-availability').disabled = true;
        return false;
    }

    // Initialize
    function init() {
        loadData();
        renderDates();
        initFilters();
        checkUrlEmployee();

        // Event listeners
        document.getElementById('submit-availability').addEventListener('click', submitAvailability);
        document.getElementById('add-employee').addEventListener('click', addEmployee);
        document.getElementById('export-csv').addEventListener('click', exportCSV);
        document.getElementById('add-event').addEventListener('click', () => {
            const date = document.getElementById('new-event-date').value;
            const venue = document.getElementById('new-event-venue').value.trim();
            if (addEvent(date, venue)) {
                document.getElementById('new-event-date').value = '';
                document.getElementById('new-event-venue').value = '';
            }
        });

        // Tab buttons
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                switchTab(btn.getAttribute('data-tab'));
            });
        });

        // Initial UI refresh
        renderAdminEmployees();
        renderAdminEventsList();
        renderAvailabilityMatrix('all');
    }

    init();
</script>
</body>
</html>
