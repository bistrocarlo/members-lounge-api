        body { font-family: 'Georgia', serif; background: #faf8f3; padding: 20px; }
        .container { max-width: 1600px; margin: 0 auto; }
        
        .header {
            background: linear-gradient(135deg, #c9a84c, #e8d5a8);
            border-radius: 24px;
            padding: 25px 30px;
            margin-bottom: 25px;
            text-align: center;
        }
        
        .header h1 { font-size: 1.8rem; color: #2c2418; }
        .header p { color: #5a4a35; margin-top: 8px; }
        
        .stats-bar {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }
        
        .stat {
            background: white;
            border-radius: 16px;
            padding: 12px 20px;
            flex: 1;
            text-align: center;
            border: 1px solid #e8dcc8;
        }
        
        .stat-number {
            font-size: 1.8rem;
            font-weight: bold;
            color: #c9a84c;
        }
        
        .toolbar {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
        }
        
        .btn {
            background: #c9a84c;
            border: none;
            padding: 10px 20px;
            border-radius: 30px;
            cursor: pointer;
            font-family: inherit;
            font-weight: 600;
            transition: all 0.2s;
        }
        
        .btn:hover { background: #b8953a; transform: translateY(-1px); }
        .btn-excel { background: #1e8449; color: white; }
        .btn-pdf { background: #e74c3c; color: white; }
        .btn-refresh { background: #3498db; color: white; }
        
        .tables-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        
        .table-card {
            background: white;
            border-radius: 16px;
            border: 2px solid #e8dcc8;
            overflow: hidden;
            transition: all 0.2s;
        }
        
        .table-card.bridal {
            border-color: #c9a84c;
            background: #fffcf5;
        }
        
        .table-card.loading {
            opacity: 0.6;
        }
        
        .table-header {
            background: #faf5ea;
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
        }
        
        .table-header.bridal {
            background: #fef5e0;
        }
        
        .table-title {
            font-size: 1.1rem;
        }
        
        .table-count {
            background: #c9a84c;
            color: white;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.8rem;
        }
        
        .table-guests {
            padding: 12px;
            min-height: 150px;
            max-height: 350px;
            overflow-y: auto;
        }
        
        .guest-item {
            padding: 8px 10px;
            margin: 4px 0;
            background: #fefcf8;
            border-radius: 10px;
            border: 1px solid #f0e6d8;
            font-size: 0.8rem;
        }
        
        .guest-name {
            font-weight: bold;
        }
        
        .guest-verified {
            font-size: 0.7rem;
            color: #666;
            margin-top: 3px;
        }
        
        .guest-count {
            display: inline-block;
            background: #e8dcc8;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 0.65rem;
            margin-left: 8px;
        }
        
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        
        .spinner {
            background: white;
            padding: 30px 40px;
            border-radius: 20px;
            text-align: center;
        }
        
        .spinner div {
            width: 40px;
            height: 40px;
            border: 4px solid #c9a84c;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #2c2418;
            color: white;
            padding: 10px 24px;
            border-radius: 40px;
            z-index: 1000;
            animation: fadeOut 3s forwards;
        }
        
        @keyframes fadeOut {
            0% { opacity: 1; }
            70% { opacity: 1; }
            100% { opacity: 0; visibility: hidden; }
        }
        
        .error-message {
            background: #fef5f5;
            border: 1px solid #e74c3c;
            border-radius: 16px;
            padding: 30px;
            text-align: center;
            margin: 20px;
        }
        
        .success-badge {
            background: #d5f5e3;
            color: #1e8449;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.7rem;
        }
        
        @media (max-width: 768px) {
            .tables-grid { grid-template-columns: 1fr; }
            .toolbar { flex-direction: column; align-items: stretch; }
        }
        
        @media print {
            body { background: white; padding: 0; margin: 0; }
            .toolbar, .stats-bar, .btn, .no-print { display: none; }
            .table-card { page-break-inside: avoid; }
        }

    // Load seating plan from Firebase
    async function loadSeatingFromFirebase() {
        try {
            // Try multiple possible locations where seating data might be stored
            const pathsToTry = [
                { collection: "wedding_seating", docId: "master" },
                { collection: "table_assignments", docId: "master_seating" },
                { collection: "seating_plan", docId: "current" },
                { collection: "wedding_guests", docId: "seating" }
            ];
            
            for (const path of pathsToTry) {
                try {
                    const docRef = doc(db, path.collection, path.docId);
                    const docSnap = await getDoc(docRef);
                    
                    if (docSnap.exists()) {
                        const data = docSnap.data();
                        
                        // Try different data structures
                        if (data.tableMap) {
                            return data.tableMap;
                        }
                        if (data.tables) {
                            return data.tables;
                        }
                        if (data.assignments) {
                            return data.assignments;
                        }
                        if (data.seating) {
                            return data.seating;
                        }
                    }
                } catch (e) {
                    // Continue to next path
                    console.log(`Path ${path.collection}/${path.docId} not found`);
                }
            }
            
            // Also try loading all documents from wedding_guests collection
            const guestsSnap = await getDocs(collection(db, "wedding_guests"));
            const guestsData = {};
            guestsSnap.forEach(doc => {
                guestsData[doc.id] = doc.data();
            });
            
            if (Object.keys(guestsData).length > 0) {
                return guestsData;
            }
            
            return null;
        } catch (err) {
            console.error("Firebase load error:", err);
            throw err;
        }
    }
    
    // Load guest responses (actual attendees)
    async function loadGuestResponses() {
        try {
            const responsesSnap = await getDocs(collection(db, "guest_responses"));
            const responses = [];
            responsesSnap.forEach(doc => {
                responses.push({ id: doc.id, ...doc.data() });
            });
            return responses;
        } catch (err) {
            console.log("No guest responses found:", err);
            return [];
        }
    }
    
    // Build guest list from seating data
    function buildGuestListFromSeating(seatingData, responses = []) {
        const guests = [];
        const tableMapLocal = new Map();
        
        // Handle different data structures
        if (seatingData && typeof seatingData === 'object') {
            for (const [tableId, tableData] of Object.entries(seatingData)) {
                let tableName = tableId;
                let guestsAtTable = [];
                
                if (tableData && tableData.guests && Array.isArray(tableData.guests)) {
                    guestsAtTable = tableData.guests;
                    tableName = tableData.name || (tableId === "bridal" ? "Bridal Table" : `Table ${tableId}`);
                } else if (tableData && typeof tableData === 'object') {
                    // If the value is a guest object itself
                    guestsAtTable = [tableData];
                } else if (typeof tableData === 'string') {
                    // If it's just a name
                    guestsAtTable = [{ name: tableData, guestCount: 1 }];
                }
                
                if (guestsAtTable.length > 0) {
                    tableMapLocal.set(tableId, {
                        id: tableId,
                        name: tableName,
                        guests: guestsAtTable.map(g => ({
                            name: g.name || g,
                            verified: g.verified || "",
                            guestCount: g.guestCount || 1,
                            notes: g.notes || ""
                        })),
                        isBridal: tableId === "bridal" || tableId === "Bridal" || tableId === "1"
                    });
                    
                    guestsAtTable.forEach(g => {
                        guests.push({
                            name: g.name || g,
                            verified: g.verified || "",
                            guestCount: g.guestCount || 1,
                            tableId: tableId
                        });
                    });
                }
            }
        }
        
        return { tableMapLocal, guests };
    }

    // Export to Excel
    function exportToExcel() {
        try {
            const excelData = [["TABLE", "GUEST NAME", "VERIFIED NAMES", "GUEST COUNT", "NOTES"]];
            
            const sorted = Array.from(tableMap.keys()).sort((a, b) => {
                if (a === "Bridal") return -1;
                if (b === "Bridal") return 1;
                const numA = parseInt(a) || 999;
                const numB = parseInt(b) || 999;
                return numA - numB;
            });
            
            for (const tableId of sorted) {
                const table = tableMap.get(tableId);
                for (const guest of table.guests) {
                    excelData.push([
                        table.name,
                        guest.name,
                        guest.verified || "",
                        guest.guestCount || 1,
                        guest.notes || ""
                    ]);
                }
            }
            
            const ws = XLSX.utils.aoa_to_sheet(excelData);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Table Allocations");
            ws['!cols'] = [{wch:20},{wch:40},{wch:40},{wch:12},{wch:30}];
            
            XLSX.writeFile(wb, `wedding_table_allocations_${new Date().toISOString().slice(0,10)}.xlsx`);
            showToast("✓ Excel file downloaded!");
        } catch (err) {
            showToast("Export failed: " + err.message, true);
        }
    }
    
    // Export to PDF
    function exportToPDF() {
        try {
            const sorted = Array.from(tableMap.keys()).sort((a, b) => {

    function escapeHtml(str) {
        if (!str) return "";
        return str.replace(/[&<>]/g, m => m === "&" ? "&amp;" : m === "<" ? "&lt;" : "&gt;");
    }
    
    // Render tables
    function renderTables() {
        const sorted = Array.from(tableMap.keys()).sort((a, b) => {
            if (a === "Bridal") return -1;
            if (b === "Bridal") return 1;
            const numA = parseInt(a) || 999;
            const numB = parseInt(b) || 999;
            return numA - numB;
        });
        
        let totalGroups = 0;
        let totalGuests = 0;
        
        for (const table of tableMap.values()) {
            totalGroups += table.guests.length;
            totalGuests += table.guests.reduce((sum, g) => sum + (g.guestCount || 1), 0);
        }
        
        document.getElementById('stats').innerHTML = `
            <div class="stat"><div class="stat-number">${tableMap.size}</div><div>Tables</div></div>
            <div class="stat"><div class="stat-number">${totalGroups}</div><div>Groups/Families</div></div>
            <div class="stat"><div class="stat-number">${totalGuests}</div><div>Total Guests</div></div>
            <div class="stat"><div class="stat-number success-badge">✓ Loaded</div><div>From Firebase</div></div>
        `;
        
        const grid = document.getElementById('tablesGrid');
        grid.innerHTML = '';
        
        for (const tableId of sorted) {
            const table = tableMap.get(tableId);
            const isBridal = tableId === "Bridal";
            const totalAtTable = table.guests.reduce((sum, g) => sum + (g.guestCount || 1), 0);
            
            const card = document.createElement('div');
            card.className = `table-card ${isBridal ? 'bridal' : ''}`;
            card.innerHTML = `
                <div class="table-header ${isBridal ? 'bridal' : ''}">
                    <span class="table-title">${escapeHtml(table.name)}</span>
                    <span class="table-count">${totalAtTable} guests</span>
                </div>
                <div class="table-guests">
                    ${table.guests.map(guest => `
                        <div class="guest-item">
                            <div class="guest-name">
                                ${escapeHtml(guest.name)}
                                ${guest.guestCount ? `<span class="guest-count">+${guest.guestCount}</span>` : ''}
                            </div>
                            ${guest.verified ? `<div class="guest-verified">${escapeHtml(guest.verified)}</div>` : ''}
                            ${guest.notes ? `<div class="guest-verified" style="color:#b7950b;">📝 ${escapeHtml(guest.notes)}</div>` : ''}
                        </div>
                    `).join('')}
                </div>
            `;
            grid.appendChild(card);
        }
    }
    
    // Main initialization
    async function init() {
        showLoading(true);
        
        try {
            // Try to load from Firebase first
            const seatingData = await loadSeatingFromFirebase();
            const responses = await loadGuestResponses();
            
            if (seatingData && Object.keys(seatingData).length > 0) {
                // Success - load from Firebase
                const { tableMapLocal, guests } = buildGuestListFromSeating(seatingData, responses);
                if (tableMapLocal.size > 0) {
                    tableMap = tableMapLocal;
                    showToast(`✓ Loaded ${tableMap.size} tables from Firebase`);
                } else {
                    // Fallback to local data
                    tableMap = getFallbackData();
                    showToast("⚠️ Using local backup (Firebase data was empty)", true);
                }
            } else {
                // No Firebase data - use local fallback
                tableMap = getFallbackData();
                showToast("📋 Using saved table allocations (Firebase not found)", true);
            }
        } catch (err) {
            console.error("Error loading:", err);
            // Fallback to local data
            tableMap = getFallbackData();
            showToast("⚠️ Using local backup - Firebase connection issue", true);
        }
        
        isLoading = false;
        renderTables();
        showLoading(false);
    }
    
    // Render app
    function renderApp() {
        document.getElementById('app').innerHTML = `
            <div class="container">
                <div class="header">
                    <h1>💍 Daniel & Laura's Wedding Table Allocations 💒</h1>
                    <p>Your saved seating plan - loaded from Firebase</p>
                </div>
                
                <div id="stats" class="stats-bar">
                    <div class="stat"><div class="stat-number">—</div><div>Loading...</div></div>
                </div>
                
                <div class="toolbar no-print">
                    <div>
                        <button class="btn btn-excel" onclick="exportToExcel()">📊 Export to Excel</button>
                        <button class="btn btn-pdf" onclick="exportToPDF()">🖨️ Print / Save as PDF</button>
                    </div>
                    <button class="btn btn-refresh" onclick="location.reload()">⟳ Refresh from Firebase</button>
                </div>
                
                <div id="tablesGrid" class="tables-grid">
                    <div style="text-align:center; padding:40px;">Loading your table allocations...</div>
                </div>
            </div>
        `;
        
        // Make functions global for onclick
        window.exportToExcel = exportToExcel;
        window.exportToPDF = exportToPDF;
        
        init();
    }
    
    renderApp();
</script>
</body>
</html>
