<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Monday Night Soccer | Clifton Park</title>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800;14..32,900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { background: #f0f4f8; font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; padding: 20px 16px 40px; min-height: 100vh; }
        button, .tab-btn, select, input, textarea { cursor: pointer; min-height: 48px; font-size: 16px; }
        .container { max-width: 720px; margin: 0 auto; }
        
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --accent: #f59e0b;
            --success: #10b981;
            --danger: #ef4444;
            --dark: #1e293b;
            --gray: #64748b;
            --light: #f8fafc;
            --border: #e2e8f0;
            --card: #ffffff;
        }
        
        .header { background: var(--card); border-radius: 28px; padding: 20px 16px; margin-bottom: 20px; box-shadow: 0 2px 12px rgba(0,0,0,0.04); border: 1px solid var(--border); text-align: center; }
        .logo-icon { width: 56px; height: 56px; background: linear-gradient(135deg, var(--primary), var(--primary-dark)); border-radius: 20px; display: inline-flex; align-items: center; justify-content: center; margin-bottom: 10px; box-shadow: 0 6px 14px rgba(37,99,235,0.25); }
        .logo-icon i { font-size: 28px; color: white; }
        .header h1 { font-size: 24px; font-weight: 800; color: var(--dark); letter-spacing: -0.3px; }
        .header p { font-size: 12px; color: var(--gray); margin-top: 4px; }
        .user-badge { background: var(--light); padding: 8px 18px; border-radius: 60px; display: inline-flex; align-items: center; gap: 12px; margin-top: 12px; font-weight: 600; font-size: 14px; border: 1px solid var(--border); }
        .user-badge button { background: var(--danger); border: none; padding: 6px 18px; border-radius: 40px; color: white; font-weight: 600; font-size: 13px; cursor: pointer; }
        
        .info-widget { background: linear-gradient(135deg, var(--dark), #0f172a); border-radius: 24px; padding: 14px 20px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; color: white; gap: 12px; }
        .weather-section { display: flex; align-items: center; gap: 12px; }
        .weather-icon-large { font-size: 36px; }
        .weather-temp-large { font-size: 28px; font-weight: 800; }
        .time-section { text-align: right; }
        .aest-time { font-size: 24px; font-weight: 800; font-family: monospace; }
        .venue-info { font-size: 11px; opacity: 0.8; margin-top: 4px; }
        
        .tab-nav { display: flex; gap: 8px; justify-content: center; margin-bottom: 20px; flex-wrap: wrap; }
        .tab-btn { background: white; border: 1.5px solid var(--border); padding: 12px 20px; border-radius: 60px; font-weight: 700; font-size: 14px; color: var(--gray); display: inline-flex; align-items: center; gap: 8px; cursor: pointer; transition: all 0.2s; }
        .tab-btn:hover { border-color: var(--primary); color: var(--primary); }
        .tab-btn.active { background: var(--primary); color: white; border-color: var(--primary); box-shadow: 0 4px 12px rgba(37,99,235,0.3); }
        
        .panel { display: none; }
        .panel.active-panel { display: block; animation: fadeIn 0.25s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        
        .card { background: var(--card); border-radius: 24px; padding: 20px; margin-bottom: 18px; border: 1px solid var(--border); box-shadow: 0 2px 8px rgba(0,0,0,0.03); }
        .card h2 { font-size: 18px; font-weight: 800; margin-bottom: 16px; color: var(--dark); border-left: 4px solid var(--primary); padding-left: 12px; }
        
        .match-scoreboard { background: linear-gradient(145deg, #0f172a, #1e2937); border-radius: 32px; padding: 28px 20px; position: relative; overflow: hidden; }
        .team-score-card { text-align: center; padding: 20px 10px; border-radius: 28px; }
        .team-score-number { font-size: 92px; font-weight: 900; line-height: 1; }
        .score-vs { font-size: 42px; font-weight: 800; color: #64748b; }
        
        .data-table { width: 100%; border-collapse: collapse; }
        .data-table th, .data-table td { padding: 12px 10px; text-align: left; border-bottom: 1px solid var(--border); font-size: 14px; }
        .data-table th { background: var(--light); color: var(--primary); font-weight: 800; }
        
        @media (max-width: 550px) { .team-score-number { font-size: 68px; } }
    </style>
</head>
<body>
<div class="container" id="appContainer">Loading...</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyCWlFqDJyENgrUOhiLXCjSEi4Mk_54SA1w",
        authDomain: "monday-night-soccer-hub.firebaseapp.com",
        projectId: "monday-night-soccer-hub",
        storageBucket: "monday-night-soccer-hub.firebasestorage.app",
        messagingSenderId: "634335208908",
        appId: "1:634335208908:web:dca705b65fc52de0606969"
    };
    
    let db = null;
    try { firebase.initializeApp(firebaseConfig); db = firebase.firestore(); } catch(e) { console.warn("Firebase fallback"); }
    
    let players = ["Alex Rowe", "Ali Mekawy", "Carlo", "Charlie", "Chris Del Monaco", "Chris M", "Chris S", "Danny", "Dante", "David", "Dimitri", "Enzo", "Farid", "Faros", "Frank", "George B", "George T", "Ivan", "James Zoumis", "James", "Joe T", "Joey", "Kia", "Leo", "Manoli", "Marco", "Mario", "Maurice", "Nector", "Paul", "Perri", "Peter", "Ralph", "Rocco", "Stav", "Stevan", "Theo", "Tony EH", "Vasilis"].sort();
    let teamAssignments = {}, matchResults = {}, payments = [], attendance = [], guests = [], matchComments = {};
    let isAdminLoggedIn = false, currentUser = null;
    const WEEKLY_FEE = 5;
    
    let greenScore = 0, orangeScore = 0;
    let timerSeconds = 0, timerRunning = false, matchTimer = null;
    let currentPeriod = 1;
    let matchEvents = [];
    
    function getMelbourneDate() {
        const now = new Date();
        const utc = now.getTime() + (now.getTimezoneOffset() * 60000);
        return new Date(utc + (11 * 3600000)).toISOString().split('T')[0];
    }
    
    function generateWeeks() {
        const year = new Date().getFullYear();
        let start = new Date(year, 0, 1);
        while (start.getDay() !== 1) start.setDate(start.getDate() + 1);
        let weeks = [], cur = new Date(start);
        let dec31 = new Date(year, 11, 31);
        let lastMonday = new Date(dec31);
        while (lastMonday.getDay() !== 1) lastMonday.setDate(lastMonday.getDate() - 1);
        let secondLast = new Date(lastMonday);
        secondLast.setDate(secondLast.getDate() - 7);
        while (cur <= secondLast) {
            weeks.push({ dateStr: cur.toISOString().split('T')[0], label: `Mon ${cur.toLocaleDateString('en-AU', { day:'numeric', month:'short' })}` });
            cur.setDate(cur.getDate() + 7);
        }
        return weeks;
    }
    const ALL_WEEKS = generateWeeks();
    function getFutureWeeks() { return ALL_WEEKS.filter(w => w.dateStr >= getMelbourneDate()); }
    function getPastWeeks() { return ALL_WEEKS.filter(w => w.dateStr < getMelbourneDate()).reverse(); }
    
    // ... (loadData, save functions, login, etc. remain the same as original)
    async function loadData() { /* same as original */ }
    async function savePlayers() { if(db) await db.collection("config").doc("players").set({ list: players }); }
    async function saveTeams() { if(db) await db.collection("config").doc("teamAssignments").set(teamAssignments); }
    async function saveResults() { if(db) await db.collection("config").doc("matchResults").set(matchResults); }
    async function savePayment(p) { if(db) await db.collection("payments").doc(`${p.player}_${p.gameDate}`).set(p); payments.push(p); }
    async function saveAttendance(a) { if(db) await db.collection("attendance").doc(`${a.player}_${a.gameDate}`).set(a); }
    async function saveGuest(g) { if(db) await db.collection("guests").doc(`${g.guestName}_${g.gameDate}`).set(g); guests.push(g); }
    async function saveComment(gameDate, author, text) { 
        const comment = { gameDate, author, text, timestamp: Date.now() }; 
        if(db) await db.collection("matchComments").add(comment); 
        if (!matchComments[gameDate]) matchComments[gameDate] = []; 
        matchComments[gameDate].push(comment); 
    }
    
    function loginPlayer(name) { currentUser = { name, role: "player" }; isAdminLoggedIn = false; localStorage.setItem("soccer_user", JSON.stringify(currentUser)); renderApp(); }
    function loginAdmin(pw) { if(pw === "admin123") { currentUser = { name: "Admin", role: "admin" }; isAdminLoggedIn = true; localStorage.setItem("soccer_user", JSON.stringify(currentUser)); renderApp(); return true; } return false; }
    function logout() { if(matchTimer) clearInterval(matchTimer); currentUser = null; localStorage.removeItem("soccer_user"); renderLogin(); }
    
    function formatSec(sec) { const m = Math.floor(sec / 60); const s = sec % 60; return `${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`; }
    
    function updateScoreUI() {
        const greenEl = document.getElementById('greenScoreVal');
        const orangeEl = document.getElementById('orangeScoreVal');
        const timerEl = document.getElementById('timerVal');
        if(greenEl) greenEl.textContent = greenScore;
        if(orangeEl) orangeEl.textContent = orangeScore;
        if(timerEl) timerEl.textContent = formatSec(timerSeconds);
    }
    
    function startTimer() { 
        if(matchTimer) clearInterval(matchTimer); 
        timerRunning = true; 
        matchTimer = setInterval(() => { 
            if(timerRunning) { 
                timerSeconds++; 
                updateScoreUI(); 
                if (timerSeconds >= 1500 && currentPeriod === 1) {
                    currentPeriod = 2;
                    const pd = document.getElementById("periodDisplay");
                    if(pd) pd.textContent = "2nd HALF";
                }
            } 
        }, 1000); 
    }
    function pauseTimer() { timerRunning = false; }
    function resetTimer() { 
        timerRunning = false; timerSeconds = 0; greenScore = 0; orangeScore = 0; currentPeriod = 1; matchEvents = []; 
        if(matchTimer) clearInterval(matchTimer); 
        updateScoreUI(); 
    }
    
    function toggleTimer() {
        const btn = document.getElementById("startPauseBtn");
        if (timerRunning) {
            pauseTimer();
            btn.textContent = "▶ RESUME";
            btn.style.background = "#f59e0b";
        } else {
            startTimer();
            btn.textContent = "⏸ PAUSE";
            btn.style.background = "#10b981";
        }
    }
    
    function addGoal(team) {
        const week = getMelbourneDate();
        const assign = teamAssignments[week] || {};
        const playersOnTeam = Object.keys(assign).filter(p => assign[p] === team);
        
        let player = prompt(`Who scored for ${team.toUpperCase()}?`, playersOnTeam[0] || currentUser.name);
        if (!player) return;
    
        if (team === "green") greenScore++;
        else orangeScore++;
    
        matchEvents.push({
            team: team,
            player: player,
            time: formatSec(timerSeconds),
            period: currentPeriod
        });
    
        updateScoreUI();
        renderGoalHistory();
    }
    
    function undoLastGoal() {
        if (matchEvents.length === 0) return;
        const last = matchEvents.pop();
        if (last.team === "green") greenScore = Math.max(0, greenScore - 1);
        else orangeScore = Math.max(0, orangeScore - 1);
        updateScoreUI();
        renderGoalHistory();
    }
    
    function renderGoalHistory() {
        const container = document.getElementById("goalHistory");
        if (!container) return;
        let html = "";
        matchEvents.slice().reverse().forEach(ev => {
            const color = ev.team === "green" ? "#22c55e" : "#f97316";
            html += `<div style="padding:10px; background:rgba(255,255,255,0.08); border-radius:16px; margin-bottom:8px; display:flex; align-items:center; gap:12px;">
                <span style="font-size:22px;">${ev.team === "green" ? "🟢" : "🟠"}</span>
                <div style="flex:1;">
                    <strong style="color:${color}">${ev.player}</strong><br>
                    <small>${ev.period} • ${ev.time}</small>
                </div>
            </div>`;
        });
        container.innerHTML = html || `<div style="text-align:center; padding:30px; color:#64748b;">No goals yet...</div>`;
    }
    
    function resetMatch() {
        if (!confirm("Reset entire match?")) return;
        resetTimer();
        renderMatch();
    }
    
    async function renderApp() {
        await loadData();
        document.getElementById("appContainer").innerHTML = `
            <div class="header"><div class="logo-icon"><i class="fas fa-futbol"></i></div><h1>MONDAY NIGHT SOCCER</h1><p>Clifton Park, Brunswick • Victoria Street, Melbourne</p><div class="user-badge"><i class="fas fa-user-circle"></i> ${currentUser.role === "admin" ? "ADMIN" : currentUser.name}<button id="logoutBtn">Exit</button></div></div>
            <div class="info-widget"><div class="weather-section"><div class="weather-icon-large">☀️</div><div><div class="weather-temp-large">18°C</div><div class="weather-detail">Partly Cloudy</div></div></div><div class="time-section"><div class="aest-time" id="aestTime">--:--:--</div><div class="aest-date" id="aestDate">Loading...</div><div class="venue-info"><i class="fas fa-map-pin"></i> Clifton Park, VIC</div></div></div>
            <div class="tab-nav" id="tabNav"></div><div id="panelContainer"></div>
        `;
        document.getElementById("logoutBtn").onclick = logout;
        setInterval(() => {
            const now = new Date();
            const melb = new Date(now.getTime() + (now.getTimezoneOffset() * 60000) + (11 * 3600000));
            document.getElementById('aestTime').textContent = melb.toLocaleTimeString('en-AU', { hour:'2-digit', minute:'2-digit', second:'2-digit' });
        }, 1000);
    
        const tabs = [
            { id: "match", label: "MATCH", icon: "fa-stopwatch" },
            { id: "rsvp", label: "RSVP", icon: "fa-calendar" },
            { id: "teams", label: "TEAMS", icon: "fa-users" },
            { id: "standings", label: "STANDINGS", icon: "fa-table" },
            { id: "chat", label: "CHAT", icon: "fa-comments" },
            { id: "history", label: "HISTORY", icon: "fa-history" },
            { id: "stats", label: "LEADERS", icon: "fa-trophy" },
            { id: "rules", label: "RULES", icon: "fa-book" }
        ];
        if (isAdminLoggedIn) tabs.unshift({ id: "admin", label: "ADMIN", icon: "fa-shield" }, { id: "finance", label: "FINANCE", icon: "fa-dollar-sign" });
        
        document.getElementById("tabNav").innerHTML = tabs.map(t => `<button class="tab-btn" data-tab="${t.id}"><i class="fas ${t.icon}"></i> ${t.label}</button>`).join('');
        document.getElementById("panelContainer").innerHTML = tabs.map(t => `<div id="panel-${t.id}" class="panel"></div>`).join('');
        
        document.querySelectorAll(".tab-btn").forEach(btn => {
            btn.onclick = () => {
                document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
                btn.classList.add("active");
                document.querySelectorAll(".panel").forEach(p => p.classList.remove("active-panel"));
                document.getElementById(`panel-${btn.dataset.tab}`).classList.add("active-panel");
                
                const id = btn.dataset.tab;
                if (id === "match") renderMatch();
                if (id === "rsvp") renderRSVP();
                if (id === "teams") renderTeams();
                if (id === "standings") renderStandings();
                if (id === "chat") renderChat();
                if (id === "history") renderHistory();
                if (id === "stats") renderStats();
                if (id === "rules") renderRules();
                if (id === "admin" && isAdminLoggedIn) renderAdmin();
                if (id === "finance" && isAdminLoggedIn) renderFinance();
            };
        });
        document.querySelector(".tab-btn").click();
    }
    
    function renderMatch() {
        document.getElementById("panel-match").innerHTML = `
            <div class="match-scoreboard">
                <div style="position:absolute; top:12px; right:20px; background:rgba(255,255,255,0.1); padding:4px 12px; border-radius:30px; font-size:13px; color:#94a3b8;" id="periodDisplay">1st HALF</div>
                
                <div class="score-panel" style="display:flex; justify-content:center; align-items:center; gap:30px; margin:20px 0 30px;">
                    <div class="team-score-card" style="background:rgba(34,197,94,0.18); border:3px solid #22c55e; min-width:140px;">
                        <div style="color:#22c55e; font-weight:900; font-size:18px; margin-bottom:8px;">🟢 GREENS</div>
                        <div class="team-score-number" id="greenScoreVal" style="color:#f0fdf4;">0</div>
                    </div>
                    <div class="score-vs">VS</div>
                    <div class="team-score-card" style="background:rgba(249,115,22,0.15); border:3px solid #f97316; min-width:140px;">
                        <div style="color:#f97316; font-weight:900; font-size:18px; margin-bottom:8px;">🟠 ORANGE</div>
                        <div class="team-score-number" id="orangeScoreVal" style="color:#fff7ed;">0</div>
                    </div>
                </div>
                
                <div style="text-align:center; margin:20px 0;">
                    <div class="timer-display" id="timerVal" style="font-size:62px; padding:18px 42px; background:rgba(0,0,0,0.5); border-radius:60px; display:inline-block; min-width:220px;">00:00</div>
                </div>
                
                <div class="card" style="margin:24px 0; background:rgba(255,255,255,0.08); border:none; color:white;">
                    <h3 style="color:white; margin-bottom:12px;">⚽ Goal History</h3>
                    <div id="goalHistory" style="max-height:180px; overflow-y:auto; padding:8px;"></div>
                </div>
                
                <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:20px;">
                    <button onclick="addGoal('green')" style="background:#22c55e; color:#052e16; padding:16px; font-size:17px; font-weight:700; border-radius:20px;">🟢 GREENS GOAL</button>
                    <button onclick="addGoal('orange')" style="background:#f97316; color:white; padding:16px; font-size:17px; font-weight:700; border-radius:20px;">🟠 ORANGE GOAL</button>
                </div>
                
                <div style="display:flex; gap:10px; margin-top:16px; flex-wrap:wrap;">
                    <button onclick="toggleTimer()" id="startPauseBtn" style="background:#10b981; flex:1; padding:12px;">▶ START</button>
                    <button onclick="undoLastGoal()" style="background:#64748b; padding:12px 20px;">↩ Undo</button>
                    <button onclick="resetMatch()" style="background:#ef4444; padding:12px 20px;">RESET</button>
                </div>
            </div>
        `;
        updateScoreUI();
        renderGoalHistory();
    }
    
    // Add all other render functions (renderRSVP, renderTeams, renderStandings, etc.)
    // For brevity I kept only the new/changed ones above. The rest are identical to your original file.
    
    async function renderStandings() {
        const startDate = "2026-02-01";
        const pastMatches = ALL_WEEKS.filter(w => w.dateStr >= startDate && w.dateStr < getMelbourneDate());
        
        let greens = { played: 0, wins: 0, draws: 0, losses: 0, gf: 0, ga: 0, points: 0 };
        let orange = { played: 0, wins: 0, draws: 0, losses: 0, gf: 0, ga: 0, points: 0 };
    
        pastMatches.forEach(week => {
            const result = matchResults[week.dateStr];
            if (!result) return;
            const gScore = result.greenScore !== undefined ? result.greenScore : (result.yellowScore || 0);
            const oScore = result.orangeScore || 0;
    
            greens.played++; orange.played++;
            greens.gf += gScore; greens.ga += oScore;
            orange.gf += oScore; orange.ga += gScore;
    
            if (gScore > oScore) { greens.wins++; greens.points += 3; }
            else if (oScore > gScore) { orange.wins++; orange.points += 3; }
            else { greens.draws++; orange.draws++; greens.points += 1; orange.points += 1; }
    
            greens.losses = greens.played - greens.wins - greens.draws;
            orange.losses = orange.played - orange.wins - orange.draws;
        });
    
        const gdGreen = greens.gf - greens.ga;
        const gdOrange = orange.gf - orange.ga;
    
        document.getElementById("panel-standings").innerHTML = `
            <div class="card">
                <h2><i class="fas fa-table"></i> 2026 Season Standings</h2>
                <table class="data-table">
                    <thead>
                        <tr><th>Team</th><th>P</th><th>W</th><th>D</th><th>L</th><th>GF</th><th>GA</th><th>GD</th><th style="text-align:right">Pts</th></tr>
                    </thead>
                    <tbody>
                        <tr style="background:rgba(34,197,94,0.08);">
                            <td><strong style="color:#22c55e;">🟢 GREENS</strong></td>
                            <td>${greens.played}</td><td>${greens.wins}</td><td>${greens.draws}</td><td>${greens.losses}</td>
                            <td>${greens.gf}</td><td>${greens.ga}</td><td>${gdGreen >= 0 ? '+' : ''}${gdGreen}</td>
                            <td style="text-align:right; font-weight:900; color:#22c55e;">${greens.points}</td>
                        </tr>
                        <tr style="background:rgba(249,115,22,0.08);">
                            <td><strong style="color:#f97316;">🟠 ORANGE</strong></td>
                            <td>${orange.played}</td><td>${orange.wins}</td><td>${orange.draws}</td><td>${orange.losses}</td>
                            <td>${orange.gf}</td><td>${orange.ga}</td><td>${gdOrange >= 0 ? '+' : ''}${gdOrange}</td>
                            <td style="text-align:right; font-weight:900; color:#f97316;">${orange.points}</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        `;
    }
    
    // Keep all your original functions: renderRSVP, renderTeams, renderChat, renderHistory, renderStats, renderRules, renderAdmin, renderFinance, renderLogin, etc.
    // (They are unchanged except for the green/yellow references in history if needed)
    
    window.addGoal = addGoal;
    window.undoLastGoal = undoLastGoal;
    window.toggleTimer = toggleTimer;
    window.resetMatch = resetMatch;
    
    (async () => {
        const stored = localStorage.getItem("soccer_user");
        if(stored) {
            try { 
                const u = JSON.parse(stored); 
                if(u.role==="admin"){ isAdminLoggedIn=true; currentUser={name:"Admin",role:"admin"}; } 
                else { currentUser={name:u.name,role:"player"}; } 
                await loadData(); 
                renderApp(); 
                return; 
            } catch(e){}
        }
        renderLogin();
    })();
</script>
</body>
</html>
