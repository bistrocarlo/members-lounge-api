    // Table definitions: 32 tables + Bridal
    function initTables() {
        tables.clear();
        tables.set("Bridal", { name: "👰 BRIDAL TABLE 🤵", guests: [] });
        for (let i = 1; i <= 32; i++) {
            tables.set(i.toString(), { name: `TABLE ${i}`, guests: [] });

    // Load stored assignments from localStorage
    function loadAssignments() {
        const stored = localStorage.getItem("wedding_table_assignments");
        if (stored) {
            try {
                const parsed = JSON.parse(stored);
                tableAssignments = new Map(parsed);
            } catch(e) {}
        }
        const storedTables = localStorage.getItem("wedding_tables_data");
        if (storedTables) {
            try {
                const parsedTables = JSON.parse(storedTables);
                for (let [tid, data] of Object.entries(parsedTables)) {
                    if (tables.has(tid)) tables.set(tid, data);
                }
            } catch(e) {}
        }
        // Sync tables based on assignments
        for (let [tid, table] of tables.entries()) table.guests = [];
        for (let [guestId, tid] of tableAssignments.entries()) {
            const guest = allGuests.find(g => g.id === guestId) || manualGuests.find(g => g.id === guestId);
            if (guest && tables.has(tid)) tables.get(tid).guests.push(guest);
        }
    }

    function saveAssignments() {
        const assignmentsArray = Array.from(tableAssignments.entries());
        localStorage.setItem("wedding_table_assignments", JSON.stringify(assignmentsArray));
        const tablesObj = {};
        for (let [tid, table] of tables.entries()) tablesObj[tid] = { name: table.name, guests: table.guests };
        localStorage.setItem("wedding_tables_data", JSON.stringify(tablesObj));
    }

    function assignGuestToTable(guest, tableId) {
        const table = tables.get(tableId);
        if (!table) return false;
        const oldTableId = tableAssignments.get(guest.id);
        if (oldTableId) {
            const oldTable = tables.get(oldTableId);
            if (oldTable) oldTable.guests = oldTable.guests.filter(g => g.id !== guest.id);
        }
        table.guests.push(guest);
        tableAssignments.set(guest.id, tableId);
        saveAssignments();
        renderApp();
        showToast(`${guest.name} assigned to ${table.name}`);
        return true;
    }

    function removeGuestFromTable(guestId, tableId) {
        const table = tables.get(tableId);
        if (table) {
            table.guests = table.guests.filter(g => g.id !== guestId);
            tableAssignments.delete(guestId);
            saveAssignments();
            renderApp();
            showToast("Guest removed from table");
        }
    }

            name: name,
            group: "Manual Entry",
            address: address,
            guestCount: parseInt(guestCount) || 1,
            isManual: true

        manualGuests.push(newGuest);
        allGuests.push(newGuest);
        saveManualGuests();
        renderApp();
        showToast(`Added ${name}`);
        return newGuest;
    }

        }
    }

        return allGuests.reduce((sum, g) => sum + (g.guestCount || 1), 0);
    }

        let seated = 0;
        for (let table of tables.values()) seated += table.guests.reduce((s, g) => s + (g.guestCount || 1), 0);

    function exportToCSV() {
        const rows = [["Table Name", "Guest Name", "Group", "Postal Address", "Guest Count", "Notes"]];
        for (let [tid, table] of tables.entries()) {
            for (let guest of table.guests) {
                rows.push([table.name, guest.name, guest.group || "", guest.address || "", guest.guestCount || 1, guest.notes || ""]);

        for (let g of unassigned) rows.push(["UNASSIGNED", g.name, g.group || "", g.address || "", g.guestCount || 1, g.notes || ""]);
        const csvContent = rows.map(row => row.map(cell => `"${String(cell).replace(/"/g, '""')}"`).join(",")).join("\n");
        const blob = new Blob(["\uFEFF" + csvContent], {type: "text/csv"});
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = `wedding_seating_${new Date().toISOString().slice(0,10)}.csv`;
        link.click();
        URL.revokeObjectURL(link);
        showToast("CSV exported");
    }

    function exportToExcel() {
        const wsData = [["Table", "Guest Name", "Group", "Address", "Guest Count", "Notes"]];
        for (let [tid, table] of tables.entries()) {
            for (let guest of table.guests) {
                wsData.push([table.name, guest.name, guest.group || "", guest.address || "", guest.guestCount || 1, guest.notes || ""]);
            }
        }
        const ws = XLSX.utils.aoa_to_sheet(wsData);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "Table Plan");
        XLSX.writeFile(wb, `wedding_plan_${new Date().toISOString().slice(0,10)}.xlsx`);
        showToast("Excel exported");
    }

    function showToast(msg) {
        let t = document.querySelector(".toast");
        if (t) t.remove();
        t = document.createElement("div");
        t.className = "toast";
        t.innerText = msg;
        document.body.appendChild(t);
        setTimeout(() => t.remove(), 2500);
    }

    function escapeHtml(str) { if (!str) return ""; return str.replace(/[&<>]/g, m => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;' }[m])); }

    // Render full UI
    function renderApp() {
        const unassigned = getUnassignedGuests();
        const totalGuests = getTotalGuestCount();
        const seated = getSeatedCount();
        const tablesArray = Array.from(tables.entries()).sort((a,b) => {
            if (a[0] === "Bridal") return 1;
            if (b[0] === "Bridal") return -1;
            return parseInt(a[0]) - parseInt(b[0]);
        });

        document.getElementById("app").innerHTML = `
            <div class="planner-container">
                <div class="wedding-header">
                    <h1>💍 Daniel & Laura · Wedding Planner 💒</h1>
                    <p>Table seating · Postal invitations · Guest management</p>
                </div>
                <div class="stats-dashboard">
                    <div class="stat-card"><div class="stat-number">${allGuests.length}</div><div>Total Groups</div></div>
                    <div class="stat-card"><div class="stat-number">${totalGuests}</div><div>Total Guests</div></div>
                    <div class="stat-card"><div class="stat-number">${seated}</div><div>Seated</div></div>
                    <div class="stat-card"><div class="stat-number">${unassigned.length}</div><div>Unassigned</div></div>
                    <div class="stat-card"><div class="stat-number">${tables.size}</div><div>Tables</div></div>
                </div>
                <div class="tabs-nav">
                    <button class="tab-btn active" data-tab="seating">🍽️ Table Seating</button>
                    <button class="tab-btn" data-tab="guests">👥 Guest Manager</button>
                    <button class="tab-btn" data-tab="invitations">✉️ Invitations & Printing</button>
                    <button class="tab-btn" data-tab="export">📎 Export Data</button>
                </div>
                <!-- SEATING PANE -->
                <div id="seating" class="tab-pane active">
                    <div style="margin-bottom:20px; display:flex; gap:12px; flex-wrap:wrap;">
                        <button class="btn btn-primary" id="resetSeatingBtn">⟳ Reset All Seats</button>
                    </div>
                    <div class="tables-grid" id="tablesGrid"></div>
                    <div class="guest-list-panel" style="margin-top:25px;">
                        <h3>📋 Unassigned Guests (${unassigned.length})</h3>
                        <div id="unassignedContainer"></div>
                    </div>
                </div>
                <!-- GUEST MANAGER PANE -->
                <div id="guests" class="tab-pane">
                    <div style="background:white; border-radius:20px; padding:20px; border:1px solid #e8dcc8;">
                        <h3>➕ Add New Guest</h3>
                        <div style="display:flex; gap:12px; flex-wrap:wrap; margin:15px 0;">
                            <input type="text" id="newGuestName" placeholder="Full name" style="flex:2; padding:10px; border-radius:40px; border:1px solid #e8dcc8;">
                            <input type="text" id="newGuestAddress" placeholder="Postal address" style="flex:3; padding:10px; border-radius:40px; border:1px solid #e8dcc8;">
                            <input type="number" id="newGuestCount" placeholder="Count" value="1" style="width:100px; padding:10px; border-radius:40px;">
                            <button class="btn btn-success" id="addGuestBtn">+ Add Guest</button>
                        </div>
                        <div class="search-filter">
                            <input type="text" id="guestSearch" placeholder="Search guests...">
                            <select id="groupFilter"><option value="">All Groups</option><option value="Family">Family</option><option value="Groomsman">Groomsman</option><option value="Work">Work</option><option value="Friends">Friends</option></select>
                        </div>
                        <div id="allGuestsList" style="max-height:500px; overflow-y:auto;"></div>
                    </div>
                </div>
                <!-- INVITATIONS PANE -->
                <div id="invitations" class="tab-pane">
                    <div style="background:white; border-radius:20px; padding:20px; border:1px solid #e8dcc8;">
                        <h3>📮 Print Postal Invitations</h3>
                        <p style="margin:10px 0;">Generate address labels and invitation cards for each guest.</p>
                        <div style="display:flex; gap:15px; flex-wrap:wrap; margin:20px 0;">
                            <button class="btn btn-primary" id="printAllInvitesBtn">🖨️ Print All Invitations</button>
                            <button class="btn btn-secondary" id="refreshAddressesBtn">⟳ Refresh Guest List</button>
                        </div>
                        <div id="addressListContainer" style="max-height:400px; overflow-y:auto;"></div>
                    </div>
                </div>
                <!-- EXPORT PANE -->
                <div id="export" class="tab-pane">
                    <div style="background:white; border-radius:20px; padding:25px; text-align:center; border:1px solid #e8dcc8;">
                        <h3>📊 Export Wedding Data</h3>
                        <div style="display:flex; gap:20px; justify-content:center; margin:25px 0; flex-wrap:wrap;">
                            <button class="btn btn-primary" id="exportCsvBtn">📄 Export CSV</button>
                            <button class="btn btn-primary" id="exportExcelBtn">📊 Export Excel</button>
                        </div>
                    </div>
                </div>
            </div>
        `;

        // Render Tables Grid
        const grid = document.getElementById("tablesGrid");
        if (grid) {
            grid.innerHTML = "";
            for (let [tid, table] of tablesArray) {
                const totalSeats = table.guests.reduce((s,g) => s + (g.guestCount||1), 0);
                const isBridal = tid === "Bridal";
                const card = document.createElement("div");
                card.className = `table-card ${isBridal ? "bridal" : ""}`;
                card.innerHTML = `
                    <div class="table-header"><span>${table.name}</span><span>${totalSeats} guests</span></div>
                    <div class="table-guests" id="table-${tid}">
                        ${table.guests.length === 0 ? '<div class="empty-table">— empty —</div>' : 
                            table.guests.map(g => `<span class="guest-tag" data-id="${g.id}" data-table="${tid}">${escapeHtml(g.name)} (${g.guestCount||1}) ✖</span>`).join('')
                        }
                    </div>
                    <div style="padding:8px 12px; border-top:1px solid #e8dcc8;">
                        <select id="assignSelect-${tid}" style="width:70%; padding:6px; border-radius:20px;">
                            <option value="">Assign guest...</option>
                            ${unassigned.map(g => `<option value="${g.id}">${escapeHtml(g.name)}</option>`).join('')}
                        </select>
                        <button class="btn-sm" data-assign-table="${tid}">+</button>
                    </div>
                `;
                grid.appendChild(card);
                // remove guest
                card.querySelectorAll(".guest-tag").forEach(tag => {
                    tag.onclick = (e) => { e.stopPropagation(); if(confirm("Remove guest?")) removeGuestFromTable(tag.dataset.id, tag.dataset.table); };
                });
                const assignBtn = card.querySelector(`[data-assign-table="${tid}"]`);
                const selectEl = card.querySelector(`#assignSelect-${tid}`);
                if (assignBtn) assignBtn.onclick = () => {
                    const guestId = selectEl.value;
                    if (guestId) {
                        const guest = allGuests.find(g => g.id === guestId);
                        if (guest) assignGuestToTable(guest, tid);
                        selectEl.value = "";
                    }
                };
            }
        }

        // Unassigned list
        const unassignedDiv = document.getElementById("unassignedContainer");
        if (unassignedDiv) {
            if (unassigned.length === 0) unassignedDiv.innerHTML = '<div style="padding:20px; text-align:center; color:#bfae8e;">✨ All guests assigned ✨</div>';
            else {
                unassignedDiv.innerHTML = unassigned.map(g => `
                    <div class="guest-list-item">
                        <div><span class="guest-name">${escapeHtml(g.name)}</span> <span class="guest-group">${g.group || ""} (${g.guestCount||1})</span><br>${g.address ? escapeHtml(g.address.substring(0,50)) : '<span style="color:#e74c3c;">⚠️ No address</span>'}</div>
                        <div><select class="quickTableSelect" data-id="${g.id}"><option value="">→ Table</option>${Array.from(tables.keys()).map(tid => `<option value="${tid}">${tables.get(tid).name}</option>`).join('')}</select><button class="btn-sm quickAssign" data-id="${g.id}">Assign</button></div>
                    </div>
                `).join('');
                document.querySelectorAll(".quickAssign").forEach(btn => {
                    btn.onclick = () => {
                        const guestId = btn.dataset.id;
                        const sel = btn.parentElement.querySelector(".quickTableSelect");
                        const guest = allGuests.find(g => g.id === guestId);
                        if (guest && sel.value) assignGuestToTable(guest, sel.value);
                    };
                });
            }
        }

        // Guest Manager List
        const guestListContainer = document.getElementById("allGuestsList");
        if (guestListContainer) {
            const searchTerm = document.getElementById("guestSearch")?.value.toLowerCase() || "";
            const groupFilter = document.getElementById("groupFilter")?.value || "";
            let filtered = allGuests.filter(g => (searchTerm === "" || g.name.toLowerCase().includes(searchTerm)) && (groupFilter === "" || g.group === groupFilter));
            guestListContainer.innerHTML = filtered.map(g => `
                <div class="guest-list-item"><div><strong>${escapeHtml(g.name)}</strong><br>${g.address ? escapeHtml(g.address) : '<span style="color:#e74c3c;">📍 No address saved</span>'}<br><small>${g.group || ""} · ${g.guestCount||1} guest(s)</small></div>
                <div><button class="btn-sm btn-primary" data-edit-addr="${g.id}">✏️ Edit Address</button><button class="btn-sm btn-danger" data-delete-guest="${g.id}" ${g.isManual ? '' : 'disabled'}>Delete</button></div></div>
            `).join('');
            document.querySelectorAll("[data-edit-addr]").forEach(btn => {
                btn.onclick = () => {
                    const guest = allGuests.find(g => g.id === btn.dataset.editAddr);
                    const newAddr = prompt("Enter postal address:", guest.address || "");
                    if (newAddr !== null) { guest.address = newAddr; saveManualGuests(); renderApp(); showToast("Address updated"); }
                };
            });
            document.querySelectorAll("[data-delete-guest]").forEach(btn => {
                if (!btn.disabled) btn.onclick = () => { if(confirm("Delete?")) { allGuests = allGuests.filter(g => g.id !== btn.dataset.deleteGuest); manualGuests = manualGuests.filter(g => g.id !== btn.dataset.deleteGuest); tableAssignments.delete(btn.dataset.deleteGuest); saveAssignments(); saveManualGuests(); renderApp(); } };
            });
        }

        // Invitations list
        const addrContainer = document.getElementById("addressListContainer");
        if (addrContainer) {
            const withAddress = allGuests.filter(g => g.address && g.address.trim());
            addrContainer.innerHTML = withAddress.map(g => `<div class="guest-list-item"><div><strong>${escapeHtml(g.name)}</strong><br>${escapeHtml(g.address)}</div><button class="btn-sm btn-primary" data-print-single="${g.id}">Print Invitation</button></div>`).join('');
            document.querySelectorAll("[data-print-single]").forEach(btn => {
                btn.onclick = () => { const guest = allGuests.find(g => g.id === btn.dataset.printSingle); if(guest) printInvitationsForGuest(guest); };
            });
        }

        // Event listeners
        document.getElementById("addGuestBtn")?.addEventListener("click", () => {
            const name = document.getElementById("newGuestName").value;
            const addr = document.getElementById("newGuestAddress").value;
            const count = document.getElementById("newGuestCount").value;
            if (name) addManualGuest(name, addr, count);
            else showToast("Enter guest name");
        });
        document.getElementById("resetSeatingBtn")?.addEventListener("click", () => { if(confirm("Reset all seating?")) { initTables(); tableAssignments.clear(); saveAssignments(); renderApp(); } });
        document.getElementById("printAllInvitesBtn")?.addEventListener("click", printAllInvitations);
        document.getElementById("exportCsvBtn")?.addEventListener("click", exportToCSV);
        document.getElementById("exportExcelBtn")?.addEventListener("click", exportToExcel);
        document.getElementById("guestSearch")?.addEventListener("input", () => renderApp());
        document.getElementById("groupFilter")?.addEventListener("change", () => renderApp());
        document.getElementById("refreshAddressesBtn")?.addEventListener("click", () => renderApp());

        // Tab switching
        document.querySelectorAll(".tab-btn").forEach(btn => {
            btn.onclick = () => {
                document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
                btn.classList.add("active");
                document.querySelectorAll(".tab-pane").forEach(p => p.classList.remove("active"));
                document.getElementById(btn.dataset.tab).classList.add("active");
            };
        });
    }

    // Initialize
    function init() {
        initTables();
        loadManualGuests();
        loadAssignments();
        renderApp();
    }
    init();
</script>
</body>
</html>
