<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Wedding Seating Manager | Manual Guests + Search</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Georgia', 'Times New Roman', Times, serif;
            background: #faf8f3;
            padding: 20px;
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
        }

        .header {
            background: linear-gradient(135deg, #c9a84c, #e8d5a8);
            border-radius: 24px;
            padding: 25px 30px;
            margin-bottom: 25px;
            text-align: center;
            color: #2c2418;
        }

        .header h1 {
            font-size: 1.8rem;
            font-weight: 400;
            letter-spacing: 2px;
        }

        .stats-bar {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        .stat {
            background: white;
            border-radius: 16px;
            padding: 15px 25px;
            flex: 1;
            text-align: center;
            border: 1px solid #e8dcc8;
        }

        .stat-number {
            font-size: 2rem;
            font-weight: bold;
            color: #c9a84c;
        }

        .toolbar {
            background: white;
            border-radius: 20px;
            padding: 15px 20px;
            margin-bottom: 25px;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            border: 1px solid #e8dcc8;
        }

        .btn {
            background: #c9a84c;
            border: none;
            padding: 10px 20px;
            border-radius: 30px;
            cursor: pointer;
            font-family: inherit;
            font-weight: 600;
            font-size: 0.85rem;
            transition: all 0.2s;
        }

        .btn:hover {
            background: #b8953a;
            transform: translateY(-1px);
        }

        .btn-secondary {
            background: #e8dcc8;
            color: #5a4a35;
        }

        .btn-success {
            background: #27ae60;
            color: white;
        }

        .btn-success:hover {
            background: #219a54;
        }

        .search-box {
            background: white;
            border-radius: 20px;
            padding: 15px 20px;
            margin-bottom: 25px;
            border: 1px solid #e8dcc8;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            align-items: center;
        }

        .search-input {
            flex: 1;
            padding: 12px 18px;
            border-radius: 40px;
            border: 1px solid #e8dcc8;
            font-size: 1rem;
            font-family: inherit;
            background: #fefcf8;
        }

        .search-input:focus {
            outline: none;
            border-color: #c9a84c;
            box-shadow: 0 0 0 2px rgba(201,168,76,0.2);
        }

        .search-results {
            background: white;
            border-radius: 20px;
            border: 1px solid #e8dcc8;
            max-height: 300px;
            overflow-y: auto;
            margin-bottom: 25px;
            display: none;
        }

        .search-results.active {
            display: block;
        }

        .search-result-item {
            padding: 12px 18px;
            border-bottom: 1px solid #e8dcc8;
            cursor: pointer;
            transition: background 0.1s;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .search-result-item:hover {
            background: #faf5ea;
        }

        .result-name {
            font-weight: 500;
        }

        .result-group {
            font-size: 0.7rem;
            color: #c9a84c;
            margin-left: 10px;
        }

        .assign-table-select {
            padding: 6px 12px;
            border-radius: 20px;
            border: 1px solid #e8dcc8;
            background: #fefcf8;
            font-size: 0.75rem;
        }

        /* Manual Guest Form */
        .manual-guest-form {
            background: white;
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 25px;
            border: 1px solid #e8dcc8;
        }

        .form-title {
            font-size: 1rem;
            color: #c9a84c;
            margin-bottom: 15px;
            letter-spacing: 1px;
        }

        .form-row {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 15px;
        }

        .form-row input {
            flex: 1;
            padding: 12px 16px;
            border-radius: 40px;
            border: 1px solid #e8dcc8;
            font-family: inherit;
            font-size: 0.9rem;
            background: #fefcf8;
        }

        .form-row input:focus {
            outline: none;
            border-color: #c9a84c;
        }

        .manual-guest-list {
            margin-top: 15px;
            max-height: 200px;
            overflow-y: auto;
        }

        .manual-guest-tag {
            display: inline-block;
            background: #e8dcc8;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            margin: 4px;
            cursor: pointer;
        }

        .manual-guest-tag:hover {
            background: #d4c4a8;
        }

        .main-layout {
            display: flex;
            gap: 25px;
            flex-wrap: wrap;
        }

        .tables-area {
            flex: 2;
            min-width: 300px;
        }

        .guests-area {
            flex: 1;
            min-width: 280px;
            background: white;
            border-radius: 20px;
            border: 1px solid #e8dcc8;
            padding: 20px;
            height: fit-content;
            position: sticky;
            top: 20px;
        }

        .tables-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 18px;
        }

        .table-card {
            background: white;
            border-radius: 20px;
            border: 1px solid #e8dcc8;
            overflow: hidden;
        }

        .table-card.bridal {
            border: 2px solid #c9a84c;
            background: #fffcf5;
        }

        .table-header {
            background: #faf5ea;
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            border-bottom: 1px solid #e8dcc8;
            font-weight: bold;
        }

        .table-guests {
            padding: 12px;
            min-height: 120px;
            max-height: 250px;
            overflow-y: auto;
        }

        .guest-chip {
            display: inline-block;
            background: #fef7e9;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            margin: 4px 6px 4px 0;
            border: 1px solid #e8dcc8;
            cursor: pointer;
            transition: 0.1s;
        }

        .guest-chip:hover {
            background: #e8dcc8;
        }

        .guest-chip.manual {
            background: #e8f5e9;
            border-color: #a5d6a7;
        }

        .empty-table {
            color: #bfae8e;
            text-align: center;
            padding: 15px;
            font-style: italic;
            font-size: 0.75rem;
        }

        .guest-list-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #efe4d4;
        }

        .guest-name {
            font-weight: 500;
            font-size: 0.85rem;
        }

        .guest-group {
            font-size: 0.65rem;
            color: #c9a84c;
        }

        .warning {
            background: #fff3e0;
            border-radius: 16px;
            padding: 10px 15px;
            margin-bottom: 20px;
            color: #b86b2c;
            font-size: 0.8rem;
        }

        .loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .loading-spinner {
            background: white;
            padding: 20px 30px;
            border-radius: 30px;
            font-size: 1rem;
        }

        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #e8dcc8;
            border-top-color: #c9a84c;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            margin-right: 10px;
            vertical-align: middle;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #2c2418;
            color: white;
            padding: 10px 24px;
            border-radius: 40px;
            font-size: 0.8rem;
            z-index: 1001;
            animation: fadeOut 2.5s forwards;
        }

        @keyframes fadeOut {
            0% { opacity: 1; }
            70% { opacity: 1; }
            100% { opacity: 0; visibility: hidden; }
        }

        .delete-manual {
            color: #e74c3c;
            font-size: 0.7rem;
            margin-left: 6px;
            cursor: pointer;
        }

        @media (max-width: 700px) {
            .main-layout { flex-direction: column; }
            .guests-area { position: static; }
        }
    </style>
</head>
<body>
<div id="app"></div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, getDocs, updateDoc, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // Firebase Configuration
    const firebaseConfig = {
        apiKey: "AIzaSyAH0rBpJUh3sRpBlQgrymQM1RLBDBiAPmE",
        authDomain: "daniel-and-laura.firebaseapp.com",
        projectId: "daniel-and-laura",
        storageBucket: "daniel-and-laura.firebasestorage.app",
        messagingSenderId: "363458517473",
        appId: "1:363458517473:web:7eac683bc98623cb281aa0"
    };

    const firebaseApp = initializeApp(firebaseConfig);
    const db = getFirestore(firebaseApp);

    const GUESTS_COLLECTION = "wedding_guests";
    const RESPONSES_COLLECTION = "guest_responses";
    const SEATING_COLLECTION = "wedding_seating";
    const MANUAL_GUESTS_COLLECTION = "manual_guests";

    const TOTAL_TABLES = 32;
    const BRIDAL_TABLE = "bridal";
    const MAX_PER_TABLE = 11;
    const MIN_PER_TABLE = 6;

    let allAttendees = [];      // From Firebase responses
    let manualGuests = [];      // Manually added guests { id, firstName, lastName, fullName, group }
    let tableAssignments = new Map();
    let attendeeTableMap = new Map();
    let currentSearchTerm = "";

    function showToast(msg) {
        const existing = document.querySelector('.toast');
        if (existing) existing.remove();
        const toast = document.createElement('div');
        toast.className = 'toast';
        toast.textContent = msg;
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 2500);
    }

    function showLoading(show) {
        let el = document.querySelector('.loading');
        if (show && !el) {
            const div = document.createElement('div');
            div.className = 'loading';
            div.innerHTML = '<div class="loading-spinner"><span class="spinner"></span> Loading...</div>';
            document.body.appendChild(div);
        } else if (!show && el) {
            el.remove();
        }
    }

    function initTables() {
        tableAssignments.clear();
        for (let i = 1; i <= TOTAL_TABLES; i++) {
            tableAssignments.set(i.toString(), { name: `Table ${i}`, guests: [] });
        }
        tableAssignments.set(BRIDAL_TABLE, { name: "👰 Bridal Table", guests: [] });
    }

    // Load manual guests from local storage (persist between sessions)
    function loadManualGuests() {
        const saved = localStorage.getItem('wedding_manual_guests');
        if (saved) {
            try {
                manualGuests = JSON.parse(saved);
            } catch(e) { manualGuests = []; }
        } else {
            manualGuests = [];
        }
    }

    function saveManualGuests() {
        localStorage.setItem('wedding_manual_guests', JSON.stringify(manualGuests));
    }

    function addManualGuest(firstName, lastName) {
        if (!firstName.trim()) {
            showToast("Please enter first name");
            return false;
        }
        const fullName = `${firstName.trim()} ${lastName.trim()}`.trim();
        const newId = `manual_${Date.now()}_${Math.random().toString(36).substr(2, 8)}`;
        const newGuest = {
            id: newId,
            firstName: firstName.trim(),
            lastName: lastName.trim(),
            fullName: fullName,
            group: "Manual Entry",
            isManual: true,
            createdAt: new Date().toISOString()
        };
        manualGuests.push(newGuest);
        saveManualGuests();
        
        // Add to allAttendees array for assignment
        allAttendees.push({
            id: newId,
            name: fullName,
            group: "Manual Entry",
            code: "MANUAL",
            isManual: true,
            firstName: firstName.trim(),
            lastName: lastName.trim()
        });
        
        showToast(`Added ${fullName} to guest list`);
        renderUI();
        return true;
    }

    function deleteManualGuest(guestId) {
        // Remove from manualGuests array
        const guestIndex = manualGuests.findIndex(g => g.id === guestId);
        if (guestIndex !== -1) {
            manualGuests.splice(guestIndex, 1);
            saveManualGuests();
        }
        
        // Remove from allAttendees
        const attendeeIndex = allAttendees.findIndex(a => a.id === guestId);
        if (attendeeIndex !== -1) {
            allAttendees.splice(attendeeIndex, 1);
        }
        
        // Remove from any table assignment
        const tableId = attendeeTableMap.get(guestId);
        if (tableId) {
            const table = tableAssignments.get(tableId);
            if (table) {
                table.guests = table.guests.filter(g => g.id !== guestId);
            }
            attendeeTableMap.delete(guestId);
        }
        
        showToast("Guest removed");
        renderUI();
    }

    async function loadData() {
        showLoading(true);
        try {
            // Load manual guests first
            loadManualGuests();
            
            // Load Firebase guests
            const guestsSnap = await getDocs(collection(db, GUESTS_COLLECTION));
            const guests = guestsSnap.docs.map(d => ({ id: d.id, ...d.data() }));
            
            const responsesSnap = await getDocs(collection(db, RESPONSES_COLLECTION));
            const responses = responsesSnap.docs.map(d => ({ id: d.id, ...d.data() }));
            
            allAttendees = [];
            
            // Add Firebase guests
            for (const guest of guests) {
                const response = responses.find(r => r.guestCode === guest.code);
                
                if (response && response.guestNames && response.guestNames.length > 0) {
                    for (let i = 0; i < response.guestNames.length; i++) {
                        allAttendees.push({
                            id: `${guest.code}_${i}`,
                            name: response.guestNames[i],
                            group: guest.name,
                            code: guest.code,
                            isManual: false
                        });
                    }
                } else if (response && response.fullName) {
                    allAttendees.push({
                        id: `${guest.code}_main`,
                        name: response.fullName,
                        group: guest.name,
                        code: guest.code,
                        isManual: false
                    });
                } else if (guest.replied === true) {
                    allAttendees.push({
                        id: `${guest.code}_default`,
                        name: guest.name,
                        group: guest.name,
                        code: guest.code,
                        isManual: false
                    });
                }
            }
            
            // Add manual guests to allAttendees
            for (const manual of manualGuests) {
                allAttendees.push({
                    id: manual.id,
                    name: manual.fullName,
                    group: "Manual Entry",
                    code: "MANUAL",
                    isManual: true,
                    firstName: manual.firstName,
                    lastName: manual.lastName
                });
            }
            
            // Load seating assignments
            const seatingDoc = await getDoc(doc(db, SEATING_COLLECTION, "master"));
            if (seatingDoc.exists()) {
                const data = seatingDoc.data();
                if (data.tableAssignments) {
                    tableAssignments = new Map(Object.entries(data.tableAssignments));
                    attendeeTableMap.clear();
                    for (const [tableId, table] of tableAssignments.entries()) {
                        for (const guest of table.guests) {
                            if (guest.id) attendeeTableMap.set(guest.id, tableId);
                        }
                    }
                } else {
                    initTables();
                }
            } else {
                initTables();
            }
            
            renderUI();
        } catch (err) {
            console.error(err);
            alert("Error loading data: " + err.message);
        } finally {
            showLoading(false);
        }
    }

    function assignAttendee(attendee, tableId) {
        const table = tableAssignments.get(tableId);
        if (!table) return false;
        
        if (tableId !== BRIDAL_TABLE && table.guests.length >= MAX_PER_TABLE) {
            showToast(`Table ${tableId} is full (max ${MAX_PER_TABLE} guests)`);
            return false;
        }
        
        const oldTableId = attendeeTableMap.get(attendee.id);
        if (oldTableId) {
            const oldTable = tableAssignments.get(oldTableId);
            if (oldTable) {
                oldTable.guests = oldTable.guests.filter(g => g.id !== attendee.id);
            }
        }
        
        table.guests.push({ ...attendee });
        attendeeTableMap.set(attendee.id, tableId);
        
        renderUI();
        return true;
    }

    function removeAttendee(attendeeId, tableId) {
        const table = tableAssignments.get(tableId);
        if (table) {
            table.guests = table.guests.filter(g => g.id !== attendeeId);
            attendeeTableMap.delete(attendeeId);
            renderUI();
        }
    }

    async function saveSeating() {
        showLoading(true);
        try {
            const exportMap = {};
            for (const [key, val] of tableAssignments.entries()) {
                exportMap[key] = { name: val.name, guests: val.guests };
            }
            await setDoc(doc(db, SEATING_COLLECTION, "master"), {
                tableAssignments: exportMap,
                updatedAt: new Date().toISOString(),
                totalGuests: allAttendees.length
            });
            showToast("✓ Seating plan saved successfully!");
        } catch (err) {
            alert("Save failed: " + err.message);
        } finally {
            showLoading(false);
        }
    }

    function getUnassigned() {
        return allAttendees.filter(a => !attendeeTableMap.has(a.id));
    }

    function getWarnings() {
        const warnings = [];
        for (const [tid, table] of tableAssignments.entries()) {
            if (tid === BRIDAL_TABLE) continue;
            const count = table.guests.length;
            if (count > 0 && count < MIN_PER_TABLE) {
                warnings.push(`${table.name} has only ${count} guests (min ${MIN_PER_TABLE})`);
            }
            if (count > MAX_PER_TABLE) {
                warnings.push(`${table.name} has ${count} guests (exceeds ${MAX_PER_TABLE})`);
            }
        }
        return warnings;
    }

    function searchGuests(searchTerm) {
        if (!searchTerm.trim()) return [];
        const term = searchTerm.toLowerCase().trim();
        return allAttendees.filter(a => 
            a.name.toLowerCase().includes(term) || 
            (a.group && a.group.toLowerCase().includes(term))
        );
    }

    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    function renderUI() {
        const app = document.getElementById('app');
        const unassigned = getUnassigned();
        const warnings = getWarnings();
        const searchResults = currentSearchTerm ? searchGuests(currentSearchTerm) : [];
        
        let totalSeated = 0;
        for (const table of tableAssignments.values()) {
            totalSeated += table.guests.length;
        }
        
        app.innerHTML = `
            <div class="container">
                <div class="header">
                    <h1>✨ Daniel & Laura · Wedding Seating ✨</h1>
                    <p>${TOTAL_TABLES} guest tables (${MIN_PER_TABLE}-${MAX_PER_TABLE} seats) + Bridal Table</p>
                </div>
                
                <div class="stats-bar">
                    <div class="stat"><div class="stat-number">${allAttendees.length}</div><div>Total Guests</div></div>
                    <div class="stat"><div class="stat-number">${totalSeated}</div><div>Seated</div></div>
                    <div class="stat"><div class="stat-number">${unassigned.length}</div><div>Unassigned</div></div>
                    <div class="stat"><div class="stat-number">${TOTAL_TABLES}</div><div>Guest Tables</div></div>
                </div>
                
                ${warnings.length ? `<div class="warning">⚠️ ${warnings.join(' · ')}</div>` : ''}
                
                <div class="toolbar">
                    <button class="btn" id="saveBtn">💾 Save to Firebase</button>
                    <button class="btn btn-secondary" id="resetBtn">⟳ Reset All</button>
                </div>
                
                <!-- Manual Guest Form -->
                <div class="manual-guest-form">
                    <div class="form-title">✏️ Add Manual Guest (not in original list)</div>
                    <div class="form-row">
                        <input type="text" id="firstNameInput" placeholder="First name" autocomplete="off">
                        <input type="text" id="lastNameInput" placeholder="Last name" autocomplete="off">
                        <button class="btn btn-success" id="addManualBtn">+ Add Guest</button>
                    </div>
                    <div class="manual-guest-list" id="manualGuestList">
                        ${manualGuests.map(g => `
                            <span class="manual-guest-tag" data-id="${g.id}">
                                ${escapeHtml(g.fullName)} 
                                <span class="delete-manual" data-id="${g.id}">✖</span>
                            </span>
                        `).join('')}
                        ${manualGuests.length === 0 ? '<span style="font-size:0.7rem; color:#bfae8e;">No manual guests added yet</span>' : ''}
                    </div>
                </div>
                
                <!-- Search Bar -->
                <div class="search-box">
                    <input type="text" id="searchInput" class="search-input" placeholder="🔍 Search guest by name..." autocomplete="off">
                    <button class="btn" id="searchBtn">Search</button>
                    <button class="btn btn-secondary" id="clearSearchBtn">Clear</button>
                </div>
                
                <!-- Search Results -->
                <div id="searchResults" class="search-results ${searchResults.length > 0 ? 'active' : ''}">
                    ${searchResults.map(guest => `
                        <div class="search-result-item" data-guest-id="${guest.id}">
                            <div>
                                <span class="result-name">${escapeHtml(guest.name)}</span>
                                <span class="result-group">(${escapeHtml(guest.group)})</span>
                                ${guest.isManual ? '<span style="font-size:0.65rem; color:#27ae60; margin-left:8px;">📝 Manual</span>' : ''}
                                ${attendeeTableMap.has(guest.id) ? `<span style="font-size:0.65rem; color:#27ae60; margin-left:8px;">✓ At ${tableAssignments.get(attendeeTableMap.get(guest.id))?.name || 'a table'}</span>` : ''}
                            </div>
                            <div>
                                <select class="assign-table-select" data-guest-id="${guest.id}">
                                    <option value="">→ Assign to table</option>
                                    ${Array.from(tableAssignments.keys())
                                        .filter(tid => tid !== BRIDAL_TABLE)
                                        .map(tid => `<option value="${tid}">${tableAssignments.get(tid).name} (${tableAssignments.get(tid).guests.length}/${MAX_PER_TABLE})</option>`)
                                        .join('')}
                                    <option value="${BRIDAL_TABLE}">👰 Bridal Table (${tableAssignments.get(BRIDAL_TABLE)?.guests.length || 0} guests)</option>
                                </select>
                                <button class="btn" style="padding:6px 12px; margin-left:8px;" data-assign-search="${guest.id}">Assign</button>
                            </div>
                        </div>
                    `).join('')}
                    ${searchResults.length === 0 && currentSearchTerm ? '<div style="padding:20px; text-align:center; color:#bfae8e;">No guests found</div>' : ''}
                </div>
                
                <div class="main-layout">
                    <div class="tables-area">
                        <div class="tables-grid" id="tablesGrid"></div>
                    </div>
                    <div class="guests-area">
                        <h3>📋 Unassigned Guests</h3>
                        <p style="font-size:0.7rem; margin:8px 0 12px; color:#8b7355;">${unassigned.length} guests waiting for seating</p>
                        <div id="unassignedList"></div>
                    </div>
                </div>
            </div>
        `;
        
        // Render tables (same as before, simplified for brevity)
        const tablesGrid = document.getElementById('tablesGrid');
        if (tablesGrid) {
            tablesGrid.innerHTML = '';
            const sortedTables = Array.from(tableAssignments.keys()).sort((a, b) => {
                if (a === BRIDAL_TABLE) return 1;
                if (b === BRIDAL_TABLE) return -1;
                return parseInt(a) - parseInt(b);
            });
            
            for (const tid of sortedTables) {
                const table = tableAssignments.get(tid);
                const isBridal = tid === BRIDAL_TABLE;
                const guestCount = table.guests.length;
                
                const card = document.createElement('div');
                card.className = `table-card ${isBridal ? 'bridal' : ''}`;
                card.innerHTML = `
                    <div class="table-header">
                        <span>${table.name} ${isBridal ? '⭐' : ''}</span>
                        <span style="font-size:0.7rem;">${guestCount} ${!isBridal ? `/ ${MAX_PER_TABLE}` : 'guests'}</span>
                    </div>
                    <div class="table-guests" id="table-${tid}">
                        ${table.guests.length === 0 ? '<div class="empty-table">— empty —</div>' : 
                            table.guests.map(g => `
                                <span class="guest-chip ${g.isManual ? 'manual' : ''}" data-id="${g.id}" data-table="${tid}">
                                    ${escapeHtml(g.name)} ${g.isManual ? '📝' : ''} <span style="font-size:10px;">✖</span>
                                </span>
                            `).join('')
                        }
                    </div>
                `;
                tablesGrid.appendChild(card);
                
                const chips = card.querySelectorAll('.guest-chip');
                chips.forEach(chip => {
                    chip.addEventListener('click', (e) => {
                        e.stopPropagation();
                        const guestId = chip.dataset.id;
                        const tableId = chip.dataset.table;
                        if (confirm('Remove this guest from the table?')) {
                            removeAttendee(guestId, tableId);
                        }
                    });
                });
            }
        }
        
        // Render unassigned list
        const unassignedDiv = document.getElementById('unassignedList');
        if (unassignedDiv) {
            if (unassigned.length === 0) {
                unassignedDiv.innerHTML = '<div style="text-align:center; padding:30px; color:#bfae8e;">✨ All guests assigned! ✨</div>';
            } else {
                unassignedDiv.innerHTML = unassigned.map(guest => `
                    <div class="guest-list-item">
                        <div>
                            <div class="guest-name">${escapeHtml(guest.name)} ${guest.isManual ? '📝' : ''}</div>
                            <div class="guest-group">${escapeHtml(guest.group)}</div>
                        </div>
                        <select id="unassignSelect_${guest.id.replace(/[^a-zA-Z0-9]/g, '_')}" style="width:130px;">
                            <option value="">Table...</option>
                            ${Array.from(tableAssignments.keys()).filter(t => t !== BRIDAL_TABLE).slice(0, 20).map(tid => `<option value="${tid}">Table ${tid}</option>`).join('')}
                            <option value="${BRIDAL_TABLE}">👰 Bridal</option>
                        </select>
                        <button class="btn" style="padding:4px 12px;" data-unassign="${guest.id}">✔</button>
                    </div>
                `).join('');
                
                for (const guest of unassigned) {
                    const btn = unassignedDiv.querySelector(`[data-unassign="${guest.id}"]`);
                    const select = unassignedDiv.querySelector(`#unassignSelect_${guest.id.replace(/[^a-zA-Z0-9]/g, '_')}`);
                    if (btn && select) {
                        btn.onclick = () => {
                            const targetTable = select.value;
                            if (!targetTable) {
                                showToast('Select a table');
                                return;
                            }
                            assignAttendee(guest, targetTable);
                        };
                    }
                }
            }
        }
        
        // Add manual guest button
        document.getElementById('addManualBtn').onclick = () => {
            const firstName = document.getElementById('firstNameInput').value;
            const lastName = document.getElementById('lastNameInput').value;
            if (addManualGuest(firstName, lastName)) {
                document.getElementById('firstNameInput').value = '';
                document.getElementById('lastNameInput').value = '';
            }
        };
        
        // Delete manual guest from the list
        document.querySelectorAll('.delete-manual').forEach(el => {
            el.onclick = (e) => {
                e.stopPropagation();
                const id = el.dataset.id;
                if (confirm('Remove this manual guest?')) {
                    deleteManualGuest(id);
                }
            };
        });
        
        // Search functionality
        const searchInput = document.getElementById('searchInput');
        if (searchInput) {
            searchInput.value = currentSearchTerm;
            searchInput.onkeypress = (e) => { if (e.key === 'Enter') { currentSearchTerm = searchInput.value; renderUI(); } };
        }
        document.getElementById('searchBtn').onclick = () => { currentSearchTerm = document.getElementById('searchInput')?.value || ''; renderUI(); };
        document.getElementById('clearSearchBtn').onclick = () => { currentSearchTerm = ''; if (searchInput) searchInput.value = ''; renderUI(); };
        
        // Search result assignment
        for (const guest of searchResults) {
            const assignBtn = document.querySelector(`[data-assign-search="${guest.id}"]`);
            const select = document.querySelector(`.assign-table-select[data-guest-id="${guest.id}"]`);
            if (assignBtn && select) {
                assignBtn.onclick = () => {
                    const targetTable = select.value;
                    if (!targetTable) { showToast('Select a table'); return; }
                    assignAttendee(guest, targetTable);
                    currentSearchTerm = document.getElementById('searchInput')?.value || '';
                    renderUI();
                };
            }
        }
        
        document.getElementById('saveBtn').onclick = saveSeating;
        document.getElementById('resetBtn').onclick = () => {
            if (confirm('Reset all seating assignments? Manual guests will remain but become unassigned.')) {
                initTables();
                attendeeTableMap.clear();
                renderUI();
                showToast('Seating reset');
            }
        };
    }
    
    loadData();
</script>
</body>
</html>
