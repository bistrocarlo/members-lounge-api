<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Monday Night Soccer | Ultimate Club Hub</title>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800;14..32,900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { background: #eef2f5; font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; padding: 20px 16px 40px; min-height: 100vh; }
        button, .tab-btn, select, input, textarea { cursor: pointer; min-height: 48px; font-size: 16px; }
        .container { max-width: 700px; margin: 0 auto; }
        
        .header { background: #ffffff; border-radius: 28px; padding: 20px 16px; margin-bottom: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); border: 1px solid #e2e8f0; text-align: center; }
        .logo-icon { width: 56px; height: 56px; background: linear-gradient(135deg, #1a73e8, #0d5bbf); border-radius: 20px; display: inline-flex; align-items: center; justify-content: center; margin-bottom: 10px; box-shadow: 0 8px 16px rgba(26,115,232,0.25); }
        .logo-icon i { font-size: 30px; color: white; }
        .header h1 { font-size: 24px; font-weight: 800; color: #1e293b; letter-spacing: -0.3px; }
        .user-badge { background: #f1f5f9; padding: 10px 18px; border-radius: 60px; display: inline-flex; align-items: center; gap: 12px; margin-top: 12px; font-weight: 600; font-size: 14px; }
        .user-badge button { background: #dc3545; border: none; padding: 8px 20px; border-radius: 40px; color: white; font-weight: 600; font-size: 14px; transition: all 0.2s; }
        
        /* Improved Tab Visibility - Bolder, Larger */
        .tab-nav { display: flex; gap: 10px; justify-content: center; margin-bottom: 20px; flex-wrap: wrap; }
        .tab-btn { background: white; border: 2px solid #cbd5e1; padding: 14px 22px; border-radius: 60px; font-weight: 800; font-size: 15px; color: #1e293b; display: inline-flex; align-items: center; gap: 10px; cursor: pointer; transition: all 0.2s; letter-spacing: -0.2px; }
        .tab-btn i { font-size: 16px; }
        .tab-btn:hover { border-color: #1a73e8; color: #1a73e8; background: #f0f7ff; transform: translateY(-2px); }
        .tab-btn.active { background: #1a73e8; color: white; border-color: #1a73e8; box-shadow: 0 6px 14px rgba(26,115,232,0.4); }
        
        .panel { display: none; }
        .panel.active-panel { display: block; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .card { background: white; border-radius: 24px; padding: 20px; margin-bottom: 18px; border: 1px solid #e2e8f0; box-shadow: 0 2px 8px rgba(0,0,0,0.03); }
        .card h2 { font-size: 18px; font-weight: 800; margin-bottom: 16px; color: #0f172a; border-left: 4px solid #1a73e8; padding-left: 12px; }
        .card h3 { font-size: 16px; font-weight: 700; margin-bottom: 14px; color: #334155; }
        
        /* Weather Widget */
        .weather-widget { background: linear-gradient(135deg, #1e293b, #0f172a); border-radius: 20px; padding: 14px 18px; margin-bottom: 16px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; color: white; }
        .weather-icon { font-size: 28px; margin-right: 12px; }
        .weather-temp { font-size: 28px; font-weight: 800; }
        .weather-desc { font-size: 14px; opacity: 0.8; }
        
        /* Stopwatch Scoreboard */
        .scoreboard { background: linear-gradient(145deg, #1a1a2e, #16213e); border-radius: 28px; padding: 20px; margin-bottom: 20px; text-align: center; color: white; }
        .score-numbers { display: flex; justify-content: center; gap: 40px; margin-bottom: 15px; }
        .score-team { text-align: center; }
        .score-team .team-label { font-size: 14px; font-weight: 600; opacity: 0.8; margin-bottom: 5px; }
        .score-team .team-score { font-size: 56px; font-weight: 900; line-height: 1; }
        .score-divider { font-size: 56px; font-weight: 800; color: #ffc107; }
        .stopwatch { font-size: 42px; font-weight: 800; font-family: monospace; letter-spacing: 2px; margin: 15px 0; background: rgba(0,0,0,0.5); border-radius: 60px; padding: 12px; }
        .score-controls { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
        .score-controls button { background: #334155; padding: 12px 20px; min-width: 100px; }
        .score-controls button.primary { background: #1a73e8; }
        .score-controls button.warning { background: #eab308; color: #1e293b; }
        
        .pitch-premium { background: linear-gradient(145deg, #2e7d32, #1b5e20); border-radius: 28px; padding: 20px; position: relative; box-shadow: 0 12px 24px rgba(0,0,0,0.2), inset 0 1px 2px rgba(255,255,255,0.2); border: 2px solid #ffc107; }
        .teams-row-premium { display: flex; gap: 16px; flex-wrap: wrap; position: relative; z-index: 2; }
        .team-card-premium { flex: 1; background: rgba(0,0,0,0.7); backdrop-filter: blur(8px); border-radius: 20px; padding: 16px; min-width: 180px; }
        .team-title-premium { font-size: 20px; font-weight: 800; text-align: center; padding: 10px; border-radius: 60px; margin-bottom: 14px; }
        .yellow-premium { background: #ffc107; color: #2c2c2c; }
        .orange-premium { background: #fd7e14; color: white; }
        .player-list-premium { display: flex; flex-direction: column; gap: 8px; max-height: 280px; overflow-y: auto; }
        .player-badge-premium { background: rgba(255,255,255,0.15); border-radius: 40px; padding: 8px 12px; text-align: center; font-size: 13px; font-weight: 500; color: white; }
        
        .chat-premium { background: #f8fafc; border-radius: 24px; overflow: hidden; border: 1px solid #e2e8f0; }
        .chat-messages-premium { height: 380px; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; background: #fefefe; }
        .chat-message { display: flex; flex-direction: column; max-width: 85%; animation: fadeInUp 0.2s ease; }
        .chat-message.sent { align-self: flex-end; }
        .chat-message.sent .message-bubble { background: #1a73e8; color: white; border-radius: 22px 22px 6px 22px; }
        .chat-message.received .message-bubble { background: white; color: #1e293b; border-radius: 22px 22px 22px 6px; border: 1px solid #e2e8f0; }
        .message-bubble { padding: 10px 16px; font-size: 14px; }
        .message-author { font-weight: 800; font-size: 12px; margin-bottom: 4px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        .reaction-bar { display: flex; gap: 8px; margin-top: 6px; }
        .reaction-btn { background: rgba(0,0,0,0.05); border: none; font-size: 13px; padding: 4px 8px; border-radius: 30px; cursor: pointer; min-height: auto; }
        .chat-input-area { padding: 12px; background: white; border-top: 1px solid #e2e8f0; display: flex; gap: 10px; flex-wrap: wrap; }
        .chat-input-area input { flex: 1; margin: 0; padding: 12px 16px; border-radius: 60px; border: 1px solid #e2e8f0; }
        
        .data-table { width: 100%; border-collapse: collapse; }
        .data-table th, .data-table td { padding: 12px 10px; text-align: left; border-bottom: 1px solid #e2e8f0; font-size: 13px; }
        .data-table th { background: #f8fafc; color: #1a73e8; font-weight: 800; }
        .stat-card { background: #f8fafc; border-radius: 20px; padding: 18px; text-align: center; }
        .attendee-tag { background: #e2e8f0; padding: 8px 16px; border-radius: 40px; font-size: 13px; display: inline-block; margin: 4px; }
        .btn-outline { background: white; color: #1a73e8; border: 2px solid #1a73e8; }
        .flex-btns { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 15px; }
        
        @media (max-width: 550px) { .teams-row-premium { flex-direction: column; } .chat-message { max-width: 95%; } .tab-btn { padding: 10px 16px; font-size: 13px; } .score-team .team-score { font-size: 40px; } .stopwatch { font-size: 32px; } }
    </style>
</head>
<body>
<div class="container" id="appContainer"></div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyCWlFqDJyENgrUOhiLXCjSEi4Mk_54SA1w",
        authDomain: "monday-night-soccer-hub.firebaseapp.com",
        projectId: "monday-night-soccer-hub",
        storageBucket: "monday-night-soccer-hub.firebasestorage.app",
        messagingSenderId: "634335208908",
        appId: "1:634335208908:web:dca705b65fc52de0606969"
    };
    
    let db = null;
    try { firebase.initializeApp(firebaseConfig); db = firebase.firestore(); } catch(e) { console.warn(e); }
    
    let players = ["Alex Rowe", "Ali Mekawy", "Carlo", "Charlie", "Chris Del Monaco", "Chris M", "Chris S", "Danny", "Dante", "David", "Dimitri", "Enzo", "Farid", "Faros", "Frank", "George B", "George T", "Ivan", "James Zoumis", "James", "Joe T", "Joey", "Kia", "Leo", "Manoli", "Marco", "Mario", "Maurice", "Nector", "Paul", "Perri", "Peter", "Ralph", "Rocco", "Stav", "Stevan", "Theo", "Tony EH", "Vasilis"].sort();
    let teamAssignments = {}, matchResults = {}, payments = [], attendance = [], guests = [], matchComments = {};
    let isAdminLoggedIn = false, currentUser = null;
    const WEEKLY_FEE = 5;
    
    // Stopwatch variables
    let stopwatchInterval = null;
    let stopwatchRunning = false;
    let stopwatchSeconds = 0;
    let currentYellowScore = 0;
    let currentOrangeScore = 0;
    let currentGameDateForScoreboard = null;
    
    const playersRef = db ? db.collection("config").doc("players") : null;
    const teamsRef = db ? db.collection("config").doc("teamAssignments") : null;
    const resultsRef = db ? db.collection("config").doc("matchResults") : null;
    const paymentsRef = db ? db.collection("payments") : null;
    const attendanceRef = db ? db.collection("attendance") : null;
    const messagesRef = db ? db.collection("messages") : null;
    const guestsRef = db ? db.collection("guests") : null;
    const commentsRef = db ? db.collection("matchComments") : null;
    const reactionsRef = db ? db.collection("messageReactions") : null;
    
    function getCurrentAESTDate() {
        const now = new Date(); const utc = now.getTime() + (now.getTimezoneOffset() * 60000);
        return new Date(utc + (10 * 3600000)).toISOString().split('T')[0];
    }
    function generateAllGameWeeks() {
        const year = new Date().getFullYear();
        let start = new Date(year, 0, 1);
        while (start.getDay() !== 1) start.setDate(start.getDate() + 1);
        let weeks = [], cur = new Date(start);
        let dec31 = new Date(year, 11, 31);
        let lastMonday = new Date(dec31);
        while (lastMonday.getDay() !== 1) lastMonday.setDate(lastMonday.getDate() - 1);
        let secondLast = new Date(lastMonday);
        secondLast.setDate(secondLast.getDate() - 7);
        while (cur <= secondLast) {
            weeks.push({ dateStr: cur.toISOString().split('T')[0], label: `Mon ${cur.toLocaleDateString('en-AU', { day:'numeric', month:'short' })}` });
            cur.setDate(cur.getDate() + 7);
        }
        return weeks;
    }
    const ALL_GAME_WEEKS = generateAllGameWeeks();
    function getFutureWeeks() { return ALL_GAME_WEEKS.filter(w => w.dateStr >= getCurrentAESTDate()); }
    function getPastWeeks() { return ALL_GAME_WEEKS.filter(w => w.dateStr < getCurrentAESTDate()).reverse(); }
    
    // Weather API
    async function getWeather() {
        try {
            const response = await fetch('https://wttr.in/Sydney?format=%C|%t&m');
            const data = await response.text();
            const parts = data.split('|');
            const condition = parts[0] || 'Clear';
            const temp = parts[1] || '18°C';
            return { condition, temp };
        } catch(e) { return { condition: 'Partly Cloudy', temp: '18°C' }; }
    }
    
    async function loadData() {
        if(!db) return;
        try {
            const pDoc = await playersRef.get(); if(pDoc.exists && pDoc.data().list) players = pDoc.data().list.sort();
            const tDoc = await teamsRef.get(); if(tDoc.exists) teamAssignments = tDoc.data();
            const rDoc = await resultsRef.get(); if(rDoc.exists) matchResults = rDoc.data();
            const paySnap = await paymentsRef.get(); payments = []; paySnap.forEach(d => payments.push(d.data()));
            const attSnap = await attendanceRef.get(); attendance = []; attSnap.forEach(d => attendance.push(d.data()));
            const guestSnap = await guestsRef.get(); guests = []; guestSnap.forEach(d => guests.push(d.data()));
            const commentsSnap = await commentsRef.get(); matchComments = {};
            commentsSnap.forEach(doc => { const data = doc.data(); if (!matchComments[data.gameDate]) matchComments[data.gameDate] = []; matchComments[data.gameDate].push(data); });
        } catch(e) { console.warn(e); }
    }
    async function savePlayers() { if(db && playersRef) await playersRef.set({ list: players }); }
    async function saveTeams() { if(db && teamsRef) await teamsRef.set(teamAssignments); }
    async function saveResults() { if(db && resultsRef) await resultsRef.set(matchResults); }
    async function savePayment(p) { if(db && paymentsRef) await paymentsRef.doc(`${p.player}_${p.gameDate}`).set(p); payments.push(p); }
    async function saveAttendance(a) { if(db && attendanceRef) await attendanceRef.doc(`${a.player}_${a.gameDate}`).set(a); const idx = attendance.findIndex(x=>x.player===a.player&&x.gameDate===a.gameDate); if(idx!==-1) attendance[idx]=a; else attendance.push(a); }
    async function saveGuest(g) { if(db && guestsRef) await guestsRef.doc(`${g.guestName}_${g.gameDate}`).set(g); guests.push(g); }
    async function saveComment(gameDate, author, text) { const comment = { gameDate, author, text, timestamp: Date.now() }; if(db && commentsRef) await commentsRef.add(comment); if (!matchComments[gameDate]) matchComments[gameDate] = []; matchComments[gameDate].push(comment); renderHistoryPanel(); }
    
    function loginAsPlayer(name) { currentUser = { name, role: "player" }; isAdminLoggedIn = false; localStorage.setItem("soccer_user", JSON.stringify(currentUser)); renderApp(); }
    function adminLogin(pw) { if(pw === "admin123") { currentUser = { name: "Admin", role: "admin" }; isAdminLoggedIn = true; localStorage.setItem("soccer_user", JSON.stringify(currentUser)); renderApp(); return true; } return false; }
    function logout() { if(stopwatchInterval) clearInterval(stopwatchInterval); currentUser = null; localStorage.removeItem("soccer_user"); renderLogin(); }
    
    function formatTime(seconds) {
        const mins = Math.floor(seconds / 60);
        const secs = seconds % 60;
        return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
    }
    
    function updateStopwatchDisplay() {
        const timerElem = document.getElementById('stopwatchTimer');
        if(timerElem) timerElem.textContent = formatTime(stopwatchSeconds);
        const yellowScoreElem = document.getElementById('liveYellowScore');
        const orangeScoreElem = document.getElementById('liveOrangeScore');
        if(yellowScoreElem) yellowScoreElem.textContent = currentYellowScore;
        if(orangeScoreElem) orangeScoreElem.textContent = currentOrangeScore;
    }
    
    function startStopwatch() {
        if(stopwatchInterval) clearInterval(stopwatchInterval);
        stopwatchRunning = true;
        stopwatchInterval = setInterval(() => { if(stopwatchRunning) { stopwatchSeconds++; updateStopwatchDisplay(); } }, 1000);
        updateStopwatchDisplay();
    }
    function pauseStopwatch() { stopwatchRunning = false; updateStopwatchDisplay(); }
    function resetStopwatch() { stopwatchRunning = false; stopwatchSeconds = 0; currentYellowScore = 0; currentOrangeScore = 0; updateStopwatchDisplay(); if(stopwatchInterval) clearInterval(stopwatchInterval); stopwatchInterval = null; }
    function addYellowGoal() { currentYellowScore++; updateStopwatchDisplay(); }
    function addOrangeGoal() { currentOrangeScore++; updateStopwatchDisplay(); }
    
    async function renderApp() {
        await loadData();
        const weather = await getWeather();
        const weatherIcon = weather.condition.includes('Rain') ? '🌧️' : (weather.condition.includes('Cloud') ? '☁️' : '☀️');
        
        const container = document.getElementById("appContainer");
        container.innerHTML = `
            <div class="header"><div class="logo-icon"><i class="fas fa-futbol"></i></div><h1>MONDAY NIGHT SOCCER</h1><p>Elite Club Hub</p><div class="user-badge"><i class="fas fa-user-circle"></i> ${currentUser.role === "admin" ? "ADMIN" : currentUser.name}<button id="logoutBtn">Exit</button></div></div>
            <div class="weather-widget"><div><i class="fas fa-cloud-sun weather-icon"></i> <span class="weather-desc">${weather.condition}</span></div><div><span class="weather-temp">${weather.temp}</span></div></div>
            <div class="tab-nav" id="tabNav"></div><div id="panelContainer"></div>
        `;
        document.getElementById("logoutBtn").onclick = logout;
        
        let tabs = [
            { id: "rsvp", label: "📋 RSVP", icon: "fa-calendar" },
            { id: "pitch", label: "🏟️ PITCH", icon: "fa-futbol" },
            { id: "scoreboard", label: "⏱️ SCOREBOARD", icon: "fa-stopwatch" },
            { id: "chat", label: "💬 CHAT", icon: "fa-comments" },
            { id: "history", label: "📖 HISTORY", icon: "fa-history" },
            { id: "stats", label: "🏆 LEADERS", icon: "fa-trophy" },
            { id: "rules", label: "📜 RULES", icon: "fa-book" }
        ];
        if (isAdminLoggedIn) {
            tabs = [
                { id: "admin", label: "⚙️ ADMIN", icon: "fa-shield" },
                { id: "financial", label: "💰 FINANCE", icon: "fa-dollar-sign" },
                ...tabs
            ];
        }
        
        const tabNav = document.getElementById("tabNav");
        tabNav.innerHTML = tabs.map(t => `<button class="tab-btn" data-tab="${t.id}"><i class="fas ${t.icon}"></i> ${t.label}</button>`).join('');
        const panelContainer = document.getElementById("panelContainer");
        panelContainer.innerHTML = tabs.map(t => `<div id="panel-${t.id}" class="panel"></div>`).join('');
        
        document.querySelectorAll(".tab-btn").forEach(btn => {
            btn.addEventListener("click", function() {
                const tabId = this.getAttribute("data-tab");
                document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
                this.classList.add("active");
                document.querySelectorAll(".panel").forEach(p => p.classList.remove("active-panel"));
                document.getElementById(`panel-${tabId}`).classList.add("active-panel");
                if (tabId === "rsvp") renderRSVP();
                if (tabId === "pitch") renderPitch();
                if (tabId === "scoreboard") renderScoreboard();
                if (tabId === "chat") renderChat();
                if (tabId === "history") renderHistory();
                if (tabId === "stats") renderStats();
                if (tabId === "rules") renderRules();
                if (tabId === "admin" && isAdminLoggedIn) renderAdmin();
                if (tabId === "financial" && isAdminLoggedIn) renderFinancial();
            });
        });
        document.querySelector(".tab-btn").click();
    }
    
    // Scoreboard Panel with Stopwatch
    function renderScoreboard() {
        document.getElementById("panel-scoreboard").innerHTML = `
            <div class="scoreboard">
                <div class="score-numbers">
                    <div class="score-team"><div class="team-label">🟡 YELLOW</div><div class="team-score" id="liveYellowScore">0</div></div>
                    <div class="score-divider">—</div>
                    <div class="score-team"><div class="team-label">🟠 ORANGE</div><div class="team-score" id="liveOrangeScore">0</div></div>
                </div>
                <div class="stopwatch" id="stopwatchTimer">00:00</div>
                <div class="score-controls">
                    <button class="warning" onclick="window.addYellowGoal()">🟡 +1 Goal</button>
                    <button class="warning" onclick="window.addOrangeGoal()">🟠 +1 Goal</button>
                    <button class="primary" onclick="window.startStopwatch()">▶ Start</button>
                    <button onclick="window.pauseStopwatch()">⏸ Pause</button>
                    <button onclick="window.resetStopwatch()">🔄 Reset</button>
                </div>
            </div>
            <div class="card"><h2><i class="fas fa-info-circle"></i> Match Info</h2><p>Use the scoreboard to track live match progress. Goals and time are for real-time tracking during the game.</p></div>
        `;
        updateStopwatchDisplay();
    }
    
    window.startStopwatch = startStopwatch;
    window.pauseStopwatch = pauseStopwatch;
    window.resetStopwatch = resetStopwatch;
    window.addYellowGoal = addYellowGoal;
    window.addOrangeGoal = addOrangeGoal;
    
    function renderRSVP() {
        const weeks = getFutureWeeks();
        if (!weeks.length) { document.getElementById("panel-rsvp").innerHTML = `<div class="card"><h2>📋 RSVP</h2><p>No upcoming matches</p></div>`; return; }
        document.getElementById("panel-rsvp").innerHTML = `
            <div class="card"><h2><i class="fas fa-calendar-check"></i> Weekly RSVP · $${WEEKLY_FEE}</h2>
            <label>Select Week</label><select id="rsvpWeek">${weeks.map(w=>`<option value="${w.dateStr}">${w.label}</option>`)}</select>
            <label>Your Name</label><select id="rsvpPlayer"><option>-- Select Name --</option>${players.map(p=>`<option>${escapeHtml(p)}</option>`)}</select>
            <div class="flex-btns"><button id="rsvpYesBtn">✅ I'm Playing</button><button id="rsvpNoBtn" class="btn-outline">❌ Can't Play</button></div>
            <div id="rsvpMsg" style="margin-top:12px;"></div></div>
            <div class="card"><h2><i class="fas fa-users"></i> This Week's Players</h2><div id="attendeesList"></div></div>
        `;
        document.getElementById("rsvpYesBtn").onclick = async () => { const p = document.getElementById("rsvpPlayer").value, w = document.getElementById("rsvpWeek").value; if(p && p !== "-- Select Name --") { await saveAttendance({player:p, gameDate:w, status:"in"}); renderAttendees(); document.getElementById("rsvpMsg").innerHTML = `<span style="color:#28a745;">✓ ${p} added</span>`; setTimeout(()=>document.getElementById("rsvpMsg").innerHTML="",2000); if(isAdminLoggedIn) renderAdmin(); } };
        document.getElementById("rsvpNoBtn").onclick = async () => { const p = document.getElementById("rsvpPlayer").value, w = document.getElementById("rsvpWeek").value; if(p && p !== "-- Select Name --") { await saveAttendance({player:p, gameDate:w, status:"out"}); renderAttendees(); document.getElementById("rsvpMsg").innerHTML = `<span style="color:#dc3545;">✗ ${p} unavailable</span>`; setTimeout(()=>document.getElementById("rsvpMsg").innerHTML="",2000); } };
        document.getElementById("rsvpWeek").onchange = () => renderAttendees();
        renderAttendees();
    }
    async function renderAttendees() {
        const week = document.getElementById("rsvpWeek")?.value;
        if(!week) return;
        const attending = attendance.filter(a => a.gameDate === week && a.status === 'in').map(a=>a.player);
        const weeklyGuests = guests.filter(g=>g.gameDate===week).map(g=>g.guestName);
        const all = [...attending, ...weeklyGuests];
        document.getElementById("attendeesList").innerHTML = `<div class="stat-card"><div class="attendee-tags">${all.map(p => `<span class="attendee-tag">${escapeHtml(p)} ${weeklyGuests.includes(p)?'🎭':''}</span>`).join('') || '<span>None yet</span>'}</div></div>`;
    }
    
    function renderPitch() {
        const weeks = getFutureWeeks();
        if (!weeks.length) { document.getElementById("panel-pitch").innerHTML = `<div class="card">No upcoming matches</div>`; return; }
        document.getElementById("panel-pitch").innerHTML = `<div class="card"><h2><i class="fas fa-futbol"></i> Team Lineups</h2><select id="pitchWeek">${weeks.map(w=>`<option value="${w.dateStr}">${w.label}</option>`)}</select><div class="pitch-premium"><div class="teams-row-premium" id="pitchTeams"></div><div id="pitchScore" class="score-premium"></div></div></div>`;
        document.getElementById("pitchWeek").onchange = () => renderPitchLineup();
        renderPitchLineup();
    }
    function renderPitchLineup() {
        const week = document.getElementById("pitchWeek")?.value;
        if(!week) return;
        const assignments = teamAssignments[week] || {};
        const yellow = Object.keys(assignments).filter(p => assignments[p] === "yellow").sort();
        const orange = Object.keys(assignments).filter(p => assignments[p] === "orange").sort();
        const match = matchResults[week] || { yellowScore: 0, orangeScore: 0 };
        const container = document.getElementById("pitchTeams");
        if(container) {
            container.innerHTML = `
                <div class="team-card-premium"><div class="team-title-premium yellow-premium">🟡 YELLOW</div><div class="player-list-premium">${yellow.map(p => `<div class="player-badge-premium">${escapeHtml(p)}</div>`).join('') || '<div class="player-badge-premium">—</div>'}</div></div>
                <div class="team-card-premium"><div class="team-title-premium orange-premium">🟠 ORANGE</div><div class="player-list-premium">${orange.map(p => `<div class="player-badge-premium">${escapeHtml(p)}</div>`).join('') || '<div class="player-badge-premium">—</div>'}</div></div>
            `;
        }
        document.getElementById("pitchScore").innerHTML = `🏆 SCORE: 🟡 ${match.yellowScore} — ${match.orangeScore} 🟠`;
    }
    
    function renderChat() {
        document.getElementById("panel-chat").innerHTML = `<div class="card"><h2><i class="fas fa-comments"></i> Team Chat</h2><div class="chat-premium"><div class="chat-header-premium" style="padding:14px 18px; background:white; border-bottom:1px solid #e2e8f0;"><i class="fas fa-headset" style="color:#1a73e8;"></i><span style="font-weight:800;">Pitch Talk</span><span style="font-size:11px; background:#28a745; padding:2px 10px; border-radius:30px; color:white; margin-left:8px;">LIVE</span></div><div id="chatMsgs" class="chat-messages-premium">Loading...</div><div class="chat-input-area"><input id="chatInput" placeholder="Type message..."><button id="attachBtn" style="background:#e9ecef; color:#495057; min-width:auto;"><i class="fas fa-paperclip"></i></button><button id="sendChatBtn"><i class="fas fa-paper-plane"></i> Send</button></div></div></div>`;
        document.getElementById("sendChatBtn").onclick = async () => { const msg = document.getElementById("chatInput").value.trim(); if(msg && messagesRef) { await messagesRef.add({ name: currentUser.name, message: msg, isAdmin: currentUser.role==="admin", timestamp: firebase.firestore.FieldValue.serverTimestamp(), attachment: null }); document.getElementById("chatInput").value = ""; } };
        document.getElementById("attachBtn").onclick = () => { const url = prompt("Paste image/video link:"); if(url && messagesRef) { messagesRef.add({ name: currentUser.name, message: "📎 Attachment: " + url, isAdmin: currentUser.role==="admin", timestamp: firebase.firestore.FieldValue.serverTimestamp(), attachment: url }); } };
        if(messagesRef) messagesRef.orderBy("timestamp","asc").onSnapshot(async snap=>{ const container = document.getElementById("chatMsgs"); if(!container) return; let html=""; for(const doc of snap.docs){ const d=doc.data(); const time = d.timestamp ? d.timestamp.toDate().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}) : ""; const isSent = d.name === currentUser.name; const display = d.isAdmin ? `${d.name}<span style="background:#fd7e14; padding:2px 8px; border-radius:20px; font-size:10px; margin-left:6px; color:white;">ADMIN</span>` : d.name; const msgId = doc.id; let reactions = { like:0, laugh:0, clap:0 }; if(reactionsRef){ const reactSnap = await reactionsRef.where("messageId","==",msgId).get(); reactSnap.forEach(r=>{ const type = r.data().type; if(reactions[type]!==undefined) reactions[type]++; }); } html += `<div class="chat-message ${isSent ? 'sent' : 'received'}" data-id="${msgId}"><div class="message-bubble"><div class="message-author">${escapeHtml(display)}</div><div>${escapeHtml(d.message)}</div>${d.attachment ? `<div class="message-attachment"><i class="fas fa-link"></i> <a href="${escapeHtml(d.attachment)}" target="_blank" style="color:inherit;">View</a></div>` : ''}<div class="message-time" style="font-size:10px; color:#94a3b8; margin-top:4px;">${time}</div><div class="reaction-bar"><button class="reaction-btn" onclick="window.addReaction('${msgId}','like')">👍 <span id="like-${msgId}">${reactions.like}</span></button><button class="reaction-btn" onclick="window.addReaction('${msgId}','laugh')">😂 <span id="laugh-${msgId}">${reactions.laugh}</span></button><button class="reaction-btn" onclick="window.addReaction('${msgId}','clap')">👏 <span id="clap-${msgId}">${reactions.clap}</span></button></div></div></div>`; } container.innerHTML = html || "<div style='text-align:center; padding:30px; color:#94a3b8;'>No messages yet</div>"; container.scrollTop = container.scrollHeight; });
    }
    window.addReaction = async function(messageId, type) { if(db && reactionsRef) { await reactionsRef.add({ messageId, type, userId: currentUser.name, timestamp: Date.now() }); renderChat(); } };
    
    async function renderHistory() {
        const pastWeeks = getPastWeeks().slice(0,10);
        let html = `<div class="card"><h2><i class="fas fa-history"></i> Match History</h2></div>`;
        for(let week of pastWeeks){
            const assignments = teamAssignments[week.dateStr] || {};
            const yellow = Object.keys(assignments).filter(p=>assignments[p]==="yellow");
            const orange = Object.keys(assignments).filter(p=>assignments[p]==="orange");
            const match = matchResults[week.dateStr] || { yellowScore:0, orangeScore:0, goals:{} };
            const goals = match.goals || {};
            const comments = matchComments[week.dateStr] || [];
            const safeId = week.dateStr.replace(/-/g,'');
            html += `<div style="background:white; border-radius:20px; margin-bottom:16px; border:1px solid #e2e8f0; overflow:hidden;"><div style="background:#f8fafc; padding:12px 16px; display:flex; justify-content:space-between; flex-wrap:wrap;"><span style="font-weight:800;">${week.label}</span><span style="background:#1a73e8; color:white; padding:4px 12px; border-radius:30px;">🟡 ${match.yellowScore} - ${match.orangeScore} 🟠</span></div><div style="padding:12px;"><div style="display:flex; gap:10px; flex-wrap:wrap;"><div style="flex:1;"><strong>🟡 Yellow:</strong> ${yellow.slice(0,4).join(', ')}${yellow.length>4?'...':''}</div><div style="flex:1;"><strong>🟠 Orange:</strong> ${orange.slice(0,4).join(', ')}${orange.length>4?'...':''}</div></div><div style="margin-top:8px;"><strong>⚽ Goals:</strong> ${Object.entries(goals).map(([p,c])=>`${p}(${c})`).join(', ') || 'none'}</div><div style="margin-top:10px;"><input type="text" id="commentInput-${safeId}" placeholder="Add comment..." style="width:70%; padding:8px 12px; border-radius:40px; border:1px solid #e2e8f0;"><button onclick="window.addHistoryComment('${week.dateStr}')" style="padding:8px 16px;">💬</button></div><div id="comments-${safeId}" style="margin-top:8px;">${comments.map(c=>`<div style="background:#f1f5f9; border-radius:16px; padding:8px; margin-top:6px;"><strong>${escapeHtml(c.author)}</strong>: ${escapeHtml(c.text)}</div>`).join('')}</div></div></div>`;
        }
        document.getElementById("panel-history").innerHTML = html;
    }
    window.addHistoryComment = async function(gameDate) { const safeId = gameDate.replace(/-/g,''); const input = document.getElementById(`commentInput-${safeId}`); const text = input?.value.trim(); if(text){ await saveComment(gameDate, currentUser.name, text); renderHistory(); } };
    async function renderStats() {
        let tally = new Map();
        attendance.forEach(a => { if(a.status === 'in') tally.set(a.player, (tally.get(a.player)||0)+1); });
        let sorted = Array.from(tally.entries()).map(([n,g]) => ({name:n, games:g})).sort((a,b)=>b.games - a.games).slice(0,10);
        let html = `<div class="card"><h2><i class="fas fa-crown"></i> Attendance Leaders</h2><table class="data-table"><thead><th>#</th><th>Player</th><th>Games</th></thead><tbody>${sorted.map((p,i)=>`<tr><td>${i+1}</td><td>${escapeHtml(p.name)}</td><td>🎽 ${p.games}</td></tr>`).join('')}</tbody></table></div>`;
        document.getElementById("panel-stats").innerHTML = html;
    }
    function renderRules() { document.getElementById("panel-rules").innerHTML = `<div class="card"><h2><i class="fas fa-gavel"></i> Club Rules</h2><ul style="line-height:1.8; margin-left:20px;"><li>❌ No tackling from behind → Free kick</li><li>🧤 Goalie rotation (5 min) → Goal penalty</li><li>⚡ No showboating → Expulsion</li><li>🔴 Foul within 1m of goal → Shot from halfway</li><li>💰 $${WEEKLY_FEE} weekly fee per player</li></ul></div>`; }
    
    async function renderAdmin() {
        const futureWeeks = getFutureWeeks();
        document.getElementById("panel-admin").innerHTML = `
            <div class="card"><h3><i class="fas fa-users"></i> Manage Players</h3><div id="playersList"></div><div style="display:flex; gap:10px; margin-top:12px;"><input id="newPlayerName" placeholder="New player name" style="flex:1;"><button id="addPlayerBtn">➕ Add</button></div></div>
            <div class="card"><h3>💰 Collect $${WEEKLY_FEE}</h3><select id="cashWeek">${futureWeeks.map(w=>`<option value="${w.dateStr}">${w.label}</option>`)}</select><div id="cashList"></div></div>
            <div class="card"><h3>👥 Assign Teams</h3><select id="assignWeek">${futureWeeks.map(w=>`<option value="${w.dateStr}">${w.label}</option>`)}</select><div id="assignList"></div><button id="saveAssignBtn" class="btn-outline" style="margin-top:12px;">Save Teams</button></div>
            <div class="card"><h3>🎭 Add Guest</h3><select id="guestWeek">${futureWeeks.map(w=>`<option value="${w.dateStr}">${w.label}</option>`)}</select><input id="guestName" placeholder="Guest name"><button id="addGuestBtn">+ Add</button><div id="guestList"></div></div>
            <div class="card"><h3>⚽ Set Score & Goals</h3><select id="scoreWeek">${ALL_GAME_WEEKS.map(w=>`<option value="${w.dateStr}">${w.label}</option>`)}</select><div class="flex-btns"><input type="number" id="yellowScoreInp" placeholder="Yellow" style="width:100px;"><input type="number" id="orangeScoreInp" placeholder="Orange" style="width:100px;"><button id="saveScoreBtn">Save</button></div><div id="goalInputs"></div></div>
        `;
        renderPlayersList();
        document.getElementById("addPlayerBtn").onclick = async () => { const name = document.getElementById("newPlayerName").value.trim(); if(name && !players.includes(name)) { players.push(name); players.sort(); await savePlayers(); renderPlayersList(); renderAdmin(); alert(`Added ${name}`); } };
        document.getElementById("cashWeek").onchange = renderCash;
        document.getElementById("assignWeek").onchange = renderAssign;
        document.getElementById("saveAssignBtn").onclick = async () => { await saveTeams(); renderPitchLineup(); alert("Teams saved"); };
        document.getElementById("addGuestBtn").onclick = async () => { const name = document.getElementById("guestName").value.trim(), week = document.getElementById("guestWeek").value; if(name && week) { await saveGuest({guestName:name, gameDate:week}); document.getElementById("guestName").value=""; renderGuestList(); renderAssign(); renderAttendees(); alert(`Guest ${name} added`); } };
        document.getElementById("saveScoreBtn").onclick = async () => { const week = document.getElementById("scoreWeek").value, y = parseInt(document.getElementById("yellowScoreInp").value)||0, o = parseInt(document.getElementById("orangeScoreInp").value)||0; if(!matchResults[week]) matchResults[week]={}; matchResults[week].yellowScore=y; matchResults[week].orangeScore=o; await saveResults(); alert("Score saved"); renderHistory(); renderPitchLineup(); };
        document.getElementById("scoreWeek").onchange = () => renderGoalInputs();
        renderCash(); renderAssign(); renderGuestList(); renderGoalInputs();
    }
    function renderPlayersList() {
        let html = `<div style="max-height:200px; overflow-y:auto;">`;
        for(let p of players) { html += `<div style="display:flex; justify-content:space-between; align-items:center; padding:8px; border-bottom:1px solid #e2e8f0;"><span>${escapeHtml(p)}</span><button class="deletePlayerBtn" data-name="${escapeHtml(p)}" style="background:#dc3545; padding:4px 12px; min-width:auto;">Delete</button></div>`; }
        html += `</div>`;
        document.getElementById("playersList").innerHTML = html;
        document.querySelectorAll(".deletePlayerBtn").forEach(btn=>btn.onclick=async()=>{ const name = btn.getAttribute("data-name"); if(confirm(`Delete ${name}?`)){ players = players.filter(p=>p!==name); await savePlayers(); renderPlayersList(); renderAdmin(); alert(`Deleted ${name}`); } });
    }
    async function renderCash() { const week = document.getElementById("cashWeek").value; const attending = attendance.filter(a=>a.gameDate===week && a.status==='in').map(a=>a.player); const paidList = payments.filter(p=>p.gameDate===week).map(p=>p.player); let html = `<strong>💰 ${attending.length} players ($${WEEKLY_FEE} each)</strong>`; for(let p of attending){ const isPaid = paidList.includes(p); html += `<div style="display:flex; justify-content:space-between; margin:8px 0; background:#f1f5f9; border-radius:60px; padding:8px 14px;"><span>${escapeHtml(p)}</span><button class="collectBtn" data-player="${escapeHtml(p)}" style="background:${isPaid?'#28a745':'#1a73e8'};">${isPaid?'Paid':'Collect $5'}</button></div>`; } document.getElementById("cashList").innerHTML = html; document.querySelectorAll(".collectBtn").forEach(btn=>btn.onclick=async()=>{ const player=btn.dataset.player; if(!payments.find(p=>p.player===player&&p.gameDate===week)){ await savePayment({player, gameDate:week, amount:WEEKLY_FEE}); renderCash(); renderFinancial(); } }); }
    async function renderAssign() { const week = document.getElementById("assignWeek").value; const attending = attendance.filter(a=>a.gameDate===week && a.status==='in').map(a=>a.player); const weeklyGuests = guests.filter(g=>g.gameDate===week).map(g=>g.guestName); const all = [...attending, ...weeklyGuests]; if(!teamAssignments[week]) teamAssignments[week]={}; let html = ``; for(let p of all){ const current = teamAssignments[week][p] || ""; html += `<div style="display:flex; justify-content:space-between; margin:8px 0; background:#f1f5f9; border-radius:60px; padding:8px 14px;"><span>${escapeHtml(p)} ${weeklyGuests.includes(p)?'🎭':''}</span><select class="teamSelect" data-player="${escapeHtml(p)}" style="width:130px;"><option value="">— Select —</option><option value="yellow" ${current==="yellow"?"selected":""}>🟡 Yellow</option><option value="orange" ${current==="orange"?"selected":""}>🟠 Orange</option></select></div>`; } document.getElementById("assignList").innerHTML = html; document.querySelectorAll(".teamSelect").forEach(sel=>sel.addEventListener("change",()=>{ const player=sel.dataset.player; const val=sel.value; if(val) teamAssignments[week][player]=val; else delete teamAssignments[week][player]; })); }
    async function renderGoalInputs() { const week = document.getElementById("scoreWeek").value; const assignments = teamAssignments[week] || {}; const allPlayers = [...new Set([...Object.keys(assignments), ...(guests.filter(g=>g.gameDate===week).map(g=>g.guestName))])]; const goals = (matchResults[week] && matchResults[week].goals) || {}; let html = `<label>Goal Scorers:</label>`; for(let p of allPlayers) { const goalCount = goals[p] || 0; html += `<div style="display:flex; justify-content:space-between; margin:8px 0;"><span>${escapeHtml(p)}</span><select class="goalSelect" data-player="${escapeHtml(p)}" style="width:100px;"><option value="0">0</option><option value="1" ${goalCount===1?"selected":""}>1</option><option value="2" ${goalCount===2?"selected":""}>2</option><option value="3" ${goalCount===3?"selected":""}>3</option><option value="4" ${goalCount===4?"selected":""}>4</option><option value="5" ${goalCount===5?"selected":""}>5</option></select></div>`; } document.getElementById("goalInputs").innerHTML = html; document.querySelectorAll(".goalSelect").forEach(sel=>sel.addEventListener("change",()=>{ const player=sel.dataset.player; const val=parseInt(sel.value); if(!matchResults[week]) matchResults[week]={goals:{}}; if(!matchResults[week].goals) matchResults[week].goals={}; if(val>0) matchResults[week].goals[player]=val; else delete matchResults[week].goals[player]; })); }
    async function renderGuestList() { const week = document.getElementById("guestWeek").value; const weeklyGuests = guests.filter(g=>g.gameDate===week); document.getElementById("guestList").innerHTML = `<div style="margin-top:12px; background:#f1f5f9; border-radius:60px; padding:12px; text-align:center;">🎭 Guests: ${weeklyGuests.map(g=>escapeHtml(g.guestName)).join(', ') || 'none'}</div>`; }
    
    function renderFinancial() {
        const totalCollected = payments.reduce((s,p)=>s+WEEKLY_FEE,0);
        let debtMap = new Map();
        getPastWeeks().forEach(week => { attendance.filter(a=>a.gameDate===week.dateStr && a.status==='in').forEach(a=>{ if(!payments.find(p=>p.player===a.player&&p.gameDate===week.dateStr)) debtMap.set(a.player, (debtMap.get(a.player)||0)+WEEKLY_FEE); }); });
        const debtors = Array.from(debtMap.entries()).filter(([_,a])=>a>0).sort((a,b)=>b[1]-a[1]);
        document.getElementById("panel-financial").innerHTML = `
            <div class="card" style="background:linear-gradient(135deg,#f8fafc,white); border:2px solid #1a73e8;"><h2><i class="fas fa-chart-line"></i> Treasury</h2><div style="text-align:center;"><div style="font-size:42px; font-weight:800; color:#1a73e8;">$${totalCollected}</div><div>Total Collected</div></div></div>
            <div class="card"><h2><i class="fas fa-file-invoice-dollar"></i> Outstanding Fees</h2>${debtors.length>0?`<table class="data-table"><thead><th>Player</th><th>Owed</th><th>Weeks</th></thead><tbody>${debtors.map(([p,a])=>`<tr><td>${escapeHtml(p)}</td><td style="color:#dc3545;">$${a}</td><td>${Math.round(a/WEEKLY_FEE)} wk(s)</td></tr>`).join('')}</tbody></table>`:'<div style="padding:20px; text-align:center; color:#28a745;">✅ All fees paid!</div>'}</div>
            <div class="card"><h2><i class="fas fa-history"></i> Payment History</h2><table class="data-table"><thead><th>Week</th><th>Paid</th><th>Amount</th></thead><tbody>${getPastWeeks().map(w=>{ const paid = payments.filter(p=>p.gameDate===w.dateStr); const attendingCount = attendance.filter(a=>a.gameDate===w.dateStr && a.status==='in').length; return `<tr><td>${w.label}</td><td>${paid.map(p=>escapeHtml(p.player)).join(', ')||'—'}</td><td>$${paid.length*WEEKLY_FEE}/$${attendingCount*WEEKLY_FEE}</td></tr>`; }).join('')||'<tr><td colspan="3">No data</td></tr>'}</tbody></table></div>
        `;
    }
    
    function escapeHtml(str) { return String(str).replace(/[&<>]/g, m => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;' }[m])); }
    async function renderLogin() {
        await loadData();
        document.getElementById("appContainer").innerHTML = `<div style="background:white; border-radius:32px; padding:32px; max-width:380px; margin:60px auto; text-align:center;"><div class="logo-icon" style="margin:0 auto 16px;"><i class="fas fa-futbol"></i></div><h2 style="font-size:26px;">Monday Soccer</h2><select id="playerSelect" style="margin:16px 0;"><option>-- Select Player --</option>${players.map(p=>`<option>${escapeHtml(p)}</option>`)}</select><button id="playerLoginBtn" style="width:100%;">Enter as Player</button><hr style="margin:20px 0;"><input type="password" id="adminPw" placeholder="Admin Password"><button id="adminLoginBtn" style="width:100%; margin-top:12px; background:#64748b;">Admin Login</button><div id="loginErr" style="color:#dc3545; margin-top:12px;"></div></div>`;
        document.getElementById("playerLoginBtn").onclick = () => { const name = document.getElementById("playerSelect").value; if(name && name !== "-- Select Player --") loginAsPlayer(name); else document.getElementById("loginErr").innerText = "Select your name"; };
        document.getElementById("adminLoginBtn").onclick = () => { if(!adminLogin(document.getElementById("adminPw").value)) document.getElementById("loginErr").innerText = "Wrong password"; };
    }
    (async () => { const stored = localStorage.getItem("soccer_user"); if(stored) { try { const u = JSON.parse(stored); if(u.role==="admin"){ isAdminLoggedIn=true; currentUser={name:"Admin",role:"admin"}; } else { currentUser={name:u.name,role:"player"}; } await loadData(); renderApp(); return; } catch(e){} } renderLogin(); })();
</script>
</body>
</html>
