<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Monday Night Soccer | Match Report Generator</title>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <style>
        *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
        body{background:#eef2f5;font-family:'Inter',sans-serif;}
        .app{max-width:500px;margin:0 auto;background:#eef2f5;min-height:100vh;}
        .header{background:white;padding:14px 20px;text-align:center;border-bottom:1px solid #e2e8f0;}
        .logo-icon{width:56px;height:56px;background:#1a73e8;border-radius:24px;display:inline-flex;align-items:center;justify-content:center;margin:0 auto 6px;}
        .logo-icon i{font-size:28px;color:white;}
        .header h1{font-size:18px;font-weight:800;color:#1e293b;}
        .user-row{background:#f1f5f9;padding:5px 12px;border-radius:60px;display:inline-flex;align-items:center;gap:8px;margin-top:6px;font-size:12px;}
        .user-row button{background:#dc3545;border:none;padding:4px 12px;border-radius:40px;color:white;font-weight:600;font-size:11px;cursor:pointer;}
        .top-nav{background:white;padding:10px 12px;display:flex;flex-wrap:wrap;justify-content:center;gap:6px;border-bottom:1px solid #e2e8f0;position:sticky;top:0;z-index:10;}
        .nav-module{background:#f8fafc;border:none;padding:8px 14px;border-radius:60px;font-size:12px;font-weight:600;color:#475569;cursor:pointer;}
        .nav-module.active{background:#1a73e8;color:white;}
        .module-container{padding:16px;display:none;}
        .module-container.active-module{display:block;}
        .card{background:white;border-radius:24px;padding:18px;margin-bottom:14px;border:1px solid #e2e8f0;}
        .card h2{font-size:17px;font-weight:700;margin-bottom:14px;border-left:4px solid #1a73e8;padding-left:12px;}
        .attendance-card{background:linear-gradient(135deg,#1a73e8,#0d5bbf);color:white;border-radius:28px;padding:24px 20px;text-align:center;margin-bottom:16px;}
        .big-buttons{display:flex;gap:14px;margin:16px 0 12px;}
        .btn-play-big{background:#28a745;flex:1;padding:14px;border-radius:60px;font-weight:800;font-size:17px;border:none;color:white;cursor:pointer;}
        .btn-sit-big{background:#dc3545;flex:1;padding:14px;border-radius:60px;font-weight:800;font-size:17px;border:none;color:white;cursor:pointer;}
        .profile-item{background:#f8fafc;border-radius:20px;margin-bottom:10px;display:flex;align-items:center;gap:12px;padding:14px;}
        .profile-avatar{width:50px;height:50px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:white;font-weight:700;font-size:20px;flex-shrink:0;}
        .player-avatar-small{width:36px;height:36px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:white;font-weight:600;font-size:14px;margin-right:4px;}
        .profile-badge{background:white;border-radius:40px;padding:4px 12px;font-size:11px;font-weight:600;display:inline-block;margin-right:6px;margin-bottom:4px;}
        .edit-profile-btn{background:#475569;padding:6px 14px;font-size:12px;border-radius:40px;border:none;color:white;cursor:pointer;}
        .match-card{background:white;border-radius:24px;margin-bottom:14px;border:1px solid #e2e8f0;overflow:hidden;}
        .match-header{background:#f8fafc;padding:12px 16px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;}
        .match-result{background:#1a73e8;color:white;padding:4px 14px;border-radius:40px;font-weight:700;}
        .teams-section{padding:16px;background:linear-gradient(145deg,#2e7d32,#1b5e20);}
        .team-row{display:flex;gap:12px;flex-wrap:wrap;}
        .team-box{flex:1;background:rgba(0,0,0,0.65);border-radius:18px;padding:12px;min-width:140px;}
        .team-yellow{background:#ffc107;color:#2c2c2c;font-weight:800;text-align:center;padding:6px;border-radius:60px;margin-bottom:8px;}
        .team-orange{background:#fd7e14;color:white;font-weight:800;text-align:center;padding:6px;border-radius:60px;margin-bottom:8px;}
        .player-list{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;}
        .player-tag{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,0.2);border-radius:40px;padding:4px 10px;font-size:11px;color:white;}
        .score-big{text-align:center;margin-top:12px;font-size:22px;font-weight:800;background:rgba(0,0,0,0.6);border-radius:60px;padding:8px;color:white;}
        .goals-section,.comments-section{padding:12px 16px;background:#fefce8;}
        .goals-list{display:flex;flex-wrap:wrap;gap:8px;}
        .goal-badge{background:white;border-radius:40px;padding:5px 12px;font-size:12px;font-weight:600;border-left:3px solid #eab308;}
        .add-comment{display:flex;gap:8px;margin-top:10px;}
        .add-comment input{flex:1;padding:12px;border-radius:60px;border:1.5px solid #e2e8f0;font-size:14px;}
        .comment-item{background:#f8fafc;border-radius:16px;padding:10px;margin-bottom:8px;font-size:13px;}
        .weather-card{background:linear-gradient(135deg,#0f2027,#203a43);color:white;border-radius:24px;padding:20px;text-align:center;}
        .admin-team-item{display:flex;justify-content:space-between;align-items:center;margin:8px 0;background:#f1f5f9;border-radius:60px;padding:8px 16px;flex-wrap:wrap;gap:8px;}
        .admin-action-btn{background:white;border:2px solid #1a73e8;color:#1a73e8;padding:12px;border-radius:60px;font-weight:700;font-size:14px;text-align:center;cursor:pointer;margin-bottom:8px;width:100%;}
        .guest-tag{background:#d4edda;color:#155724;border-radius:40px;padding:6px 12px;font-size:13px;display:inline-flex;align-items:center;gap:6px;}
        .playing-list,.guest-section{background:#e8f0fe;border-radius:20px;padding:16px;margin-bottom:14px;}
        .guest-section{background:#f0fdf4;border:1px solid #bbf7d0;}
        .attendee-tag{display:inline-flex;align-items:center;gap:6px;background:#e2e8f0;padding:6px 12px;border-radius:40px;font-size:13px;margin:4px;}
        .data-table{width:100%;border-collapse:collapse;font-size:13px;}
        .data-table th,.data-table td{padding:10px;text-align:left;border-bottom:1px solid #e2e8f0;}
        .modal{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.5);display:flex;align-items:center;justify-content:center;z-index:1000;}
        .modal-content{background:white;border-radius:32px;padding:24px;max-width:340px;width:90%;max-height:80vh;overflow-y:auto;}
        .login-box{background:white;border-radius:48px;padding:40px 28px;margin:40px 20px;text-align:center;}
        .login-logo{width:90px;height:90px;background:linear-gradient(135deg,#1a73e8,#0d5bbf);border-radius:32px;display:inline-flex;align-items:center;justify-content:center;margin:0 auto 20px;}
        select,input{width:100%;padding:14px;border:1.5px solid #e2e8f0;border-radius:60px;margin:8px 0;font-size:16px;background:white;}
        button{background:#1a73e8;color:white;border:none;padding:12px 20px;border-radius:60px;font-weight:700;cursor:pointer;}
        .flex-btns{display:flex;gap:12px;margin-top:12px;flex-wrap:wrap;}
        .btn-outline{background:white;color:#1a73e8;border:2px solid #1a73e8;}
        .chat-message{margin-bottom:12px;}
        .chat-bubble{background:#f1f5f9;padding:10px 14px;border-radius:18px;font-size:14px;}
        .chat-name{font-weight:700;font-size:12px;color:#1a73e8;margin-bottom:4px;}
        .info-bar{background:#e8f0fe;border-radius:16px;padding:12px;font-size:12px;margin-bottom:16px;text-align:center;color:#1a73e8;font-weight:500;}
        .timer-container{background:linear-gradient(135deg,#1e293b,#0f172a);border-radius:28px;padding:20px;text-align:center;margin-bottom:16px;}
        .timer-display{font-size:56px;font-weight:800;font-family:monospace;color:#10b981;letter-spacing:4px;background:#00000030;border-radius:20px;padding:12px;margin-bottom:16px;}
        .timer-controls{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;}
        .timer-btn{padding:10px 20px;border-radius:60px;font-weight:700;font-size:14px;border:none;cursor:pointer;}
        .timer-btn.start{background:#10b981;color:white;}
        .timer-btn.pause{background:#f59e0b;color:white;}
        .timer-btn.reset{background:#ef4444;color:white;}
        .half-status{font-size:14px;color:#94a3b8;margin-top:10px;}
        .report-badge{background:linear-gradient(135deg,#f59e0b,#d97706);color:white;border-radius:20px;padding:12px;font-size:13px;margin-top:12px;cursor:pointer;text-align:center;font-weight:600;}
        .own-goal-btn{background:#dc3545;color:white;border:none;padding:6px 12px;border-radius:60px;font-size:11px;cursor:pointer;margin-left:8px;}
        .goal-scorer-row{display:flex;gap:8px;margin-bottom:8px;align-items:center;flex-wrap:wrap;}
        .loading{text-align:center;padding:40px;color:#64748b;}
        .whatsapp-share{background:#25D366;color:white;border:none;margin-top:8px;}
        .whatsapp-share:hover{background:#128C7E;}
        @media (max-width:450px){.team-row{flex-direction:column;}}
    </style>
</head>
<body>
<div class="app" id="app"><div class="loading"><i class="fas fa-spinner fa-spin"></i> Loading Monday Night Soccer...</div></div>

<script>
    // Firebase Config
    const firebaseConfig = {
        apiKey: "AIzaSyCWlFqDJyENgrUOhiLXCjSEi4Mk_54SA1w",
        authDomain: "monday-night-soccer-hub.firebaseapp.com",
        projectId: "monday-night-soccer-hub",
        storageBucket: "monday-night-soccer-hub.firebasestorage.app",
        messagingSenderId: "634335208908",
        appId: "1:634335208908:web:dca705b65fc52de0606969"
    };
    
    let db = null, firebaseReady = false;
    try { firebase.initializeApp(firebaseConfig); db = firebase.firestore(); firebaseReady = true; } catch(e) { console.warn("Demo mode"); }
    
    // Global State
    let players = ["Alex Rowe","Ali Mekawy","Carlo","Charlie","Chris Del Monaco","Chris M","Chris S","Danny","Dante","David","Dimitri","Enzo","Farid","Faros","Frank","George B","George T","Ivan","James Zoumis","James","Joe T","Joey","Kia","Leo","Manoli","Marco","Mario","Maurice","Nector","Paul","Perri","Peter","Ralph","Rocco","Stav","Stevan","Theo","Tony EH","Vasilis"].sort();
    let playerProfiles = {};
    let teamAssignments = {};
    let matchResults = {};
    let attendance = [];
    let guests = [];
    let matchComments = {};
    let isAdminLoggedIn = false, currentUser = null;
    let weeklyCaptain = "Carlo";
    let weatherData = { temp: "18°C", condition: "Clear", icon: "fa-sun", rainChance: 10 };
    const POSITIONS = ["Goalkeeper","Defender","Midfielder","Striker","Winger"];
    let chatUnsubscribe = null;
    
    // Timer
    let timerInterval = null, currentHalf = 1, timeLeft = 45 * 60;
    function playAlarm() { try { const ctx=new (AudioContext||webkitAudioContext)(); const o=ctx.createOscillator(), g=ctx.createGain(); o.connect(g); g.connect(ctx.destination); o.frequency.value=880; g.gain.value=0.5; o.start(); g.gain.exponentialRampToValueAtTime(0.00001,ctx.currentTime+1.5); o.stop(ctx.currentTime+1.5); } catch(e){} }
    function formatTime(s){return `${Math.floor(s/60).toString().padStart(2,'0')}:${(s%60).toString().padStart(2,'0')}`;}
    function updateTimerDisplay(){let d=document.getElementById("timerDisplay");if(d)d.textContent=formatTime(timeLeft);let hs=document.getElementById("currentHalf");if(hs)hs.textContent=currentHalf===1?"FIRST HALF":"SECOND HALF";}
    function timerTick(){if(timeLeft<=0){if(timerInterval)clearInterval(timerInterval);playAlarm();if(currentHalf===1){alert("🔔 HALF TIME! Start second half.");currentHalf=2;timeLeft=45*60;updateTimerDisplay();}else{alert("🔔 FULL TIME! Match ended.");}return;}timeLeft--;updateTimerDisplay();}
    function startTimer(){if(timerInterval)clearInterval(timerInterval);timerInterval=setInterval(timerTick,1000);}
    function pauseTimer(){if(timerInterval){clearInterval(timerInterval);timerInterval=null;}}
    function resetTimer(){pauseTimer();currentHalf=1;timeLeft=45*60;updateTimerDisplay();}
    
    // Date Helpers
    function getNextMondayGame(){const now=new Date();const utc=now.getTime()+(now.getTimezoneOffset()*60000);const aestNow=new Date(utc+(10*3600000));const day=aestNow.getDay(),hour=aestNow.getHours();let days;if(day===1&&hour>=20)days=7;else if(day===1)days=0;else if(day===0)days=1;else days=(8-day)%7;const next=new Date(aestNow);next.setDate(aestNow.getDate()+days);next.setHours(20,0,0,0);return next;}
    function getCurrentGameWeekStr(){return getNextMondayGame().toISOString().split('T')[0];}
    function getCurrentGameLabel(){const m=getNextMondayGame();return `Mon ${m.toLocaleDateString('en-AU',{day:'numeric',month:'short'})}`;}
    function getAllGameWeeks(){const y=new Date().getFullYear();let s=new Date(y,0,1);while(s.getDay()!==1)s.setDate(s.getDate()+1);let w=[],c=new Date(s);let d31=new Date(y,11,31);let lm=new Date(d31);while(lm.getDay()!==1)lm.setDate(lm.getDate()-1);let sl=new Date(lm);sl.setDate(sl.getDate()-7);while(c<=sl){w.push({dateStr:c.toISOString().split('T')[0],label:`Mon ${c.toLocaleDateString('en-AU',{day:'numeric',month:'short'})}`});c.setDate(c.getDate()+7);}return w;}
    const ALL_WEEKS=getAllGameWeeks(),CURRENT_GAME_STR=getCurrentGameWeekStr();
    function getFutureWeeks(){return ALL_WEEKS.filter(w=>w.dateStr>=CURRENT_GAME_STR);}
    function getPastWeeks(){return ALL_WEEKS.filter(w=>w.dateStr<CURRENT_GAME_STR).reverse();}
    function getAllParticipants(gameDate){const p=attendance.filter(a=>a.gameDate===gameDate&&a.status==='in').map(a=>a.player);const g=guests.filter(g=>g.gameDate===gameDate).map(g=>({name:g.guestName,isGuest:true,addedBy:g.addedBy}));return{players:p,guests:g};}
    
    // Helpers
    function escapeHtml(s){return String(s).replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));}
    function getInitials(n){return n.split(' ').map(x=>x[0]).join('').toUpperCase().substring(0,2);}
    function getAvatarColor(n){const c=['#1a73e8','#28a745','#dc3545','#fd7e14','#6f42c1','#20c997'];let h=0;for(let i=0;i<n.length;i++)h=((h<<5)-h)+n.charCodeAt(i);return c[Math.abs(h)%c.length];}
    function renderAvatar(n,s=50){return `<div class="profile-avatar" style="background:${getAvatarColor(n)};width:${s}px;height:${s}px;font-size:${s/2.5}px;">${getInitials(n)}</div>`;}
    function renderMiniAvatar(n,s=28){return `<div class="player-avatar-small" style="background:${getAvatarColor(n)};width:${s}px;height:${s}px;font-size:${s/2}px;">${getInitials(n)}</div>`;}
    
    // Weather
    async function fetchWeather(){try{const r=await fetch('https://api.open-meteo.com/v1/forecast?latitude=-37.77&longitude=144.97&hourly=temperature_2m,precipitation_probability,weathercode&timezone=Australia/Melbourne&forecast_days=7');const d=await r.json();const target=CURRENT_GAME_STR;for(let i=0;i<d.hourly.time.length;i++){const hd=d.hourly.time[i].split('T')[0];const hr=parseInt(d.hourly.time[i].split('T')[1].substring(0,2));if(hd===target&&hr===20){const t=Math.round(d.hourly.temperature_2m[i]);const code=d.hourly.weathercode[i];let cond="Clear",icon="fa-sun";if(code===0){cond="Clear";icon="fa-sun";}else if(code===1||code===2){cond="Partly cloudy";icon="fa-cloud-sun";}else if(code===3){cond="Overcast";icon="fa-cloud";}else if(code>=51&&code<=67){cond="Light rain";icon="fa-cloud-rain";}else if(code>=80&&code<=99){cond="Rain/storm";icon="fa-cloud-bolt";}weatherData={temp:`${t}°C`,condition:cond,icon,rainChance:d.hourly.precipitation_probability[i]||0};break;}}}catch(e){}renderWeatherPage();}
    
    // Firebase CRUD
    async function loadData(){if(!firebaseReady||!db)return;try{const[pDoc,profDoc,tDoc,rDoc,attSnap,guestSnap,commentsSnap]=await Promise.all([db.collection("config").doc("players").get(),db.collection("config").doc("playerProfiles").get(),db.collection("config").doc("teamAssignments").get(),db.collection("config").doc("matchResults").get(),db.collection("attendance").get(),db.collection("guests").get(),db.collection("matchComments").get()]);if(pDoc.exists)players=pDoc.data().list.sort();if(profDoc.exists)playerProfiles=profDoc.data();if(tDoc.exists)teamAssignments=tDoc.data();if(rDoc.exists)matchResults=rDoc.data();attendance=attSnap.docs.map(d=>d.data());guests=guestSnap.docs.map(d=>d.data());matchComments={};commentsSnap.docs.forEach(doc=>{const d=doc.data();if(!matchComments[d.gameDate])matchComments[d.gameDate]=[];matchComments[d.gameDate].push(d);});for(let p of players)if(!playerProfiles[p])playerProfiles[p]={age:'—',position:'—',yearJoined:'—',gamesPlayed:0};}catch(e){console.warn(e);}}
    async function saveAttendance(a){if(firebaseReady&&db)await db.collection("attendance").doc(`${a.player}_${a.gameDate}`).set(a);const idx=attendance.findIndex(x=>x.player===a.player&&x.gameDate===a.gameDate);if(idx!==-1)attendance[idx]=a;else attendance.push(a);const games=attendance.filter(att=>att.player===a.player&&att.status==='in').length;if(playerProfiles[a.player])playerProfiles[a.player].gamesPlayed=games;else playerProfiles[a.player]={age:'—',position:'—',yearJoined:'—',gamesPlayed:games};if(firebaseReady&&db)await db.collection("config").doc("playerProfiles").set(playerProfiles);refreshAll();}
    async function saveGuest(g){if(firebaseReady&&db)await db.collection("guests").doc(`${g.guestName}_${g.gameDate}`).set(g);guests.push(g);refreshAll();}
    async function removeGuest(n,d){if(!confirm(`Remove guest "${n}"?`))return;if(firebaseReady&&db)await db.collection("guests").doc(`${n}_${d}`).delete();guests=guests.filter(g=>!(g.guestName===n&&g.gameDate===d));if(teamAssignments[d]){delete teamAssignments[d][n];delete teamAssignments[d][`guest_${n}`];if(firebaseReady&&db)await db.collection("config").doc("teamAssignments").set(teamAssignments);}refreshAll();}
    async function saveTeamAssignments(date,assign){teamAssignments[date]=assign;if(firebaseReady&&db)await db.collection("config").doc("teamAssignments").set(teamAssignments);refreshAll();}
    async function saveComment(date,author,text){const c={gameDate:date,author,text,timestamp:Date.now()};if(firebaseReady&&db)await db.collection("matchComments").add(c);if(!matchComments[date])matchComments[date]=[];matchComments[date].push(c);renderHistoryPage();}
    async function saveMatchResult(date,yellow,orange,goals,assists,mvp,injuries,ownGoals){matchResults[date]={yellowScore:yellow,orangeScore:orange,goals,assists:assists||{},mvp,injuries:injuries||[],ownGoals:ownGoals||[],timestamp:Date.now()};if(firebaseReady&&db)await db.collection("config").doc("matchResults").set(matchResults);renderHistoryPage();renderScoreboardPage();if(isAdminLoggedIn)renderAdminPage();}
    async function saveChatMessage(msg){if(!currentUser||!msg.trim())return;if(firebaseReady&&db)await db.collection("chatMessages").add({name:currentUser.name,message:msg.trim(),timestamp:firebase.firestore.FieldValue.serverTimestamp()});}
    async function adminAddManualAttendance(pn){if(!players.includes(pn)){alert("Player not in roster");return;}const ex=attendance.find(a=>a.player===pn&&a.gameDate===CURRENT_GAME_STR);if(ex?.status==='in'){alert(`${pn} already playing`);return;}await saveAttendance({player:pn,gameDate:CURRENT_GAME_STR,status:'in'});alert(`${pn} added`);}
    async function setAttendance(status){if(!currentUser){alert("Login required");return;}await saveAttendance({player:currentUser.name,gameDate:CURRENT_GAME_STR,status:status});}
    async function addGuest(name){if(!currentUser){alert("Login first");return;}if(guests.some(g=>g.gameDate===CURRENT_GAME_STR&&g.guestName===name.trim())){alert("Guest exists");return;}await saveGuest({guestName:name.trim(),gameDate:CURRENT_GAME_STR,addedBy:currentUser.name});const inp=document.getElementById("guestNameInput");if(inp)inp.value="";alert(`Guest "${name}" added!`);}
    function showEditProfile(name){if(!isAdminLoggedIn&&currentUser?.name!==name){alert("You can only edit your own profile");return;}const ex=playerProfiles[name]||{age:'',position:POSITIONS[0],yearJoined:''};const modal=document.createElement('div');modal.className='modal';modal.innerHTML=`<div class="modal-content"><h3>✏️ Edit ${escapeHtml(name)}</h3><label>Age</label><input id="editAge" value="${escapeHtml(ex.age||'')}"><label>Position</label><select id="editPosition">${POSITIONS.map(p=>`<option ${ex.position===p?'selected':''}>${p}</option>`).join('')}</select><label>Year Joined</label><input id="editYear" value="${escapeHtml(ex.yearJoined||'')}"><div class="flex-btns"><button id="saveBtn">Save</button><button id="cancelBtn" class="btn-outline">Cancel</button></div></div>`;document.body.appendChild(modal);document.getElementById('saveBtn').onclick=async()=>{playerProfiles[name]={age:document.getElementById('editAge').value.trim()||'—',position:document.getElementById('editPosition').value,yearJoined:document.getElementById('editYear').value.trim()||'—',gamesPlayed:playerProfiles[name]?.gamesPlayed||0};if(firebaseReady&&db)await db.collection("config").doc("playerProfiles").set(playerProfiles);modal.remove();renderProfilesPage();};document.getElementById('cancelBtn').onclick=()=>modal.remove();}
    function refreshAll(){renderHomePage();renderTeamsPage();renderHistoryPage();renderProfilesPage();renderScoreboardPage();if(isAdminLoggedIn)renderAdminPage();}
    
    // ==================== AI SPORTS REPORTER MATCH SUMMARY ====================
    function generateSportsReport(weekLabel, yellowScore, orangeScore, goals, assists, mvp, injuries, ownGoals, yellowTeam, orangeTeam) {
        const winner = yellowScore > orangeScore ? "YELLOW" : (orangeScore > yellowScore ? "ORANGE" : "DRAW");
        const winnerEmoji = yellowScore > orangeScore ? "🟡" : (orangeScore > yellowScore ? "🟠" : "🤝");
        
        // Build goal description
        let goalText = "";
        const allGoals = {...goals};
        if(ownGoals && ownGoals.length) {
            ownGoals.forEach(og => { allGoals[`OWN GOAL (${og.player})`] = (allGoals[`OWN GOAL (${og.player})`] || 0) + 1; });
        }
        const goalEntries = Object.entries(allGoals);
        if(goalEntries.length) {
            goalText = goalEntries.map(([p,c]) => {
                if(p.includes("OWN GOAL")) return `⚽ ${p} (embarrassing moment for ${p.replace("OWN GOAL (","").replace(")","")}) - ${c} goal${c>1?'s':''}`;
                return `⚽ ${p} - ${c} goal${c>1?'s':''}`;
            }).join('\n');
        } else {
            goalText = "⚽ NO GOALS SCORED - a defensive masterclass (or offensive disasterclass)";
        }
        
        // Build assists description
        let assistText = "";
        if(assists && Object.keys(assists).length) {
            assistText = Object.entries(assists).map(([a,c]) => `🎯 ${a} - ${c} assist${c>1?'s':''}`).join('\n');
        } else {
            assistText = "🎯 No assists officially recorded - everyone was being selfish!";
        }
        
        // Injury report
        let injuryText = "";
        if(injuries && injuries.length) {
            injuryText = `🏥 **INJURY REPORT**\n${injuries.map(i => `🩺 ${i}`).join('\n')}\n\nWishing these warriors a speedy recovery! 💪`;
        } else {
            injuryText = "🏥 **INJURY REPORT**\n🩺 Thankfully no injuries to report this week. Everyone lives to fight another day! 💪";
        }
        
        // Determine match description based on score difference
        const diff = Math.abs(yellowScore - orangeScore);
        let matchIntensity = "";
        if(diff >= 5) matchIntensity = "absolute demolition";
        else if(diff >= 3) matchIntensity = "convincing victory";
        else if(diff >= 1) matchIntensity = "hard-fought battle";
        else matchIntensity = "tense stalemate";
        
        // Random reporter-style opening lines
        const openings = [
            `🎙️ **MONDAY NIGHT FOOTBALL REPORT - ${weekLabel}**\n\nGood evening football fans! What a night at Clifton Park! The atmosphere was electric as `,

            `⚽ **BREAKING: MONDAY NIGHT MAYHEM**\n\nThe beautiful game was on full display as `,
            `🎙️ "And they're off!" - Another classic Monday night unfolded as `
        ];
        
        const opener = openings[Math.floor(Math.random() * openings.length)];
        
        const yellowTeamNames = yellowTeam.slice(0,5).join(", ") + (yellowTeam.length>5 ? ` and ${yellowTeam.length-5} others` : "");
        const orangeTeamNames = orangeTeam.slice(0,5).join(", ") + (orangeTeam.length>5 ? ` and ${orangeTeam.length-5} others` : "");
        
        const summary = `${opener}🟡 YELLOW (${yellowTeam.length} players: ${yellowTeamNames}) took on 🟠 ORANGE (${orangeTeam.length} players: ${orangeTeamNames}) in what turned out to be an ${matchIntensity}.\n\n📊 **FINAL SCORE**\n🟡 YELLOW ${yellowScore} - ${orangeScore} 🟠\n\n🎯 **GOAL SCORERS**\n${goalText}\n\n${assistText}\n\n🏆 **MAN OF THE MATCH**\n⭐ ${mvp || "The Referee (for keeping 22 grown men under control)"} ⭐\n\n${injuryText}\n\n📈 **MATCH SUMMARY**\nThe ${winnerEmoji} ${winner} team emerged victorious after ${diff === 0 ? "a stalemate that had everyone on the edge of their seats" : `a ${diff}-goal thriller`}. The Clifton Park pitch witnessed moments of brilliance, questionable defending, and at least one player asking "what's the score again?"\n\n📅 **NEXT WEEK**\nSame time, same place. Monday 8pm at Clifton Park. Don't be late - the grass doesn't care about your excuses.\n\n#MondayNightSoccer #CliftonPark #MatchReport #FootballBanter`;
        
        return summary;
    }

        document.getElementById("addOwnGoalBtn")?.addEventListener("click",()=>{const week=reportWeekSelect.value;if(!week){alert("Select a match week first");return;}const player=prompt("Enter player name who scored an OWN GOAL:");if(player){ownGoals.push({player:player});alert(`Own goal recorded for ${player}`);}});
        document.getElementById("addAssistBtn")?.addEventListener("click",()=>{const week=reportWeekSelect.value;if(!week){alert("Select a match week first");return;}assists.push({player:'',count:1});updateAssistsUI();populateSelectors(week);});
        
        document.getElementById("submitMatchReportBtn")?.addEventListener("click",async()=>{const week=reportWeekSelect.value;if(!week){alert("Select a week");return;}const y=parseInt(document.getElementById("reportYellowScore")?.value)||0,o=parseInt(document.getElementById("reportOrangeScore")?.value)||0;const goals={};for(let gs of goalScorers)if(gs.player&&gs.count>0)goals[gs.player]=(goals[gs.player]||0)+gs.count;const assistObj={};for(let as of assists)if(as.player&&as.count>0)assistObj[as.player]=(assistObj[as.player]||0)+as.count;const mvp=document.getElementById("mvpSelect")?.value||"";const injuries=document.getElementById("injuriesInput")?.value.split(',').map(i=>i.trim()).filter(i=>i)||[];await saveMatchResult(week,y,o,goals,assistObj,mvp,injuries,ownGoals);const assignments=teamAssignments[week]||{};const yellowTeam=Object.keys(assignments).filter(k=>assignments[k]==="yellow"&&!k.startsWith("guest_"));const orangeTeam=Object.keys(assignments).filter(k=>assignments[k]==="orange"&&!k.startsWith("guest_"));const weekLabel=ALL_WEEKS.find(w=>w.dateStr===week)?.label||week;const report=generateSportsReport(weekLabel,y,o,goals,assistObj,mvp,injuries,ownGoals,yellowTeam,orangeTeam);if(generatedReportDiv&&reportTextDiv){reportTextDiv.innerText=report;generatedReportDiv.style.display="block";document.getElementById("whatsappShareBtn")?.addEventListener("click",()=>{const url=`https://wa.me/?text=${encodeURIComponent(report)}`;window.open(url,'_blank');});}alert("Match report saved and generated!");renderHistoryPage();renderScoreboardPage();});
        
        document.getElementById("manualAddBtn")?.addEventListener("click",()=>{const p=document.getElementById("manualPlayerSelect")?.value;if(p)adminAddManualAttendance(p);});document.getElementById("adminAddGuestBtn")?.addEventListener("click",async()=>{const gn=document.getElementById("adminGuestName")?.value.trim();if(gn)await addGuest(gn);document.getElementById("adminGuestName").value="";renderAdminPage();});document.querySelectorAll(".remove-guest-btn").forEach(btn=>btn.addEventListener("click",()=>removeGuest(btn.dataset.guest,btn.dataset.date)));document.getElementById("autoBalanceBtn")?.addEventListener("click",()=>{if(allList.length===0)return;const shuffled=[...allList];for(let i=shuffled.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[shuffled[i],shuffled[j]]=[shuffled[j],shuffled[i]];}const mid=Math.ceil(shuffled.length/2);const na={};shuffled.slice(0,mid).forEach(p=>{na[p.isGuest?`guest_${p.name}`:p.name]="yellow";});shuffled.slice(mid).forEach(p=>{na[p.isGuest?`guest_${p.name}`:p.name]="orange";});teamAssignments[gameDate]=na;saveTeamAssignments(gameDate,teamAssignments[gameDate]);renderAdminPage();renderTeamsPage();});document.getElementById("saveTeamsBtn")?.addEventListener("click",async()=>{const selects=document.querySelectorAll(".team-select");const na={};selects.forEach(sel=>{const n=sel.dataset.name,isG=sel.dataset.isguest==="true",t=sel.value;if(t)na[isG?`guest_${n}`:n]=t;});teamAssignments[gameDate]=na;await saveTeamAssignments(gameDate,teamAssignments[gameDate]);alert("Teams saved!");});}
    
    function initNav(){const mods=[{id:"home",name:"🏠 HOME"},{id:"profiles",name:"👤 PROFILES"},{id:"scoreboard",name:"🏆 STATS"},{id:"teamswk",name:"⚽ TEAMS"},{id:"history",name:"📖 HISTORY"},{id:"weather",name:"🌤️ WEATHER"},{id:"timer",name:"⏱️ TIMER"},{id:"chat",name:"💬 CHAT"},{id:"rules",name:"📜 RULES"}];if(isAdminLoggedIn)mods.push({id:"admin",name:"⚙️ ADMIN"});const nav=document.getElementById("topNavBar");if(nav)nav.innerHTML=mods.map(m=>`<button class="nav-module" data-module="${m.id}">${m.name}</button>`).join('');document.querySelectorAll(".nav-module").forEach(btn=>{btn.addEventListener("click",()=>{const id=btn.dataset.module;document.querySelectorAll(".module-container").forEach(c=>c.classList.remove("active-module"));document.getElementById(`module-${id}`)?.classList.add("active-module");document.querySelectorAll(".nav-module").forEach(b=>b.classList.remove("active"));btn.classList.add("active");if(id==="chat")renderChatPage();if(id==="timer")renderTimerPage();});});document.querySelector('.nav-module[data-module="home"]')?.click();}
    
    async function renderApp(){await loadData();await fetchWeather();const app=document.getElementById("app");app.innerHTML=`<div class="header"><div class="logo-icon"><i class="fas fa-futbol"></i></div><h1>MONDAY NIGHT SOCCER</h1><div class="user-row"><i class="fas fa-user-circle"></i> <strong>${currentUser?.role==="admin"?"ADMIN":currentUser?.name||"Player"}</strong> <button id="logoutBtnMain">Exit</button></div></div><div class="top-nav" id="topNavBar"></div><div id="module-home" class="module-container"><div id="homeContainer"></div></div><div id="module-profiles" class="module-container"><div id="page-profiles"></div></div><div id="module-scoreboard" class="module-container"><div id="page-scoreboard"></div></div><div id="module-teamswk" class="module-container"><div id="page-teamswk"></div></div><div id="module-history" class="module-container"><div id="page-history"></div></div><div id="module-weather" class="module-container"><div id="page-weather"></div></div><div id="module-timer" class="module-container"><div id="page-timer"></div></div><div id="module-chat" class="module-container"><div id="page-chat"></div></div><div id="module-rules" class="module-container"><div id="page-rules"></div></div>${isAdminLoggedIn?`<div id="module-admin" class="module-container"><div id="page-admin"></div></div>`:''}`;document.getElementById("logoutBtnMain").onclick=()=>{if(chatUnsubscribe)chatUnsubscribe();currentUser=null;localStorage.removeItem("soccer_user");renderLogin();};renderHomePage();renderProfilesPage();renderScoreboardPage();renderTeamsPage();renderHistoryPage();renderWeatherPage();renderTimerPage();renderChatPage();renderRulesPage();if(isAdminLoggedIn)renderAdminPage();initNav();}
    async function renderLogin(){await loadData();const app=document.getElementById("app");app.innerHTML=`<div class="login-box"><div class="login-logo"><i class="fas fa-futbol"></i></div><h2>Monday Night Soccer</h2><p>8pm Clifton Park • ${getCurrentGameLabel()}</p><select id="playerSelectLogin"><option value="">-- Select Your Name --</option>${players.map(p=>`<option value="${escapeHtml(p)}">${escapeHtml(p)}</option>`).join('')}</select><button id="playerLoginBtn">Enter as Player</button><hr><input type="password" id="adminPwLogin" placeholder="Admin Password"><button id="adminLoginBtn">Admin Login</button><div style="margin-top:12px;font-size:11px;">Admin: admin123</div></div>`;document.getElementById("playerLoginBtn").onclick=()=>{const n=document.getElementById("playerSelectLogin")?.value;if(n&&n!==""){currentUser={name:n,role:"player"};isAdminLoggedIn=false;localStorage.setItem("soccer_user",JSON.stringify(currentUser));renderApp();}else alert("Select your name");};document.getElementById("adminLoginBtn").onclick=()=>{const pw=document.getElementById("adminPwLogin")?.value;if(pw==="admin123"){currentUser={name:"Admin",role:"admin"};isAdminLoggedIn=true;localStorage.setItem("soccer_user",JSON.stringify(currentUser));renderApp();}else alert("Wrong password");};}
    const stored=localStorage.getItem("soccer_user");if(stored){try{const u=JSON.parse(stored);if(u.role==="admin"){isAdminLoggedIn=true;currentUser={name:"Admin",role:"admin"};}else{currentUser={name:u.name,role:"player"};}renderApp();}catch(e){renderLogin();}}else{renderLogin();}
</script>
</body>
