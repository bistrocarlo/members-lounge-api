<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Monday Night Soccer | Complete Hub</title>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        body{background:#eef2f5;font-family:'Inter',sans-serif;}
        .app{max-width:500px;margin:0 auto;background:#eef2f5;min-height:100vh;padding-bottom:20px;}
        .header{background:white;padding:14px 20px;text-align:center;border-bottom:1px solid #e2e8f0;}
        .logo-icon{width:56px;height:56px;background:#1a73e8;border-radius:24px;display:inline-flex;align-items:center;justify-content:center;margin:0 auto 6px;}
        .logo-icon i{font-size:28px;color:white;}
        .header h1{font-size:18px;font-weight:800;color:#1e293b;}
        .user-row{background:#f1f5f9;padding:5px 12px;border-radius:60px;display:inline-flex;align-items:center;gap:8px;margin-top:6px;font-size:12px;}
        .user-row button{background:#dc3545;border:none;padding:4px 12px;border-radius:40px;color:white;font-weight:600;font-size:11px;cursor:pointer;}
        .top-nav{background:white;padding:10px 12px;display:flex;flex-wrap:wrap;justify-content:center;gap:6px;border-bottom:1px solid #e2e8f0;}
        .nav-module{background:#f8fafc;border:none;padding:8px 14px;border-radius:60px;font-size:12px;font-weight:600;color:#475569;cursor:pointer;}
        .nav-module.active{background:#1a73e8;color:white;}
        .module-container{padding:16px;display:none;}
        .module-container.active-module{display:block;}
        .card{background:white;border-radius:24px;padding:18px;margin-bottom:14px;border:1px solid #e2e8f0;}
        .card h2{font-size:17px;font-weight:700;margin-bottom:14px;border-left:4px solid #1a73e8;padding-left:12px;}
        .attendance-card{background:linear-gradient(135deg,#1a73e8,#0d5bbf);color:white;border-radius:28px;padding:24px 20px;text-align:center;margin-bottom:16px;}
        .big-buttons{display:flex;gap:14px;margin:16px 0 12px;}
        .btn-play-big{background:#28a745;flex:1;padding:14px;border-radius:60px;font-weight:800;font-size:17px;border:none;color:white;cursor:pointer;}
        .btn-sit-big{background:#dc3545;flex:1;padding:14px;border-radius:60px;font-weight:800;font-size:17px;border:none;color:white;cursor:pointer;}
        .profile-item{background:#f8fafc;border-radius:20px;padding:14px;margin-bottom:10px;display:flex;align-items:center;gap:12px;}
        .profile-avatar{width:50px;height:50px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:white;font-weight:700;font-size:20px;}
        .player-avatar-small{width:32px;height:32px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:white;font-weight:600;font-size:13px;margin-right:4px;}
        .profile-badge{background:white;border-radius:40px;padding:4px 12px;font-size:11px;font-weight:600;display:inline-block;margin-right:6px;margin-bottom:4px;}
        .edit-profile-btn{background:#475569;padding:6px 14px;font-size:12px;border-radius:40px;border:none;color:white;cursor:pointer;}
        .match-card{background:white;border-radius:24px;margin-bottom:14px;border:1px solid #e2e8f0;overflow:hidden;}
        .match-header{background:#f8fafc;padding:12px 16px;display:flex;justify-content:space-between;}
        .match-result{background:#1a73e8;color:white;padding:4px 14px;border-radius:40px;font-weight:700;}
        .teams-section{padding:16px;background:linear-gradient(145deg,#2e7d32,#1b5e20);}
        .team-row{display:flex;gap:12px;}
        .team-box{flex:1;background:rgba(0,0,0,0.65);border-radius:18px;padding:12px;}
        .team-yellow{background:#ffc107;color:#2c2c2c;font-weight:800;text-align:center;padding:6px;border-radius:60px;margin-bottom:8px;}
        .team-orange{background:#fd7e14;color:white;font-weight:800;text-align:center;padding:6px;border-radius:60px;margin-bottom:8px;}
        .player-list{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;}
        .player-tag{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,0.2);border-radius:40px;padding:4px 10px;font-size:11px;color:white;}
        .score-big{text-align:center;margin-top:12px;font-size:22px;font-weight:800;background:rgba(0,0,0,0.6);border-radius:60px;padding:8px;color:white;}
        .goals-section{padding:12px 16px;background:#fefce8;}
        .goals-list{display:flex;flex-wrap:wrap;gap:8px;}
        .goal-badge{background:white;border-radius:40px;padding:5px 12px;font-size:12px;font-weight:600;border-left:3px solid #eab308;}
        .weather-card{background:linear-gradient(135deg,#0f2027,#203a43);color:white;border-radius:24px;padding:20px;text-align:center;}
        .admin-team-item{display:flex;justify-content:space-between;align-items:center;margin:8px 0;background:#f1f5f9;border-radius:60px;padding:8px 16px;flex-wrap:wrap;gap:8px;}
        .guest-tag{background:#d4edda;color:#155724;border-radius:40px;padding:6px 12px;font-size:13px;display:inline-flex;align-items:center;gap:6px;}
        .playing-list,.guest-section{background:#e8f0fe;border-radius:20px;padding:16px;margin-bottom:14px;}
        .guest-section{background:#f0fdf4;border:1px solid #bbf7d0;}
        .attendee-tag{display:inline-flex;align-items:center;gap:6px;background:#e2e8f0;padding:6px 12px;border-radius:40px;font-size:13px;margin:4px;}
        .data-table{width:100%;border-collapse:collapse;font-size:13px;}
        .data-table th,.data-table td{padding:10px;text-align:left;border-bottom:1px solid #e2e8f0;}
        .modal{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.5);display:flex;align-items:center;justify-content:center;z-index:1000;}
        .modal-content{background:white;border-radius:32px;padding:24px;max-width:380px;width:90%;}
        .login-box{background:white;border-radius:48px;padding:40px 28px;margin:40px 20px;text-align:center;}
        .login-logo{width:90px;height:90px;background:linear-gradient(135deg,#1a73e8,#0d5bbf);border-radius:32px;display:inline-flex;align-items:center;justify-content:center;margin:0 auto 20px;}
        select,input{width:100%;padding:14px;border:1.5px solid #e2e8f0;border-radius:60px;margin:8px 0;font-size:16px;}
        button{background:#1a73e8;color:white;border:none;padding:12px 20px;border-radius:60px;font-weight:700;cursor:pointer;}
        .flex-btns{display:flex;gap:12px;margin-top:12px;}
        .btn-outline{background:white;color:#1a73e8;border:2px solid #1a73e8;}
        .chat-message{margin-bottom:12px;}
        .chat-bubble{background:#f1f5f9;padding:10px 14px;border-radius:18px;font-size:14px;}
        .chat-name{font-weight:700;font-size:12px;color:#1a73e8;margin-bottom:4px;}
        .info-bar{background:#e8f0fe;border-radius:16px;padding:12px;font-size:12px;margin-bottom:16px;text-align:center;color:#1a73e8;font-weight:500;}
        .timer-container{background:linear-gradient(135deg,#1e293b,#0f172a);border-radius:28px;padding:20px;text-align:center;margin-bottom:16px;}
        .timer-display{font-size:56px;font-weight:800;font-family:monospace;color:#10b981;letter-spacing:4px;background:#00000030;border-radius:20px;padding:12px;margin-bottom:16px;}
        .timer-controls{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;}
        .timer-btn{padding:10px 20px;border-radius:60px;font-weight:700;font-size:14px;border:none;cursor:pointer;}
        .timer-btn.start{background:#10b981;color:white;}
        .timer-btn.pause{background:#f59e0b;color:white;}
        .timer-btn.reset{background:#ef4444;color:white;}
        .half-status{font-size:14px;color:#94a3b8;margin-top:10px;}
        .loading{text-align:center;padding:40px;color:#64748b;}
        .goal-entry{background:#eef2ff;border-radius:20px;padding:12px;margin-bottom:10px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
        .game-selector{background:#f1f5f9;border-radius:60px;padding:12px 16px;margin-bottom:16px;display:flex;gap:10px;align-items:center;}
        .game-selector select{flex:2;margin:0;padding:10px;}
        .password-modal{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.7);display:flex;align-items:center;justify-content:center;z-index:1001;}
        .password-modal-content{background:white;border-radius:32px;padding:28px;max-width:340px;width:90%;text-align:center;}
        .error-text{color:#dc3545;font-size:12px;margin-top:8px;}
        .rule-item{background:#f8fafc;border-radius:16px;padding:12px;margin-bottom:10px;border-left:3px solid #1a73e8;}
        .rule-time{font-weight:700;color:#1a73e8;}
    </style>
</head>
<body>
<div class="app" id="app"><div class="loading"><i class="fas fa-spinner fa-spin"></i> Loading Monday Night Soccer...</div></div>

<script>
(function() {
    // ============================================
    // SECRET ADMIN PASSWORD - ONLY CARLO KNOWS THIS
    // ============================================
    const CARLO_PASSWORD = "carlo123";
    
    // ============================================
    // PLAYER ROSTER
    // ============================================
    const DEFAULT_PLAYERS = ["Alex Rowe","Ali Mekawy","Carlo","Charlie","Chris Del Monaco","Chris M","Chris S","Danny","Dante","David","Dimitri","Enzo","Farid","Faros","Frank","George B","George T","Ivan","James Zoumis","James","Joe T","Joey","Kia","Leo","Manoli","Marco","Mario","Maurice","Nector","Paul","Perri","Peter","Ralph","Rocco","Stav","Stevan","Theo","Tony EH","Vasilis"].sort();
    
    // ============================================
    // FIREBASE
    // ============================================
    const firebaseConfig = {
        apiKey: "AIzaSyCWlFqDJyENgrUOhiLXCjSEi4Mk_54SA1w",
        authDomain: "monday-night-soccer-hub.firebaseapp.com",
        projectId: "monday-night-soccer-hub",
        storageBucket: "monday-night-soccer-hub.firebasestorage.app",
        messagingSenderId: "634335208908",
        appId: "1:634335208908:web:dca705b65fc52de0606969"
    };
    
    let db = null, firebaseReady = false;
    try { firebase.initializeApp(firebaseConfig); db = firebase.firestore(); firebaseReady = true; } catch(e) { console.warn("Firebase demo"); }
    
    // ============================================
    // DATA STORES
    // ============================================
    let players = [...DEFAULT_PLAYERS];
    let playerProfiles = {};
    let teamAssignments = {};
    let matchResults = {};
    let attendance = [];
    let guests = [];
    let isAdminLoggedIn = false;
    let currentUser = null;
    let weeklyCaptain = "Carlo";
    let weatherData = { temp: "18°C", condition: "Clear", icon: "fa-sun", rainChance: 10 };
    let chatUnsubscribe = null;
    let currentAdminGameDate = null;
    
    // ============================================
    // TIMER
    // ============================================
    let timerInterval = null, currentHalf = 1, timeLeft = 45 * 60;
    function formatTime(s) { let m = Math.floor(s/60); let sec = s%60; return (m<10?'0'+m:m)+':'+(sec<10?'0'+sec:sec); }
    function updateTimerDisplay() { let d = document.getElementById("timerDisplay"); if(d) d.textContent = formatTime(timeLeft); let hs = document.getElementById("currentHalf"); if(hs) hs.textContent = currentHalf===1?"FIRST HALF":"SECOND HALF"; }
    function playAlarm() { try { let a = new (window.AudioContext||window.webkitAudioContext)(); let o = a.createOscillator(); let g = a.createGain(); o.connect(g); g.connect(a.destination); o.frequency.value=880; g.gain.value=0.5; o.start(); g.gain.exponentialRampToValueAtTime(0.00001,a.currentTime+1.5); o.stop(a.currentTime+1.5); } catch(e){} }
    function timerTick() { if(timeLeft<=0) { if(timerInterval) clearInterval(timerInterval); playAlarm(); if(currentHalf===1) { alert("HALF TIME! Start second half?"); currentHalf=2; timeLeft=45*60; updateTimerDisplay(); } else { alert("FULL TIME! Match ended."); currentHalf=1; timeLeft=45*60; updateTimerDisplay(); } return; } timeLeft--; updateTimerDisplay(); }
    function startTimer() { if(timerInterval) clearInterval(timerInterval); timerInterval = setInterval(timerTick,1000); }
    function pauseTimer() { if(timerInterval) { clearInterval(timerInterval); timerInterval = null; } }
    function resetTimer() { pauseTimer(); currentHalf=1; timeLeft=45*60; updateTimerDisplay(); }
    
    // ============================================
    // AUSTRALIAN TIME - CORRECTLY GETS NEXT MONDAY (May 11, 2026)
    // ============================================
    function getAustralianTime() {
        let now = new Date();
        let utc = now.getTime() + (now.getTimezoneOffset() * 60000);
        return new Date(utc + (10 * 3600000));
    }
    
    function getNextMondayGameDate() {
        let now = getAustralianTime();
        let day = now.getDay();
        let hour = now.getHours();
        let daysUntilMonday;
        
        if(day === 1 && hour >= 20) {
            daysUntilMonday = 7;
        } else if(day === 1) {
            daysUntilMonday = 0;
        } else if(day === 0) {
            daysUntilMonday = 1;
        } else {
            daysUntilMonday = (8 - day) % 7;
        }
        
        let gameDate = new Date(now);
        gameDate.setDate(now.getDate() + daysUntilMonday);
        gameDate.setHours(0, 0, 0, 0);
        return gameDate;
    }
    
    function getCurrentGameLabel() {
        let d = getNextMondayGameDate();
        return 'Mon ' + d.toLocaleDateString('en-AU', {day:'numeric', month:'long'}) + ' 8pm';
    }
    
    let CURRENT_GAME_STR = getNextMondayGameDate().toISOString().split('T')[0];
    
    // ============================================
    // GAME WEEKS FOR SELECTOR
    // ============================================
    function getAllGameWeeks() {
        let weeks = [];
        let current = getNextMondayGameDate();
        for(let i = -24; i <= 4; i++) {
            let d = new Date(current);
            d.setDate(current.getDate() + (i * 7));
            if(d >= new Date(2024, 0, 1)) {
                weeks.push({
                    dateStr: d.toISOString().split('T')[0],
                    label: 'Mon ' + d.toLocaleDateString('en-AU', {day:'numeric', month:'short', year:'numeric'})
                });
            }
        }
        weeks.sort((a,b) => a.dateStr.localeCompare(b.dateStr));
        return weeks;
    }
    
    let ALL_WEEKS = getAllGameWeeks();
    currentAdminGameDate = CURRENT_GAME_STR;
    
    // ============================================
    // PARTICIPANT HELPERS
    // ============================================
    function getAllParticipants(gameDate) {
        let playersList = [];
        let guestsList = [];
        for(let a of attendance) if(a.gameDate === gameDate && a.status === 'in') playersList.push(a.player);
        for(let g of guests) if(g.gameDate === gameDate) guestsList.push({ name: g.guestName, addedBy: g.addedBy });
        return { players: playersList, guests: guestsList };
    }
    
    function getPlayersAndGuestsForGame(gameDate) {
        let parts = getAllParticipants(gameDate);
        let result = [];
        for(let p of parts.players) result.push({ name: p, isGuest: false, displayName: p });
        for(let g of parts.guests) result.push({ name: g.name, isGuest: true, displayName: g.name + ' (Guest)' });
        return result;
    }
    
    function getTeamForPlayer(gameDate, playerName, isGuest) {
        let assign = teamAssignments[gameDate] || {};
        let key = isGuest ? 'guest_' + playerName : playerName;
        return assign[key] || null;
    }
    
    // ============================================
    // HELPER FUNCTIONS
    // ============================================
    function escapeHtml(s) { if(!s) return ''; return String(s).replace(/[&<>]/g, m=>m==='&'?'&amp;':m==='<'?'&lt;':'&gt;'); }
    function getInitials(n) { return n.split(' ').map(x=>x[0]).join('').toUpperCase().substring(0,2); }
    function getAvatarColor(n) { let c = ['#1a73e8','#28a745','#dc3545','#fd7e14','#6f42c1']; let h=0; for(let i=0;i<n.length;i++) h=((h<<5)-h)+n.charCodeAt(i); return c[Math.abs(h)%c.length]; }
    function renderAvatar(n,s) { s=s||50; return '<div class="profile-avatar" style="background:'+getAvatarColor(n)+';width:'+s+'px;height:'+s+'px;font-size:'+(s/2.5)+'px;">'+getInitials(n)+'</div>'; }
    function renderMiniAvatar(n,s) { s=s||28; return '<div class="player-avatar-small" style="background:'+getAvatarColor(n)+';width:'+s+'px;height:'+s+'px;font-size:'+(s/2)+'px;">'+getInitials(n)+'</div>'; }
    
    // ============================================
    // WEATHER
    // ============================================
    async function fetchWeather() {
        try {
            let r = await fetch('https://api.open-meteo.com/v1/forecast?latitude=-37.77&longitude=144.97&hourly=temperature_2m,precipitation_probability,weathercode&timezone=Australia/Melbourne&forecast_days=7');
            let d = await r.json();
            let gameDate = getNextMondayGameDate();
            let targetStr = gameDate.toISOString().split('T')[0];
            for(let i=0; i<d.hourly.time.length; i++) {
                let hDate = d.hourly.time[i].split('T')[0];
                let hour = parseInt(d.hourly.time[i].split('T')[1].substring(0,2));
                if(hDate === targetStr && hour === 20) {
                    weatherData.temp = Math.round(d.hourly.temperature_2m[i]) + '°C';
                    let code = d.hourly.weathercode[i];
                    if(code === 0) { weatherData.condition = "Clear"; weatherData.icon = "fa-sun"; }
                    else if(code <= 2) { weatherData.condition = "Partly cloudy"; weatherData.icon = "fa-cloud-sun"; }
                    else if(code <= 3) { weatherData.condition = "Overcast"; weatherData.icon = "fa-cloud"; }
                    else if(code <= 67) { weatherData.condition = "Light rain"; weatherData.icon = "fa-cloud-rain"; }
                    else { weatherData.condition = "Stormy"; weatherData.icon = "fa-cloud-bolt"; }
                    weatherData.rainChance = d.hourly.precipitation_probability[i] || 0;
                    break;
                }
            }
        } catch(e) { console.warn("Weather fetch failed"); }
        renderWeatherPage();
    }
    
    // ============================================
    // FIREBASE OPERATIONS
    // ============================================
    async function loadData() {
        if(!firebaseReady || !db) return;
        try {
            let pDoc = await db.collection("config").doc("players").get();
            let profDoc = await db.collection("config").doc("playerProfiles").get();
            let tDoc = await db.collection("config").doc("teamAssignments").get();
            let rDoc = await db.collection("config").doc("matchResults").get();
            let attSnap = await db.collection("attendance").get();
            let guestSnap = await db.collection("guests").get();
            
            if(pDoc.exists) players = pDoc.data().list.sort();
            if(profDoc.exists) playerProfiles = profDoc.data();
            if(tDoc.exists) teamAssignments = tDoc.data();
            if(rDoc.exists) matchResults = rDoc.data();
            attendance = attSnap.docs.map(d => d.data());
            guests = guestSnap.docs.map(d => d.data());
            
            for(let p of players) if(!playerProfiles[p]) playerProfiles[p] = { age: '—', position: '—', yearJoined: '—', gamesPlayed: 0 };
        } catch(e) { console.warn(e); }
    }
    
    async function saveAttendance(a) { if(firebaseReady&&db) await db.collection("attendance").doc(a.player+'_'+a.gameDate).set(a); let idx = attendance.findIndex(x=>x.player===a.player&&x.gameDate===a.gameDate); if(idx!==-1) attendance[idx]=a; else attendance.push(a); refreshAll(); }
    async function saveGuest(g) { if(firebaseReady&&db) await db.collection("guests").doc(g.guestName+'_'+g.gameDate).set(g); guests.push(g); refreshAll(); }
    async function removeGuest(name,date) { if(!confirm('Remove guest "'+name+'"?')) return; if(firebaseReady&&db) await db.collection("guests").doc(name+'_'+date).delete(); guests = guests.filter(g=>!(g.guestName===name&&g.gameDate===date)); if(teamAssignments[date]){ delete teamAssignments[date][name]; delete teamAssignments[date]['guest_'+name]; if(firebaseReady&&db) await db.collection("config").doc("teamAssignments").set(teamAssignments); } refreshAll(); }
    async function saveTeamAssignments(date,assign) { teamAssignments[date] = assign; if(firebaseReady&&db) await db.collection("config").doc("teamAssignments").set(teamAssignments); refreshAll(); }
    async function saveMatchResult(date,yellow,orange,goals,assists,injuries) { matchResults[date] = { yellowScore: yellow, orangeScore: orange, goals: goals||{}, assists: assists||{}, injuries: injuries||[] }; if(firebaseReady&&db) await db.collection("config").doc("matchResults").set(matchResults); renderHistoryPage(); renderScoreboardPage(); if(isAdminLoggedIn) renderAdminPage(); }
    async function saveChatMessage(msg) { if(!currentUser || !msg.trim()) return; if(firebaseReady&&db) await db.collection("chatMessages").add({ name: currentUser.name, message: msg.trim(), timestamp: firebase.firestore.FieldValue.serverTimestamp() }); }
    async function setAttendance(status) { if(!currentUser){ alert("Login required"); return; } await saveAttendance({ player: currentUser.name, gameDate: CURRENT_GAME_STR, status: status }); alert(status==='in'?"✅ You're playing Monday!":"❌ Sorry you can't make it"); }
    async function addGuest(name) { if(guests.some(g=>g.gameDate===CURRENT_GAME_STR&&g.guestName===name.trim())){ alert("Guest already added"); return; } await saveGuest({ guestName: name.trim(), gameDate: CURRENT_GAME_STR, addedBy: currentUser ? currentUser.name : "Admin" }); let inp = document.getElementById("guestNameInput"); if(inp) inp.value = ""; alert("Guest added!"); }
    
    // ============================================
    // PROFILE EDITING - ONLY OWN PROFILE
    // ============================================
    function showEditProfile(name) {
        if(!currentUser || currentUser.name !== name) {
            alert("❌ You can only edit your own profile!");
            return;
        }
        let ex = playerProfiles[name] || { age: '', position: 'Midfielder', yearJoined: '', gamesPlayed: 0 };
        let modal = document.createElement('div');
        modal.className = 'modal';
        modal.innerHTML = '<div class="modal-content"><h3>✏️ Edit Your Profile: ' + escapeHtml(name) + '</h3><label>Age</label><input id="editAge" value="' + escapeHtml(ex.age) + '"><label>Position</label><select id="editPosition"><option>Goalkeeper</option><option>Defender</option><option>Midfielder</option><option>Striker</option><option>Winger</option></select><label>Year Joined</label><input id="editYear" value="' + escapeHtml(ex.yearJoined) + '"><div class="flex-btns"><button id="saveBtn">💾 Save</button><button id="cancelBtn" class="btn-outline">Cancel</button></div></div>';
        document.body.appendChild(modal);
        document.getElementById('saveBtn').onclick = async function() {
            playerProfiles[name] = { age: document.getElementById('editAge').value || '—', position: document.getElementById('editPosition').value, yearJoined: document.getElementById('editYear').value || '—', gamesPlayed: ex.gamesPlayed || 0 };
            if(firebaseReady && db) await db.collection("config").doc("playerProfiles").set(playerProfiles);
            modal.remove();
            renderProfilesPage();
            alert("✅ Profile updated!");
        };
        document.getElementById('cancelBtn').onclick = function() { modal.remove(); };
    }

    function generateMatchReport(resultData, gameLabel) {
        let y = resultData.yellowScore || 0, o = resultData.orangeScore || 0, goals = resultData.goals || {}, assists = resultData.assists || {}, injuries = resultData.injuries || [];
        let entries = [];
        for(let scorer in goals) { if(goals.hasOwnProperty(scorer)) { entries.push({ player: scorer, goals: goals[scorer], assists: assists[scorer] || 0 }); } }
        entries.sort((a,b) => b.goals - a.goals);
        let goalLines = '';
        for(let g of entries) { goalLines += '⚽ ' + g.player + ': ' + g.goals + ' goal' + (g.goals!==1?'s':'') + (g.assists>0?' (' + g.assists + ' assist' + (g.assists!==1?'s':'') + ')':'') + '\n'; }
        if(!goalLines) goalLines = '🔹 No goals recorded\n';
        let injuryLine = '\n✅ No injuries reported.';
        if(injuries.length > 0) { injuryLine = '\n🤕 INJURIES:\n'; for(let inj of injuries) { injuryLine += '• ' + inj.player + ' - ' + (inj.detail || 'knock') + '\n'; } }
        return '⚽ *MONDAY NIGHT SOCCER MATCH REPORT* ⚽\n📅 ' + gameLabel + ' | Clifton Park\n🌦️ ' + weatherData.condition + ', ' + weatherData.temp + ', rain ' + weatherData.rainChance + '%\n\n🟡 YELLOW ' + y + ' - ' + o + ' 🟠 ORANGE\n\n' + goalLines + '\n' + injuryLine + '\n\n👏 Great game! #MondayNightSoccer';
    }

    function renderScoreboardPage() {
        let c = document.getElementById("page-scoreboard");
        if(!c) return;
        let stats = new Map();
        for(let p of players) stats.set(p,{ goals:0, assists:0, apps:0 });
        for(let a of attendance) if(a.status==='in'&&stats.has(a.player)) stats.get(a.player).apps++;
        for(let date in matchResults) {
            let m = matchResults[date];
            if(m.goals) for(let s in m.goals) if(stats.has(s)) stats.get(s).goals += m.goals[s];
            if(m.assists) for(let a2 in m.assists) if(stats.has(a2)) stats.get(a2).assists += m.assists[a2];
        }

        all.sort((a,b)=>b.goals - a.goals);
        let topGoals = all.slice(0,10);
        let topAssists = [...all].sort((a,b)=>b.assists - a.assists).slice(0,10);

            });
            document.querySelectorAll(".removeGoal").forEach(function(btn) {
                btn.onclick = function() { let idx = parseInt(this.dataset.idx); goalEntries.splice(idx, 1); refreshGoalsUI(); updatePreview(); };
            });
        }
        
        function refreshInjuriesUI() {
            let div = document.getElementById("injuriesContainer");
            if(!div) return;
            let h = '';
            for(let i3 = 0; i3 < injuriesArr.length; i3++) {
                let inj = injuriesArr[i3];
                h += '<div class="goal-entry" style="background:#ffe8e8;"><select class="injuryPlayer" data-idx="'+i3+'">' + participants.map(function(p) { return '<option '+(p.name===inj.player?'selected':'')+'>'+escapeHtml(p.displayName)+'</option>'; }).join('') + '</select><input type="text" class="injuryDetail" data-idx="'+i3+'" value="'+escapeHtml(inj.detail||'injury')+'" placeholder="injury description" style="flex:2;"><button class="removeInjury" data-idx="'+i3+'" style="background:#dc3545;"><i class="fas fa-trash"></i></button></div>';
            }
            if(injuriesArr.length === 0) h = '<div style="color:gray;padding:12px;text-align:center;">No injuries recorded.</div>';
            div.innerHTML = h;
            
            document.querySelectorAll(".injuryPlayer").forEach(function(sel) {
                sel.onchange = function() { let idx = parseInt(this.dataset.idx); injuriesArr[idx].player = this.value; updatePreview(); };
            });
            document.querySelectorAll(".injuryDetail").forEach(function(inp) {
                inp.onchange = function() { let idx = parseInt(this.dataset.idx); injuriesArr[idx].detail = this.value; updatePreview(); };
            });
            document.querySelectorAll(".removeInjury").forEach(function(btn) {
                btn.onclick = function() { let idx = parseInt(this.dataset.idx); injuriesArr.splice(idx, 1); refreshInjuriesUI(); updatePreview(); };
            });
        }
        
        function updatePreview() {
            let previewDiv = document.getElementById("reportPreview");
            if(!previewDiv) return;
            let y = parseInt(document.getElementById("yellowScore")?.value) || 0;
            let o = parseInt(document.getElementById("orangeScore")?.value) || 0;
            let goals = {}, assists = {};
            for(let i4 = 0; i4 < goalEntries.length; i4++) {
                let g = goalEntries[i4];
                if(g.goals > 0) goals[g.player] = g.goals;
                if(g.assists > 0) assists[g.player] = g.assists;
            }
            let previewText = generateMatchReport({ yellowScore: y, orangeScore: o, goals: goals, assists: assists, injuries: injuriesArr }, selectedWeek.label);
            previewDiv.innerHTML = '<strong>📱 WhatsApp Preview:</strong><br><pre style="white-space:pre-wrap;font-family:monospace;font-size:11px;margin-top:8px;">'+escapeHtml(previewText)+'</pre>';
        }
        
        document.getElementById("addGoalBtn")?.addEventListener("click", function() {
            let defaultPlayer = participants.length > 0 ? participants[0].name : players[0];
            goalEntries.push({ player: defaultPlayer, goals: 0, assists: 0 });
            refreshGoalsUI();
            updatePreview();
        });
        
        document.getElementById("addOwnGoalBtn")?.addEventListener("click", function() {
            let defaultPlayer = participants.length > 0 ? participants[0].name : players[0];
            let ownGoalName = defaultPlayer + " (OWN GOAL)";
            goalEntries.push({ player: ownGoalName, goals: 1, assists: 0 });
            refreshGoalsUI();
            updatePreview();
            alert("⚠️ Own goal added for " + defaultPlayer + "! This adds 1 goal to the opponent's total score.");
        });
        
        document.getElementById("addInjuryBtn")?.addEventListener("click", function() {
            let defaultPlayer = participants.length > 0 ? participants[0].name : players[0];
            injuriesArr.push({ player: defaultPlayer, detail: "muscle strain" });
            refreshInjuriesUI();
            updatePreview();
        });
        
        document.getElementById("saveReportBtn")?.addEventListener("click", async function() {
            let y = parseInt(document.getElementById("yellowScore").value) || 0;
            let o = parseInt(document.getElementById("orangeScore").value) || 0;
            let goals = {}, assists = {};
            for(let i5 = 0; i5 < goalEntries.length; i5++) {
                let g = goalEntries[i5];
                if(g.goals > 0) goals[g.player] = g.goals;
                if(g.assists > 0) assists[g.player] = g.assists;
            }
            await saveMatchResult(selectedDate, y, o, goals, assists, injuriesArr);
            alert("✅ Match report saved successfully!");
            renderHistoryPage();
            renderScoreboardPage();
            renderAdminPage();
        });
        
        document.getElementById("shareWhatsAppBtn")?.addEventListener("click", function() {
            let y = parseInt(document.getElementById("yellowScore").value) || 0;
            let o = parseInt(document.getElementById("orangeScore").value) || 0;
            let goals = {}, assists = {};
            for(let i6 = 0; i6 < goalEntries.length; i6++) {
                let g = goalEntries[i6];
                if(g.goals > 0) goals[g.player] = g.goals;
                if(g.assists > 0) assists[g.player] = g.assists;
            }
            let txt = generateMatchReport({ yellowScore: y, orangeScore: o, goals: goals, assists: assists, injuries: injuriesArr }, selectedWeek.label);
            window.open('https://wa.me/?text=' + encodeURIComponent(txt), '_blank');
        });
        
        refreshGoalsUI();
        refreshInjuriesUI();
        updatePreview();
        document.getElementById("yellowScore")?.addEventListener("input", updatePreview);
        document.getElementById("orangeScore")?.addEventListener("input", updatePreview);
    }
    
    function showAdminPasswordModal() {
        let modal = document.createElement('div');
        modal.className = 'password-modal';
        modal.innerHTML = '<div class="password-modal-content"><i class="fas fa-lock" style="font-size:40px;color:#1a73e8;"></i><h3>Admin Authorization</h3><p>Enter administrator password:</p><input type="password" id="adminPasswordInput" placeholder="Enter password" autocomplete="off"><div id="adminPasswordError" style="color:#dc3545;font-size:12px;margin-top:8px;"></div><div class="flex-btns"><button id="submitAdminBtn">Verify</button><button id="cancelAdminBtn">Cancel</button></div></div>';
        document.body.appendChild(modal);
        document.getElementById('submitAdminBtn').onclick = function() {
            if(document.getElementById('adminPasswordInput').value === CARLO_PASSWORD) {
                isAdminLoggedIn = true;
                modal.remove();
                renderAdminPage();
                renderApp();
            } else {
                document.getElementById('adminPasswordError').textContent = '❌ Incorrect password. Access denied.';
            }
        };
        document.getElementById('cancelAdminBtn').onclick = function() { modal.remove(); };
    }
    
    // ============================================
    // NAVIGATION & APP INIT
    // ============================================
    function initNav() {
        let mods = [{id:"home",name:"🏠 HOME"},{id:"profiles",name:"👤 PROFILES"},{id:"scoreboard",name:"🏆 STATS"},{id:"teamswk",name:"⚽ THIS WEEK"},{id:"history",name:"📖 HISTORY"},{id:"weather",name:"🌤️ WEATHER"},{id:"timer",name:"⏱️ TIMER"},{id:"chat",name:"💬 CHAT"},{id:"rules",name:"📜 RULES"}];
        if(isAdminLoggedIn) mods.push({id:"admin",name:"⚙️ ADMIN"});
        let nav = document.getElementById("topNavBar");
        if(nav) nav.innerHTML = mods.map(m=>`<button class="nav-module" data-module="${m.id}">${m.name}</button>`).join('');
        document.querySelectorAll(".nav-module").forEach(btn=>{ btn.onclick = function(){ let id = this.dataset.module; document.querySelectorAll(".module-container").forEach(c=>c.classList.remove("active-module")); document.getElementById(`module-${id}`)?.classList.add("active-module"); document.querySelectorAll(".nav-module").forEach(b=>b.classList.remove("active")); this.classList.add("active"); if(id==="chat") renderChatPage(); if(id==="timer") renderTimerPage(); }; });
        document.querySelector('.nav-module[data-module="home"]')?.click();
    }
    
    async function renderApp() {
        await loadData(); await fetchWeather();
        let app = document.getElementById("app");
        app.innerHTML = '<div class="header"><div class="logo-icon"><i class="fas fa-futbol"></i></div><h1>MONDAY NIGHT SOCCER</h1><div class="user-row"><i class="fas fa-user-circle"></i> <strong>'+(currentUser?.name||"Player")+'</strong> <button id="logoutBtnMain">Exit</button></div></div><div class="top-nav" id="topNavBar"></div><div id="module-home" class="module-container"><div id="homeContainer"></div></div><div id="module-profiles" class="module-container"><div id="page-profiles"></div></div><div id="module-scoreboard" class="module-container"><div id="page-scoreboard"></div></div><div id="module-teamswk" class="module-container"><div id="page-teamswk"></div></div><div id="module-history" class="module-container"><div id="page-history"></div></div><div id="module-weather" class="module-container"><div id="page-weather"></div></div><div id="module-timer" class="module-container"><div id="page-timer"></div></div><div id="module-chat" class="module-container"><div id="page-chat"></div></div><div id="module-rules" class="module-container"><div id="page-rules"></div></div>'+(isAdminLoggedIn?'<div id="module-admin" class="module-container"><div id="page-admin"></div></div>':'')+'</div>';
        document.getElementById("logoutBtnMain").onclick = () => { if(chatUnsubscribe) chatUnsubscribe(); currentUser = null; isAdminLoggedIn = false; localStorage.removeItem("soccer_user"); renderLogin(); };
        renderHomePage(); renderProfilesPage(); renderScoreboardPage(); renderTeamsPage(); renderHistoryPage(); renderWeatherPage(); renderTimerPage(); renderChatPage(); renderRulesPage();
        if(isAdminLoggedIn) renderAdminPage();
        initNav();
    }
    
    async function renderLogin() {
        await loadData();
        let app = document.getElementById("app");
        app.innerHTML = '<div class="login-box"><div class="login-logo"><i class="fas fa-futbol"></i></div><h2>Monday Night Soccer</h2><p>8:00pm Kickoff • Clifton Park, Brunswick</p><select id="playerSelectLogin"><option value="">-- Select Your Name --</option>'+players.map(p=>`<option value="${escapeHtml(p)}">${escapeHtml(p)}</option>`).join('')+'</select><button id="playerLoginBtn">Enter as Player</button><hr style="margin:20px 0;"><input type="password" id="adminPwLogin" placeholder="Admin Password" autocomplete="off"><button id="adminLoginBtn">Admin Login</button></div>';
        document.getElementById("playerLoginBtn").onclick = function() { let n = document.getElementById("playerSelectLogin").value; if(n && n!=="") { currentUser = { name:n, role:"player" }; isAdminLoggedIn = false; localStorage.setItem("soccer_user", JSON.stringify(currentUser)); renderApp(); } else alert("Please select your name"); };
        document.getElementById("adminLoginBtn").onclick = function() { let pw = document.getElementById("adminPwLogin").value; if(pw === CARLO_PASSWORD) { currentUser = { name:"Admin", role:"admin" }; isAdminLoggedIn = true; localStorage.setItem("soccer_user", JSON.stringify(currentUser)); renderApp(); } else { alert("Incorrect admin password"); document.getElementById("adminPwLogin").value = ""; } };
    }
    
    let stored = localStorage.getItem("soccer_user");
    if(stored) {
        try {
            let u = JSON.parse(stored);
            if(u.role === "admin") {
                isAdminLoggedIn = true;
                currentUser = { name: "Admin", role: "admin" };
            } else {
                currentUser = { name: u.name, role: "player" };
            }
            renderApp();
        } catch(e) { renderLogin(); }
    } else { renderLogin(); }
})();
</script>
</body>
