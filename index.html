<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Monday Night Soccer | Complete Match Hub</title>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        body{background:#eef2f5;font-family:'Inter',sans-serif;}
        .app{max-width:500px;margin:0 auto;background:#eef2f5;min-height:100vh;padding-bottom:20px;}
        .header{background:white;padding:14px 20px;text-align:center;border-bottom:1px solid #e2e8f0;}
        .logo-icon{width:56px;height:56px;background:#1a73e8;border-radius:24px;display:inline-flex;align-items:center;justify-content:center;margin:0 auto 6px;}
        .logo-icon i{font-size:28px;color:white;}
        .header h1{font-size:18px;font-weight:800;color:#1e293b;}
        .user-row{background:#f1f5f9;padding:5px 12px;border-radius:60px;display:inline-flex;align-items:center;gap:8px;margin-top:6px;font-size:12px;}
        .user-row button{background:#dc3545;border:none;padding:4px 12px;border-radius:40px;color:white;font-weight:600;font-size:11px;cursor:pointer;}
        .top-nav{background:white;padding:10px 12px;display:flex;flex-wrap:wrap;justify-content:center;gap:6px;border-bottom:1px solid #e2e8f0;position:sticky;top:0;z-index:10;}
        .nav-module{background:#f8fafc;border:none;padding:8px 14px;border-radius:60px;font-size:12px;font-weight:600;color:#475569;cursor:pointer;transition:all 0.2s;}
        .nav-module.active{background:#1a73e8;color:white;}
        .module-container{padding:16px;display:none;}
        .module-container.active-module{display:block;}
        .card{background:white;border-radius:24px;padding:18px;margin-bottom:14px;border:1px solid #e2e8f0;box-shadow:0 2px 8px rgba(0,0,0,0.04);}
        .card h2{font-size:17px;font-weight:700;margin-bottom:14px;border-left:4px solid #1a73e8;padding-left:12px;}
        .attendance-card{background:linear-gradient(135deg,#1a73e8,#0d5bbf);color:white;border-radius:28px;padding:24px 20px;text-align:center;margin-bottom:16px;}
        .big-buttons{display:flex;gap:14px;margin:16px 0 12px;}
        .btn-play-big{background:#28a745;flex:1;padding:14px;border-radius:60px;font-weight:800;font-size:17px;border:none;color:white;cursor:pointer;}
        .btn-sit-big{background:#dc3545;flex:1;padding:14px;border-radius:60px;font-weight:800;font-size:17px;border:none;color:white;cursor:pointer;}
        .profile-item{background:#f8fafc;border-radius:20px;padding:14px;margin-bottom:10px;display:flex;align-items:center;gap:12px;}
        .profile-avatar{width:50px;height:50px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:white;font-weight:700;font-size:20px;flex-shrink:0;}
        .player-avatar-small{width:32px;height:32px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:white;font-weight:600;font-size:13px;margin-right:4px;}
        .profile-badge{background:white;border-radius:40px;padding:4px 12px;font-size:11px;font-weight:600;display:inline-block;margin-right:6px;margin-bottom:4px;}
        .match-card{background:white;border-radius:24px;margin-bottom:14px;border:1px solid #e2e8f0;overflow:hidden;}
        .match-header{background:#f8fafc;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;}
        .match-result{background:#1a73e8;color:white;padding:4px 14px;border-radius:40px;font-weight:700;}
        .teams-section{padding:16px;background:linear-gradient(145deg,#2e7d32,#1b5e20);}
        .team-row{display:flex;gap:12px;}
        .team-box{flex:1;background:rgba(0,0,0,0.65);border-radius:18px;padding:12px;}
        .team-yellow{background:#ffc107;color:#2c2c2c;font-weight:800;text-align:center;padding:6px;border-radius:60px;margin-bottom:8px;}
        .team-orange{background:#fd7e14;color:white;font-weight:800;text-align:center;padding:6px;border-radius:60px;margin-bottom:8px;}
        .player-list{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;}
        .player-tag{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,0.2);border-radius:40px;padding:4px 10px;font-size:11px;color:white;}
        .goals-section{padding:12px 16px;background:#fefce8;}
        .goal-badge{background:white;border-radius:40px;padding:5px 12px;font-size:12px;font-weight:600;border-left:3px solid #eab308;display:inline-block;margin:4px;}
        .weather-card{background:linear-gradient(135deg,#0f2027,#203a43);color:white;border-radius:24px;padding:20px;text-align:center;}
        .admin-team-item{display:flex;justify-content:space-between;align-items:center;margin:8px 0;background:#f1f5f9;border-radius:60px;padding:8px 16px;flex-wrap:wrap;gap:8px;}
        .guest-tag{background:#d4edda;color:#155724;border-radius:40px;padding:6px 12px;font-size:13px;display:inline-flex;align-items:center;gap:6px;}
        .playing-list,.guest-section{background:#e8f0fe;border-radius:20px;padding:16px;margin-bottom:14px;}
        .guest-section{background:#f0fdf4;border:1px solid #bbf7d0;}
        .attendee-tag{display:inline-flex;align-items:center;gap:6px;background:#e2e8f0;padding:6px 12px;border-radius:40px;font-size:13px;margin:4px;}
        .data-table{width:100%;border-collapse:collapse;font-size:13px;}
        .data-table th,.data-table td{padding:10px;text-align:left;border-bottom:1px solid #e2e8f0;}
        .modal{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.5);display:flex;align-items:center;justify-content:center;z-index:1000;}
        .modal-content{background:white;border-radius:32px;padding:24px;max-width:380px;width:90%;}
        .login-box{background:white;border-radius:48px;padding:40px 28px;margin:40px 20px;text-align:center;}
        .login-logo{width:90px;height:90px;background:linear-gradient(135deg,#1a73e8,#0d5bbf);border-radius:32px;display:inline-flex;align-items:center;justify-content:center;margin:0 auto 20px;}
        select,input{width:100%;padding:14px;border:1.5px solid #e2e8f0;border-radius:60px;margin:8px 0;font-size:16px;}
        button{background:#1a73e8;color:white;border:none;padding:12px 20px;border-radius:60px;font-weight:700;cursor:pointer;}
        .flex-btns{display:flex;gap:12px;margin-top:12px;}
        .chat-message{margin-bottom:12px;}
        .chat-bubble{background:#f1f5f9;padding:10px 14px;border-radius:18px;font-size:14px;}
        .chat-name{font-weight:700;font-size:12px;color:#1a73e8;margin-bottom:4px;}
        .info-bar{background:#e8f0fe;border-radius:16px;padding:12px;font-size:12px;margin-bottom:16px;text-align:center;color:#1a73e8;font-weight:500;}
        .timer-container{background:linear-gradient(135deg,#1e293b,#0f172a);border-radius:28px;padding:20px;text-align:center;margin-bottom:16px;}
        .timer-display{font-size:56px;font-weight:800;font-family:monospace;color:#10b981;letter-spacing:4px;background:#00000030;border-radius:20px;padding:12px;margin-bottom:16px;}
        .timer-controls{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;}
        .timer-btn{padding:10px 20px;border-radius:60px;font-weight:700;font-size:14px;border:none;cursor:pointer;}
        .timer-btn.start{background:#10b981;color:white;}
        .timer-btn.pause{background:#f59e0b;color:white;}
        .timer-btn.reset{background:#ef4444;color:white;}
        .half-status{font-size:14px;color:#94a3b8;margin-top:12px;}
        .loading{text-align:center;padding:40px;color:#64748b;}
        .goal-entry{background:#eef2ff;border-radius:20px;padding:12px;margin-bottom:10px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
        .share-wa-btn{background:#25D366;color:white;}
        .rule-item{background:#f8fafc;border-radius:16px;padding:12px;margin-bottom:10px;border-left:3px solid #1a73e8;}
        .rule-time{font-weight:700;color:#1a73e8;}
        .report-preview{background:#f0fdf4;border-radius:16px;padding:12px;margin-top:12px;font-size:12px;white-space:pre-line;border:1px solid #bbf7d0;}
    </style>
</head>
<body>
<div class="app" id="app"><div class="loading"><i class="fas fa-spinner fa-spin"></i> Loading...</div></div>

<script>
(function(){
    // ============================================================
    // 1. PLAYER ROSTER
    // ============================================================
    const DEFAULT_PLAYERS = ["Alex Rowe","Ali Mekawy","Carlo","Charlie","Chris Del Monaco","Chris M","Chris S","Danny","Dante","David","Dimitri","Enzo","Farid","Faros","Frank","George B","George T","Ivan","James Zoumis","James","Joe T","Joey","Kia","Leo","Manoli","Marco","Mario","Maurice","Nector","Paul","Perri","Peter","Ralph","Rocco","Stav","Stevan","Theo","Tony EH","Vasilis"].sort();
    
    // ============================================================
    // 2. FIREBASE CONFIG (existing project)
    // ============================================================
    const firebaseConfig = {
        apiKey: "AIzaSyCWlFqDJyENgrUOhiLXCjSEi4Mk_54SA1w",
        authDomain: "monday-night-soccer-hub.firebaseapp.com",
        projectId: "monday-night-soccer-hub",
        storageBucket: "monday-night-soccer-hub.firebasestorage.app",
        messagingSenderId: "634335208908",
        appId: "1:634335208908:web:dca705b65fc52de0606969"
    };
    
    let db = null;
    let firebaseReady = false;
    try {
        firebase.initializeApp(firebaseConfig);
        db = firebase.firestore();
        firebaseReady = true;
        console.log("Firebase ready");
    } catch(e) { console.warn("Firebase demo mode", e); }
    
    // ============================================================
    // 3. DATA STORES
    // ============================================================
    let players = [...DEFAULT_PLAYERS];
    let playerProfiles = {};
    let teamAssignments = {};
    let matchResults = {};      // { dateStr: { yellowScore, orangeScore, goals, assists, injuries } }
    let attendance = [];
    let guests = [];
    let matchComments = {};
    let isAdminLoggedIn = false;
    let currentUser = null;
    let weeklyCaptain = "Carlo";
    let weatherData = { temp: "18°C", condition: "Clear", icon: "fa-sun", rainChance: 10 };
    let chatUnsubscribe = null;
    
    // ============================================================
    // 4. MATCH TIMER (45min halves)
    // ============================================================
    let timerInterval = null;
    let currentHalf = 1;
    let timeLeft = 45 * 60;
    
    function formatTime(sec) {
        let mins = Math.floor(sec/60);
        let secs = sec % 60;
        return (mins < 10 ? '0' + mins : mins) + ':' + (secs < 10 ? '0' + secs : secs);
    }
    
    function updateTimerDisplay() {
        let d = document.getElementById("timerDisplay");
        if(d) d.textContent = formatTime(timeLeft);
        let hs = document.getElementById("currentHalf");
        if(hs) hs.textContent = currentHalf === 1 ? "FIRST HALF" : "SECOND HALF";
    }
    
    function playAlarm() {
        try {
            let audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            let osc = audioCtx.createOscillator();
            let gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.frequency.value = 880;
            gain.gain.value = 0.5;
            osc.start();
            gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + 1.5);
            osc.stop(audioCtx.currentTime + 1.5);
        } catch(e) {}
    }
    
    function timerTick() {
        if(timeLeft <= 0) {
            if(timerInterval) clearInterval(timerInterval);
            playAlarm();
            if(currentHalf === 1) {
                alert("🔔 HALF TIME! 45 minutes completed. Start second half?");
                currentHalf = 2;
                timeLeft = 45 * 60;
                updateTimerDisplay();
            } else {
                alert("🔔 FULL TIME! Match ended.");
                currentHalf = 1;
                timeLeft = 45 * 60;
                updateTimerDisplay();
            }
            return;
        }
        timeLeft--;
        updateTimerDisplay();
    }
    
    function startTimer() { if(timerInterval) clearInterval(timerInterval); timerInterval = setInterval(timerTick, 1000); }
    function pauseTimer() { if(timerInterval) { clearInterval(timerInterval); timerInterval = null; } }
    function resetTimer() { pauseTimer(); currentHalf = 1; timeLeft = 45 * 60; updateTimerDisplay(); }
    
    // ============================================================
    // 5. AUSTRALIAN TIMEZONE (AEST / AEDT) - CRITICAL FIX
    // ============================================================
    function getAustralianTime() {
        let now = new Date();
        let year = now.getFullYear();
        // AEST is UTC+10, AEDT is UTC+11
        // Daylight saving: Oct first Sunday to April first Sunday
        let october = new Date(year, 9, 1);
        let april = new Date(year, 3, 1);
        let dstStart = new Date(year, 9, 1);
        dstStart.setDate(1 + (7 - dstStart.getDay()) % 7);
        let dstEnd = new Date(year, 3, 1);
        dstEnd.setDate(1 + (7 - dstEnd.getDay()) % 7);
        let isDST = (now >= dstStart && now < dstEnd);
        let offset = isDST ? 11 : 10;
        let utc = now.getTime() + (now.getTimezoneOffset() * 60000);
        return new Date(utc + (offset * 3600000));
    }
    
    // Get the upcoming or current Monday game date at 8pm AEST/AEDT
    function getCurrentGameDate() {
        let australianNow = getAustralianTime();
        let day = australianNow.getDay(); // 0=Sun, 1=Mon
        let hour = australianNow.getHours();
        let minutes = australianNow.getMinutes();
        
        // Calculate days until Monday
        let daysToMonday = (day === 0 ? 6 : day - 1);
        let gameDate = new Date(australianNow);
        gameDate.setDate(australianNow.getDate() - daysToMonday);
        gameDate.setHours(0, 0, 0, 0);
        
        // If it's Monday after 8pm, the game is NEXT Monday
        if(day === 1 && (hour > 20 || (hour === 20 && minutes >= 0))) {
            gameDate.setDate(gameDate.getDate() + 7);
        }
        return gameDate;
    }
    
    function getCurrentGameLabel() {
        let d = getCurrentGameDate();
        return 'Mon ' + d.toLocaleDateString('en-AU', {day:'numeric',month:'short'});
    }
    
    let CURRENT_GAME_STR = getCurrentGameDate().toISOString().split('T')[0];
    
    function getPastWeeks() {
        let weeks = [];
        let currentGame = getCurrentGameDate();
        for(let i = 1; i <= 12; i++) {
            let pastDate = new Date(currentGame);
            pastDate.setDate(currentGame.getDate() - (i * 7));
            if(pastDate < new Date(2024, 0, 1)) break;
            weeks.push({
                dateStr: pastDate.toISOString().split('T')[0],
                label: 'Mon ' + pastDate.toLocaleDateString('en-AU', {day:'numeric',month:'short'})
            });
        }
        return weeks;
    }
    
    function getAllParticipants(gameDate) {
        return {
            players: attendance.filter(a => a.gameDate === gameDate && a.status === 'in').map(a => a.player),
            guests: guests.filter(g => g.gameDate === gameDate).map(g => ({ name: g.guestName, addedBy: g.addedBy }))
        };
    }
    
    // ============================================================
    // 6. HELPER FUNCTIONS
    // ============================================================
    function escapeHtml(str) {
        if(!str) return '';
        return String(str).replace(/[&<>]/g, function(m) {
            if(m === '&') return '&amp;';
            if(m === '<') return '&lt;';
            if(m === '>') return '&gt;';
            return m;
        });
    }
    
    function getInitials(name) {
        if(!name) return '??';
        return name.split(' ').map(n => n[0]).join('').toUpperCase().substring(0,2);
    }
    
    function getAvatarColor(name) {
        let colors = ['#1a73e8','#28a745','#dc3545','#fd7e14','#6f42c1','#20c997','#e83e8c'];
        let hash = 0;
        for(let i = 0; i < name.length; i++) hash = ((hash << 5) - hash) + name.charCodeAt(i);
        return colors[Math.abs(hash) % colors.length];
    }
    
    function renderAvatar(name, size) {
        size = size || 50;
        return '<div class="profile-avatar" style="background:' + getAvatarColor(name) + ';width:' + size + 'px;height:' + size + 'px;font-size:' + (size/2.5) + 'px;">' + getInitials(name) + '</div>';
    }
    
    function renderMiniAvatar(name, size) {
        size = size || 28;
        return '<div class="player-avatar-small" style="background:' + getAvatarColor(name) + ';width:' + size + 'px;height:' + size + 'px;font-size:' + (size/2) + 'px;">' + getInitials(name) + '</div>';
    }
    
    // ============================================================
    // 7. WEATHER FETCH
    // ============================================================
    async function fetchWeather() {
        try {
            let r = await fetch('https://api.open-meteo.com/v1/forecast?latitude=-37.77&longitude=144.97&hourly=temperature_2m,precipitation_probability,weathercode&timezone=Australia/Melbourne&forecast_days=3');
            let d = await r.json();
            let gameDate = getCurrentGameDate();
            let targetStr = gameDate.toISOString().split('T')[0];
            for(let i = 0; i < d.hourly.time.length; i++) {
                let hDate = d.hourly.time[i].split('T')[0];
                let hour = parseInt(d.hourly.time[i].split('T')[1].substring(0,2));
                if(hDate === targetStr && hour === 20) {
                    weatherData.temp = Math.round(d.hourly.temperature_2m[i]) + '°C';
                    let code = d.hourly.weathercode[i];
                    if(code === 0) { weatherData.condition = "Clear"; weatherData.icon = "fa-sun"; }
                    else if(code <= 2) { weatherData.condition = "Partly cloudy"; weatherData.icon = "fa-cloud-sun"; }
                    else if(code <= 3) { weatherData.condition = "Overcast"; weatherData.icon = "fa-cloud"; }
                    else if(code <= 67) { weatherData.condition = "Light rain"; weatherData.icon = "fa-cloud-rain"; }
                    else { weatherData.condition = "Stormy"; weatherData.icon = "fa-cloud-bolt"; }
                    weatherData.rainChance = d.hourly.precipitation_probability[i] || 0;
                    break;
                }
            }
        } catch(e) {}
        renderWeatherPage();
    }
    
    // ============================================================
    // 8. FIREBASE DATA OPERATIONS
    // ============================================================
    async function loadData() {
        if(!firebaseReady || !db) return;
        try {
            let pDoc = await db.collection("config").doc("players").get();
            let profDoc = await db.collection("config").doc("playerProfiles").get();
            let tDoc = await db.collection("config").doc("teamAssignments").get();
            let rDoc = await db.collection("config").doc("matchResults").get();
            let attSnap = await db.collection("attendance").get();
            let guestSnap = await db.collection("guests").get();
            
            if(pDoc.exists) players = pDoc.data().list.sort();
            if(profDoc.exists) playerProfiles = profDoc.data();
            if(tDoc.exists) teamAssignments = tDoc.data();
            if(rDoc.exists) matchResults = rDoc.data();
            attendance = attSnap.docs.map(d => d.data());
            guests = guestSnap.docs.map(d => d.data());
            for(let p of players) {
                if(!playerProfiles[p]) playerProfiles[p] = { age: '—', position: '—', yearJoined: '—', gamesPlayed: 0 };
            }
        } catch(e) { console.warn(e); }
    }
    
    async function saveAttendance(a) {
        if(firebaseReady && db) await db.collection("attendance").doc(a.player + '_' + a.gameDate).set(a);
        let idx = attendance.findIndex(x => x.player === a.player && x.gameDate === a.gameDate);
        if(idx !== -1) attendance[idx] = a;
        else attendance.push(a);
        refreshAll();
    }
    
    async function saveGuest(g) {
        if(firebaseReady && db) await db.collection("guests").doc(g.guestName + '_' + g.gameDate).set(g);
        guests.push(g);
        refreshAll();
    }
    
    async function removeGuest(name, date) {
        if(!confirm('Remove guest "' + name + '"?')) return;
        if(firebaseReady && db) await db.collection("guests").doc(name + '_' + date).delete();
        guests = guests.filter(g => !(g.guestName === name && g.gameDate === date));
        if(teamAssignments[date]) {
            delete teamAssignments[date][name];
            delete teamAssignments[date]['guest_' + name];
            if(firebaseReady && db) await db.collection("config").doc("teamAssignments").set(teamAssignments);
        }
        refreshAll();
    }
    
    async function saveTeamAssignments(date, assign) {
        teamAssignments[date] = assign;
        if(firebaseReady && db) await db.collection("config").doc("teamAssignments").set(teamAssignments);
        refreshAll();
    }
    
    async function saveMatchResult(date, yellow, orange, goals, assists, injuries) {
        matchResults[date] = { yellowScore: yellow, orangeScore: orange, goals: goals || {}, assists: assists || {}, injuries: injuries || [] };
        if(firebaseReady && db) await db.collection("config").doc("matchResults").set(matchResults);
        renderHistoryPage();
        renderScoreboardPage();
        if(isAdminLoggedIn) renderAdminPage();
    }
    
    async function saveChatMessage(msg) {
        if(!currentUser || !msg.trim()) return;
        if(firebaseReady && db) await db.collection("chatMessages").add({ name: currentUser.name, message: msg.trim(), timestamp: firebase.firestore.FieldValue.serverTimestamp() });
    }
    
    async function setAttendance(status) {
        if(!currentUser) { alert("Please login first"); return; }
        await saveAttendance({ player: currentUser.name, gameDate: CURRENT_GAME_STR, status: status });
        alert(status === 'in' ? "✅ You're playing Monday night!" : "❌ Sorry you can't make it");
    }
    
    async function addGuest(name) {
        if(guests.some(g => g.gameDate === CURRENT_GAME_STR && g.guestName === name.trim())) { alert("Guest already added"); return; }
        await saveGuest({ guestName: name.trim(), gameDate: CURRENT_GAME_STR, addedBy: currentUser ? currentUser.name : "Admin" });
        let inp = document.getElementById("guestNameInput");
        if(inp) inp.value = "";
        alert("Guest " + name + " added!");
    }
    
    function showEditProfile(name) {
        let ex = playerProfiles[name] || { age: '', position: 'Midfielder', yearJoined: '', gamesPlayed: 0 };
        let modal = document.createElement('div');
        modal.className = 'modal';
        modal.innerHTML = '<div class="modal-content"><h3>Edit ' + escapeHtml(name) + '</h3><label>Age</label><input id="editAge" value="' + escapeHtml(ex.age) + '"><label>Position</label><select id="editPosition"><option>Goalkeeper</option><option>Defender</option><option>Midfielder</option><option>Striker</option><option>Winger</option></select><label>Year Joined</label><input id="editYear" value="' + escapeHtml(ex.yearJoined) + '"><div class="flex-btns"><button id="saveBtn">Save</button><button id="cancelBtn">Cancel</button></div></div>';
        document.body.appendChild(modal);
        document.getElementById('saveBtn').onclick = async function() {
            playerProfiles[name] = {
                age: document.getElementById('editAge').value || '—',
                position: document.getElementById('editPosition').value,
                yearJoined: document.getElementById('editYear').value || '—',
                gamesPlayed: ex.gamesPlayed || 0
            };
            if(firebaseReady && db) await db.collection("config").doc("playerProfiles").set(playerProfiles);

    // ============================================================
    // 9. MATCH REPORT GENERATOR (WhatsApp ready)
    // ============================================================
    function generateMatchReport(resultData, gameLabel) {
        let yellowScore = resultData.yellowScore || 0;
        let orangeScore = resultData.orangeScore || 0;
        let goalsMap = resultData.goals || {};
        let assistsMap = resultData.assists || {};
        let injuries = resultData.injuries || [];
        
        let goalEntries = [];
        for(let scorer in goalsMap) {
            goalEntries.push({ player: scorer, goals: goalsMap[scorer], assists: assistsMap[scorer] || 0 });
        }
        goalEntries.sort((a,b) => b.goals - a.goals);
        
        let goalLines = '';
        for(let g of goalEntries) {
            goalLines += '⚽ ' + g.player + ': ' + g.goals + ' goal' + (g.goals !== 1 ? 's' : '');
            if(g.assists > 0) goalLines += ' (' + g.assists + ' assist' + (g.assists !== 1 ? 's' : '') + ')';
            goalLines += '\n';
        }
        if(!goalLines) goalLines = '🔹 No goals recorded\n';
        
        let injuryLine = '\n✅ No injuries reported.';
        if(injuries.length > 0) {
            injuryLine = '\n🤕 INJURIES:\n';
            for(let inj of injuries) {
                injuryLine += '• ' + inj.player + ' - ' + (inj.detail || 'knock') + '\n';
            }
        }
        
        let australianTime = getAustralianTime();
        let timeStr = australianTime.toLocaleTimeString('en-AU', { hour: '2-digit', minute: '2-digit' });
        let weatherText = `${weatherData.condition}, ${weatherData.temp}, rain ${weatherData.rainChance}%`;
        
        return `⚽ *MONDAY NIGHT SOCCER MATCH REPORT* ⚽
📅 ${gameLabel} | Clifton Park, Brunswick
⏰ 8:00pm kickoff AEST/AEDT
🌦️ ${weatherText}

🟡 YELLOW ${yellowScore} - ${orangeScore} 🟠 ORANGE

${goalLines}
${injuryLine}

👏 Great game everyone! See you next Monday.
#MondayNightSoccer`;
    }

            let oScore = parseInt(document.getElementById("reportOrangeScore").value) || 0;
            let goalsMap = {}, assistsMap = {};
            for(let ge of goalEntries) { if(ge.goals > 0) goalsMap[ge.player] = ge.goals; if(ge.assists > 0) assistsMap[ge.player] = ge.assists; }
            await saveMatchResult(targetWeek.dateStr, yScore, oScore, goalsMap, assistsMap, injuriesArr);
            alert("Match report saved!");
            renderHistoryPage();
            renderAdminPage();
        });
        document.getElementById("shareWhatsAppBtn")?.addEventListener("click", () => {
            let yScore = parseInt(document.getElementById("reportYellowScore").value) || 0;
            let oScore = parseInt(document.getElementById("reportOrangeScore").value) || 0;
            let goalsMap = {}, assistsMap = {};
            for(let ge of goalEntries) { if(ge.goals > 0) goalsMap[ge.player] = ge.goals; if(ge.assists > 0) assistsMap[ge.player] = ge.assists; }
            let reportText = generateMatchReport({ yellowScore: yScore, orangeScore: oScore, goals: goalsMap, assists: assistsMap, injuries: injuriesArr }, targetWeek.label);
            window.open('https://wa.me/?text=' + encodeURIComponent(reportText), '_blank');
        });
        
        refreshGoalUI();
        refreshInjuryUI();
        updatePreview();
        
        document.getElementById("reportYellowScore")?.addEventListener("input", updatePreview);
        document.getElementById("reportOrangeScore")?.addEventListener("input", updatePreview);
    }
    
    // ============================================================
    // 12. NAVIGATION & APP INITIALIZATION
    // ============================================================
    function initNav() {
        let mods = [
            { id: "home", name: "🏠 HOME" }, { id: "profiles", name: "👤 PROFILES" }, { id: "scoreboard", name: "🏆 STATS" },
            { id: "teamswk", name: "⚽ THIS WEEK" }, { id: "history", name: "📖 HISTORY" }, { id: "weather", name: "🌤️ WEATHER" },
            { id: "timer", name: "⏱️ TIMER" }, { id: "chat", name: "💬 CHAT" }, { id: "rules", name: "📜 RULES" }
        ];
        if(isAdminLoggedIn) mods.push({ id: "admin", name: "⚙️ ADMIN" });
        let nav = document.getElementById("topNavBar");
        if(nav) nav.innerHTML = mods.map(m => `<button class="nav-module" data-module="${m.id}">${m.name}</button>`).join('');
        document.querySelectorAll(".nav-module").forEach(btn => {
            btn.onclick = function() {
                let id = this.dataset.module;
                document.querySelectorAll(".module-container").forEach(c => c.classList.remove("active-module"));
                document.getElementById(`module-${id}`)?.classList.add("active-module");
                document.querySelectorAll(".nav-module").forEach(b => b.classList.remove("active"));
                this.classList.add("active");
                if(id === "chat") renderChatPage();
                if(id === "timer") renderTimerPage();
            };
        });
        document.querySelector('.nav-module[data-module="home"]')?.click();
    }
    
    async function renderApp() {
        await loadData();
        await fetchWeather();
        let app = document.getElementById("app");
        app.innerHTML = `<div class="header"><div class="logo-icon"><i class="fas fa-futbol"></i></div><h1>MONDAY NIGHT SOCCER</h1><div class="user-row"><i class="fas fa-user-circle"></i> <strong>${currentUser?.role === "admin" ? "ADMIN" : currentUser?.name || "Player"}</strong> <button id="logoutBtnMain">Exit</button></div></div><div class="top-nav" id="topNavBar"></div>
        <div id="module-home" class="module-container"><div id="homeContainer"></div></div><div id="module-profiles" class="module-container"><div id="page-profiles"></div></div><div id="module-scoreboard" class="module-container"><div id="page-scoreboard"></div></div>
        <div id="module-teamswk" class="module-container"><div id="page-teamswk"></div></div><div id="module-history" class="module-container"><div id="page-history"></div></div><div id="module-weather" class="module-container"><div id="page-weather"></div></div>
        <div id="module-timer" class="module-container"><div id="page-timer"></div></div><div id="module-chat" class="module-container"><div id="page-chat"></div></div><div id="module-rules" class="module-container"><div id="page-rules"></div></div>
        ${isAdminLoggedIn ? '<div id="module-admin" class="module-container"><div id="page-admin"></div></div>' : ''}</div>`;
        document.getElementById("logoutBtnMain").onclick = () => { if(chatUnsubscribe) chatUnsubscribe(); currentUser = null; isAdminLoggedIn = false; localStorage.removeItem("soccer_user"); renderLogin(); };
        renderHomePage(); renderProfilesPage(); renderScoreboardPage(); renderTeamsPage(); renderHistoryPage(); renderWeatherPage(); renderTimerPage(); renderChatPage(); renderRulesPage();
        if(isAdminLoggedIn) renderAdminPage();
        initNav();
    }
    
    async function renderLogin() {
        await loadData();
        let app = document.getElementById("app");
        app.innerHTML = `<div class="login-box"><div class="login-logo"><i class="fas fa-futbol"></i></div><h2>Monday Night Soccer</h2><p>8:00pm Kickoff • Clifton Park, Brunswick</p><select id="playerSelectLogin"><option value="">-- Select Your Name --</option>${players.map(p => `<option value="${escapeHtml(p)}">${escapeHtml(p)}</option>`).join('')}</select><button id="playerLoginBtn">Enter as Player</button><hr><input type="password" id="adminPwLogin" placeholder="Admin Password"><button id="adminLoginBtn">Admin Login</button><p style="margin-top:12px;font-size:12px;">Demo admin: <strong>admin123</strong></p></div>`;
        document.getElementById("playerLoginBtn").onclick = () => { let n = document.getElementById("playerSelectLogin").value; if(n && n !== "") { currentUser = { name: n, role: "player" }; isAdminLoggedIn = false; localStorage.setItem("soccer_user", JSON.stringify(currentUser)); renderApp(); } else alert("Select your name"); };
        document.getElementById("adminLoginBtn").onclick = () => { let pw = document.getElementById("adminPwLogin").value; if(pw === "admin123") { currentUser = { name: "Admin", role: "admin" }; isAdminLoggedIn = true; localStorage.setItem("soccer_user", JSON.stringify(currentUser)); renderApp(); } else alert("Wrong password"); };
    }
    
    let stored = localStorage.getItem("soccer_user");
    if(stored) {
        try { let u = JSON.parse(stored); if(u.role === "admin") { isAdminLoggedIn = true; currentUser = { name: "Admin", role: "admin" }; } else { currentUser = { name: u.name, role: "player" }; } renderApp(); } catch(e) { renderLogin(); }
    } else { renderLogin(); }
})();
</script>
