<body>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyCWlFqDJyENgrUOhiLXCjSEi4Mk_54SA1w",

        firebase.initializeApp(firebaseConfig);

    } catch(e) { console.warn("Demo mode", e); }
    
    // COMPLETE FIXED PLAYER LIST (45 players)
    const FIXED_PLAYERS_LIST = [
        "Alex Rowe", "Ali Mekawy", "Carlo Pavia", "Charlie Pavia", 
        "Chris Del Monaco", "Chris Margelis", "Chris Sophocli", 
        "Danny Sammartino", "Dante Sammartino", "David", "Dimitri", 
        "Enzo", "Farid", "Faros", "Frank Marcaccio", "George Babatsikos", 
        "George Theodoropoulos", "Ivan", "James Zoumis", "James Martino", 
        "Joe Trimboli", "Joseph", "Kiarash Piani", "Leo", "Manoli", 
        "Marco Mercuri", "Mario", "Morris Del Monte", "Nector Laskaris", 
        "Paul Hardalas", "Perri Theodorlis", "Peter Disensi", "Ralph Risoli", 
        "Rocco Mammoliti", "Paul Salustro", "Stevan Brankovic", "Theo", 
        "Tony El Hajj", "Vasilis"
    ].sort();
    
    let players = [...FIXED_PLAYERS_LIST];
    let playerProfiles = {};
    let teamAssignments = {};
    let matchResults = {};
    let attendance = [];
    let guests = [];
    let matchComments = {};
    let financialRecords = {};
    let isAdminLoggedIn = false, currentUser = null;
    let weeklyCaptain = "Football Freedom";
    let weatherData = { temp: "18°C", condition: "Clear", icon: "fa-sun", rainChance: 10 };
    const POSITIONS = ["Goalkeeper","Defender","Midfielder","Striker","Winger"];
    let chatUnsubscribe = null;
    let timerInterval = null, currentHalf = 1, timeLeft = 45 * 60;
    const WEEKLY_FEE = 5;
    
    function playAlarm() { 
        try { 
            const ctx = new (window.AudioContext || window.webkitAudioContext)(); 
            const o = ctx.createOscillator(), g = ctx.createGain(); 
            o.connect(g); g.connect(ctx.destination); 
            o.frequency.value = 880; g.gain.value = 0.3; 
            o.start(); g.gain.exponentialRampToValueAtTime(0.00001, ctx.currentTime + 1.5); 
            o.stop(ctx.currentTime + 1.5); 
        } catch(e){} 
    }
    function formatTime(s){ return `${Math.floor(s/60).toString().padStart(2,'0')}:${(s%60).toString().padStart(2,'0')}`; }
    function updateTimerDisplay(){ let d = document.getElementById("timerDisplay"); if(d) d.textContent = formatTime(timeLeft); let hs = document.getElementById("currentHalf"); if(hs) hs.textContent = currentHalf === 1 ? "FIRST HALF" : "SECOND HALF"; }
    function timerTick(){ if(timeLeft <= 0){ if(timerInterval) clearInterval(timerInterval); playAlarm(); if(currentHalf === 1){ alert("🔔 HALF TIME! Click OK to start second half."); currentHalf = 2; timeLeft = 45 * 60; updateTimerDisplay(); startTimer(); } else { alert("🔔 FULL TIME! Match ended."); timerInterval = null; } return; } timeLeft--; updateTimerDisplay(); }
    function startTimer(){ if(timerInterval) clearInterval(timerInterval); timerInterval = setInterval(timerTick, 1000); }
    function pauseTimer(){ if(timerInterval){ clearInterval(timerInterval); timerInterval = null; } }
    function resetTimer(){ pauseTimer(); currentHalf = 1; timeLeft = 45 * 60; updateTimerDisplay(); }
    
    function getMondayDate(date) {
        const d = new Date(date);
        const day = d.getDay();
        const diff = (day === 0 ? -6 : 1) - day;
        d.setDate(d.getDate() + diff);
        d.setHours(20, 0, 0, 0);
        return d;
    }
    function getNextMondayGame() {
        const today = new Date();
        const nextMonday = getMondayDate(today);
        if (nextMonday < today) nextMonday.setDate(nextMonday.getDate() + 7);
        return nextMonday;
    }
    function getCurrentGameWeekStr(){ return getNextMondayGame().toISOString().split('T')[0]; }
    function getCurrentGameLabel(){ const m = getNextMondayGame(); return `Mon ${m.toLocaleDateString('en-AU',{day:'numeric',month:'short'})}`; }
    function getAllGameWeeks() {
        const weeks = [];
        const today = new Date();
        const startDate = new Date(today);
        startDate.setFullYear(today.getFullYear() - 1);
        let current = new Date(getMondayDate(startDate));
        const currentMonday = getMondayDate(today);
        while (current <= currentMonday) {
            weeks.push({ dateStr: current.toISOString().split('T')[0], label: `Mon ${current.toLocaleDateString('en-AU',{day:'numeric',month:'short',year:'numeric'})}` });
            current.setDate(current.getDate() + 7);
        }
        weeks.sort((a,b) => b.dateStr.localeCompare(a.dateStr));
        return weeks;
    }
    const ALL_WEEKS = getAllGameWeeks();
    const CURRENT_GAME_STR = getCurrentGameWeekStr();
    function getPastWeeks(){ return ALL_WEEKS.filter(w => w.dateStr < CURRENT_GAME_STR); }
    function getAllParticipants(gameDate){
        const playersIn = attendance.filter(a => a.gameDate === gameDate && a.status === 'in').map(a => a.player);
        const guestsIn = guests.filter(g => g.gameDate === gameDate).map(g => ({ name: g.guestName, isGuest: true, addedBy: g.addedBy }));
        return { players: playersIn, guests: guestsIn };
    }
    
    function escapeHtml(s){ return String(s).replace(/[&<>]/g, m=> ({'&':'&amp;','<':'&lt;','>':'&gt;'})[m]); }
    function getInitials(n){ return n.split(' ').map(x=>x[0]).join('').toUpperCase().substring(0,2); }
    function getAvatarColor(n){ const c=['#1a73e8','#28a745','#dc3545','#fd7e14','#6f42c1','#20c997']; let h=0; for(let i=0;i<n.length;i++) h=((h<<5)-h)+n.charCodeAt(i); return c[Math.abs(h)%c.length]; }
    function renderAvatar(n,s=50){ return `<div class="profile-avatar" style="background:${getAvatarColor(n)};width:${s}px;height:${s}px;font-size:${s/2.5}px;">${getInitials(n)}</div>`; }
    function renderMiniAvatar(n,s=28){ return `<div class="player-avatar-small" style="background:${getAvatarColor(n)};width:${s}px;height:${s}px;font-size:${s/2}px;">${getInitials(n)}</div>`; }
    
    function generateTeamSheet(yellowTeam, orangeTeam, gameLabel){
        const yellowList = yellowTeam.map(p => `${p.name}${p.isGuest ? ' (Guest)' : ''}`).join('\n');
        const orangeList = orangeTeam.map(p => `${p.name}${p.isGuest ? ' (Guest)' : ''}`).join('\n');
        return `⚽ *MONDAY NIGHT SOCCER - TEAM SHEET* ⚽\n📅 ${gameLabel} | 8:00pm Clifton Park\n\n🟡 *YELLOW TEAM* (${yellowTeam.length} players)\n${yellowList || '—'}\n\n🟠 *ORANGE TEAM* (${orangeTeam.length} players)\n${orangeList || '—'}\n\n👑 Captain: ${weeklyCaptain}\n📍 Clifton Park, Brunswick\n#MondayNightSoccer`;
    }
    
    function generateAIMatchReport(weekLabel, yellowScore, orangeScore, goals, assists, mvp, injuries, ownGoals){
        const winner = yellowScore > orangeScore ? "Yellow" : (orangeScore > yellowScore ? "Orange" : "Draw");
        let goalScorersText = Object.entries(goals).map(([p,c])=>`• ${p}: ${c} goal(s)`).join('\n') || "• No goals scored";
        let assistText = Object.entries(assists).map(([a,c])=>`• ${a}: ${c} assist(s)`).join('\n') || "• No assists recorded";
        return `📰 *MONDAY NIGHT SOCCER - MATCH REPORT* 📰\n*${weekLabel.toUpperCase()} | Clifton Park, Brunswick*\n\n━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n*MATCH SUMMARY*\n━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n🟡 YELLOW ${yellowScore} - ${orangeScore} 🟠\n\n━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n*GOAL SCORERS*\n━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n${goalScorersText}\n\n━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n*ASSISTS*\n━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n${assistText}\n\n━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n*MAN OF THE MATCH*\n━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n🏆 ${mvp || "The Referee"}\n\n━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n*INJURY REPORT*\n━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n${(injuries && injuries.length) ? injuries.map(i=>`• ${i}`).join('\n') : "• None reported"}\n\n#MondayNightSoccer #CliftonPark #MatchReport`;
    }
    
    // Financial functions
    async function loadFinancials() {
        if(firebaseReady && db){
            const doc = await db.collection("config").doc("financials").get();
            if(doc.exists) financialRecords = doc.data();
            else financialRecords = {};
        }
        for(let p of players) if(!financialRecords[p]) financialRecords[p] = { totalDebt: 0, payments: [] };
        renderFinancePage();
    }
    async function saveFinancials() {
        if(firebaseReady && db) await db.collection("config").doc("financials").set(financialRecords);
        renderFinancePage();
    }
    async function markPaid(playerName, weekStr) {
        if(!isAdminLoggedIn && currentUser?.name !== playerName) { alert("Only admin or player can mark paid"); return false; }
        const record = financialRecords[playerName] || { totalDebt: 0, payments: [] };
        if(record.payments.some(p => p.week === weekStr)) { alert(`${playerName} already paid for this week`); return false; }
        record.payments.push({ week: weekStr, amount: WEEKLY_FEE, date: new Date().toISOString() });
        const attendedWeeks = attendance.filter(a => a.player === playerName && a.status === 'in').map(a => a.gameDate);
        const paidWeeks = record.payments.map(p => p.week);
        const unpaidCount = attendedWeeks.filter(w => !paidWeeks.includes(w)).length;
        record.totalDebt = unpaidCount * WEEKLY_FEE;
        financialRecords[playerName] = record;
        await saveFinancials();
        alert(`✅ ${playerName} paid $${WEEKLY_FEE} for ${weekStr}`);
        renderFinancePage();
        return true;
    }
    async function recalcAllDebts() {
        for(let player of players) {
            const attendedWeeks = attendance.filter(a => a.player === player && a.status === 'in').map(a => a.gameDate);
            const paidWeeks = (financialRecords[player]?.payments || []).map(p => p.week);
            const unpaidCount = attendedWeeks.filter(w => !paidWeeks.includes(w)).length;
            if(!financialRecords[player]) financialRecords[player] = { totalDebt: 0, payments: [] };
            financialRecords[player].totalDebt = unpaidCount * WEEKLY_FEE;
        }
        await saveFinancials();
    }
    
    async function removeAttendee(playerName, gameDate){
        if(!isAdminLoggedIn && currentUser?.name !== playerName){ alert("Only admin or the player can remove attendance."); return false; }
        if(!confirm(`Remove ${playerName} from playing list?`)) return false;
        if(firebaseReady && db) await db.collection("attendance").doc(`${playerName}_${gameDate}`).delete();
        attendance = attendance.filter(a => !(a.player === playerName && a.gameDate === gameDate));
        if(teamAssignments[gameDate]){ delete teamAssignments[gameDate][playerName]; if(firebaseReady && db) await db.collection("config").doc("teamAssignments").set(teamAssignments); }
        const gamesCount = attendance.filter(a => a.player === playerName && a.status === 'in').length;
        const opening = playerProfiles[playerName]?.openingBalanceGames || 0;
        if(playerProfiles[playerName]) playerProfiles[playerName].gamesPlayed = gamesCount + opening;
        await recalcAllDebts();
        refreshAll();
        alert(`${playerName} removed.`);
        return true;
    }
    
    async function loadData(){
        if(!firebaseReady || !db) return;
        try{
            const [pDoc,profDoc,tDoc,rDoc,attSnap,guestSnap,commentsSnap] = await Promise.all([
                db.collection("config").doc("players").get(),
                db.collection("config").doc("playerProfiles").get(),
                db.collection("config").doc("teamAssignments").get(),
                db.collection("config").doc("matchResults").get(),
                db.collection("attendance").get(),
                db.collection("guests").get(),
                db.collection("matchComments").get()
            ]);
            if(pDoc.exists) players = pDoc.data().list.sort();
            if(profDoc.exists) playerProfiles = profDoc.data();
            if(tDoc.exists) teamAssignments = tDoc.data();
            if(rDoc.exists) matchResults = rDoc.data();
            attendance = attSnap.docs.map(d=>d.data());
            guests = guestSnap.docs.map(d=>d.data());
            matchComments = {};
            commentsSnap.docs.forEach(doc=>{ const d=doc.data(); if(!matchComments[d.gameDate]) matchComments[d.gameDate]=[]; matchComments[d.gameDate].push(d); });
            for(let p of players) if(!playerProfiles[p]) playerProfiles[p] = { age:'—', position:'—', yearJoined:'—', gamesPlayed:0, openingBalanceGames:0 };
            await loadFinancials();
            await recalcAllDebts();
            console.log("Data loaded - Team assignments:", teamAssignments);
        } catch(e){ console.warn(e); }
        refreshAll();
    }
    
    async function saveAttendance(a){
        if(firebaseReady&&db) await db.collection("attendance").doc(`${a.player}_${a.gameDate}`).set(a);
        const idx = attendance.findIndex(x=>x.player===a.player && x.gameDate===a.gameDate);
        if(idx!==-1) attendance[idx]=a; else attendance.push(a);
        const games = attendance.filter(att=>att.player===a.player && att.status==='in').length;
        const opening = playerProfiles[a.player]?.openingBalanceGames || 0;
        if(playerProfiles[a.player]) playerProfiles[a.player].gamesPlayed = games + opening;
        else playerProfiles[a.player] = { age:'—', position:'—', yearJoined:'—', gamesPlayed:games+opening, openingBalanceGames:0 };
        if(firebaseReady&&db) await db.collection("config").doc("playerProfiles").set(playerProfiles);
        await recalcAllDebts();
        refreshAll();
    }
    
    async function saveGuest(g){
        if(firebaseReady&&db) await db.collection("guests").doc(`${g.guestName}_${g.gameDate}`).set(g);
        guests.push(g);
        refreshAll();
    }
    
    async function removeGuest(n,d){
        if(!confirm(`Remove guest "${n}"?`)) return;
        if(firebaseReady&&db) await db.collection("guests").doc(`${n}_${d}`).delete();
        guests = guests.filter(g=>!(g.guestName===n && g.gameDate===d));
        if(teamAssignments[d]){ delete teamAssignments[d][n]; delete teamAssignments[d][`guest_${n}`]; if(firebaseReady&&db) await db.collection("config").doc("teamAssignments").set(teamAssignments); }
        refreshAll();
    }
    
    async function saveTeamAssignments(date,assign){
        teamAssignments[date] = assign;
        if(firebaseReady&&db) await db.collection("config").doc("teamAssignments").set(teamAssignments);
        console.log(`✅ Saved team assignments for ${date}:`, assign);
        refreshAll();
    }
    
    async function saveComment(date,author,text){
        const c={ gameDate:date, author, text, timestamp:Date.now() };
        if(firebaseReady&&db) await db.collection("matchComments").add(c);
        if(!matchComments[date]) matchComments[date]=[];
        matchComments[date].push(c);
        renderHistoryPage();
    }
    
    async function saveMatchResult(date,yellow,orange,goals,assists,mvp,injuries,ownGoals){
        matchResults[date] = { yellowScore:yellow, orangeScore:orange, goals, assists:assists||{}, mvp, injuries:injuries||[], ownGoals:ownGoals||[], timestamp:Date.now() };

(p.name)}</td><td><strong>${p.gamesPlayed}</strong></td></tr>`).join('')}</tbody></table></div><div><h3>🎯 MOST ASSISTS</h3><table class="data-table"><thead><tr><th>#</th><th>Player</th><th>Assists</th></tr></thead><tbody>${topAssists.map((p,i)=>`<tr><td style="width:40px;"><strong>${i+1}</strong></td><td>${renderMiniAvatar(p.name,24)} ${escapeHtml(p.name)}</td><td><strong>${p.assists}</strong></td></tr>`).join('')}</tbody></table></div></div>`; }

            totalDebt += record.totalDebt;
            const lastPaid = record.payments.length ? record.payments[record.payments.length-1].week : "Never";
            rows += `<div class="finance-row"><div style="display:flex;align-items:center;gap:8px;">${renderMiniAvatar(player,32)} <strong>${escapeHtml(player)}</strong></div><div>$${record.totalDebt}</div><div><span class="${record.totalDebt>0?'debt-badge':'paid-badge'}">${record.totalDebt>0 ? `OWES $${record.totalDebt}` : 'PAID'}</span></div><div><button class="pay-btn" data-player="${escapeHtml(player)}" data-week="${CURRENT_GAME_STR}">💰 Pay $5</button></div></div>`;
        }
        c.innerHTML = `<div class="card"><h2><i class="fas fa-dollar-sign"></i> FINANCIALS - $5/Week</h2><div class="info-bar">💰 Total Outstanding: $${totalDebt}</div>${rows}</div><div class="card"><h3>📜 Payment History (Last 3 weeks)</h3>${getPastWeeks().slice(0,3).map(w=>`<div><strong>${w.label}</strong><br>${players.filter(p => (financialRecords[p]?.payments||[]).some(pp=>pp.week===w.dateStr)).map(p=>escapeHtml(p)).join(', ') || 'None paid'}</div>`).join('<hr>')}</div>`;
        document.querySelectorAll(".pay-btn").forEach(btn => btn.addEventListener("click", async (e) => { const player = btn.dataset.player, week = btn.dataset.week; await markPaid(player, week); renderFinancePage(); }));
    }
    
    function renderAdminPage(){
        if(!isAdminLoggedIn){ const c=document.getElementById("page-admin"); if(c) c.innerHTML=`<div class="card"><h2>🔒 Admin</h2><button id="adminLoginBtn">Admin Login</button></div>`; document.getElementById("adminLoginBtn")?.addEventListener("click",()=>{ const pw=prompt("Enter admin password:"); if(pw==="admin123"){ isAdminLoggedIn=true; renderAdminPage(); refreshAll(); } else alert("Wrong password"); }); return; }
        const gameDate=CURRENT_GAME_STR, gameLabel=getCurrentGameLabel();
        const parts=getAllParticipants(gameDate);
        const allList=[...parts.players.map(p=>({ name:p, isGuest:false })), ...parts.guests.map(g=>({ name:g.name, isGuest:true, addedBy:g.addedBy }))];
        const currAssign=teamAssignments[gameDate]||{};
        let html = `<div class="info-bar">🔐 Admin Mode - ${gameLabel}</div><div class="card"><h2>⚽ ASSIGN TEAMS (Current Week)</h2><div id="teamAssignCurrent"></div><div class="flex-btns"><button id="autoBalanceBtn">🔄 Auto-Balance Teams</button><button id="saveTeamsBtn">💾 Save Teams</button></div></div><div class="card"><h2>🎭 Add Guest</h2><input id="adminGuestName" placeholder="Guest Name"><button id="adminAddGuestBtn">➕ Add Guest to Current Week</button></div>`;
        const container=document.getElementById("page-admin"); if(container) container.innerHTML=html;
        
        const teamDiv=document.getElementById("teamAssignCurrent");
        if(teamDiv){
            let inner = `<div style="display:flex;flex-direction:column;gap:8px;">`;
            for(let p of allList){
                const current = currAssign[p.name] || currAssign[`guest_${p.name}`] || "";
                inner += `<div class="admin-team-item"><span>${renderMiniAvatar(p.name,24)} ${escapeHtml(p.name)}${p.isGuest?' (Guest)':''}</span><select data-name="${escapeHtml(p.name)}" class="team-selector-select"><option value="">Unassigned</option><option value="yellow" ${current==="yellow"?"selected":""}>🟡 Yellow</option><option value="orange" ${current==="orange"?"selected":""}>🟠 Orange</option></select></div>`;
            }
            inner += `</div>`;
            teamDiv.innerHTML = inner;
        }
        document.getElementById("autoBalanceBtn")?.addEventListener("click",()=>{ const playerNames = allList.map(p => p.name); const shuffled = [...playerNames]; for(let i = shuffled.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]]; } const half = Math.ceil(shuffled.length / 2); const autoAssign = {}; shuffled.forEach((p, idx) => { autoAssign[p] = idx < half ? "yellow" : "orange"; }); saveTeamAssignments(gameDate, autoAssign); renderAdminPage(); renderTeamsPage(); });
        document.getElementById("saveTeamsBtn")?.addEventListener("click",()=>{ const newAssign = {}; document.querySelectorAll(".team-selector-select").forEach(sel => { if(sel.value) newAssign[sel.dataset.name] = sel.value; }); saveTeamAssignments(gameDate, newAssign); renderAdminPage(); renderTeamsPage(); });
        document.getElementById("adminAddGuestBtn")?.addEventListener("click", async () => { const inp = document.getElementById("adminGuestName"); const name = inp?.value.trim(); if(name){ await addGuestToWeek(name, gameDate); inp.value = ""; renderAdminPage(); } else alert("Enter guest name"); });
    }
    
    function showLoginModal(){
        const modal=document.createElement('div'); modal.className='modal'; 
        let playerOptions=FIXED_PLAYERS_LIST.map(p=>`<option value="${escapeHtml(p)}">${escapeHtml(p)}</option>`).join('');
        modal.innerHTML=`<div class="modal-content"><div style="width:80px;height:80px;background:#1a73e8;border-radius:24px;display:flex;align-items:center;justify-content:center;margin:0 auto 20px;"><i class="fas fa-futbol fa-3x" style="color:white;"></i></div><h3 style="text-align:center;">Monday Night Soccer</h3><select id="loginNameSelect"><option value="">Select your name</option>${playerOptions}</select><button id="loginBtn" style="width:100%;">Login</button><div style="margin-top:12px;"><button id="adminSwitchBtn" class="btn-outline" style="width:100%;">🔐 Admin Access</button></div></div>`;
        document.body.appendChild(modal);
        document.getElementById("loginBtn").onclick=()=>{ const sel=document.getElementById("loginNameSelect"); const name=sel?.value; if(name && FIXED_PLAYERS_LIST.includes(name)){ currentUser={name}; isAdminLoggedIn=false; modal.remove(); document.getElementById("userNameDisplay").innerText=name; document.getElementById("logoutBtn").style.display="inline-block"; refreshAll(); renderChatPage(); } else alert("Please select your name"); };
        document.getElementById("adminSwitchBtn").onclick=()=>{ const pw=prompt("Admin password:"); if(pw==="admin123"){ isAdminLoggedIn=true; currentUser={name:"Admin"}; document.getElementById("userNameDisplay").innerText="Admin"; document.getElementById("logoutBtn").style.display="inline-block"; modal.remove(); refreshAll(); renderAdminPage(); } else alert("Wrong password"); };
    }
    
    function logout(){ currentUser=null; isAdminLoggedIn=false; document.getElementById("userNameDisplay").innerText="Not logged in"; document.getElementById("logoutBtn").style.display="none"; showLoginModal(); refreshAll(); }
    
    async function fetchWeather(){
        try{
            const r=await fetch('https://api.open-meteo.com/v1/forecast?latitude=-37.77&longitude=144.97&hourly=temperature_2m,precipitation_probability,weathercode&timezone=Australia/Melbourne&forecast_days=7');
            const d=await r.json();
            const target=CURRENT_GAME_STR;
            for(let i=0;i<d.hourly.time.length;i++){
                const hd=d.hourly.time[i].split('T')[0];
                const hr=parseInt(d.hourly.time[i].split('T')[1].substring(0,2));
                if(hd===target && hr===20){
                    const t=Math.round(d.hourly.temperature_2m[i]);
                    const code=d.hourly.weathercode[i];
                    let cond="Clear", icon="fa-sun";
                    if(code===0){ cond="Clear"; icon="fa-sun"; }
                    else if(code===1||code===2){ cond="Partly cloudy"; icon="fa-cloud-sun"; }
                    else if(code===3){ cond="Overcast"; icon="fa-cloud"; }
                    else if(code>=51&&code<=67){ cond="Light rain"; icon="fa-cloud-rain"; }
                    else if(code>=80&&code<=99){ cond="Rain/storm"; icon="fa-cloud-bolt"; }
                    weatherData={ temp:`${t}°C`, condition:cond, icon, rainChance:d.hourly.precipitation_probability[i]||0 };
                    break;
                }
            }
        } catch(e){}
        renderWeatherPage();
    }
    
    function initApp(){
        const appDiv=document.getElementById("app");
        appDiv.innerHTML=`<div class="header"><div class="logo-icon"><i class="fas fa-futbol"></i></div><h1>MONDAY NIGHT SOCCER</h1><div class="user-row"><span id="userNameDisplay">Not logged in</span><button id="logoutBtn" style="display:none;">Logout</button></div></div><div class="top-nav"><button class="nav-module active" data-module="home">🏠 Home</button><button class="nav-module" data-module="teamswk">⚽ Teams</button><button class="nav-module" data-module="history">📖 History</button><button class="nav-module" data-module="scoreboard">🏆 Stats</button><button class="nav-module" data-module="profiles">👤 Profiles</button><button class="nav-module" data-module="timer">⏱️ Timer</button><button class="nav-module" data-module="chat">💬 Chat</button><button class="nav-module" data-module="finance">💰 Financials</button><button class="nav-module" data-module="weather">🌤️ Weather</button><button class="nav-module" data-module="rules">📜 Rules</button><button class="nav-module" data-module="admin">🔧 Admin</button></div><div id="homeContainer" class="module-container active-module"></div><div id="page-teamswk" class="module-container"></div><div id="page-history" class="module-container"></div><div id="page-scoreboard" class="module-container"></div><div id="page-profiles" class="module-container"></div><div id="page-timer" class="module-container"></div><div id="page-chat" class="module-container"></div><div id="page-finance" class="module-container"></div><div id="page-weather" class="module-container"></div><div id="page-rules" class="module-container"></div><div id="page-admin" class="module-container"></div>`;
        document.querySelectorAll(".nav-module").forEach(btn=>{ btn.addEventListener("click",()=>{ document.querySelectorAll(".nav-module").forEach(b=>b.classList.remove("active")); btn.classList.add("active"); const mod=btn.dataset.module; document.querySelectorAll(".module-container").forEach(c=>c.classList.remove("active-module")); if(mod==="home") document.getElementById("homeContainer").classList.add("active-module"); else document.getElementById(`page-${mod}`).classList.add("active-module"); if(mod==="chat") renderChatPage(); if(mod==="timer") renderTimerPage(); if(mod==="weather") renderWeatherPage(); if(mod==="rules") renderRulesPage(); if(mod==="finance") renderFinancePage(); }); });
        document.getElementById("logoutBtn").onclick=logout;
        if(firebaseReady) loadData().then(()=>{ showLoginModal(); fetchWeather(); }); else { showLoginModal(); fetchWeather(); refreshAll(); }
    }
    initApp();
</script>
