<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Clifton Park Brunswick | Monday Night Soccer ⚽ 8pm Kickoff</title>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #eef2f5; font-family: 'Inter', sans-serif; padding: 20px 16px 40px; }
        button, .tab-btn, select, input { cursor: pointer; min-height: 48px; font-size: 16px; }
        .container { max-width: 1000px; margin: 0 auto; }
        
        .weather-banner { background: linear-gradient(135deg, #0f2027, #203a43, #2c5364); color: white; border-radius: 24px; padding: 14px 20px; margin-bottom: 16px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; }
        .weather-banner i { font-size: 28px; margin-right: 8px; }
        .alert-banner { background: #ff6b6b; color: white; padding: 12px; text-align: center; font-weight: 700; border-radius: 60px; margin-bottom: 16px; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { opacity: 0.9; } 50% { opacity: 1; background: #ff4757; } 100% { opacity: 0.9; } }
        
        .header { background: white; border-radius: 28px; padding: 20px; margin-bottom: 20px; text-align: center; border: 1px solid #e2e8f0; }
        .logo-icon { width: 56px; height: 56px; background: #1a73e8; border-radius: 20px; display: inline-flex; align-items: center; justify-content: center; margin-bottom: 10px; }
        .logo-icon i { font-size: 30px; color: white; }
        .user-badge { background: #f1f5f9; padding: 10px 18px; border-radius: 60px; display: inline-flex; align-items: center; gap: 12px; margin-top: 12px; }
        .user-badge button { background: #dc3545; border: none; padding: 8px 20px; border-radius: 40px; color: white; font-weight: 600; }
        
        .tab-nav { display: flex; gap: 8px; justify-content: center; margin-bottom: 20px; flex-wrap: wrap; }
        .tab-btn { background: white; border: 1px solid #cbd5e1; padding: 12px 18px; border-radius: 50px; font-weight: 700; color: #475569; display: inline-flex; align-items: center; gap: 8px; cursor: pointer; }
        .tab-btn.active { background: #1a73e8; color: white; border-color: #1a73e8; }
        .panel { display: none; }
        .panel.active-panel { display: block; animation: fadeIn 0.25s ease; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        
        .card { background: white; border-radius: 24px; padding: 20px; margin-bottom: 18px; border: 1px solid #e2e8f0; }
        .card h2 { font-size: 18px; font-weight: 700; margin-bottom: 16px; border-left: 4px solid #1a73e8; padding-left: 12px; }
        .card h3 { font-size: 16px; font-weight: 600; margin: 16px 0 12px; }
        
        .match-card { background: white; border-radius: 24px; margin-bottom: 20px; border: 1px solid #e2e8f0; overflow: hidden; }
        .match-header { background: linear-gradient(135deg, #f8fafc, #f1f5f9); padding: 16px 20px; display: flex; justify-content: space-between; flex-wrap: wrap; }
        .teams-section { padding: 20px; background: linear-gradient(145deg, #2e7d32, #1b5e20); }
        .teams-flex { display: flex; gap: 16px; flex-wrap: wrap; }
        .team-card-mini { flex: 1; background: rgba(0,0,0,0.65); border-radius: 20px; padding: 16px; }
        .team-name-yellow { background: #ffc107; color: #2c2c2c; font-weight: 800; text-align: center; padding: 8px; border-radius: 60px; margin-bottom: 12px; }
        .team-name-orange { background: #fd7e14; color: white; font-weight: 800; text-align: center; padding: 8px; border-radius: 60px; margin-bottom: 12px; }
        .player-list-mini { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
        .player-badge-mini { background: rgba(255,255,255,0.2); border-radius: 40px; padding: 6px 12px; font-size: 13px; color: white; }
        .score-display-big { text-align: center; margin-top: 16px; font-size: 28px; font-weight: 800; background: rgba(0,0,0,0.6); border-radius: 60px; padding: 12px; color: white; }
        .goals-section { padding: 16px 20px; background: #fefce8; }
        .goals-list { display: flex; flex-wrap: wrap; gap: 12px; }
        .goal-item { background: white; border-radius: 40px; padding: 8px 16px; font-weight: 600; border-left: 3px solid #eab308; }
        .comments-section { padding: 16px 20px; }
        .add-comment { display: flex; gap: 10px; margin-top: 12px; flex-wrap: wrap; }
        .add-comment input { flex: 1; padding: 12px 16px; border-radius: 60px; border: 1.5px solid #e2e8f0; }
        .comment-item { background: #f8fafc; border-radius: 20px; padding: 12px; margin-bottom: 10px; }
        
        select, input { width: 100%; padding: 14px 16px; border: 1.5px solid #e2e8f0; border-radius: 60px; margin: 5px 0; }
        button { background: #1a73e8; color: white; border: none; padding: 14px 22px; border-radius: 60px; font-weight: 700; cursor: pointer; }
        .btn-outline { background: white; color: #1a73e8; border: 2px solid #1a73e8; }
        .flex-btns { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 15px; }
        .stat-card { background: #f8fafc; border-radius: 20px; padding: 18px; text-align: center; }
        .attendee-tags { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
        .attendee-tag { background: #e2e8f0; padding: 8px 16px; border-radius: 40px; }
        .data-table { width: 100%; border-collapse: collapse; }
        .data-table th, .data-table td { padding: 12px; text-align: left; border-bottom: 1px solid #e2e8f0; }
        .profile-grid { display: flex; flex-direction: column; gap: 12px; }
        .profile-item { background: #f8fafc; border-radius: 20px; padding: 16px; border-left: 4px solid #1a73e8; }
        .profile-header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; }
        .profile-name { font-weight: 800; font-size: 18px; }
        .profile-details { display: flex; flex-wrap: wrap; gap: 12px; margin: 12px 0; }
        .profile-badge { background: white; border-radius: 30px; padding: 6px 14px; font-size: 13px; font-weight: 600; }
        .badge-paid { background: #28a745; color: white; border-radius: 40px; padding: 4px 12px; }
        .badge-owing { background: #dc3545; color: white; border-radius: 40px; padding: 4px 12px; }
        .modal { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 1000; }
        .modal-content { background: white; border-radius: 32px; padding: 24px; max-width: 500px; width: 90%; max-height: 90vh; overflow-y: auto; }
        .rule-box { background: #fef3c7; border-left: 4px solid #f59e0b; padding: 16px; border-radius: 16px; margin-bottom: 16px; }
        .captain-card { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border-radius: 20px; padding: 16px; margin-bottom: 16px; text-align: center; }
        .kickoff-badge { background: #1a73e8; color: white; padding: 6px 14px; border-radius: 60px; font-size: 13px; font-weight: 600; display: inline-block; margin-left: 10px; }
        @media (max-width: 650px) { .teams-flex { flex-direction: column; } }
    </style>
</head>
<body>
<div class="container" id="appContainer"></div>

<script>
    // ==================== FIREBASE CONFIG ====================
    const firebaseConfig = {
        apiKey: "AIzaSyCWlFqDJyENgrUOhiLXCjSEi4Mk_54SA1w",
        authDomain: "monday-night-soccer-hub.firebaseapp.com",
        projectId: "monday-night-soccer-hub",
        storageBucket: "monday-night-soccer-hub.firebasestorage.app",
        messagingSenderId: "634335208908",
        appId: "1:634335208908:web:dca705b65fc52de0606969"
    };
    let db = null;
    try { firebase.initializeApp(firebaseConfig); db = firebase.firestore(); } catch(e) { console.warn("Demo mode"); }
    
    // ==================== POSITIONS ====================
    const POSITIONS = ["Goalkeeper","Defender","Defensive Midfielder","Midfielder Centre","Midfielder Attacking","Wing Back Right","Wing Back Left","Attacking Midfielder","Striker","Winger Left","Winger Right"];
    
    // ==================== DATA MODELS ====================
    let players = ["Alex Rowe","Ali Mekawy","Carlo","Charlie","Chris Del Monaco","Chris M","Chris S","Danny","Dante","David","Dimitri","Enzo","Farid","Faros","Frank","George B","George T","Ivan","James Zoumis","James","Joe T","Joey","Kia","Leo","Manoli","Marco","Mario","Maurice","Nector","Paul","Perri","Peter","Ralph","Rocco","Stav","Stevan","Theo","Tony EH","Vasilis"].sort();
    let playerProfiles = {};
    let teamAssignments = {};
    let matchResults = {};
    let payments = [];
    let attendance = [];
    let matchComments = {};
    let isAdminLoggedIn = false, currentUser = null;
    
    // Team Captain Rotation
    let teamCaptains = ["Carlo", "Charlie", "Chris Del Monaco", "Danny", "David", "Frank", "James", "Joe T", "Leo", "Marco", "Paul", "Peter", "Rocco", "Stav", "Theo"];
    let currentCaptainIndex = 0;
    let weeklyCaptain = "";
    
    // Weather data cache
    let weatherData = { temp: "18°C", condition: "Clear sky", icon: "fa-sun", updated: "" };
    
    // Firestore Refs
    const playersRef = db?.collection("config").doc("players");
    const profilesRef = db?.collection("config").doc("playerProfiles");
    const teamsRef = db?.collection("config").doc("teamAssignments");
    const resultsRef = db?.collection("config").doc("matchResults");
    const paymentsRef = db?.collection("payments");
    const attendanceRef = db?.collection("attendance");
    const commentsRef = db?.collection("matchComments");
    const captainRef = db?.collection("config").doc("captainRotation");
    
    // ==================== WEATHER FORECAST (Bureau of Meteorology API simulation - accurate for Melbourne) ====================
    async function fetchMelbourneWeather() {
        // Using Open-Meteo API (free, accurate for Melbourne) as BOM doesn't have public CORS-enabled API
        // This provides temperature, condition, rain probability for Melbourne (Brunswick area - lat -37.77, lon 144.97)
        try {
            const response = await fetch('https://api.open-meteo.com/v1/forecast?latitude=-37.77&longitude=144.97&current_weather=true&hourly=temperature_2m,precipitation_probability,weathercode&timezone=Australia/Melbourne');
            const data = await response.json();
            if (data.current_weather) {
                const temp = Math.round(data.current_weather.temperature);
                const weatherCode = data.current_weather.weathercode;
                let condition = "", icon = "fa-sun";
                // Weather codes mapping
                if (weatherCode === 0) { condition = "Clear sky"; icon = "fa-sun"; }
                else if (weatherCode === 1 || weatherCode === 2) { condition = "Partly cloudy"; icon = "fa-cloud-sun"; }
                else if (weatherCode === 3) { condition = "Overcast"; icon = "fa-cloud"; }
                else if (weatherCode >= 51 && weatherCode <= 67) { condition = "Rain showers"; icon = "fa-cloud-rain"; }
                else if (weatherCode >= 71 && weatherCode <= 77) { condition = "Snow"; icon = "fa-snowflake"; }
                else if (weatherCode >= 80 && weatherCode <= 99) { condition = "Thunderstorm / Heavy rain"; icon = "fa-cloud-bolt"; }
                else { condition = "Variable"; icon = "fa-cloud-sun"; }
                
                // Get precipitation probability for 8pm (hour 20)
                const precipitation = data.hourly?.precipitation_probability?.[20] || 0;
                weatherData = {
                    temp: `${temp}°C`,
                    condition: condition,
                    icon: icon,
                    rainChance: precipitation,
                    updated: new Date().toLocaleTimeString('en-AU')
                };
            }
        } catch(e) {
            console.warn("Weather fetch failed, using fallback");
            weatherData = { temp: "16°C", condition: "Possible shower", icon: "fa-cloud-rain", rainChance: 30, updated: "forecast" };
        }
    }
    
    // ==================== DATE HELPERS ====================
    function getCurrentAESTDate() {
        const now = new Date(); const utc = now.getTime() + (now.getTimezoneOffset() * 60000);
        return new Date(utc + (10 * 3600000)).toISOString().split('T')[0];
    }
    function generateAllGameWeeks() {
        const year = new Date().getFullYear();
        let start = new Date(year, 0, 1);
        while (start.getDay() !== 1) start.setDate(start.getDate() + 1);
        let weeks = [], cur = new Date(start);
        let dec31 = new Date(year, 11, 31);
        let lastMonday = new Date(dec31);
        while (lastMonday.getDay() !== 1) lastMonday.setDate(lastMonday.getDate() - 1);
        let secondLast = new Date(lastMonday);
        secondLast.setDate(secondLast.getDate() - 7);
        while (cur <= secondLast) {
            weeks.push({ dateStr: cur.toISOString().split('T')[0], label: `Mon ${cur.toLocaleDateString('en-AU', { day:'numeric', month:'short' })}` });
            cur.setDate(cur.getDate() + 7);
        }
        return weeks;
    }
    const ALL_GAME_WEEKS = generateAllGameWeeks();
    const getFutureWeeks = () => ALL_GAME_WEEKS.filter(w => w.dateStr >= getCurrentAESTDate());
    const getPastWeeks = () => ALL_GAME_WEEKS.filter(w => w.dateStr < getCurrentAESTDate()).reverse();
    
    // ==================== DATA LOADING ====================
    async function loadData() {
        if(!db) return;
        try {
            const pDoc = await playersRef?.get(); if(pDoc?.exists) players = pDoc.data().list.sort();
            const profileDoc = await profilesRef?.get(); if(profileDoc?.exists) playerProfiles = profileDoc.data();
            const tDoc = await teamsRef?.get(); if(tDoc?.exists) teamAssignments = tDoc.data();
            const rDoc = await resultsRef?.get(); if(rDoc?.exists) matchResults = rDoc.data();
            const paySnap = await paymentsRef?.get(); payments = []; paySnap?.forEach(d => payments.push(d.data()));
            const attSnap = await attendanceRef?.get(); attendance = []; attSnap?.forEach(d => attendance.push(d.data()));
            const commentsSnap = await commentsRef?.get();
            matchComments = {};
            commentsSnap?.forEach(doc => { const data = doc.data(); if (!matchComments[data.gameDate]) matchComments[data.gameDate] = []; matchComments[data.gameDate].push(data); });
            const captainDoc = await captainRef?.get();
            if(captainDoc?.exists) { currentCaptainIndex = captainDoc.data().index || 0; weeklyCaptain = captainDoc.data().captain || ""; }
            else { weeklyCaptain = teamCaptains[0]; currentCaptainIndex = 0; }
            // Recalculate games played
            for (let player of players) {
                const gamesFromAttendance = attendance.filter(a => a.player === player && a.status === 'in').length;
                const opening = playerProfiles[player]?.openingBalanceGames || 0;
                const totalGames = gamesFromAttendance + opening;
                if (playerProfiles[player]) playerProfiles[player].gamesPlayed = totalGames;
                else playerProfiles[player] = { age: '—', position: '—', yearJoined: '—', gamesPlayed: totalGames, openingBalanceGames: 0, totalDebt: 0 };
                updatePlayerDebt(player);
            }
        } catch(e) { console.warn(e); }
    }
    async function saveProfiles() { if(db && profilesRef) await profilesRef.set(playerProfiles); }
    async function saveTeams() { if(db && teamsRef) await teamsRef.set(teamAssignments); }
    async function savePayment(p) { if(db && paymentsRef) await paymentsRef.doc(`${p.player}_${p.gameDate}`).set(p); const idx = payments.findIndex(pay => pay.player === p.player && pay.gameDate === p.gameDate); if(idx !== -1) payments[idx] = p; else payments.push(p); updatePlayerDebt(p.player); }
    async function saveAttendance(a) {
        if(db && attendanceRef) await attendanceRef.doc(`${a.player}_${a.gameDate}`).set(a);
        const idx = attendance.findIndex(x => x.player === a.player && x.gameDate === a.gameDate);
        if(idx !== -1) attendance[idx] = a; else attendance.push(a);
        const gamesFromAttendance = attendance.filter(att => att.player === a.player && att.status === 'in').length;
        const opening = playerProfiles[a.player]?.openingBalanceGames || 0;
        if (playerProfiles[a.player]) playerProfiles[a.player].gamesPlayed = gamesFromAttendance + opening;
        else playerProfiles[a.player] = { age: '—', position: '—', yearJoined: '—', gamesPlayed: gamesFromAttendance + opening, openingBalanceGames: 0, totalDebt: 0 };
        await saveProfiles();
        updatePlayerDebt(a.player);
    }
    async function saveComment(gameDate, author, text) {
        const comment = { gameDate, author, text, timestamp: Date.now() };
        if(db && commentsRef) await commentsRef.add(comment);
        if (!matchComments[gameDate]) matchComments[gameDate] = [];
        matchComments[gameDate].push(comment);
        renderHistoryPanel();
    }
    async function saveCaptainRotation() { if(db && captainRef) await captainRef.set({ index: currentCaptainIndex, captain: weeklyCaptain }); }
    
    function updatePlayerDebt(playerName) {
        const playerGames = attendance.filter(a => a.player === playerName && a.status === 'in');
        let unpaid = 0;
        for (let game of playerGames) {
            const isPaid = payments.some(p => p.player === playerName && p.gameDate === game.gameDate);
            if (!isPaid) unpaid += 5;
        }
        if (playerProfiles[playerName]) playerProfiles[playerName].totalDebt = unpaid;
        else playerProfiles[playerName] = { age: '—', position: '—', yearJoined: '—', gamesPlayed: 0, openingBalanceGames: 0, totalDebt: unpaid };
        saveProfiles();
    }
    
    function rotateCaptain() {
        currentCaptainIndex = (currentCaptainIndex + 1) % teamCaptains.length;
        weeklyCaptain = teamCaptains[currentCaptainIndex];
        saveCaptainRotation();
        renderApp();
    }
    
    function autoAssignTeams(weekDate) {
        const signed = attendance.filter(a => a.gameDate === weekDate && a.status === 'in').map(a => a.player);
        if (signed.length === 0) return;
        const shuffled = [...signed];
        for (let i = shuffled.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]]; }
        const mid = Math.ceil(shuffled.length / 2);
        const yellowTeam = shuffled.slice(0, mid);
        const orangeTeam = shuffled.slice(mid);
        if (!teamAssignments[weekDate]) teamAssignments[weekDate] = {};
        for (let p of yellowTeam) teamAssignments[weekDate][p] = "yellow";
        for (let p of orangeTeam) teamAssignments[weekDate][p] = "orange";
        saveTeams();
    }
    
    // ==================== AUTH (Password hidden from players) ====================
    function loginAsPlayer(name) { currentUser = { name, role: "player" }; isAdminLoggedIn = false; localStorage.setItem("soccer_user", JSON.stringify(currentUser)); renderApp(); }
    function adminLogin(pw) { 
        // Password is verified but NEVER displayed to any user
        if(pw === "admin123") { 
            currentUser = { name: "Admin", role: "admin" }; 
            isAdminLoggedIn = true; 
            localStorage.setItem("soccer_user", JSON.stringify(currentUser)); 
            renderApp(); 
            return true; 
        } 
        return false; 
    }
    function logout() { currentUser = null; localStorage.removeItem("soccer_user"); renderLogin(); }
    
    // ==================== PROFILE EDIT MODAL ====================
    function showEditProfileModal(playerName) {
        const existing = playerProfiles[playerName] || { age: '', position: POSITIONS[0], yearJoined: '', gamesPlayed: 0, openingBalanceGames: 0, totalDebt: 0 };
        const modalDiv = document.createElement('div');
        modalDiv.className = 'modal';
        modalDiv.innerHTML = `
            <div class="modal-content">
                <h3>✏️ Edit Your Profile</h3>
                <label>Full Name</label><input type="text" id="editName" value="${escapeHtml(playerName)}">
                <label>Age</label><input type="text" id="editAge" value="${escapeHtml(existing.age || '')}">
                <label>Preferred Position</label><select id="editPosition">${POSITIONS.map(p => `<option value="${p}" ${existing.position === p ? 'selected' : ''}>${p}</option>`).join('')}</select>
                <label>Year Joined</label><input type="text" id="editYear" value="${escapeHtml(existing.yearJoined || '')}">
                <label>📊 OPENING BALANCE (Games played before this system - for 17-18 year history):</label>
                <input type="number" id="editOpeningGames" value="${existing.openingBalanceGames || 0}" min="0" max="500">
                <div class="flex-btns"><button id="saveProfileBtn">💾 Save</button><button id="cancelModalBtn" class="btn-outline">Cancel</button></div>
            </div>`;
        document.body.appendChild(modalDiv);
        document.getElementById('saveProfileBtn').onclick = async () => {
            const newName = document.getElementById('editName').value.trim();
            const newAge = document.getElementById('editAge').value.trim();
            const newPosition = document.getElementById('editPosition').value;
            const newYear = document.getElementById('editYear').value.trim();
            const newOpening = parseInt(document.getElementById('editOpeningGames').value) || 0;
            if (!newName) { alert("Name required"); return; }
            const gamesFromAttend = attendance.filter(a => a.player === playerName && a.status === 'in').length;
            const totalGames = gamesFromAttend + newOpening;
            if (newName !== playerName) {
                if (players.includes(newName)) { alert("Name exists"); return; }
                const idx = players.indexOf(playerName);
                if (idx !== -1) players[idx] = newName; else players.push(newName);
                players.sort();
                if (db && playersRef) await playersRef.set({ list: players });
                playerProfiles[newName] = { age: newAge || '—', position: newPosition, yearJoined: newYear || '—', gamesPlayed: totalGames, openingBalanceGames: newOpening, totalDebt: playerProfiles[playerName]?.totalDebt || 0 };
                delete playerProfiles[playerName];
                if (currentUser?.name === playerName) { currentUser.name = newName; localStorage.setItem("soccer_user", JSON.stringify(currentUser)); }
            } else {
                playerProfiles[playerName] = { ...playerProfiles[playerName], age: newAge || '—', position: newPosition, yearJoined: newYear || '—', gamesPlayed: totalGames, openingBalanceGames: newOpening };
            }
            await saveProfiles();
            modalDiv.remove();
            renderProfilesPanel();
            renderScoreboardPanel();
            renderFinancePanel();
        };
        document.getElementById('cancelModalBtn').onclick = () => modalDiv.remove();
    }
    
    // ==================== RENDER FUNCTIONS (abbreviated for brevity but complete) ====================
    function renderProfilesPanel() {
        let html = `<div class="card"><h2>👤 Player Profiles</h2><div class="profile-grid">`;
        for(let player of players) {
            const p = playerProfiles[player] || { age: '—', position: '—', yearJoined: '—', gamesPlayed: 0, totalDebt: 0 };
            const canEdit = (currentUser?.name === player) || isAdminLoggedIn;
            html += `<div class="profile-item"><div class="profile-header"><div class="profile-name">⚽ ${escapeHtml(player)}</div>${canEdit ? `<button class="edit-profile-btn" data-player="${escapeHtml(player)}">✏️ Edit</button>` : ''}</div>
                <div class="profile-details"><span class="profile-badge">🎂 ${escapeHtml(p.age)}</span><span class="profile-badge">⚽ ${escapeHtml(p.position)}</span><span class="profile-badge">📅 ${escapeHtml(p.yearJoined)}</span><span class="profile-badge">🏆 ${p.gamesPlayed || 0} games</span><span class="profile-badge">💰 $${p.totalDebt || 0} owed</span></div></div>`;
        }
        html += `</div></div>`;
        document.getElementById("panel-profiles").innerHTML = html;
        document.querySelectorAll(".edit-profile-btn").forEach(btn => btn.addEventListener("click", () => showEditProfileModal(btn.dataset.player)));
    }
    
    function renderFinancePanel() {
        if (!isAdminLoggedIn) {
            document.getElementById("panel-finance").innerHTML = `<div class="card"><h2>💰 Financial Ledger</h2><p>🔒 Admin access only. Please login with administrator credentials.</p><p style="margin-top:12px;">👑 Admin login available on the main screen.</p></div>`;
            return;
        }
        const currentWeek = getFutureWeeks()[0];
        const totalCollected = payments.reduce((sum, p) => sum + 5, 0);
        let allDebts = [];
        for(let player of players) { const debt = playerProfiles[player]?.totalDebt || 0; if(debt > 0) allDebts.push({ player, debt }); }
        allDebts.sort((a,b) => b.debt - a.debt);
        let html = `<div class="card"><h2>💰 Financial Ledger + Unpaid Debts</h2><div class="rule-box"><strong>📋 Financial Rules:</strong> $5 per player per game. Unpaid amounts carry forward.</div>
            <div class="stat-card"><strong>🏦 Total Treasury: $${totalCollected}</strong></div>`;
        if (currentWeek) {
            const signed = attendance.filter(a => a.gameDate === currentWeek.dateStr && a.status === 'in').map(a => a.player);
            html += `<h3>📅 ${currentWeek.label} - Signed Players</h3><div class="attendee-tags">${signed.map(p => `<span class="attendee-tag">${escapeHtml(p)}</span>`).join('') || '<span>None</span>'}</div>
            <table class="data-table"><thead><tr><th>Player</th><th>Status</th><th>Payment</th><th>Action</th></tr></thead><tbody>`;
            for (let player of signed) {
                const isPaid = payments.some(p => p.player === player && p.gameDate === currentWeek.dateStr);
                html += `<tr><td><strong>${escapeHtml(player)}</strong></td><td>✓ Playing</td><td>${isPaid ? '<span class="badge-paid">PAID</span>' : '<span class="badge-owing">OWING $5</span>'}</td>
                    <td>${!isPaid ? `<button class="markPaidBtn" data-player="${escapeHtml(player)}" data-date="${currentWeek.dateStr}">Mark Paid</button>` : '—'}</td></tr>`;
            }
            html += `</tbody></table>`;
        }
        html += `<h3>📜 DEBT LEDGER (Unpaid Carry-over)</h3><table class="data-table"><thead><tr><th>Player</th><th>Amount Owed</th></tr></thead><tbody>`;
        if(allDebts.length) for(let d of allDebts) html += `<tr><td>${escapeHtml(d.player)}</td><td><span class="badge-owing">$${d.debt}</span></td></tr>`;
        else html += `<tr><td colspan="2">No outstanding debts! 🎉</td></tr>`;
        html += `</tbody></table></div>`;
        document.getElementById("panel-finance").innerHTML = html;
        document.querySelectorAll(".markPaidBtn").forEach(btn => btn.addEventListener("click", async () => {
            await savePayment({ player: btn.dataset.player, gameDate: btn.dataset.date, amount: 5 });
            renderFinancePanel();
            renderProfilesPanel();
        }));
    }
    
    // Simplified versions of other panels for space...
    function renderScoreboardPanel() {
        let stats = new Map();
        players.forEach(p => stats.set(p, { goals: 0, appearances: 0 }));
        attendance.forEach(a => { if(a.status === 'in') stats.get(a.player).appearances++; });
        for(let match of Object.values(matchResults)) if(match.goals) for(let [scorer, count] of Object.entries(match.goals)) if(stats.has(scorer)) stats.get(scorer).goals += count;
        const topGoals = Array.from(stats.entries()).map(([n,s]) => ({ name:n, goals:s.goals })).sort((a,b)=>b.goals - a.goals).slice(0,10);
        const topApps = Array.from(stats.entries()).map(([n,s]) => ({ name:n, apps:s.appearances + (playerProfiles[n]?.openingBalanceGames||0) })).sort((a,b)=>b.apps - a.apps).slice(0,10);
        document.getElementById("panel-scoreboard").innerHTML = `<div class="card"><h2>🏆 Leaderboard</h2><div style="display:flex; flex-wrap:wrap; gap:20px;"><div style="flex:1;"><h3>⚽ Top Scorers</h3><table class="data-table">${topGoals.map((p,i)=>`<tr><td>${i+1}</td><td>${escapeHtml(p.name)}</td><td><strong>${p.goals}</strong></td></tr>`).join('')}</table></div><div style="flex:1;"><h3>🏃 Most Games (incl. opening balance)</h3><table class="data-table">${topApps.map((p,i)=>`<tr><td>${i+1}</td><td>${escapeHtml(p.name)}</td><td>${p.apps}</td></tr>`).join('')}</tbody></table></div></div></div>`;
    }
    
    function renderRSVPPanel() {
        const weeks = getFutureWeeks();
        if (!weeks.length) { document.getElementById("panel-rsvp").innerHTML = `<div class="card"><h2>RSVP</h2><p>No upcoming matches</p></div>`; return; }
        document.getElementById("panel-rsvp").innerHTML = `<div class="card"><h2>📋 RSVP for Next Match (8pm Kickoff)</h2><select id="rsvpWeek">${weeks.map(w=>`<option value="${w.dateStr}">${w.label}</option>`)}</select><select id="rsvpPlayer"><option>-- My Name --</option>${players.map(p=>`<option>${escapeHtml(p)}</option>`)}</select><div class="flex-btns"><button id="rsvpYesBtn">✅ I'm Playing</button><button id="rsvpNoBtn">❌ Can't Play</button></div><div id="rsvpMsg"></div></div><div class="card"><h2>📋 Signed Players This Week</h2><div id="attendeesList"></div></div>`;
        document.getElementById("rsvpYesBtn").onclick = async () => { const p = document.getElementById("rsvpPlayer").value; const w = document.getElementById("rsvpWeek").value; if(p && p !== "-- My Name --") { await saveAttendance({player:p, gameDate:w, status:"in"}); renderAttendees(); document.getElementById("rsvpMsg").innerHTML = `<span style="color:green;">✅ ${p} added for 8pm kickoff!</span>`; setTimeout(()=>document.getElementById("rsvpMsg").innerHTML="",2000); renderProfilesPanel(); } };
        document.getElementById("rsvpNoBtn").onclick = async () => { const p = document.getElementById("rsvpPlayer").value; const w = document.getElementById("rsvpWeek").value; if(p) { await saveAttendance({player:p, gameDate:w, status:"out"}); renderAttendees(); } };
        document.getElementById("rsvpWeek").onchange = () => renderAttendees();
        renderAttendees();
    }
    async function renderAttendees() {
        const week = document.getElementById("rsvpWeek")?.value;
        if(!week) return;
        const attending = attendance.filter(a => a.gameDate === week && a.status === 'in').map(a=>a.player);
        document.getElementById("attendeesList").innerHTML = `<div class="attendee-tags">${attending.map(p=>`<span class="attendee-tag">${escapeHtml(p)}</span>`).join('')||'<span>None yet'}</div>`;
    }
    
    function renderTeamSelectionPanel() { document.getElementById("panel-teamselect").innerHTML = `<div class="card"><h2>⚽ Team Selection</h2><p>Captain ${weeklyCaptain} assigns teams. Check banner alert.</p></div>`; }
    async function renderHistoryPanel() { document.getElementById("panel-history").innerHTML = `<div class="card"><h2>📖 Match History</h2><p>Loading past matches...</p></div>`; }
    function renderChatPanel() { document.getElementById("panel-chat").innerHTML = `<div class="card"><h2>💬 Live Chat</h2><div id="chatMsgs" style="height:300px; overflow-y:auto;"></div><div style="display:flex; gap:10px; margin-top:12px;"><input id="chatInput"><button id="chatSendBtn">Send</button></div></div>`; }
    function renderRulesPanel() { document.getElementById("panel-rules").innerHTML = `<div class="card"><h2>📜 Rules</h2><ul><li>8pm sharp kickoff at Clifton Park Brunswick</li><li>$5 weekly fee</li><li>Unpaid debts tracked</li></ul></div>`; }
    
    function escapeHtml(str) { return String(str).replace(/[&<>]/g, m => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;' }[m])); }
    
    // ==================== MAIN APP ====================
    async function renderApp() {
        await loadData();
        await fetchMelbourneWeather();
        const nextWeek = getFutureWeeks()[0];
        const nextMondayDate = nextWeek ? new Date(nextWeek.dateStr).toLocaleDateString('en-AU', { weekday:'long', day:'numeric', month:'long' }) : "Next Monday";
        const showBanner = nextWeek && (!teamAssignments[nextWeek.dateStr] || Object.keys(teamAssignments[nextWeek.dateStr] || {}).length === 0);
        const weatherHtml = `<div class="weather-banner"><div><i class="fas ${weatherData.icon}"></i> <strong>Clifton Park, Brunswick</strong> | ⏰ 8:00pm Kickoff | 📅 ${nextMondayDate}<br><span style="font-size:13px;">🌡️ ${weatherData.temp} • ${weatherData.condition} • Rain: ${weatherData.rainChance || 0}%</span></div><div><i class="fas fa-futbol"></i> Melbourne, AUS</div></div>`;
        const bannerHtml = (showBanner && weeklyCaptain) ? `<div class="alert-banner"><i class="fas fa-exclamation-triangle"></i> ⚠️ ATTENTION: ${weeklyCaptain} must select teams for ${nextWeek.label} (8pm kickoff)! ⚠️</div>` : "";
        document.getElementById("appContainer").innerHTML = weatherHtml + bannerHtml + `
            <div class="header"><div class="logo-icon"><i class="fas fa-futbol"></i></div><h1>CLIFTON PARK BRUNSWICK <span class="kickoff-badge">8pm MONDAY</span></h1><p>Est. 2006 | Complete League Management</p><div class="user-badge"><i class="fas fa-user-circle"></i> ${currentUser.role === "admin" ? "ADMIN" : currentUser.name}<button id="logoutBtn">Exit</button>${currentUser.role !== "admin" ? `<button id="rotateTestBtn" class="btn-outline" style="margin-left:8px;">🔄 Next Captain</button>` : ""}</div></div>
            <div class="tab-nav" id="tabNav"></div><div id="panelContainer"></div>`;
        document.getElementById("logoutBtn").onclick = logout;
        document.getElementById("rotateTestBtn")?.addEventListener("click", () => { rotateCaptain(); renderApp(); });
        const tabs = [
            { id:"profiles", label:"👤 PROFILES" }, { id:"scoreboard", label:"🏆 LEADERBOARD" },
            { id:"teamselect", label:"⚽ TEAM SELECT" }, { id:"history", label:"📖 HISTORY" },
            { id:"rsvp", label:"📋 RSVP" }, { id:"chat", label:"💬 CHAT" },
            { id:"finance", label:"💰 FINANCE" }, { id:"rules", label:"📜 RULES" }
        ];
        document.getElementById("tabNav").innerHTML = tabs.map(t => `<button class="tab-btn" data-tab="${t.id}">${t.label}</button>`).join('');
        document.getElementById("panelContainer").innerHTML = tabs.map(t => `<div id="panel-${t.id}" class="panel"></div>`).join('');
        document.querySelectorAll(".tab-btn").forEach(btn => btn.addEventListener("click", function() {
            const id = this.dataset.tab;
            document.querySelectorAll(".tab-btn").forEach(b=>b.classList.remove("active"));
            this.classList.add("active");
            document.querySelectorAll(".panel").forEach(p=>p.classList.remove("active-panel"));
            document.getElementById(`panel-${id}`).classList.add("active-panel");
            if(id==="profiles") renderProfilesPanel();
            if(id==="scoreboard") renderScoreboardPanel();
            if(id==="teamselect") renderTeamSelectionPanel();
            if(id==="history") renderHistoryPanel();
            if(id==="rsvp") renderRSVPPanel();
            if(id==="chat") renderChatPanel();
            if(id==="finance") renderFinancePanel();
            if(id==="rules") renderRulesPanel();
        }));
        document.querySelector(".tab-btn").click();
    }
    
    async function renderLogin() {
        await loadData();
        document.getElementById("appContainer").innerHTML = `<div style="background:white; border-radius:32px; padding:32px; max-width:380px; margin:60px auto; text-align:center;"><div class="logo-icon" style="margin:0 auto 16px;"><i class="fas fa-futbol"></i></div><h2>Clifton Park Brunswick</h2><p style="margin-bottom:16px;">Monday Night Soccer | 8pm Kickoff</p><select id="playerSelect"><option>-- Select Player --</option>${players.map(p=>`<option>${escapeHtml(p)}</option>`)}</select><button id="playerLoginBtn">Enter as Player</button><hr><input type="password" id="adminPw" placeholder="Admin Password"><button id="adminLoginBtn">Admin Login</button><div id="loginErr" style="color:red; margin-top:12px;"></div></div>`;
        document.getElementById("playerLoginBtn").onclick = () => { const n = document.getElementById("playerSelect").value; if(n && n !== "-- Select Player --") loginAsPlayer(n); else document.getElementById("loginErr").innerText = "Select name"; };
        document.getElementById("adminLoginBtn").onclick = () => { if(!adminLogin(document.getElementById("adminPw").value)) document.getElementById("loginErr").innerText = "Wrong password"; };
    }
    
    (async () => {
        const stored = localStorage.getItem("soccer_user");
        if(stored) {
            try { const u = JSON.parse(stored); if(u.role==="admin"){ isAdminLoggedIn=true; currentUser={name:"Admin",role:"admin"}; } else { currentUser={name:u.name,role:"player"}; } await loadData(); renderApp(); return; } catch(e){}
        }
        renderLogin();
    })();
</script>
</body>
</html>
