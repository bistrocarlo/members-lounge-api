<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daniel & Laura's Wedding | Seating + Email Manager</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Georgia', serif; background: #faf8f3; padding: 20px; }
        .container { max-width: 1600px; margin: 0 auto; }
        
        .header {
            background: linear-gradient(135deg, #c9a84c, #e8d5a8);
            border-radius: 24px;
            padding: 25px 30px;
            margin-bottom: 25px;
            text-align: center;
        }
        
        .stats-bar {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }
        
        .stat {
            background: white;
            border-radius: 16px;
            padding: 15px 25px;
            flex: 1;
            text-align: center;
            border: 1px solid #e8dcc8;
        }
        
        .stat-number {
            font-size: 2rem;
            font-weight: bold;
            color: #c9a84c;
        }
        
        .toolbar {
            background: white;
            border-radius: 20px;
            padding: 15px 20px;
            margin-bottom: 25px;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }
        
        .btn {
            background: #c9a84c;
            border: none;
            padding: 10px 20px;
            border-radius: 30px;
            cursor: pointer;
            font-family: inherit;
            font-weight: 600;
            transition: all 0.2s;
        }
        
        .btn:hover { background: #b8953a; transform: translateY(-1px); }
        .btn-primary { background: #27ae60; color: white; }
        .btn-email { background: #3498db; color: white; }
        .btn-preview { background: #e67e22; color: white; }
        
        .main-layout {
            display: flex;
            gap: 25px;
            flex-wrap: wrap;
        }
        
        .tables-area {
            flex: 2;
            min-width: 300px;
        }
        
        .guests-area {
            flex: 1;
            min-width: 300px;
            background: white;
            border-radius: 20px;
            border: 1px solid #e8dcc8;
            padding: 20px;
            height: fit-content;
            position: sticky;
            top: 20px;
        }
        
        .tables-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 18px;
        }
        
        .table-card {
            background: white;
            border-radius: 20px;
            border: 1px solid #e8dcc8;
            overflow: hidden;
        }
        
        .table-card.bridal { border: 2px solid #c9a84c; background: #fffcf5; }
        
        .table-header {
            background: #faf5ea;
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            border-bottom: 1px solid #e8dcc8;
            font-weight: bold;
        }
        
        .table-guests {
            padding: 12px;
            min-height: 100px;
            max-height: 200px;
            overflow-y: auto;
        }
        
        .guest-chip {
            display: inline-block;
            background: #fef7e9;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.7rem;
            margin: 3px;
            cursor: pointer;
            border: 1px solid #e8dcc8;
        }
        
        .guest-chip.emailed { background: #d5f5e3; border-color: #27ae60; }
        
        .guest-list-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #efe4d4;
        }
        
        .email-status {
            font-size: 0.65rem;
            padding: 2px 8px;
            border-radius: 20px;
        }
        
        .email-status.sent { background: #d5f5e3; color: #1e8449; }
        .email-status.pending { background: #fef9e7; color: #b7950b; }
        
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        
        .modal.active { display: flex; }
        
        .modal-content {
            background: white;
            border-radius: 24px;
            padding: 30px;
            max-width: 600px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
        }
        
        .modal-content textarea {
            width: 100%;
            padding: 12px;
            margin: 15px 0;
            border-radius: 12px;
            border: 1px solid #e8dcc8;
            font-family: monospace;
            font-size: 0.9rem;
        }
        
        .email-preview {
            background: #f0f0f0;
            padding: 15px;
            border-radius: 12px;
            margin: 15px 0;
            white-space: pre-wrap;
            font-family: monospace;
            font-size: 0.8rem;
        }
        
        .search-input {
            padding: 10px 16px;
            border-radius: 40px;
            border: 1px solid #e8dcc8;
            width: 250px;
        }
        
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #2c2418;
            color: white;
            padding: 10px 24px;
            border-radius: 40px;
            z-index: 1001;
            animation: fadeOut 3s forwards;
        }
        
        @keyframes fadeOut {
            0% { opacity: 1; }
            70% { opacity: 1; }
            100% { opacity: 0; visibility: hidden; }
        }
        
        @media (max-width: 700px) {
            .main-layout { flex-direction: column; }
            .guests-area { position: static; }
        }
    </style>
</head>
<body>
<div id="app">Loading wedding planner...</div>

<script>
    // ==================== DATA ====================
    let allGuests = [];
    let tableMap = new Map();
    let guestTableMap = new Map();
    let emailedGuests = new Set();
    
    const TOTAL_TABLES = 32;
    const BRIDAL_TABLE = "bridal";
    const MAX_PER_TABLE = 11;
    const MIN_PER_TABLE = 6;
    
    // Email template
    const DEFAULT_EMAIL_TEMPLATE = `Dear {{guestName}},

We are so excited to celebrate our wedding day with you!

📋 Your table number is: **Table {{tableNumber}}**

📍 Venue: [Your Venue Name]
🕕 Time: [Time]
📅 Date: [Date]

We can't wait to see you there!

With love,
Daniel & Laura 💒
`;
    
    // ==================== CONSOLIDATED GUEST LIST (from your Excel + CSV) ====================
    function getConsolidatedGuests() {
        return [
            // === FROM EXCEL FILE ===
            { name: "Rosssi Mel family", group: "Family", verified: "Mario, Enza", address: "", phone: "" },
            { name: "Father Aurelio Fragapane", group: "Family", verified: "Father Aurelio", address: "", phone: "" },
            { name: "Mr V & Mrs C Di Pasquale & family", group: "Family", verified: "Vito, Carmel, John, Domenic", address: "1 Rhode Island Court, Taylors Lakes", phone: "" },
            { name: "Mr C & Mrs D Di Pasquale & family", group: "Family", verified: "Carlo, Doreen, Teresa", address: "14 Wanaka Drive, Taylors Lakes", phone: "", notes: "Teresa at bridal table" },
            { name: "Mr M & Mrs M Mirarchi & family", group: "Family", verified: "Mick, Mim, Nicholas, Josephine, Anthony", address: "1 Collendina Close, Keilor East 3033", phone: "" },
            { name: "Mr T & Mrs R Pisano & family", group: "Family", verified: "Tony, Rosa, Isabella", address: "14 Overland Place, Keilor East 3033", phone: "" },
            { name: "Mr L & Mrs A Palumbo & family", group: "Family", verified: "Leo, Antonia, Joseph, Alessia", address: "73 Steele Creek Drive, East Keilor", phone: "" },
            { name: "Mr M & Mrs S Guzzardi & family", group: "Family", verified: "Mick, Sonia, Julius, Danni", address: "2 Eastgate Street, Pascoe Vale South", phone: "" },
            { name: "Mr S & Mrs M Ibrahim", group: "Family", verified: "Sam, Michelle", address: "13 Brewster Street, Essendon", phone: "" },
            { name: "Mr S & Mrs M Lombardo & family", group: "Family", verified: "Silvio, Marisa, Celeste, Emily, Jack", address: "49 Oakley Drive, Avondale Heights 3034", phone: "" },
            { name: "Stefan Guzzardi", group: "Wedding Party", verified: "Stefan", address: "2 Eastgate Street, Pascoe Vale South", phone: "", notes: "Groomsman - Bridal table" },
            { name: "Julian Lombardo", group: "Wedding Party", verified: "Julian", address: "49 Oakley Street, Avondale Heights", phone: "", notes: "Groomsman - Bridal table" },
            { name: "Matthew Ibrahim", group: "Wedding Party", verified: "Matthew", address: "", phone: "", notes: "Groomsman - Bridal table" },
            { name: "Brad Hamilton", group: "Wedding Party", verified: "Brad", address: "36 William Street, Essendon", phone: "", notes: "Groomsman - Bridal table" },
            
            // === FROM CSV FILE ===
            { name: "Domenic & Kimberley Chila", group: "Family", verified: "Dominic Chila; Kimberley Chila", address: "16 Basalt Avenue, Keilor East, VIC 3033", phone: "" },
            { name: "Raajpal Chahl", group: "Friend", verified: "Raajpal Singh Chahl", address: "23 Spinifex St, Point Cook, VIC 3030", phone: "" },
            { name: "Domenico & Maria Iervasi", group: "Family", verified: "Domenico Iervasi; Maria Iervasi", address: "4 Sophia street, Sunshine west, VIC 3020", phone: "" },
            { name: "Joe & Anita Trimboli", group: "Family", verified: "Joe Trimboli; Anita Trimboli", address: "84 Reynolds parade, Pascoe Vale South, VIC 3044", phone: "" },
            { name: "Remzi Asllanaj & family", group: "Family", verified: "Remzi; Donna; Mark; Robert", address: "5 Gordon Street, Brunswick West, VIC 3055", phone: "" },
            { name: "Frank & Mary Marcaccio", group: "Family", verified: "Frank Marcaccio; Mary Marcaccio", address: "34 Buckley, Essendon, VIC 3030", phone: "" },
            { name: "Theresa Pavia", group: "Friend", verified: "Theresa Pavia", address: "34 Laurence Avenue, Airport West, VIC 3042", phone: "" },
            { name: "Deanna Spataro", group: "Friend", verified: "Deanna Spataro", address: "41 Hassett Crescent, Keilor East, VIC 3033", phone: "" },
            { name: "Rocco Careri", group: "Friend", verified: "Rocco Careri", address: "18 Lind Street, Strathmore, VIC 3041", phone: "" },
            { name: "Gina Patti", group: "Friend", verified: "Gina Patti", address: "7 Wellesley Drive, Taylor's Lakes, VIC 3038", phone: "" },
        ];
    }
    
    // ==================== INITIALIZATION ====================
    function initTables() {
        tableMap.clear();
        for (let i = 1; i <= TOTAL_TABLES; i++) {
            tableMap.set(i.toString(), { name: `Table ${i}`, guests: [] });
        }
        tableMap.set(BRIDAL_TABLE, { name: "👰 Bridal Table", guests: [] });
    }
    
    function loadData() {
        // Load consolidated guests
        const consolidated = getConsolidatedGuests();
        allGuests = consolidated.map((g, idx) => ({
            id: `guest_${idx}`,
            name: g.name,
            group: g.group,
            verified: g.verified,
            address: g.address,
            phone: g.phone,
            notes: g.notes || ""
        }));
        
        // Load saved seating from localStorage
        const saved = localStorage.getItem('wedding_seating');
        if (saved) {
            const data = JSON.parse(saved);
            if (data.tableMap) {
                for (const [tid, tdata] of Object.entries(data.tableMap)) {
                    if (tableMap.has(tid)) {
                        tableMap.get(tid).guests = tdata.guests;
                    }
                }
            }
            if (data.emailedGuests) emailedGuests = new Set(data.emailedGuests);
        }
        
        // Build guestTableMap
        guestTableMap.clear();
        for (const [tid, table] of tableMap.entries()) {
            for (const guest of table.guests) {
                if (guest && guest.id) guestTableMap.set(guest.id, tid);
            }
        }
    }
    
    function saveToLocalStorage() {
        const exportMap = {};
        for (const [tid, table] of tableMap.entries()) {
            exportMap[tid] = { name: table.name, guests: table.guests };
        }
        localStorage.setItem('wedding_seating', JSON.stringify({
            tableMap: exportMap,
            emailedGuests: Array.from(emailedGuests)
        }));
    }
    
    // ==================== GUEST MANAGEMENT ====================
    function assignGuestToTable(guest, tableId) {
        const table = tableMap.get(tableId);
        if (!table) return false;
        
        if (tableId !== BRIDAL_TABLE && table.guests.length >= MAX_PER_TABLE) {
            showToast(`Table is full (max ${MAX_PER_TABLE})`);
            return false;
        }
        
        const oldTableId = guestTableMap.get(guest.id);
        if (oldTableId) {
            const oldTable = tableMap.get(oldTableId);
            if (oldTable) oldTable.guests = oldTable.guests.filter(g => g.id !== guest.id);
        }
        
        table.guests.push({ ...guest });
        guestTableMap.set(guest.id, tableId);
        saveToLocalStorage();
        renderApp();
        return true;
    }
    
    function removeGuestFromTable(guestId, tableId) {
        const table = tableMap.get(tableId);
        if (table) {
            table.guests = table.guests.filter(g => g.id !== guestId);
            guestTableMap.delete(guestId);
            saveToLocalStorage();
            renderApp();
        }
    }
    
    function getUnassignedGuests() {
        return allGuests.filter(g => !guestTableMap.has(g.id));
    }
    
    // ==================== EMAIL FUNCTIONS ====================
    function getGuestEmail(guest) {
        // In real use, you'd collect emails. For demo, prompt or use placeholder
        // You can add emails to the guest object above
        return prompt(`Enter email for ${guest.name}:`, `${guest.name.replace(/\s/g, '.').toLowerCase()}@example.com`);
    }
    
    function getTableNumber(guestId) {
        const tid = guestTableMap.get(guestId);
        if (!tid) return "Not assigned yet";
        if (tid === BRIDAL_TABLE) return "Bridal Table";
        return tid;
    }
    
    function sendEmailToGuest(guest, tableNum, customTemplate = null) {
        const template = customTemplate || DEFAULT_EMAIL_TEMPLATE;
        const email = getGuestEmail(guest);
        if (!email) return false;
        
        const subject = encodeURIComponent("Daniel & Laura's Wedding - Your Table Number");
        const body = encodeURIComponent(
            template
                .replace(/{{guestName}}/g, guest.name.split(' & ')[0])
                .replace(/{{tableNumber}}/g, tableNum)
                .replace(/{{verifiedNames}}/g, guest.verified || guest.name)
        );
        
        window.open(`mailto:${email}?subject=${subject}&body=${body}`);
        
        emailedGuests.add(guest.id);
        saveToLocalStorage();
        showToast(`📧 Email opened for ${guest.name}`);
        return true;
    }
    
    function sendBulkEmails() {
        const assigned = allGuests.filter(g => guestTableMap.has(g.id));
        if (assigned.length === 0) {
            showToast("No assigned guests to email yet!");
            return;
        }
        
        let count = 0;
        for (const guest of assigned) {
            const tableNum = getTableNumber(guest.id);
            if (tableNum !== "Not assigned yet") {
                sendEmailToGuest(guest, tableNum);
                count++;
                if (count >= 5) {
                    showToast(`Opening emails for first ${count} guests...`);
                    break;
                }
            }
        }
        showToast(`📧 Opening email for ${count} guest(s)`);
    }
    
    function sendReminderEmails() {
        const notEmailed = allGuests.filter(g => guestTableMap.has(g.id) && !emailedGuests.has(g.id));
        if (notEmailed.length === 0) {
            showToast("All assigned guests have been emailed!");
            return;
        }
        
        for (const guest of notEmailed.slice(0, 5)) {
            const tableNum = getTableNumber(guest.id);
            sendEmailToGuest(guest, tableNum);
        }
        showToast(`📧 Sending reminders to ${Math.min(5, notEmailed.length)} guest(s)`);
    }
    
    // ==================== EXPORTS ====================
    function exportToCSV() {
        const rows = [['Table Name', 'Guest Name', 'Group', 'Verified Names', 'Emailed']];
        
        for (const [tid, table] of tableMap.entries()) {
            const tableName = table.name;
            for (const guest of table.guests) {
                rows.push([
                    `"${tableName}"`,
                    `"${guest.name}"`,
                    `"${guest.group}"`,
                    `"${guest.verified || guest.name}"`,
                    emailedGuests.has(guest.id) ? 'Yes' : 'No'
                ]);
            }
        }
        
        const unassigned = getUnassignedGuests();
        for (const guest of unassigned) {
            rows.push(['"UNASSIGNED"', `"${guest.name}"`, `"${guest.group}"`, `"${guest.verified || guest.name}"`, 'No']);
        }
        
        const csv = rows.map(row => row.join(',')).join('\n');
        const blob = new Blob(["\uFEFF" + csv], { type: 'text/csv' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = `wedding_seating_${new Date().toISOString().slice(0,10)}.csv`;
        link.click();
        URL.revokeObjectURL(link.href);
        showToast("CSV exported!");
    }
    
    function showToast(msg) {
        let toast = document.querySelector('.toast');
        if (toast) toast.remove();
        toast = document.createElement('div');
        toast.className = 'toast';
        toast.textContent = msg;
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 3000);
    }
    
    // ==================== RENDER APP ====================
    function renderApp() {
        const app = document.getElementById('app');
        const unassigned = getUnassignedGuests();
        let totalSeated = 0;
        for (const table of tableMap.values()) totalSeated += table.guests.length;
        
        const allTableOptions = Array.from({ length: TOTAL_TABLES }, (_, i) => i + 1);
        
        app.innerHTML = `
            <div class="container">
                <div class="header">
                    <h1>✨ Daniel & Laura's Wedding Manager ✨</h1>
                    <p>Table Assignment + Email Guest Notifications</p>
                </div>
                
                <div class="stats-bar">
                    <div class="stat"><div class="stat-number">${allGuests.length}</div><div>Total Guests</div></div>
                    <div class="stat"><div class="stat-number">${totalSeated}</div><div>Seated</div></div>
                    <div class="stat"><div class="stat-number">${unassigned.length}</div><div>Unassigned</div></div>
                    <div class="stat"><div class="stat-number">${emailedGuests.size}</div><div>Emailed</div></div>
                </div>
                
                <div class="toolbar">
                    <button class="btn" id="saveBtn">💾 Save</button>
                    <button class="btn btn-primary" id="bulkEmailBtn">📧 Email All Seated Guests</button>
                    <button class="btn btn-email" id="reminderBtn">📨 Send Reminders (Unemailed)</button>
                    <button class="btn" id="csvBtn">📊 Export CSV</button>
                </div>
                
                <div class="main-layout">
                    <div class="tables-area">
                        <div class="tables-grid" id="tablesGrid"></div>
                    </div>
                    <div class="guests-area">
                        <h3>📋 Unassigned Guests (${unassigned.length})</h3>
                        <div id="unassignedList"></div>
                    </div>
                </div>
            </div>
        `;
        
        // Render tables
        const grid = document.getElementById('tablesGrid');
        if (grid) {
            grid.innerHTML = '';
            const sorted = Array.from(tableMap.keys()).sort((a,b) => {
                if (a === BRIDAL_TABLE) return 1;
                if (b === BRIDAL_TABLE) return -1;
                return parseInt(a) - parseInt(b);
            });
            
            for (const tid of sorted) {
                const table = tableMap.get(tid);
                const isBridal = tid === BRIDAL_TABLE;
                const card = document.createElement('div');
                card.className = `table-card ${isBridal ? 'bridal' : ''}`;
                card.innerHTML = `
                    <div class="table-header">
                        <span>${table.name}</span>
                        <span>${table.guests.length} guests</span>
                    </div>
                    <div class="table-guests">
                        ${table.guests.length === 0 ? '<div style="color:#bfae8e; text-align:center;">— empty —</div>' : 
                            table.guests.map(g => `<span class="guest-chip ${emailedGuests.has(g.id) ? 'emailed' : ''}" data-id="${g.id}" data-table="${tid}">${g.name} ${emailedGuests.has(g.id) ? '📧' : ''} ✖</span>`).join('')
                        }
                    </div>
                `;
                grid.appendChild(card);
                
                card.querySelectorAll('.guest-chip').forEach(chip => {
                    chip.onclick = () => {
                        const id = chip.dataset.id;
                        const tid = chip.dataset.table;
                        if (confirm('Remove this guest?')) removeGuestFromTable(id, tid);
                    };
                });
            }
        }
        
        // Render unassigned
        const unassignedDiv = document.getElementById('unassignedList');
        if (unassignedDiv) {
            if (unassigned.length === 0) {
                unassignedDiv.innerHTML = '<div style="text-align:center; padding:30px; color:#bfae8e;">✨ All guests assigned! ✨</div>';
            } else {
                unassignedDiv.innerHTML = unassigned.map(g => `
                    <div class="guest-list-item">
                        <div>
                            <strong>${g.name}</strong><br>
                            <small>${g.group} | ${g.verified || ''}</small>
                        </div>
                        <div>
                            <select id="table_${g.id.replace(/[^a-zA-Z0-9]/g, '_')}" style="width:80px;">
                                <option value="">Table</option>
                                ${allTableOptions.map(t => `<option value="${t}">${t}</option>`).join('')}
                                <option value="${BRIDAL_TABLE}">👰</option>
                            </select>
                            <button class="btn" style="padding:4px 10px;" data-assign="${g.id}">Assign</button>
                        </div>
                    </div>
                `).join('');
                
                for (const g of unassigned) {
                    const btn = unassignedDiv.querySelector(`[data-assign="${g.id}"]`);
                    const sel = unassignedDiv.querySelector(`#table_${g.id.replace(/[^a-zA-Z0-9]/g, '_')}`);
                    if (btn && sel) btn.onclick = () => { if (sel.value) assignGuestToTable(g, sel.value); else showToast('Select a table'); };
                }
            }
        }
        
        // Event listeners
        document.getElementById('saveBtn').onclick = () => { saveToLocalStorage(); showToast("Saved!"); };
        document.getElementById('bulkEmailBtn').onclick = sendBulkEmails;
        document.getElementById('reminderBtn').onclick = sendReminderEmails;
        document.getElementById('csvBtn').onclick = exportToCSV;
    }
    
    // Initialize
    initTables();
    loadData();
    renderApp();
</script>
</body>
</html>
