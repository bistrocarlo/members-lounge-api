<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Member's Lounge – Staff Availability Portal</title>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; padding: 20px; }
        .container { max-width: 1400px; margin: 0 auto; }
        .header { background: #D4AF37; color: #1e1e1e; padding: 20px; border-radius: 12px; margin-bottom: 20px; text-align: center; }
        .logo-icon { background: white; width: 50px; height: 50px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-weight: bold; font-size: 24px; margin-right: 10px; }
        .card { background: white; border-radius: 12px; padding: 24px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .login-box { max-width: 450px; margin: 0 auto; text-align: center; }
        input, select { width: 100%; padding: 14px; margin: 10px 0; border: 1px solid #ddd; border-radius: 8px; font-size: 16px; }
        button { background: #D4AF37; color: #1e1e1e; border: none; padding: 12px 24px; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 16px; margin-top: 10px; width: auto; }
        button:hover { background: #b58f2a; color: white; }
        .error-msg { color: #c62828; background: #ffebee; padding: 12px; border-radius: 8px; margin: 10px 0; }
        .success-msg { color: #2e7d32; background: #e8f5e9; padding: 12px; border-radius: 8px; margin: 10px 0; }
        .hidden { display: none; }
        .logout-bar { display: flex; justify-content: space-between; align-items: center; padding: 15px; background: white; border-radius: 12px; margin-bottom: 20px; }
        .date-list { max-height: 500px; overflow-y: auto; border: 1px solid #eee; border-radius: 8px; }
        .date-item { padding: 15px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
        .date-item:hover { background: #fafafa; }
        .event-info { flex: 2; }
        .slots-info { font-size: 12px; color: #D4AF37; background: #faf0e0; padding: 4px 12px; border-radius: 20px; display: inline-block; }
        .staff-info { background: #fafafa; padding: 20px; border-radius: 12px; margin-bottom: 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #eee; }
        th { background: #f5f5f5; color: #D4AF37; position: sticky; top: 0; }
        .available-yes { background: #D4AF37; color: white; padding: 4px 12px; border-radius: 20px; font-size: 12px; display: inline-block; }
        .available-no { background: #e0e0e0; color: #999; padding: 4px 12px; border-radius: 20px; font-size: 12px; display: inline-block; }
        .scrollable-table { overflow-x: auto; max-height: 400px; overflow-y: auto; }
        .section-filter { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 20px; }
        .filter-btn { background: #e0e0e0; padding: 8px 20px; border-radius: 30px; cursor: pointer; border: none; font-size: 14px; }
        .filter-btn.active { background: #D4AF37; color: white; }
        .code-badge { font-family: monospace; background: #D4AF37; color: white; padding: 10px 20px; border-radius: 8px; display: inline-block; font-size: 18px; letter-spacing: 2px; }
        @media (max-width: 768px) {
            .date-item { flex-direction: column; align-items: flex-start; }
            .logout-bar { flex-direction: column; gap: 10px; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <div class="logo-icon">ML</div>
        <h1>Member's Lounge</h1>
        <p>Staff Availability Portal – Enter Your Employee Code</p>
    </div>

    <!-- LOGIN SCREEN (CODE ONLY - NO PASSWORD) -->
    <div id="loginScreen">
        <div class="card login-box">
            <h2>🔐 Staff Access</h2>
            <p>Enter your employee code to log in</p>
            <input type="text" id="employeeCode" placeholder="Employee Code (e.g., CARLO6, MICHE0)" style="text-align: center; font-size: 20px; letter-spacing: 2px;">
            <button onclick="loginWithCode()">Login</button>
            <div id="loginError" class="error-msg hidden"></div>
            <div style="margin-top: 20px; font-size: 12px; color: #666;">
                <p>Need your code? Ask your manager.</p>
            </div>
        </div>
    </div>

    <!-- MAIN APP -->
    <div id="mainApp" style="display: none;">
        <div class="logout-bar">
            <span>✅ Logged in as: <strong id="userName"></strong> (<span id="userSection"></span>)</span>
            <span class="code-badge" id="userCode"></span>
            <button onclick="logout()">Logout</button>
        </div>

        <div class="card">
            <h2>📅 My Availability</h2>
            <div id="staffInfo" class="staff-info">
                <p><strong>Name:</strong> <span id="displayName"></span></p>
                <p><strong>Section:</strong> <span id="displaySection"></span></p>
                <p><strong>Employee Code:</strong> <span id="displayCode"></span></p>
            </div>
            <div id="staffMessage" class="error-msg hidden"></div>
            <div id="datesContainer" class="date-list"></div>
            <button id="saveBtn" style="margin-top: 20px;">💾 Save My Availability</button>
        </div>

        <div class="card">
            <h2>👥 Team Availability Overview</h2>
            <div class="section-filter" id="sectionFilters">
                <button class="filter-btn active" data-section="all">All</button>
                <button class="filter-btn" data-section="kitchen">Kitchen</button>
                <button class="filter-btn" data-section="floor">Floor</button>
                <button class="filter-btn" data-section="bar">Bar</button>
                <button class="filter-btn" data-section="cleaner">Cleaner</button>
                <button class="filter-btn" data-section="setup">Setup</button>
                <button class="filter-btn" data-section="manager">Manager</button>
            </div>
            <div id="availabilityMatrix">Loading...</div>
        </div>
    </div>
</div>

<script>
    // ==================== FIREBASE CONFIG ====================
    const firebaseConfig = {
        apiKey: "AIzaSyA0rDZ8NMo0cirWEPlIzt_Uq12qnOSBtPk",
        authDomain: "staff-roster-e0940.firebaseapp.com",
        projectId: "staff-roster-e0940",
        storageBucket: "staff-roster-e0940.firebasestorage.app",
        messagingSenderId: "176909786012",
        appId: "1:176909786012:web:be5a85f39c943915a00659"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    let currentEmployee = null;
    let employees = [];
    let events = [];
    let submissions = {};

    const DEFAULT_EVENTS = [
        { id: 'ev1', date: '2026-04-18', venue: 'Fior Events' },
        { id: 'ev2', date: '2026-05-09', venue: 'Fior Events' },
        { id: 'ev3', date: '2026-05-17', venue: 'Sala Reggio Ballroom' },
        { id: 'ev4', date: '2026-05-22', venue: 'Sala Reggio Ballroom' },
        { id: 'ev5', date: '2026-05-23', venue: 'Sala Reggio Ballroom' },
        { id: 'ev6', date: '2026-05-24', venue: 'Sala Reggio Ballroom' },
        { id: 'ev7', date: '2026-05-29', venue: 'Sala Reggio Ballroom' },
        { id: 'ev8', date: '2026-05-30', venue: 'Sala Reggio Ballroom' },
        { id: 'ev9', date: '2026-05-31', venue: 'Sala Reggio Ballroom' }
    ];

    const DEFAULT_EMPLOYEES = [
        { id: 'emp1', name: "Carlo Pavia", section: "manager", code: "CARLO6", email: "carlo@memberslounge.com" },
        { id: 'emp2', name: "Michelle Pavia", section: "manager", code: "MICHE0", email: "michelle@memberslounge.com" },
        { id: 'emp3', name: "Rohitha Rawan", section: "kitchen", code: "ROHIT9", email: "rohitha@memberslounge.com" },
        { id: 'emp4', name: "Nam Lai", section: "kitchen", code: "NAMLA7", email: "nam@memberslounge.com" },
        { id: 'emp5', name: "Franco Schiavo", section: "kitchen", code: "FRANC3", email: "franco@memberslounge.com" },
        { id: 'emp6', name: "Peter Tricarico", section: "floor", code: "PETER8", email: "peter@memberslounge.com" },
        { id: 'emp7', name: "Claudio Bottigliero", section: "bar", code: "CLAUDI", email: "claudio@memberslounge.com" },
        { id: 'emp8', name: "Remzi Asllanaj", section: "bar", code: "REMZIA", email: "remzi@memberslounge.com" }
    ];

    function formatDate(dateStr) {
        return new Date(dateStr).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
    }

    async function loadData() {
        try {
            const empSnap = await db.collection('employees').get();
            if (!empSnap.empty) {
                employees = [];
                empSnap.forEach(doc => employees.push({ id: doc.id, ...doc.data() }));
            } else {
                for (const emp of DEFAULT_EMPLOYEES) await db.collection('employees').doc(emp.id).set(emp);
                employees = [...DEFAULT_EMPLOYEES];
            }

            const evSnap = await db.collection('events').get();
            if (!evSnap.empty) {
                events = [];
                evSnap.forEach(doc => events.push({ id: doc.id, ...doc.data() }));
            } else {
                for (const ev of DEFAULT_EVENTS) await db.collection('events').doc(ev.id).set(ev);
                events = [...DEFAULT_EVENTS];
            }

            const subSnap = await db.collection('submissions').get();
            submissions = {};
            subSnap.forEach(doc => submissions[doc.id] = doc.data().eventIds || []);

            events.sort((a, b) => new Date(a.date) - new Date(b.date));
        } catch (err) {
            console.error(err);
        }
    }

    async function renderDates() {
        const container = document.getElementById('datesContainer');
        if (!container || !currentEmployee) return;
        container.innerHTML = '';
        for (const ev of events) {
            const isChecked = (submissions[currentEmployee.id] || []).includes(ev.id);
            const div = document.createElement('div');
            div.className = 'date-item';
            div.innerHTML = `
                <div class="event-info">
                    <strong>${formatDate(ev.date)}</strong><br>${ev.venue}
                </div>
                <label>
                    <input type="checkbox" data-id="${ev.id}" ${isChecked ? 'checked' : ''}>
                    Available to work
                </label>
            `;
            container.appendChild(div);
        }
    }

    async function saveAvailability() {
        const checkboxes = document.querySelectorAll('#datesContainer input[type="checkbox"]');
        const selected = [];
        checkboxes.forEach(cb => { if (cb.checked) selected.push(cb.getAttribute('data-id')); });
        
        await db.collection('submissions').doc(currentEmployee.id).set({ eventIds: selected });
        submissions[currentEmployee.id] = selected;
        
        const msg = document.getElementById('staffMessage');
        msg.textContent = '✓ Availability saved!';
        msg.className = 'success-msg';
        msg.classList.remove('hidden');
        setTimeout(() => msg.classList.add('hidden'), 3000);
        
        renderAvailabilityMatrix('all');
    }

    async function renderAvailabilityMatrix(sectionFilter = 'all') {
        const container = document.getElementById('availabilityMatrix');
        if (!container) return;
        
        let filtered = sectionFilter === 'all' ? employees : employees.filter(e => e.section === sectionFilter);
        if (filtered.length === 0) { container.innerHTML = '<p>No employees in this section.</p>'; return; }
        
        let html = '<div class="scrollable-table"><table><thead><tr><th>Event</th>';
        filtered.forEach(e => html += `<th>${e.name}<br><small>${e.code}</small></th>`);
        html += '</tr></thead><tbody>';
        
        for (const ev of events) {
            html += `<tr><td><strong>${formatDate(ev.date)}<br>${ev.venue}</strong></td>`;
            for (const emp of filtered) {
                const avail = (submissions[emp.id] || []).includes(ev.id);
                html += `<td style="text-align:center;">${avail ? '<span class="available-yes">✓ Available</span>' : '<span class="available-no">✗</span>'}</td>`;
            }
            html += '</tr>';
        }
        html += '</tbody></table></div>';
        container.innerHTML = html;
    }

    function initFilters() {
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.onclick = () => {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                renderAvailabilityMatrix(btn.dataset.section);
            };
        });
    }

    // CODE-ONLY LOGIN - NO PASSWORD REQUIRED
    async function loginWithCode() {
        const code = document.getElementById('employeeCode').value.trim().toUpperCase();
        const errorDiv = document.getElementById('loginError');
        
        if (!code) {
            errorDiv.textContent = 'Please enter your employee code';
            errorDiv.classList.remove('hidden');
            return;
        }
        
        await loadData();
        
        // Find employee by code
        const employee = employees.find(e => e.code === code);
        
        if (!employee) {
            errorDiv.textContent = `Code "${code}" not found. Please check with your manager.`;
            errorDiv.classList.remove('hidden');
            return;
        }
        
        currentEmployee = employee;
        
        // Update UI
        document.getElementById('loginScreen').style.display = 'none';
        document.getElementById('mainApp').style.display = 'block';
        document.getElementById('userName').innerText = employee.name;
        document.getElementById('userSection').innerText = employee.section;
        document.getElementById('userCode').innerText = employee.code;
        document.getElementById('displayName').innerText = employee.name;
        document.getElementById('displaySection').innerText = employee.section;
        document.getElementById('displayCode').innerText = employee.code;
        
        await renderDates();
        await renderAvailabilityMatrix('all');
        initFilters();
    }

    function logout() {
        currentEmployee = null;
        document.getElementById('loginScreen').style.display = 'block';
        document.getElementById('mainApp').style.display = 'none';
        document.getElementById('employeeCode').value = '';
    }

    // Initialize data on page load
    async function init() {
        await loadData();
    }
    
    init();
    document.getElementById('saveBtn').addEventListener('click', saveAvailability);
    
    // Allow Enter key to submit
    document.getElementById('employeeCode').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') loginWithCode();
    });
</script>
</body>
</html>
