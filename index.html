<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monday Night Soccer</title>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        body{background:#eef2f5;font-family:Arial,sans-serif;}
        .app{max-width:500px;margin:0 auto;padding:16px;}
        .card{background:white;border-radius:24px;padding:18px;margin-bottom:14px;}
        button{background:#1a73e8;color:white;border:none;padding:12px;border-radius:60px;cursor:pointer;width:100%;margin:5px 0;}
        select,.input{width:100%;padding:14px;border-radius:60px;border:1px solid #ddd;margin:8px 0;}
        .big-buttons{display:flex;gap:12px;}
        .btn-green{background:#28a745;}
        .btn-red{background:#dc3545;}
        .flex{display:flex;gap:8px;flex-wrap:wrap;}
        .tag{background:#e2e8f0;padding:6px 12px;border-radius:40px;margin:4px;display:inline-block;}
        .header{background:white;padding:14px;text-align:center;border-radius:24px;margin-bottom:16px;}
        .nav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px;}
        .nav-btn{background:#f8fafc;padding:8px 14px;border-radius:60px;font-size:12px;}
        .nav-btn.active{background:#1a73e8;color:white;}
        .hidden{display:none;}
        h2{font-size:16px;margin-bottom:12px;}
    </style>
</head>
<body>
<div class="app" id="app">Loading...</div>

<script>
// FIREBASE CONFIG
const firebaseConfig = {
    apiKey: "AIzaSyCWlFqDJyENgrUOhiLXCjSEi4Mk_54SA1w",
    authDomain: "monday-night-soccer-hub.firebaseapp.com",
    projectId: "monday-night-soccer-hub",
    storageBucket: "monday-night-soccer-hub.firebasestorage.app",
    messagingSenderId: "634335208908",
    appId: "1:634335208908:web:dca705b65fc52de0606969"
};

let db = null;
try {
    firebase.initializeApp(firebaseConfig);
    db = firebase.firestore();
} catch(e) { console.log("Firebase error"); }

// PLAYERS
const PLAYERS = ["Alex Rowe","Ali Mekawy","Carlo","Charlie","Chris Del Monaco","Chris M","Chris S","Danny","Dante","David","Dimitri","Enzo","Farid","Faros","Frank","George B","George T","Ivan","James Zoumis","James","Joe T","Joey","Kia","Leo","Manoli","Marco","Mario","Maurice","Nector","Paul","Perri","Peter","Ralph","Rocco","Stav","Stevan","Theo","Tony EH","Vasilis"].sort();

let currentUser = null;
let isAdmin = false;
let attendance = [];
let guests = [];
let matchResults = {};
let teamAssignments = {};
let playerProfiles = {};

// Get next Monday (AEST)
function getNextMonday() {
    let d = new Date();
    let day = d.getDay();
    let days = (day === 1 ? 0 : (day === 0 ? 1 : 8 - day));
    d.setDate(d.getDate() + days);
    return d;
}

function getGameLabel() {
    let d = getNextMonday();
    return 'Mon ' + d.toLocaleDateString('en-AU', {day:'numeric', month:'long'});
}

let CURRENT_GAME = getNextMonday().toISOString().split('T')[0];

// Load data
async function loadData() {
    if(!db) return;
    let attSnap = await db.collection("attendance").get();
    let guestSnap = await db.collection("guests").get();
    let teamSnap = await db.collection("config").doc("teamAssignments").get();
    let resultSnap = await db.collection("config").doc("matchResults").get();
    let profSnap = await db.collection("config").doc("playerProfiles").get();
    
    attendance = attSnap.docs.map(d => d.data());
    guests = guestSnap.docs.map(d => d.data());
    if(teamSnap.exists) teamAssignments = teamSnap.data();
    if(resultSnap.exists) matchResults = resultSnap.data();
    if(profSnap.exists) playerProfiles = profSnap.data();
    
    for(let p of PLAYERS) if(!playerProfiles[p]) playerProfiles[p] = {age:'-',position:'-',games:0};
}

async function saveAttendance(p, status) {
    if(!db) return;
    await db.collection("attendance").doc(p+'_'+CURRENT_GAME).set({player:p, gameDate:CURRENT_GAME, status:status});
    let idx = attendance.findIndex(x => x.player===p && x.gameDate===CURRENT_GAME);
    if(idx>=0) attendance[idx] = {player:p, gameDate:CURRENT_GAME, status:status};
    else attendance.push({player:p, gameDate:CURRENT_GAME, status:status});
    renderHome();
}

async function addGuest(name) {
    if(!db) return;
    await db.collection("guests").doc(name+'_'+CURRENT_GAME).set({guestName:name, gameDate:CURRENT_GAME, addedBy:currentUser});
    guests.push({guestName:name, gameDate:CURRENT_GAME, addedBy:currentUser});
    renderHome();
}

async function saveTeams(assign) {
    if(!db) return;
    await db.collection("config").doc("teamAssignments").set(assign);
    teamAssignments = assign;
    renderTeams();
}

function getParticipants() {
    let players = attendance.filter(a => a.gameDate===CURRENT_GAME && a.status==='in').map(a => a.player);
    let guestList = guests.filter(g => g.gameDate===CURRENT_GAME).map(g => g.guestName);
    return {players, guests:guestList};
}

function renderHome() {
    let parts = getParticipants();
    let myStatus = attendance.find(a => a.player===currentUser && a.gameDate===CURRENT_GAME)?.status;
    document.getElementById("home").innerHTML = `
        <div class="card">
            <h2>${getGameLabel()} • 8pm</h2>
            <p>Clifton Park, Brunswick</p>
            <div class="big-buttons">
                <button class="btn-green" onclick="setAtt('in')">✅ PLAYING</button>
                <button class="btn-red" onclick="setAtt('out')">❌ CAN'T PLAY</button>
            </div>
            <p>${myStatus === 'in' ? '✓ You are PLAYING' : (myStatus === 'out' ? '✗ You are NOT PLAYING' : 'Tap above')}</p>
        </div>
        <div class="card">
            <h3>Playing (${parts.players.length})</h3>
            <div class="flex">${parts.players.map(p => `<span class="tag">${p}</span>`).join('') || 'None'}</div>
        </div>
        <div class="card">
            <h3>Guests (${parts.guests.length})</h3>
            <div class="flex">${parts.guests.map(g => `<span class="tag">${g}</span>`).join('') || 'None'}</div>
            <input type="text" id="guestName" class="input" placeholder="Guest name">
            <button onclick="addGuestBtn()">➕ Bring Guest</button>
        </div>
    `;
}

function renderTeams() {
    let parts = getParticipants();
    let all = [...parts.players.map(p=>({name:p,isG:false})), ...parts.guests.map(g=>({name:g,isG:true}))];
    let assign = teamAssignments[CURRENT_GAME] || {};
    let yellow = all.filter(p => assign[p.name] === 'yellow' || assign['guest_'+p.name] === 'yellow');
    let orange = all.filter(p => assign[p.name] === 'orange' || assign['guest_'+p.name] === 'orange');
    document.getElementById("teams").innerHTML = `
        <div class="card">
            <div class="flex">
                <div style="flex:1;background:#f5c542;border-radius:18px;padding:12px">
                    <h3>YELLOW (${yellow.length})</h3>
                    ${yellow.map(p => `<span class="tag">${p.name}${p.isG?' Guest':''}</span>`).join('') || '—'}
                </div>
                <div style="flex:1;background:#f5a542;border-radius:18px;padding:12px">
                    <h3>ORANGE (${orange.length})</h3>
                    ${orange.map(p => `<span class="tag">${p.name}${p.isG?' Guest':''}</span>`).join('') || '—'}
                </div>
            </div>
            <p style="text-align:center;margin-top:12px">Captain: Carlo</p>
        </div>
    `;
}

function renderAdmin() {
    if(!isAdmin) {
        document.getElementById("admin").innerHTML = `<div class="card"><h2>Admin Login</h2><input type="password" id="adminPw" class="input" placeholder="Password"><button onclick="adminLogin()">Login</button></div>`;
        return;
    }
    let parts = getParticipants();
    let all = [...parts.players.map(p=>({name:p,isG:false})), ...parts.guests.map(g=>({name:g,isG:true}))];
    let assign = teamAssignments[CURRENT_GAME] || {};
    document.getElementById("admin").innerHTML = `
        <div class="card">
            <h2>Assign Teams</h2>
            ${all.map(p => `
                <div style="display:flex;justify-content:space-between;margin:8px 0">
                    <span>${p.name}${p.isG?' (Guest)':''}</span>
                    <select id="team_${p.name.replace(/ /g,'_')}" data-name="${p.name}" data-guest="${p.isG}">
                        <option value="">—</option>
                        <option value="yellow" ${(assign[p.name]==='yellow'||assign['guest_'+p.name]==='yellow')?'selected':''}>🟡 Yellow</option>
                        <option value="orange" ${(assign[p.name]==='orange'||assign['guest_'+p.name]==='orange')?'selected':''}>🟠 Orange</option>
                    </select>
                </div>
            `).join('')}
            <button onclick="saveTeamsFromAdmin()">Save Teams</button>
        </div>
        <div class="card">
            <h2>Add Guest</h2>
            <input type="text" id="adminGuest" class="input" placeholder="Guest name">
            <button onclick="adminAddGuest()">Add Guest</button>
        </div>
        <div class="card">
            <h2>Record Result</h2>
            <div class="flex"><input type="number" id="yellowScore" placeholder="Yellow" style="flex:1"><input type="number" id="orangeScore" placeholder="Orange" style="flex:1"></div>
            <button onclick="saveResult()">Save Result</button>
        </div>
        <div class="card">
            <button class="btn-red" onclick="logout()">Logout Admin</button>
        </div>
    `;
}

function renderStats() {
    let stats = {};
    for(let p of PLAYERS) stats[p] = {goals:0, games:0};
    for(let a of attendance) if(a.status==='in') stats[a.player].games++;
    for(let date in matchResults) {
        let m = matchResults[date];
        if(m.goals) for(let s in m.goals) if(stats[s]) stats[s].goals += m.goals[s];
    }
    let sorted = Object.entries(stats).sort((a,b)=>b[1].goals - a[1].goals).slice(0,10);
    document.getElementById("stats").innerHTML = `
        <div class="card">
            <h2>Top Scorers</h2>
            ${sorted.map(([n,d],i)=>`<div><strong>${i+1}.</strong> ${n} - ${d.goals} goals</div>`).join('')}
        </div>
    `;
}

function renderRules() {
    document.getElementById("rules").innerHTML = `
        <div class="card">
            <h2>Rules</h2>
            <p>• 8:00pm SHARP AEST • Clifton Park</p>
            <p>• RSVP mandatory by Sunday 6pm</p>
            <p>• Max 2 guests per game</p>
            <p>• 2 x 45 minute halves • No slide tackles</p>
        </div>
    `;
}

function renderChat() {
    document.getElementById("chat").innerHTML = `
        <div class="card">
            <h2>Chat</h2>
            <div id="chatMsgs" style="height:300px;overflow-y:auto;background:#f8fafc;border-radius:20px;padding:12px;margin-bottom:12px"></div>
            <div class="flex"><input type="text" id="chatInput" style="flex:1;padding:12px;border-radius:60px;border:1px solid #ddd"><button onclick="sendChat()">Send</button></div>
        </div>
    `;
    if(db) {
        db.collection("chatMessages").orderBy("timestamp").onSnapshot(snap => {
            let div = document.getElementById("chatMsgs");
            if(!div) return;
            div.innerHTML = snap.docs.map(doc => {
                let m = doc.data();
                return `<div><strong>${m.name}</strong>: ${m.message}</div>`;
            }).join('') || "No messages";
        });
    }
}

async function sendChat() {
    let inp = document.getElementById("chatInput");
    if(inp && inp.value.trim() && db) {
        await db.collection("chatMessages").add({name:currentUser, message:inp.value.trim(), timestamp:new Date()});
        inp.value = "";
    }
}

// Global functions for buttons
window.setAtt = async function(s) { await saveAttendance(currentUser, s); };
window.addGuestBtn = async function() { let inp = document.getElementById("guestName"); if(inp.value.trim()) await addGuest(inp.value.trim()); inp.value = ""; renderHome(); };
window.adminAddGuest = async function() { let inp = document.getElementById("adminGuest"); if(inp.value.trim()) await addGuest(inp.value.trim()); inp.value = ""; renderAdmin(); };
window.saveTeamsFromAdmin = async function() {
    let selects = document.querySelectorAll("[id^='team_']");
    let newAssign = {};
    selects.forEach(sel => {
        let name = sel.dataset.name;
        let isGuest = sel.dataset.guest === "true";
        let val = sel.value;
        if(val) newAssign[isGuest ? 'guest_'+name : name] = val;
    });
    await saveTeams({...teamAssignments, [CURRENT_GAME]: newAssign});
    renderTeams();
    renderAdmin();
};
window.saveResult = async function() {
    let y = parseInt(document.getElementById("yellowScore").value) || 0;
    let o = parseInt(document.getElementById("orangeScore").value) || 0;
    await db.collection("config").doc("matchResults").set({...matchResults, [CURRENT_GAME]:{yellowScore:y, orangeScore:o, goals:{}}});
    alert("Result saved");
};
window.adminLogin = function() {
    let pw = document.getElementById("adminPw").value;
    if(pw === "carlo123") {
        isAdmin = true;
        renderAdmin();
    } else alert("Wrong password");
};
window.logout = function() { isAdmin = false; currentUser = null; localStorage.removeItem("mns_user"); renderLogin(); };

function renderLogin() {
    document.getElementById("app").innerHTML = `
        <div class="login-box">
            <h2>Monday Night Soccer</h2>
            <p>8pm • Clifton Park</p>
            <select id="playerSelect" class="input">
                <option value="">-- Select Name --</option>
                ${PLAYERS.map(p => `<option value="${p}">${p}</option>`).join('')}
            </select>
            <button onclick="loginPlayer()">Enter as Player</button>
            <hr style="margin:16px 0">
            <button onclick="showAdminLogin()">Admin Login</button>
        </div>
    `;
}

window.loginPlayer = function() {
    let n = document.getElementById("playerSelect").value;
    if(n) {
        currentUser = n;
        isAdmin = false;
        localStorage.setItem("mns_user", JSON.stringify({name:n}));
        renderApp();
    }
};

window.showAdminLogin = function() {
    document.getElementById("app").innerHTML = `
        <div class="login-box">
            <h2>Admin Login</h2>
            <input type="password" id="adminPw" class="input" placeholder="Password">
            <button onclick="adminLogin()">Login</button>
            <button onclick="renderLogin()">Back</button>
        </div>
    `;
};

function renderApp() {
    document.getElementById("app").innerHTML = `
        <div class="header">
            <div class="logo-icon"><i class="fas fa-futbol"></i></div>
            <h1>MONDAY NIGHT SOCCER</h1>
            <div class="user-row"><i class="fas fa-user-circle"></i> ${currentUser} <button onclick="logout()">Exit</button></div>
        </div>
        <div class="nav" id="navBar"></div>
        <div id="home" class="module"></div>
        <div id="teams" class="module hidden"></div>
        <div id="stats" class="module hidden"></div>
        <div id="history" class="module hidden"></div>
        <div id="rules" class="module hidden"></div>
        <div id="chat" class="module hidden"></div>
        <div id="admin" class="module hidden"></div>
    `;
    
    const modules = [
        {id:"home", name:"HOME"}, {id:"teams", name:"TEAMS"}, {id:"stats", name:"STATS"},
        {id:"history", name:"HISTORY"}, {id:"rules", name:"RULES"}, {id:"chat", name:"CHAT"}
    ];
    if(isAdmin) modules.push({id:"admin", name:"ADMIN"});
    
    document.getElementById("navBar").innerHTML = modules.map(m => `<button class="nav-btn" onclick="showModule('${m.id}')">${m.name}</button>`).join('');
    
    window.showModule = function(id) {
        document.querySelectorAll(".module").forEach(m => m.classList.add("hidden"));
        document.getElementById(id).classList.remove("hidden");
        document.querySelectorAll(".nav-btn").forEach(btn => btn.classList.remove("active"));
        event.target.classList.add("active");
        if(id === "home") renderHome();
        if(id === "teams") renderTeams();
        if(id === "stats") renderStats();
        if(id === "history") document.getElementById("history").innerHTML = '<div class="card"><h2>History</h2><p>Match history will appear here</p></div>';
        if(id === "rules") renderRules();
        if(id === "chat") renderChat();
        if(id === "admin") renderAdmin();
    };
    
    showModule("home");
}

async function init() {
    await loadData();
    let stored = localStorage.getItem("mns_user");
    if(stored) {
        try {
            let u = JSON.parse(stored);
            currentUser = u.name;
            renderApp();
        } catch(e) { renderLogin(); }
    } else { renderLogin(); }
}

init();
</script>
</body>
</html>
