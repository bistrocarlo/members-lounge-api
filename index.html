            margin-bottom: 25px;
            flex-wrap: wrap;
        }
        
        .tab {
            background: #e8dcc8;
            border: none;
            padding: 12px 28px;
            border-radius: 40px;
            cursor: pointer;
            font-family: inherit;
            font-size: 1rem;
            font-weight: 600;
            transition: all 0.2s;
        }
        
        .tab.active {
            background: #c9a84c;
            color: white;
        }
        
        .panel {
            display: none;
            background: white;
            border-radius: 24px;
            padding: 25px;
            border: 1px solid #e8dcc8;
        }
        
        .panel.active { display: block; }
        
        .stats-bar {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }
        
        .stat {
            background: #faf5ea;
            border-radius: 16px;
            padding: 12px 20px;
            flex: 1;
            text-align: center;
        }
        
        .stat-number {
            font-size: 1.8rem;
            font-weight: bold;
            color: #c9a84c;
        }
        
        .toolbar {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        
        .btn {
            background: #c9a84c;
            border: none;
            padding: 10px 20px;
            border-radius: 30px;
            cursor: pointer;
            font-family: inherit;
            font-weight: 600;
            transition: all 0.2s;
        }
        
        .btn:hover { background: #b8953a; transform: translateY(-1px); }
        .btn-primary { background: #27ae60; color: white; }
        .btn-email { background: #3498db; color: white; }
        .btn-csv { background: #2c3e50; color: white; }
        .btn-excel { background: #1e8449; color: white; }
        .btn-pdf { background: #e74c3c; color: white; }
        .btn-postal { background: #e67e22; color: white; }

            gap: 10px;
            flex-wrap: wrap;
        }

            padding: 12px 18px;
            border-radius: 40px;
            border: 1px solid #e8dcc8;
            font-family: inherit;
            font-size: 0.9rem;
        }

            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

            background: white;
            border-radius: 16px;
            border: 2px solid #e8dcc8;
            overflow: hidden;

        }

            background: #fffcf5;
        }

            padding: 12px 16px;

            background: #c9a84c;
            color: white;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.8rem;
        }
        
        .table-guests {
            padding: 12px;
            min-height: 150px;
            max-height: 300px;
            overflow-y: auto;
        }
        
        .guest-item {
            padding: 8px 10px;
            margin: 4px 0;
            background: #fefcf8;
            border-radius: 10px;
            border: 1px solid #f0e6d8;
            font-size: 0.8rem;
        }
        
        .guest-name {
            font-weight: bold;
        }
        
        .guest-address {
            font-size: 0.7rem;
            color: #666;
            margin-top: 4px;
            padding-left: 8px;
            border-left: 2px solid #c9a84c;
        }
        
        .postal-status {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 0.65rem;
            margin-left: 8px;
        }
        
        .postal-status.sent { background: #d5f5e3; color: #1e8449; }
        .postal-status.pending { background: #fef9e7; color: #b7950b; }
        
        .postal-checkbox {
            margin-left: 10px;
            cursor: pointer;
        }
        
        .address-missing {
            color: #e74c3c;
            font-size: 0.65rem;
            font-style: italic;
        }

            background: #fef5e0;

            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;

            gap: 10px;

            overflow-x: auto;
            max-height: 600px;
            overflow-y: auto;
        }

            width: 100%;
            border-collapse: collapse;
        }

            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #e8dcc8;
            vertical-align: top;
        }
        
        th {
            background: #faf5ea;
            font-weight: 600;
            position: sticky;
            top: 0;
        }
        
        .email-checkbox, .postal-checkbox-global {
            width: 20px;
            height: 20px;
            cursor: pointer;
        }
        
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #2c2418;
            color: white;
            padding: 10px 24px;
            border-radius: 40px;
            z-index: 1000;
            animation: fadeOut 3s forwards;
        }
        
        @keyframes fadeOut {
            0% { opacity: 1; }
            70% { opacity: 1; }
            100% { opacity: 0; visibility: hidden; }
        }

            background: #fef9e7;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 0.7rem;
            color: #b7950b;

    // Add unique IDs and email tracking
    let guests = guestsData.map((guest, index) => ({
        id: index,
        ...guest,
        emailed: false
    }));

    let currentTab = "postal";
    let searchTerm = "";

    // Group guests by table (excluding null/unable to attend)
    function getTablesInOrder() {
        const tables = new Map();
        
        guests.forEach(guest => {
            if (guest.tableAllocation && guest.tableAllocation !== null) {
                if (!tables.has(guest.tableAllocation)) {
                    tables.set(guest.tableAllocation, {
                        id: guest.tableAllocation,
                        name: guest.tableAllocation === 1 ? "👰 Bridal Table" : `Table ${guest.tableAllocation}`,
                        guests: [],
                        isBridal: guest.tableAllocation === 1
                    });
                }
                tables.get(guest.tableAllocation).guests.push(guest);
            }
        });
        
        // Return in order: Bridal (1) first, then 2-32
        return new Map([...tables.entries()].sort((a, b) => a[0] - b[0]));
    }

    function getUnableToAttend() {
        return guests.filter(g => !g.tableAllocation || g.tableAllocation === null);
    }

    function getTotalGuestCount() {
        return guests.reduce((sum, g) => sum + g.guestCount, 0);
    }

    function getSeatedCount() {
        return guests.filter(g => g.tableAllocation && g.tableAllocation !== null).reduce((sum, g) => sum + g.guestCount, 0);
    }

    function getPostalSentCount() {
        return guests.filter(g => g.postalSent).length;
    }

    function getPostalPendingCount() {
        return guests.filter(g => g.tableAllocation && !g.postalSent).length;
    }

    function getAddressMissingCount() {
        return guests.filter(g => g.tableAllocation && (!g.addressFull || g.addressFull === "")).length;
    }

    function togglePostalSent(guestId) {
        const guest = guests.find(g => g.id === guestId);
        if (guest) {
            guest.postalSent = !guest.postalSent;
            renderApp();
            showToast(`${guest.postalSent ? "Marked as invitation sent" : "Marked as pending"}: ${guest.name}`);
        }
    }

    function markAllPostalSent() {
        const toMark = guests.filter(g => g.tableAllocation && !g.postalSent);
        if (toMark.length === 0) {
            showToast("All invitations already marked as sent!");
            return;
        }
        
        if (confirm(`Mark ${toMark.length} guests as invitation sent?`)) {
            toMark.forEach(g => g.postalSent = true);
            renderApp();
            showToast(`✓ Marked ${toMark.length} guests as invitation sent`);
        }
    }

    function resetPostalStatus() {
        if (confirm("Reset all postal invitation status?")) {
            guests.forEach(g => g.postalSent = false);
            renderApp();
            showToast("Postal status reset");
        }
    }

    function showToast(msg) {
        let toast = document.querySelector('.toast');
        if (toast) toast.remove();
        toast = document.createElement('div');
        toast.className = 'toast';
        toast.textContent = msg;
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 3000);
    }

    function escapeHtml(str) {
        if (!str) return "";
        return str.replace(/[&<>]/g, m => m === "&" ? "&amp;" : m === "<" ? "&lt;" : "&gt;");
    }

    // Export to Excel - Postal Address List
    function exportToExcel() {
        const tables = getTablesInOrder();
        const worksheetData = [
            ["Table", "Guest Name", "Verified Names", "Full Postal Address", "Phone", "Notes", "Guest Count", "Invitation Sent"]
        ];
        
        // Add Bridal Table and Tables 1-32
        for (const [tableNum, table] of tables) {
            for (const guest of table.guests) {
                worksheetData.push([
                    tableNum === 1 ? "Bridal" : tableNum,
                    guest.name,
                    guest.verified || "",
                    guest.addressFull || "",
                    guest.phone || "",
                    guest.notes || "",
                    guest.guestCount,
                    guest.postalSent ? "Yes" : "No"
                ]);
            }
        }
        
        // Add separator
        worksheetData.push(["", "=== UNABLE TO ATTEND / PENDING ===", "", "", "", "", "", ""]);
        
        // Add unable to attend
        const unable = getUnableToAttend();
        for (const guest of unable) {
            worksheetData.push([
                "PENDING",
                guest.name,
                guest.verified || "",
                guest.addressFull || "",
                guest.phone || "",
                guest.notes || "",
                guest.guestCount,
                guest.postalSent ? "Yes" : "No"
            ]);
        }
        
        const ws = XLSX.utils.aoa_to_sheet(worksheetData);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "Postal Invitations");
        ws['!cols'] = [{wch:12},{wch:35},{wch:35},{wch:45},{wch:15},{wch:30},{wch:10},{wch:12}];
        
        XLSX.writeFile(wb, `wedding_postal_invitations_${new Date().toISOString().slice(0,10)}.xlsx`);
        showToast("📊 Excel file exported with postal addresses!");
    }

    // Export to PDF - Address Labels View
    async function exportToPDF() {
        showToast("📄 Generating PDF...");
        
        const tables = getTablesInOrder();
        
        const pdfContent = document.createElement('div');
        pdfContent.style.cssText = 'font-family: Georgia, Times New Roman, Times, serif; padding: 20px; background: white;';
        
        let tablesHtml = '';
        for (const [tableNum, table] of tables) {
            tablesHtml += `
                <div style="border:1px solid #c9a84c; border-radius:10px; margin-bottom:20px; page-break-inside:avoid;">
                    <div style="background:#faf5ea; padding:12px; font-weight:bold; border-bottom:1px solid #c9a84c;">
                        ${table.name}
                    </div>
                    <div style="padding:12px;">
                        ${table.guests.map(guest => `
                            <div style="padding:10px; margin-bottom:8px; border-bottom:1px solid #eee;">
                                <div style="font-weight:bold;">${escapeHtml(guest.name)} ${guest.postalSent ? '✅' : '⏳'}</div>
                                <div style="font-size:10px; color:#666;">${escapeHtml(guest.verified || '')}</div>
                                <div style="font-size:11px; font-family:monospace; margin-top:5px; padding:5px; background:#f9f9f9;">
                                    ${escapeHtml(guest.addressFull || '⚠️ NO ADDRESS PROVIDED')}
                                </div>
                                ${guest.notes ? `<div style="font-size:9px; color:#b7950b; margin-top:3px;">📝 ${escapeHtml(guest.notes)}</div>` : ''}
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }
        
        pdfContent.innerHTML = `
            <div style="text-align:center; margin-bottom:25px; border-bottom:2px solid #c9a84c; padding-bottom:15px;">
                <h1 style="font-size:24px;">💍 Daniel & Laura's Wedding</h1>
                <h2 style="font-size:18px; color:#c9a84c;">Postal Invitation Address List</h2>
                <p>Generated on ${new Date().toLocaleDateString()} at ${new Date().toLocaleTimeString()}</p>
            </div>
            
            <div style="display:flex; justify-content:space-around; margin-bottom:25px;">
                <div><strong>${tables.size}</strong> Tables</div>
                <div><strong>${getSeatedCount()}</strong> Invited Guests</div>
                <div><strong>${getPostalSentCount()}</strong> Invitations Sent</div>
                <div><strong>${getAddressMissingCount()}</strong> Missing Addresses</div>
            </div>
            
            ${tablesHtml}
            
            <div style="margin-top:25px; padding:15px; border:1px solid #e74c3c; border-radius:10px; background:#fef5f5;">
                <h3 style="color:#e74c3c;">⚠️ Addresses Needed (${getAddressMissingCount()})</h3>
                ${guests.filter(g => g.tableAllocation && (!g.addressFull || g.addressFull === "")).map(g => `
                    <div>• ${g.name} - ${g.notes || "Address required"}</div>
                `).join('')}
            </div>
        `;
        
        document.body.appendChild(pdfContent);
        
        const opt = {
            margin: [0.4, 0.4, 0.4, 0.4],
            filename: `wedding_postal_addresses_${new Date().toISOString().slice(0,19).replace(/:/g, '-')}.pdf`,
            image: { type: 'jpeg', quality: 0.98 },
            html2canvas: { scale: 2 },
            jsPDF: { unit: 'in', format: 'a4', orientation: 'portrait' }
        };
        
        try {
            await html2pdf().set(opt).from(pdfContent).save();
            showToast("📄 PDF exported successfully!");
        } catch (err) {
            showToast("PDF export failed: " + err.message);
        } finally {
            pdfContent.remove();
        }
    }

    // Render Postal Invitations Tab (Table view for mailing)
    function renderPostalTab() {
        const tables = getTablesInOrder();
        const unableToAttend = getUnableToAttend();
        
        let postalHtml = `
            <div class="stats-bar">
                <div class="stat"><div class="stat-number">${tables.size}</div><div>Tables</div></div>
                <div class="stat"><div class="stat-number">${getSeatedCount()}</div><div>Invitations to Send</div></div>
                <div class="stat"><div class="stat-number">${getPostalSentCount()}</div><div>Sent</div></div>
                <div class="stat"><div class="stat-number">${getAddressMissingCount()}</div><div>Missing Addresses</div></div>
            </div>
            
            <div class="postal-bulk-bar">
                <span>📬 ${getPostalPendingCount()} invitations pending</span>
                <button class="btn btn-postal" onclick="markAllPostalSent()">✉️ Mark All as Sent</button>
                <button class="btn btn-excel" onclick="exportToExcel()">📊 Export Excel (Addresses)</button>
                <button class="btn btn-pdf" onclick="exportToPDF()">📄 Export PDF (Address Labels)</button>
                <button class="btn" onclick="resetPostalStatus()">⟳ Reset Status</button>
            </div>
            
            <div class="tables-grid">
        `;
        
        // Bridal Table first, then Tables 1-32
        for (const [tableNum, table] of tables) {
            const totalAtTable = table.guests.reduce((sum, g) => sum + g.guestCount, 0);
            const sentAtTable = table.guests.filter(g => g.postalSent).length;
            
            postalHtml += `
                <div class="table-card ${table.isBridal ? 'bridal' : ''}">
                    <div class="table-header ${table.isBridal ? 'bridal' : ''}">
                        <span class="table-title">${table.name}</span>
                        <span class="table-count">${totalAtTable} guests (${sentAtTable} sent)</span>
                    </div>
                    <div class="table-guests">
                        ${table.guests.map(guest => `
                            <div class="guest-item">
                                <div>
                                    <span class="guest-name">${escapeHtml(guest.name)}</span>
                                    <span class="postal-status ${guest.postalSent ? 'sent' : 'pending'}">
                                        ${guest.postalSent ? '✓ Sent' : '⏳ Pending'}
                                    </span>
                                    <input type="checkbox" class="postal-checkbox" ${guest.postalSent ? "checked" : ""} onchange="togglePostalSent(${guest.id})">
                                </div>
                                <div class="guest-address">
                                    📬 ${guest.addressFull ? escapeHtml(guest.addressFull) : '<span class="address-missing">⚠️ NO ADDRESS PROVIDED</span>'}
                                </div>
                                ${guest.verified ? `<div style="font-size:0.65rem; color:#999; margin-top:3px;">👥 ${escapeHtml(guest.verified)}</div>` : ''}
                                ${guest.notes ? `<div style="font-size:0.65rem; color:#b7950b; margin-top:3px;">📝 ${escapeHtml(guest.notes)}</div>` : ''}
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }
        
        postalHtml += `</div>`;
        
        // Unable to attend section
        if (unableToAttend.length > 0) {
            postalHtml += `
                <div class="unassigned-list" style="margin-top:20px; background:#fef5f5; border:1px solid #e74c3c;">
                    <h3 style="color:#e74c3c;">⚠️ Unable to Attend / Pending Confirmation (${unableToAttend.length} groups)</h3>
                    <div style="display:flex; flex-wrap:wrap; gap:10px; margin-top:10px;">
                        ${unableToAttend.map(guest => `
                            <div style="background:white; padding:8px 12px; border-radius:10px; border:1px solid #e8dcc8; width:100%;">
                                <strong>${escapeHtml(guest.name)}</strong> (${guest.guestCount} guests)
                                ${guest.notes ? `<br><small style="color:#b7950b;">📝 ${escapeHtml(guest.notes)}</small>` : ''}
                                ${guest.addressFull ? `<br><small>📬 ${escapeHtml(guest.addressFull)}</small>` : ''}
                            </div>
                        `).join('')}
                    </div>
                    <p style="margin-top:10px; font-size:0.7rem;">💡 These guests may not attend - follow up before sending invitations</p>
                </div>
            `;
        }
        
        return postalHtml;
    }

    function setTab(tab) {
        currentTab = tab;
        renderApp();
    }

    function renderApp() {
        const app = document.getElementById('app');
        
        app.innerHTML = `
            <div class="container">
                <div class="header">
                    <h1>💍 Daniel & Laura's Wedding Manager 💒</h1>
                    <p>${guests.length} groups | ${getTotalGuestCount()} total guests | ${getSeatedCount()} seated across ${getTablesInOrder().size} tables</p>
                </div>
                
                <div class="tabs">
                    <button class="tab ${currentTab === 'postal' ? 'active' : ''}" onclick="setTab('postal')">✉️ Postal Invitations</button>
                    <button class="tab ${currentTab === 'tables' ? 'active' : ''}" onclick="setTab('tables')">🪑 Table Plan</button>
                    <button class="tab ${currentTab === 'guestlist' ? 'active' : ''}" onclick="setTab('guestlist')">📋 Full Guest List</button>
                </div>
                
                <div class="panel active">
                    ${currentTab === 'postal' ? renderPostalTab() : 
                      currentTab === 'tables' ? renderTablesTab() : 
                      renderGuestListTab()}
                </div>
            </div>
        `;
    }

    function renderTablesTab() {
        const tables = getTablesInOrder();
        
        let tablesHtml = '<div class="tables-grid">';
        for (const [tableNum, table] of tables) {
            const totalAtTable = table.guests.reduce((sum, g) => sum + g.guestCount, 0);
            tablesHtml += `
                <div class="table-card ${table.isBridal ? 'bridal' : ''}">
                    <div class="table-header ${table.isBridal ? 'bridal' : ''}">
                        <span class="table-title">${table.name}</span>
                        <span class="table-count">${totalAtTable} guests</span>
                    </div>
                    <div class="table-guests">
                        ${table.guests.map(guest => `
                            <div class="guest-item">
                                <div>
                                    <span class="guest-name">${escapeHtml(guest.name)}</span>
                                    <span class="guest-count">+${guest.guestCount}</span>
                                </div>
                                ${guest.verified ? `<div style="font-size:0.7rem; color:#666;">${escapeHtml(guest.verified)}</div>` : ''}
                                ${guest.notes ? `<div style="font-size:0.65rem; color:#b7950b;">📝 ${escapeHtml(guest.notes)}</div>` : ''}
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }
        tablesHtml += '</div>';
        
        const unable = getUnableToAttend();
        if (unable.length > 0) {
            tablesHtml += `
                <div class="unassigned-list" style="margin-top:20px;">
                    <h3>⚠️ Unable to Attend / Pending</h3>
                    ${unable.map(g => `<div>• ${g.name} - ${g.notes || "Status pending"}</div>`).join('')}
                </div>
            `;
        }
        
        return tablesHtml;
    }

    function renderGuestListTab() {
        const filtered = guests.filter(g => !searchTerm || 
            g.name.toLowerCase().includes(searchTerm.toLowerCase()) ||
            (g.verified && g.verified.toLowerCase().includes(searchTerm.toLowerCase())));
        
        return `
            <div class="stats-bar">
                <div class="stat"><div class="stat-number">${guests.length}</div><div>Groups</div></div>
                <div class="stat"><div class="stat-number">${getTotalGuestCount()}</div><div>Total Guests</div></div>
                <div class="stat"><div class="stat-number">${getSeatedCount()}</div><div>Seated</div></div>
            </div>
            
            <div class="search-box">
                <input type="text" class="search-input" id="searchInput" placeholder="🔍 Search guests..." value="${escapeHtml(searchTerm)}">
                <button class="btn" onclick="updateSearch()">Search</button>
                <button class="btn" onclick="clearSearch()">Clear</button>
            </div>
            
            <div class="guest-table-container">
                <table>
                    <thead>
                        <tr><th>Table</th><th>Name</th><th>Verified Names</th><th>Address</th><th>Phone</th><th>Group</th><th>Count</th><th>Postal</th></tr>
                    </thead>
                    <tbody>
                        ${filtered.map(guest => `
                            <tr>
                                <td>${guest.tableAllocation ? (guest.tableAllocation === 1 ? "Bridal" : guest.tableAllocation) : "—"}</td>
                                <td><strong>${escapeHtml(guest.name)}</strong></td>
                                <td>${escapeHtml(guest.verified || "-")}</td>
                                <td style="font-size:0.75rem;">${escapeHtml(guest.addressFull || "-")}</td>
                                <td>${guest.phone ? guest.phone : "-"}</td>
                                <td><span class="note-badge">${guest.group}</span></td>
                                <td style="text-align:center">${guest.guestCount}</td>
                                <td style="text-align:center">${guest.postalSent ? "✓" : "⏳"}</td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            </div>
        `;
    }

    function updateSearch() {
        searchTerm = document.getElementById('searchInput').value;
        renderApp();
    }

    function clearSearch() {
        searchTerm = "";
        renderApp();
    }

    // Make functions global
    window.togglePostalSent = togglePostalSent;
    window.markAllPostalSent = markAllPostalSent;
    window.resetPostalStatus = resetPostalStatus;
    window.exportToExcel = exportToExcel;
    window.exportToPDF = exportToPDF;
    window.updateSearch = updateSearch;
    window.clearSearch = clearSearch;
    window.setTab = setTab;

    renderApp();
</script>
</body>
</html>
