<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Monday Night Soccer | Elite Command Center</title>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0a0c15; font-family: 'Plus Jakarta Sans', sans-serif; overflow-x: hidden; }
        
        /* Animated gradient background */
        .bg-gradient { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(ellipse at 20% 30%, #1a1c2e, #0a0c15); z-index: -2; }
        .bg-gradient::before { content: ''; position: absolute; width: 200%; height: 200%; background: radial-gradient(circle, rgba(204,0,0,0.08) 0%, transparent 60%); animation: rotate 30s linear infinite; }
        @keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        
        .container { max-width: 1600px; margin: 0 auto; padding: 20px; position: relative; z-index: 1; }
        
        /* Glassmorphic Header */
        .header { background: rgba(15, 20, 30, 0.7); backdrop-filter: blur(20px); border-radius: 32px; padding: 20px 36px; margin-bottom: 28px; border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 20px 40px -15px rgba(0,0,0,0.4); display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; }
        .logo { display: flex; align-items: center; gap: 15px; }
        .logo-icon { width: 50px; height: 50px; background: linear-gradient(135deg, #cc0000, #ff4444); border-radius: 20px; display: flex; align-items: center; justify-content: center; box-shadow: 0 8px 20px rgba(204,0,0,0.4); }
        .logo-icon i { font-size: 28px; color: white; }
        .logo h1 { font-family: 'Space Grotesk', sans-serif; font-size: 1.8rem; font-weight: 700; background: linear-gradient(135deg, #fff, #ffb347, #ff6b6b); background-clip: text; -webkit-background-clip: text; color: transparent; letter-spacing: -0.02em; }
        .logo span { font-size: 0.7rem; color: #ffb347; letter-spacing: 2px; }
        .user-badge { background: rgba(255,255,255,0.05); backdrop-filter: blur(10px); padding: 8px 20px; border-radius: 60px; border: 1px solid rgba(255,255,255,0.1); display: flex; align-items: center; gap: 12px; }
        .user-badge i { color: #ffb347; }
        .user-badge button { background: rgba(204,0,0,0.3); border: none; padding: 6px 16px; border-radius: 40px; color: white; cursor: pointer; transition: 0.2s; }
        .user-badge button:hover { background: #cc0000; }
        
        /* 3D Tabs */
        .tabs { display: flex; gap: 12px; justify-content: center; margin-bottom: 32px; flex-wrap: wrap; }
        .tab-btn { background: rgba(20, 25, 40, 0.8); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.08); padding: 14px 28px; border-radius: 60px; font-weight: 600; cursor: pointer; color: #a0a8c0; font-size: 0.9rem; transition: all 0.3s cubic-bezier(0.2, 0.9, 0.4, 1.1); font-family: 'Space Grotesk', sans-serif; display: flex; align-items: center; gap: 10px; }
        .tab-btn i { font-size: 1.1rem; }
        .tab-btn:hover { background: rgba(204,0,0,0.2); color: white; transform: translateY(-3px); border-color: rgba(204,0,0,0.4); }
        .tab-btn.active { background: linear-gradient(135deg, #cc0000, #aa0000); color: white; box-shadow: 0 10px 25px -8px rgba(204,0,0,0.5); border-color: transparent; }
        
        .panel { display: none; animation: fadeSlideUp 0.4s ease; }
        .panel.active-panel { display: block; }
        @keyframes fadeSlideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        
        /* Glass Cards */
        .card { background: rgba(18, 24, 36, 0.75); backdrop-filter: blur(16px); border-radius: 28px; padding: 28px; margin-bottom: 28px; border: 1px solid rgba(255,255,255,0.06); box-shadow: 0 25px 40px -18px rgba(0,0,0,0.5); transition: transform 0.2s, box-shadow 0.2s; }
        .card:hover { transform: translateY(-3px); box-shadow: 0 30px 45px -20px rgba(0,0,0,0.6); }
        .card h2, .card h3 { font-family: 'Space Grotesk', sans-serif; font-weight: 700; margin-bottom: 22px; color: #ffffff; border-left: 4px solid #cc0000; padding-left: 18px; font-size: 1.4rem; letter-spacing: -0.02em; }
        
        label { font-weight: 500; display: block; margin-top: 12px; margin-bottom: 8px; color: #b0b8d0; font-size: 0.8rem; letter-spacing: 0.5px; text-transform: uppercase; }
        select, input, button { padding: 14px 22px; border-radius: 48px; border: 1px solid rgba(255,255,255,0.1); font-size: 0.9rem; background: rgba(10, 14, 22, 0.9); color: #f0f3fa; width: 100%; margin: 8px 0; font-family: 'Plus Jakarta Sans', sans-serif; transition: all 0.2s; }
        select:focus, input:focus { outline: none; border-color: #cc0000; box-shadow: 0 0 0 3px rgba(204,0,0,0.2); }
        button { background: linear-gradient(135deg, #cc0000, #aa0000); color: white; font-weight: 600; border: none; cursor: pointer; width: auto; min-width: 150px; box-shadow: 0 6px 14px rgba(204,0,0,0.3); transition: all 0.2s; }
        button:active { transform: scale(0.97); }
        .btn-secondary { background: rgba(255,255,255,0.08); box-shadow: none; }
        .flex-btns { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 20px; }
        
        /* 3D Realistic Pitch */
        .pitch-3d { background: linear-gradient(145deg, #1e6b3a, #0d3a1f); border-radius: 40px; padding: 25px; position: relative; box-shadow: 0 30px 40px -20px black, inset 0 1px 2px rgba(255,255,255,0.2); border: 2px solid rgba(255,215,0,0.5); }
        .pitch-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; min-height: 500px; position: relative; background-image: radial-gradient(circle at 25% 40%, rgba(255,255,255,0.06) 1.5px, transparent 1.5px); background-size: 30px 30px; }
        .pitch-half-line { position: absolute; left: 50%; top: 0; bottom: 0; width: 2px; background: repeating-linear-gradient(to bottom, rgba(255,255,255,0.4), rgba(255,255,255,0.4) 15px, transparent 15px, transparent 30px); transform: translateX(-50%); }
        .center-circle { position: absolute; top: 50%; left: 50%; width: 100px; height: 100px; border: 2px dashed rgba(255,255,255,0.3); border-radius: 50%; transform: translate(-50%, -50%); }
        .goal-area { position: absolute; width: 80px; height: 180px; border: 2px solid rgba(255,215,0,0.5); top: 50%; transform: translateY(-50%); }
        .goal-left { left: 0; border-left: none; border-radius: 0 16px 16px 0; }
        .goal-right { right: 0; border-right: none; border-radius: 16px 0 0 16px; }
        
        .team-column { background: rgba(0,0,0,0.5); backdrop-filter: blur(8px); border-radius: 24px; padding: 16px; margin: 0 4px; }
        .team-header-3d { text-align: center; font-size: 1.3rem; font-weight: 800; padding: 12px; border-radius: 40px; margin-bottom: 16px; }
        .yellow-header { background: linear-gradient(135deg, #e6b800, #cc9900); color: #1a1a1a; }
        .orange-header { background: linear-gradient(135deg, #ff8c00, #e66a00); color: white; }
        .position-row { display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; }
        .position-slot { display: flex; align-items: center; gap: 8px; background: rgba(0,0,0,0.5); border-radius: 40px; padding: 6px 12px; }
        .pos-badge { font-size: 0.65rem; font-weight: 700; background: rgba(255,255,255,0.2); padding: 4px 10px; border-radius: 30px; min-width: 45px; text-align: center; }
        .player-name-slot { font-size: 0.75rem; font-weight: 500; white-space: nowrap; overflow-x: auto; flex: 1; }
        
        .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; }
        .count-box { background: linear-gradient(135deg, rgba(30,35,50,0.9), rgba(20,25,40,0.9)); border-radius: 24px; padding: 24px; text-align: center; border: 1px solid rgba(255,255,255,0.05); }
        .count-number { font-size: 2.8rem; font-weight: 800; background: linear-gradient(135deg, #ffb347, #ff6b6b); background-clip: text; -webkit-background-clip: text; color: transparent; }
        
        .data-table { width: 100%; border-collapse: collapse; background: rgba(0,0,0,0.3); border-radius: 20px; overflow: hidden; }
        .data-table th, .data-table td { padding: 14px 12px; text-align: left; border-bottom: 1px solid rgba(255,255,255,0.05); color: #e2e8f0; }
        .data-table th { background: rgba(204,0,0,0.2); color: #ffb347; font-weight: 700; }
        
        .chat-container { background: rgba(0,0,0,0.4); border-radius: 28px; overflow: hidden; height: 460px; display: flex; flex-direction: column; }
        .chat-messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
        .chat-message.sent { align-self: flex-end; }
        .chat-message.sent .chat-bubble { background: linear-gradient(135deg, #cc0000, #aa0000); color: white; border-radius: 20px 20px 4px 20px; }
        .chat-message.received .chat-bubble { background: rgba(30,35,50,0.9); border-radius: 20px 20px 20px 4px; }
        .chat-bubble { padding: 12px 18px; max-width: 75%; }
        .admin-tag { background: #cc0000; padding: 2px 10px; border-radius: 30px; font-size: 0.6rem; margin-left: 8px; }
        
        .login-card { background: rgba(18, 24, 36, 0.9); backdrop-filter: blur(20px); border-radius: 48px; padding: 48px; text-align: center; border: 1px solid rgba(255,255,255,0.1); max-width: 480px; margin: 80px auto; }
        
        @media (max-width: 1000px) { .pitch-grid { grid-template-columns: repeat(2, 1fr); } }
        @media (max-width: 700px) { .header { flex-direction: column; gap: 15px; text-align: center; } .tabs { gap: 8px; } .tab-btn { padding: 10px 18px; font-size: 0.75rem; } }
    </style>
</head>
<body>
<div class="bg-gradient"></div>
<div class="container" id="appContainer"></div>

<script>
    // Firebase Config
    const firebaseConfig = {
        apiKey: "AIzaSyCWlFqDJyENgrUOhiLXCjSEi4Mk_54SA1w",
        authDomain: "monday-night-soccer-hub.firebaseapp.com",
        projectId: "monday-night-soccer-hub",
        storageBucket: "monday-night-soccer-hub.firebasestorage.app",
        messagingSenderId: "634335208908",
        appId: "1:634335208908:web:dca705b65fc52de0606969"
    };
    
    let db = null;
    try { firebase.initializeApp(firebaseConfig); db = firebase.firestore(); } catch(e) { console.warn(e); }
    
    // Data state
    let players = ["Alex Rowe", "Ali Mekawy", "Carlo", "Charlie", "Chris Del Monaco", "Chris M", "Chris S", "Danny", "Dante", "David", "Dimitri", "Enzo", "Farid", "Faros", "Frank", "George B", "George T", "Ivan", "James Zoumis", "James", "Joe T", "Joey", "Kia", "Leo", "Manoli", "Marco", "Mario", "Maurice", "Nector", "Paul", "Perri", "Peter", "Ralph", "Rocco", "Stav", "Stevan", "Theo", "Tony EH", "Vasilis"].sort();
    let teamAssignments = {}, matchResults = {}, payments = [], attendance = [], guests = [];
    let isAdminLoggedIn = false, currentUser = null;
    
    const playersRef = db ? db.collection("config").doc("players") : null;
    const teamsRef = db ? db.collection("config").doc("teamAssignments") : null;
    const resultsRef = db ? db.collection("config").doc("matchResults") : null;
    const paymentsRef = db ? db.collection("payments") : null;
    const attendanceRef = db ? db.collection("attendance") : null;
    const messagesRef = db ? db.collection("messages") : null;
    const guestsRef = db ? db.collection("guests") : null;
    
    // Positions for realistic spread
    const POSITIONS = ["GK", "CB", "CB", "RB/LB", "CDM", "CM", "CAM", "LW", "RW", "ST"];
    
    function getCurrentAESTDate() {
        const now = new Date(); const utc = now.getTime() + (now.getTimezoneOffset() * 60000);
        return new Date(utc + (10 * 3600000)).toISOString().split('T')[0];
    }
    function generateAllGameWeeks() {
        const year = new Date().getFullYear();
        let start = new Date(year, 0, 1);
        while (start.getDay() !== 1) start.setDate(start.getDate() + 1);
        let weeks = [], cur = new Date(start);
        let dec31 = new Date(year, 11, 31);
        let lastMonday = new Date(dec31);
        while (lastMonday.getDay() !== 1) lastMonday.setDate(lastMonday.getDate() - 1);
        let secondLast = new Date(lastMonday);
        secondLast.setDate(secondLast.getDate() - 7);
        while (cur <= secondLast) {
            weeks.push({ dateStr: cur.toISOString().split('T')[0], label: `MON ${cur.toLocaleDateString('en-AU', { day:'numeric', month:'short' })}` });
            cur.setDate(cur.getDate() + 7);
        }
        return weeks;
    }
    const ALL_GAME_WEEKS = generateAllGameWeeks();
    function getFutureWeeks() { return ALL_GAME_WEEKS.filter(w => w.dateStr >= getCurrentAESTDate()); }
    
    async function loadData() {
        if(!db) return;
        try {
            const pDoc = await playersRef.get(); if(pDoc.exists && pDoc.data().list) players = pDoc.data().list.sort();
            const tDoc = await teamsRef.get(); if(tDoc.exists) teamAssignments = tDoc.data();
            const rDoc = await resultsRef.get(); if(rDoc.exists) matchResults = rDoc.data();
            const paySnap = await paymentsRef.get(); payments = []; paySnap.forEach(d => payments.push(d.data()));
            const attSnap = await attendanceRef.get(); attendance = []; attSnap.forEach(d => attendance.push(d.data()));
            const guestSnap = await guestsRef.get(); guests = []; guestSnap.forEach(d => guests.push(d.data()));
        } catch(e) { console.warn(e); }
    }
    async function saveTeams() { if(db) await teamsRef.set(teamAssignments); }
    async function saveResults() { if(db) await resultsRef.set(matchResults); }
    async function savePayment(p) { if(db) await paymentsRef.doc(`${p.player}_${p.gameDate}`).set(p); payments.push(p); }
    async function saveAttendance(a) { if(db) await attendanceRef.doc(`${a.player}_${a.gameDate}`).set(a); const idx = attendance.findIndex(x=>x.player===a.player&&x.gameDate===a.gameDate); if(idx!==-1) attendance[idx]=a; else attendance.push(a); }
    async function saveGuest(g) { if(db) await guestsRef.doc(`${g.guestName}_${g.gameDate}`).set(g); guests.push(g); }
    
    function loginAsPlayer(name) { currentUser = { name, role: "player" }; isAdminLoggedIn = false; localStorage.setItem("soccer_user", JSON.stringify(currentUser)); renderMainApp(); }
    function adminLogin(pw) { if(pw === "admin123") { currentUser = { name: "admin", role: "admin" }; isAdminLoggedIn = true; localStorage.setItem("soccer_user", JSON.stringify(currentUser)); renderMainApp(); return true; } return false; }
    function logout() { currentUser = null; localStorage.removeItem("soccer_user"); renderLoginScreen(); }
    
    async function renderLoginScreen() {
        await loadData();
        document.getElementById("appContainer").innerHTML = `<div class="login-card"><div class="logo-icon" style="margin:0 auto 20px; width:70px; height:70px;"><i class="fas fa-futbol" style="font-size:36px;"></i></div><h2 style="color:white; margin-bottom:10px;">Monday Night Soccer</h2><p style="color:#a0a8c0; margin-bottom:30px;">Elite Command Center</p><select id="playerNameSelect" style="margin-bottom:15px;"><option>-- Select Player --</option>${players.map(p=>`<option>${escapeHtml(p)}</option>`)}</select><button id="playerLoginBtn" style="width:100%;">ENTER AS PLAYER</button><hr style="margin:25px 0; border-color:rgba(255,255,255,0.1);"><input type="password" id="adminPassword" placeholder="Admin Password"><button id="adminLoginBtn" style="width:100%; background:rgba(255,255,255,0.1);">ADMIN LOGIN</button><div id="loginError" style="color:#ff6b6b; margin-top:16px;"></div></div>`;
        document.getElementById("playerLoginBtn").onclick = () => { const name = document.getElementById("playerNameSelect").value; if(name && name !== "-- Select Player --") loginAsPlayer(name); else document.getElementById("loginError").innerText = "Select your name"; };
        document.getElementById("adminLoginBtn").onclick = () => { if(!adminLogin(document.getElementById("adminPassword").value)) document.getElementById("loginError").innerText = "Wrong password"; };
    }
    
    async function renderMainApp() {
        await loadData();
        const container = document.getElementById("appContainer");
        container.innerHTML = `<div class="header"><div class="logo"><div class="logo-icon"><i class="fas fa-crown"></i></div><div><h1>MONDAY NIGHT SOCCER</h1><span>ELITE HUB • 2026 SEASON</span></div></div><div class="user-badge"><i class="fas fa-user-astronaut"></i> <span>${currentUser.role === "admin" ? "ADMIN MODE" : currentUser.name}</span> <button id="logoutBtn"><i class="fas fa-sign-out-alt"></i> Exit</button></div></div>
        <div class="tabs" id="tabs"></div><div id="panelContainer"></div>`;
        document.getElementById("logoutBtn").onclick = logout;
        const tabs = [{ id: "attendance", label: "ATTENDANCE", icon: "fa-calendar-check" }, { id: "teams", label: "TACTICAL PITCH", icon: "fa-futbol" }, { id: "chat", label: "CHAT ROOM", icon: "fa-comments" }, { id: "stats", label: "HALL OF FAME", icon: "fa-trophy" }, { id: "history", label: "MATCH HISTORY", icon: "fa-clock" }, { id: "rules", label: "THE CODE", icon: "fa-scroll" }];
        if (isAdminLoggedIn) tabs.push({ id: "admin", label: "ADMIN HUB", icon: "fa-shield-alt" });
        document.getElementById("tabs").innerHTML = tabs.map(t => `<button class="tab-btn" data-tab="${t.id}"><i class="fas ${t.icon}"></i> ${t.label}</button>`).join('');
        document.getElementById("panelContainer").innerHTML = tabs.map(t => `<div id="${t.id}Panel" class="panel"></div>`).join('');
        document.getElementById("attendancePanel").classList.add("active-panel");
        if(document.querySelector(".tab-btn")) document.querySelector(".tab-btn").classList.add("active");
        renderAttendancePanel(); renderTacticalPitch(); renderChatPanel(); renderStatsPanel(); renderHistoryPanel(); renderRulesPanel();
        if (isAdminLoggedIn) renderAdminPanel();
        document.querySelectorAll(".tab-btn").forEach(btn => {
            btn.onclick = () => {
                document.querySelectorAll(".panel").forEach(p => p.classList.remove("active-panel"));
                document.getElementById(`${btn.dataset.tab}Panel`).classList.add("active-panel");
                document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
                btn.classList.add("active");
                if(btn.dataset.tab === "teams") renderTacticalPitch();
                if(btn.dataset.tab === "attendance") renderAttendancePanel();
                if(btn.dataset.tab === "stats") renderStatsPanel();
                if(btn.dataset.tab === "admin") renderAdminPanel();
                if(btn.dataset.tab === "history") renderHistoryPanel();
            };
        });
    }
    
    function renderTacticalPitch() {
        const weeks = getFutureWeeks();
        if (!weeks.length) { document.getElementById("teamsPanel").innerHTML = `<div class="card">No upcoming fixtures</div>`; return; }
        document.getElementById("teamsPanel").innerHTML = `<div class="card"><h2><i class="fas fa-drafting-compass"></i> 3D TACTICAL ARRANGEMENT</h2><select id="pitchWeekSelect" style="margin-bottom:20px;">${weeks.map(w=>`<option value="${w.dateStr}">${w.label}</option>`)}</select>
        <div class="pitch-3d"><div class="pitch-grid" id="pitchGridContainer"><div class="pitch-half-line"></div><div class="center-circle"></div><div class="goal-area goal-left"></div><div class="goal-area goal-right"></div></div></div></div>`;
        document.getElementById("pitchWeekSelect").onchange = () => renderPitchPositions();
        renderPitchPositions();
    }
    
    function renderPitchPositions() {
        const gameDate = document.getElementById("pitchWeekSelect")?.value;
        if(!gameDate) return;
        const assignments = teamAssignments[gameDate] || {};
        const yellowPlayers = Object.keys(assignments).filter(p => assignments[p] === "yellow");
        const orangePlayers = Object.keys(assignments).filter(p => assignments[p] === "orange");
        
        const distributeToPositions = (playersArr, colorClass) => {
            const positions = [...POSITIONS];
            return positions.map((pos, idx) => ({ pos, player: playersArr[idx % playersArr.length] || "⚫ VACANT" }));
        };
        const yellowLineup = distributeToPositions(yellowPlayers, 'yellow');
        const orangeLineup = distributeToPositions(orangePlayers, 'orange');
        
        const gridHtml = `<div class="team-column"><div class="team-header-3d yellow-header"><i class="fas fa-star"></i> YELLOW SQUAD</div>${yellowLineup.map(p => `<div class="position-slot"><span class="pos-badge">${p.pos}</span><span class="player-name-slot">${escapeHtml(p.player)}</span></div>`).join('')}</div>
        <div class="team-column"><div class="team-header-3d orange-header"><i class="fas fa-fire"></i> ORANGE SQUAD</div>${orangeLineup.map(p => `<div class="position-slot"><span class="pos-badge">${p.pos}</span><span class="player-name-slot">${escapeHtml(p.player)}</span></div>`).join('')}</div>`;
        const container = document.getElementById("pitchGridContainer");
        if(container) container.innerHTML = gridHtml + `<div class="pitch-half-line"></div><div class="center-circle"></div><div class="goal-area goal-left"></div><div class="goal-area goal-right"></div>`;
    }
    
    function renderAttendancePanel() {
        const weeks = getFutureWeeks();
        document.getElementById("attendancePanel").innerHTML = `<div class="card"><h2><i class="fas fa-check-circle"></i> RSVP SYSTEM</h2><select id="attWeekSelect">${weeks.map(w=>`<option value="${w.dateStr}">${w.label}</option>`)}</select><select id="attPlayerSelect"><option>-- Select Player --</option>${players.map(p=>`<option>${escapeHtml(p)}</option>`)}</select><div class="flex-btns"><button id="attendingBtn"><i class="fas fa-check"></i> ATTENDING ($5)</button><button id="notAttendingBtn" class="btn-secondary"><i class="fas fa-times"></i> UNAVAILABLE</button></div><div id="attMsg" style="margin-top:16px;"></div></div>
        <div class="card"><h2><i class="fas fa-users"></i> THIS WEEK'S LINEUP</h2><div id="attCounts" class="stat-grid"></div></div>`;
        document.getElementById("attWeekSelect").onchange = renderAttendanceCounts;
        document.getElementById("attendingBtn").onclick = async () => { const p = document.getElementById("attPlayerSelect").value, w = document.getElementById("attWeekSelect").value; if(p && w && p!=="-- Select Player --") { await saveAttendance({player:p, gameDate:w, status:"in"}); renderAttendanceCounts(); document.getElementById("attMsg").innerHTML = `<div style="background:#2e7d5e20; padding:12px; border-radius:60px;">✅ ${p} confirmed attending!</div>`; setTimeout(()=>document.getElementById("attMsg").innerHTML="",2000); if(isAdminLoggedIn) renderAdminPanel(); } };
        document.getElementById("notAttendingBtn").onclick = async () => { const p = document.getElementById("attPlayerSelect").value, w = document.getElementById("attWeekSelect").value; if(p && w) { await saveAttendance({player:p, gameDate:w, status:"out"}); renderAttendanceCounts(); document.getElementById("attMsg").innerHTML = `<div style="background:#cc000020; padding:12px; border-radius:60px;">❌ ${p} marked unavailable</div>`; setTimeout(()=>document.getElementById("attMsg").innerHTML="",2000); } };
        renderAttendanceCounts();
    }
    async function renderAttendanceCounts() {
        const week = document.getElementById("attWeekSelect")?.value;
        if(!week) return;
        const attending = attendance.filter(a => a.gameDate === week && a.status === 'in').map(a=>a.player);
        const notAttending = attendance.filter(a => a.gameDate === week && a.status === 'out').map(a=>a.player);
        document.getElementById("attCounts").innerHTML = `<div class="count-box"><i class="fas fa-futbol" style="font-size:2rem; opacity:0.7;"></i><div class="count-number">${attending.length}</div><div>ATTENDING</div><div style="font-size:0.75rem;">${attending.slice(0,5).join(', ')}${attending.length>5? '...' : ''}</div></div>
        <div class="count-box"><i class="fas fa-bed" style="font-size:2rem; opacity:0.7;"></i><div class="count-number">${notAttending.length}</div><div>ABSENT</div><div style="font-size:0.75rem;">${notAttending.slice(0,5).join(', ')}${notAttending.length>5? '...' : ''}</div></div>`;
    }
    
    function renderChatPanel() {
        document.getElementById("chatPanel").innerHTML = `<div class="card"><h2><i class="fas fa-comment-dots"></i> PITCH TALK</h2><div class="chat-container"><div id="chatMessages" class="chat-messages">Loading...</div><div style="display:flex; gap:12px; padding:16px; background:rgba(0,0,0,0.3);"><input id="chatInput" placeholder="Type your message..."><button id="sendChatBtn"><i class="fas fa-paper-plane"></i> Send</button></div></div></div>`;
        document.getElementById("sendChatBtn").onclick = async () => { const msg = document.getElementById("chatInput").value.trim(); if(msg && messagesRef) { await messagesRef.add({ name: currentUser.name, message: msg, isAdmin: currentUser.role==="admin", timestamp: firebase.firestore.FieldValue.serverTimestamp() }); document.getElementById("chatInput").value = ""; } };
        if(messagesRef) messagesRef.orderBy("timestamp","asc").onSnapshot(snap=>{ const container = document.getElementById("chatMessages"); if(!container) return; let html=""; snap.forEach(doc=>{ const d=doc.data(); const time=d.timestamp?d.timestamp.toDate().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}):""; const isSent=d.name===currentUser.name; const displayName=d.isAdmin?`${d.name} <span class="admin-tag">ADMIN</span>`:d.name; html+=`<div class="chat-message ${isSent?'sent':'received'}"><div class="chat-bubble"><div class="chat-name">${escapeHtml(displayName)}</div><div>${escapeHtml(d.message)}</div><div class="chat-time" style="font-size:0.6rem; opacity:0.6; margin-top:5px;">${time}</div></div></div>`; }); container.innerHTML=html||"<div style='text-align:center; opacity:0.5;'>No messages</div>"; container.scrollTop=container.scrollHeight; });
    }
    
    async function renderStatsPanel() {
        let tally = new Map();
        attendance.forEach(a => { if(a.status === 'in') tally.set(a.player, (tally.get(a.player)||0)+1); });
        let sorted = Array.from(tally.entries()).map(([n,g]) => ({name:n, games:g})).sort((a,b)=>b.games - a.games).slice(0,15);
        let html = `<div class="card"><h2><i class="fas fa-crown"></i> ATTENDANCE LEADERBOARD</h2><table class="data-table"><thead><tr><th>#</th><th>PLAYER</th><th>MATCHES</th></tr></thead><tbody>`;
        sorted.forEach((p,i)=> html += `<tr><td style="color:#ffb347; font-weight:bold;">${i+1}</td><td>${escapeHtml(p.name)}</td><td><i class="fas fa-calendar-alt"></i> ${p.games}</td></tr>`);
        html += `</tbody></table></div>`; document.getElementById("statsPanel").innerHTML = html;
    }
    
    async function renderHistoryPanel() {
        const pastWeeks = ALL_GAME_WEEKS.filter(w => w.dateStr < getCurrentAESTDate()).reverse().slice(0,12);
        let html = `<div class="card"><h2><i class="fas fa-history"></i> PAST BATTLES</h2><table class="data-table"><thead><tr><th>WEEK</th><th>YELLOW</th><th>ORANGE</th><th>SCORE</th></tr></thead><tbody>`;
        for(let week of pastWeeks){
            const assignments = teamAssignments[week.dateStr]||{};
            const yellow = Object.keys(assignments).filter(p=>assignments[p]==="yellow").slice(0,3);
            const orange = Object.keys(assignments).filter(p=>assignments[p]==="orange").slice(0,3);
            const match = matchResults[week.dateStr]||{yellowScore:0, orangeScore:0};
            html += `<tr><td style="font-weight:bold;">${week.label}</td><td>${yellow.join(', ')}${Object.keys(assignments).filter(p=>assignments[p]==="yellow").length>3?'...':''}</td><td>${orange.join(', ')}${Object.keys(assignments).filter(p=>assignments[p]==="orange").length>3?'...':''}</td><td><span style="color:#ffd966;">${match.yellowScore}</span> - <span style="color:#ffaa44;">${match.orangeScore}</span></td></tr>`;
        }
        html += `</tbody></table></div>`; document.getElementById("historyPanel").innerHTML = html;
    }
    function renderRulesPanel() { document.getElementById("rulesPanel").innerHTML = `<div class="card"><h2><i class="fas fa-gavel"></i> THE CODE OF CONDUCT</h2><ul style="line-height:2; margin-left:20px;"><li>🚫 No tackles from behind → Free kick</li><li>🧤 Goalie rotation mandatory (5 min minimum)</li><li>⚡ No showboating → Immediate expulsion</li><li>🔴 Foul within 1m of goal → Shot from halfway</li><li>💪 Respect the ref and opponents</li></ul></div>`; }
    
    // ADMIN HUB (condensed but fully functional)
    async function renderAdminPanel() {
        const futureWeeks = getFutureWeeks();
        document.getElementById("adminPanel").innerHTML = `<div class="card"><h3><i class="fas fa-coins"></i> CASH COLLECTION ($5/player)</h3><select id="adminCashWeek">${futureWeeks.map(w=>`<option value="${w.dateStr}">${w.label}</option>`)}</select><div id="cashList"></div><div id="treasuryTotal" class="count-box" style="margin-top:16px;"></div></div>
        <div class="card"><h3><i class="fas fa-users"></i> TEAM ASSIGNMENT (Yellow/Orange)</h3><select id="adminTeamWeek">${futureWeeks.map(w=>`<option value="${w.dateStr}">${w.label}</option>`)}</select><div id="teamAssignList"></div><button id="saveTeamBtn">💾 SAVE FORMATION</button></div>
        <div class="card"><h3><i class="fas fa-user-plus"></i> GUEST PLAYER</h3><select id="guestWeekSelectAdmin">${futureWeeks.map(w=>`<option value="${w.dateStr}">${w.label}</option>`)}</select><input id="guestNameAdmin" placeholder="Guest name"><button id="addGuestAdminBtn">➕ ADD GUEST</button><div id="guestListAdmin"></div></div>
        <div class="card"><h3><i class="fas fa-chart-line"></i> MATCH RESULT</h3><select id="resultWeekSelectAdmin">${ALL_GAME_WEEKS.map(w=>`<option value="${w.dateStr}">${w.label}</option>`)}</select><div class="flex-btns"><input type="number" id="resYellow" placeholder="Yellow Score" style="width:100px;"><input type="number" id="resOrange" placeholder="Orange Score" style="width:100px;"><button id="saveResultAdminBtn">SAVE</button></div></div>`;
        document.getElementById("adminCashWeek").onchange = renderCashAdmin;
        document.getElementById("adminTeamWeek").onchange = renderTeamAssignAdmin;
        document.getElementById("saveTeamBtn").onclick = async () => { await saveTeams(); renderTacticalPitch(); alert("Teams saved!"); };
        document.getElementById("addGuestAdminBtn").onclick = async () => { const name = document.getElementById("guestNameAdmin").value.trim(), week = document.getElementById("guestWeekSelectAdmin").value; if(name && week) { await saveGuest({guestName:name, gameDate:week}); document.getElementById("guestNameAdmin").value=""; renderGuestListAdmin(); renderTeamAssignAdmin(); } };
        document.getElementById("saveResultAdminBtn").onclick = async () => { const week = document.getElementById("resultWeekSelectAdmin").value, y = parseInt(document.getElementById("resYellow").value)||0, o = parseInt(document.getElementById("resOrange").value)||0; if(!matchResults[week]) matchResults[week]={}; matchResults[week].yellowScore=y; matchResults[week].orangeScore=o; await saveResults(); alert("Result saved"); renderHistoryPanel(); };
        renderCashAdmin(); renderTeamAssignAdmin(); renderGuestListAdmin();
    }
    async function renderCashAdmin() {
        const week = document.getElementById("adminCashWeek").value;
        const attending = attendance.filter(a=>a.gameDate===week && a.status==='in').map(a=>a.player);
        const paidList = payments.filter(p=>p.gameDate===week).map(p=>p.player);
        let html = `<div>💰 Attending: ${attending.length} players ($5 each)</div>`;
        for(let p of attending){
            const isPaid = paidList.includes(p);
            html += `<div style="display:flex; justify-content:space-between; margin:8px 0;"><span>${escapeHtml(p)}</span><button class="cashBtn" data-player="${escapeHtml(p)}" style="background:${isPaid?'#2e7d32':'#cc0000'};">${isPaid?'✓ PAID':'COLLECT $5'}</button></div>`;
        }
        const totalCollected = payments.filter(p=>p.gameDate===week).length * 5;
        html += `<div class="count-box" style="margin-top:12px;">💵 This week: $${totalCollected} / $${attending.length * 5}</div>`;
        document.getElementById("cashList").innerHTML = html;
        document.getElementById("treasuryTotal").innerHTML = `🏦 TOTAL TREASURY: $${payments.reduce((a,b)=>a+5,0)}`;
        document.querySelectorAll(".cashBtn").forEach(btn=>btn.onclick=async()=>{ const player=btn.dataset.player; if(!payments.find(p=>p.player===player&&p.gameDate===week)){ await savePayment({player, gameDate:week, amount:5}); renderCashAdmin(); } });
    }
    async function renderTeamAssignAdmin() {
        const week = document.getElementById("adminTeamWeek").value;
        const attending = attendance.filter(a=>a.gameDate===week && a.status==='in').map(a=>a.player);
        const weeklyGuests = guests.filter(g=>g.gameDate===week).map(g=>g.guestName);
        const all = [...attending, ...weeklyGuests];
        if(!teamAssignments[week]) teamAssignments[week]={};
        let html = "";
        for(let p of all){
            const current = teamAssignments[week][p] || "";
            html += `<div style="display:flex; justify-content:space-between; margin:8px 0; background:rgba(0,0,0,0.3); border-radius:60px; padding:8px 16px;"><span>${escapeHtml(p)} ${weeklyGuests.includes(p)?'🎭':''}</span><select class="teamSelect" data-player="${escapeHtml(p)}"><option value="yellow" ${current==="yellow"?"selected":""}>🟡 YELLOW</option><option value="orange" ${current==="orange"?"selected":""}>🟠 ORANGE</option></select></div>`;
        }
        document.getElementById("teamAssignList").innerHTML = html || "<div>No attending players/guests</div>";
        document.querySelectorAll(".teamSelect").forEach(sel=>sel.addEventListener("change",()=>{ const player=sel.dataset.player; teamAssignments[week][player]=sel.value; }));
    }
    async function renderGuestListAdmin() {
        const week = document.getElementById("guestWeekSelectAdmin").value;
        const weeklyGuests = guests.filter(g=>g.gameDate===week);
        document.getElementById("guestListAdmin").innerHTML = `<div style="margin-top:12px;">🎟️ Guests this week: ${weeklyGuests.map(g=>escapeHtml(g.guestName)).join(', ') || 'none'}</div>`;
    }
    
    function escapeHtml(str) { return String(str).replace(/[&<>]/g, m => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;' }[m])); }
    
    (async () => {
        const stored = localStorage.getItem("soccer_user");
        if(stored) {
            try { const u = JSON.parse(stored); if(u.role==="admin"){ isAdminLoggedIn=true; currentUser={name:"admin",role:"admin"}; } else { currentUser={name:u.name,role:"player"}; } await loadData(); renderMainApp(); return; } catch(e){}
        }
        renderLoginScreen();
    })();
</script>
</body>
</html>
