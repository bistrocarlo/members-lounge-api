<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Monday Night Soccer</title>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <style>
        :root {
            --primary: #00f5ff;
            --yellow: #ffd700;
            --orange: #ff6b00;
            --dark: #0a0f1c;
            --card: #121a2e;
        }
        *{margin:0;padding:0;box-sizing:border-box;}
        body{background:var(--dark);font-family:'Inter',sans-serif;color:#e2e8f0;}
        .app{max-width:500px;margin:0 auto;min-height:100vh;background:var(--dark);box-shadow:0 0 40px rgba(0,245,255,0.15);}

        .header{background:linear-gradient(135deg,#1a2338,#0a0f1c);padding:20px;text-align:center;border-bottom:3px solid var(--primary);position:sticky;top:0;z-index:20;}
        .logo-icon{width:78px;height:78px;background:linear-gradient(135deg,var(--primary),#00aaff);border-radius:50%;display:inline-flex;align-items:center;justify-content:center;margin:0 auto 8px;box-shadow:0 0 30px rgba(0,245,255,0.7);animation:pulse-glow 2.5s infinite;}
        @keyframes pulse-glow{0%,100%{box-shadow:0 0 30px rgba(0,245,255,0.7);}50%{box-shadow:0 0 50px rgba(0,245,255,0.95);}}
        .header h1{font-size:24px;font-weight:900;letter-spacing:-1px;background:linear-gradient(90deg,#fff,var(--primary));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}

        .user-row{background:rgba(255,255,255,0.08);padding:6px 16px;border-radius:50px;display:inline-flex;align-items:center;gap:8px;font-size:13.5px;}

        .top-nav{background:#111827;padding:10px 8px;display:flex;justify-content:center;gap:6px;flex-wrap:wrap;position:sticky;top:78px;z-index:10;border-bottom:1px solid #1f2937;}
        .nav-module{background:#1f2937;color:#94a3b8;border:none;padding:10px 14px;border-radius:9999px;font-size:13px;font-weight:700;display:flex;align-items:center;gap:6px;transition:all 0.25s;}
        .nav-module.active{background:var(--primary);color:#0a0f1c;transform:scale(1.08);box-shadow:0 0 20px rgba(0,245,255,0.5);}

        .module-container{display:none;padding:16px;}
        .module-container.active-module{display:block;}

        .card{background:var(--card);border-radius:28px;padding:20px;margin-bottom:18px;border:1px solid #1e2937;box-shadow:0 15px 25px -10px rgba(0,0,0,0.4);}
        .card h2{font-size:19px;font-weight:800;margin-bottom:16px;color:var(--primary);border-left:4px solid var(--primary);padding-left:12px;}

        .attendance-card{background:linear-gradient(135deg,#00f5ff,#0099ff);color:#0a0f1c;border-radius:32px;padding:32px 24px;text-align:center;box-shadow:0 0 40px rgba(0,245,255,0.6);margin-bottom:24px;}
        .big-buttons{display:flex;gap:14px;margin:20px 0;}
        .btn-play-big,.btn-sit-big{flex:1;padding:18px;border-radius:60px;font-size:19px;font-weight:900;color:white;box-shadow:0 10px 0 rgba(0,0,0,0.3);transition:transform 0.1s;}
        .btn-play-big{background:#22c55e;}
        .btn-play-big:active{transform:translateY(4px);}
        .btn-sit-big{background:#ef4444;}

        .attendee-tag{display:inline-flex;align-items:center;gap:8px;background:#1e2937;padding:8px 14px;border-radius:50px;margin:4px 2px;border:1px solid #334155;}
        .playing-list,.guest-section{background:var(--card);border-radius:24px;padding:18px;margin-bottom:16px;}

        .toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:#22c55e;color:white;padding:14px 28px;border-radius:9999px;font-weight:700;box-shadow:0 10px 30px rgba(0,0,0,0.4);z-index:99999;animation:toastIn 0.4s;}
        @keyframes toastIn{from{transform:translate(-50%,100px);opacity:0;}to{transform:translateX(-50%);opacity:1;}}
    </style>
</head>
<body>
<div class="app" id="app"><div class="loading" style="padding:100px 20px;text-align:center;color:#64748b;"><i class="fas fa-futbol fa-spin" style="font-size:60px;"></i><br>Loading Monday Night Soccer...</div></div>

<script>
(function() {
    // ====================== PLAYER ROSTER ======================
    var DEFAULT_PLAYERS = ["Alex Rowe","Ali Mekawy","Carlo","Charlie","Chris Del Monaco","Chris M","Chris S","Danny","Dante","David","Dimitri","Enzo","Farid","Faros","Frank","George B","George T","Ivan","James Zoumis","James","Joe T","Joey","Kia","Leo","Manoli","Marco","Mario","Maurice","Nector","Paul","Perri","Peter","Ralph","Rocco","Stav","Stevan","Theo","Tony EH","Vasilis"].sort();

    // ====================== FIREBASE ======================
    var firebaseConfig = {
        apiKey: "AIzaSyCWlFqDJyENgrUOhiLXCjSEi4Mk_54SA1w",
        authDomain: "monday-night-soccer-hub.firebaseapp.com",
        projectId: "monday-night-soccer-hub",
        storageBucket: "monday-night-soccer-hub.firebasestorage.app",
        messagingSenderId: "634335208908",
        appId: "1:634335208908:web:dca705b65fc52de0606969"
    };
    var db = null, firebaseReady = false;
    try {
        firebase.initializeApp(firebaseConfig);
        db = firebase.firestore();
        firebaseReady = true;
    } catch(e) { console.warn("Firebase demo mode"); }

    // ====================== DATA ======================
    var players = DEFAULT_PLAYERS.slice();
    var playerProfiles = {};
    var teamAssignments = {};
    var matchResults = {};
    var attendance = [];
    var guests = [];
    var isAdminLoggedIn = false;
    var currentUser = null;
    var weeklyCaptain = "Carlo";
    var weatherData = { temp: "18°C", condition: "Clear", icon: "fa-sun", rainChance: 10 };
    var chatUnsubscribe = null;
    var currentAdminGameDate = null;

    // ====================== TIMER ======================
    var timerInterval = null, currentHalf = 1, timeLeft = 45 * 60;
    function formatTime(sec) { var m = Math.floor(sec/60); var s = sec % 60; return (m<10?'0'+m:m)+':'+(s<10?'0'+s:s); }
    function updateTimerDisplay() {
        var d = document.getElementById("timerDisplay"); if(d) d.textContent = formatTime(timeLeft);
        var hs = document.getElementById("currentHalf"); if(hs) hs.textContent = currentHalf===1 ? "FIRST HALF" : "SECOND HALF";
    }
    function playAlarm() { try { var a = new (window.AudioContext||window.webkitAudioContext)(); var o = a.createOscillator(); var g = a.createGain(); o.connect(g); g.connect(a.destination); o.frequency.value = 880; g.gain.value = 0.5; o.start(); g.gain.exponentialRampToValueAtTime(0.00001, a.currentTime+1.5); o.stop(a.currentTime+1.5); } catch(e){} }
    function timerTick() { if(timeLeft <= 0) { if(timerInterval) clearInterval(timerInterval); playAlarm(); if(currentHalf===1){currentHalf=2;timeLeft=45*60;}else{currentHalf=1;timeLeft=45*60;} updateTimerDisplay(); return; } timeLeft--; updateTimerDisplay(); }
    function startTimer() { if(timerInterval) clearInterval(timerInterval); timerInterval = setInterval(timerTick, 1000); }
    function pauseTimer() { if(timerInterval) { clearInterval(timerInterval); timerInterval = null; } }
    function resetTimer() { pauseTimer(); currentHalf=1; timeLeft=45*60; updateTimerDisplay(); }

    // ====================== DATE ======================
    function getAustralianTime() { var now = new Date(); var utc = now.getTime() + (now.getTimezoneOffset()*60000); return new Date(utc + (10*3600000)); }
    function getNextMondayGameDate() {
        var now = getAustralianTime();
        var day = now.getDay(), hour = now.getHours();
        var daysUntil = (1 - day + 7) % 7;
        if (day === 1 && hour >= 20) daysUntil = 7;
        var d = new Date(now); d.setDate(now.getDate() + daysUntil); d.setHours(0,0,0,0);
        return d;
    }
    var CURRENT_GAME_STR = getNextMondayGameDate().toISOString().split('T')[0];

    function getAllGameWeeks() {
        var weeks = [], current = getNextMondayGameDate();
        for(var i = -24; i <= 4; i++) {
            var d = new Date(current); d.setDate(current.getDate() + (i * 7));
            if(d >= new Date(2024,0,1)) weeks.push({ dateStr: d.toISOString().split('T')[0], label: 'Mon ' + d.toLocaleDateString('en-AU',{day:'numeric',month:'short',year:'numeric'}) });
        }
        return weeks.sort((a,b)=>a.dateStr.localeCompare(b.dateStr));
    }
    var ALL_WEEKS = getAllGameWeeks();
    currentAdminGameDate = CURRENT_GAME_STR;

    // ====================== PREMIUM HELPERS ======================
    function showToast(msg, color = "#22c55e") {
        var t = document.createElement('div'); t.className='toast'; t.style.background=color; t.textContent=msg;
        document.body.appendChild(t); setTimeout(()=>t.remove(), 2800);
    }
    function launchConfetti() {
        const canvas = document.createElement('canvas');
        canvas.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;z-index:99999;pointer-events:none;';
        document.body.appendChild(canvas);
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth; canvas.height = window.innerHeight;
        const colors = ['#00f5ff','#ffd700','#ff6b00','#22c55e','#a855f7'];
        let particles = [];
        class Particle {
            constructor() {
                this.x = Math.random()*canvas.width;
                this.y = Math.random()*canvas.height - canvas.height;
                this.size = Math.random()*14 + 8;
                this.speed = Math.random()*8 + 5;
                this.color = colors[Math.floor(Math.random()*colors.length)];
                this.angle = Math.random()*360;
                this.spin = Math.random()*0.3 - 0.15;
            }
            update(){ this.y += this.speed; this.angle += this.spin; this.speed += 0.08; }
            draw(){
                ctx.save(); ctx.translate(this.x,this.y); ctx.rotate(this.angle*Math.PI/180);
                ctx.fillStyle = this.color; ctx.fillRect(-this.size/2, -this.size/2, this.size, this.size*0.7); ctx.restore();
            }
        }
        for(let i=0;i<180;i++) particles.push(new Particle());
        let frame=0;
        function animate(){
            ctx.clearRect(0,0,canvas.width,canvas.height);
            for(let i=particles.length-1;i>=0;i--){
                particles[i].update(); particles[i].draw();
                if(particles[i].y > canvas.height) particles.splice(i,1);
            }
            if(particles.length>0 && frame<200){ requestAnimationFrame(animate); frame++; } else canvas.remove();
        }
        animate();
    }

    function getInitials(n){ return n.split(' ').map(x=>x[0]).join('').toUpperCase().substring(0,2); }
    function getAvatarColor(n){
        const c = ['#00f5ff','#ffd700','#ff6b00','#22c55e','#a855f7'];
        let h=0; for(let i=0;i<n.length;i++) h=((h<<5)-h)+n.charCodeAt(i);
        return c[Math.abs(h)%c.length];
    }
    function renderAvatar(n,s=52){
        return `<div style="width:${s}px;height:${s}px;border-radius:50%;background:${getAvatarColor(n)};display:flex;align-items:center;justify-content:center;color:#0a0f1c;font-weight:900;font-size:${s/2.3}px;border:3px solid #1e2937;box-shadow:0 0 15px rgba(0,245,255,0.4);">${getInitials(n)}</div>`;
    }
    function renderMiniAvatar(n,s=28){
        return `<div style="width:${s}px;height:${s}px;border-radius:50%;background:${getAvatarColor(n)};display:inline-flex;align-items:center;justify-content:center;color:#0a0f1c;font-weight:700;font-size:${s/2}px;border:2px solid #1e2937;">${getInitials(n)}</div>`;
    }

    // ====================== DATA FUNCTIONS ======================
    async function loadData() { if(!firebaseReady || !db) return; try { console.log("Data loaded"); } catch(e){} }
    async function saveAttendance(a){ /* your full logic here */ refreshAll(); }
    async function saveGuest(g){ /* your full logic */ refreshAll(); }
    async function removeGuest(name,date){ /* your logic */ refreshAll(); }
    async function saveTeamAssignments(date,assign){ teamAssignments[date] = assign; if(firebaseReady&&db) await db.collection("config").doc("teamAssignments").set(teamAssignments); refreshAll(); }
    async function saveMatchResult(date,y,o,g,a,i){ matchResults[date] = {yellowScore:y,orangeScore:o,goals:g||{},assists:a||{},injuries:i||[]}; if(firebaseReady&&db) await db.collection("config").doc("matchResults").set(matchResults); refreshAll(); }
    async function setAttendance(status){ if(!currentUser) return; await saveAttendance({player:currentUser.name,gameDate:CURRENT_GAME_STR,status}); showToast(status==='in'?"You're locked in! 🔥":"Noted"); }
    async function addGuest(name){ /* your logic */ refreshAll(); }

    function refreshAll() {
        renderHomePage(); renderTeamsPage(); renderHistoryPage(); renderProfilesPage(); renderScoreboardPage(); if(isAdminLoggedIn) renderAdminPage();
    }

    function getAllParticipants(gameDate){ return {players:[],guests:[]}; } // Replace with full logic from your original
    function getCurrentGameLabel(){ return 'Mon ' + getNextMondayGameDate().toLocaleDateString('en-AU',{day:'numeric',month:'long'}) + ', 8pm'; }

    // ====================== RENDER PAGES ======================
    function renderHomePage() {
        var c = document.getElementById("homeContainer"); if(!c) return;
        c.innerHTML = `
            <div class="attendance-card">
                <h2>${getCurrentGameLabel()}</h2>
                <div>Clifton Park, Brunswick • 8:00pm</div>
                <div class="big-buttons">
                    <button id="playBtn" class="btn-play-big">I'M PLAYING 🔥</button>
                    <button id="sitBtn" class="btn-sit-big">CAN'T PLAY</button>
                </div>
            </div>
            <div class="card"><h2>Playing Tonight</h2><div id="playingList" style="display:flex;flex-wrap:wrap;gap:8px;"></div></div>
        `;
        document.getElementById("playBtn").onclick = () => { setAttendance("in"); launchConfetti(); };
        document.getElementById("sitBtn").onclick = () => setAttendance("out");
    }

    function renderProfilesPage() { var c = document.getElementById("page-profiles"); if(c) c.innerHTML = '<div class="card"><h2>Player Profiles</h2><p>Premium profiles coming soon...</p></div>'; }
    function renderScoreboardPage() { var c = document.getElementById("page-scoreboard"); if(c) c.innerHTML = '<div class="card"><h2>All-Time Stats</h2><p>Leaderboard with neon highlights</p></div>'; }
    function renderTeamsPage() { var c = document.getElementById("page-teamswk"); if(c) c.innerHTML = '<div class="card"><h2>This Week Teams</h2><p>Yellow vs Orange with glowing badges</p></div>'; }
    function renderHistoryPage() { var c = document.getElementById("page-history"); if(c) c.innerHTML = '<div class="card"><h2>Match History</h2><p>Past results with confetti on wins</p></div>'; }
    function renderWeatherPage() { var c = document.getElementById("page-weather"); if(c) c.innerHTML = '<div class="card"><h2>Weather</h2><p>Premium forecast card</p></div>'; }
    function renderTimerPage() { var c = document.getElementById("page-timer"); if(c) c.innerHTML = '<div class="card"><h2>Match Timer</h2><div class="timer-display" id="timerDisplay">45:00</div><button onclick="startTimer()">Start</button></div>'; }
    function renderChatPage() { var c = document.getElementById("page-chat"); if(c) c.innerHTML = '<div class="card"><h2>Team Chat</h2><p>Live chat ready</p></div>'; }
    function renderRulesPage() { var c = document.getElementById("page-rules"); if(c) c.innerHTML = '<div class="card"><h2>Rules</h2><p>Full rules here</p></div>'; }
    function renderAdminPage() { var c = document.getElementById("page-admin"); if(c) c.innerHTML = '<div class="card"><h2>Admin Panel</h2><p>Full control panel</p></div>'; }

    function initNav() {
        var mods = [
            { id: "home", name: "🏠 HOME" }, { id: "profiles", name: "👤 PROFILES" },
            { id: "scoreboard", name: "🏆 STATS" }, { id: "teamswk", name: "⚽ THIS WEEK" },
            { id: "history", name: "📖 HISTORY" }, { id: "weather", name: "🌤️ WEATHER" },
            { id: "timer", name: "⏱️ TIMER" }, { id: "chat", name: "💬 CHAT" },
            { id: "rules", name: "📜 RULES" }
        ];
        if(isAdminLoggedIn) mods.push({ id: "admin", name: "⚙️ ADMIN" });
        var nav = document.getElementById("topNavBar");
        if(nav) nav.innerHTML = mods.map(m => `<button class="nav-module" data-module="${m.id}">${m.name}</button>`).join('');
        document.querySelectorAll(".nav-module").forEach(btn => {
            btn.onclick = () => {
                document.querySelectorAll(".module-container").forEach(m => m.classList.remove("active-module"));
                document.getElementById("module-"+btn.dataset.module).classList.add("active-module");
                document.querySelectorAll(".nav-module").forEach(b => b.classList.remove("active"));
                btn.classList.add("active");
            };
        });
        document.querySelector('.nav-module[data-module="home"]').click();
    }

    async function renderApp() {
        await loadData();
        var app = document.getElementById("app");
        app.innerHTML = `
            <div class="header">
                <div class="logo-icon"><i class="fas fa-futbol" style="font-size:38px;color:#0a0f1c;"></i></div>
                <h1>MONDAY NIGHT SOCCER</h1>
                <div class="user-row"><i class="fas fa-user"></i> <strong>${currentUser ? currentUser.name : "Player"}</strong> <button id="logoutBtn">Exit</button></div>
            </div>
            <div class="top-nav" id="topNavBar"></div>
            <div id="module-home" class="module-container active-module"><div id="homeContainer"></div></div>
            <div id="module-profiles" class="module-container"><div id="page-profiles"></div></div>
            <div id="module-scoreboard" class="module-container"><div id="page-scoreboard"></div></div>
            <div id="module-teamswk" class="module-container"><div id="page-teamswk"></div></div>
            <div id="module-history" class="module-container"><div id="page-history"></div></div>
            <div id="module-weather" class="module-container"><div id="page-weather"></div></div>
            <div id="module-timer" class="module-container"><div id="page-timer"></div></div>
            <div id="module-chat" class="module-container"><div id="page-chat"></div></div>
            <div id="module-rules" class="module-container"><div id="page-rules"></div></div>
            ${isAdminLoggedIn ? `<div id="module-admin" class="module-container"><div id="page-admin"></div></div>` : ''}
        `;
        document.getElementById("logoutBtn").onclick = () => location.reload();
        renderHomePage(); renderProfilesPage(); renderScoreboardPage(); renderTeamsPage();
        renderHistoryPage(); renderWeatherPage(); renderTimerPage(); renderChatPage(); renderRulesPage();
        if(isAdminLoggedIn) renderAdminPage();
        initNav();
    }

    // ====================== LOGIN ======================
    function renderLogin() {
        var app = document.getElementById("app");
        app.innerHTML = `<div style="padding:80px 20px;text-align:center;">
            <div class="logo-icon" style="margin:0 auto 30px"><i class="fas fa-futbol" style="font-size:48px;color:#0a0f1c"></i></div>
            <h2 style="font-size:28px">Monday Night Soccer</h2>
            <select id="playerSelectLogin" style="width:100%;padding:16px;border-radius:60px;background:#1e2937;color:white;border:none;margin:20px 0;font-size:17px;"></select>
            <button id="playerLoginBtn" style="width:100%;padding:16px;background:var(--primary);color:#0a0f1c;border:none;border-radius:60px;font-weight:800;font-size:18px;">ENTER AS PLAYER</button>
            <hr style="margin:30px 0;border-color:#334155">
            <input type="password" id="adminPwLogin" placeholder="Admin Password" style="width:100%;padding:16px;border-radius:60px;background:#1e2937;color:white;border:none;">
            <button id="adminLoginBtn" style="width:100%;padding:16px;background:#ef4444;color:white;border:none;border-radius:60px;margin-top:12px;">ADMIN LOGIN</button>
        </div>`;
        document.getElementById("playerLoginBtn").onclick = () => {
            var n = document.getElementById("playerSelectLogin").value;
            if(n) { currentUser = {name:n,role:"player"}; localStorage.setItem("soccer_user", JSON.stringify(currentUser)); renderApp(); }
        };
        document.getElementById("adminLoginBtn").onclick = () => {
            if(document.getElementById("adminPwLogin").value === "admin123") {
                currentUser = {name:"Admin",role:"admin"}; isAdminLoggedIn = true;
                localStorage.setItem("soccer_user", JSON.stringify(currentUser)); renderApp();
            }
        };
    }

    // ====================== START ======================
    var stored = localStorage.getItem("soccer_user");
    if(stored) {
        try {
            var u = JSON.parse(stored);
            currentUser = u; isAdminLoggedIn = u.role === "admin";
            renderApp();
        } catch(e){ renderLogin(); }
    } else renderLogin();
})();
</script>
</body>
</html>
