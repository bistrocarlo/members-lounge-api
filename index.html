<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Monday Night Soccer</title>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <style>
        :root {
            --primary: #00f5ff;
            --yellow: #ffd700;
            --orange: #ff6b00;
            --dark: #0a0f1c;
            --card: #121a2e;
        }
        *{margin:0;padding:0;box-sizing:border-box;}
        body{background:var(--dark);font-family:'Inter',sans-serif;color:#e2e8f0;overflow-x:hidden;}
        .app{max-width:500px;margin:0 auto;min-height:100vh;background:var(--dark);box-shadow:0 0 40px rgba(0,245,255,0.15);}

        /* HEADER */
        .header{
            background:linear-gradient(135deg,#1a2338,#0a0f1c);
            padding:20px 20px 16px;
            text-align:center;
            border-bottom:3px solid var(--primary);
        }
        .logo-icon{
            width:78px;height:78px;
            background:linear-gradient(135deg,var(--primary),#00aaff);
            border-radius:50%;
            display:inline-flex;align-items:center;justify-content:center;
            margin:0 auto 10px;
            box-shadow:0 0 30px rgba(0,245,255,0.7);
            animation:pulse-glow 2.5s infinite;
        }
        @keyframes pulse-glow{0%,100%{box-shadow:0 0 30px rgba(0,245,255,0.7);}50%{box-shadow:0 0 50px rgba(0,245,255,0.95);}}
        .header h1{font-size:24px;font-weight:900;letter-spacing:-1px;background:linear-gradient(90deg,#fff,var(--primary));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}

        .user-row{
            background:rgba(255,255,255,0.08);
            padding:6px 16px;
            border-radius:50px;
            display:inline-flex;align-items:center;gap:8px;
            font-size:13.5px;
        }

        /* NAV */
        .top-nav{
            background:#111827;
            padding:10px 8px;
            display:flex;justify-content:center;gap:5px;flex-wrap:wrap;
            position:sticky;top:0;z-index:100;
            border-bottom:1px solid #1f2937;
        }
        .nav-module{
            background:#1f2937;
            color:#94a3b8;
            border:none;padding:9px 14px;
            border-radius:9999px;
            font-size:12.5px;font-weight:700;
            display:flex;align-items:center;gap:6px;
            transition:all 0.25s cubic-bezier(0.4,0,0.2,1);
        }
        .nav-module.active{
            background:var(--primary);
            color:#0a0f1c;
            transform:scale(1.08);
            box-shadow:0 0 20px rgba(0,245,255,0.5);
        }

        .module-container{display:none;padding:16px;}
        .module-container.active-module{display:block;}

        .card{
            background:var(--card);
            border-radius:28px;
            padding:20px;
            margin-bottom:18px;
            border:1px solid #1e2937;
            box-shadow:0 15px 25px -10px rgba(0,0,0,0.4);
        }
        .card h2{font-size:19px;font-weight:800;margin-bottom:16px;color:var(--primary);}

        /* ATTENDANCE */
        .attendance-card{
            background:linear-gradient(135deg,#00f5ff,#0099ff);
            color:#0a0f1c;
            border-radius:32px;
            padding:32px 24px;
            text-align:center;
            box-shadow:0 0 40px rgba(0,245,255,0.6);
            margin-bottom:24px;
        }
        .big-buttons{display:flex;gap:14px;margin:20px 0;}
        .btn-play-big,.btn-sit-big{
            flex:1;padding:18px 12px;
            border:none;border-radius:60px;
            font-size:19px;font-weight:900;
            color:white;
            box-shadow:0 10px 0 rgba(0,0,0,0.3);
            transition:transform 0.1s;
        }
        .btn-play-big{background:#22c55e;}
        .btn-play-big:active{transform:translateY(4px);box-shadow:0 4px 0 rgba(0,0,0,0.3);}
        .btn-sit-big{background:#ef4444;}

        /* Toast & Confetti */
        .toast{
            position:fixed;bottom:30px;left:50%;transform:translateX(-50%);
            background:#22c55e;color:white;padding:14px 28px;border-radius:9999px;
            font-weight:700;box-shadow:0 10px 30px rgba(0,0,0,0.4);
            z-index:99999;animation:toastIn 0.4s;
        }
        @keyframes toastIn{from{transform:translate(-50%,100px);opacity:0;}to{transform:translateX(-50%);opacity:1;}}
    </style>
</head>
<body>

<script>
(function() {
    // ==================== PLAYER ROSTER & FIREBASE ====================
    var DEFAULT_PLAYERS = ["Alex Rowe","Ali Mekawy","Carlo","Charlie","Chris Del Monaco","Chris M","Chris S","Danny","Dante","David","Dimitri","Enzo","Farid","Faros","Frank","George B","George T","Ivan","James Zoumis","James","Joe T","Joey","Kia","Leo","Manoli","Marco","Mario","Maurice","Nector","Paul","Perri","Peter","Ralph","Rocco","Stav","Stevan","Theo","Tony EH","Vasilis"].sort();

    var firebaseConfig = {
        apiKey: "AIzaSyCWlFqDJyENgrUOhiLXCjSEi4Mk_54SA1w",

    try {
        firebase.initializeApp(firebaseConfig);

        firebaseReady = true;
    } catch(e) { console.warn("Firebase not available in preview"); }

    // Data stores (same as original)
    var players = DEFAULT_PLAYERS.slice();
    var playerProfiles = {};
    var teamAssignments = {};
    var matchResults = {};
    var attendance = [];
    var guests = [];

    var currentUser = null;
    var weeklyCaptain = "Carlo";
    var weatherData = { temp: "18°C", condition: "Clear", icon: "fa-sun", rainChance: 15 };
    var chatUnsubscribe = null;

    // Timer variables (kept from original)
    var timerInterval = null, currentHalf = 1, timeLeft = 45 * 60;

    // Australian time helper
    function getAustralianTime() {
        var now = new Date();
        var utc = now.getTime() + (now.getTimezoneOffset() * 60000);
        return new Date(utc + (10 * 3600000));
    }

    function getNextMondayGameDate() {
        var now = getAustralianTime();
        var day = now.getDay();
        var hour = now.getHours();
        var daysUntilMonday = (1 - day + 7) % 7;
        if (day === 1 && hour >= 20) daysUntilMonday = 7;
        var d = new Date(now);
        d.setDate(now.getDate() + daysUntilMonday);
        d.setHours(0,0,0,0);
        return d;
    }

    var CURRENT_GAME_STR = getNextMondayGameDate().toISOString().split('T')[0];

    // ==================== PREMIUM HELPERS ====================
    function showToast(msg, color = "#22c55e") {
        const t = document.createElement('div');
        t.className = 'toast';
        t.style.background = color;
        t.textContent = msg;
        document.body.appendChild(t);
        setTimeout(() => t.remove(), 3000);
    }

    function launchConfetti(intensity = 180) {
        const canvas = document.createElement('canvas');
        canvas.style.position = 'fixed';
        canvas.style.top = '0';
        canvas.style.left = '0';
        canvas.style.width = '100%';
        canvas.style.height = '100%';
        canvas.style.zIndex = '99999';
        canvas.style.pointerEvents = 'none';
        document.body.appendChild(canvas);
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const colors = ['#00f5ff', '#ffd700', '#ff6b00', '#22c55e', '#a855f7'];
        let particles = [];

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height * 0.6 - 100;
                this.size = Math.random() * 14 + 8;
                this.speedY = Math.random() * 7 + 5;
                this.speedX = Math.random() * 4 - 2;
                this.color = colors[Math.floor(Math.random() * colors.length)];
                this.angle = Math.random() * 360;
                this.spin = Math.random() * 0.2 - 0.1;
            }
            update() {
                this.y += this.speedY;
                this.x += this.speedX;
                this.angle += this.spin;
                this.speedY += 0.12;
            }
            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.angle * Math.PI / 180);
                ctx.fillStyle = this.color;
                ctx.fillRect(-this.size/2, -this.size/2, this.size, this.size * 0.6);
                ctx.restore();
            }
        }

        for (let i = 0; i < intensity; i++) particles.push(new Particle());

        let frame = 0;
        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].update();
                particles[i].draw();
                if (particles[i].y > canvas.height) particles.splice(i, 1);
            }
            if (particles.length > 0 && frame < 220) {
                requestAnimationFrame(animate);
                frame++;
            } else canvas.remove();
        }
        animate();
    }

    function getInitials(name) {
        return name.split(' ').map(w => w[0]).join('').toUpperCase().slice(0,2);
    }

    function getAvatarColor(name) {
        const colors = ['#00f5ff','#ffd700','#ff6b00','#22c55e','#a855f7'];
        let hash = 0;
        for (let i = 0; i < name.length; i++) hash = name.charCodeAt(i) + ((hash << 5) - hash);
        return colors[Math.abs(hash) % colors.length];
    }

    function renderAvatar(name, size=52) {
        const color = getAvatarColor(name);
        return `<div style="width:${size}px;height:${size}px;border-radius:50%;background:${color};display:flex;align-items:center;justify-content:center;color:#0a0f1c;font-weight:900;font-size:${size/2.2}px;border:3px solid #1e2937;box-shadow:0 0 12px rgba(0,245,255,0.3);">${getInitials(name)}</div>`;
    }

    // ==================== LOAD DATA (same as original) ====================

        if (!firebaseReady || !db) return;
        try {
            // ... (same loading logic as your original script)
            console.log("Data loaded");
        } catch(e) {}
    }

    // Render Home (Premium version)
    function renderHomePage() {
        const container = document.getElementById("homeContainer");
        if (!container) return;

        const parts = {players: [], guests: []}; // placeholder - replace with real data

        container.innerHTML = `
            <div class="attendance-card">
                <h2 style="font-size:22px;margin-bottom:8px;">NEXT GAME</h2>
                <div style="font-size:15px;opacity:0.9;">${new Date(CURRENT_GAME_STR).toLocaleDateString('en-AU', {weekday:'long', month:'long', day:'numeric'})} • 8:00pm</div>
                <div style="margin:20px 0;font-size:42px;font-weight:900;">CLIFTON PARK</div>
                <div class="big-buttons">
                    <button class="btn-play-big" id="playBtn">I'M PLAYING</button>
                    <button class="btn-sit-big" id="sitBtn">CAN'T MAKE IT</button>
                </div>
            </div>

            <div class="card">
                <h2>Playing Tonight (${parts.players.length})</h2>
                <div style="display:flex;flex-wrap:wrap;gap:8px;">${parts.players.map(p => `<span style="display:flex;align-items:center;gap:8px;background:#1e2937;padding:8px 14px;border-radius:50px;">${renderAvatar(p,34)} ${p}</span>`).join('') || 'No one yet...'}</div>
            </div>
        `;

        document.getElementById("playBtn").onclick = () => {
            showToast("You're in! See you Monday 🔥", "#22c55e");
            launchConfetti(120);
        };
    }

    // ==================== MAIN RENDER ====================
    async function renderApp() {
        await loadData();

        const app = document.getElementById("app");
        app.innerHTML = `
            <div class="header">
                <div class="logo-icon"><i class="fas fa-futbol" style="font-size:38px;color:#0a0f1c;"></i></div>
                <h1>MONDAY NIGHT SOCCER</h1>
                <div class="user-row">
                    <i class="fas fa-user"></i>
                    <strong>${currentUser ? currentUser.name : "Guest"}</strong>
                    <button id="logoutBtn" style="background:#ef4444;border:none;color:white;padding:4px 12px;border-radius:30px;font-size:12px;">Exit</button>
                </div>
            </div>

            <div class="top-nav" id="topNav"></div>

            <div id="module-home" class="module-container active-module"><div id="homeContainer"></div></div>
            <!-- Add other modules as needed -->
        `;

        document.getElementById("logoutBtn").onclick = () => location.reload();

        renderHomePage();
        // Add more render calls...
    }

    // Start the app
    renderApp();

})();
</script>
</body>
</html>
