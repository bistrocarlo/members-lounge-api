        * { margin: 0; padding: 0; box-sizing: border-box; }

        .container { max-width: 1600px; margin: 0 auto; }
        
        .header {
            background: linear-gradient(135deg, #c9a84c, #e8d5a8);
            border-radius: 24px;
            padding: 25px 30px;
            margin-bottom: 25px;
            text-align: center;
        }
        
        .header h1 { font-size: 1.8rem; color: #2c2418; }
        .header p { color: #5a4a35; margin-top: 8px; }
        
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }
        
        .tab {
            background: #e8dcc8;
            border: none;
            padding: 12px 28px;
            border-radius: 40px;
            cursor: pointer;
            font-family: inherit;
            font-size: 1rem;
            font-weight: 600;
            transition: all 0.2s;
        }
        
        .tab.active {
            background: #c9a84c;
            color: white;
        }
        
        .panel {
            display: none;
            background: white;
            border-radius: 24px;
            padding: 25px;
            border: 1px solid #e8dcc8;
        }
        
        .panel.active { display: block; }
        
        .stats-bar {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }
        
        .stat {
            background: #faf5ea;
            border-radius: 16px;
            padding: 12px 20px;
            flex: 1;
            text-align: center;
        }
        
        .stat-number {
            font-size: 1.8rem;
            font-weight: bold;
            color: #c9a84c;
        }
        
        .toolbar {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        
        .btn {
            background: #c9a84c;
            border: none;
            padding: 10px 20px;
            border-radius: 30px;
            cursor: pointer;
            font-family: inherit;
            font-weight: 600;
            transition: all 0.2s;
        }
        
        .btn:hover { background: #b8953a; transform: translateY(-1px); }
        .btn-primary { background: #27ae60; color: white; }
        .btn-email { background: #3498db; color: white; }
        .btn-csv { background: #2c3e50; color: white; }
        .btn-excel { background: #1e8449; color: white; }
        .btn-pdf { background: #e74c3c; color: white; }
        .btn-warning { background: #e67e22; color: white; }
        
        .search-box {
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        
        .search-input {
            flex: 1;
            padding: 12px 18px;
            border-radius: 40px;
            border: 1px solid #e8dcc8;
            font-family: inherit;
            font-size: 0.9rem;
        }
        
        .tables-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        
        .table-card {
            background: white;
            border-radius: 16px;
            border: 2px solid #e8dcc8;
            overflow: hidden;
            transition: all 0.2s;
        }
        
        .table-card.bridal {
            border-color: #c9a84c;
            background: #fffcf5;
        }
        
        .table-card.featured {
            border-color: #27ae60;
        }
        
        .table-header {
            background: #faf5ea;
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
            cursor: pointer;
        }
        
        .table-header.bridal { background: #fef5e0; }
        
        .table-title {
            font-size: 1.1rem;
        }
        
        .table-count {
            background: #c9a84c;
            color: white;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.8rem;
        }
        
        .table-guests {
            padding: 12px;
            min-height: 150px;
            max-height: 250px;
            overflow-y: auto;
        }
        
        .guest-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 10px;
            margin: 4px 0;
            background: #fefcf8;
            border-radius: 10px;
            border: 1px solid #f0e6d8;
            font-size: 0.8rem;
        }
        
        .guest-item:hover {
            background: #faf5ea;
        }
        
        .guest-name {
            flex: 1;
        }
        
        .guest-count {
            background: #e8dcc8;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 0.7rem;
            margin-left: 8px;
        }
        
        .remove-guest {
            color: #e74c3c;
            cursor: pointer;
            margin-left: 10px;
            font-weight: bold;
        }
        
        .unassigned-list {
            background: #fef9e7;
            border-radius: 16px;
            padding: 15px;
            margin-top: 20px;
        }
        
        .unassigned-item {
            display: inline-block;
            background: white;
            padding: 6px 12px;
            margin: 4px;
            border-radius: 20px;
            font-size: 0.75rem;
            border: 1px solid #e8dcc8;
            cursor: pointer;
        }
        
        .unassigned-item:hover {
            background: #c9a84c;
            color: white;
        }
        
        .table-select {
            padding: 4px 8px;
            margin-left: 10px;
            border-radius: 8px;
            border: 1px solid #e8dcc8;
            font-size: 0.7rem;
        }
        
        .report-options {
            background: #f0f4f8;
            padding: 20px;
            border-radius: 16px;
            margin-bottom: 20px;
        }
        
        .report-buttons {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            margin-top: 15px;
        }
        
        .guest-table-container {
            overflow-x: auto;
            max-height: 500px;
            overflow-y: auto;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
        }
        
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #e8dcc8;
        }
        
        th {
            background: #faf5ea;
            font-weight: 600;
            position: sticky;
            top: 0;
        }
        
        .email-checkbox {
            width: 20px;
            height: 20px;
            cursor: pointer;
        }
        
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #2c2418;
            color: white;
            padding: 10px 24px;
            border-radius: 40px;
            z-index: 1000;
            animation: fadeOut 3s forwards;
        }
        
        @keyframes fadeOut {
            0% { opacity: 1; }
            70% { opacity: 1; }
            100% { opacity: 0; visibility: hidden; }
        }
        
        .note-badge {
            background: #fef9e7;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 0.7rem;
            color: #b7950b;
        }

    let guests = guestsData.map((guest, index) => ({
        id: index,
        ...guest,
        emailed: false
    }));

    // Group guests by table
    function getTables() {
        const tables = new Map();
        
        guests.forEach(guest => {
            if (guest.tableAllocation && guest.tableAllocation !== null) {
                if (!tables.has(guest.tableAllocation)) {
                    tables.set(guest.tableAllocation, {
                        id: guest.tableAllocation,
                        name: guest.tableAllocation === 1 ? "👰 Bridal Table" : `Table ${guest.tableAllocation}`,
                        guests: [],
                        isBridal: guest.tableAllocation === 1
                    });
                }
                tables.get(guest.tableAllocation).guests.push(guest);
            }
        });
        
        // Sort by table number
        return new Map([...tables.entries()].sort((a, b) => a[0] - b[0]));
    }

    function getUnassignedGuests() {
        return guests.filter(g => !g.tableAllocation || g.tableAllocation === null);
    }

    function getTotalGuestCount() {
        return guests.reduce((sum, g) => sum + g.guestCount, 0);
    }

    function getSeatedCount() {
        return guests.filter(g => g.tableAllocation && g.tableAllocation !== null).reduce((sum, g) => sum + g.guestCount, 0);
    }

    function getEmailedCount() {
        return guests.filter(g => g.emailed).length;
    }

    function toggleEmail(guestId) {
        const guest = guests.find(g => g.id === guestId);
        if (guest) {
            guest.emailed = !guest.emailed;
            renderApp();
            showToast(`${guest.emailed ? "Marked as emailed" : "Marked as pending"}: ${guest.name}`);
        }
    }

    function moveGuestToTable(guestId, tableNum) {
        const guest = guests.find(g => g.id === guestId);
        if (guest) {
            guest.tableAllocation = tableNum;
            renderApp();
            showToast(`${guest.name} moved to Table ${tableNum}`);
        }
    }

    function removeFromTable(guestId) {
        const guest = guests.find(g => g.id === guestId);
        if (guest) {
            guest.tableAllocation = null;
            renderApp();
            showToast(`${guest.name} removed from table`);
        }
    }

    function sendBulkEmails() {
        const pending = guests.filter(g => !g.emailed && g.tableAllocation);
        if (pending.length === 0) {
            showToast("🎉 All seated guests have been emailed!");
            return;
        }

        const toEmail = pending.slice(0, 10);
        for (const guest of toEmail) {
            const tableName = guest.tableAllocation === 1 ? "Bridal Table" : `Table ${guest.tableAllocation}`;
            const subject = encodeURIComponent("Daniel & Laura's Wedding - Your Table Number");
            const body = encodeURIComponent(`Dear ${guest.name.split(' & ')[0]},

We are so excited to celebrate our wedding day with you!

📋 Your table number is: **${tableName}**

📍 Venue: [Your Venue Name]
🕕 Time: [Time]
📅 Date: [Date]

We can't wait to see you there!

With love,
Daniel & Laura 💒`);

            const email = prompt(`Enter email address for ${guest.name}:`, `${guest.name.replace(/\s/g, '.').toLowerCase()}@example.com`);
            if (email) {
                window.open(`mailto:${email}?subject=${subject}&body=${body}`);
                guest.emailed = true;
            }
        }
        renderApp();
        showToast(`📧 Opened emails for ${toEmail.length} guest(s)`);
    }

            ["Table", "Guest Name", "Verified Names", "Address", "Phone", "Notes", "Group", "Guest Count", "Emailed"],
            ...guests.filter(g => g.tableAllocation).sort((a,b) => (a.tableAllocation || 999) - (b.tableAllocation || 999)).map(g => [

                g.name,
                g.verified || "",
                g.address || "",

                g.notes || "",
                g.group,
                g.guestCount,
                g.emailed ? "Yes" : "No"
            ]),
            ["", "=== UNABLE TO ATTEND ===", "", "", "", "", "", "", ""],
            ...guests.filter(g => !g.tableAllocation).map(g => [
                "UNASSIGNED",
                g.name,
                g.verified || "",
                g.address || "",
                g.phone || "",
                g.notes || "",
                g.group,
                g.guestCount,
                g.emailed ? "Yes" : "No"
            ])
        ];
        
        const ws = XLSX.utils.aoa_to_sheet(worksheetData);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "Wedding Seating");
        ws['!cols'] = [{wch:10},{wch:30},{wch:30},{wch:35},{wch:15},{wch:25},{wch:15},{wch:12},{wch:10}];

    function showToast(msg) {
        let toast = document.querySelector('.toast');
        if (toast) toast.remove();
        toast = document.createElement('div');
        toast.className = 'toast';
        toast.textContent = msg;
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 3000);
    }

    function escapeHtml(str) {
        if (!str) return "";
        return str.replace(/[&<>]/g, m => m === "&" ? "&amp;" : m === "<" ? "&lt;" : "&gt;");
    }

    function renderTables() {
        const tables = getTables();
        const unassigned = getUnassignedGuests();
        
        let tablesHtml = '<div class="tables-grid">';
        
        for (const [tableNum, table] of tables) {
            const totalAtTable = table.guests.reduce((sum, g) => sum + g.guestCount, 0);
            tablesHtml += `
                <div class="table-card ${table.isBridal ? 'bridal' : ''}">
                    <div class="table-header ${table.isBridal ? 'bridal' : ''}">
                        <span class="table-title">${table.name}</span>
                        <span class="table-count">${totalAtTable} guests</span>
                    </div>
                    <div class="table-guests">
                        ${table.guests.map(guest => `
                            <div class="guest-item">
                                <span class="guest-name">
                                    ${escapeHtml(guest.name)}
                                    <span class="guest-count">+${guest.guestCount}</span>
                                    ${guest.verified ? `<br><small style="color:#999;">${escapeHtml(guest.verified)}</small>` : ''}
                                    ${guest.notes ? `<br><small style="color:#b7950b;">📝 ${escapeHtml(guest.notes)}</small>` : ''}
                                </span>
                                <span class="remove-guest" onclick="removeFromTable(${guest.id})" title="Remove from table">✖</span>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }
        tablesHtml += '</div>';
        
        const unassignedHtml = unassigned.length > 0 ? `
            <div class="unassigned-list">
                <h3>📋 Unable to Attend / Pending (${unassigned.length} groups)</h3>
                <div>
                    ${unassigned.map(guest => `
                        <span class="unassigned-item" title="${escapeHtml(guest.notes || 'No response yet')}">
                            ${escapeHtml(guest.name)} (${guest.guestCount})
                            ${guest.notes ? ` 📝` : ''}
                        </span>
                    `).join('')}
                </div>
                <p style="margin-top:10px; font-size:0.7rem; color:#b7950b;">💡 These guests have indicated they may not attend</p>
            </div>
        ` : '';
        
        return tablesHtml + unassignedHtml;
    }

                                <td>${guest.tableAllocation ? (guest.tableAllocation === 1 ? "Bridal" : guest.tableAllocation) : "—"}</td>
                                <td><strong>${escapeHtml(guest.name)}</strong></td>
                                <td>${escapeHtml(guest.verified || "-")}</td>
                                <td>${guest.phone ? `<a href="tel:${guest.phone}">${guest.phone}</a>` : "-"}</td>
                                <td><span class="note-badge">${guest.group}</span></td>
                                <td style="text-align:center">${guest.guestCount}</td>
                                <td style="text-align:center">
                                    <input type="checkbox" class="email-checkbox" ${guest.emailed ? "checked" : ""} onchange="toggleEmail(${guest.id})">
                                </td>
                                <td style="font-size:0.75rem; color:#b7950b">${escapeHtml(guest.notes || "-")}</td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            </div>
        `;
    }

    function updateSearch() {
        searchTerm = document.getElementById('searchInput').value;
        renderApp();
    }

    function clearSearch() {
        searchTerm = "";
        renderApp();
    }

    function setTab(tab) {
        currentTab = tab;
        renderApp();
    }

    function renderApp() {
        const app = document.getElementById('app');
        
        app.innerHTML = `
            <div class="container">
                <div class="header">
                    <h1>💍 Daniel & Laura's Wedding Manager 💒</h1>
                    <p>${guests.length} groups | ${getTotalGuestCount()} total guests | ${getSeatedCount()} seated across ${getTables().size} tables</p>
                </div>
                
                <div class="tabs">
                    <button class="tab ${currentTab === 'tables' ? 'active' : ''}" onclick="setTab('tables')">🪑 Table Plan (${getTables().size} Tables)</button>
                    <button class="tab ${currentTab === 'guestlist' ? 'active' : ''}" onclick="setTab('guestlist')">📋 Full Guest List</button>
                </div>
                
                <div class="panel active">
                    <div class="toolbar">
                        <button class="btn btn-email" onclick="sendBulkEmails()">📧 Email All Seated Guests</button>
                        <button class="btn btn-excel" onclick="exportToExcel()">📊 Export Excel</button>
                        <button class="btn btn-pdf" onclick="exportToPDF()">📄 Export PDF</button>
                        <button class="btn btn-warning" onclick="if(confirm('Reset all email status?')) { guests.forEach(g => g.emailed = false); renderApp(); showToast('Email status reset'); }">⟳ Reset Email Status</button>
                    </div>
                    
                    ${currentTab === 'tables' ? renderTables() : renderGuestListView()}
                </div>
            </div>
        `;
    }

    // Make functions global
    window.toggleEmail = toggleEmail;
    window.sendBulkEmails = sendBulkEmails;
    window.exportToExcel = exportToExcel;
    window.exportToPDF = exportToPDF;
    window.updateSearch = updateSearch;
    window.clearSearch = clearSearch;
    window.setTab = setTab;
    window.removeFromTable = removeFromTable;
    window.moveGuestToTable = moveGuestToTable;

    renderApp();
</script>
</body>
</html>
