        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Georgia', serif; background: #faf8f3; padding: 20px; }
        .container { max-width: 1400px; margin: 0 auto; }
        
        .header {
            background: linear-gradient(135deg, #c9a84c, #e8d5a8);
            border-radius: 24px;
            padding: 25px 30px;
            margin-bottom: 25px;
            text-align: center;
        }
        
        .header h1 { font-size: 1.8rem; color: #2c2418; }
        .header p { color: #5a4a35; margin-top: 8px; }
        
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }
        
        .tab {
            background: #e8dcc8;
            border: none;
            padding: 12px 28px;
            border-radius: 40px;
            cursor: pointer;
            font-family: inherit;
            font-size: 1rem;
            font-weight: 600;
            transition: all 0.2s;
        }
        
        .tab.active {
            background: #c9a84c;
            color: white;
        }
        
        .panel {
            display: none;
            background: white;
            border-radius: 24px;
            padding: 25px;
            border: 1px solid #e8dcc8;
        }
        
        .panel.active { display: block; }
        
        .stats-bar {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }
        
        .stat {
            background: #faf5ea;
            border-radius: 16px;
            padding: 12px 20px;
            flex: 1;
            text-align: center;
        }
        
        .stat-number {
            font-size: 1.8rem;
            font-weight: bold;
            color: #c9a84c;
        }
        
        .toolbar {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        
        .btn {
            background: #c9a84c;
            border: none;
            padding: 10px 20px;
            border-radius: 30px;
            cursor: pointer;
            font-family: inherit;
            font-weight: 600;
            transition: all 0.2s;
        }
        
        .btn:hover { background: #b8953a; transform: translateY(-1px); }
        .btn-excel { background: #1e8449; color: white; }
        .btn-pdf { background: #e74c3c; color: white; }
        .btn-csv { background: #3498db; color: white; }
        
        .mailing-grid {
            display: flex;
            flex-direction: column;
            gap: 30px;
        }
        
        .table-section {
            border: 2px solid #e8dcc8;
            border-radius: 16px;
            overflow: hidden;
            page-break-inside: avoid;
        }
        
        .table-section.bridal {
            border-color: #c9a84c;
            background: #fffcf5;
        }
        
        .section-header {
            background: #faf5ea;
            padding: 15px 20px;
            font-size: 1.3rem;
            font-weight: bold;
            border-bottom: 1px solid #e8dcc8;
        }
        
        .section-header.bridal {
            background: #fef5e0;
            color: #c9a84c;
        }
        
        .address-row {
            display: flex;
            padding: 15px 20px;
            border-bottom: 1px solid #f0e6d8;
            align-items: flex-start;
        }
        
        .address-row:last-child {
            border-bottom: none;
        }
        
        .guest-name-col {
            width: 280px;
            font-weight: bold;
            font-size: 1rem;
        }
        
        .guest-verified-col {
            width: 200px;
            font-size: 0.85rem;
            color: #666;
        }
        
        .guest-address-col {
            flex: 1;
            font-size: 0.9rem;
            font-family: 'Courier New', monospace;
            line-height: 1.4;
        }
        
        .guest-count-badge {
            background: #c9a84c;
            color: white;
            padding: 2px 8px;
            border-radius: 20px;
            font-size: 0.7rem;
            margin-left: 10px;
        }
        
        .address-missing {
            color: #e74c3c;
            font-style: italic;
        }
        
        @media print {
            body { background: white; padding: 0; margin: 0; }
            .tabs, .toolbar, .stats-bar, .btn, .no-print { display: none; }
            .panel { display: block !important; }
            .table-section { page-break-inside: avoid; }
            .address-row { page-break-inside: avoid; }
        }
        
        @media (max-width: 900px) {
            .address-row { flex-direction: column; gap: 8px; }
            .guest-name-col { width: 100%; }
            .guest-verified-col { width: 100%; }
        }
    </style>

    // Add IDs
    let guests = guestsData.map((guest, index) => ({ id: index, ...guest }));
    
    // Group by table in correct order
    function getTablesInOrder() {
        const tables = new Map();
        
        guests.forEach(guest => {
            const tableKey = guest.tableAllocation === "Bridal" ? "Bridal" : guest.tableAllocation;
            if (!tables.has(tableKey)) {
                tables.set(tableKey, {
                    name: tableKey === "Bridal" ? "👰 BRIDAL TABLE" : `TABLE ${tableKey}`,
                    guests: [],
                    order: tableKey === "Bridal" ? -1 : tableKey
                });
            }
            tables.get(tableKey).guests.push(guest);
        });
        
        // Sort: Bridal first (-1), then 1,2,3...32
        return new Map([...tables.entries()].sort((a, b) => {
            if (a[1].order === -1) return -1;
            if (b[1].order === -1) return 1;
            return a[1].order - b[1].order;
        }));
    }
    
    function getTotalGuestCount() {
        return guests.reduce((sum, g) => sum + g.guestCount, 0);
    }
    
    function getTotalGroups() {
        return guests.length;
    }
    
    function escapeHtml(str) {
        if (!str) return "";
        return str.replace(/[&<>]/g, m => m === "&" ? "&amp;" : m === "<" ? "&lt;" : "&gt;");
    }
    
    // ==================== EXPORT FUNCTIONS ====================
    
    function exportToExcel() {
        try {
            const tables = getTablesInOrder();
            const excelData = [];
            
            excelData.push(["WEDDING MAILING LIST - DANIEL & LAURA"]);
            excelData.push(["Generated:", new Date().toLocaleString()]);
            excelData.push(["Total Groups:", getTotalGroups()]);
            excelData.push(["Total Guests:", getTotalGuestCount()]);
            excelData.push([]);
            excelData.push(["TABLE", "GUEST NAME", "VERIFIED NAMES / FAMILY MEMBERS", "FULL POSTAL ADDRESS", "NOTES", "GUEST COUNT"]);
            
            for (const [tableName, table] of tables) {
                for (const guest of table.guests) {
                    excelData.push([
                        tableName,
                        guest.name,
                        guest.verified || "",
                        guest.addressFull || "⚠️ NO ADDRESS PROVIDED",
                        guest.notes || "",
                        guest.guestCount
                    ]);
                }
            }
            
            const ws = XLSX.utils.aoa_to_sheet(excelData);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Mailing List");
            ws['!cols'] = [{wch:15},{wch:40},{wch:40},{wch:55},{wch:30},{wch:12}];
            
            XLSX.writeFile(wb, `wedding_mailing_list_${new Date().toISOString().slice(0,10)}.xlsx`);
            showToast("✓ Excel file downloaded!");
        } catch (err) {
            showToast("Excel export failed: " + err.message);
        }
    }
    
    function exportToCSV() {
        try {
            const tables = getTablesInOrder();
            const csvRows = [];
            
            csvRows.push(["Table", "Guest Name", "Verified Names", "Postal Address", "Notes", "Guest Count"]);
            
            for (const [tableName, table] of tables) {
                for (const guest of table.guests) {
                    csvRows.push([
                        tableName,
                        guest.name,
                        guest.verified || "",
                        guest.addressFull || "NO ADDRESS",
                        guest.notes || "",
                        guest.guestCount
                    ]);
                }
            }
            
            const csvContent = csvRows.map(row => 
                row.map(cell => `"${String(cell).replace(/"/g, '""')}"`).join(',')
            ).join('\n');
            
            const blob = new Blob(["\uFEFF" + csvContent], { type: "text/csv;charset=utf-8;" });
            const link = document.createElement("a");
            const url = URL.createObjectURL(blob);
            link.href = url;
            link.setAttribute("download", `wedding_mailing_list_${new Date().toISOString().slice(0,10)}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
            showToast("✓ CSV file downloaded!");
        } catch (err) {
            showToast("CSV export failed: " + err.message);
        }
    }

    function showToast(msg) {
        let toast = document.querySelector('.toast');
        if (toast) toast.remove();
        toast = document.createElement('div');
        toast.className = 'toast';
        toast.textContent = msg;
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 3000);
    }

            <div class="mailing-grid">
