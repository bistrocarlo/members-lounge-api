    function escapeHtml(s){ if(!s) return ''; return s.replace(/[&<>]/g, m=> m==='&'?'&amp;': m==='<'?'&lt;':'&gt;'); }
    function escapeCsv(s){ if(!s) return ''; if(s.includes(',')||s.includes('"')||s.includes('\n')) return '"'+s.replace(/"/g,'""')+'"'; return s; }
    
    function exportToCSV(){ const rows=[['Table Name','Guest Name','Group/Source','Manual Entry','Table Number']]; const sorted=Array.from(tableMap.keys()).sort((a,b)=>{ if(a===BRIDAL_TABLE) return 1; if(b===BRIDAL_TABLE) return -1; return parseInt(a)-parseInt(b); }); for(const tid of sorted){ const tbl=tableMap.get(tid); const tn=tbl.name; const tnum=tid===BRIDAL_TABLE?'Bridal':tid; if(tbl.guests.length===0) rows.push([escapeCsv(tn),'(empty)','','',tnum]); else for(const g of tbl.guests) rows.push([escapeCsv(tn),escapeCsv(g.name),escapeCsv(g.group||''),g.isManual?'Yes':'No',tnum]); } const un=getUnassignedGuests(); for(const g of un) rows.push(['UNASSIGNED',escapeCsv(g.name),escapeCsv(g.group||''),g.isManual?'Yes':'No','']); const blob=new Blob(["\uFEFF"+rows.map(r=>r.join(',')).join('\n')],{type:'text/csv'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=`wedding_seating_${new Date().toISOString().slice(0,19)}.csv`; a.click(); URL.revokeObjectURL(a.href); showToast("CSV exported"); }

/option></select><button class="btn" style="padding:6px 14px;" data-assign="${g.id}">Assign</button></div></div>`).join('')}</div><div class="main-layout"><div class="tables-area"><div class="tables-grid" id="tablesGrid"></div></div><div class="guests-area"><h3>📋 Unassigned (${unassigned.length})</h3><div id="unassignedList"></div></div></div></div>`;
        
        const grid = document.getElementById('tablesGrid'); if(grid){ grid.innerHTML=''; const sorted=Array.from(tableMap.keys()).sort((a,b)=>{ if(a===BRIDAL_TABLE) return 1; if(b===BRIDAL_TABLE) return -1; return parseInt(a)-parseInt(b); }); for(const tid of sorted){ const tbl=tableMap.get(tid); const isBridal=tid===BRIDAL_TABLE; const card=document.createElement('div'); card.className=`table-card ${isBridal?'bridal':''}`; card.innerHTML=`<div class="table-header"><span>${tbl.name} ${isBridal?'⭐':''}</span><span>${tbl.guests.length} ${!isBridal?`/ ${MAX_PER_TABLE}`:'guests'}</span></div><div class="table-guests">${tbl.guests.length===0?'<div class="empty-table">— empty —</div>':tbl.guests.map(g=>`<span class="guest-chip ${g.isManual?'manual':''}" data-id="${g.id}" data-table="${tid}">${escapeHtml(g.name)} ${g.isManual?'📝':''} ✖</span>`).join('')}</div>`; grid.appendChild(card); card.querySelectorAll('.guest-chip').forEach(chip=>{ chip.onclick=()=>{ if(confirm('Remove guest?')) removeGuestFromTable(chip.dataset.id, chip.dataset.table); }; }); } }
        const ulist = document.getElementById('unassignedList'); if(ulist){ if(unassigned.length===0) ulist.innerHTML='<div style="text-align:center;padding:30px;">✨ All guests assigned ✨</div>'; else ulist.innerHTML=unassigned.map(g=>`<div class="guest-list-item"><div><div class="guest-name">${escapeHtml(g.name)} ${g.isManual?'📝':''}</div><div class="guest-group">${escapeHtml(g.group)}</div></div><select id="sel_${g.id.replace(/[^a-z0-9]/gi,'')}" style="width:110px;"><option value="">Table</option>${tableOptions.map(t=>`<option value="${t}">${t}</option>`).join('')}<option value="${BRIDAL_TABLE}">👰</option></select><button class="btn" style="padding:4px 12px;" data-quick="${g.id}">✔</button></div>`).join(''); for(const g of unassigned){ const btn=ulist.querySelector(`[data-quick="${g.id}"]`); const sel=ulist.querySelector(`#sel_${g.id.replace(/[^a-z0-9]/gi,'')}`); if(btn && sel) btn.onclick=()=>{ if(sel.value) assignGuestToTable(g, sel.value); else showToast('Select a table'); }; } }
        document.getElementById('resetBtn').onclick=resetAllSeating; document.getElementById('pdfBtn').onclick=exportToPDF; document.getElementById('csvBtn').onclick=exportToCSV; document.getElementById('addManualBtn').onclick=()=>{ const f=document.getElementById('firstName').value; const l=document.getElementById('lastName').value; if(addManualGuest(f,l)){ document.getElementById('firstName').value=''; document.getElementById('lastName').value=''; } }; const searchInp=document.getElementById('searchInput'); document.getElementById('searchBtn').onclick=()=>{ currentSearch=searchInp.value; renderApp(); }; document.getElementById('clearSearchBtn').onclick=()=>{ currentSearch=''; searchInp.value=''; renderApp(); }; if(searchInp) searchInp.onkeypress=(e)=>{ if(e.key==='Enter'){ currentSearch=searchInp.value; renderApp(); } }; document.querySelectorAll('[data-assign]').forEach(btn=>{ btn.onclick=()=>{ const gid=btn.dataset.assign; const sel=document.querySelector(`.assign-select[data-id="${gid}"]`); if(sel && sel.value){ const guest=allGuests.find(g=>g.id===gid); if(guest) assignGuestToTable(guest, sel.value); } else showToast('Select table'); }; }); const manualDiv=document.getElementById('manualList'); if(manualDiv){ manualDiv.innerHTML=manualGuests.map(m=>`<span class="guest-tag" data-id="${m.id}">${escapeHtml(m.name)} <span class="delete-icon" data-id="${m.id}">✖</span></span>`).join('')||'<span>No manual guests</span>'; document.querySelectorAll('.delete-icon').forEach(icon=>{ icon.onclick=(e)=>{ e.stopPropagation(); if(confirm('Delete this manual guest?')) deleteManualGuest(icon.dataset.id); }; }); }
    }
    
    async function init() { initTables(); loadManualFromStorage(); const savedSeating = await loadSeatingFromFirebase(); if(savedSeating && savedSeating.size > 0) { tableMap = savedSeating; } else { initTables(); } renderApp(); showToast(`🎉 ${allGuests.length} guests loaded · Auto-save active`); }
    init();
</script>
</body>
</html>
