<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Monday Night Soccer | Complete Hub</title>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        body{background:#eef2f5;font-family:'Inter',sans-serif;}
        .app{max-width:500px;margin:0 auto;background:#eef2f5;min-height:100vh;padding-bottom:20px;}
        .header{background:white;padding:14px 20px;text-align:center;border-bottom:1px solid #e2e8f0;}
        .logo-icon{width:56px;height:56px;background:#1a73e8;border-radius:24px;display:inline-flex;align-items:center;justify-content:center;margin:0 auto 6px;}
        .logo-icon i{font-size:28px;color:white;}
        .header h1{font-size:18px;font-weight:800;color:#1e293b;}
        .user-row{background:#f1f5f9;padding:5px 12px;border-radius:60px;display:inline-flex;align-items:center;gap:8px;margin-top:6px;font-size:12px;}
        .user-row button{background:#dc3545;border:none;padding:4px 12px;border-radius:40px;color:white;font-weight:600;font-size:11px;cursor:pointer;}
        .top-nav{background:white;padding:10px 12px;display:flex;flex-wrap:wrap;justify-content:center;gap:6px;border-bottom:1px solid #e2e8f0;position:sticky;top:0;z-index:10;}
        .nav-module{background:#f8fafc;border:none;padding:8px 14px;border-radius:60px;font-size:12px;font-weight:600;color:#475569;cursor:pointer;}
        .nav-module.active{background:#1a73e8;color:white;}
        .module-container{padding:16px;display:none;}
        .module-container.active-module{display:block;}
        .card{background:white;border-radius:24px;padding:18px;margin-bottom:14px;border:1px solid #e2e8f0;}
        .card h2{font-size:17px;font-weight:700;margin-bottom:14px;border-left:4px solid #1a73e8;padding-left:12px;}
        .attendance-card{background:linear-gradient(135deg,#1a73e8,#0d5bbf);color:white;border-radius:28px;padding:24px 20px;text-align:center;margin-bottom:16px;}
        .big-buttons{display:flex;gap:14px;margin:16px 0 12px;}
        .btn-play-big{background:#28a745;flex:1;padding:14px;border-radius:60px;font-weight:800;font-size:17px;border:none;color:white;cursor:pointer;}
        .btn-sit-big{background:#dc3545;flex:1;padding:14px;border-radius:60px;font-weight:800;font-size:17px;border:none;color:white;cursor:pointer;}
        .profile-item{background:#f8fafc;border-radius:20px;padding:14px;margin-bottom:10px;display:flex;align-items:center;gap:12px;}
        .profile-avatar{width:50px;height:50px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:white;font-weight:700;font-size:20px;}
        .player-avatar-small{width:32px;height:32px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:white;font-weight:600;font-size:13px;margin-right:4px;}
        .profile-badge{background:white;border-radius:40px;padding:4px 12px;font-size:11px;font-weight:600;display:inline-block;margin-right:6px;margin-bottom:4px;}
        .match-card{background:white;border-radius:24px;margin-bottom:14px;border:1px solid #e2e8f0;overflow:hidden;}
        .match-header{background:#f8fafc;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;}
        .match-result{background:#1a73e8;color:white;padding:4px 14px;border-radius:40px;font-weight:700;}
        .guest-tag{background:#d4edda;color:#155724;border-radius:40px;padding:6px 12px;font-size:13px;display:inline-flex;align-items:center;gap:6px;}
        .playing-list,.guest-section{background:#e8f0fe;border-radius:20px;padding:16px;margin-bottom:14px;}
        .guest-section{background:#f0fdf4;border:1px solid #bbf7d0;}
        .attendee-tag{display:inline-flex;align-items:center;gap:6px;background:#e2e8f0;padding:6px 12px;border-radius:40px;font-size:13px;margin:4px;}
        .data-table{width:100%;border-collapse:collapse;font-size:13px;}
        .data-table th,.data-table td{padding:10px;text-align:left;border-bottom:1px solid #e2e8f0;}
        .modal{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.5);display:flex;align-items:center;justify-content:center;z-index:1000;}
        .modal-content{background:white;border-radius:32px;padding:24px;max-width:380px;width:90%;}
        .login-box{background:white;border-radius:48px;padding:40px 28px;margin:40px 20px;text-align:center;}
        .login-logo{width:90px;height:90px;background:linear-gradient(135deg,#1a73e8,#0d5bbf);border-radius:32px;display:inline-flex;align-items:center;justify-content:center;margin:0 auto 20px;}
        select,input{width:100%;padding:14px;border:1.5px solid #e2e8f0;border-radius:60px;margin:8px 0;font-size:16px;}
        button{background:#1a73e8;color:white;border:none;padding:12px 20px;border-radius:60px;font-weight:700;cursor:pointer;}
        .flex-btns{display:flex;gap:12px;margin-top:12px;}
        .chat-message{margin-bottom:12px;}
        .chat-bubble{background:#f1f5f9;padding:10px 14px;border-radius:18px;font-size:14px;}
        .chat-name{font-weight:700;font-size:12px;color:#1a73e8;margin-bottom:4px;}
        .info-bar{background:#e8f0fe;border-radius:16px;padding:12px;font-size:12px;margin-bottom:16px;text-align:center;color:#1a73e8;font-weight:500;}
        .timer-container{background:linear-gradient(135deg,#1e293b,#0f172a);border-radius:28px;padding:20px;text-align:center;margin-bottom:16px;}
        .timer-display{font-size:56px;font-weight:800;font-family:monospace;color:#10b981;background:#00000030;border-radius:20px;padding:12px;margin-bottom:16px;}
        .timer-controls{display:flex;gap:12px;justify-content:center;}
        .timer-btn{padding:10px 20px;border-radius:60px;font-weight:700;font-size:14px;border:none;cursor:pointer;}
        .timer-btn.start{background:#10b981;color:white;}
        .timer-btn.pause{background:#f59e0b;color:white;}
        .timer-btn.reset{background:#ef4444;color:white;}
        .loading{text-align:center;padding:40px;color:#64748b;}
        .goal-entry{background:#eef2ff;border-radius:20px;padding:12px;margin-bottom:10px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
        .game-selector{background:#f1f5f9;border-radius:60px;padding:12px 16px;margin-bottom:16px;display:flex;gap:10px;align-items:center;}
        .game-selector select{flex:2;margin:0;padding:10px;}
        .team-badge-yellow{background:#ffc107;color:#2c2c2c;padding:2px 8px;border-radius:20px;font-size:10px;font-weight:700;}
        .team-badge-orange{background:#fd7e14;color:white;padding:2px 8px;border-radius:20px;font-size:10px;font-weight:700;}
        .admin-team-item{display:flex;justify-content:space-between;align-items:center;margin:8px 0;background:#f1f5f9;border-radius:60px;padding:8px 16px;flex-wrap:wrap;gap:8px;}
        .weather-card{background:linear-gradient(135deg,#0f2027,#203a43);color:white;border-radius:24px;padding:20px;text-align:center;}
    </style>
</head>
<body>
<div class="app" id="app"><div class="loading"><i class="fas fa-spinner fa-spin"></i> Loading Monday Night Soccer...</div></div>

<script>
(function() {
    // PLAYER ROSTER
    var DEFAULT_PLAYERS = ["Alex Rowe","Ali Mekawy","Carlo","Charlie","Chris Del Monaco","Chris M","Chris S","Danny","Dante","David","Dimitri","Enzo","Farid","Faros","Frank","George B","George T","Ivan","James Zoumis","James","Joe T","Joey","Kia","Leo","Manoli","Marco","Mario","Maurice","Nector","Paul","Perri","Peter","Ralph","Rocco","Stav","Stevan","Theo","Tony EH","Vasilis"].sort();
    
    // FIREBASE
    var firebaseConfig = {
        apiKey: "AIzaSyCWlFqDJyENgrUOhiLXCjSEi4Mk_54SA1w",
        authDomain: "monday-night-soccer-hub.firebaseapp.com",
        projectId: "monday-night-soccer-hub",
        storageBucket: "monday-night-soccer-hub.firebasestorage.app",
        messagingSenderId: "634335208908",
        appId: "1:634335208908:web:dca705b65fc52de0606969"
    };
    
    var db = null, firebaseReady = false;
    try {
        firebase.initializeApp(firebaseConfig);
        db = firebase.firestore();
        firebaseReady = true;
    } catch(e) { console.warn("Firebase demo"); }
    
    // DATA STORES
    var players = DEFAULT_PLAYERS.slice();
    var playerProfiles = {};
    var teamAssignments = {};
    var matchResults = {};
    var attendance = [];
    var guests = [];
    var isAdminLoggedIn = false;
    var currentUser = null;
    var weeklyCaptain = "Carlo";
    var weatherData = { temp: "18°C", condition: "Clear", icon: "fa-sun", rainChance: 10 };
    var chatUnsubscribe = null;
    var currentAdminGameDate = null;
    
    // TIMER
    var timerInterval = null, currentHalf = 1, timeLeft = 45 * 60;
    function formatTime(sec) { var m = Math.floor(sec/60); var s = sec % 60; return (m<10?'0'+m:m)+':'+(s<10?'0'+s:s); }
    function updateTimerDisplay() { var d = document.getElementById("timerDisplay"); if(d) d.textContent = formatTime(timeLeft); var hs = document.getElementById("currentHalf"); if(hs) hs.textContent = currentHalf===1 ? "FIRST HALF" : "SECOND HALF"; }
    function playAlarm() { try { var a = new (window.AudioContext||window.webkitAudioContext)(); var o = a.createOscillator(); var g = a.createGain(); o.connect(g); g.connect(a.destination); o.frequency.value = 880; g.gain.value = 0.5; o.start(); g.gain.exponentialRampToValueAtTime(0.00001, a.currentTime+1.5); o.stop(a.currentTime+1.5); } catch(e){} }
    function timerTick() { if(timeLeft <= 0) { if(timerInterval) clearInterval(timerInterval); playAlarm(); if(currentHalf===1) { alert("HALF TIME! Start second half?"); currentHalf=2; timeLeft=45*60; updateTimerDisplay(); } else { alert("FULL TIME! Match ended."); currentHalf=1; timeLeft=45*60; updateTimerDisplay(); } return; } timeLeft--; updateTimerDisplay(); }
    function startTimer() { if(timerInterval) clearInterval(timerInterval); timerInterval = setInterval(timerTick, 1000); }
    function pauseTimer() { if(timerInterval) { clearInterval(timerInterval); timerInterval = null; } }
    function resetTimer() { pauseTimer(); currentHalf=1; timeLeft=45*60; updateTimerDisplay(); }
    
    // AUSTRALIAN TIME (AEST)
    function getAustralianTime() { var now = new Date(); var utc = now.getTime() + (now.getTimezoneOffset()*60000); return new Date(utc + (10*3600000)); }
    function getNextMondayGameDate() {
        var now = getAustralianTime();
        var day = now.getDay();
        var hour = now.getHours();
        var daysUntilMonday;
        if(day === 1 && hour >= 20) daysUntilMonday = 7;
        else if(day === 1) daysUntilMonday = 0;
        else if(day === 0) daysUntilMonday = 1;
        else daysUntilMonday = (8 - day) % 7;
        var d = new Date(now);
        d.setDate(now.getDate() + daysUntilMonday);
        d.setHours(0,0,0,0);
        return d;
    }
    function getCurrentGameLabel() { var d = getNextMondayGameDate(); return 'Mon ' + d.toLocaleDateString('en-AU',{day:'numeric',month:'long'}) + ', 8pm'; }
    var CURRENT_GAME_STR = getNextMondayGameDate().toISOString().split('T')[0];
    
    function getAllGameWeeks() {
        var weeks = [];
        var current = getNextMondayGameDate();
        for(var i = -20; i <= 4; i++) {
            var d = new Date(current);
            d.setDate(current.getDate() + (i * 7));
            if(d >= new Date(2024,0,1)) {
                weeks.push({ dateStr: d.toISOString().split('T')[0], label: 'Mon ' + d.toLocaleDateString('en-AU',{day:'numeric',month:'short',year:'numeric'}) });
            }
        }
        weeks.sort(function(a,b){ return a.dateStr.localeCompare(b.dateStr); });
        return weeks;
    }
    var ALL_WEEKS = getAllGameWeeks();
    currentAdminGameDate = CURRENT_GAME_STR;
    
    function getAllParticipants(gameDate) {
        var playersList = [];
        var guestsList = [];
        for(var i=0; i<attendance.length; i++) { if(attendance[i].gameDate === gameDate && attendance[i].status === 'in') playersList.push(attendance[i].player); }
        for(var j=0; j<guests.length; j++) { if(guests[j].gameDate === gameDate) guestsList.push({ name: guests[j].guestName, addedBy: guests[j].addedBy }); }
        return { players: playersList, guests: guestsList };
    }
    
    function getPlayersAndGuestsForGame(gameDate) {
        var parts = getAllParticipants(gameDate);
        var result = [];
        for(var i=0; i<parts.players.length; i++) result.push({ name: parts.players[i], isGuest: false, displayName: parts.players[i] });
        for(var j=0; j<parts.guests.length; j++) result.push({ name: parts.guests[j].name, isGuest: true, displayName: parts.guests[j].name + ' (Guest)' });
        return result;
    }
    
    function getTeamForPlayer(gameDate, playerName, isGuest) {
        var assign = teamAssignments[gameDate] || {};
        var key = isGuest ? 'guest_' + playerName : playerName;
        return assign[key] || null;
    }
    
    // HELPERS
    function escapeHtml(s) { if(!s) return ''; return String(s).replace(/[&<>]/g, function(m) { if(m==='&') return '&amp;'; if(m==='<') return '&lt;'; if(m==='>') return '&gt;'; return m; }); }
    function getInitials(n) { return n.split(' ').map(function(x){ return x[0]; }).join('').toUpperCase().substring(0,2); }
    function getAvatarColor(n) { var c = ['#1a73e8','#28a745','#dc3545','#fd7e14','#6f42c1']; var h=0; for(var i=0;i<n.length;i++) h=((h<<5)-h)+n.charCodeAt(i); return c[Math.abs(h)%c.length]; }
    function renderAvatar(n,s) { s = s||50; return '<div class="profile-avatar" style="background:'+getAvatarColor(n)+';width:'+s+'px;height:'+s+'px;font-size:'+(s/2.5)+'px;">'+getInitials(n)+'</div>'; }
    function renderMiniAvatar(n,s) { s = s||28; return '<div class="player-avatar-small" style="background:'+getAvatarColor(n)+';width:'+s+'px;height:'+s+'px;font-size:'+(s/2)+'px;">'+getInitials(n)+'</div>'; }
    
    // WEATHER
    async function fetchWeather() {
        try {
            var r = await fetch('https://api.open-meteo.com/v1/forecast?latitude=-37.77&longitude=144.97&hourly=temperature_2m,precipitation_probability,weathercode&timezone=Australia/Melbourne&forecast_days=3');
            var d = await r.json();
            var gameDate = getNextMondayGameDate();
            var targetStr = gameDate.toISOString().split('T')[0];
            for(var i=0; i<d.hourly.time.length; i++) {
                var hDate = d.hourly.time[i].split('T')[0];
                var hour = parseInt(d.hourly.time[i].split('T')[1].substring(0,2));
                if(hDate === targetStr && hour === 20) {
                    weatherData.temp = Math.round(d.hourly.temperature_2m[i]) + '°C';
                    var code = d.hourly.weathercode[i];
                    if(code === 0) { weatherData.condition = "Clear"; weatherData.icon = "fa-sun"; }
                    else if(code <= 2) { weatherData.condition = "Partly cloudy"; weatherData.icon = "fa-cloud-sun"; }
                    else if(code <= 3) { weatherData.condition = "Overcast"; weatherData.icon = "fa-cloud"; }
                    else { weatherData.condition = "Rain possible"; weatherData.icon = "fa-cloud-rain"; }
                    weatherData.rainChance = d.hourly.precipitation_probability[i] || 0;
                    break;
                }
            }
        } catch(e) {}
        renderWeatherPage();
    }
    
    // FIREBASE OPERATIONS
    async function loadData() {
        if(!firebaseReady || !db) return;
        try {
            var pDoc = await db.collection("config").doc("players").get();
            var profDoc = await db.collection("config").doc("playerProfiles").get();
            var tDoc = await db.collection("config").doc("teamAssignments").get();
            var rDoc = await db.collection("config").doc("matchResults").get();
            var attSnap = await db.collection("attendance").get();
            var guestSnap = await db.collection("guests").get();
            if(pDoc.exists) players = pDoc.data().list.sort();
            if(profDoc.exists) playerProfiles = profDoc.data();
            if(tDoc.exists) teamAssignments = tDoc.data();
            if(rDoc.exists) matchResults = rDoc.data();
            attendance = attSnap.docs.map(function(d){ return d.data(); });
            guests = guestSnap.docs.map(function(d){ return d.data(); });
            for(var i=0; i<players.length; i++) { var p = players[i]; if(!playerProfiles[p]) playerProfiles[p] = { age: '—', position: '—', yearJoined: '—', gamesPlayed: 0 }; }
        } catch(e) { console.warn(e); }
    }
    
    async function saveAttendance(a) { if(firebaseReady&&db) await db.collection("attendance").doc(a.player+'_'+a.gameDate).set(a); var idx = attendance.findIndex(function(x){ return x.player===a.player && x.gameDate===a.gameDate; }); if(idx!==-1) attendance[idx]=a; else attendance.push(a); refreshAll(); }
    async function saveGuest(g) { if(firebaseReady&&db) await db.collection("guests").doc(g.guestName+'_'+g.gameDate).set(g); guests.push(g); refreshAll(); }
    async function removeGuest(name,date) { if(!confirm('Remove guest "'+name+'"?')) return; if(firebaseReady&&db) await db.collection("guests").doc(name+'_'+date).delete(); guests = guests.filter(function(g){ return !(g.guestName===name && g.gameDate===date); }); if(teamAssignments[date]){ delete teamAssignments[date][name]; delete teamAssignments[date]['guest_'+name]; if(firebaseReady&&db) await db.collection("config").doc("teamAssignments").set(teamAssignments); } refreshAll(); }
    async function saveTeamAssignments(date,assign) { teamAssignments[date] = assign; if(firebaseReady&&db) await db.collection("config").doc("teamAssignments").set(teamAssignments); refreshAll(); }
    async function saveMatchResult(date,yellow,orange,goals,assists,injuries) { matchResults[date] = { yellowScore: yellow, orangeScore: orange, goals: goals||{}, assists: assists||{}, injuries: injuries||[] }; if(firebaseReady&&db) await db.collection("config").doc("matchResults").set(matchResults); renderHistoryPage(); renderScoreboardPage(); if(isAdminLoggedIn) renderAdminPage(); }
    async function saveChatMessage(msg) { if(!currentUser || !msg.trim()) return; if(firebaseReady&&db) await db.collection("chatMessages").add({ name: currentUser.name, message: msg.trim(), timestamp: firebase.firestore.FieldValue.serverTimestamp() }); }
    async function setAttendance(status) { if(!currentUser){ alert("Login required"); return; } await saveAttendance({ player: currentUser.name, gameDate: CURRENT_GAME_STR, status: status }); alert(status==='in' ? "You're playing Monday!" : "Sorry you can't make it"); }
    async function addGuest(name) { if(guests.some(function(g){ return g.gameDate===CURRENT_GAME_STR && g.guestName===name.trim(); })){ alert("Guest already added"); return; } await saveGuest({ guestName: name.trim(), gameDate: CURRENT_GAME_STR, addedBy: currentUser ? currentUser.name : "Admin" }); var inp = document.getElementById("guestNameInput"); if(inp) inp.value = ""; alert("Guest added!"); }
    function showEditProfile(name) { var ex = playerProfiles[name] || { age: '', position: 'Midfielder', yearJoined: '', gamesPlayed: 0 }; var modal = document.createElement('div'); modal.className = 'modal'; modal.innerHTML = '<div class="modal-content"><h3>Edit ' + escapeHtml(name) + '</h3><label>Age</label><input id="editAge" value="' + escapeHtml(ex.age) + '"><label>Position</label><select id="editPosition"><option>Goalkeeper</option><option>Defender</option><option>Midfielder</option><option>Striker</option><option>Winger</option></select><label>Year Joined</label><input id="editYear" value="' + escapeHtml(ex.yearJoined) + '"><div class="flex-btns"><button id="saveBtn">Save</button><button id="cancelBtn">Cancel</button></div></div>'; document.body.appendChild(modal); document.getElementById('saveBtn').onclick = async function() { playerProfiles[name] = { age: document.getElementById('editAge').value || '—', position: document.getElementById('editPosition').value, yearJoined: document.getElementById('editYear').value || '—', gamesPlayed: ex.gamesPlayed || 0 }; if(firebaseReady&&db) await db.collection("config").doc("playerProfiles").set(playerProfiles); modal.remove(); renderProfilesPage(); }; document.getElementById('cancelBtn').onclick = function() { modal.remove(); }; }
    function refreshAll() { renderHomePage(); renderTeamsPage(); renderHistoryPage(); renderProfilesPage(); renderScoreboardPage(); if(isAdminLoggedIn) renderAdminPage(); }
    
    function generateMatchReport(resultData, gameLabel) {
        var y = resultData.yellowScore || 0;
        var o = resultData.orangeScore || 0;
        var goals = resultData.goals || {};
        var assists = resultData.assists || {};
        var injuries = resultData.injuries || [];
        var entries = [];
        for(var scorer in goals) { if(goals.hasOwnProperty(scorer)) { entries.push({ player: scorer, goals: goals[scorer], assists: assists[scorer] || 0 }); } }
        entries.sort(function(a,b){ return b.goals - a.goals; });
        var goalLines = '';
        for(var i=0; i<entries.length; i++) { var g = entries[i]; goalLines += '⚽ ' + g.player + ': ' + g.goals + ' goal' + (g.goals!==1?'s':'') + (g.assists>0 ? ' (' + g.assists + ' assist' + (g.assists!==1?'s':'') + ')' : '') + '\n'; }
        if(!goalLines) goalLines = 'No goals recorded\n';
        var injuryLine = '\nNo injuries reported.';
        if(injuries.length > 0) { injuryLine = '\nINJURIES:\n'; for(var j=0; j<injuries.length; j++) { injuryLine += '• ' + injuries[j].player + ' - ' + (injuries[j].detail || 'knock') + '\n'; } }
        return 'MONDAY NIGHT SOCCER MATCH REPORT\n' + gameLabel + ' | Clifton Park\n' + weatherData.condition + ', ' + weatherData.temp + ', rain ' + weatherData.rainChance + '%\n\nYELLOW ' + y + ' - ' + o + ' ORANGE\n\n' + goalLines + '\n' + injuryLine + '\n\nGreat game! #MondayNightSoccer';
    }
    
    // RENDER FUNCTIONS

        if(nav) nav.innerHTML = mods.map(function(m){ return '<button class="nav-module" data-module="'+m.id+'">'+m.name+'</button>'; }).join('');
        var btns = document.querySelectorAll(".nav-module");
        for(var i=0;i<btns.length;i++){ btns[i].onclick = function(){ var id = this.dataset.module; var containers = document.querySelectorAll(".module-container"); for(var j=0;j<containers.length;j++) containers[j].classList.remove("active-module"); var target = document.getElementById("module-"+id); if(target) target.classList.add("active-module"); var navBtns = document.querySelectorAll(".nav-module"); for(var k=0;k<navBtns.length;k++) navBtns[k].classList.remove("active"); this.classList.add("active"); if(id === "chat") renderChatPage(); if(id === "timer") renderTimerPage(); }; }
        var firstBtn = document.querySelector('.nav-module[data-module="home"]'); if(firstBtn) firstBtn.click();
    }
    
    async function renderApp() {
        await loadData();
        await fetchWeather();
        var app = document.getElementById("app");
        app.innerHTML = '<div class="header"><div class="logo-icon"><i class="fas fa-futbol"></i></div><h1>MONDAY NIGHT SOCCER</h1><div class="user-row"><i class="fas fa-user-circle"></i> <strong>'+(currentUser?.role==="admin"?"ADMIN":currentUser?.name||"Player")+'</strong> <button id="logoutBtnMain">Exit</button></div></div><div class="top-nav" id="topNavBar"></div><div id="module-home" class="module-container"><div id="homeContainer"></div></div><div id="module-profiles" class="module-container"><div id="page-profiles"></div></div><div id="module-scoreboard" class="module-container"><div id="page-scoreboard"></div></div><div id="module-teamswk" class="module-container"><div id="page-teamswk"></div></div><div id="module-history" class="module-container"><div id="page-history"></div></div><div id="module-weather" class="module-container"><div id="page-weather"></div></div><div id="module-timer" class="module-container"><div id="page-timer"></div></div><div id="module-chat" class="module-container"><div id="page-chat"></div></div><div id="module-rules" class="module-container"><div id="page-rules"></div></div>'+(isAdminLoggedIn?'<div id="module-admin" class="module-container"><div id="page-admin"></div></div>':'')+'</div>';
        document.getElementById("logoutBtnMain").onclick = function(){ if(chatUnsubscribe) chatUnsubscribe(); currentUser = null; isAdminLoggedIn = false; localStorage.removeItem("soccer_user"); renderLogin(); };
        renderHomePage(); renderProfilesPage(); renderScoreboardPage(); renderTeamsPage(); renderHistoryPage(); renderWeatherPage(); renderTimerPage(); renderChatPage(); renderRulesPage();
        if(isAdminLoggedIn) renderAdminPage();
        initNav();
    }
    
    async function renderLogin() {
        await loadData();
        var app = document.getElementById("app");
        app.innerHTML = '<div class="login-box"><div class="login-logo"><i class="fas fa-futbol"></i></div><h2>Monday Night Soccer</h2><p>8:00pm Kickoff • Clifton Park, Brunswick</p><select id="playerSelectLogin"><option value="">-- Select Your Name --</option>'+players.map(function(p){ return '<option value="'+escapeHtml(p)+'">'+escapeHtml(p)+'</option>'; }).join('')+'</select><button id="playerLoginBtn">Enter as Player</button><hr><input type="password" id="adminPwLogin" placeholder="Admin Password"><button id="adminLoginBtn">Admin Login</button><p style="margin-top:12px;font-size:12px;">Demo admin: <strong>admin123</strong></p></div>';
        document.getElementById("playerLoginBtn").onclick = function(){ var n = document.getElementById("playerSelectLogin").value; if(n && n!==""){ currentUser = { name: n, role: "player" }; isAdminLoggedIn = false; localStorage.setItem("soccer_user", JSON.stringify(currentUser)); renderApp(); } else alert("Select your name"); };
        document.getElementById("adminLoginBtn").onclick = function(){ var pw = document.getElementById("adminPwLogin").value; if(pw === "admin123"){ currentUser = { name: "Admin", role: "admin" }; isAdminLoggedIn = true; localStorage.setItem("soccer_user", JSON.stringify(currentUser)); renderApp(); } else alert("Wrong password"); };
    }
    
    var stored = localStorage.getItem("soccer_user");
    if(stored) { try { var u = JSON.parse(stored); if(u.role === "admin"){ isAdminLoggedIn = true; currentUser = { name: "Admin", role: "admin" }; } else { currentUser = { name: u.name, role: "player" }; } renderApp(); } catch(e){ renderLogin(); } } else { renderLogin(); }
})();
</script>
</body>
</html>
