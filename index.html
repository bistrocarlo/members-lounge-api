        }

            border: 2px solid #e8dcc8;
            overflow: hidden;
        }
        
        .table-card.bridal {
            border-color: #c9a84c;
            background: #fffcf5;
        }
        
        .table-header {

        .table-guests { padding: 12px; max-height: 350px; overflow-y: auto; }

        .postal-status { display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: 0.65rem; margin-left: 8px; }

            color: white;

                        tableNum === 1 ? "Bridal" : tableNum,
                        guest.name,
                        guest.verified || "",
                        guest.addressFull || "⚠️ NO ADDRESS",
                        guest.phone || "",
                        guest.notes || "",
                        guest.guestCount,
                        guest.postalSent ? "YES" : "NO"
                    ]);
                }
            }
            
            // Add separator
            excelData.push(["", "=== UNABLE TO ATTEND / PENDING CONFIRMATION ===", "", "", "", "", "", ""]);
            
            // Add unable to attend
            const unable = getUnableToAttend();
            for (const guest of unable) {
                excelData.push([
                    "PENDING",
                    guest.name,
                    guest.verified || "",
                    guest.addressFull || "",
                    guest.phone || "",
                    guest.notes || "",
                    guest.guestCount,
                    guest.postalSent ? "YES" : "NO"
                ]);
            }
            
            // Create worksheet
            const wsData = excelData;
            const ws = XLSX.utils.aoa_to_sheet(wsData);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Postal Invitations");
            
            // Set column widths
            ws['!cols'] = [{wch:12},{wch:35},{wch:35},{wch:50},{wch:15},{wch:30},{wch:10},{wch:12}];
            
            // Generate and download
            const fileName = `wedding_postal_invitations_${new Date().toISOString().slice(0,10)}.xlsx`;
            XLSX.writeFile(wb, fileName);
            showToast("✓ Excel file downloaded!");
        } catch (err) {
            showToast("Excel export failed: " + err.message);
        }
    }
    
    // EXPORT TO CSV
    function exportToCSV() {
        try {
            const tables = getTablesInOrder();
            const csvRows = [];
            
            // Header
            csvRows.push(["Table", "Guest Name", "Verified Names", "Postal Address", "Phone", "Notes", "Guest Count", "Sent"]);
            
            // Add all tables
            for (const [tableNum, table] of tables) {
                for (const guest of table.guests) {
                    csvRows.push([
                        tableNum === 1 ? "Bridal" : tableNum,
                        guest.name,
                        guest.verified || "",
                        guest.addressFull || "NO ADDRESS",
                        guest.phone || "",
                        guest.notes || "",
                        guest.guestCount,
                        guest.postalSent ? "Yes" : "No"
                    ]);
                }
            }
            
            // Add unable to attend
            const unable = getUnableToAttend();
            if (unable.length > 0) {
                csvRows.push(["", "=== UNABLE TO ATTEND ===", "", "", "", "", "", ""]);
                for (const guest of unable) {
                    csvRows.push([
                        "PENDING",
                        guest.name,
                        guest.verified || "",
                        guest.addressFull || "",
                        guest.phone || "",
                        guest.notes || "",
                        guest.guestCount,
                        guest.postalSent ? "Yes" : "No"
                    ]);
                }
            }
            
            // Convert to CSV string
            const csvContent = csvRows.map(row => 
                row.map(cell => `"${String(cell).replace(/"/g, '""')}"`).join(',')
            ).join('\n');
            
            // Add BOM for UTF-8
            const blob = new Blob(["\uFEFF" + csvContent], { type: "text/csv;charset=utf-8;" });
            const link = document.createElement("a");
            const url = URL.createObjectURL(blob);
            link.href = url;
            link.setAttribute("download", `wedding_postal_list_${new Date().toISOString().slice(0,10)}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
            showToast("✓ CSV file downloaded!");
        } catch (err) {
            showToast("CSV export failed: " + err.message);
        }
    }
    
    // EXPORT TO PDF (FIXED - using native print)
    function exportToPDF() {
        try {
            // Create a hidden iframe for printing
            const printContent = document.createElement('div');
            printContent.style.cssText = 'font-family: Georgia, Times New Roman, Times, serif; padding: 20px; background: white; width: 100%;';
            
            const tables = getTablesInOrder();
            const unable = getUnableToAttend();
            
            let tablesHtml = '';
            for (const [tableNum, table] of tables) {
                tablesHtml += `
                    <div style="border:2px solid #c9a84c; border-radius:10px; margin-bottom:20px; page-break-inside:avoid;">
                        <div style="background:#faf5ea; padding:12px; font-weight:bold; border-bottom:1px solid #c9a84c;">
                            ${table.name} (${table.guests.reduce((s,g)=>s+g.guestCount,0)} guests)
                        </div>
                        <div style="padding:12px;">
                            ${table.guests.map(guest => `
                                <div style="padding:10px; margin-bottom:8px; border-bottom:1px solid #eee;">
                                    <div style="font-weight:bold;">${escapeHtml(guest.name)} ${guest.postalSent ? '✅ SENT' : '⏳ PENDING'}</div>
                                    <div style="font-size:10px; color:#666;">${escapeHtml(guest.verified || '')}</div>
                                    <div style="font-size:11px; font-family:monospace; margin-top:5px; padding:5px; background:#f9f9f9; border-left:3px solid #c9a84c;">
                                        📬 ${escapeHtml(guest.addressFull || '⚠️ NO ADDRESS PROVIDED')}
                                    </div>
                                    ${guest.notes ? `<div style="font-size:9px; color:#b7950b;">📝 ${escapeHtml(guest.notes)}</div>` : ''}
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            }
            
            printContent.innerHTML = `
                <!DOCTYPE html>
                <html>
                <head>
                    <title>Daniel & Laura's Wedding - Postal Invitations</title>
                    <style>
                        body { font-family: Georgia, Times New Roman, Times, serif; padding: 20px; margin: 0; }
                        h1 { color: #2c2418; text-align: center; }
                        .header { text-align: center; margin-bottom: 30px; border-bottom: 2px solid #c9a84c; padding-bottom: 15px; }
                        .stats { display: flex; justify-content: space-around; margin-bottom: 30px; }
                        .stat-box { text-align: center; }
                        .stat-number { font-size: 24px; font-weight: bold; color: #c9a84c; }
                        .table-card { border: 2px solid #c9a84c; border-radius: 10px; margin-bottom: 20px; page-break-inside: avoid; }
                        .table-header { background: #faf5ea; padding: 12px; font-weight: bold; border-bottom: 1px solid #c9a84c; }
                        .guest-item { padding: 10px; margin-bottom: 8px; border-bottom: 1px solid #eee; }
                        .guest-name { font-weight: bold; }
                        .guest-address { font-size: 11px; font-family: monospace; margin-top: 5px; padding: 5px; background: #f9f9f9; border-left: 3px solid #c9a84c; }
                        .address-missing { color: #e74c3c; }
                        @media print {
                            body { margin: 0; padding: 15px; }
                            .no-print { display: none; }
                        }
                    </style>
                </head>
                <body>
                    <div class="header">
                        <h1>💍 Daniel & Laura's Wedding</h1>
                        <h2>Postal Invitation Address List</h2>
                        <p>Generated: ${new Date().toLocaleString()}</p>
                    </div>
                    
                    <div class="stats">
                        <div class="stat-box"><div class="stat-number">${tables.size}</div><div>Tables</div></div>
                        <div class="stat-box"><div class="stat-number">${getSeatedCount()}</div><div>Invited Guests</div></div>
                        <div class="stat-box"><div class="stat-number">${getPostalSentCount()}</div><div>Sent</div></div>
                        <div class="stat-box"><div class="stat-number">${getAddressMissingCount()}</div><div>Missing Addresses</div></div>
                    </div>
                    
                    ${tablesHtml}
                    
                    ${unable.length > 0 ? `
                        <div style="margin-top:30px; padding:15px; border:2px solid #e74c3c; border-radius:10px; background:#fef5f5;">
                            <h3 style="color:#e74c3c;">⚠️ Unable to Attend / Pending (${unable.length})</h3>
                            ${unable.map(g => `<div>• ${g.name} - ${g.notes || "Status pending"}</div>`).join('')}
                        </div>
                    ` : ''}
                    
                    <div style="text-align:center; margin-top:30px; font-size:10px; color:#999;">
                        Daniel & Laura's Wedding · Postal Invitation List
                    </div>
                </body>
                </html>
            `;
            
            // Open print window
            const printWindow = window.open('', '_blank');
            printWindow.document.write(printContent.innerHTML);
            printWindow.document.close();
            printWindow.focus();
            
            // Wait for content to load then print
            setTimeout(() => {
                printWindow.print();
                showToast("✓ PDF print window opened - save as PDF");
            }, 500);
        } catch (err) {
            showToast("PDF export failed: " + err.message);
        }
    }
    
    // Render Postal Tab
    function renderPostalTab() {
        const tables = getTablesInOrder();
        
        let html = `
            <div class="stats-bar">
                <div class="stat"><div class="stat-number">${tables.size}</div><div>Tables</div></div>
                <div class="stat"><div class="stat-number">${getSeatedCount()}</div><div>Invitations to Send</div></div>
                <div class="stat"><div class="stat-number">${getPostalSentCount()}</div><div>Sent</div></div>
                <div class="stat"><div class="stat-number">${getAddressMissingCount()}</div><div>Missing Addresses</div></div>
            </div>
            
            <div class="postal-bulk-bar">
                <span>📬 ${getPostalPendingCount()} invitations pending</span>
                <button class="btn btn-postal" onclick="markAllPostalSent()">✉️ Mark All as Sent</button>
                <button class="btn btn-excel" onclick="exportToExcel()">📊 Export Excel</button>
                <button class="btn btn-csv" onclick="exportToCSV()">📄 Export CSV</button>
                <button class="btn btn-pdf" onclick="exportToPDF()">🖨️ Print / Save as PDF</button>
                <button class="btn" onclick="resetPostalStatus()">⟳ Reset Status</button>
            </div>
            
            <div class="tables-grid">
        `;
        
        for (const [tableNum, table] of tables) {
            const totalAtTable = table.guests.reduce((sum, g) => sum + g.guestCount, 0);
            const sentAtTable = table.guests.filter(g => g.postalSent).length;
            
            html += `
                <div class="table-card ${table.isBridal ? 'bridal' : ''}">
                    <div class="table-header ${table.isBridal ? 'bridal' : ''}">
                        <span class="table-title">${table.name}</span>
                        <span class="table-count">${totalAtTable} guests (${sentAtTable} sent)</span>
                    </div>
                    <div class="table-guests">
                        ${table.guests.map(guest => `
                            <div class="guest-item">
                                <div>
                                    <span class="guest-name">${escapeHtml(guest.name)}</span>
                                    <span class="postal-status ${guest.postalSent ? 'sent' : 'pending'}">
                                        ${guest.postalSent ? '✓ Sent' : '⏳ Pending'}
                                    </span>
                                    <input type="checkbox" class="postal-checkbox" ${guest.postalSent ? "checked" : ""} onchange="togglePostalSent(${guest.id})">
                                </div>
                                <div class="guest-address">
                                    📬 ${guest.addressFull ? escapeHtml(guest.addressFull) : '<span class="address-missing">⚠️ NO ADDRESS PROVIDED</span>'}
                                </div>
                                ${guest.verified ? `<div style="font-size:0.65rem; color:#999;">👥 ${escapeHtml(guest.verified)}</div>` : ''}
                                ${guest.notes ? `<div style="font-size:0.65rem; color:#b7950b;">📝 ${escapeHtml(guest.notes)}</div>` : ''}
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }
        
        html += `</div>`;
        
        const unable = getUnableToAttend();
        if (unable.length > 0) {
            html += `
                <div style="margin-top:20px; padding:15px; background:#fef5f5; border:1px solid #e74c3c; border-radius:16px;">
                    <h3 style="color:#e74c3c;">⚠️ Unable to Attend / Pending Confirmation (${unable.length})</h3>
                    ${unable.map(g => `<div style="padding:5px 0;">• ${escapeHtml(g.name)} - ${g.notes || "Status pending"}</div>`).join('')}
                </div>
            `;
        }
        
        return html;
    }
    
    function renderTablesTab() {
        const tables = getTablesInOrder();
        let html = '<div class="tables-grid">';
        for (const [tableNum, table] of tables) {
            const total = table.guests.reduce((s,g)=>s+g.guestCount,0);
            html += `
                <div class="table-card ${table.isBridal ? 'bridal' : ''}">
                    <div class="table-header"><span>${table.name}</span><span>${total} guests</span></div>
                    <div class="table-guests">
                        ${table.guests.map(g => `<div class="guest-item"><strong>${escapeHtml(g.name)}</strong> (+${g.guestCount})<br><small>${escapeHtml(g.verified || '')}</small></div>`).join('')}
                    </div>
                </div>
            `;
        }
        html += '</div>';
        return html;
    }
    
    function renderGuestListTab() {
        const filtered = guests.filter(g => !searchTerm || g.name.toLowerCase().includes(searchTerm.toLowerCase()));
        return `
            <div class="search-box"><input type="text" class="search-input" id="searchInput" placeholder="Search..." value="${escapeHtml(searchTerm)}"><button class="btn" onclick="updateSearch()">Search</button><button class="btn" onclick="clearSearch()">Clear</button></div>
            <div class="guest-table-container"><table><thead><tr><th>Table</th><th>Name</th><th>Address</th><th>Group</th><th>Count</th><th>Sent</th></tr></thead><tbody>
                ${filtered.map(g => `<tr><td>${g.tableAllocation === 1 ? "Bridal" : (g.tableAllocation || "—")}</td><td><strong>${escapeHtml(g.name)}</strong></td><td style="font-size:0.7rem;">${escapeHtml(g.addressFull || "-")}</td><td>${g.group}</td><td>${g.guestCount}</td><td>${g.postalSent ? "✓" : "⏳"}</td></tr>`).join('')}
            </tbody></table></div>
        `;
    }
    
    function updateSearch() { searchTerm = document.getElementById('searchInput').value; renderApp(); }
    function clearSearch() { searchTerm = ""; renderApp(); }
    function setTab(tab) { currentTab = tab; renderApp(); }
    
    function renderApp() {
        const app = document.getElementById('app');
        app.innerHTML = `
            <div class="container">
                <div class="header"><h1>💍 Daniel & Laura's Wedding Manager 💒</h1><p>${guests.length} groups | ${getTotalGuestCount()} total guests | ${getSeatedCount()} seated</p></div>
                <div class="tabs">
                    <button class="tab ${currentTab === 'postal' ? 'active' : ''}" onclick="setTab('postal')">✉️ Postal Invitations</button>
                    <button class="tab ${currentTab === 'tables' ? 'active' : ''}" onclick="setTab('tables')">🪑 Table Plan</button>
                    <button class="tab ${currentTab === 'guestlist' ? 'active' : ''}" onclick="setTab('guestlist')">📋 Full Guest List</button>
                </div>
                <div class="panel active">
                    ${currentTab === 'postal' ? renderPostalTab() : currentTab === 'tables' ? renderTablesTab() : renderGuestListTab()}
                </div>
            </div>
        `;
    }
    
    // Make functions global
    window.togglePostalSent = togglePostalSent;
    window.markAllPostalSent = markAllPostalSent;
    window.resetPostalStatus = resetPostalStatus;
    window.exportToExcel = exportToExcel;
    window.exportToCSV = exportToCSV;
    window.exportToPDF = exportToPDF;
    window.updateSearch = updateSearch;
    window.clearSearch = clearSearch;
    window.setTab = setTab;
    
    renderApp();
</script>
</body>
