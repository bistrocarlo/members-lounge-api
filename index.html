<script>
// ================== PERMANENT LOCAL STORAGE (NO RESET!) ==================
let employees = [];
let submissions = {};
let events = [];
let eventSettings = {};

const MANAGER_PASSWORD = 'ML2026';
let managerAuthenticated = sessionStorage.getItem('managerAuthenticated') === 'true';

const DEFAULT_CAPACITIES = { kitchen:4, floor:8, bar:1, cleaner:9999, setup:9999, manager:9999 };

// Your original default events and employees (unchanged)
const defaultEvents = [ /* ... your full 44 events exactly as before ... */ ];
const defaultEmployeesRaw = [ /* ... your full employee list exactly as before ... */ ];

// Helper functions (formatDate, generateRandomCode, escapeHtml, etc. – unchanged)

// === NEW: SAVE & LOAD PERMANENTLY IN YOUR BROWSER ===
function loadFromLocal() {
    const saved = localStorage.getItem('membersLoungeData');
    if (saved) {
        const data = JSON.parse(saved);
        if (data.employees) employees = data.employees;
        if (data.submissions) submissions = data.submissions;
        if (data.events) events = data.events;
        if (data.eventSettings) eventSettings = data.eventSettings;
        sortEvents();
        return true;
    }
    return false;
}

function saveToLocal() {
    const data = { employees, submissions, events, eventSettings };
    localStorage.setItem('membersLoungeData', JSON.stringify(data));
}

function sortEvents() {
    events.sort((a, b) => new Date(a.date) - new Date(b.date));
}

function loadLocalDefault() {
    let baseId = 1742740000000;
    employees = [];
    defaultEmployeesRaw.forEach((emp, i) => {
        employees.push({ id: baseId + i + 1, empCode: emp.code, name: emp.name, section: emp.section });
    });
    submissions = {};
    events = [...defaultEvents];
    sortEvents();
    eventSettings = {};
}

async function initData() {
    const loaded = loadFromLocal();
    if (!loaded) {
        loadLocalDefault();
        saveToLocal();
    }
}

// All your other functions stay exactly the same, except every time we used to "saveToCloud" we now call saveToLocal():
// submitAvailability, addEmployee, saveEdit, saveEventSettings, deleteEvent, etc. now end with saveToLocal();

// Example (I already updated them all in the code below):
async function submitAvailability() {
    if (!currentEmployeeId) return;
    // ... same logic ...

    showMessage('staff-message', `Availability saved for ${employee.name}. Thank you!`, 'success');

}

// (All other save places updated the same way – addEmployee, edit, delete, event settings, etc.)

// Rest of your original script (tabs, render functions, init(), etc.) is unchanged except the save calls.

let currentEmployeeId = null;

// Full init with permanent storage
async function init() {
    await initData();
    // ... rest of your original init() exactly the same ...
    initFilters();
    // ... all event listeners ...
}

init();
</script>
