<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Member's Lounge Staff Availability</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #000000;
            color: #ffffff;
            font-family: 'Segoe UI', 'Roboto', sans-serif;
            line-height: 1.6;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 2px solid #D4AF37;
            padding-bottom: 10px;
        }
        .tab-btn {
            background: #1E1E1E;
            border: none;
            padding: 10px 20px;
            cursor: pointer;
            color: #ffffff;
            border-radius: 8px 8px 0 0;
            transition: background 0.3s;
        }
        .tab-btn.active {
            background: #D4AF37;
            color: #000000;
            font-weight: bold;
        }
        .tab-pane {
            display: none;
        }
        .tab-pane.active {
            display: block;
        }
        .card {
            background: #1E1E1E;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid #333;
        }
        .card h2, .card h3 {
            color: #D4AF37;
            margin-bottom: 15px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            color: #B0B0B0;
        }
        input, select, button {
            padding: 10px;
            background: #2D2D2D;
            border: 1px solid #444;
            border-radius: 6px;
            color: #ffffff;
            font-size: 14px;
        }
        select {
            width: 100%;
            max-width: 300px;
        }
        button {
            background: #D4AF37;
            color: #000000;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background: #C6A22E;
        }
        .btn-secondary {
            background: #444;
            color: white;
        }
        .date-list {
            max-height: 400px;
            overflow-y: auto;
            margin-top: 15px;
            border: 1px solid #333;
            border-radius: 8px;
        }
        .date-item {
            display: flex;
            align-items: center;
            padding: 10px;
            border-bottom: 1px solid #333;
        }
        .date-item label {
            flex: 1;
            margin: 0;
            cursor: pointer;
        }
        .date-item input {
            margin-right: 10px;
            transform: scale(1.2);
        }
        .employee-list {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 15px;
        }
        .employee-badge {
            background: #2D2D2D;
            padding: 5px 10px;
            border-radius: 20px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .employee-badge button {
            background: #ff4444;
            color: white;
            padding: 2px 8px;
            font-size: 12px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            padding: 8px;
            text-align: left;
            border-bottom: 1px solid #333;
        }
        th {
            color: #D4AF37;
        }
        .available-yes {
            background: #1e4620;
            color: #a5d6a5;
            padding: 2px 6px;
            border-radius: 4px;
            display: inline-block;
        }
        .available-no {
            background: #4a1c1c;
            color: #ffb3b3;
            padding: 2px 6px;
            border-radius: 4px;
            display: inline-block;
        }
        .success-msg {
            background: #1e4620;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 15px;
        }
        .error-msg {
            background: #4a1c1c;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 15px;
        }
        .hidden {
            display: none;
        }
        @media (max-width: 768px) {
            .date-item {
                flex-wrap: wrap;
            }
            .date-item label {
                width: 100%;
                margin-bottom: 5px;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="tabs">
        <button class="tab-btn active" data-tab="staff">Staff Availability</button>
        <button class="tab-btn" data-tab="admin">Admin View</button>
    </div>

    <!-- STAFF PANE -->
    <div id="staff-pane" class="tab-pane active">
        <div class="card">
            <h2>Mark Your Availability</h2>
            <div id="staff-message" class="hidden"></div>
            <div class="form-group">
                <label>Select Your Name</label>
                <select id="employee-select"></select>
            </div>
            <div class="form-group">
                <label>Select Dates You Can Work</label>
                <div id="dates-container" class="date-list"></div>
            </div>
            <button id="submit-availability">Submit My Availability</button>
        </div>
    </div>

    <!-- ADMIN PANE -->
    <div id="admin-pane" class="tab-pane">
        <div class="card">
            <h2>Manage Employees</h2>
            <div class="employee-list" id="employee-list"></div>
            <div class="form-group">
                <input type="text" id="new-employee-name" placeholder="New employee name">
                <button id="add-employee">Add Employee</button>
            </div>
        </div>
        <div class="card">
            <h2>All Submissions</h2>
            <button id="export-csv">Export as CSV</button>
            <div style="overflow-x: auto; margin-top: 15px;">
                <table id="submissions-table">
                    <thead>
                        <tr>
                            <th>Employee</th>
                            <th>Date</th>
                            <th>Available</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script>
    // -------- DATA STORAGE --------
    let employees = [];   // list of employee names (strings)
    let submissions = {}; // key: employeeName, value: array of dateIds where available

    // -------- EVENT DATES (44 events from your list) --------
    const events = [
        { id: '1', date: '2026-03-28', venue: 'Sala Reggio Ballroom' },
        { id: '2', date: '2026-04-18', venue: 'Fior Events' },
        { id: '3', date: '2026-05-09', venue: 'Fior Events' },
        { id: '4', date: '2026-05-17', venue: 'Sala Reggio Ballroom' },
        { id: '5', date: '2026-05-22', venue: 'Sala Reggio Ballroom' },
        { id: '6', date: '2026-05-23', venue: 'Sala Reggio Ballroom' },
        { id: '7', date: '2026-05-24', venue: 'Sala Reggio Ballroom' },
        { id: '8', date: '2026-05-29', venue: 'Sala Reggio Ballroom' },
        { id: '9', date: '2026-05-30', venue: 'Sala Reggio Ballroom' },
        { id: '10', date: '2026-05-31', venue: 'Sala Reggio Ballroom' },
        { id: '11', date: '2026-06-07', venue: 'Sala Reggio Ballroom' },
        { id: '12', date: '2026-06-07', venue: 'Fior Events' },
        { id: '13', date: '2026-06-12', venue: 'Sala Reggio Ballroom' },
        { id: '14', date: '2026-06-13', venue: 'Sala Reggio Ballroom' },
        { id: '15', date: '2026-06-20', venue: 'Sala Reggio Ballroom' },
        { id: '16', date: '2026-06-21', venue: 'Sala Reggio Ballroom' },
        { id: '17', date: '2026-07-19', venue: 'Sala Reggio Ballroom' },
        { id: '18', date: '2026-07-25', venue: 'Sala Reggio Ballroom' },
        { id: '19', date: '2026-07-25', venue: 'Fior Events' },
        { id: '20', date: '2026-07-26', venue: 'Sala Reggio Ballroom' },
        { id: '21', date: '2026-08-01', venue: 'Sala Reggio Ballroom' },
        { id: '22', date: '2026-08-02', venue: 'Sala Reggio Ballroom' },
        { id: '23', date: '2026-08-08', venue: 'Sala Reggio Ballroom' },
        { id: '24', date: '2026-08-15', venue: 'Sala Reggio Ballroom' },
        { id: '25', date: '2026-08-16', venue: 'Fior Events' },
        { id: '26', date: '2026-08-22', venue: 'Sala Reggio Ballroom' },
        { id: '27', date: '2026-08-23', venue: 'Sala Reggio Ballroom' },
        { id: '28', date: '2026-08-30', venue: 'Sala Reggio Ballroom' },
        { id: '29', date: '2026-09-13', venue: 'Sala Reggio Ballroom' },
        { id: '30', date: '2026-09-13', venue: 'Fior Events' },
        { id: '31', date: '2026-09-18', venue: 'Sala Reggio Ballroom' },
        { id: '32', date: '2026-09-20', venue: 'Fior Events' },
        { id: '33', date: '2026-10-03', venue: 'Fior Events' },
        { id: '34', date: '2026-10-17', venue: 'Sala Reggio Ballroom' },
        { id: '35', date: '2026-11-13', venue: 'Sala Reggio Ballroom' },
        { id: '36', date: '2026-11-21', venue: 'Sala Reggio Ballroom' },
        { id: '37', date: '2026-12-11', venue: 'Fior Events' },
        { id: '38', date: '2026-12-12', venue: 'Fior Events' },
        { id: '39', date: '2026-12-14', venue: 'Sala Reggio Ballroom' },
        { id: '40', date: '2026-12-15', venue: 'Sala Reggio Ballroom' },
        { id: '41', date: '2026-12-17', venue: 'Sala Reggio Ballroom' },
        { id: '42', date: '2027-02-27', venue: 'Fior Events' },
        { id: '43', date: '2027-02-28', venue: 'Fior Events' },
        { id: '44', date: '2027-03-27', venue: 'Fior Events' }
    ];

    // Format date for display
    function formatDate(dateStr) {
        return new Date(dateStr).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
    }

    // Load data from localStorage
    function loadData() {
        const storedEmployees = localStorage.getItem('availability_employees');
        if (storedEmployees) {
            employees = JSON.parse(storedEmployees);
        } else {
            // Default employees: Employee 1 to Employee 15
            employees = [];
            for (let i = 1; i <= 15; i++) {
                employees.push(`Employee ${i}`);
            }
            saveEmployees();
        }

        const storedSubmissions = localStorage.getItem('availability_submissions');
        if (storedSubmissions) {
            submissions = JSON.parse(storedSubmissions);
        } else {
            submissions = {};
            saveSubmissions();
        }
    }

    function saveEmployees() {
        localStorage.setItem('availability_employees', JSON.stringify(employees));
    }

    function saveSubmissions() {
        localStorage.setItem('availability_submissions', JSON.stringify(submissions));
    }

    // Render employee list in admin panel
    function renderEmployeeList() {
        const container = document.getElementById('employee-list');
        container.innerHTML = '';
        employees.forEach(emp => {
            const badge = document.createElement('div');
            badge.className = 'employee-badge';
            badge.innerHTML = `${emp} <button class="remove-emp" data-name="${emp}">✖</button>`;
            container.appendChild(badge);
        });

        // Add remove event listeners
        document.querySelectorAll('.remove-emp').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const name = btn.getAttribute('data-name');
                if (confirm(`Remove ${name}?`)) {
                    employees = employees.filter(e => e !== name);
                    delete submissions[name];
                    saveEmployees();
                    saveSubmissions();
                    renderEmployeeList();
                    renderEmployeeSelect();
                    renderSubmissionsTable();
                }
            });
        });
    }

    // Render employee dropdown for staff pane
    function renderEmployeeSelect() {
        const select = document.getElementById('employee-select');
        select.innerHTML = '<option value="">-- Select your name --</option>';
        employees.forEach(emp => {
            const option = document.createElement('option');
            option.value = emp;
            option.textContent = emp;
            select.appendChild(option);
        });
    }

    // Render the list of dates with checkboxes
    function renderDates() {
        const container = document.getElementById('dates-container');
        container.innerHTML = '';
        events.forEach(event => {
            const div = document.createElement('div');
            div.className = 'date-item';
            div.innerHTML = `
                <input type="checkbox" data-id="${event.id}" id="date-${event.id}">
                <label for="date-${event.id}">${formatDate(event.date)} – ${event.venue}</label>
            `;
            container.appendChild(div);
        });
    }

    // When employee changes, load their previously saved availability (if any)
    function loadEmployeeAvailability(employeeName) {
        const saved = submissions[employeeName] || [];
        const checkboxes = document.querySelectorAll('#dates-container input[type="checkbox"]');
        checkboxes.forEach(cb => {
            const eventId = cb.getAttribute('data-id');
            cb.checked = saved.includes(eventId);
        });
    }

    // Submit availability for selected employee
    function submitAvailability() {
        const employeeSelect = document.getElementById('employee-select');
        const employeeName = employeeSelect.value;
        if (!employeeName) {
            showMessage('staff-message', 'Please select your name first.', 'error');
            return;
        }

        const checkboxes = document.querySelectorAll('#dates-container input[type="checkbox"]');
        const selected = [];
        checkboxes.forEach(cb => {
            if (cb.checked) selected.push(cb.getAttribute('data-id'));
        });

        submissions[employeeName] = selected;
        saveSubmissions();
        showMessage('staff-message', `Availability saved for ${employeeName}. Thank you!`, 'success');
        renderSubmissionsTable();
    }

    // Show temporary message
    function showMessage(containerId, text, type) {
        const container = document.getElementById(containerId);
        container.textContent = text;
        container.className = type === 'success' ? 'success-msg' : 'error-msg';
        container.classList.remove('hidden');
        setTimeout(() => {
            container.classList.add('hidden');
        }, 3000);
    }

    // Render submissions table in admin panel
    function renderSubmissionsTable() {
        const tbody = document.querySelector('#submissions-table tbody');
        tbody.innerHTML = '';
        // Create a map: eventId -> event details
        const eventMap = {};
        events.forEach(e => { eventMap[e.id] = e; });

        for (const employee of employees) {
            const availableEventIds = submissions[employee] || [];
            for (const event of events) {
                const isAvailable = availableEventIds.includes(event.id);
                const row = tbody.insertRow();
                row.insertCell(0).textContent = employee;
                row.insertCell(1).textContent = `${formatDate(event.date)} – ${event.venue}`;
                const availCell = row.insertCell(2);
                availCell.innerHTML = isAvailable ? '<span class="available-yes">✓ Available</span>' : '<span class="available-no">✗ Not Available</span>';
            }
        }
        // If no employees, show message
        if (employees.length === 0) {
            const row = tbody.insertRow();
            const cell = row.insertCell(0);
            cell.colSpan = 3;
            cell.textContent = 'No employees added yet.';
        }
    }

    // Export to CSV
    function exportCSV() {
        let csv = 'Employee,Date,Available\n';
        const eventMap = {};
        events.forEach(e => { eventMap[e.id] = e; });
        for (const employee of employees) {
            const availableEventIds = submissions[employee] || [];
            for (const event of events) {
                const isAvailable = availableEventIds.includes(event.id);
                csv += `"${employee}","${formatDate(event.date)} – ${event.venue}",${isAvailable ? 'Yes' : 'No'}\n`;
            }
        }
        const blob = new Blob([csv], { type: 'text/csv' });
        const a = document.createElement('a');
        const url = URL.createObjectURL(blob);
        a.href = url;
        a.download = 'staff-availability.csv';
        a.click();
        URL.revokeObjectURL(url);
    }

    // Tab switching
    function switchTab(tabId) {
        document.querySelectorAll('.tab-pane').forEach(pane => pane.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        document.getElementById(`${tabId}-pane`).classList.add('active');
        document.querySelector(`.tab-btn[data-tab="${tabId}"]`).classList.add('active');
        if (tabId === 'admin') {
            renderEmployeeList();
            renderSubmissionsTable();
        } else {
            renderEmployeeSelect();
        }
    }

    // Add new employee
    function addEmployee() {
        const input = document.getElementById('new-employee-name');
        const name = input.value.trim();
        if (!name) return;
        if (employees.includes(name)) {
            alert('Employee already exists.');
            return;
        }
        employees.push(name);
        saveEmployees();
        renderEmployeeList();
        renderEmployeeSelect();
        renderSubmissionsTable();
        input.value = '';
    }

    // Initialize everything
    function init() {
        loadData();
        renderDates();
        renderEmployeeSelect();
        // Event listeners
        document.getElementById('employee-select').addEventListener('change', (e) => {
            loadEmployeeAvailability(e.target.value);
        });
        document.getElementById('submit-availability').addEventListener('click', submitAvailability);
        document.getElementById('add-employee').addEventListener('click', addEmployee);
        document.getElementById('export-csv').addEventListener('click', exportCSV);
        // Tab buttons
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const tab = btn.getAttribute('data-tab');
                switchTab(tab);
            });
        });
        // Pre-load the first employee's availability if any
        if (employees.length) {
            document.getElementById('employee-select').value = employees[0];
            loadEmployeeAvailability(employees[0]);
        }
    }

    init();
</script>
</body>
</html>
