            font-family: inherit;
            font-size: 1rem;

        }
        
        .panel.active { display: block; }
        
        .stats-bar {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }
        
        .stat {
            background: #faf5ea;
            border-radius: 16px;
            padding: 12px 20px;

            text-align: center;
        }
        
        .stat-number {
            font-size: 1.8rem;
            font-weight: bold;

        }
        
        .toolbar {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        
        .btn {
            background: #c9a84c;
            border: none;
            padding: 10px 20px;
            border-radius: 30px;
            cursor: pointer;
            font-family: inherit;
            font-weight: 600;
            transition: all 0.2s;
        }
        
        .btn:hover { background: #b8953a; transform: translateY(-1px); }
        .btn-primary { background: #27ae60; color: white; }
        .btn-email { background: #3498db; color: white; }
        .btn-csv { background: #2c3e50; color: white; }
        
        .search-box {
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        
        .search-input {
            flex: 1;
            padding: 12px 18px;
            border-radius: 40px;
            border: 1px solid #e8dcc8;
            font-family: inherit;
            font-size: 0.9rem;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
        }
        
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #e8dcc8;
        }
        
        th {
            background: #faf5ea;
            font-weight: 600;
            position: sticky;
            top: 0;
        }
        
        .guest-table-container {
            overflow-x: auto;
            max-height: 500px;
            overflow-y: auto;
        }
        
        .email-status {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.7rem;
        }
        
        .email-status.sent { background: #d5f5e3; color: #1e8449; }
        .email-status.pending { background: #fef9e7; color: #b7950b; }
        
        .email-checkbox {
            width: 20px;
            height: 20px;
            cursor: pointer;
        }
        
        .bulk-email-bar {
            background: #e8f4f8;
            padding: 15px;
            border-radius: 16px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #2c2418;
            color: white;
            padding: 10px 24px;
            border-radius: 40px;
            z-index: 1000;
            animation: fadeOut 3s forwards;
        }
        
        @keyframes fadeOut {
            0% { opacity: 1; }
            70% { opacity: 1; }
            100% { opacity: 0; visibility: hidden; }
        }
        
        .note-badge {
            background: #fef9e7;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 0.7rem;
            color: #b7950b;
        }
        
        @media (max-width: 768px) {
            th, td { font-size: 0.75rem; padding: 8px; }

        }

            border-radius: 16px;

        { name: "Nick & Irene Laskaris", verified: "Nick; Irene", address: "117 Edmund Rice Pde, Bundoora, VIC 3083", phone: "", notes: "", group: "Friends", guestCount: 2 },
        { name: "Peter DeSensi", verified: "Peter DeSensi", address: "5 Steele Street, Moonee Ponds, VIC 3039", phone: "", notes: "", group: "Friends", guestCount: 1 },
        { name: "Cosimo & Toula Patti", verified: "Cosimo Patti; Toula", address: "2 Brickworks drive, Brunswick, VIC 3056", phone: "", notes: "", group: "Friends", guestCount: 2 },
        { name: "Chris & Zina Margelis", verified: "Chris Margelis; Zina Margelis", address: "2 / 38 Nolan Street, Niddrie, VIC 3042", phone: "", notes: "", group: "Friends", guestCount: 2 },
        { name: "Alannah O'Brien", verified: "Alannah O'Brien", address: "16a Newsom Street, Ascot Vale, VIC 3032", phone: "", notes: "", group: "Friends", guestCount: 1 },
        { name: "Mimmo Ranieri & Mary Careri", verified: "Mimmo Ranieri; Mary Careri", address: "16a Lind Street, Strathmore, VIC 3041", phone: "", notes: "", group: "Friends", guestCount: 2 }
    ];

    // Add unique IDs to each guest
    let guests = consolidatedGuests.map((guest, index) => ({
        id: index,
        ...guest,
        emailed: false,
        deliveryMethod: guest.phone ? "Email/Text" : "Post"
    }));

    let currentTab = "guestlist";
    let searchTerm = "";

    function showToast(message) {
        let toast = document.querySelector('.toast');
        if (toast) toast.remove();
        toast = document.createElement('div');
        toast.className = 'toast';
        toast.textContent = message;
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 3000);
    }

    function getTotalGuestCount() {
        return guests.reduce((sum, g) => sum + g.guestCount, 0);
    }

    function getEmailedCount() {
        return guests.filter(g => g.emailed).length;
    }

    function getPendingCount() {
        return guests.filter(g => !g.emailed).length;
    }

    function getPhoneCount() {
        return guests.filter(g => g.phone && g.phone.trim() !== "" && g.phone !== "na").length;
    }

    function toggleEmail(guestId) {
        const guest = guests.find(g => g.id === guestId);
        if (guest) {
            guest.emailed = !guest.emailed;
            renderApp();
            showToast(`${guest.emailed ? "Marked as emailed" : "Marked as pending"}: ${guest.name}`);
        }
    }

    function sendBulkEmails() {
        const pending = guests.filter(g => !g.emailed);
        if (pending.length === 0) {
            showToast("🎉 All guests have been emailed!");
            return;
        }

        // Open email client for each pending guest (limit to 10 at a time)
        const toEmail = pending.slice(0, 10);
        for (const guest of toEmail) {
            const subject = encodeURIComponent("Daniel & Laura's Wedding - Important Information");
            const body = encodeURIComponent(`Dear ${guest.name.split(' & ')[0]},

We are so excited to celebrate our wedding day with you!

📅 Date: [Your Wedding Date]
📍 Venue: [Venue Name]
🕕 Time: [Time]

We can't wait to see you there!

With love,
Daniel & Laura 💒`);

            const email = prompt(`Enter email address for ${guest.name}:`, `${guest.name.replace(/\s/g, '.').toLowerCase()}@example.com`);
            if (email) {
                window.open(`mailto:${email}?subject=${subject}&body=${body}`);
                guest.emailed = true;
            }
        }
        renderApp();
        showToast(`📧 Opened emails for ${toEmail.length} guest(s)`);
    }

    function exportToCSV() {
        const headers = ["Name", "Verified Names", "Address", "Phone", "Notes", "Group", "Guest Count", "Emailed", "Delivery Method"];
        const rows = guests.map(g => [
            `"${g.name}"`,
            `"${g.verified}"`,
            `"${g.address || ""}"`,
            `"${g.phone || ""}"`,
            `"${g.notes || ""}"`,
            `"${g.group}"`,
            g.guestCount,
            g.emailed ? "Yes" : "No",
            g.deliveryMethod
        ]);

        const csv = [headers, ...rows].map(row => row.join(",")).join("\n");
        const blob = new Blob(["\uFEFF" + csv], { type: "text/csv" });
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = `wedding_guest_list_${new Date().toISOString().slice(0, 10)}.csv`;
        link.click();
        URL.revokeObjectURL(link.href);
        showToast("CSV exported!");
    }

    function filterGuests() {
        if (!searchTerm) return guests;
        const term = searchTerm.toLowerCase();
        return guests.filter(g => 
            g.name.toLowerCase().includes(term) || 
            (g.verified && g.verified.toLowerCase().includes(term)) ||
            (g.phone && g.phone.includes(term))
        );
    }

    function renderGuestList() {
        const filtered = filterGuests();
        const totalIndividual = filtered.reduce((sum, g) => sum + g.guestCount, 0);
        
        return `
            <div class="stats-bar">
                <div class="stat"><div class="stat-number">${filtered.length}</div><div>Groups/Families</div></div>
                <div class="stat"><div class="stat-number">${totalIndividual}</div><div>Individual Guests</div></div>
                <div class="stat"><div class="stat-number">${getPhoneCount()}</div><div>Have Phone/Email</div></div>
            </div>
            
            <div class="bulk-email-bar">
                <span>📧 ${getPendingCount()} guests not yet emailed</span>
                <button class="btn btn-email" onclick="sendBulkEmails()">📧 Send Bulk Emails</button>
                <button class="btn btn-csv" onclick="exportToCSV()">📊 Export CSV</button>
            </div>
            
            <div class="search-box">
                <input type="text" class="search-input" id="searchInput" placeholder="🔍 Search by name, verified names, or phone..." value="${searchTerm.replace(/"/g, '&quot;')}">
                <button class="btn" onclick="updateSearch()">Search</button>
                <button class="btn" onclick="clearSearch()">Clear</button>
            </div>
            
            <div class="guest-table-container">
                <table>
                    <thead>
                        <tr><th>Emailed?</th><th>Name</th><th>Verified Names</th><th>Address</th><th>Phone</th><th>Group</th><th>Count</th><th>Notes</th></tr>
                    </thead>
                    <tbody>
                        ${filtered.map(guest => `
                            <tr>
                                <td style="text-align:center">
                                    <input type="checkbox" class="email-checkbox" ${guest.emailed ? "checked" : ""} onchange="toggleEmail(${guest.id})">
                                </td>
                                <td><strong>${escapeHtml(guest.name)}</strong></td>
                                <td>${escapeHtml(guest.verified || "-")}</td>
                                <td style="font-size:0.8rem">${escapeHtml(guest.address || "-")}</td>
                                <td>${guest.phone ? `<a href="tel:${guest.phone}">${guest.phone}</a>` : "-"}</td>
                                <td><span class="note-badge">${guest.group}</span></td>
                                <td style="text-align:center">${guest.guestCount}</td>
                                <td style="font-size:0.75rem; color:#b7950b">${escapeHtml(guest.notes || "-")}</td>
                            </tr>
                        `).join('')}
                        ${filtered.length === 0 ? '<tr><td colspan="8" style="text-align:center; padding:40px;">✨ No guests found ✨</td></tr>' : ''}
                    </tbody>
                </table>
            </div>
        `;
    }

    function renderTableAssignment() {
        return `
            <div class="table-assignment-area">
                <h2>🪑 Table Assignment Coming Soon</h2>
                <p style="margin-top: 15px;">The table assignment feature will be available in the next update.</p>
                <p style="margin-top: 10px;">For now, you can use the Guest List tab to manage all ${guests.length} groups/families.</p>
                <div style="margin-top: 30px;">
                    <div class="stat" style="display: inline-block; margin: 10px;">
                        <div class="stat-number">${guests.length}</div>
                        <div>Groups/Families</div>
                    </div>
                    <div class="stat" style="display: inline-block; margin: 10px;">
                        <div class="stat-number">${getTotalGuestCount()}</div>
                        <div>Total Guests</div>
                    </div>
                </div>
            </div>
        `;
    }

    function escapeHtml(str) {
        if (!str) return "";
        return str.replace(/[&<>]/g, m => m === "&" ? "&amp;" : m === "<" ? "&lt;" : "&gt;");
    }

    function updateSearch() {
        searchTerm = document.getElementById('searchInput').value;
        renderApp();
    }

    function clearSearch() {
        searchTerm = "";
        renderApp();
    }

    function setTab(tab) {
        currentTab = tab;
        renderApp();
    }

    function renderApp() {
        const app = document.getElementById('app');
        
        app.innerHTML = `
            <div class="container">
                <div class="header">
                    <h1>💍 Daniel & Laura's Wedding Manager 💒</h1>
                    <p>Complete Guest List | ${guests.length} groups | ${getTotalGuestCount()} total guests</p>
                </div>
                
                <div class="tabs">
                    <button class="tab ${currentTab === 'guestlist' ? 'active' : ''}" onclick="setTab('guestlist')">📋 Guest List + Email</button>
                    <button class="tab ${currentTab === 'tables' ? 'active' : ''}" onclick="setTab('tables')">🪑 Table Assignment (Coming Soon)</button>
                </div>
                
                <div class="panel active">
                    ${currentTab === 'guestlist' ? renderGuestList() : renderTableAssignment()}
                </div>
            </div>
        `;
    }

    // Make functions global for onclick
    window.toggleEmail = toggleEmail;
    window.sendBulkEmails = sendBulkEmails;
    window.exportToCSV = exportToCSV;
    window.updateSearch = updateSearch;
    window.clearSearch = clearSearch;
    window.setTab = setTab;

    renderApp();
</script>
