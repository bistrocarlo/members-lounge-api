<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Belfioti · Artisan Pasta</title>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:'Century Gothic','Segoe UI',sans-serif;}
        body{background:#0a1620;color:#e8ddb0;min-height:100vh;}
        .container{max-width:1200px;margin:0 auto;padding:20px;}
        .login-container{max-width:400px;margin:100px auto;background:#0f212e;padding:40px;border-radius:20px;border:1px solid #d4af37;}
        h1{color:#d4af37;font-size:2rem;margin-bottom:10px;}
        h2{color:#d4af37;margin-bottom:20px;border-left:3px solid #d4af37;padding-left:12px;}
        input,select,textarea,button{width:100%;padding:12px;border-radius:10px;border:1px solid #2c4a5e;background:#0a1822;color:#fff;margin:10px 0;font-size:1rem;}
        button{background:#d4af37;color:#0a1620;font-weight:bold;border:none;cursor:pointer;}
        button:active{transform:scale(0.98);}
        .header{background:#07161f;border-bottom:2px solid #d4af37;padding:20px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;}
        .abn{font-size:0.7rem;background:#0a1822;padding:6px 12px;border-radius:20px;}
        .grid-2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px;}
        .card{background:#0f212e;border-radius:16px;padding:20px;border:1px solid #d4af3730;margin-bottom:20px;}
        .pasta-item{display:flex;justify-content:space-between;align-items:center;padding:12px;border-bottom:1px solid #2c4a5e;}
        .pasta-name{flex:2;}
        .pasta-price{flex:1;color:#d4af37;}
        .pasta-qty{flex:1;}
        .pasta-qty input{width:80px;margin:0;text-align:center;}
        .total-box{background:#07161f;padding:20px;border-radius:12px;text-align:center;margin:20px 0;}
        .total-amount{font-size:2rem;color:#d4af37;font-weight:bold;}
        .invoice-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px;}
        .invoice-actions button{flex:1;min-width:120px;}
        .orders-list{max-height:500px;overflow-y:auto;}
        .order-item{background:#07161f;border-radius:12px;padding:15px;margin-bottom:10px;border-left:3px solid #d4af37;}
        .status-pending{background:#8b6b2c;padding:2px 10px;border-radius:20px;font-size:0.7rem;}
        .status-completed{background:#2c6e3a;padding:2px 10px;border-radius:20px;font-size:0.7rem;}
        table{width:100%;border-collapse:collapse;font-size:0.75rem;}
        th{background:#d4af37;color:#0a1620;padding:10px;text-align:left;}
        td{padding:8px;border-bottom:1px solid #2c4a5e;}
        .tabs{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap;}
        .tab-btn{background:#0f212e;border:none;padding:10px 20px;border-radius:30px;cursor:pointer;color:#e8ddb0;}
        .tab-btn.active{background:#d4af37;color:#0a1620;font-weight:bold;}
        .tab-content{display:none;}
        .tab-content.active{display:block;}
        .footer{text-align:center;font-size:0.65rem;margin-top:30px;padding-top:20px;border-top:1px solid #2c4a5e;}
        .error{color:#cc6666;font-size:0.8rem;margin-top:5px;}
        @media(max-width:700px){.pasta-item{flex-wrap:wrap;gap:10px;}.pasta-qty input{width:100%;}}
    </style>
</head>
<body>
<div id="app"></div>

<script>
// ========== FIREBASE CONFIG ==========
const firebaseConfig = {
    apiKey: "AIzaSyA_fHxVLIvsmvCTe-5LxIdGChoOF9US9hs",
    authDomain: "belfioti-orders.firebaseapp.com",
    projectId: "belfioti-orders",
    storageBucket: "belfioti-orders.firebasestorage.app",
    messagingSenderId: "211389704320",
    appId: "1:211389704320:web:fd42204382707a59a15e65"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

// ========== 12 ITALIAN PASTAS ==========
const pastas = [
    { id: 1, name: "Spaghetti", code: "BLF-SPG-001", basePrice: 12.90 },
    { id: 2, name: "Fettuccine", code: "BLF-FET-002", basePrice: 13.90 },
    { id: 3, name: "Penne Rigate", code: "BLF-PEN-003", basePrice: 11.90 },
    { id: 4, name: "Linguine", code: "BLF-LIN-004", basePrice: 12.90 },
    { id: 5, name: "Tagliatelle", code: "BLF-TAG-005", basePrice: 14.50 },
    { id: 6, name: "Pappardelle", code: "BLF-PAP-006", basePrice: 15.90 },
    { id: 7, name: "Rigatoni", code: "BLF-RIG-007", basePrice: 11.90 },
    { id: 8, name: "Orecchiette", code: "BLF-ORE-008", basePrice: 14.90 },
    { id: 9, name: "Fusilli", code: "BLF-FUS-009", basePrice: 11.90 },
    { id: 10, name: "Gnocchi", code: "BLF-GNO-010", basePrice: 16.90 },
    { id: 11, name: "Cannelloni", code: "BLF-CAN-011", basePrice: 13.90 },
    { id: 12, name: "Lasagne Sheets", code: "BLF-LAS-012", basePrice: 12.90 }
];

let prices = {};
let currentUser = null;
let orderQuantities = {};
let allOrders = [];
let adminOrdersListener = null;

// ========== AUTHENTICATION ==========
const validUsers = {
    "customer1": { password: "pastalover", name: "Maria G.", type: "customer" },
    "customer2": { password: "italian123", name: "Tony R.", type: "customer" },
    "andrew": { password: "belfioti2024", name: "Andrew", type: "admin" }
};

function showLogin() {
    document.getElementById("app").innerHTML = `
        <div class="login-container">
            <h1 style="text-align:center;">Belfioti Pasta</h1>
            <p style="text-align:center;margin-bottom:30px;">Pascoe Vale, Melbourne<br>Imported Flour · Imported Water · Very Digestible</p>
            <input type="text" id="username" placeholder="Username" autocomplete="off">
            <input type="password" id="password" placeholder="Password">
            <button id="loginBtn">Sign In</button>
            <div id="loginError" class="error" style="text-align:center;"></div>
            <div style="margin-top:20px;font-size:0.7rem;text-align:center;color:#aaa;">Customers: customer1 / pastalover<br>Admin: andrew / belfioti2024</div>
        </div>
    `;
    document.getElementById("loginBtn").onclick = () => {
        const user = document.getElementById("username").value;
        const pass = document.getElementById("password").value;
        if (validUsers[user] && validUsers[user].password === pass) {
            currentUser = { username: user, ...validUsers[user] };
            loadPrices().then(() => {
                if (currentUser.type === "admin") renderAdminDashboard();
                else renderCustomerOrder();
            });
        } else {
            document.getElementById("loginError").innerText = "Invalid username or password";
        }
    };
}

// ========== LOAD PRICES FROM FIREBASE ==========
async function loadPrices() {
    const doc = await db.collection("settings").doc("pastaPrices").get();
    if (doc.exists) {
        prices = doc.data();
    } else {
        pastas.forEach(p => { prices[p.name] = p.basePrice; });
        await db.collection("settings").doc("pastaPrices").set(prices);
    }
    return prices;
}

async function savePrices() {
    for (let p of pastas) {
        const input = document.getElementById(`price_${p.id}`);
        if (input) prices[p.name] = parseFloat(input.value);
    }
    await db.collection("settings").doc("pastaPrices").set(prices);
    alert("Prices saved");
    if (currentUser.type === "admin") renderAdminDashboard();
}

// ========== CUSTOMER ORDER PAGE ==========
function renderCustomerOrder() {
    let pastaHtml = "";
    for (let p of pastas) {
        const currentQty = orderQuantities[p.name] || 0;
        pastaHtml += `
            <div class="pasta-item">
                <div class="pasta-name"><strong>${p.name}</strong><br><span style="font-size:0.65rem;color:#aaa;">${p.code}</span></div>
                <div class="pasta-price">$${(prices[p.name] || p.basePrice).toFixed(2)} / 500g</div>
                <div class="pasta-qty">
                    <input type="number" id="qty_${p.id}" value="${currentQty}" min="0" max="99" step="1" style="width:80px;">
                </div>
            </div>
        `;
    }
    
    document.getElementById("app").innerHTML = `
        <div class="header">
            <div><h1>Belfioti Pasta</h1><div style="font-size:0.7rem;">Pascoe Vale, Melbourne · Imported Flour & Water · Very Digestible</div></div>
            <div class="abn">ABN: 12 345 678 901</div>
        </div>
        <div class="container">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;">
                <h2>Welcome, ${currentUser.name}</h2>
                <button id="logoutBtn" style="width:auto;padding:8px 20px;">Logout</button>
            </div>
            <div class="card">
                <h2>Our 12 Artisan Pastas</h2>
                <p style="margin-bottom:15px;font-size:0.8rem;">Made with imported Italian flour and pure Australian water. Highly digestible.</p>
                <div id="pastaList">${pastaHtml}</div>
                <div class="total-box">
                    <div>Total Amount</div>
                    <div class="total-amount" id="totalAmount">$0.00</div>
                </div>
                <div class="invoice-actions">
                    <button id="generateInvoiceBtn">Generate Invoice</button>
                    <button id="emailInvoiceBtn">Email Invoice</button>
                    <button id="smsInvoiceBtn">SMS Invoice</button>
                    <button id="shareInvoiceBtn">Share Message</button>
                </div>
                <div id="orderStatus" style="margin-top:15px;text-align:center;font-size:0.8rem;color:#d4af37;"></div>
            </div>
            <div class="footer">Belfioti · Handmade Artisan Pasta · Pascoe Vale, Melbourne</div>
        </div>
    `;
    
    // Attach quantity change listeners
    for (let p of pastas) {
        const input = document.getElementById(`qty_${p.id}`);
        if (input) {
            input.onchange = () => {
                const val = parseInt(input.value) || 0;
                orderQuantities[p.name] = val;
                updateTotal();
            };
        }
    }
    
    document.getElementById("logoutBtn").onclick = () => { currentUser = null; orderQuantities = {}; showLogin(); };
    document.getElementById("generateInvoiceBtn").onclick = generateInvoice;
    document.getElementById("emailInvoiceBtn").onclick = () => sendInvoice("email");
    document.getElementById("smsInvoiceBtn").onclick = () => sendInvoice("sms");
    document.getElementById("shareInvoiceBtn").onclick = () => sendInvoice("share");
    updateTotal();
}

function updateTotal() {
    let total = 0;
    for (let p of pastas) {
        const qty = orderQuantities[p.name] || 0;
        total += qty * (prices[p.name] || p.basePrice);
    }
    document.getElementById("totalAmount").innerText = `$${total.toFixed(2)}`;
    return total;
}

async function generateInvoice() {
    const total = updateTotal();
    const items = [];
    for (let p of pastas) {
        const qty = orderQuantities[p.name] || 0;
        if (qty > 0) {
            items.push({ name: p.name, code: p.code, qty: qty, price: prices[p.name] || p.basePrice, subtotal: qty * (prices[p.name] || p.basePrice) });
        }
    }
    
    if (items.length === 0) {
        document.getElementById("orderStatus").innerText = "Please select at least one pasta";
        return;
    }
    
    const invoice = {
        invoiceNumber: "INV-" + Date.now(),
        customerName: currentUser.name,
        date: new Date().toLocaleString(),
        items: items,
        total: total,
        status: "pending"
    };
    
    // Save to Firebase
    await db.collection("orders").add({
        ...invoice,
        customerUsername: currentUser.username,
        timestamp: firebase.firestore.FieldValue.serverTimestamp()
    });
    
    // Generate HTML invoice for display
    let itemsHtml = "";
    for (let i of items) {
        itemsHtml += `<tr><td>${i.name}</td><td>${i.code}</td><td>${i.qty}</td><td>$${i.price.toFixed(2)}</td><td>$${i.subtotal.toFixed(2)}</td></tr>`;
    }
    
    const invoiceHtml = `
        <div style="font-family:'Century Gothic',sans-serif;padding:20px;max-width:600px;margin:0 auto;">
            <h1 style="color:#d4af37;">Belfioti Pasta</h1>
            <p>Pascoe Vale, Melbourne<br>ABN: 12 345 678 901</p>
            <hr>
            <p><strong>Invoice:</strong> ${invoice.invoiceNumber}</p>
            <p><strong>Customer:</strong> ${invoice.customerName}</p>
            <p><strong>Date:</strong> ${invoice.date}</p>
            <hr>
            <table style="width:100%;border-collapse:collapse;">
                <thead><tr><th>Product</th><th>Code</th><th>Qty</th><th>Price</th><th>Subtotal</th></tr></thead>
                <tbody>${itemsHtml}</tbody>
            </table>
            <hr>
            <h2 style="text-align:right;">Total: $${invoice.total.toFixed(2)}</h2>
            <p style="font-size:0.7rem;margin-top:20px;">Thank you for ordering from Belfioti.<br>Imported Italian flour · Very digestible</p>
        </div>
    `;
    
    // Store invoice data for sharing
    window.currentInvoice = { html: invoiceHtml, invoice: invoice };
    
    document.getElementById("orderStatus").innerHTML = `Invoice generated! Total: $${total.toFixed(2)}`;
    setTimeout(() => document.getElementById("orderStatus").innerHTML = "", 3000);
    
    // Open print/download dialog
    const win = window.open();
    win.document.write(invoiceHtml);
    win.document.close();
    
    // Clear quantities after order
    for (let p of pastas) {
        orderQuantities[p.name] = 0;
        const input = document.getElementById(`qty_${p.id}`);
        if (input) input.value = 0;
    }
    updateTotal();
}

async function sendInvoice(method) {
    if (!window.currentInvoice) {
        document.getElementById("orderStatus").innerText = "Generate invoice first";
        return;
    }
    
    const invoice = window.currentInvoice.invoice;
    const total = invoice.total;
    
    if (method === "email") {
        const email = prompt("Enter customer email address:");
        if (email) {
            document.getElementById("orderStatus").innerHTML = `Invoice would be emailed to ${email}`;
            // In production: use EmailJS or backend API
        }
    } else if (method === "sms") {
        const phone = prompt("Enter phone number (Australian):");
        if (phone) {
            document.getElementById("orderStatus").innerHTML = `Invoice would be sent via SMS to ${phone}`;
        }
    } else if (method === "share") {
        const message = `Belfioti Invoice ${invoice.invoiceNumber}\nTotal: $${total.toFixed(2)}\nThank you for your order!`;
        if (navigator.share) {
            await navigator.share({ title: "Belfioti Invoice", text: message });
        } else {
            navigator.clipboard.writeText(message);
            document.getElementById("orderStatus").innerHTML = "Invoice details copied to clipboard";
        }
    }
}

// ========== ADMIN DASHBOARD ==========
function renderAdminDashboard() {
    document.getElementById("app").innerHTML = `
        <div class="header">
            <div><h1>Belfioti Pasta · Admin Portal</h1><div style="font-size:0.7rem;">Pascoe Vale, Melbourne</div></div>
            <div class="abn">ABN: 12 345 678 901</div>
        </div>
        <div class="container">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;">
                <h2>Welcome, Andrew</h2>
                <button id="logoutBtn" style="width:auto;padding:8px 20px;">Logout</button>
            </div>
            <div class="tabs">
                <button class="tab-btn active" data-tab="orders">Live Orders</button>
                <button class="tab-btn" data-tab="prices">Set Prices</button>
                <button class="tab-btn" data-tab="inventory">Inventory</button>
            </div>
            <div id="ordersTab" class="tab-content active">
                <div class="card">
                    <h2>Live Customer Orders</h2>
                    <div id="liveOrders" class="orders-list">Loading orders...</div>
                </div>
            </div>
            <div id="pricesTab" class="tab-content">
                <div class="card">
                    <h2>Set Pasta Prices (AUD per 500g)</h2>
                    <div id="priceList"></div>
                    <button id="savePricesBtn">Save Prices</button>
                </div>
            </div>
            <div id="inventoryTab" class="tab-content">
                <div class="card">
                    <h2>Inventory Management</h2>
                    <label>Store Location</label>
                    <select id="storeSelect"><option>Pascoe Vale HQ</option><option>Main Street</option><option>Westfield Plaza</option></select>
                    <label>Driver</label>
                    <select id="driverSelect"><option>Driver Andrew</option><option>Driver Mike</option><option>Driver Sarah</option></select>
                    <div class="balance-box" style="background:#07161f;padding:15px;border-radius:12px;margin:15px 0;text-align:center;">
                        <div>Current Stock (kg)</div>
                        <div style="font-size:2rem;color:#d4af37;" id="currentBalance">0</div>
                    </div>
                    <input type="number" id="openingAmount" placeholder="Opening Stock (kg)" value="100">
                    <button id="setOpeningBtn">Set Opening Stock</button>
                    <select id="invPastaSelect"></select>
                    <input type="number" id="invQty" placeholder="Quantity (kg)" value="5">
                    <div style="display:flex;gap:10px;margin-top:10px;">
                        <button id="addStockBtn">Add Stock</button>
                        <button id="removeStockBtn" style="background:#8b3a2a;">Remove/Sell</button>
                    </div>
                    <button id="closeShiftBtn" style="margin-top:10px;background:#8b3a2a;">Close Shift</button>
                    <div id="invMsg" style="margin-top:10px;font-size:0.75rem;"></div>
                </div>
            </div>
            <div class="footer">Belfioti · Handmade Artisan Pasta · Pascoe Vale, Melbourne</div>
        </div>
    `;
    
    // Load prices into admin panel
    const priceContainer = document.getElementById("priceList");
    if (priceContainer) {
        priceContainer.innerHTML = "";
        for (let p of pastas) {
            const div = document.createElement("div");
            div.style.display = "flex";
            div.style.gap = "10px";
            div.style.margin = "10px 0";
            div.style.alignItems = "center";
            div.innerHTML = `<span style="flex:2;">${p.name} (${p.code})</span><span>$</span><input type="number" id="price_${p.id}" value="${prices[p.name] || p.basePrice}" step="0.5" style="flex:1;">`;
            priceContainer.appendChild(div);
        }
    }
    
    document.getElementById("savePricesBtn").onclick = savePrices;
    document.getElementById("logoutBtn").onclick = () => { if(adminOrdersListener) adminOrdersListener(); currentUser = null; showLogin(); };
    
    // Inventory setup
    const invSelect = document.getElementById("invPastaSelect");
    if (invSelect) {
        invSelect.innerHTML = "";
        for (let p of pastas) {
            const opt = document.createElement("option");
            opt.value = p.name;
            opt.innerText = `${p.name} (${p.code})`;
            invSelect.appendChild(opt);
        }
    }
    
    // Load inventory from localStorage
    let balances = JSON.parse(localStorage.getItem("belfioti_inventory") || "{}");
    function getInventoryKey() { return document.getElementById("storeSelect").value + "|" + document.getElementById("driverSelect").value; }
    function updateInventoryDisplay() { document.getElementById("currentBalance").innerText = (balances[getInventoryKey()] || 0).toFixed(1); }
    updateInventoryDisplay();
    
    document.getElementById("setOpeningBtn").onclick = () => {
        const key = getInventoryKey();
        const val = parseFloat(document.getElementById("openingAmount").value);
        if (!isNaN(val)) { balances[key] = val; localStorage.setItem("belfioti_inventory", JSON.stringify(balances)); updateInventoryDisplay(); }
    };
    document.getElementById("addStockBtn").onclick = () => {
        const key = getInventoryKey();
        const qty = parseFloat(document.getElementById("invQty").value);
        if (!isNaN(qty) && qty > 0) { balances[key] = (balances[key] || 0) + qty; localStorage.setItem("belfioti_inventory", JSON.stringify(balances)); updateInventoryDisplay(); document.getElementById("invMsg").innerText = `Added ${qty}kg`; setTimeout(()=>document.getElementById("invMsg").innerText="",2000); }
    };
    document.getElementById("removeStockBtn").onclick = () => {
        const key = getInventoryKey();
        const qty = parseFloat(document.getElementById("invQty").value);
        const current = balances[key] || 0;
        if (!isNaN(qty) && qty > 0 && current >= qty) { balances[key] = current - qty; localStorage.setItem("belfioti_inventory", JSON.stringify(balances)); updateInventoryDisplay(); document.getElementById("invMsg").innerText = `Removed ${qty}kg`; setTimeout(()=>document.getElementById("invMsg").innerText="",2000); }
        else if (current < qty) document.getElementById("invMsg").innerText = "Insufficient stock";
    };
    document.getElementById("closeShiftBtn").onclick = () => {
        const key = getInventoryKey();
        if (confirm("Close shift? Stock will reset to 0.")) { balances[key] = 0; localStorage.setItem("belfioti_inventory", JSON.stringify(balances)); updateInventoryDisplay(); }
    };
    document.getElementById("storeSelect").onchange = updateInventoryDisplay;
    document.getElementById("driverSelect").onchange = updateInventoryDisplay;
    
    // Live orders listener
    if (adminOrdersListener) adminOrdersListener();
    adminOrdersListener = db.collection("orders").orderBy("timestamp", "desc").onSnapshot((snapshot) => {
        const container = document.getElementById("liveOrders");
        if (!container) return;
        if (snapshot.empty) { container.innerHTML = "<div style='padding:20px;text-align:center;'>No orders yet</div>"; return; }
        let html = "";
        snapshot.forEach(doc => {
            const o = doc.data();
            const date = o.timestamp?.toDate?.() ? o.timestamp.toDate().toLocaleString() : "Just now";
            let itemsHtml = "";
            if (o.items && o.items.length) {
                for (let item of o.items) itemsHtml += `<div>${item.name} x${item.qty} - $${item.subtotal.toFixed(2)}</div>`;
            }
            html += `<div class="order-item">
                        <div><strong>${o.customerName}</strong> - ${o.invoiceNumber || "Order"}</div>
                        <div style="font-size:0.7rem;">${date}</div>
                        <div style="font-size:0.75rem;margin:8px 0;">${itemsHtml || `${o.items?.length || 0} items`}</div>
                        <div><strong>Total: $${(o.total || 0).toFixed(2)}</strong></div>
                        <div style="margin-top:8px;"><span class="status-${o.status || 'pending'}">${o.status || 'pending'}</span>
                        ${(o.status === 'pending' || !o.status) ? `<button onclick="markOrderComplete('${doc.id}')" style="width:auto;padding:4px 12px;margin-left:10px;font-size:0.7rem;">Mark Complete</button>` : ''}</div>
                    </div>`;
        });
        container.innerHTML = html;
    });
    
    window.markOrderComplete = async (id) => { await db.collection("orders").doc(id).update({ status: "completed" }); };
    
    // Setup tab switching
    document.querySelectorAll(".tab-btn").forEach(btn => {
        btn.onclick = () => {
            document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
            btn.classList.add("active");
            document.querySelectorAll(".tab-content").forEach(t => t.classList.remove("active"));
            document.getElementById(btn.dataset.tab + "Tab").classList.add("active");
        };
    });
}

// ========== START ==========
showLogin();
</script>
</body>
</html>
