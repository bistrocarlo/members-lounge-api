<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Member's Lounge - Staff Availability</title>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #f5f5f5; padding: 20px; }
        .container { max-width: 1300px; margin: 0 auto; }
        .header { background: #D4AF37; padding: 20px; border-radius: 10px; margin-bottom: 20px; text-align: center; }
        .header h1 { color: #1a1a1a; }
        .card { background: white; border-radius: 10px; padding: 20px; margin-bottom: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .staff-selector { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 20px; }
        .staff-btn { background: #e0e0e0; border: none; padding: 12px 20px; border-radius: 30px; cursor: pointer; font-size: 14px; font-weight: bold; }
        .staff-btn.active { background: #D4AF37; color: white; }
        .dates-grid { display: grid; gap: 10px; margin-top: 20px; }
        .date-row { display: flex; justify-content: space-between; align-items: center; padding: 12px; background: #fafafa; border-radius: 8px; flex-wrap: wrap; gap: 10px; }
        .date-info { flex: 2; }
        .date-info strong { font-size: 16px; }
        .date-info small { color: #666; }
        .checkbox-label { display: flex; align-items: center; gap: 10px; cursor: pointer; }
        .checkbox-label input { width: 20px; height: 20px; cursor: pointer; }
        .save-btn { background: #D4AF37; border: none; padding: 14px 30px; border-radius: 30px; cursor: pointer; font-size: 16px; font-weight: bold; margin-top: 20px; width: 100%; }
        .save-btn:hover { background: #b58f2a; color: white; }
        .team-table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        .team-table th, .team-table td { padding: 10px; text-align: left; border-bottom: 1px solid #ddd; }
        .team-table th { background: #f5f5f5; position: sticky; top: 0; }
        .available { background: #D4AF37; color: white; padding: 4px 10px; border-radius: 20px; font-size: 12px; display: inline-block; }
        .not-available { background: #e0e0e0; color: #999; padding: 4px 10px; border-radius: 20px; font-size: 12px; display: inline-block; }
        .loading { text-align: center; padding: 40px; color: #666; }
        .message { padding: 15px; border-radius: 8px; margin: 10px 0; display: none; }
        .message.success { background: #e8f5e9; color: #2e7d32; display: block; }
        .table-wrapper { overflow-x: auto; max-height: 500px; overflow-y: auto; }
        @media (max-width: 768px) {
            .date-row { flex-direction: column; align-items: flex-start; }
            .staff-btn { padding: 8px 15px; font-size: 12px; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>🏢 Member's Lounge</h1>
        <p>Staff Availability Sheet - Live Updates</p>
    </div>

    <!-- Staff Selection -->
    <div class="card">
        <h3>1. Select Your Name</h3>
        <div id="staffButtons" class="staff-selector"></div>
        <div id="loginError" style="color: red; margin-top: 10px;"></div>
    </div>

    <!-- Availability Selection (shown after staff selected) -->
    <div id="availabilitySection" style="display: none;">
        <div class="card">
            <h3>2. Mark Your Available Dates</h3>
            <div id="datesList" class="dates-grid"></div>
            <button id="saveBtn" class="save-btn">💾 Save My Availability</button>
            <div id="saveMessage" class="message"></div>
        </div>
    </div>

    <!-- Team View - Live Updates -->
    <div class="card">
        <h3>3. Team Availability (Live View)</h3>
        <div class="table-wrapper" id="teamView">
            <div class="loading">Loading team data...</div>
        </div>
    </div>
</div>

<script>
    // FIREBASE CONFIGURATION - Your provided config
    const firebaseConfig = {
        apiKey: "AIzaSyA0rDZ8NMo0cirWEPlIzt_Uq12qnOSBtPk",
        authDomain: "staff-roster-e0940.firebaseapp.com",
        projectId: "staff-roster-e0940",
        storageBucket: "staff-roster-e0940.firebasestorage.app",
        messagingSenderId: "176909786012",
        appId: "1:176909786012:web:be5a85f39c943915a00659"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // Staff list - Add all your staff here
    const STAFF_LIST = [
        { id: "staff1", name: "Carlo Pavia", code: "CARLO6", section: "Manager" },
        { id: "staff2", name: "Michelle Pavia", code: "MICHE0", section: "Manager" },
        { id: "staff3", name: "Rohitha Rawan", code: "ROHIT9", section: "Kitchen" },
        { id: "staff4", name: "Nam Lai", code: "NAMLA7", section: "Kitchen" },
        { id: "staff5", name: "Franco Schiavo", code: "FRANC3", section: "Kitchen" },
        { id: "staff6", name: "Peter Tricarico", code: "PETER8", section: "Floor" },
        { id: "staff7", name: "Claudio Bottigliero", code: "CLAUDI", section: "Bar" },
        { id: "staff8", name: "Remzi Asllanaj", code: "REMZIA", section: "Bar" }
    ];

    // Upcoming events
    const EVENTS_LIST = [
        { id: "ev1", date: "2026-04-18", venue: "Fior Events" },
        { id: "ev2", date: "2026-05-09", venue: "Fior Events" },
        { id: "ev3", date: "2026-05-17", venue: "Sala Reggio Ballroom" },
        { id: "ev4", date: "2026-05-22", venue: "Sala Reggio Ballroom" },
        { id: "ev5", date: "2026-05-23", venue: "Sala Reggio Ballroom" },
        { id: "ev6", date: "2026-05-24", venue: "Sala Reggio Ballroom" },
        { id: "ev7", date: "2026-05-29", venue: "Sala Reggio Ballroom" },
        { id: "ev8", date: "2026-05-30", venue: "Sala Reggio Ballroom" },
        { id: "ev9", date: "2026-05-31", venue: "Sala Reggio Ballroom" },
        { id: "ev10", date: "2026-06-07", venue: "Sala Reggio Ballroom" },
        { id: "ev11", date: "2026-06-13", venue: "Sala Reggio Ballroom" },
        { id: "ev12", date: "2026-06-20", venue: "Sala Reggio Ballroom" }
    ];

    let currentStaff = null;
    let allSubmissions = {};

    // Initialize database with default data
    async function initDatabase() {
        try {
            // Add staff to Firestore if not exists
            for (const staff of STAFF_LIST) {
                const docRef = db.collection('staff').doc(staff.id);
                const doc = await docRef.get();
                if (!doc.exists) {
                    await docRef.set(staff);
                }
            }
            
            // Add events to Firestore if not exists
            for (const ev of EVENTS_LIST) {
                const docRef = db.collection('events').doc(ev.id);
                const doc = await docRef.get();
                if (!doc.exists) {
                    await docRef.set(ev);
                }
            }
            
            // Load all data
            await loadData();
            await renderStaffButtons();
            await renderTeamView();
        } catch (err) {
            console.error("Init error:", err);
        }
    }

    // Load all submissions from Firestore
    async function loadData() {
        try {
            const submissionsSnap = await db.collection('submissions').get();
            allSubmissions = {};
            submissionsSnap.forEach(doc => {
                allSubmissions[doc.id] = doc.data().eventIds || [];
            });
        } catch (err) {
            console.error("Load error:", err);
        }
    }

    // Listen for real-time updates from Firestore
    function listenForUpdates() {
        db.collection('submissions').onSnapshot(async (snapshot) => {
            allSubmissions = {};
            snapshot.forEach(doc => {
                allSubmissions[doc.id] = doc.data().eventIds || [];
            });
            await renderTeamView();
            if (currentStaff) {
                await renderDates();
            }
        });
    }

    // Render staff selection buttons
    async function renderStaffButtons() {
        const container = document.getElementById('staffButtons');
        container.innerHTML = '';
        
        for (const staff of STAFF_LIST) {
            const btn = document.createElement('button');
            btn.textContent = `${staff.name} (${staff.code})`;
            btn.className = 'staff-btn';
            btn.onclick = () => selectStaff(staff);
            container.appendChild(btn);
        }
    }

    // Select a staff member
    async function selectStaff(staff) {
        currentStaff = staff;
        
        // Update button styles
        document.querySelectorAll('.staff-btn').forEach(btn => {
            btn.classList.remove('active');
        });
        event.target.classList.add('active');
        
        // Show availability section
        document.getElementById('availabilitySection').style.display = 'block';
        document.getElementById('loginError').innerHTML = '';
        
        await renderDates();
    }

    // Format date for display
    function formatDate(dateStr) {
        const d = new Date(dateStr);
        return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
    }

    // Render date checkboxes for current staff
    async function renderDates() {
        const container = document.getElementById('datesList');
        if (!container || !currentStaff) return;
        
        container.innerHTML = '';
        const mySubmissions = allSubmissions[currentStaff.id] || [];
        
        for (const ev of EVENTS_LIST) {
            const isChecked = mySubmissions.includes(ev.id);
            const div = document.createElement('div');
            div.className = 'date-row';
            div.innerHTML = `
                <div class="date-info">
                    <strong>${formatDate(ev.date)}</strong><br>
                    <small>${ev.venue}</small>
                </div>
                <label class="checkbox-label">
                    <input type="checkbox" data-id="${ev.id}" ${isChecked ? 'checked' : ''}>
                    I am available to work
                </label>
            `;
            container.appendChild(div);
        }
    }

    // Save availability to Firestore
    async function saveAvailability() {
        if (!currentStaff) {
            alert('Please select your name first');
            return;
        }
        
        const checkboxes = document.querySelectorAll('#datesList input[type="checkbox"]');
        const selected = [];
        checkboxes.forEach(cb => {
            if (cb.checked) selected.push(cb.getAttribute('data-id'));
        });
        
        try {
            await db.collection('submissions').doc(currentStaff.id).set({ eventIds: selected });
            allSubmissions[currentStaff.id] = selected;
            
            const msgDiv = document.getElementById('saveMessage');
            msgDiv.textContent = '✓ Availability saved successfully! Live view updated.';
            msgDiv.className = 'message success';
            setTimeout(() => {
                msgDiv.className = 'message';
            }, 3000);
            
            await renderTeamView();
        } catch (err) {
            alert('Error saving: ' + err.message);
        }
    }

    // Render team availability table (live view)
    async function renderTeamView() {
        const container = document.getElementById('teamView');
        if (!container) return;
        
        if (STAFF_LIST.length === 0) {
            container.innerHTML = '<div class="loading">No staff found</div>';
            return;
        }
        
        let html = '<table class="team-table">';
        html += '<thead>';
        html += '<tr><th>Event Date / Venue</th>';
        
        for (const staff of STAFF_LIST) {
            html += `<th>${staff.name}<br><small>${staff.section}</small></th>`;
        }
        html += '</tr></thead><tbody>';
        
        for (const ev of EVENTS_LIST) {
            html += `<tr><td><strong>${formatDate(ev.date)}</strong><br><small>${ev.venue}</small></td>`;
            for (const staff of STAFF_LIST) {
                const isAvailable = (allSubmissions[staff.id] || []).includes(ev.id);
                html += `<td style="text-align: center;">${isAvailable ? '<span class="available">✓ Available</span>' : '<span class="not-available">✗</span>'}</td>`;
            }
            html += '</tr>';
        }
        
        html += '</tbody></table>';
        container.innerHTML = html;
    }

    // Save button event
    document.getElementById('saveBtn').addEventListener('click', saveAvailability);
    
    // Start the app
    initDatabase();
    listenForUpdates();
</script>
</body>
</html>
