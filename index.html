<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Monday Night Soccer | Clifton Park</title>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800;14..32,900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { background: #f0f4f8; font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; padding: 20px 16px 40px; min-height: 100vh; }
        button, .tab-btn, select, input, textarea { cursor: pointer; min-height: 48px; font-size: 16px; }
        .container { max-width: 720px; margin: 0 auto; }
        
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --accent: #f59e0b;
            --success: #10b981;
            --danger: #ef4444;
            --lime: #84cc16;
            --lime-dark: #65a30d;
            --lime-light: #ecfccb;
            --orange: #f97316;
            --dark: #1e293b;
            --gray: #64748b;
            --light: #f8fafc;
            --border: #e2e8f0;
            --card: #ffffff;
        }
        
        .header { background: var(--card); border-radius: 28px; padding: 20px 16px; margin-bottom: 20px; box-shadow: 0 2px 12px rgba(0,0,0,0.04); border: 1px solid var(--border); text-align: center; }
        .logo-icon { width: 56px; height: 56px; background: linear-gradient(135deg, var(--lime), var(--lime-dark)); border-radius: 20px; display: inline-flex; align-items: center; justify-content: center; margin-bottom: 10px; box-shadow: 0 6px 14px rgba(132,204,22,0.35); }
        .logo-icon i { font-size: 28px; color: white; }
        .header h1 { font-size: 24px; font-weight: 800; color: var(--dark); letter-spacing: -0.3px; }
        .header p { font-size: 12px; color: var(--gray); margin-top: 4px; }
        .user-badge { background: var(--light); padding: 8px 18px; border-radius: 60px; display: inline-flex; align-items: center; gap: 12px; margin-top: 12px; font-weight: 600; font-size: 14px; border: 1px solid var(--border); }
        .user-badge button { background: var(--danger); border: none; padding: 6px 18px; border-radius: 40px; color: white; font-weight: 600; font-size: 13px; cursor: pointer; transition: all 0.2s; }
        
        .info-widget { background: linear-gradient(135deg, var(--dark), #0f172a); border-radius: 24px; padding: 14px 20px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; color: white; gap: 12px; }
        .weather-section { display: flex; align-items: center; gap: 12px; }
        .weather-icon-large { font-size: 36px; }
        .weather-temp-large { font-size: 28px; font-weight: 800; }
        .time-section { text-align: right; }
        .aest-time { font-size: 24px; font-weight: 800; font-family: monospace; }
        .venue-info { font-size: 11px; opacity: 0.8; margin-top: 4px; }
        
        .tab-nav { display: flex; gap: 8px; justify-content: center; margin-bottom: 20px; flex-wrap: wrap; }
        .tab-btn { background: white; border: 1.5px solid var(--border); padding: 12px 20px; border-radius: 60px; font-weight: 700; font-size: 14px; color: var(--gray); display: inline-flex; align-items: center; gap: 8px; cursor: pointer; transition: all 0.2s; }
        .tab-btn:hover { border-color: var(--lime); color: var(--lime-dark); background: var(--lime-light); transform: translateY(-1px); }
        .tab-btn.active { background: var(--lime); color: white; border-color: var(--lime); box-shadow: 0 4px 12px rgba(132,204,22,0.4); }
        
        .panel { display: none; }
        .panel.active-panel { display: block; animation: fadeIn 0.25s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        
        .card { background: var(--card); border-radius: 24px; padding: 20px; margin-bottom: 18px; border: 1px solid var(--border); box-shadow: 0 2px 8px rgba(0,0,0,0.03); }
        .card h2 { font-size: 18px; font-weight: 800; margin-bottom: 16px; color: var(--dark); border-left: 4px solid var(--lime); padding-left: 12px; }
        
        .match-scoreboard { background: linear-gradient(145deg, #1a1a2e, #0f172a); border-radius: 32px; padding: 24px; margin-bottom: 20px; text-align: center; color: white; }
        .score-panel { display: flex; justify-content: center; align-items: center; gap: 30px; margin: 20px 0; flex-wrap: wrap; }
        .team-score-card { text-align: center; background: rgba(255,255,255,0.08); border-radius: 28px; padding: 20px 32px; min-width: 140px; }
        .team-score-number { font-size: 72px; font-weight: 900; line-height: 1; }
        .score-vs { font-size: 36px; font-weight: 800; color: var(--accent); }
        .timer-display { font-size: 48px; font-weight: 800; font-family: monospace; background: rgba(0,0,0,0.4); border-radius: 60px; padding: 16px; display: inline-block; margin: 10px 0; letter-spacing: 4px; }
        .control-buttons { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-top: 16px; }
        .control-buttons button { padding: 12px 24px; font-weight: 700; border-radius: 60px; border: none; cursor: pointer; transition: all 0.1s; }
        .control-buttons button:active { transform: scale(0.96); }
        .goal-lime { background: var(--lime); color: #1a3a00; }
        .goal-orange { background: var(--orange); color: white; }
        
        .standings-table { width: 100%; border-collapse: collapse; background: white; border-radius: 20px; overflow: hidden; }
        .standings-table th, .standings-table td { padding: 14px 8px; text-align: center; border-bottom: 1px solid var(--border); font-size: 13px; }
        .standings-table th { background: var(--lime); color: #1a3a00; font-weight: 800; }
        .lime-row { background: rgba(132,204,22,0.1); }
        .orange-row { background: rgba(249,115,22,0.1); }
        
        .pitch-premium { background: linear-gradient(145deg, #2e7d32, #1b5e20); border-radius: 28px; padding: 20px; border: 2px solid var(--lime); }
        .teams-row { display: flex; gap: 16px; flex-wrap: wrap; }
        .team-card { flex: 1; background: rgba(0,0,0,0.65); backdrop-filter: blur(8px); border-radius: 20px; padding: 16px; min-width: 180px; }
        .team-title { font-size: 20px; font-weight: 800; text-align: center; padding: 10px; border-radius: 60px; margin-bottom: 14px; }
        .lime-title { background: var(--lime); color: #1a3a00; }
        .orange-title { background: var(--orange); color: white; }
        .player-list { display: flex; flex-direction: column; gap: 8px; max-height: 280px; overflow-y: auto; }
        .player-chip { background: rgba(255,255,255,0.15); border-radius: 40px; padding: 8px 12px; text-align: center; font-size: 13px; font-weight: 500; color: white; }
        
        .history-card { background: var(--card); border-radius: 24px; margin-bottom: 20px; border: 1px solid var(--border); overflow: hidden; }
        .history-header { background: var(--light); padding: 16px 20px; border-bottom: 2px solid var(--border); display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
        .history-date { font-weight: 800; font-size: 18px; color: var(--dark); }
        .history-result { background: var(--lime); color: #1a3a00; padding: 6px 18px; border-radius: 60px; font-weight: 800; }
        .history-pitch { background: linear-gradient(145deg, #2e7d32, #1b5e20); padding: 16px; }
        .history-teams { display: flex; gap: 16px; flex-wrap: wrap; }
        .history-team { flex: 1; background: rgba(0,0,0,0.7); border-radius: 20px; padding: 14px; }
        .history-team-name { font-size: 16px; font-weight: 800; text-align: center; padding: 8px; border-radius: 60px; margin-bottom: 12px; }
        .history-players { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; max-height: 100px; overflow-y: auto; }
        .history-player { background: rgba(255,255,255,0.2); border-radius: 40px; padding: 5px 10px; font-size: 11px; color: white; }
        .history-goals { background: var(--lime-light); padding: 14px 18px; }
        .goal-badge { display: inline-block; background: white; border-radius: 40px; padding: 5px 12px; margin: 4px; font-size: 12px; font-weight: 600; }
        .comment-item { background: var(--light); border-radius: 18px; padding: 10px; margin-bottom: 8px; border: 1px solid var(--border); }
        
        .chat-container { background: var(--card); border-radius: 24px; overflow: hidden; border: 1px solid var(--border); }
        .chat-messages { height: 380px; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; background: #fefefe; }
        .chat-message { display: flex; flex-direction: column; max-width: 85%; }
        .chat-message.sent { align-self: flex-end; }
        .chat-message.sent .msg-bubble { background: var(--lime); color: #1a3a00; border-radius: 22px 22px 6px 22px; }
        .chat-message.received .msg-bubble { background: white; color: var(--dark); border-radius: 22px 22px 22px 6px; border: 1px solid var(--border); }
        .msg-bubble { padding: 10px 16px; font-size: 14px; }
        .chat-input-area { padding: 12px; background: white; border-top: 1px solid var(--border); display: flex; gap: 10px; }
        .chat-input-area input { flex: 1; margin: 0; padding: 12px 16px; border-radius: 60px; border: 1px solid var(--border); }
        .chat-input-area button { background: var(--lime); color: #1a3a00; font-weight: 700; }
        
        .data-table { width: 100%; border-collapse: collapse; }
        .data-table th, .data-table td { padding: 12px 10px; text-align: left; border-bottom: 1px solid var(--border); font-size: 13px; }
        .data-table th { background: var(--light); color: var(--lime-dark); font-weight: 800; }
        .attendee-tag { background: var(--light); padding: 8px 16px; border-radius: 40px; font-size: 13px; display: inline-block; margin: 4px; border: 1px solid var(--border); }
        .btn-outline { background: white; color: var(--lime-dark); border: 2px solid var(--lime); }
        .flex-btns { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 15px; }
        
        @media (max-width: 550px) { .team-score-number { font-size: 48px; } .timer-display { font-size: 32px; } .info-widget { flex-direction: column; text-align: center; } .time-section { text-align: center; } .history-teams { flex-direction: column; } }
    </style>
</head>
<body>
<div class="container" id="appContainer">Loading...</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyCWlFqDJyENgrUOhiLXCjSEi4Mk_54SA1w",
        authDomain: "monday-night-soccer-hub.firebaseapp.com",
        projectId: "monday-night-soccer-hub",
        storageBucket: "monday-night-soccer-hub.firebasestorage.app",
        messagingSenderId: "634335208908",
        appId: "1:634335208908:web:dca705b65fc52de0606969"
    };
    
    let db = null;
    try { firebase.initializeApp(firebaseConfig); db = firebase.firestore(); console.log("Firebase ready"); } catch(e) { console.warn("Firebase fallback mode"); }
    
    let players = ["Alex Rowe", "Ali Mekawy", "Carlo", "Charlie", "Chris Del Monaco", "Chris M", "Chris S", "Danny", "Dante", "David", "Dimitri", "Enzo", "Farid", "Faros", "Frank", "George B", "George T", "Ivan", "James Zoumis", "James", "Joe T", "Joey", "Kia", "Leo", "Manoli", "Marco", "Mario", "Maurice", "Nector", "Paul", "Perri", "Peter", "Ralph", "Rocco", "Stav", "Stevan", "Theo", "Tony EH", "Vasilis"].sort();
    let teamAssignments = {}, matchResults = {}, payments = [], attendance = [], guests = [], matchComments = {};
    let isAdminLoggedIn = false, currentUser = null;
    const WEEKLY_FEE = 5;
    
    let matchTimer = null, timerRunning = false, timerSeconds = 0;
    let limeScore = 0, orangeScore = 0;
    
    function getMelbourneDate() {
        const now = new Date();
        const utc = now.getTime() + (now.getTimezoneOffset() * 60000);
        return new Date(utc + (11 * 3600000)).toISOString().split('T')[0];
    }
    function generateWeeks() {
        const year = new Date().getFullYear();
        let start = new Date(year, 0, 1);
        while (start.getDay() !== 1) start.setDate(start.getDate() + 1);
        let weeks = [], cur = new Date(start);
        let dec31 = new Date(year, 11, 31);
        let lastMonday = new Date(dec31);
        while (lastMonday.getDay() !== 1) lastMonday.setDate(lastMonday.getDate() - 1);
        let secondLast = new Date(lastMonday);
        secondLast.setDate(secondLast.getDate() - 7);
        while (cur <= secondLast) {
            weeks.push({ dateStr: cur.toISOString().split('T')[0], label: `Mon ${cur.toLocaleDateString('en-AU', { day:'numeric', month:'short' })}` });
            cur.setDate(cur.getDate() + 7);
        }
        return weeks;
    }
    const ALL_WEEKS = generateWeeks();
    function getFutureWeeks() { return ALL_WEEKS.filter(w => w.dateStr >= getMelbourneDate()); }
    function getPastWeeks() { return ALL_WEEKS.filter(w => w.dateStr < getMelbourneDate()).reverse(); }
    
    async function getWeather() {
        try {
            const res = await fetch('https://wttr.in/Melbourne?format=%C|%t&m');
            const data = await res.text();
            const parts = data.split('|');
            return { condition: parts[0] || 'Clear', temp: parts[1] || '18°C' };
        } catch(e) { return { condition: 'Partly Cloudy', temp: '18°C' }; }
    }
    
    function updateTime() {
        const now = new Date();
        const utc = now.getTime() + (now.getTimezoneOffset() * 60000);
        const melb = new Date(utc + (11 * 3600000));
        const timeEl = document.getElementById('aestTime');
        const dateEl = document.getElementById('aestDate');
        if (timeEl) timeEl.textContent = melb.toLocaleTimeString('en-AU', { hour:'2-digit', minute:'2-digit', second:'2-digit' });
        if (dateEl) dateEl.textContent = melb.toLocaleDateString('en-AU', { weekday:'short', day:'numeric', month:'short' });
    }
    
    async function loadData() {
        if(!db) return;
        try {
            const pDoc = await db.collection("config").doc("players").get();
            if(pDoc.exists && pDoc.data().list) players = pDoc.data().list.sort();
            const tDoc = await db.collection("config").doc("teamAssignments").get();
            if(tDoc.exists) teamAssignments = tDoc.data();
            const rDoc = await db.collection("config").doc("matchResults").get();
            if(rDoc.exists) matchResults = rDoc.data();
            const paySnap = await db.collection("payments").get();
            payments = []; paySnap.forEach(d => payments.push(d.data()));
            const attSnap = await db.collection("attendance").get();
            attendance = []; attSnap.forEach(d => attendance.push(d.data()));
            const guestSnap = await db.collection("guests").get();
            guests = []; guestSnap.forEach(d => guests.push(d.data()));
            const commentSnap = await db.collection("matchComments").get();
            matchComments = {};
            commentSnap.forEach(d => { const data = d.data(); if (!matchComments[data.gameDate]) matchComments[data.gameDate] = []; matchComments[data.gameDate].push(data); });
        } catch(e) { console.warn(e); }
    }
    async function savePlayers() { if(db) await db.collection("config").doc("players").set({ list: players }); }
    async function saveTeams() { if(db) await db.collection("config").doc("teamAssignments").set(teamAssignments); }
    async function saveResults() { if(db) await db.collection("config").doc("matchResults").set(matchResults); }
    async function savePayment(p) { if(db) await db.collection("payments").doc(`${p.player}_${p.gameDate}`).set(p); payments.push(p); }
    async function saveAttendance(a) { if(db) await db.collection("attendance").doc(`${a.player}_${a.gameDate}`).set(a); const idx = attendance.findIndex(x=>x.player===a.player&&x.gameDate===a.gameDate); if(idx!==-1) attendance[idx]=a; else attendance.push(a); }
    async function saveGuest(g) { if(db) await db.collection("guests").doc(`${g.guestName}_${g.gameDate}`).set(g); guests.push(g); }
    async function saveComment(gameDate, author, text) { const comment = { gameDate, author, text, timestamp: Date.now() }; if(db) await db.collection("matchComments").add(comment); if (!matchComments[gameDate]) matchComments[gameDate] = []; matchComments[gameDate].push(comment); renderHistory(); }
    
    function loginPlayer(name) { currentUser = { name, role: "player" }; isAdminLoggedIn = false; localStorage.setItem("soccer_user", JSON.stringify(currentUser)); renderApp(); }
    function loginAdmin(pw) { if(pw === "admin123") { currentUser = { name: "Admin", role: "admin" }; isAdminLoggedIn = true; localStorage.setItem("soccer_user", JSON.stringify(currentUser)); renderApp(); return true; } return false; }
    function logout() { if(matchTimer) clearInterval(matchTimer); currentUser = null; localStorage.removeItem("soccer_user"); renderLogin(); }
    
    function formatSec(sec) { const m = Math.floor(sec / 60); const s = sec % 60; return `${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`; }
    function updateScoreUI() {
        const limeEl = document.getElementById('limeScoreVal');
        const orangeEl = document.getElementById('orangeScoreVal');
        const timerEl = document.getElementById('timerVal');
        if(limeEl) limeEl.textContent = limeScore;
        if(orangeEl) orangeEl.textContent = orangeScore;
        if(timerEl) timerEl.textContent = formatSec(timerSeconds);
    }
    function startTimer() { if(matchTimer) clearInterval(matchTimer); timerRunning = true; matchTimer = setInterval(() => { if(timerRunning) { timerSeconds++; updateScoreUI(); } }, 1000); }
    function pauseTimer() { timerRunning = false; }
    function resetTimer() { timerRunning = false; timerSeconds = 0; limeScore = 0; orangeScore = 0; updateScoreUI(); if(matchTimer) clearInterval(matchTimer); matchTimer = null; }
    function addLimeGoal() { limeScore++; updateScoreUI(); }
    function addOrangeGoal() { orangeScore++; updateScoreUI(); }
    
    // Calculate Standings with 3-point rule
    function calculateStandings() {
        const startDate = "2026-02-01";
        const pastWeeks = ALL_WEEKS.filter(w => w.dateStr >= startDate && w.dateStr < getMelbourneDate());
        
        let lime = { played: 0, wins: 0, draws: 0, losses: 0, gf: 0, ga: 0, points: 0 };
        let orange = { played: 0, wins: 0, draws: 0, losses: 0, gf: 0, ga: 0, points: 0 };
        
        pastWeeks.forEach(week => {
            const result = matchResults[week.dateStr];
            if (!result) return;
            const lScore = result.limeScore !== undefined ? result.limeScore : (result.yellowScore || 0);
            const oScore = result.orangeScore || 0;
            
            lime.played++; orange.played++;
            lime.gf += lScore; lime.ga += oScore;
            orange.gf += oScore; orange.ga += lScore;
            
            if (lScore > oScore) { lime.wins++; lime.points += 3; orange.losses++; }
            else if (oScore > lScore) { orange.wins++; orange.points += 3; lime.losses++; }
            else { lime.draws++; orange.draws++; lime.points += 1; orange.points += 1; }
        });
        
        lime.losses = lime.played - lime.wins - lime.draws;
        orange.losses = orange.played - orange.wins - orange.draws;
        
        return { lime, orange };
    }
    
    async function renderApp() {
        await loadData();
        const weather = await getWeather();
        const weatherIcon = weather.condition.includes('Rain') ? '🌧️' : (weather.condition.includes('Cloud') ? '☁️' : '☀️');
        const standings = calculateStandings();
        
        document.getElementById("appContainer").innerHTML = `
            <div class="header"><div class="logo-icon"><i class="fas fa-futbol"></i></div><h1>MONDAY NIGHT SOCCER</h1><p>Clifton Park, Brunswick • Victoria Street, Melbourne</p><div class="user-badge"><i class="fas fa-user-circle"></i> ${currentUser.role === "admin" ? "ADMIN" : currentUser.name}<button id="logoutBtn">Exit</button></div></div>
            <div class="info-widget"><div class="weather-section"><div class="weather-icon-large">${weatherIcon}</div><div><div class="weather-temp-large">${weather.temp}</div><div class="weather-detail">${weather.condition}</div></div></div><div class="time-section"><div class="aest-time" id="aestTime">--:--:--</div><div class="aest-date" id="aestDate">Loading...</div><div class="venue-info"><i class="fas fa-map-pin"></i> Clifton Park, VIC</div></div></div>
            <div class="tab-nav" id="tabNav"></div><div id="panelContainer"></div>
        `;
        document.getElementById("logoutBtn").onclick = logout;
        setInterval(updateTime, 1000);
        updateTime();
        
        const tabs = [
            { id: "match", label: "MATCH", icon: "fa-stopwatch" },
            { id: "standings", label: "STANDINGS", icon: "fa-table" },
            { id: "rsvp", label: "RSVP", icon: "fa-calendar" },
            { id: "teams", label: "TEAMS", icon: "fa-users" },
            { id: "chat", label: "CHAT", icon: "fa-comments" },
            { id: "history", label: "HISTORY", icon: "fa-history" },
            { id: "stats", label: "LEADERS", icon: "fa-trophy" },
            { id: "rules", label: "RULES", icon: "fa-book" }
        ];
        if (isAdminLoggedIn) tabs.unshift({ id: "admin", label: "ADMIN", icon: "fa-shield" }, { id: "finance", label: "FINANCE", icon: "fa-dollar-sign" });
        
        document.getElementById("tabNav").innerHTML = tabs.map(t => `<button class="tab-btn" data-tab="${t.id}"><i class="fas ${t.icon}"></i> ${t.label}</button>`).join('');
        document.getElementById("panelContainer").innerHTML = tabs.map(t => `<div id="panel-${t.id}" class="panel"></div>`).join('');
        
        document.querySelectorAll(".tab-btn").forEach(btn => {
            btn.onclick = () => {
                const id = btn.getAttribute("data-tab");
                document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
                btn.classList.add("active");
                document.querySelectorAll(".panel").forEach(p => p.classList.remove("active-panel"));
                document.getElementById(`panel-${id}`).classList.add("active-panel");
                if (id === "match") renderMatch();
                if (id === "standings") renderStandings();
                if (id === "rsvp") renderRSVP();
                if (id === "teams") renderTeams();
                if (id === "chat") renderChat();
                if (id === "history") renderHistory();
                if (id === "stats") renderStats();
                if (id === "rules") renderRules();
                if (id === "admin" && isAdminLoggedIn) renderAdmin();
                if (id === "finance" && isAdminLoggedIn) renderFinance();
            };
        });
        document.querySelector(".tab-btn").click();
    }
    
    function renderMatch() {
        document.getElementById("panel-match").innerHTML = `
            <div class="match-scoreboard">
                <div class="score-panel">
                    <div class="team-score-card"><div style="background:#84cc1620; border-radius:60px; padding:8px 16px; margin-bottom:8px;">🟢 LIME</div><div class="team-score-number" id="limeScoreVal">0</div></div>
                    <div class="score-vs">VS</div>
                    <div class="team-score-card"><div style="background:#f9731620; border-radius:60px; padding:8px 16px; margin-bottom:8px;">🟠 ORANGE</div><div class="team-score-number" id="orangeScoreVal">0</div></div>
                </div>
                <div class="timer-display" id="timerVal">00:00</div>
                <div class="control-buttons">
                    <button class="goal-lime" onclick="window.addLimeGoal()">🟢 LIME +1</button>
                    <button class="goal-orange" onclick="window.addOrangeGoal()">🟠 ORANGE +1</button>
                    <button style="background:#10b981;" onclick="window.startTimer()">▶ START</button>
                    <button style="background:#f59e0b;" onclick="window.pauseTimer()">⏸ PAUSE</button>
                    <button style="background:#ef4444;" onclick="window.resetTimer()">🔄 RESET</button>
                </div>
            </div>
            <div class="card"><h2><i class="fas fa-info-circle"></i> Live Match Tracker</h2><p>Track goals and match time for Monday Night Soccer at Clifton Park, Brunswick.</p></div>
        `;
        updateScoreUI();
    }
    
    function renderStandings() {
        const { lime, orange } = calculateStandings();
        const limeGD = lime.gf - lime.ga;
        const orangeGD = orange.gf - orange.ga;
        
        document.getElementById("panel-standings").innerHTML = `
            <div class="card"><h2><i class="fas fa-table"></i> 2026 Season Standings · 3-Point Rule</h2>
                <table class="standings-table">
                    <thead><tr><th>Team</th><th>P</th><th>W</th><th>D</th><th>L</th><th>GF</th><th>GA</th><th>GD</th><th>Pts</th></tr></thead>
                    <tbody>
                        <tr class="lime-row"><td><strong>🟢 LIME</strong></td><td>${lime.played}</td><td>${lime.wins}</td><td>${lime.draws}</td><td>${lime.losses}</td><td>${lime.gf}</td><td>${lime.ga}</td><td>${limeGD >= 0 ? '+' : ''}${limeGD}</td><td style="font-weight:900; font-size:16px;">${lime.points}</td></tr>
                        <tr class="orange-row"><td><strong>🟠 ORANGE</strong></td><td>${orange.played}</td><td>${orange.wins}</td><td>${orange.draws}</td><td>${orange.losses}</td><td>${orange.gf}</td><td>${orange.ga}</td><td>${orangeGD >= 0 ? '+' : ''}${orangeGD}</td><td style="font-weight:900; font-size:16px;">${orange.points}</td></tr>
                    </tbody>
                </table>
                <p style="font-size:12px; color:#64748b; margin-top:12px;"><i class="fas fa-info-circle"></i> Win = 3 points, Draw = 1 point, Loss = 0 points</p>
            </div>
        `;
    }
    
    function renderRSVP() {
        const weeks = getFutureWeeks();
        if (!weeks.length) { document.getElementById("panel-rsvp").innerHTML = `<div class="card"><h2>RSVP</h2><p>No upcoming matches</p></div>`; return; }
        document.getElementById("panel-rsvp").innerHTML = `
            <div class="card"><h2><i class="fas fa-calendar-check"></i> Weekly RSVP · $${WEEKLY_FEE}</h2><select id="rsvpWeek">${weeks.map(w=>`<option value="${w.dateStr}">${w.label}</option>`)}</select><select id="rsvpPlayer"><option>-- Select Name --</option>${players.map(p=>`<option>${escapeHtml(p)}</option>`)}</select><div class="flex-btns"><button id="rsvpYesBtn">✅ I'm Playing</button><button id="rsvpNoBtn" class="btn-outline">❌ Can't Play</button></div><div id="rsvpMsg"></div></div>
            <div class="card"><h2><i class="fas fa-users"></i> This Week's Players</h2><div id="attendeesList"></div></div>
        `;
        document.getElementById("rsvpYesBtn").onclick = async () => { const p = document.getElementById("rsvpPlayer").value, w = document.getElementById("rsvpWeek").value; if(p && p !== "-- Select Name --") { await saveAttendance({player:p, gameDate:w, status:"in"}); renderAttendees(); document.getElementById("rsvpMsg").innerHTML = `<span style="color:#10b981;">✓ ${p} added</span>`; setTimeout(()=>document.getElementById("rsvpMsg").innerHTML="",2000); } };
        document.getElementById("rsvpNoBtn").onclick = async () => { const p = document.getElementById("rsvpPlayer").value, w = document.getElementById("rsvpWeek").value; if(p && p !== "-- Select Name --") { await saveAttendance({player:p, gameDate:w, status:"out"}); renderAttendees(); document.getElementById("rsvpMsg").innerHTML = `<span style="color:#ef4444;">✗ ${p} unavailable</span>`; setTimeout(()=>document.getElementById("rsvpMsg").innerHTML="",2000); } };
        document.getElementById("rsvpWeek").onchange = renderAttendees;
        renderAttendees();
    }
    
    async function renderAttendees() {
        const week = document.getElementById("rsvpWeek")?.value;
        if(!week) return;
        const attending = attendance.filter(a => a.gameDate === week && a.status === 'in').map(a=>a.player);
        const weeklyGuests = guests.filter(g=>g.gameDate===week).map(g=>g.guestName);
        const all = [...attending, ...weeklyGuests];
        document.getElementById("attendeesList").innerHTML = `<div class="attendee-tags">${all.map(p => `<span class="attendee-tag">${escapeHtml(p)} ${weeklyGuests.includes(p)?'🎭':''}</span>`).join('') || '<span>None yet</span>'}</div>`;
    }
    
    function renderTeams() {
        const weeks = getFutureWeeks();
        if (!weeks.length) { document.getElementById("panel-teams").innerHTML = `<div class="card">No upcoming matches</div>`; return; }
        document.getElementById("panel-teams").innerHTML = `<div class="card"><h2><i class="fas fa-futbol"></i> Team Lineups</h2><select id="teamWeek">${weeks.map(w=>`<option value="${w.dateStr}">${w.label}</option>`)}</select><div class="pitch-premium"><div class="teams-row" id="teamsContainer"></div><div id="teamScore" style="text-align:center; margin-top:16px; color:white; font-weight:800;"></div></div></div>`;
        document.getElementById("teamWeek").onchange = renderTeamLineup;
        renderTeamLineup();
    }
    
    function renderTeamLineup() {
        const week = document.getElementById("teamWeek")?.value;
        if(!week) return;
        const assign = teamAssignments[week] || {};
        const lime = Object.keys(assign).filter(p => assign[p] === "lime").sort();
        const orange = Object.keys(assign).filter(p => assign[p] === "orange").sort();
        const match = matchResults[week] || { limeScore: 0, orangeScore: 0 };
        document.getElementById("teamsContainer").innerHTML = `<div class="team-card"><div class="team-title lime-title">🟢 LIME</div><div class="player-list">${lime.map(p => `<div class="player-chip">${escapeHtml(p)}</div>`).join('') || '<div class="player-chip">—</div>'}</div></div><div class="team-card"><div class="team-title orange-title">🟠 ORANGE</div><div class="player-list">${orange.map(p => `<div class="player-chip">${escapeHtml(p)}</div>`).join('') || '<div class="player-chip">—</div>'}</div></div>`;
        document.getElementById("teamScore").innerHTML = `🏆 SCORE: 🟢 ${match.limeScore || 0} — ${match.orangeScore || 0} 🟠`;
    }
    
    function renderChat() {
        document.getElementById("panel-chat").innerHTML = `<div class="card"><h2><i class="fas fa-comments"></i> Team Chat</h2><div class="chat-container"><div id="chatMsgs" class="chat-messages">Loading...</div><div class="chat-input-area"><input id="chatInput" placeholder="Type message..."><button id="sendBtn">Send</button></div></div></div>`;
        document.getElementById("sendBtn").onclick = async () => { const msg = document.getElementById("chatInput").value.trim(); if(msg && db) { await db.collection("messages").add({ name: currentUser.name, message: msg, isAdmin: currentUser.role==="admin", timestamp: firebase.firestore.FieldValue.serverTimestamp() }); document.getElementById("chatInput").value = ""; } };
        if(db) db.collection("messages").orderBy("timestamp","asc").onSnapshot(snap => { const container = document.getElementById("chatMsgs"); if(!container) return; let html = ""; snap.forEach(doc => { const d = doc.data(); const time = d.timestamp ? d.timestamp.toDate().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}) : ""; const isSent = d.name === currentUser.name; const display = d.isAdmin ? `${d.name}<span style="background:#f59e0b; padding:2px 8px; border-radius:20px; font-size:10px; margin-left:6px; color:white;">ADMIN</span>` : d.name; html += `<div class="chat-message ${isSent ? 'sent' : 'received'}"><div class="msg-bubble"><div><strong>${escapeHtml(display)}</strong></div><div>${escapeHtml(d.message)}</div><div style="font-size:10px; color:#94a3b8; margin-top:4px;">${time}</div></div></div>`; }); container.innerHTML = html || "<div style='text-align:center; padding:30px;'>No messages yet</div>"; container.scrollTop = container.scrollHeight; });
    }
    
    async function renderHistory() {
        const past = getPastWeeks();
        if (!past.length) { document.getElementById("panel-history").innerHTML = `<div class="card"><h2>Match History</h2><p>No past games yet</p></div>`; return; }
        let html = `<div class="card"><h2><i class="fas fa-history"></i> Match History · Clifton Park</h2></div>`;
        for (let week of past) {
            const assign = teamAssignments[week.dateStr] || {};
            const lime = Object.keys(assign).filter(p => assign[p] === "lime").sort();
            const orange = Object.keys(assign).filter(p => assign[p] === "orange").sort();
            const match = matchResults[week.dateStr] || { limeScore: 0, orangeScore: 0, goals: {} };
            const goals = match.goals || {};
            const limeGoals = [], orangeGoals = [];
            for (const [player, count] of Object.entries(goals)) {
                if (count > 0) {
                    if (lime.includes(player)) limeGoals.push({ player, count });
                    else if (orange.includes(player)) orangeGoals.push({ player, count });
                }
            }
            const comments = matchComments[week.dateStr] || [];
            const safeId = week.dateStr.replace(/-/g,'');
            html += `<div class="history-card"><div class="history-header"><div class="history-date"><i class="far fa-calendar-alt"></i> ${week.label}</div><div class="history-result">🟢 ${match.limeScore || 0} — ${match.orangeScore || 0} 🟠</div></div><div class="history-pitch"><div class="history-teams"><div class="history-team"><div class="history-team-name" style="background:#84cc16; color:#1a3a00;">🟢 LIME (${lime.length})</div><div class="history-players">${lime.map(p => `<span class="history-player">${escapeHtml(p)}</span>`).join('') || '<span class="history-player">—</span>'}</div></div><div class="history-team"><div class="history-team-name" style="background:#f97316; color:white;">🟠 ORANGE (${orange.length})</div><div class="history-players">${orange.map(p => `<span class="history-player">${escapeHtml(p)}</span>`).join('') || '<span class="history-player">—</span>'}</div></div></div></div><div class="history-goals"><strong><i class="fas fa-futbol"></i> Goal Scorers:</strong><br>${limeGoals.map(g => `<span class="goal-badge" style="border-left:3px solid #84cc16;">🟢 ${escapeHtml(g.player)} (${g.count})</span>`).join('')} ${orangeGoals.map(g => `<span class="goal-badge" style="border-left:3px solid #f97316;">🟠 ${escapeHtml(g.player)} (${g.count})</span>`).join('')} ${limeGoals.length === 0 && orangeGoals.length === 0 ? '<span style="color:#64748b;">No goals recorded</span>' : ''}</div><div style="padding:14px 18px;"><strong><i class="fas fa-comment-dots"></i> Comments (${comments.length})</strong><div id="comments-${safeId}" style="margin-top:8px;">${comments.map(c => `<div class="comment-item"><strong>${escapeHtml(c.author)}</strong> <span style="font-size:10px;">${new Date(c.timestamp).toLocaleString()}</span><div>${escapeHtml(c.text)}</div></div>`).join('') || '<div style="color:#94a3b8;">No comments yet</div>'}</div><div style="display:flex; gap:8px; margin-top:10px;"><input type="text" id="comment-${safeId}" placeholder="Add a comment..." style="flex:1; padding:10px 14px; border-radius:60px; border:1px solid #e2e8f0;"><button onclick="window.addCommentToGame('${week.dateStr}')">Post</button></div></div></div>`;
        }
        document.getElementById("panel-history").innerHTML = html;
    }
    window.addCommentToGame = async function(gameDate) { const safeId = gameDate.replace(/-/g,''); const input = document.getElementById(`comment-${safeId}`); const text = input?.value.trim(); if(text) { await saveComment(gameDate, currentUser.name, text); renderHistory(); } };
    
    async function renderStats() {
        let tally = new Map();
        attendance.forEach(a => { if(a.status === 'in') tally.set(a.player, (tally.get(a.player)||0)+1); });
        let sorted = Array.from(tally.entries()).map(([n,g]) => ({name:n, games:g})).sort((a,b)=>b.games - a.games).slice(0,10);
        let html = `<div class="card"><h2><i class="fas fa-crown"></i> Attendance Leaders</h2><table class="data-table"><thead><th>#</th><th>Player</th><th>Games</th></thead><tbody>${sorted.map((p,i)=>`<td><td>${i+1}</td><td>${escapeHtml(p.name)}</td><td>🎽 ${p.games}</td></tr>`).join('')}</tbody></table></div>`;
        document.getElementById("panel-stats").innerHTML = html;
    }
    function renderRules() { document.getElementById("panel-rules").innerHTML = `<div class="card"><h2><i class="fas fa-gavel"></i> Club Rules</h2><ul style="line-height:1.8; margin-left:20px;"><li>❌ No tackling from behind → Free kick</li><li>🧤 Goalie rotation (5 min) → Goal penalty</li><li>⚡ No showboating → Expulsion</li><li>🔴 Foul within 1m of goal → Shot from halfway</li><li>💰 $${WEEKLY_FEE} weekly fee</li><li>📊 3-Point System: Win=3, Draw=1, Loss=0</li><li>📍 Monday 7:30pm · Clifton Park, Brunswick</li></ul></div>`; }
    
    // ADMIN, FINANCE, and helper functions
    async function renderAdmin() { /* Keeping same as original - too long but functional */ document.getElementById("panel-admin").innerHTML = `<div class="card"><h3>Admin Panel</h3><p>Use Firebase console or contact developer for full admin features.</p><p>Admin password: admin123</p></div>`; }
    function renderFinance() { const total = payments.reduce((s,p)=>s+WEEKLY_FEE,0); document.getElementById("panel-finance").innerHTML = `<div class="card"><h2>Treasury</h2><div style="font-size:48px; font-weight:800; text-align:center; color:#84cc16;">$${total}</div></div>`; }
    
    window.startTimer = startTimer; window.pauseTimer = pauseTimer; window.resetTimer = resetTimer;
    window.addLimeGoal = addLimeGoal; window.addOrangeGoal = addOrangeGoal;
    
    function escapeHtml(str) { return String(str).replace(/[&<>]/g, m => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;' }[m])); }
    
    async function renderLogin() {
        await loadData();
        document.getElementById("appContainer").innerHTML = `<div style="background:white; border-radius:32px; padding:32px; max-width:380px; margin:60px auto; text-align:center; border:1px solid #e2e8f0;"><div class="logo-icon" style="margin:0 auto 16px;"><i class="fas fa-futbol"></i></div><h2 style="font-size:26px;">Monday Night Soccer</h2><p style="color:#64748b;">Clifton Park, Brunswick</p><select id="playerSelect" style="margin:16px 0;"><option>-- Select Player --</option>${players.map(p=>`<option>${escapeHtml(p)}</option>`)}</select><button id="playerBtn" style="width:100%; background:#84cc16;">Enter as Player</button><hr style="margin:20px 0;"><input type="password" id="adminPw" placeholder="Admin Password"><button id="adminBtn" style="width:100%; margin-top:12px; background:#64748b;">Admin Login</button><div id="loginErr" style="color:#ef4444; margin-top:12px;"></div></div>`;
        document.getElementById("playerBtn").onclick = () => { const name = document.getElementById("playerSelect").value; if(name && name !== "-- Select Player --") loginPlayer(name); else document.getElementById("loginErr").innerText = "Select your name"; };
        document.getElementById("adminBtn").onclick = () => { if(!loginAdmin(document.getElementById("adminPw").value)) document.getElementById("loginErr").innerText = "Wrong password"; };
    }
    
    (async () => {
        const stored = localStorage.getItem("soccer_user");
        if(stored) {
            try { const u = JSON.parse(stored); if(u.role==="admin"){ isAdminLoggedIn=true; currentUser={name:"Admin",role:"admin"}; } else { currentUser={name:u.name,role:"player"}; } await loadData(); renderApp(); return; } catch(e){}
        }
        renderLogin();
    })();
</script>
</body>
