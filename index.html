<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Monday Night Soccer | Complete Team Hub + Match Reports</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Merriweather:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <style>
        *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
        body{background:#eef2f5;font-family:'Inter',sans-serif;}
        .app{max-width:500px;margin:0 auto;background:#eef2f5;min-height:100vh;}
        .header{background:white;padding:14px 20px;text-align:center;border-bottom:1px solid #e2e8f0;position:sticky;top:0;z-index:20;}
        .logo-icon{width:56px;height:56px;background:#1a73e8;border-radius:24px;display:inline-flex;align-items:center;justify-content:center;margin:0 auto 6px;}
        .logo-icon i{font-size:28px;color:white;}
        .header h1{font-size:18px;font-weight:800;color:#1e293b;}
        .user-row{background:#f1f5f9;padding:5px 12px;border-radius:60px;display:inline-flex;align-items:center;gap:8px;margin-top:6px;font-size:12px;}
        .user-row button{background:#dc3545;border:none;padding:4px 12px;border-radius:40px;color:white;font-weight:600;font-size:11px;cursor:pointer;}
        .top-nav{background:white;padding:10px 12px;display:flex;flex-wrap:wrap;justify-content:center;gap:6px;border-bottom:1px solid #e2e8f0;position:sticky;top:86px;z-index:15;}
        .nav-module{background:#f8fafc;border:none;padding:8px 14px;border-radius:60px;font-size:12px;font-weight:600;color:#475569;cursor:pointer;transition:all 0.2s;}
        .nav-module.active{background:#1a73e8;color:white;}
        .module-container{padding:16px;display:none;}
        .module-container.active-module{display:block;}
        .card{background:white;border-radius:24px;padding:18px;margin-bottom:14px;border:1px solid #e2e8f0;box-shadow:0 1px 2px rgba(0,0,0,0.05);}
        .card h2{font-size:17px;font-weight:700;margin-bottom:14px;border-left:4px solid #1a73e8;padding-left:12px;}
        .attendance-card{background:linear-gradient(135deg,#1a73e8,#0d5bbf);color:white;border-radius:28px;padding:24px 20px;text-align:center;margin-bottom:16px;}
        .big-buttons{display:flex;gap:14px;margin:16px 0 12px;}
        .btn-play-big{background:#28a745;flex:1;padding:14px;border-radius:60px;font-weight:800;font-size:17px;border:none;color:white;cursor:pointer;}
        .btn-sit-big{background:#dc3545;flex:1;padding:14px;border-radius:60px;font-weight:800;font-size:17px;border:none;color:white;cursor:pointer;}
        .profile-item{background:#f8fafc;border-radius:20px;margin-bottom:10px;display:flex;align-items:center;gap:12px;padding:14px;}
        .profile-avatar{width:50px;height:50px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:white;font-weight:700;font-size:20px;flex-shrink:0;}
        .player-avatar-small{width:36px;height:36px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:white;font-weight:600;font-size:14px;margin-right:4px;}
        .guest-tag{background:#d4edda;color:#155724;border-radius:40px;padding:6px 12px;font-size:13px;display:inline-flex;align-items:center;gap:6px;}
        .attendee-tag{display:inline-flex;align-items:center;gap:6px;background:#e2e8f0;padding:6px 12px;border-radius:40px;font-size:13px;margin:4px;}
        .admin-team-item{display:flex;justify-content:space-between;align-items:center;margin:8px 0;background:#f1f5f9;border-radius:60px;padding:8px 16px;flex-wrap:wrap;gap:8px;}
        .goal-row, .assist-row{display:flex;gap:10px;margin-bottom:10px;align-items:center;}
        .goal-row input, .assist-row input{flex:1;padding:10px;border-radius:40px;border:1px solid #e2e8f0;}
        .newspaper-report{background:#fef9e6;border-radius:24px;padding:20px;font-family:'Merriweather',serif;border:1px solid #e9d5a1;margin-top:16px;font-size:13px;white-space:pre-wrap;}
        .whatsapp-share{background:#25D366;width:100%;margin-top:12px;}
        .timer-container{background:linear-gradient(135deg,#1e293b,#0f172a);border-radius:28px;padding:20px;text-align:center;}
        .timer-display{font-size:56px;font-weight:800;font-family:monospace;color:#10b981;}
        .timer-controls{display:flex;gap:12px;justify-content:center;margin-top:12px;}
        .chat-bubble{background:#f1f5f9;padding:10px;border-radius:18px;margin-bottom:8px;}
        .flex-btns{display:flex;gap:12px;margin-top:12px;flex-wrap:wrap;}
        .btn-outline{background:white;color:#1a73e8;border:2px solid #1a73e8;}
        .modal{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.5);display:flex;align-items:center;justify-content:center;z-index:1000;}
        .modal-content{background:white;border-radius:32px;padding:24px;max-width:340px;width:90%;}
        .login-logo{width:80px;height:80px;background:linear-gradient(135deg,#1a73e8,#0d5bbf);border-radius:30px;display:inline-flex;align-items:center;justify-content:center;margin:0 auto 20px;}
        select,input{width:100%;padding:12px;border:1.5px solid #e2e8f0;border-radius:60px;margin:8px 0;font-size:14px;}
        button{background:#1a73e8;color:white;border:none;padding:10px 18px;border-radius:60px;font-weight:600;cursor:pointer;}
        .info-bar{background:#e8f0fe;border-radius:16px;padding:10px;font-size:12px;margin-bottom:16px;text-align:center;color:#1a73e8;}
    </style>
</head>
<body>
<div class="app" id="app"><div class="loading" style="text-align:center;padding:60px"><i class="fas fa-spinner fa-pulse"></i> Loading Monday Night Soccer...</div></div>

<script>
    // ==================== DATA STORES ====================
    let players = ["Alex Rowe","Ali Mekawy","Carlo","Charlie","Chris Del Monaco","Chris M","Chris S","Danny","Dante","David","Dimitri","Enzo","Farid","Faros","Frank","George B","George T","Ivan","James Zoumis","James","Joe T","Joey","Kia","Leo","Manoli","Marco","Mario","Maurice","Nector","Paul","Perri","Peter","Ralph","Rocco","Stav","Stevan","Theo","Tony EH","Vasilis"].sort();
    let playerProfiles = {};
    let teamAssignments = {};
    let matchResults = {};
    let attendance = [];
    let guests = [];
    let matchComments = {};
    let isAdminLoggedIn = false, currentUser = null;
    let chatMessages = [];
    let timerInterval = null, currentHalf = 1, timeLeft = 45 * 60;
    
    // ==================== HELPER FUNCTIONS ====================
    function escapeHtml(s){ return String(s).replace(/[&<>]/g, m=> ({'&':'&amp;','<':'&lt;','>':'&gt;'})[m]); }
    function getInitials(n){ return n.split(' ').map(x=>x[0]).join('').toUpperCase().substring(0,2); }
    function getAvatarColor(n){ const c=['#1a73e8','#28a745','#dc3545','#fd7e14','#6f42c1','#20c997']; let h=0; for(let i=0;i<n.length;i++) h=((h<<5)-h)+n.charCodeAt(i); return c[Math.abs(h)%c.length]; }
    function renderMiniAvatar(n,s=28){ return `<div class="player-avatar-small" style="background:${getAvatarColor(n)};width:${s}px;height:${s}px;font-size:${s/2}px;display:inline-flex;align-items:center;justify-content:center;">${getInitials(n)}</div>`; }
    function formatTime(s){ return `${Math.floor(s/60).toString().padStart(2,'0')}:${(s%60).toString().padStart(2,'0')}`; }
    
    function getNextMondayGame() {
        const now = new Date();
        const utc = now.getTime() + (now.getTimezoneOffset() * 60000);
        const aestNow = new Date(utc + (10 * 3600000));
        const day = aestNow.getDay(), hour = aestNow.getHours();
        let daysUntilMonday;
        if (day === 1 && hour >= 20) daysUntilMonday = 7;
        else if (day === 1) daysUntilMonday = 0;
        else if (day === 0) daysUntilMonday = 1;
        else daysUntilMonday = (8 - day) % 7;
        const nextMonday = new Date(aestNow);
        nextMonday.setDate(aestNow.getDate() + daysUntilMonday);
        nextMonday.setHours(20,0,0,0);
        return nextMonday;
    }
    function getCurrentGameWeekStr(){ return getNextMondayGame().toISOString().split('T')[0]; }
    function getCurrentGameLabel(){ const m = getNextMondayGame(); return `Mon ${m.toLocaleDateString('en-AU',{day:'numeric',month:'short'})}`; }
    function getAllParticipants(gameDate){ 
        const playersIn = attendance.filter(a => a.gameDate === gameDate && a.status === 'in').map(a => a.player);
        const guestsIn = guests.filter(g => g.gameDate === gameDate).map(g => ({ name: g.guestName, isGuest: true }));
        return { players: playersIn, guests: guestsIn };
    }
    
    // ==================== CORE FUNCTIONS ====================
    function saveAttendanceLocally(a){
        const idx = attendance.findIndex(x=>x.player===a.player && x.gameDate===a.gameDate);
        if(idx!==-1) attendance[idx]=a; else attendance.push(a);
        refreshAll();
    }
    function saveGuestLocally(g){ guests.push(g); refreshAll(); }
    function removeGuestLocally(n,d){ guests = guests.filter(g=>!(g.guestName===n && g.gameDate===d)); if(teamAssignments[d]){ delete teamAssignments[d][n]; delete teamAssignments[d][`guest_${n}`]; } refreshAll(); }
    function saveTeamAssignmentsLocally(date,assign){ teamAssignments[date] = assign; refreshAll(); }
    function saveCommentLocally(date,author,text){ if(!matchComments[date]) matchComments[date]=[]; matchComments[date].push({ author, text, timestamp:Date.now() }); renderHistoryPage(); }
    function saveMatchResultLocally(date,yellow,orange,goals,assists,mvp,injuries){ matchResults[date] = { yellowScore:yellow, orangeScore:orange, goals, assists:assists||{}, mvp, injuries:injuries||[], timestamp:Date.now() }; renderHistoryPage(); renderScoreboardPage(); if(isAdminLoggedIn) renderAdminPage(); }
    
    async function setAttendance(status){ if(!currentUser) return alert("Login required"); saveAttendanceLocally({ player:currentUser.name, gameDate:CURRENT_GAME_STR, status:status }); }
    async function addGuest(name){ if(!currentUser) return alert("Login first"); if(guests.some(g=>g.gameDate===CURRENT_GAME_STR && g.guestName===name.trim())) return alert("Guest exists"); saveGuestLocally({ guestName:name.trim(), gameDate:CURRENT_GAME_STR, addedBy:currentUser.name }); document.getElementById("guestNameInput") && (document.getElementById("guestNameInput").value=""); alert(`Guest "${name}" added!`); }
    
    // Timer functions
    function playAlarm(){ try { const ctx = new (window.AudioContext || window.webkitAudioContext)(); const o = ctx.createOscillator(), g = ctx.createGain(); o.connect(g); g.connect(ctx.destination); o.frequency.value = 880; g.gain.value = 0.3; o.start(); g.gain.exponentialRampToValueAtTime(0.00001, ctx.currentTime + 1.5); o.stop(ctx.currentTime + 1.5); } catch(e){} }
    function updateTimerDisplay(){ let d = document.getElementById("timerDisplay"); if(d) d.textContent = formatTime(timeLeft); let hs = document.getElementById("currentHalf"); if(hs) hs.textContent = currentHalf === 1 ? "FIRST HALF" : "SECOND HALF"; }
    function timerTick(){ if(timeLeft <= 0){ if(timerInterval) clearInterval(timerInterval); playAlarm(); if(currentHalf === 1){ alert("🔔 HALF TIME! Click OK to start second half."); currentHalf = 2; timeLeft = 45 * 60; updateTimerDisplay(); startTimer(); } else { alert("🔔 FULL TIME! Match ended."); timerInterval = null; } return; } timeLeft--; updateTimerDisplay(); }
    function startTimer(){ if(timerInterval) clearInterval(timerInterval); timerInterval = setInterval(timerTick, 1000); }
    function pauseTimer(){ if(timerInterval){ clearInterval(timerInterval); timerInterval = null; } }
    function resetTimer(){ pauseTimer(); currentHalf = 1; timeLeft = 45 * 60; updateTimerDisplay(); }
    
    // ==================== PUNDITS & NEWSPAPER REPORT ====================
    const pundits = [
        { name: "Ned Zelic", quote: "The transition play was absolutely breathtaking! The way they moved the ball through the lines... pure poetry." },
        { name: "Craig Foster", quote: "This is what Monday night football is all about. Passion, commitment, and that never-say-die attitude." },
        { name: "Lucy Zelic", quote: "Unbelievable drama under the lights! The crowd was electric, the tackles were flying, and we got a classic." },
        { name: "Mark Bosnich", quote: "The goalkeeper tonight was a human wall. Those reflex saves changed the entire complexion of the game." },
        { name: "Tara Rushton", quote: "Clifton Park was ROCKING! You could feel the intensity from the first whistle." }
    ];
    const funFacts = ["🎲 Attendance: 37 brave souls!", "🚀 Most shots off target: Someone aiming for the moon!", "📸 The post was hit 2 times!", "🎉 Best celebration: A knee-slide that went wrong!", "💨 Fastest player: 32km/h sprint!"];
    
    function generateNewspaperReport(weekLabel, yellowScore, orangeScore, goals, assists, mvp, injuries, yellowTeam, orangeTeam) {
        const winner = yellowScore > orangeScore ? "YELLOW" : (orangeScore > yellowScore ? "ORANGE" : "STALEMATE");
        const winnerEmoji = yellowScore > orangeScore ? "🟡" : (orangeScore > yellowScore ? "🟠" : "⚖️");
        const totalGoals = yellowScore + orangeScore;
        let narrative = winner === "STALEMATE" ? "A tense tactical battle ended with honours even." :
                        (Math.abs(yellowScore-orangeScore) >= 3) ? `A DOMINANT DISPLAY from the ${winner} side!` :
                        (totalGoals >= 5) ? "GOAL GLUT! Fans were treated to a five-star thriller!" :
                        "A hard-fought contest where grit decided the outcome.";
        
        let goalText = Object.entries(goals).map(([p,c]) => `⚽ ${p} — ${c} goal${c>1?'s':''}`).join('\n') || "⚽ No goals scored";
        let assistText = Object.entries(assists).map(([p,c]) => `🎯 ${p} — ${c} assist${c>1?'s':''}`).join('\n') || "🎯 No assists recorded";
        let injuryText = injuries?.length ? injuries.map(i=>`🔸 ${i}`).join('\n') : "🔸 Clean bill of health";
        const randomPundits = [...pundits].sort(()=>0.5-Math.random()).slice(0,3);
        const randomFact = funFacts[Math.floor(Math.random()*funFacts.length)];
        
        return `📰 *THE MONDAY NIGHT TELEGRAPH* 📰
📍 *CLIFTON PARK* | ${weekLabel}
━━━━━━━━━━━━━━━━━━━━━━━

🎙️ *MATCH REPORT*
${narrative}

📊 *FINAL SCORE*
🟡 YELLOW ${yellowScore} — ${orangeScore} 🟠
🏆 WINNER: ${winnerEmoji} ${winner}

⚽ *GOAL SCORERS*
${goalText}

🎯 *ASSISTS*
${assistText}

⭐ *MAN OF THE MATCH*
🏅 ${mvp || "The Squad"}

🩺 *INJURY WATCH*
${injuryText}

━━━━━━━━━━━━━━━━━━━━━━━
🎙️ *EXPERT ANALYSIS*

🗣️ *${randomPundits[0].name}*: "${randomPundits[0].quote}"
🗣️ *${randomPundits[1].name}*: "${randomPundits[1].quote}"
🗣️ *${randomPundits[2].name}*: "${randomPundits[2].quote}"

✨ *FUN CORNER*
${randomFact}

📅 *NEXT WEEK*: Monday 8pm at Clifton Park!

#MondayNightSoccer #CliftonPark`;
    }
    
    // ==================== RENDER ALL PAGES ====================
    function refreshAll(){ renderHomePage(); renderTeamsPage(); renderHistoryPage(); renderProfilesPage(); renderScoreboardPage(); if(isAdminLoggedIn) renderAdminPage(); }
    
    function renderHomePage(){
        const c=document.getElementById("homeContainer"); if(!c) return;
        const gl=getCurrentGameLabel(); const parts=getAllParticipants(CURRENT_GAME_STR);
        const status=attendance.find(a=>a.gameDate===CURRENT_GAME_STR && a.player===currentUser?.name)?.status;
        c.innerHTML=`<div class="info-bar"><i class="fas fa-calendar-alt"></i> Next Match: ${gl} • 8pm Clifton Park</div>
        <div class="attendance-card"><h2>${gl} • 8pm</h2><div>Clifton Park, Brunswick</div>
        <div class="big-buttons"><button id="homePlayBtn" class="btn-play-big">✅ I'M PLAYING</button><button id="homeSitBtn" class="btn-sit-big">❌ CAN'T PLAY</button></div>
        <div>${status==='in'?'✓ You are PLAYING':(status==='out'?'✗ You are NOT PLAYING':'Tap above')}</div></div>
        <div class="playing-list"><div>🟢 Players (${parts.players.length})</div><div>${parts.players.map(p=>`<span class="attendee-tag">${renderMiniAvatar(p)} ${escapeHtml(p)}</span>`).join('')||'None'}</div></div>
        <div class="guest-section"><div>🎭 Guests (${parts.guests.length})</div><div>${parts.guests.map(g=>`<span class="guest-tag"><i class="fas fa-user-plus"></i> ${escapeHtml(g.name)}</span>`).join('')||'None'}</div>
        <div><input id="guestNameInput" placeholder="Guest name"><button id="addGuestBtnPlayer" style="width:100%;margin-top:8px;">➕ Bring a Guest</button></div></div>`;
        document.getElementById("homePlayBtn")?.addEventListener("click",()=>setAttendance("in"));
        document.getElementById("homeSitBtn")?.addEventListener("click",()=>setAttendance("out"));
        document.getElementById("addGuestBtnPlayer")?.addEventListener("click",()=>{ const gn=document.getElementById("guestNameInput")?.value.trim(); if(gn) addGuest(gn); });
    }
    
    function renderTeamsPage(){
        const c=document.getElementById("page-teamswk"); if(!c) return;
        const parts=getAllParticipants(CURRENT_GAME_STR);
        const allList=[...parts.players.map(p=>({ name:p })), ...parts.guests.map(g=>({ name:g.name, isG:true }))];
        const assign=teamAssignments[CURRENT_GAME_STR]||{};
        const yellow=allList.filter(p=>assign[p.name]==="yellow" || assign[`guest_${p.name}`]==="yellow");
        const orange=allList.filter(p=>assign[p.name]==="orange" || assign[`guest_${p.name}`]==="orange");
        c.innerHTML=`<div class="info-bar">${getCurrentGameLabel()} • 8pm</div>
        <div class="card"><div class="team-row" style="display:flex;gap:12px;"><div class="team-box" style="flex:1;background:#1a1a2e;padding:12px;border-radius:20px;"><div class="team-yellow">🟡 YELLOW (${yellow.length})</div><div>${yellow.map(p=>`<div class="player-tag">${renderMiniAvatar(p.name)} ${escapeHtml(p.name)}</div>`).join('')}</div></div>
        <div class="team-box" style="flex:1;background:#1a1a2e;padding:12px;border-radius:20px;"><div class="team-orange">🟠 ORANGE (${orange.length})</div><div>${orange.map(p=>`<div class="player-tag">${renderMiniAvatar(p.name)} ${escapeHtml(p.name)}</div>`).join('')}</div></div></div></div>`;
    }
    
    function renderHistoryPage(){
        const c=document.getElementById("page-history"); if(!c) return;
        let h=`<div class="card"><h2>📖 Match History</h2></div>`;
        for(let [date, m] of Object.entries(matchResults).slice(-5).reverse()){
            const weekLabel = date;
            h+=`<div class="match-card" style="background:white;border-radius:20px;margin-bottom:12px;padding:12px;">
            <div><strong>${weekLabel}</strong> 🟡 ${m.yellowScore} - ${m.orangeScore} 🟠</div>
            <div>⚽ ${Object.entries(m.goals||{}).map(([p,c])=>`${p}(${c})`).join(', ') || 'none'}</div>
            <div>🏆 MVP: ${m.mvp || '-'}</div>
            </div>`;
        }
        c.innerHTML=h || `<div class="card"><p>No matches yet</p></div>`;
    }
    
    function renderProfilesPage(){
        const c=document.getElementById("page-profiles"); if(!c) return;
        let h=`<div class="card"><h2>👤 Player Profiles</h2>`;
        for(let p of players.slice(0,15)){
            h+=`<div class="profile-item">${renderMiniAvatar(p,40)}<div><strong>${escapeHtml(p)}</strong><br><span style="font-size:11px;">⚽ Midfielder | 🎂 —</span></div></div>`;
        }
        c.innerHTML=h+`<div style="text-align:center;padding:8px;">+ ${players.length-15} more players</div></div>`;
    }
    
    function renderScoreboardPage(){
        const c=document.getElementById("page-scoreboard"); if(!c) return;
        let stats = {};
        players.forEach(p=>stats[p]={goals:0,games:0});
        attendance.forEach(a=>{if(a.status==='in') stats[a.player].games++;});
        Object.values(matchResults).forEach(m=>{if(m.goals) Object.entries(m.goals).forEach(([p,c])=>{if(stats[p]) stats[p].goals+=c;});});
        const topScorers = Object.entries(stats).sort((a,b)=>b[1].goals-a[1].goals).slice(0,10);
        c.innerHTML=`<div class="card"><h2>🏆 Golden Boot</h2>${topScorers.map(([name,data],i)=>`<div class="admin-team-item"><span>${i+1}. ${renderMiniAvatar(name)} ${escapeHtml(name)}</span><span>⚽ ${data.goals}</span></div>`).join('')}</div>`;
    }
    
    function renderTimerPage(){ const c=document.getElementById("page-timer"); if(c) c.innerHTML=`<div class="timer-container"><div class="timer-display" id="timerDisplay">45:00</div><div class="timer-controls"><button class="timer-btn start" id="timerStartBtn" style="background:#10b981;">Start</button><button class="timer-btn pause" id="timerPauseBtn" style="background:#f59e0b;">Pause</button><button class="timer-btn reset" id="timerResetBtn" style="background:#ef4444;">Reset</button></div><div class="half-status">Half: <span id="currentHalf">FIRST HALF</span></div></div>`; updateTimerDisplay(); document.getElementById("timerStartBtn")?.addEventListener("click",startTimer); document.getElementById("timerPauseBtn")?.addEventListener("click",pauseTimer); document.getElementById("timerResetBtn")?.addEventListener("click",resetTimer); }
    
    function renderChatPage(){ const c=document.getElementById("page-chat"); if(!c) return; c.innerHTML=`<div class="card"><h2>💬 Team Chat</h2><div id="chatMessagesList" style="height:300px;overflow-y:auto;background:#f8fafc;border-radius:20px;padding:12px;margin-bottom:12px;"></div><div style="display:flex;gap:8px;"><input id="chatInput" placeholder="Type message..." style="flex:1;"><button id="chatSendBtn">Send</button></div></div>`; const msgDiv=document.getElementById("chatMessagesList"); if(msgDiv) msgDiv.innerHTML=chatMessages.map(m=>`<div class="chat-bubble"><strong>${escapeHtml(m.name)}</strong><br>${escapeHtml(m.text)}</div>`).join('')||"<div style='text-align:center;'>No messages</div>"; document.getElementById("chatSendBtn")?.addEventListener("click",()=>{ const inp=document.getElementById("chatInput"); if(inp?.value.trim() && currentUser){ chatMessages.push({name:currentUser.name, text:inp.value.trim()}); renderChatPage(); inp.value=""; } }); }
    
    function renderWeatherPage(){ const c=document.getElementById("page-weather"); if(c) c.innerHTML=`<div class="card"><h2>🌤️ Forecast</h2><div style="background:#0f2027;color:white;border-radius:24px;padding:20px;text-align:center;"><i class="fas fa-sun fa-3x"></i><h3>Clear Night</h3><p>Perfect for football! 🌙</p></div></div>`; }
    function renderRulesPage(){ const c=document.getElementById("page-rules"); if(c) c.innerHTML=`<div class="card"><h2>📜 Rules</h2><ul style="margin-left:20px;"><li>⚡ 8pm sharp at Clifton Park</li><li>✅ RSVP before Sunday</li><li>🎭 Guests welcome</li><li>📰 Match reports on WhatsApp!</li></ul></div>`; }
    
    // ==================== ADMIN PAGE WITH NEWSPAPER GENERATOR ====================
    function renderAdminPage(){
        if(!isAdminLoggedIn){ const c=document.getElementById("page-admin"); if(c) c.innerHTML=`<div class="card"><h2>🔒 Admin</h2><button id="adminLoginBtn">Admin Login</button></div>`; document.getElementById("adminLoginBtn")?.addEventListener("click",()=>{ const pw=prompt("Enter password:"); if(pw==="admin123"){ isAdminLoggedIn=true; renderAdminPage(); refreshAll(); } else alert("Wrong password"); }); return; }
        
        const gameDate=CURRENT_GAME_STR;
        const parts=getAllParticipants(gameDate);
        const allList=[...parts.players.map(p=>({ name:p })), ...parts.guests.map(g=>({ name:g.name }))];
        const currAssign=teamAssignments[gameDate]||{};
        
        let goalsArray=[], assistsArray=[];
        
        const html = `<div class="info-bar">🔐 ADMIN MODE • ${getCurrentGameLabel()}</div>
        <div class="card"><h2>⚽ Assign Teams</h2>${allList.map(p=>`<div class="admin-team-item"><div>${renderMiniAvatar(p.name)} ${escapeHtml(p.name)}</div><select class="team-select" data-name="${escapeHtml(p.name)}"><option value="">— Team —</option><option value="yellow" ${currAssign[p.name]==="yellow"?"selected":""}>🟡 Yellow</option><option value="orange" ${currAssign[p.name]==="orange"?"selected":""}>🟠 Orange</option></select></div>`).join('')}<button id="saveTeamsBtn" style="width:100%;margin-top:12px;">💾 Save Teams</button></div>
        <div class="card"><h2>📝 MATCH REPORT (Newspaper Style)</h2>
        <div><label>Match Week</label><input id="reportWeek" value="${getCurrentGameLabel()}"></div>
        <div style="display:flex;gap:12px;"><div style="flex:1"><label>🟡 Yellow</label><input type="number" id="reportYellow" value="0"></div><div style="flex:1"><label>🟠 Orange</label><input type="number" id="reportOrange" value="0"></div></div>
        <div><label>⚽ Goal Scorers</label><div id="goalsListAdmin"></div><button id="addGoalAdminBtn" style="background:#28a745;width:100%;margin-top:8px;">+ Add Goal</button></div>
        <div><label>🎯 Assists</label><div id="assistsListAdmin"></div><button id="addAssistAdminBtn" style="background:#28a745;width:100%;margin-top:8px;">+ Add Assist</button></div>
        <div><label>🏆 MVP</label><input id="mvpInput" placeholder="Player name"></div>
        <div><label>🩺 Injuries (comma)</label><input id="injuriesInput" placeholder="e.g., Danny (ankle)"></div>
        <button id="generateReportAdminBtn" style="background:#b45309;width:100%;margin-top:16px;">📰 GENERATE NEWSPAPER REPORT</button>
        <div id="newspaperPreviewAdmin" class="newspaper-report" style="display:none;margin-top:16px;"></div>
        <button id="whatsappShareAdminBtn" class="whatsapp-share" style="display:none;"><i class="fab fa-whatsapp"></i> Share to WhatsApp</button></div>`;
        
        const container=document.getElementById("page-admin"); if(container) container.innerHTML=html;
        
        function renderGoalsAdmin(){ const div=document.getElementById("goalsListAdmin"); if(div) div.innerHTML=goalsArray.map((g,idx)=>`<div class="goal-row"><input placeholder="Player" value="${escapeHtml(g.player)}" data-g-idx="${idx}" class="goalPlayer"><input type="number" placeholder="Goals" value="${g.count}" data-gc-idx="${idx}" class="goalCount" style="width:80px;"><button onclick="window.removeGoalAdmin(${idx})">✖</button></div>`).join(''); attachGoalEvents(); }
        function renderAssistsAdmin(){ const div=document.getElementById("assistsListAdmin"); if(div) div.innerHTML=assistsArray.map((a,idx)=>`<div class="assist-row"><input placeholder="Player" value="${escapeHtml(a.player)}" data-a-idx="${idx}" class="assistPlayer"><input type="number" placeholder="Assists" value="${a.count}" data-ac-idx="${idx}" style="width:80px;"><button onclick="window.removeAssistAdmin(${idx})">✖</button></div>`).join(''); attachAssistEvents(); }
        
        window.removeGoalAdmin = (idx)=>{ goalsArray.splice(idx,1); renderGoalsAdmin(); };
        window.removeAssistAdmin = (idx)=>{ assistsArray.splice(idx,1); renderAssistsAdmin(); };
        
        function attachGoalEvents(){ document.querySelectorAll('.goalPlayer').forEach(inp=>{ inp.addEventListener('change',(e)=>{ const idx=e.target.dataset.gIdx; if(goalsArray[idx]) goalsArray[idx].player=e.target.value; }); }); document.querySelectorAll('.goalCount').forEach(inp=>{ inp.addEventListener('change',(e)=>{ const idx=e.target.dataset.gcIdx; if(goalsArray[idx]) goalsArray[idx].count=parseInt(e.target.value)||1; }); }); }
        function attachAssistEvents(){ document.querySelectorAll('.assistPlayer').forEach(inp=>{ inp.addEventListener('change',(e)=>{ const idx=e.target.dataset.aIdx; if(assistsArray[idx]) assistsArray[idx].player=e.target.value; }); }); }
        
        document.getElementById("addGoalAdminBtn")?.addEventListener("click",()=>{ goalsArray.push({player:'',count:1}); renderGoalsAdmin(); });
        document.getElementById("addAssistAdminBtn")?.addEventListener("click",()=>{ assistsArray.push({player:'',count:1}); renderAssistsAdmin(); });
        
        document.getElementById("generateReportAdminBtn")?.addEventListener("click",()=>{
            const week = document.getElementById("reportWeek").value || getCurrentGameLabel();
            const yellow = parseInt(document.getElementById("reportYellow").value)||0;
            const orange = parseInt(document.getElementById("reportOrange").value)||0;
            const goalObj = {}; goalsArray.forEach(g=>{ if(g.player && g.count>0) goalObj[g.player]=(goalObj[g.player]||0)+g.count; });
            const assistObj = {}; assistsArray.forEach(a=>{ if(a.player && a.count>0) assistObj[a.player]=(assistObj[a.player]||0)+a.count; });
            const mvp = document.getElementById("mvpInput").value;
            const injuries = document.getElementById("injuriesInput").value.split(',').map(i=>i.trim()).filter(i=>i);
            const yellowTeam = allList.filter(p=>currAssign[p.name]==="yellow");
            const orangeTeam = allList.filter(p=>currAssign[p.name]==="orange");
            const report = generateNewspaperReport(week, yellow, orange, goalObj, assistObj, mvp, injuries, yellowTeam, orangeTeam);
            const preview = document.getElementById("newspaperPreviewAdmin");
            if(preview){ preview.innerHTML = report.replace(/\n/g,'<br>'); preview.style.display="block"; }
            const shareBtn = document.getElementById("whatsappShareAdminBtn");
            if(shareBtn){ shareBtn.style.display="block"; shareBtn.onclick = ()=>{ window.open(`https://wa.me/?text=${encodeURIComponent(report)}`,'_blank'); }; }
            saveMatchResultLocally(week, yellow, orange, goalObj, assistObj, mvp, injuries);
        });
        
        document.getElementById("saveTeamsBtn")?.addEventListener("click",()=>{ const newAssign={}; document.querySelectorAll(".team-select").forEach(sel=>{ const name=sel.dataset.name; const val=sel.value; if(val && name) newAssign[name]=val; }); saveTeamAssignmentsLocally(gameDate,newAssign); renderAdminPage(); renderTeamsPage(); });
        
        renderGoalsAdmin(); renderAssistsAdmin();
    }
    
    // ==================== LOGIN SYSTEM ====================
    function showLoginModal(){
        const modal=document.createElement('div'); modal.className='modal';
        modal.innerHTML=`<div class="modal-content"><div class="login-logo"><i class="fas fa-futbol fa-3x"></i></div><h3>Monday Night Soccer</h3><select id="loginNameSelect"><option value="">Select your name</option>${players.map(p=>`<option value="${escapeHtml(p)}">${escapeHtml(p)}</option>`).join('')}</select><button id="loginBtn">Login / Join</button><div style="margin-top:12px;"><button id="adminSwitchBtn" class="btn-outline" style="width:100%;">🔐 Admin Access</button></div></div>`;
        document.body.appendChild(modal);
        document.getElementById("loginBtn").onclick=()=>{ const sel=document.getElementById("loginNameSelect"); const name=sel?.value; if(name && players.includes(name)){ currentUser={name}; isAdminLoggedIn=false; modal.remove(); document.getElementById("userNameDisplay").innerText=name; document.getElementById("logoutBtn").style.display="inline-block"; refreshAll(); renderChatPage(); } else alert("Please select your name"); };
        document.getElementById("adminSwitchBtn").onclick=()=>{ const pw=prompt("Admin password:"); if(pw==="admin123"){ isAdminLoggedIn=true; currentUser={name:"Admin"}; document.getElementById("userNameDisplay").innerText="Admin"; document.getElementById("logoutBtn").style.display="inline-block"; modal.remove(); refreshAll(); renderAdminPage(); } else alert("Wrong password"); };
    }
    function logout(){ currentUser=null; isAdminLoggedIn=false; document.getElementById("userNameDisplay").innerText="Not logged in"; document.getElementById("logoutBtn").style.display="none"; showLoginModal(); refreshAll(); }
    
    // ==================== INIT APP ====================
    function initApp(){
        const appDiv=document.getElementById("app");
        appDiv.innerHTML=`<div class="header"><div class="logo-icon"><i class="fas fa-futbol"></i></div><h1>MONDAY NIGHT SOCCER</h1><div class="user-row"><span id="userNameDisplay">Not logged in</span><button id="logoutBtn" style="display:none;">Logout</button></div></div>
        <div class="top-nav"><button class="nav-module active" data-module="home">🏠 Home</button><button class="nav-module" data-module="teamswk">⚽ Teams</button><button class="nav-module" data-module="history">📖 History</button><button class="nav-module" data-module="scoreboard">🏆 Stats</button><button class="nav-module" data-module="profiles">👤 Profiles</button><button class="nav-module" data-module="timer">⏱️ Timer</button><button class="nav-module" data-module="chat">💬 Chat</button><button class="nav-module" data-module="weather">🌤️ Weather</button><button class="nav-module" data-module="rules">📜 Rules</button><button class="nav-module" data-module="admin">🔧 Admin</button></div>
        <div id="homeContainer" class="module-container active-module"></div><div id="page-teamswk" class="module-container"></div><div id="page-history" class="module-container"></div><div id="page-scoreboard" class="module-container"></div><div id="page-profiles" class="module-container"></div><div id="page-timer" class="module-container"></div><div id="page-chat" class="module-container"></div><div id="page-weather" class="module-container"></div><div id="page-rules" class="module-container"></div><div id="page-admin" class="module-container"></div>`;
        
        document.querySelectorAll(".nav-module").forEach(btn=>{ btn.addEventListener("click",()=>{ document.querySelectorAll(".nav-module").forEach(b=>b.classList.remove("active")); btn.classList.add("active"); const mod=btn.dataset.module; document.querySelectorAll(".module-container").forEach(c=>c.classList.remove("active-module")); if(mod==="home") document.getElementById("homeContainer").classList.add("active-module"); else document.getElementById(`page-${mod}`).classList.add("active-module"); if(mod==="chat") renderChatPage(); if(mod==="timer") renderTimerPage(); if(mod==="weather") renderWeatherPage(); if(mod==="rules") renderRulesPage(); }); });
        document.getElementById("logoutBtn").onclick=logout;
        showLoginModal();
        refreshAll();
    }
    initApp();
</script>
</body>
</html>
