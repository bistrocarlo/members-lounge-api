<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Monday Night Soccer | Clifton Park Executive Hub</title>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800;14..32,900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { background: #f0f2f5; font-family: 'Inter', sans-serif; padding: 20px 16px 40px; min-height: 100vh; }
        button, .tab-btn, select, input { cursor: pointer; min-height: 48px; font-size: 16px; }
        .container { max-width: 780px; margin: 0 auto; }
        
        :root {
            --green: #22c55e;
            --green-dark: #16a34a;
            --green-light: #dcfce7;
            --orange: #f97316;
            --dark: #0f172a;
            --gray: #64748b;
            --light: #f8fafc;
            --border: #e2e8f0;
            --card: #ffffff;
        }
        
        .header { background: var(--card); border-radius: 28px; padding: 20px; margin-bottom: 20px; text-align: center; border: 1px solid var(--border); }
        .logo-icon { width: 60px; height: 60px; background: linear-gradient(135deg, var(--green), var(--green-dark)); border-radius: 22px; display: inline-flex; align-items: center; justify-content: center; margin-bottom: 12px; }
        .logo-icon i { font-size: 32px; color: white; }
        .header h1 { font-size: 26px; font-weight: 800; color: var(--dark); }
        .user-badge { background: var(--light); padding: 8px 22px; border-radius: 60px; display: inline-flex; align-items: center; gap: 14px; margin-top: 12px; border: 1px solid var(--border); }
        .user-badge button { background: #ef4444; border: none; padding: 6px 20px; border-radius: 40px; color: white; cursor: pointer; }
        
        .info-widget { background: linear-gradient(135deg, var(--dark), #1e293b); border-radius: 28px; padding: 18px 24px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; color: white; gap: 16px; }
        .weather-section { display: flex; align-items: center; gap: 16px; }
        .weather-icon-large { font-size: 44px; }
        .weather-temp-large { font-size: 32px; font-weight: 800; }
        .time-section { text-align: right; }
        .aest-time { font-size: 28px; font-weight: 800; font-family: monospace; }
        
        .tab-nav { display: flex; gap: 10px; justify-content: center; margin-bottom: 24px; flex-wrap: wrap; }
        .tab-btn { background: white; border: 1.5px solid var(--border); padding: 14px 24px; border-radius: 60px; font-weight: 700; font-size: 14px; color: var(--gray); display: inline-flex; align-items: center; gap: 10px; cursor: pointer; transition: all 0.2s; }
        .tab-btn:hover { border-color: var(--green); color: var(--green-dark); background: var(--green-light); }
        .tab-btn.active { background: var(--green); color: white; border-color: var(--green); }
        
        .panel { display: none; }
        .panel.active-panel { display: block; animation: fadeIn 0.25s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .card { background: var(--card); border-radius: 28px; padding: 24px; margin-bottom: 20px; border: 1px solid var(--border); }
        .card h2 { font-size: 20px; font-weight: 800; margin-bottom: 18px; color: var(--dark); border-left: 5px solid var(--green); padding-left: 14px; }
        
        .match-scoreboard { background: linear-gradient(145deg, #0f172a, #1e293b); border-radius: 36px; padding: 28px; text-align: center; color: white; }
        .score-panel { display: flex; justify-content: center; align-items: center; gap: 40px; margin: 20px 0; flex-wrap: wrap; }
        .team-score-card { background: rgba(255,255,255,0.08); border-radius: 32px; padding: 20px 32px; min-width: 140px; }
        .team-score-number { font-size: 72px; font-weight: 900; }
        .timer-display { font-size: 48px; font-weight: 800; font-family: monospace; background: rgba(0,0,0,0.4); border-radius: 60px; padding: 16px; display: inline-block; margin: 10px 0; }
        .control-buttons { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-top: 16px; }
        .goal-green { background: var(--green); color: #064e3b; border: none; padding: 12px 24px; border-radius: 60px; font-weight: 700; cursor: pointer; }
        .goal-orange { background: var(--orange); color: white; border: none; padding: 12px 24px; border-radius: 60px; font-weight: 700; cursor: pointer; }
        
        .standings-table { width: 100%; border-collapse: collapse; }
        .standings-table th, .standings-table td { padding: 14px 8px; text-align: center; border-bottom: 1px solid var(--border); }
        .standings-table th { background: var(--green); color: #064e3b; }
        .green-row { background: rgba(34,197,94,0.08); }
        .orange-row { background: rgba(249,115,22,0.08); }
        
        .player-profile-card { background: linear-gradient(135deg, var(--green-light), white); border-radius: 28px; padding: 20px; margin-bottom: 16px; cursor: pointer; transition: all 0.2s; border: 1px solid var(--border); }
        .player-profile-card:hover { transform: translateY(-3px); box-shadow: 0 8px 20px rgba(0,0,0,0.1); }
        .profile-name { font-size: 20px; font-weight: 800; color: var(--green-dark); }
        .profile-stats { display: flex; gap: 20px; margin-top: 12px; flex-wrap: wrap; }
        .profile-stat { background: white; border-radius: 40px; padding: 6px 16px; font-size: 13px; }
        
        .history-card { background: var(--card); border-radius: 24px; margin-bottom: 20px; border: 1px solid var(--border); overflow: hidden; }
        .history-header { background: var(--light); padding: 16px 20px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; border-bottom: 2px solid var(--border); }
        .history-date { font-weight: 800; font-size: 18px; }
        .history-result { background: var(--green); color: #064e3b; padding: 6px 18px; border-radius: 60px; font-weight: 800; }
        .history-pitch { background: linear-gradient(145deg, #2e7d32, #1b5e20); padding: 16px; }
        .history-teams { display: flex; gap: 16px; flex-wrap: wrap; }
        .history-team { flex: 1; background: rgba(0,0,0,0.7); border-radius: 20px; padding: 14px; }
        .history-team-name { text-align: center; padding: 8px; border-radius: 60px; margin-bottom: 12px; font-weight: 800; }
        .history-players { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
        .history-player { background: rgba(255,255,255,0.2); border-radius: 40px; padding: 5px 10px; font-size: 11px; color: white; }
        .history-goals { background: var(--green-light); padding: 14px 18px; }
        .goal-badge { display: inline-block; background: white; border-radius: 40px; padding: 5px 12px; margin: 4px; font-size: 12px; font-weight: 600; }
        
        .data-table { width: 100%; border-collapse: collapse; }
        .data-table th, .data-table td { padding: 14px 12px; text-align: left; border-bottom: 1px solid var(--border); }
        .data-table th { background: var(--light); color: var(--green-dark); }
        .debt-row { background: #fef2f2; }
        .btn-outline { background: white; color: var(--green-dark); border: 2px solid var(--green); }
        .flex-btns { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 15px; }
        
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: white; border-radius: 32px; padding: 28px; max-width: 500px; width: 90%; max-height: 80vh; overflow-y: auto; }
        .close-modal { float: right; font-size: 28px; cursor: pointer; color: var(--gray); }
        
        @media (max-width: 600px) { .team-score-number { font-size: 48px; } .timer-display { font-size: 32px; } }
    </style>
</head>
<body>
<div class="container" id="appContainer">Loading Executive Hub...</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyCWlFqDJyENgrUOhiLXCjSEi4Mk_54SA1w",
        authDomain: "monday-night-soccer-hub.firebaseapp.com",
        projectId: "monday-night-soccer-hub",
        storageBucket: "monday-night-soccer-hub.firebasestorage.app",
        messagingSenderId: "634335208908",
        appId: "1:634335208908:web:dca705b65fc52de0606969"
    };
    
    let db = null;
    try { firebase.initializeApp(firebaseConfig); db = firebase.firestore(); } catch(e) { console.warn("Firebase fallback"); }
    
    let players = ["Alex Rowe", "Ali Mekawy", "Carlo", "Charlie", "Chris Del Monaco", "Chris M", "Chris S", "Danny", "Dante", "David", "Dimitri", "Enzo", "Farid", "Faros", "Frank", "George B", "George T", "Ivan", "James Zoumis", "James", "Joe T", "Joey", "Kia", "Leo", "Manoli", "Marco", "Mario", "Maurice", "Nector", "Paul", "Perri", "Peter", "Ralph", "Rocco", "Stav", "Stevan", "Theo", "Tony EH", "Vasilis"].sort();
    let teamAssignments = {}, matchResults = {}, payments = [], attendance = [], guests = [], matchComments = {};
    let isAdminLoggedIn = false, currentUser = null;
    const WEEKLY_FEE = 5;
    
    let matchTimer = null, timerRunning = false, timerSeconds = 0;
    let greenScore = 0, orangeScore = 0;
    
    function getMelbourneTime() {
        const now = new Date();
        const utc = now.getTime() + (now.getTimezoneOffset() * 60000);
        const isDST = now.getMonth() > 0 && now.getMonth() < 6 ? false : true;
        const offset = isDST ? 11 : 10;
        return new Date(utc + (offset * 3600000));
    }
    function getMelbourneDate() { return getMelbourneTime().toISOString().split('T')[0]; }
    function generateWeeks() {
        const year = new Date().getFullYear();
        let start = new Date(year, 0, 1);
        while (start.getDay() !== 1) start.setDate(start.getDate() + 1);
        let weeks = [], cur = new Date(start);
        let dec31 = new Date(year, 11, 31);
        let lastMonday = new Date(dec31);
        while (lastMonday.getDay() !== 1) lastMonday.setDate(lastMonday.getDate() - 1);
        let secondLast = new Date(lastMonday);
        secondLast.setDate(secondLast.getDate() - 7);
        while (cur <= secondLast) {
            weeks.push({ dateStr: cur.toISOString().split('T')[0], label: `Mon ${cur.toLocaleDateString('en-AU', { day:'numeric', month:'short' })}` });
            cur.setDate(cur.getDate() + 7);
        }
        return weeks;
    }
    const ALL_WEEKS = generateWeeks();
    function getFutureWeeks() { return ALL_WEEKS.filter(w => w.dateStr >= getMelbourneDate()); }
    function getPastWeeks() { return ALL_WEEKS.filter(w => w.dateStr < getMelbourneDate()).reverse(); }
    
    async function getWeather() {
        try {
            const res = await fetch('https://wttr.in/Melbourne?format=%C|%t&m');
            const data = await res.text();
            const parts = data.split('|');
            return { condition: parts[0] || 'Clear', temp: parts[1] || '18°C' };
        } catch(e) { return { condition: 'Partly Cloudy', temp: '18°C' }; }
    }
    
    async function loadData() {
        if(!db) return;
        try {
            const pDoc = await db.collection("config").doc("players").get();
            if(pDoc.exists && pDoc.data().list) players = pDoc.data().list.sort();
            const tDoc = await db.collection("config").doc("teamAssignments").get();
            if(tDoc.exists) teamAssignments = tDoc.data();
            const rDoc = await db.collection("config").doc("matchResults").get();
            if(rDoc.exists) matchResults = rDoc.data();
            const paySnap = await db.collection("payments").get();
            payments = []; paySnap.forEach(d => payments.push(d.data()));
            const attSnap = await db.collection("attendance").get();
            attendance = []; attSnap.forEach(d => attendance.push(d.data()));
            const guestSnap = await db.collection("guests").get();
            guests = []; guestSnap.forEach(d => guests.push(d.data()));
            const commentSnap = await db.collection("matchComments").get();
            matchComments = {};
            commentSnap.forEach(d => { const data = d.data(); if (!matchComments[data.gameDate]) matchComments[data.gameDate] = []; matchComments[data.gameDate].push(data); });
        } catch(e) { console.warn(e); }
    }
    async function savePlayers() { if(db) await db.collection("config").doc("players").set({ list: players }); }
    async function saveTeams() { if(db) await db.collection("config").doc("teamAssignments").set(teamAssignments); }
    async function saveResults() { if(db) await db.collection("config").doc("matchResults").set(matchResults); }
    async function savePayment(p) { if(db) await db.collection("payments").doc(`${p.player}_${p.gameDate}`).set(p); payments.push(p); }
    async function saveAttendance(a) { if(db) await db.collection("attendance").doc(`${a.player}_${a.gameDate}`).set(a); const idx = attendance.findIndex(x=>x.player===a.player&&x.gameDate===a.gameDate); if(idx!==-1) attendance[idx]=a; else attendance.push(a); }
    async function saveGuest(g) { if(db) await db.collection("guests").doc(`${g.guestName}_${g.gameDate}`).set(g); guests.push(g); }
    async function saveComment(gameDate, author, text) { const comment = { gameDate, author, text, timestamp: Date.now() }; if(db) await db.collection("matchComments").add(comment); if (!matchComments[gameDate]) matchComments[gameDate] = []; matchComments[gameDate].push(comment); renderHistory(); }
    
    function loginPlayer(name) { currentUser = { name, role: "player" }; isAdminLoggedIn = false; localStorage.setItem("soccer_user", JSON.stringify(currentUser)); renderApp(); }
    function loginAdmin(pw) { if(pw === "admin123") { currentUser = { name: "Admin", role: "admin" }; isAdminLoggedIn = true; localStorage.setItem("soccer_user", JSON.stringify(currentUser)); renderApp(); return true; } return false; }
    function logout() { if(matchTimer) clearInterval(matchTimer); currentUser = null; localStorage.removeItem("soccer_user"); renderLogin(); }
    
    function formatSec(sec) { const m = Math.floor(sec / 60); const s = sec % 60; return `${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`; }
    function updateScoreUI() {
        const greenEl = document.getElementById('greenScoreVal');
        const orangeEl = document.getElementById('orangeScoreVal');
        const timerEl = document.getElementById('timerVal');
        if(greenEl) greenEl.textContent = greenScore;
        if(orangeEl) orangeEl.textContent = orangeScore;
        if(timerEl) timerEl.textContent = formatSec(timerSeconds);
    }
    function startTimer() { if(matchTimer) clearInterval(matchTimer); timerRunning = true; matchTimer = setInterval(() => { if(timerRunning) { timerSeconds++; updateScoreUI(); } }, 1000); }
    function pauseTimer() { timerRunning = false; }
    function resetTimer() { timerRunning = false; timerSeconds = 0; greenScore = 0; orangeScore = 0; updateScoreUI(); if(matchTimer) clearInterval(matchTimer); matchTimer = null; }
    function addGreenGoal() { greenScore++; updateScoreUI(); }
    function addOrangeGoal() { orangeScore++; updateScoreUI(); }
    
    function calculateStandings() {
        const startDate = "2026-02-01";
        const pastWeeks = ALL_WEEKS.filter(w => w.dateStr >= startDate && w.dateStr < getMelbourneDate());
        let green = { played: 0, wins: 0, draws: 0, losses: 0, gf: 0, ga: 0, points: 0 };
        let orange = { played: 0, wins: 0, draws: 0, losses: 0, gf: 0, ga: 0, points: 0 };
        pastWeeks.forEach(week => {
            const result = matchResults[week.dateStr];
            if (!result) return;
            const gScore = result.greenScore !== undefined ? result.greenScore : (result.yellowScore || 0);
            const oScore = result.orangeScore || 0;
            green.played++; orange.played++;
            green.gf += gScore; green.ga += oScore;
            orange.gf += oScore; orange.ga += gScore;
            if (gScore > oScore) { green.wins++; green.points += 3; orange.losses++; }
            else if (oScore > gScore) { orange.wins++; orange.points += 3; green.losses++; }
            else { green.draws++; orange.draws++; green.points += 1; orange.points += 1; }
        });
        green.losses = green.played - green.wins - green.draws;
        orange.losses = orange.played - orange.wins - orange.draws;
        return { green, orange };
    }
    
    function getPlayerDebt(player) {
        let debt = 0;
        getPastWeeks().forEach(w => {
            const attended = attendance.some(a => a.gameDate === w.dateStr && a.player === player && a.status === 'in');
            const paid = payments.some(p => p.gameDate === w.dateStr && p.player === player);
            if (attended && !paid) debt += WEEKLY_FEE;
        });
        return debt;
    }
    
    function getPlayerAttendanceCount(player) {
        return attendance.filter(a => a.player === player && a.status === 'in').length;
    }
    
    function getPlayerGoals(player) {
        let total = 0;
        Object.values(matchResults).forEach(m => { if(m.goals && m.goals[player]) total += m.goals[player]; });
        return total;
    }
    
    function showPlayerProfile(player) {
        const debt = getPlayerDebt(player);
        const games = getPlayerAttendanceCount(player);
        const goals = getPlayerGoals(player);
        const modal = document.getElementById('playerModal');
        const content = document.getElementById('modalContent');
        content.innerHTML = `<span class="close-modal" onclick="document.getElementById('playerModal').style.display='none'">&times;</span>
            <div style="text-align:center;"><div class="logo-icon" style="margin:0 auto 20px;"><i class="fas fa-user"></i></div>
            <h2 style="color:var(--green-dark);">${escapeHtml(player)}</h2>
            <div class="profile-stats" style="justify-content:center; margin-top:20px;">
                <div class="profile-stat">🎽 Games: ${games}</div>
                <div class="profile-stat">⚽ Goals: ${goals}</div>
                <div class="profile-stat">💰 Debt: $${debt}</div>
            </div>
            <hr style="margin:20px 0;">
            <h3>Recent Attendance</h3>
            <div style="max-height:150px; overflow-y:auto;">
                ${getPastWeeks().slice(0,10).map(w => {
                    const attended = attendance.some(a => a.gameDate === w.dateStr && a.player === player && a.status === 'in');
                    return `<div style="display:flex; justify-content:space-between; padding:8px; border-bottom:1px solid var(--border);"><span>${w.label}</span><span style="color:${attended ? '#22c55e' : '#ef4444'};">${attended ? '✅ Played' : '❌ Absent'}</span></div>`;
                }).join('')}
            </div>
            <button onclick="document.getElementById('playerModal').style.display='none'" style="margin-top:20px; width:100%; background:var(--green);">Close</button>
        `;
        modal.style.display = 'flex';
    }
    
    async function renderApp() {
        await loadData();
        const weather = await getWeather();
        const weatherIcon = weather.condition.includes('Rain') ? '🌧️' : (weather.condition.includes('Cloud') ? '☁️' : '☀️');
        
        document.getElementById("appContainer").innerHTML = `
            <div class="header"><div class="logo-icon"><i class="fas fa-futbol"></i></div><h1>MONDAY NIGHT SOCCER</h1><p>Clifton Park, Brunswick • Victoria Street, Melbourne</p><div class="user-badge"><i class="fas fa-user-circle"></i> ${currentUser.role === "admin" ? "ADMIN" : currentUser.name}<button id="logoutBtn">Exit</button></div></div>
            <div class="info-widget"><div class="weather-section"><div class="weather-icon-large">${weatherIcon}</div><div><div class="weather-temp-large">${weather.temp}</div><div class="weather-detail">${weather.condition}</div></div></div><div class="time-section"><div class="aest-time" id="aestTime">--:--:--</div><div class="venue-info">Clifton Park, VIC | AEST/AEDT</div></div></div>
            <div class="tab-nav" id="tabNav"></div><div id="panelContainer"></div>
            <div id="playerModal" class="modal"><div class="modal-content" id="modalContent"></div></div>
        `;
        document.getElementById("logoutBtn").onclick = logout;
        setInterval(() => { const melb = getMelbourneTime(); const tEl = document.getElementById('aestTime'); if(tEl) tEl.textContent = melb.toLocaleTimeString('en-AU', { hour:'2-digit', minute:'2-digit', second:'2-digit' }); }, 1000);
        
        const tabs = [
            { id: "match", label: "LIVE MATCH", icon: "fa-stopwatch" },
            { id: "standings", label: "LEAGUE", icon: "fa-table" },
            { id: "rsvp", label: "RSVP", icon: "fa-calendar" },
            { id: "finance", label: "FINANCE", icon: "fa-dollar-sign" },
            { id: "players", label: "PLAYERS", icon: "fa-users" },
            { id: "teams", label: "TEAMS", icon: "fa-futbol" },
            { id: "history", label: "HISTORY", icon: "fa-history" },
            { id: "rules", label: "RULES", icon: "fa-book" }
        ];
        if (isAdminLoggedIn) tabs.unshift({ id: "admin", label: "ADMIN", icon: "fa-shield-alt" });
        
        document.getElementById("tabNav").innerHTML = tabs.map(t => `<button class="tab-btn" data-tab="${t.id}"><i class="fas ${t.icon}"></i> ${t.label}</button>`).join('');
        document.getElementById("panelContainer").innerHTML = tabs.map(t => `<div id="panel-${t.id}" class="panel"></div>`).join('');
        
        document.querySelectorAll(".tab-btn").forEach(btn => {
            btn.onclick = () => {
                const id = btn.getAttribute("data-tab");
                document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
                btn.classList.add("active");
                document.querySelectorAll(".panel").forEach(p => p.classList.remove("active-panel"));
                document.getElementById(`panel-${id}`).classList.add("active-panel");
                if (id === "match") renderMatch();
                if (id === "standings") renderStandings();
                if (id === "rsvp") renderRSVP();
                if (id === "finance") renderFinance();
                if (id === "players") renderPlayersList();
                if (id === "teams") renderTeams();
                if (id === "history") renderHistory();
                if (id === "rules") renderRules();
                if (id === "admin" && isAdminLoggedIn) renderAdmin();
            };
        });
        document.querySelector(".tab-btn").click();
    }
    
    function renderMatch() {
        document.getElementById("panel-match").innerHTML = `<div class="match-scoreboard"><div class="score-panel"><div class="team-score-card"><div style="color:#22c55e;">🟢 GREEN</div><div class="team-score-number" id="greenScoreVal">0</div></div><div style="font-size:36px;">⚔️</div><div class="team-score-card"><div style="color:#f97316;">🟠 ORANGE</div><div class="team-score-number" id="orangeScoreVal">0</div></div></div><div class="timer-display" id="timerVal">00:00</div><div class="control-buttons"><button class="goal-green" onclick="window.addGreenGoal()">🟢 GREEN +1</button><button class="goal-orange" onclick="window.addOrangeGoal()">🟠 ORANGE +1</button><button style="background:#10b981;" onclick="window.startTimer()">▶ START</button><button style="background:#f59e0b;" onclick="window.pauseTimer()">⏸ PAUSE</button><button style="background:#ef4444;" onclick="window.resetTimer()">🔄 RESET</button></div></div>`;
        updateScoreUI();
    }
    
    function renderStandings() {
        const { green, orange } = calculateStandings();
        document.getElementById("panel-standings").innerHTML = `<div class="card"><h2>🏆 2026 Season Standings (3-Point Rule)</h2><table class="standings-table"><thead><th>Team</th><th>P</th><th>W</th><th>D</th><th>L</th><th>GF</th><th>GA</th><th>GD</th><th>Pts</th></thead><tbody><tr class="green-row"><td><strong>🟢 GREEN</strong><td>${green.played}<td>${green.wins}<td>${green.draws}<td>${green.losses}<td>${green.gf}<td>${green.ga}<td>${green.gf-green.ga}<td style="font-weight:900;">${green.points}<tr class="orange-row"><td><strong>🟠 ORANGE</strong><td>${orange.played}<td>${orange.wins}<td>${orange.draws}<td>${orange.losses}<td>${orange.gf}<td>${orange.ga}<td>${orange.gf-orange.ga}<td style="font-weight:900;">${orange.points}</tbody></table><p style="margin-top:12px;">Win=3pts | Draw=1pt | Loss=0pts</p></div>`;
    }
    
    function renderRSVP() {
        const weeks = getFutureWeeks();
        if (!weeks.length) { document.getElementById("panel-rsvp").innerHTML = `<div class="card"><h2>RSVP</h2><p>No upcoming matches</p></div>`; return; }
        document.getElementById("panel-rsvp").innerHTML = `<div class="card"><h2>📅 Weekly RSVP · $${WEEKLY_FEE}</h2><select id="rsvpWeek">${weeks.map(w=>`<option value="${w.dateStr}">${w.label}</option>`)}</select><select id="rsvpPlayer"><option>-- Select Name --</option>${players.map(p=>`<option>${escapeHtml(p)}</option>`)}</select><div class="flex-btns"><button id="rsvpYesBtn">✅ I'm Playing</button><button id="rsvpNoBtn" class="btn-outline">❌ Can't Play</button></div><div id="rsvpMsg"></div></div><div class="card"><h2>👥 This Week's Players</h2><div id="attendeesList"></div></div>`;
        document.getElementById("rsvpYesBtn").onclick = async () => { const p = document.getElementById("rsvpPlayer").value, w = document.getElementById("rsvpWeek").value; if(p && p !== "-- Select Name --") { await saveAttendance({player:p, gameDate:w, status:"in"}); renderAttendees(); document.getElementById("rsvpMsg").innerHTML = `✅ ${p} added`; setTimeout(()=>document.getElementById("rsvpMsg").innerHTML="",2000); } };
        document.getElementById("rsvpNoBtn").onclick = async () => { const p = document.getElementById("rsvpPlayer").value, w = document.getElementById("rsvpWeek").value; if(p && p !== "-- Select Name --") { await saveAttendance({player:p, gameDate:w, status:"out"}); renderAttendees(); document.getElementById("rsvpMsg").innerHTML = `❌ ${p} unavailable`; setTimeout(()=>document.getElementById("rsvpMsg").innerHTML="",2000); } };
        document.getElementById("rsvpWeek").onchange = renderAttendees;
        renderAttendees();
    }
    async function renderAttendees() {
        const week = document.getElementById("rsvpWeek")?.value;
        if(!week) return;
        const attending = attendance.filter(a => a.gameDate === week && a.status === 'in').map(a=>a.player);
        const weeklyGuests = guests.filter(g=>g.gameDate===week).map(g=>g.guestName);
        document.getElementById("attendeesList").innerHTML = `<div class="attendee-tags">${[...attending, ...weeklyGuests].map(p => `<span class="attendee-tag">${escapeHtml(p)} ${weeklyGuests.includes(p)?'🎭':''}</span>`).join('') || '<span>None yet</span>'}</div>`;
    }
    
    function renderFinance() {
        const total = payments.reduce((s,p)=>s+WEEKLY_FEE,0);
        const week = getFutureWeeks()[0]?.dateStr || getMelbourneDate();
        const attendingThisWeek = attendance.filter(a => a.gameDate === week && a.status === 'in').map(a=>a.player);
        const paidThisWeek = payments.filter(p => p.gameDate === week).map(p=>p.player);
        const unpaidThisWeek = attendingThisWeek.filter(p => !paidThisWeek.includes(p));
        const weeklyOutstanding = unpaidThisWeek.length * WEEKLY_FEE;
        
        let allDebts = [];
        players.forEach(p => { const debt = getPlayerDebt(p); if(debt > 0) allDebts.push({ player: p, debt }); });
        allDebts.sort((a,b)=>b.debt - a.debt);
        
        document.getElementById("panel-finance").innerHTML = `<div class="card" style="border:2px solid #22c55e;"><h2>💰 Treasury Overview</h2><div style="font-size:48px; font-weight:800; text-align:center; color:#22c55e;">$${total}</div><div style="text-align:center;">Total Collected All Time</div></div>
        <div class="card"><h2>📋 This Week's Outstanding (${week})</h2><div style="font-size:32px; font-weight:800; color:#ef4444; text-align:center;">$${weeklyOutstanding}</div><div>${unpaidThisWeek.length} players have not paid: ${unpaidThisWeek.join(', ') || 'All paid!'}</div></div>
        <div class="card"><h2>📋 Player Debt Ledger</h2><table class="data-table"><thead><th>Player</th><th>Amount Owed</th><th>Weeks Unpaid</th></thead><tbody>${allDebts.map(d => `<tr class="debt-row"><td>${escapeHtml(d.player)}<td style="color:#ef4444;">$${d.debt}<td>${Math.round(d.debt/WEEKLY_FEE)} weeks`).join('') || '<tr><td colspan="3">No outstanding debts!</tr>'}</tbody></table></div>`;
    }
    
    function renderPlayersList() {
        const playerStats = players.map(p => ({ name: p, games: getPlayerAttendanceCount(p), goals: getPlayerGoals(p), debt: getPlayerDebt(p) })).sort((a,b)=>b.games - a.games);
        document.getElementById("panel-players").innerHTML = `<div class="card"><h2>👥 Player Directory</h2><p style="margin-bottom:16px;">Click any player card to view detailed profile</p>${playerStats.map(p => `<div class="player-profile-card" onclick="showPlayerProfile('${escapeHtml(p.name)}')"><div class="profile-name">${escapeHtml(p.name)}</div><div class="profile-stats"><span class="profile-stat">🎽 ${p.games} games</span><span class="profile-stat">⚽ ${p.goals} goals</span><span class="profile-stat">💰 $${p.debt} owed</span></div></div>`).join('')}</div>`;
    }
    
    function renderTeams() {
        const weeks = getFutureWeeks();
        if (!weeks.length) { document.getElementById("panel-teams").innerHTML = `<div class="card">No upcoming matches</div>`; return; }
        document.getElementById("panel-teams").innerHTML = `<div class="card"><h2>🏟️ Team Lineups</h2><select id="teamWeek">${weeks.map(w=>`<option value="${w.dateStr}">${w.label}</option>`)}</select><div style="background:linear-gradient(145deg,#2e7d32,#1b5e20); border-radius:28px; padding:20px; margin-top:16px;"><div class="teams-row" style="display:flex; gap:16px; flex-wrap:wrap;" id="teamsContainer"></div><div id="teamScore" style="text-align:center; margin-top:16px; color:white; font-weight:800;"></div></div></div>`;
        document.getElementById("teamWeek").onchange = renderTeamLineup;
        renderTeamLineup();
    }
    function renderTeamLineup() {
        const week = document.getElementById("teamWeek")?.value;
        if(!week) return;
        const assign = teamAssignments[week] || {};
        const green = Object.keys(assign).filter(p => assign[p] === "green").sort();
        const orange = Object.keys(assign).filter(p => assign[p] === "orange").sort();
        const match = matchResults[week] || { greenScore: 0, orangeScore: 0 };
        document.getElementById("teamsContainer").innerHTML = `<div style="flex:1; background:rgba(0,0,0,0.7); border-radius:20px; padding:16px;"><div style="background:#22c55e; border-radius:60px; padding:10px; text-align:center; font-weight:800; margin-bottom:12px;">🟢 GREEN</div><div style="display:flex; flex-direction:column; gap:8px;">${green.map(p => `<div style="background:rgba(255,255,255,0.15); border-radius:40px; padding:8px; text-align:center;">${escapeHtml(p)}</div>`).join('') || '<div>—</div>'}</div></div><div style="flex:1; background:rgba(0,0,0,0.7); border-radius:20px; padding:16px;"><div style="background:#f97316; border-radius:60px; padding:10px; text-align:center; font-weight:800; margin-bottom:12px;">🟠 ORANGE</div><div style="display:flex; flex-direction:column; gap:8px;">${orange.map(p => `<div style="background:rgba(255,255,255,0.15); border-radius:40px; padding:8px; text-align:center;">${escapeHtml(p)}</div>`).join('') || '<div>—</div>'}</div></div>`;
        document.getElementById("teamScore").innerHTML = `🏆 SCORE: 🟢 ${match.greenScore || 0} — ${match.orangeScore || 0} 🟠`;
    }
    
    async function renderHistory() {
        const past = getPastWeeks();
        if (!past.length) { document.getElementById("panel-history").innerHTML = `<div class="card"><h2>Match History</h2><p>No past games yet</p></div>`; return; }
        let html = `<div class="card"><h2>📖 Complete Match History · Clifton Park</h2></div>`;
        for (let week of past) {
            const assign = teamAssignments[week.dateStr] || {};
            const green = Object.keys(assign).filter(p => assign[p] === "green").sort();
            const orange = Object.keys(assign).filter(p => assign[p] === "orange").sort();
            const match = matchResults[week.dateStr] || { greenScore: 0, orangeScore: 0, goals: {} };
            const goals = match.goals || {};
            const greenGoals = [], orangeGoals = [];
            for (const [player, count] of Object.entries(goals)) {
                if (count > 0) {
                    if (green.includes(player)) greenGoals.push({ player, count });
                    else if (orange.includes(player)) orangeGoals.push({ player, count });
                }
            }
            const comments = matchComments[week.dateStr] || [];
            const safeId = week.dateStr.replace(/-/g,'');
            html += `<div class="history-card"><div class="history-header"><div class="history-date"><i class="far fa-calendar-alt"></i> ${week.label}</div><div class="history-result">🟢 ${match.greenScore || 0} — ${match.orangeScore || 0} 🟠</div></div><div class="history-pitch"><div class="history-teams"><div class="history-team"><div class="history-team-name" style="background:#22c55e; color:#064e3b;">🟢 GREEN (${green.length})</div><div class="history-players">${green.map(p => `<span class="history-player">${escapeHtml(p)}</span>`).join('') || '<span>—</span>'}</div></div><div class="history-team"><div class="history-team-name" style="background:#f97316; color:white;">🟠 ORANGE (${orange.length})</div><div class="history-players">${orange.map(p => `<span class="history-player">${escapeHtml(p)}</span>`).join('') || '<span>—</span>'}</div></div></div></div><div class="history-goals"><strong>⚽ Goal Scorers:</strong><br>${greenGoals.map(g => `<span class="goal-badge" style="border-left:3px solid #22c55e;">🟢 ${escapeHtml(g.player)} (${g.count})</span>`).join('')} ${orangeGoals.map(g => `<span class="goal-badge" style="border-left:3px solid #f97316;">🟠 ${escapeHtml(g.player)} (${g.count})</span>`).join('')} ${greenGoals.length === 0 && orangeGoals.length === 0 ? '<span>No goals recorded</span>' : ''}</div><div style="padding:16px;"><strong>💬 Comments (${comments.length})</strong><div id="comments-${safeId}" style="margin-top:8px;">${comments.map(c => `<div style="background:#f8fafc; border-radius:16px; padding:10px; margin-bottom:8px;"><strong>${escapeHtml(c.author)}</strong> <span style="font-size:10px;">${new Date(c.timestamp).toLocaleString()}</span><div>${escapeHtml(c.text)}</div></div>`).join('') || '<div style="color:#64748b;">No comments yet</div>'}</div><div style="display:flex; gap:10px; margin-top:12px;"><input type="text" id="comment-${safeId}" placeholder="Add a comment..." style="flex:1; padding:12px; border-radius:60px; border:1px solid #e2e8f0;"><button onclick="window.addCommentToGame('${week.dateStr}')" style="background:#22c55e;">Post</button></div></div></div>`;
        }
        document.getElementById("panel-history").innerHTML = html;
    }
    window.addCommentToGame = async function(gameDate) { const safeId = gameDate.replace(/-/g,''); const input = document.getElementById(`comment-${safeId}`); const text = input?.value.trim(); if(text) { await saveComment(gameDate, currentUser.name, text); renderHistory(); } };
    
    function renderRules() { document.getElementById("panel-rules").innerHTML = `<div class="card"><h2>📜 Club Rules</h2><ul style="line-height:1.9; margin-left:24px;"><li>❌ No tackling from behind → Free kick</li><li>🧤 Goalie rotation (5 min minimum) → Goal penalty</li><li>⚡ No showboating → Expulsion</li><li>🔴 Foul within 1m of goal → Shot from halfway</li><li>💰 $${WEEKLY_FEE} weekly fee per player</li><li>📊 3-Point System: Win=3, Draw=1, Loss=0</li><li>📍 Monday 7:30pm · Clifton Park, Brunswick</li></ul></div>`; }
    
    async function renderAdmin() {
        const future = getFutureWeeks();
        document.getElementById("panel-admin").innerHTML = `<div class="card"><h3>👥 Manage Players</h3><div id="playersListAdmin"></div><div style="display:flex; gap:12px; margin-top:16px;"><input id="newPlayerName" placeholder="New player name" style="flex:1;"><button id="addPlayerAdminBtn" style="background:#22c55e;">➕ Add Player</button></div></div><div class="card"><h3>💰 Collect Fees</h3><select id="adminCashWeek">${future.map(w=>`<option value="${w.dateStr}">${w.label}</option>`)}</select><div id="adminCashList"></div></div><div class="card"><h3>👥 Team Assignment</h3><select id="adminAssignWeek">${future.map(w=>`<option value="${w.dateStr}">${w.label}</option>`)}</select><div id="adminAssignList"></div><button id="saveTeamsAdminBtn" style="margin-top:16px;">💾 Save Teams</button></div><div class="card"><h3>🎭 Add Guest</h3><select id="adminGuestWeek">${future.map(w=>`<option value="${w.dateStr}">${w.label}</option>`)}</select><input id="adminGuestName" placeholder="Guest name"><button id="addGuestAdminBtn">+ Add Guest</button><div id="adminGuestList"></div></div><div class="card"><h3>⚽ Set Score & Goals</h3><select id="adminScoreWeek">${ALL_WEEKS.map(w=>`<option value="${w.dateStr}">${w.label}</option>`)}</select><div class="flex-btns"><input type="number" id="adminGreenScore" placeholder="Green" style="width:100px;"><input type="number" id="adminOrangeScore" placeholder="Orange" style="width:100px;"><button id="saveScoreAdminBtn">Save</button></div><div id="adminGoalInputs"></div></div>`;
        renderPlayersAdmin();
        document.getElementById("addPlayerAdminBtn").onclick = async () => { const name = document.getElementById("newPlayerName").value.trim(); if(name && !players.includes(name)) { players.push(name); players.sort(); await savePlayers(); renderPlayersAdmin(); renderAdmin(); alert(`Added ${name}`); } };
        document.getElementById("adminCashWeek").onchange = renderAdminCash;
        document.getElementById("adminAssignWeek").onchange = renderAdminAssign;
        document.getElementById("saveTeamsAdminBtn").onclick = async () => { await saveTeams(); renderTeamLineup(); alert("Teams saved"); };
        document.getElementById("addGuestAdminBtn").onclick = async () => { const name = document.getElementById("adminGuestName").value.trim(), week = document.getElementById("adminGuestWeek").value; if(name && week) { await saveGuest({guestName:name, gameDate:week}); document.getElementById("adminGuestName").value=""; renderAdminGuestList(); renderAdminAssign(); renderAttendees(); alert(`Guest ${name} added`); } };
        document.getElementById("saveScoreAdminBtn").onclick = async () => { const week = document.getElementById("adminScoreWeek").value, g = parseInt(document.getElementById("adminGreenScore").value)||0, o = parseInt(document.getElementById("adminOrangeScore").value)||0; if(!matchResults[week]) matchResults[week]={}; matchResults[week].greenScore=g; matchResults[week].orangeScore=o; await saveResults(); alert("Score saved"); renderHistory(); renderTeamLineup(); renderStandings(); };
        document.getElementById("adminScoreWeek").onchange = renderAdminGoals;
        renderAdminCash(); renderAdminAssign(); renderAdminGuestList(); renderAdminGoals();
    }
    function renderPlayersAdmin() { let html = `<div style="max-height:220px; overflow-y:auto; border:1px solid var(--border); border-radius:20px;">`; for(let p of players) { html += `<div style="display:flex; justify-content:space-between; align-items:center; padding:10px 14px; border-bottom:1px solid #e2e8f0;"><span>${escapeHtml(p)}</span><button class="delPlayerAdminBtn" data-name="${escapeHtml(p)}" style="background:#ef4444; padding:5px 14px; min-width:auto;">Delete</button></div>`; } html += `</div>`; document.getElementById("playersListAdmin").innerHTML = html; document.querySelectorAll(".delPlayerAdminBtn").forEach(btn=>btn.onclick=async()=>{ const name = btn.getAttribute("data-name"); if(confirm(`Delete ${name}?`)){ players = players.filter(p=>p!==name); await savePlayers(); renderPlayersAdmin(); renderAdmin(); alert(`Deleted ${name}`); } }); }
    async function renderAdminCash() { const week = document.getElementById("adminCashWeek").value; const attending = attendance.filter(a=>a.gameDate===week && a.status==='in').map(a=>a.player); const paidList = payments.filter(p=>p.gameDate===week).map(p=>p.player); let html = `<strong>💰 ${attending.length} players ($${WEEKLY_FEE} each)</strong>`; for(let p of attending){ const isPaid = paidList.includes(p); html += `<div style="display:flex; justify-content:space-between; margin:8px 0; background:#f1f5f9; border-radius:60px; padding:10px 16px;"><span>${escapeHtml(p)}</span><button class="collectAdminBtn" data-player="${escapeHtml(p)}" style="background:${isPaid?'#10b981':'#22c55e'};">${isPaid?'Paid':'Collect $5'}</button></div>`; } document.getElementById("adminCashList").innerHTML = html; document.querySelectorAll(".collectAdminBtn").forEach(btn=>btn.onclick=async()=>{ const player=btn.dataset.player; if(!payments.find(p=>p.player===player&&p.gameDate===week)){ await savePayment({player, gameDate:week, amount:WEEKLY_FEE}); renderAdminCash(); renderFinance(); } }); }
    async function renderAdminAssign() { const week = document.getElementById("adminAssignWeek").value; const attending = attendance.filter(a=>a.gameDate===week && a.status==='in').map(a=>a.player); const weeklyGuests = guests.filter(g=>g.gameDate===week).map(g=>g.guestName); const all = [...attending, ...weeklyGuests]; if(!teamAssignments[week]) teamAssignments[week]={}; let html = ``; for(let p of all){ const current = teamAssignments[week][p] || ""; html += `<div style="display:flex; justify-content:space-between; margin:8px 0; background:#f1f5f9; border-radius:60px; padding:10px 16px;"><span>${escapeHtml(p)} ${weeklyGuests.includes(p)?'🎭':''}</span><select class="teamSelectAdmin" data-player="${escapeHtml(p)}" style="width:140px;"><option value="">— Select —</option><option value="green" ${current==="green"?"selected":""}>🟢 Green</option><option value="orange" ${current==="orange"?"selected":""}>🟠 Orange</option></select></div>`; } document.getElementById("adminAssignList").innerHTML = html; document.querySelectorAll(".teamSelectAdmin").forEach(sel=>sel.addEventListener("change",()=>{ const player=sel.dataset.player; const val=sel.value; if(val) teamAssignments[week][player]=val; else delete teamAssignments[week][player]; })); }
    async function renderAdminGoals() { const week = document.getElementById("adminScoreWeek").value; const assign = teamAssignments[week] || {}; const allPlayers = [...new Set([...Object.keys(assign), ...(guests.filter(g=>g.gameDate===week).map(g=>g.guestName))])]; const goals = (matchResults[week] && matchResults[week].goals) || {}; let html = `<label>Goal Scorers:</label>`; for(let p of allPlayers) { const goalCount = goals[p] || 0; html += `<div style="display:flex; justify-content:space-between; margin:8px 0;"><span>${escapeHtml(p)}</span><select class="goalSelectAdmin" data-player="${escapeHtml(p)}" style="width:100px;"><option value="0">0</option><option value="1" ${goalCount===1?"selected":""}>1</option><option value="2" ${goalCount===2?"selected":""}>2</option><option value="3" ${goalCount===3?"selected":""}>3</option><option value="4" ${goalCount===4?"selected":""}>4</option><option value="5" ${goalCount===5?"selected":""}>5</option></select></div>`; } document.getElementById("adminGoalInputs").innerHTML = html; document.querySelectorAll(".goalSelectAdmin").forEach(sel=>sel.addEventListener("change",()=>{ const player=sel.dataset.player; const val=parseInt(sel.value); if(!matchResults[week]) matchResults[week]={goals:{}}; if(!matchResults[week].goals) matchResults[week].goals={}; if(val>0) matchResults[week].goals[player]=val; else delete matchResults[week].goals[player]; })); }
    async function renderAdminGuestList() { const week = document.getElementById("adminGuestWeek").value; const weeklyGuests = guests.filter(g=>g.gameDate===week); document.getElementById("adminGuestList").innerHTML = `<div style="margin-top:12px; background:#f1f5f9; border-radius:60px; padding:12px; text-align:center;">🎭 Guests: ${weeklyGuests.map(g=>escapeHtml(g.guestName)).join(', ') || 'none'}</div>`; }
    
    window.startTimer = startTimer; window.pauseTimer = pauseTimer; window.resetTimer = resetTimer;
    window.addGreenGoal = addGreenGoal; window.addOrangeGoal = addOrangeGoal;
    window.showPlayerProfile = showPlayerProfile;
    function escapeHtml(str) { return String(str).replace(/[&<>]/g, m => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;' }[m])); }
    
    async function renderLogin() { await loadData(); document.getElementById("appContainer").innerHTML = `<div style="background:white; border-radius:40px; padding:40px; max-width:400px; margin:80px auto; text-align:center;"><div class="logo-icon" style="margin:0 auto 20px;"><i class="fas fa-futbol"></i></div><h2 style="font-size:28px;">Monday Night Soccer</h2><p style="margin-bottom:24px;">Clifton Park, Brunswick</p><select id="playerSelect" style="margin-bottom:18px;"><option>-- Select Player --</option>${players.map(p=>`<option>${escapeHtml(p)}</option>`)}</select><button id="playerBtn" style="width:100%; background:#22c55e;">Enter as Player</button><hr style="margin:24px 0;"><input type="password" id="adminPw" placeholder="Admin Password"><button id="adminBtn" style="width:100%; margin-top:14px;">Admin Login</button><div id="loginErr" style="color:#ef4444; margin-top:16px;"></div></div>`; document.getElementById("playerBtn").onclick = () => { const name = document.getElementById("playerSelect").value; if(name && name !== "-- Select Player --") loginPlayer(name); else document.getElementById("loginErr").innerText = "Select your name"; }; document.getElementById("adminBtn").onclick = () => { if(!loginAdmin(document.getElementById("adminPw").value)) document.getElementById("loginErr").innerText = "Wrong password"; }; }
    
    (async () => { const stored = localStorage.getItem("soccer_user"); if(stored) { try { const u = JSON.parse(stored); if(u.role==="admin"){ isAdminLoggedIn=true; currentUser={name:"Admin",role:"admin"}; } else { currentUser={name:u.name,role:"player"}; } await loadData(); renderApp(); return; } catch(e){} } renderLogin(); })();
</script>
