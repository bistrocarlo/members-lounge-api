<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Wedding Seating Manager | Import CSV Guests</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Georgia', 'Times New Roman', Times, serif;
            background: #faf8f3;
            padding: 20px;
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
        }

        .header {
            background: linear-gradient(135deg, #c9a84c, #e8d5a8);
            border-radius: 24px;
            padding: 25px 30px;
            margin-bottom: 25px;
            text-align: center;
            color: #2c2418;
        }

        .header h1 {
            font-size: 1.8rem;
            font-weight: 400;
            letter-spacing: 2px;
        }

        .stats-bar {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        .stat {
            background: white;
            border-radius: 16px;
            padding: 15px 25px;
            flex: 1;
            text-align: center;
            border: 1px solid #e8dcc8;
        }

        .stat-number {
            font-size: 2rem;
            font-weight: bold;
            color: #c9a84c;
        }

        .toolbar {
            background: white;
            border-radius: 20px;
            padding: 15px 20px;
            margin-bottom: 25px;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            border: 1px solid #e8dcc8;
            align-items: center;
        }

        .btn {
            background: #c9a84c;
            border: none;
            padding: 10px 20px;
            border-radius: 30px;
            cursor: pointer;
            font-family: inherit;
            font-weight: 600;
            font-size: 0.85rem;
            transition: all 0.2s;
        }

        .btn:hover {
            background: #b8953a;
            transform: translateY(-1px);
        }

        .btn-secondary {
            background: #e8dcc8;
            color: #5a4a35;
        }

        .btn-success {
            background: #27ae60;
            color: white;
        }

        .btn-pdf {
            background: #e74c3c;
            color: white;
        }

        .btn-csv {
            background: #3498db;
            color: white;
        }

        .btn-warning {
            background: #f39c12;
            color: white;
        }

        .search-box {
            background: white;
            border-radius: 20px;
            padding: 15px 20px;
            margin-bottom: 25px;
            border: 1px solid #e8dcc8;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            align-items: center;
        }

        .search-input {
            flex: 1;
            padding: 12px 18px;
            border-radius: 40px;
            border: 1px solid #e8dcc8;
            font-size: 1rem;
            font-family: inherit;
            background: #fefcf8;
        }

        .import-area {
            background: white;
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 25px;
            border: 1px solid #e8dcc8;
            border-left: 5px solid #27ae60;
        }

        .import-area h3 {
            color: #27ae60;
            margin-bottom: 15px;
        }

        .csv-input {
            width: 100%;
            padding: 12px;
            border: 1px dashed #c9a84c;
            border-radius: 16px;
            background: #fefcf8;
            margin-bottom: 10px;
        }

        .import-preview {
            max-height: 200px;
            overflow-y: auto;
            background: #faf5ea;
            border-radius: 12px;
            padding: 10px;
            margin-top: 10px;
            font-size: 0.75rem;
            display: none;
        }

        .import-preview.active {
            display: block;
        }

        .main-layout {
            display: flex;
            gap: 25px;
            flex-wrap: wrap;
        }

        .tables-area {
            flex: 2;
            min-width: 300px;
        }

        .guests-area {
            flex: 1;
            min-width: 280px;
            background: white;
            border-radius: 20px;
            border: 1px solid #e8dcc8;
            padding: 20px;
            height: fit-content;
            position: sticky;
            top: 20px;
        }

        .tables-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 18px;
        }

        .table-card {
            background: white;
            border-radius: 20px;
            border: 1px solid #e8dcc8;
            overflow: hidden;
        }

        .table-card.bridal {
            border: 2px solid #c9a84c;
            background: #fffcf5;
        }

        .table-header {
            background: #faf5ea;
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            border-bottom: 1px solid #e8dcc8;
            font-weight: bold;
        }

        .table-guests {
            padding: 12px;
            min-height: 100px;
            max-height: 220px;
            overflow-y: auto;
        }

        .guest-chip {
            display: inline-block;
            background: #fef7e9;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.7rem;
            margin: 3px 5px 3px 0;
            border: 1px solid #e8dcc8;
            cursor: pointer;
        }

        .guest-chip.manual {
            background: #e8f5e9;
            border-color: #a5d6a7;
        }

        .guest-chip.imported {
            background: #e3f2fd;
            border-color: #90caf9;
        }

        .guest-chip:hover {
            background: #e8dcc8;
        }

        .empty-table {
            color: #bfae8e;
            text-align: center;
            padding: 15px;
            font-style: italic;
            font-size: 0.7rem;
        }

        .guest-list-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #efe4d4;
        }

        .guest-name {
            font-weight: 500;
            font-size: 0.85rem;
        }

        .guest-group {
            font-size: 0.65rem;
            color: #c9a84c;
        }

        .warning {
            background: #fff3e0;
            border-radius: 16px;
            padding: 10px 15px;
            margin-bottom: 20px;
            color: #b86b2c;
            font-size: 0.8rem;
        }

        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #2c2418;
            color: white;
            padding: 10px 24px;
            border-radius: 40px;
            font-size: 0.8rem;
            z-index: 1001;
            animation: fadeOut 2.5s forwards;
        }

        @keyframes fadeOut {
            0% { opacity: 1; }
            70% { opacity: 1; }
            100% { opacity: 0; visibility: hidden; }
        }

        @media (max-width: 700px) {
            .main-layout { flex-direction: column; }
            .guests-area { position: static; }
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body>
<div id="app">Loading wedding seating planner...</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, getDocs, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAH0rBpJUh3sRpBlQgrymQM1RLBDBiAPmE",
        authDomain: "daniel-and-laura.firebaseapp.com",
        projectId: "daniel-and-laura",
        storageBucket: "daniel-and-laura.firebasestorage.app",
        messagingSenderId: "363458517473",
        appId: "1:363458517473:web:7eac683bc98623cb281aa0"
    };

    const firebaseApp = initializeApp(firebaseConfig);
    const db = getFirestore(firebaseApp);

    const TOTAL_TABLES = 32;
    const BRIDAL_TABLE = "bridal";
    const MAX_PER_TABLE = 11;
    const MIN_PER_TABLE = 6;

    let allGuests = [];
    let tableMap = new Map();
    let guestTableMap = new Map();
    let currentSearch = "";

    function showToast(msg) {
        let toast = document.querySelector('.toast');
        if (toast) toast.remove();
        toast = document.createElement('div');
        toast.className = 'toast';
        toast.textContent = msg;
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 2500);
    }

    function showLoading(show) {
        let el = document.querySelector('.loading-overlay');
        if (show && !el) {
            let div = document.createElement('div');
            div.className = 'loading-overlay';
            div.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);display:flex;justify-content:center;align-items:center;z-index:2000;';
            div.innerHTML = '<div style="background:white;padding:20px 30px;border-radius:30px;">⏳ Loading...</div>';
            document.body.appendChild(div);
        } else if (!show && el) el.remove();
    }

    function initTables() {
        tableMap.clear();
        for (let i = 1; i <= TOTAL_TABLES; i++) {
            tableMap.set(i.toString(), { name: `Table ${i}`, guests: [] });
        }
        tableMap.set(BRIDAL_TABLE, { name: "👰 Bridal Table", guests: [] });
    }

    async function loadSeatingFromFirebase() {
        try {
            const seatingDoc = await getDoc(doc(db, "wedding_seating", "master"));
            if (seatingDoc.exists()) {
                const data = seatingDoc.data();
                if (data.tableMap) {
                    const loadedMap = new Map();
                    for (const [tid, tableData] of Object.entries(data.tableMap)) {
                        loadedMap.set(tid, { 
                            name: tableData.name || (tid === BRIDAL_TABLE ? "👰 Bridal Table" : `Table ${tid}`),
                            guests: tableData.guests || [] 
                        });
                    }
                    guestTableMap.clear();
                    for (const [tid, table] of loadedMap.entries()) {
                        if (table.guests) {
                            for (const g of table.guests) {
                                if (g && g.id) guestTableMap.set(g.id, tid);
                            }
                        }
                    }
                    return loadedMap;
                }
            }
        } catch (err) {
            console.error("Error loading seating:", err);
        }
        return null;
    }

    async function saveSeatingToFirebase() {
        showLoading(true);
        try {
            const exportMap = {};
            for (const [key, val] of tableMap.entries()) {
                exportMap[key] = { name: val.name, guests: val.guests };
            }
            await setDoc(doc(db, "wedding_seating", "master"), {
                tableMap: exportMap,
                updatedAt: new Date().toISOString(),
                totalGuests: allGuests.length,
                seatedCount: Array.from(tableMap.values()).reduce((sum, t) => sum + t.guests.length, 0)
            });
            showToast("✓ Seating saved to Firebase!");
        } catch (err) {
            alert("Save failed: " + err.message);
        } finally {
            showLoading(false);
        }
    }

    // Parse CSV content and extract guest names with table assignments
    function parseCSVAndAddGuests(csvText) {
        const lines = csvText.split(/\r?\n/);
        const headers = lines[0].split(',');
        const tableIdx = headers.findIndex(h => h.replace(/"/g, '') === 'Table');
        const guestNameIdx = headers.findIndex(h => h.replace(/"/g, '') === 'Guest Name');
        const verifiedIdx = headers.findIndex(h => h.replace(/"/g, '') === 'Verified Names');
        const countIdx = headers.findIndex(h => h.replace(/"/g, '') === 'Guest Count');
        
        if (tableIdx === -1 || guestNameIdx === -1) {
            showToast("CSV format not recognized. Need 'Table' and 'Guest Name' columns.");
            return [];
        }
        
        const imported = [];
        const seenGuests = new Set(allGuests.map(g => g.name.toLowerCase()));
        
        for (let i = 1; i < lines.length; i++) {
            if (!lines[i].trim()) continue;
            
            // Simple CSV parsing (handles quoted fields)
            let row = [];
            let inQuote = false;
            let current = '';
            for (let ch of lines[i]) {
                if (ch === '"') {
                    inQuote = !inQuote;
                } else if (ch === ',' && !inQuote) {
                    row.push(current.trim());
                    current = '';
                } else {
                    current += ch;
                }
            }
            row.push(current.trim());
            
            if (row.length <= Math.max(tableIdx, guestNameIdx)) continue;
            
            let tableName = row[tableIdx].replace(/^"|"$/g, '').trim();
            let guestNameRaw = row[guestNameIdx].replace(/^"|"$/g, '').trim();
            let verifiedNames = verifiedIdx !== -1 ? row[verifiedIdx].replace(/^"|"$/g, '').trim() : '';
            let guestCount = countIdx !== -1 ? parseInt(row[countIdx]) || 1 : 1;
            
            if (!tableName || !guestNameRaw || guestNameRaw === '' || guestNameRaw.toLowerCase() === 'guest name') continue;
            
            // Parse verified names to get individual guests
            let individualNames = [];
            if (verifiedNames && verifiedNames !== '') {
                individualNames = verifiedNames.split(/[;,]+/).map(n => n.trim()).filter(n => n && n !== '?');
            }
            
            // If no verified names, use guest name and maybe split by & or and
            if (individualNames.length === 0) {
                if (guestNameRaw.includes(' & ')) {
                    individualNames = guestNameRaw.split(' & ').map(n => n.trim());
                } else if (guestNameRaw.toLowerCase().includes(' and ')) {
                    individualNames = guestNameRaw.split(/ and /i).map(n => n.trim());
                } else if (guestNameRaw.includes(',')) {
                    individualNames = guestNameRaw.split(',').map(n => n.trim());
                } else {
                    individualNames = [guestNameRaw];
                }
            }
            
            // Limit to guestCount
            if (individualNames.length > guestCount) individualNames = individualNames.slice(0, guestCount);
            
            for (let name of individualNames) {
                if (name && name !== '' && name !== '?' && !seenGuests.has(name.toLowerCase())) {
                    imported.push({
                        name: name,
                        tableId: tableName.toLowerCase() === 'bridal' ? BRIDAL_TABLE : tableName,
                        group: guestNameRaw,
                        isImported: true
                    });
                    seenGuests.add(name.toLowerCase());
                }
            }
        }
        
        return imported;
    }

    function addImportedGuestsToTables(guestsToAdd) {
        let added = 0;
        let skipped = 0;
        
        for (const guest of guestsToAdd) {
            // Check if already exists
            if (allGuests.some(g => g.name.toLowerCase() === guest.name.toLowerCase())) {
                skipped++;
                continue;
            }
            
            const guestId = `imported_${Date.now()}_${Math.random().toString(36).substr(2, 6)}_${added}`;
            const newGuest = {
                id: guestId,
                name: guest.name,
                group: guest.group,
                isImported: true
            };
            
            allGuests.push(newGuest);
            
            // Find target table
            let targetTableId = guest.tableId;
            if (targetTableId === BRIDAL_TABLE) {
                // Add to bridal table
                const bridalTable = tableMap.get(BRIDAL_TABLE);
                if (bridalTable) {
                    bridalTable.guests.push({ ...newGuest });
                    guestTableMap.set(guestId, BRIDAL_TABLE);
                    added++;
                }
            } else {
                // Try to parse as table number
                let tableNum = parseInt(targetTableId);
                if (isNaN(tableNum)) {
                    // Try to extract number
                    const match = targetTableId.match(/\d+/);
                    if (match) tableNum = parseInt(match[0]);
                }
                
                if (tableNum >= 1 && tableNum <= TOTAL_TABLES) {
                    const table = tableMap.get(tableNum.toString());
                    if (table && table.guests.length < MAX_PER_TABLE) {
                        table.guests.push({ ...newGuest });
                        guestTableMap.set(guestId, tableNum.toString());
                        added++;
                    } else {
                        // Find a table with space
                        let placed = false;
                        for (let i = 1; i <= TOTAL_TABLES; i++) {
                            const t = tableMap.get(i.toString());
                            if (t && t.guests.length < MAX_PER_TABLE) {
                                t.guests.push({ ...newGuest });
                                guestTableMap.set(guestId, i.toString());
                                added++;
                                placed = true;
                                break;
                            }
                        }
                        if (!placed) {
                            skipped++;
                        }
                    }
                } else {
                    // Put in first available table
                    let placed = false;
                    for (let i = 1; i <= TOTAL_TABLES; i++) {
                        const t = tableMap.get(i.toString());
                        if (t && t.guests.length < MAX_PER_TABLE) {
                            t.guests.push({ ...newGuest });
                            guestTableMap.set(guestId, i.toString());
                            added++;
                            placed = true;
                            break;
                        }
                    }
                    if (!placed) skipped++;
                }
            }
        }
        
        return { added, skipped };
    }

    function getUnassignedGuests() {
        return allGuests.filter(g => !guestTableMap.has(g.id));
    }

    function assignGuestToTable(guest, tableId) {
        const table = tableMap.get(tableId);
        if (!table) return false;
        
        if (tableId !== BRIDAL_TABLE && table.guests.length >= MAX_PER_TABLE) {
            showToast(`Table is full (max ${MAX_PER_TABLE} guests)`);
            return false;
        }
        
        const oldTableId = guestTableMap.get(guest.id);
        if (oldTableId) {
            const oldTable = tableMap.get(oldTableId);
            if (oldTable) {
                oldTable.guests = oldTable.guests.filter(g => g.id !== guest.id);
            }
        }
        
        table.guests.push({ ...guest });
        guestTableMap.set(guest.id, tableId);
        renderApp();
        return true;
    }

    function removeGuestFromTable(guestId, tableId) {
        const table = tableMap.get(tableId);
        if (table) {
            table.guests = table.guests.filter(g => g.id !== guestId);
            guestTableMap.delete(guestId);
            renderApp();
        }
    }

    function resetAllSeating() {
        if (confirm("⚠️ Reset all seating? This will clear all table assignments.")) {
            initTables();
            guestTableMap.clear();
            renderApp();
            showToast("Seating reset");
        }
    }

    function searchGuests(term) {
        if (!term.trim()) return [];
        const lower = term.toLowerCase();
        return allGuests.filter(g => 
            g.name.toLowerCase().includes(lower) || 
            (g.group && g.group.toLowerCase().includes(lower))
        );
    }

    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, m => m === '&' ? '&amp;' : m === '<' ? '&lt;' : '&gt;');
    }

    function exportToCSV() {
        const rows = [];
        rows.push(['Table Name', 'Guest Name', 'Group/Source', 'Imported', 'Table Number']);
        
        const sorted = Array.from(tableMap.keys()).sort((a,b) => {
            if (a === BRIDAL_TABLE) return 1;
            if (b === BRIDAL_TABLE) return -1;
            return parseInt(a) - parseInt(b);
        });
        
        for (const tid of sorted) {
            const table = tableMap.get(tid);
            const tableName = table.name;
            const tableNumber = tid === BRIDAL_TABLE ? 'Bridal' : tid;
            
            if (table.guests.length === 0) {
                rows.push([tableName, '(empty)', '', '', tableNumber]);
            } else {
                for (const guest of table.guests) {
                    rows.push([
                        `"${tableName}"`,
                        `"${guest.name.replace(/"/g, '""')}"`,
                        `"${(guest.group || '').replace(/"/g, '""')}"`,
                        guest.isImported ? 'Yes' : 'No',
                        tableNumber
                    ]);
                }
            }
        }
        
        const unassigned = getUnassignedGuests();
        for (const guest of unassigned) {
            rows.push(['UNASSIGNED', `"${guest.name.replace(/"/g, '""')}"`, `"${(guest.group || '').replace(/"/g, '""')}"`, guest.isImported ? 'Yes' : 'No', '']);
        }
        
        const csvContent = rows.map(row => row.join(',')).join('\n');
        const blob = new Blob(["\uFEFF" + csvContent], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.setAttribute('download', `wedding_seating_${new Date().toISOString().slice(0,19).replace(/:/g, '-')}.csv`);
        link.click();
        URL.revokeObjectURL(link.href);
        showToast("CSV exported!");
    }

    async function exportToPDF() {
        showLoading(true);
        const pdfContent = document.createElement('div');
        pdfContent.style.cssText = 'font-family: Georgia, serif; padding: 30px; background: white;';
        
        let totalSeated = 0;
        for (const table of tableMap.values()) totalSeated += table.guests.length;
        
        pdfContent.innerHTML = `
            <div style="text-align:center; margin-bottom:25px; border-bottom:2px solid #c9a84c; padding-bottom:15px;">
                <h1 style="font-size:24px;">Daniel & Laura · Wedding Seating Plan</h1>
                <p>Generated on ${new Date().toLocaleString()}</p>
            </div>
            <div style="display:flex; justify-content:space-around; margin-bottom:25px;">
                <div><strong>Total: ${allGuests.length}</strong></div>
                <div><strong>Seated: ${totalSeated}</strong></div>
                <div><strong>Unassigned: ${getUnassignedGuests().length}</strong></div>
            </div>
            <div style="display:grid; grid-template-columns:repeat(auto-fill, minmax(250px,1fr)); gap:15px;">
                ${Array.from(tableMap.entries()).sort((a,b) => {
                    if (a[0] === BRIDAL_TABLE) return 1;
                    if (b[0] === BRIDAL_TABLE) return -1;
                    return parseInt(a[0]) - parseInt(b[0]);
                }).map(([tid, table]) => `
                    <div style="border:1px solid #e8dcc8; border-radius:10px; page-break-inside:avoid;">
                        <div style="background:#faf5ea; padding:8px; font-weight:bold;">${table.name} (${table.guests.length})</div>
                        <div style="padding:8px;">
                            ${table.guests.length === 0 ? '<em>Empty</em>' : 
                                table.guests.map(g => `<div style="font-size:10px; padding:2px 0;">• ${escapeHtml(g.name)}</div>`).join('')}
                        </div>
                    </div>
                `).join('')}
            </div>
        `;
        
        document.body.appendChild(pdfContent);
        try {
            await html2pdf().set({ margin: 0.4, filename: `seating_${Date.now()}.pdf`, jsPDF: { unit: 'in', format: 'a4', orientation: 'portrait' } }).from(pdfContent).save();
            showToast("PDF exported!");
        } catch(err) { alert("PDF failed"); }
        pdfContent.remove();
        showLoading(false);
    }

    async function renderApp() {
        const app = document.getElementById('app');
        const unassigned = getUnassignedGuests();
        const searchResults = currentSearch ? searchGuests(currentSearch) : [];
        
        let totalSeated = 0;
        for (const table of tableMap.values()) totalSeated += table.guests.length;
        
        const allTableOptions = Array.from({ length: TOTAL_TABLES }, (_, i) => i + 1);
        
        app.innerHTML = `
            <div class="container">
                <div class="header">
                    <h1>✨ Daniel & Laura · Wedding Seating ✨</h1>
                    <p>${TOTAL_TABLES} guest tables (${MIN_PER_TABLE}-${MAX_PER_TABLE} seats) + Bridal Table</p>
                </div>
                
                <div class="stats-bar">
                    <div class="stat"><div class="stat-number">${allGuests.length}</div><div>Total Guests</div></div>
                    <div class="stat"><div class="stat-number">${totalSeated}</div><div>Seated</div></div>
                    <div class="stat"><div class="stat-number">${unassigned.length}</div><div>Unassigned</div></div>
                </div>
                
                <div class="toolbar">
                    <button class="btn" id="saveBtn">💾 Save to Firebase</button>
                    <button class="btn btn-secondary" id="resetBtn">⟳ Reset All</button>
                    <button class="btn btn-pdf" id="pdfBtn">📄 PDF</button>
                    <button class="btn btn-csv" id="csvBtn">📊 CSV</button>
                </div>
                
                <div class="import-area">
                    <h3>📥 Import Guests from CSV (Your Mailing List)</h3>
                    <textarea id="csvData" class="csv-input" rows="4" placeholder="Paste your CSV data here with columns: Table, Guest Name, Verified Names, Guest Count..."></textarea>
                    <button class="btn btn-success" id="importBtn">Import CSV Guests</button>
                    <div id="importPreview" class="import-preview"></div>
                </div>
                
                <div class="search-box">
                    <input type="text" id="searchInput" class="search-input" placeholder="🔍 Search guest..." value="${escapeHtml(currentSearch)}">
                    <button class="btn" id="searchBtn">Search</button>
                    <button class="btn btn-secondary" id="clearSearchBtn">Clear</button>
                </div>
                
                ${searchResults.length > 0 ? `
                    <div style="background:white; border-radius:20px; padding:15px; margin-bottom:20px; border:1px solid #e8dcc8;">
                        <strong>Search Results:</strong>
                        ${searchResults.map(g => `
                            <div style="display:flex; justify-content:space-between; align-items:center; padding:8px; border-bottom:1px solid #eee;">
                                <span>${escapeHtml(g.name)} <small>(${escapeHtml(g.group || '')})</small></span>
                                <div>
                                    <select id="assign_${g.id.replace(/[^a-zA-Z0-9]/g, '_')}" style="width:100px;">
                                        <option value="">→ Table</option>
                                        ${allTableOptions.map(t => `<option value="${t}">Table ${t}</option>`).join('')}
                                        <option value="${BRIDAL_TABLE}">👰 Bridal</option>
                                    </select>
                                    <button class="btn" style="padding:4px 12px;" data-assign="${g.id}">Assign</button>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                ` : ''}
                
                <div class="main-layout">
                    <div class="tables-area">
                        <div class="tables-grid" id="tablesGrid"></div>
                    </div>
                    <div class="guests-area">
                        <h3>📋 Unassigned Guests (${unassigned.length})</h3>
                        <div id="unassignedList"></div>
                    </div>
                </div>
            </div>
        `;
        
        // Render tables
        const grid = document.getElementById('tablesGrid');
        if (grid) {
            grid.innerHTML = '';
            const sorted = Array.from(tableMap.keys()).sort((a,b) => {
                if (a === BRIDAL_TABLE) return 1;
                if (b === BRIDAL_TABLE) return -1;
                return parseInt(a) - parseInt(b);
            });
            
            for (const tid of sorted) {
                const table = tableMap.get(tid);
                const isBridal = tid === BRIDAL_TABLE;
                const card = document.createElement('div');
                card.className = `table-card ${isBridal ? 'bridal' : ''}`;
                card.innerHTML = `
                    <div class="table-header">
                        <span>${table.name} ${isBridal ? '⭐' : ''}</span>
                        <span>${table.guests.length} ${!isBridal ? `/ ${MAX_PER_TABLE}` : 'guests'}</span>
                    </div>
                    <div class="table-guests">
                        ${table.guests.length === 0 ? '<div class="empty-table">— empty —</div>' : 
                            table.guests.map(g => `<span class="guest-chip ${g.isImported ? 'imported' : ''}" data-id="${g.id}" data-table="${tid}">${escapeHtml(g.name)} ✖</span>`).join('')
                        }
                    </div>
                `;
                grid.appendChild(card);
                
                card.querySelectorAll('.guest-chip').forEach(chip => {
                    chip.onclick = () => {
                        if (confirm('Remove this guest?')) removeGuestFromTable(chip.dataset.id, chip.dataset.table);
                    };
                });
            }
        }
        
        // Render unassigned
        const unassignedDiv = document.getElementById('unassignedList');
        if (unassignedDiv) {
            if (unassigned.length === 0) {
                unassignedDiv.innerHTML = '<div style="text-align:center; padding:30px; color:#bfae8e;">✨ All guests assigned! ✨</div>';
            } else {
                unassignedDiv.innerHTML = unassigned.map(g => `
                    <div class="guest-list-item">
                        <div><div class="guest-name">${escapeHtml(g.name)} ${g.isImported ? '📎' : ''}</div><div class="guest-group">${escapeHtml(g.group || '')}</div></div>
                        <select id="quick_${g.id.replace(/[^a-zA-Z0-9]/g, '_')}" style="width:90px;">
                            <option value="">Table</option>
                            ${allTableOptions.map(t => `<option value="${t}">${t}</option>`).join('')}
                            <option value="${BRIDAL_TABLE}">👰</option>
                        </select>
                        <button class="btn" style="padding:4px 10px;" data-quick="${g.id}">✔</button>
                    </div>
                `).join('');
                
                for (const g of unassigned) {
                    const btn = unassignedDiv.querySelector(`[data-quick="${g.id}"]`);
                    const sel = unassignedDiv.querySelector(`#quick_${g.id.replace(/[^a-zA-Z0-9]/g, '_')}`);
                    if (btn && sel) btn.onclick = () => { if (sel.value) assignGuestToTable(g, sel.value); };
                }
            }
        }
        
        // Event listeners
        document.getElementById('saveBtn')?.addEventListener('click', saveSeatingToFirebase);
        document.getElementById('resetBtn')?.addEventListener('click', resetAllSeating);
        document.getElementById('pdfBtn')?.addEventListener('click', exportToPDF);
        document.getElementById('csvBtn')?.addEventListener('click', exportToCSV);
        
        document.getElementById('importBtn')?.addEventListener('click', () => {
            const csvText = document.getElementById('csvData').value;
            if (!csvText.trim()) {
                showToast("Please paste CSV data");
                return;
            }
            const guestsToAdd = parseCSVAndAddGuests(csvText);
            if (guestsToAdd.length === 0) {
                showToast("No new guests found in CSV");
                return;
            }
            const { added, skipped } = addImportedGuestsToTables(guestsToAdd);
            showToast(`✓ Added ${added} guests (${skipped} duplicates/skipped)`);
            renderApp();
        });
        
        const searchInput = document.getElementById('searchInput');
        document.getElementById('searchBtn')?.addEventListener('click', () => { currentSearch = searchInput.value; renderApp(); });
        document.getElementById('clearSearchBtn')?.addEventListener('click', () => { currentSearch = ''; searchInput.value = ''; renderApp(); });
        
        document.querySelectorAll('[data-assign]').forEach(btn => {
            btn.onclick = () => {
                const guestId = btn.dataset.assign;
                const select = document.getElementById(`assign_${guestId.replace(/[^a-zA-Z0-9]/g, '_')}`);
                if (select && select.value) {
                    const guest = allGuests.find(g => g.id === guestId);
                    if (guest) assignGuestToTable(guest, select.value);
                }
            };
        });
    }
    
    async function init() {
        showLoading(true);
        
        const savedSeating = await loadSeatingFromFirebase();
        if (savedSeating && savedSeating.size > 0) {
            tableMap = savedSeating;
            // Rebuild allGuests from table assignments
            const guestSet = new Map();
            for (const [tid, table] of tableMap.entries()) {
                for (const g of table.guests) {
                    if (!guestSet.has(g.id)) {
                        guestSet.set(g.id, { ...g });
                        guestTableMap.set(g.id, tid);
                    }
                }
            }
            allGuests = Array.from(guestSet.values());
        } else {
            initTables();
            allGuests = [];
        }
        
        showLoading(false);
        renderApp();
        showToast("Ready! Paste your CSV to import guests.");
    }
    
    init();
</script>
</body>
</html>
