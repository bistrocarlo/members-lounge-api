<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Members Lounge | Live Staff Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', system-ui, sans-serif; }
        .calendar-day { transition: all 0.2s; }
        .calendar-day:hover { transform: scale(1.05); }
        .live-dot { animation: pulse 2s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
    </style>
</head>
<body class="bg-zinc-50 dark:bg-zinc-950 text-zinc-900 dark:text-zinc-100 min-h-screen">

<!-- LOGIN -->
<div id="loginOverlay" class="fixed inset-0 bg-black/90 flex items-center justify-center z-50">
    <div class="bg-white dark:bg-zinc-900 rounded-3xl p-10 w-full max-w-md mx-4 text-center">
        <img src="https://via.placeholder.com/280x110/1f2937/ffffff?text=MEMBERS+LOUNGE" 
             alt="Members Lounge" class="mx-auto mb-6 rounded-2xl">
        <h1 class="text-3xl font-bold">Staff Portal</h1>
        <p class="text-emerald-600 flex items-center justify-center gap-2 mt-2">
            <span class="w-2 h-2 bg-emerald-500 rounded-full live-dot"></span> LIVE
        </p>
        <input type="text" id="loginUsername" placeholder="Username" class="w-full mt-8 bg-zinc-100 dark:bg-zinc-800 border border-zinc-300 dark:border-zinc-700 rounded-2xl px-5 py-4 mb-4">
        <input type="password" id="loginPassword" placeholder="Password" class="w-full bg-zinc-100 dark:bg-zinc-800 border border-zinc-300 dark:border-zinc-700 rounded-2xl px-5 py-4 mb-6">
        <button onclick="attemptLogin()" class="w-full bg-blue-600 hover:bg-blue-700 py-4 rounded-2xl font-semibold text-white">Login</button>
        <div id="loginError" class="text-red-500 text-center mt-4"></div>
    </div>
</div>

<!-- MAIN APP -->
<div id="mainApp" class="hidden max-w-7xl mx-auto p-4 md:p-6">
    <div class="flex justify-between items-center mb-8">
        <div class="flex items-center gap-4">
            <img src="https://via.placeholder.com/240x80/1f2937/ffffff?text=MEMBERS+LOUNGE" 
                 alt="Members Lounge" class="h-12 rounded-xl">
            <div>
                <h1 class="text-2xl font-bold">Members Lounge</h1>
                <p class="text-sm text-emerald-600">● Live Staff Portal</p>
            </div>
        </div>
        <div class="flex items-center gap-4">
            <a href="https://app.tickettailor.com/event" target="_blank" class="bg-blue-600 text-white px-5 py-3 rounded-2xl flex items-center gap-2 hover:bg-blue-700">
                <i class="fas fa-external-link-alt"></i> Ticket Tailor
            </a>
            <button onclick="toggleTheme()" class="p-3 bg-zinc-200 dark:bg-zinc-800 rounded-2xl">🌗</button>
            <div id="userInfo" class="bg-white dark:bg-zinc-900 px-5 py-2 rounded-3xl"></div>
            <button onclick="logout()" class="bg-red-600 text-white px-6 py-3 rounded-2xl hover:bg-red-700">Logout</button>
        </div>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
        <!-- Calendar -->
        <div class="lg:col-span-8 space-y-6">
            <div class="bg-white dark:bg-zinc-900 rounded-3xl p-6 shadow">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-2xl font-semibold">Availability Calendar</h2>
                    <div class="flex items-center gap-4">
                        <button onclick="changeMonth(-1)" class="p-3 hover:bg-zinc-100 dark:hover:bg-zinc-800 rounded-2xl"><i class="fas fa-chevron-left"></i></button>
                        <button onclick="goToToday()" class="px-6 py-2 bg-zinc-100 dark:bg-zinc-800 rounded-2xl">Today</button>
                        <button onclick="changeMonth(1)" class="p-3 hover:bg-zinc-100 dark:hover:bg-zinc-800 rounded-2xl"><i class="fas fa-chevron-right"></i></button>
                        <span id="currentMonthYear" class="font-semibold text-lg"></span>
                    </div>
                </div>
                <div id="roomTabs" class="flex flex-wrap gap-2 mb-6"></div>
                <div id="calendarGrid" class="grid grid-cols-7 gap-2 text-center"></div>
            </div>

            <div class="bg-white dark:bg-zinc-900 rounded-3xl p-6 shadow">
                <h3 id="selectedRoomTitle" class="text-xl font-semibold mb-4">Bookings</h3>
                <input id="searchInput" placeholder="Search bookings..." onkeyup="renderBookingsList(this.value)"
                       class="w-full bg-zinc-100 dark:bg-zinc-800 border border-zinc-300 dark:border-zinc-700 rounded-2xl px-5 py-3 mb-4">
                <div id="bookingsList" class="max-h-[520px] overflow-auto space-y-3"></div>
            </div>
        </div>

        <!-- Sidebar -->
        <div class="lg:col-span-4 space-y-6">
            <div class="grid grid-cols-2 gap-4">
                <div class="bg-white dark:bg-zinc-900 rounded-3xl p-6 shadow">
                    <p class="text-zinc-500">Future Bookings</p>
                    <p id="totalBookings" class="text-5xl font-bold mt-2">0</p>
                </div>
                <div class="bg-white dark:bg-zinc-900 rounded-3xl p-6 shadow">
                    <p class="text-zinc-500">Today</p>
                    <p id="todayBookings" class="text-5xl font-bold text-emerald-500 mt-2">0</p>
                </div>
            </div>

            <!-- CSV Import -->
            <div class="bg-white dark:bg-zinc-900 rounded-3xl p-6 shadow">
                <h3 class="font-semibold mb-3">📥 CSV Import (Admin)</h3>
                <div id="csvUploadZone" class="border-2 border-dashed border-zinc-300 dark:border-zinc-700 rounded-3xl p-10 text-center cursor-pointer hover:border-blue-500">
                    Drop Ticket Tailor CSV here or click
                </div>
                <input type="file" id="csvFileInput" accept=".csv" class="hidden">
            </div>
        </div>
    </div>
</div>

<div id="toastContainer" class="fixed bottom-6 right-6 z-50 space-y-2"></div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, onSnapshot, Timestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyA3HAJcTT0pQKSr5yDZ8A3RE6yQYGJqizE",
        authDomain: "thememberslounge-74245.firebaseapp.com",
        projectId: "thememberslounge-74245",
        storageBucket: "thememberslounge-74245.firebasestorage.app",
        messagingSenderId: "141855043646",
        appId: "1:141855043646:web:426ea1838692970350e16f"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const STAFF = {
        'admin': { password: 'admin123', name: 'Admin Director', role: 'admin' },
        'staff': { password: 'staff123', name: 'Senior Host', role: 'staff' }
    };

    let currentUser = null;
    let currentDate = new Date();
    let currentRoom = 'bistroteca';
    let selectedDate = null;
    let allBookings = [];

    const ROOMS = [
        { id: 'bistroteca', name: 'Bistroteca' },
        { id: 'sala_regio', name: 'Sala Reggio Ballroom' },
        { id: 'members_lounge', name: 'Members Lounge Restaurant' },
        { id: 'ottimo', name: 'Ottimo Private Dining Room' }
    ];

    function showToast(msg, type = "success") {
        const toast = document.createElement("div");
        toast.className = `px-6 py-4 rounded-2xl text-sm font-medium shadow-2xl ${type === "success" ? "bg-emerald-600 text-white" : "bg-red-600 text-white"}`;
        toast.textContent = msg;
        document.getElementById("toastContainer").appendChild(toast);
        setTimeout(() => toast.remove(), 4000);
    }

    // ====================== LOGIN ======================
    window.attemptLogin = function() {
        const username = document.getElementById("loginUsername").value.trim().toLowerCase();
        const password = document.getElementById("loginPassword").value.trim();
        
        if (STAFF[username] && STAFF[username].password === password) {
            currentUser = { username, ...STAFF[username] };
            localStorage.setItem("ml_user", JSON.stringify(currentUser));
            
            document.getElementById("loginOverlay").classList.add("hidden");
            document.getElementById("mainApp").classList.remove("hidden");
            
            document.getElementById("userInfo").innerHTML = `👋 ${currentUser.name}`;
            showToast(`Welcome, ${currentUser.name}`);
            renderRoomTabs();
            renderCalendar();
        } else {
            document.getElementById("loginError").textContent = "❌ Incorrect credentials";
        }
    };

    window.logout = function() {
        localStorage.removeItem("ml_user");
        location.reload();
    };

    function checkAuth() {
        const saved = localStorage.getItem("ml_user");
        if (saved) {
            const user = JSON.parse(saved);
            if (STAFF[user.username]) {
                currentUser = user;
                document.getElementById("loginOverlay").classList.add("hidden");
                document.getElementById("mainApp").classList.remove("hidden");
                document.getElementById("userInfo").innerHTML = `👋 ${currentUser.name}`;
                renderRoomTabs();
                renderCalendar();
                return;
            }
        }
        document.getElementById("loginOverlay").classList.remove("hidden");
    }

    // ====================== CALENDAR ======================
    function renderCalendar() {
        const year = currentDate.getFullYear();
        const month = currentDate.getMonth();
        const monthNames = ["January","February","March","April","May","June","July","August","September","October","November","December"];
        document.getElementById("currentMonthYear").textContent = `${monthNames[month]} ${year}`;

        const firstDay = (new Date(year, month, 1).getDay() + 6) % 7; // Monday first
        const daysInMonth = new Date(year, month + 1, 0).getDate();

        let html = '';
        ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].forEach(d => html += `<div class="text-xs text-zinc-500 py-2">${d}</div>`);

        for (let i = 0; i < firstDay; i++) html += `<div></div>`;

        for (let day = 1; day <= daysInMonth; day++) {
            const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
            const count = allBookings.filter(b => b.roomId === currentRoom && b.eventDate === dateStr).length;

            html += `
                <div onclick="selectDate('${dateStr}')" class="calendar-day h-28 border border-zinc-300 dark:border-zinc-700 rounded-2xl p-3 cursor-pointer flex flex-col ${count > 0 ? 'bg-red-100 dark:bg-red-900/30 border-red-300' : 'hover:bg-zinc-100 dark:hover:bg-zinc-800'}">
                    <div class="font-bold text-lg">${day}</div>
                    ${count > 0 ? `<div class="mt-auto text-red-600 dark:text-red-400 text-sm">${count} booked</div>` : `<div class="mt-auto text-emerald-600 text-xs">Available</div>`}
                </div>`;
        }
        document.getElementById("calendarGrid").innerHTML = html;
    }

    window.selectDate = function(dateStr) {
        selectedDate = dateStr;
        const roomName = ROOMS.find(r => r.id === currentRoom).name;
        document.getElementById("selectedRoomTitle").textContent = `${roomName} — ${dateStr}`;
        renderBookingsList();
    };

    function renderRoomTabs() {
        const container = document.getElementById("roomTabs");
        container.innerHTML = ROOMS.map(r => `
            <button onclick="switchRoom('${r.id}')" class="px-6 py-3 rounded-3xl font-medium ${currentRoom === r.id ? 'bg-blue-600 text-white' : 'bg-zinc-200 dark:bg-zinc-800'}">
                ${r.name}
            </button>
        `).join('');
    }

    window.switchRoom = function(id) {
        currentRoom = id;
        renderRoomTabs();
        renderCalendar();
    };

    window.changeMonth = function(n) {
        currentDate.setMonth(currentDate.getMonth() + n);
        renderCalendar();
    };

    window.goToToday = function() {
        currentDate = new Date();
        renderCalendar();
    };

    function renderBookingsList(filter = '') {
        if (!selectedDate) {
            document.getElementById("bookingsList").innerHTML = `<div class="text-center py-12 text-zinc-500">Select a date from the calendar</div>`;
            return;
        }
        // Placeholder for now
        document.getElementById("bookingsList").innerHTML = `<div class="text-center py-12 text-zinc-500">No bookings found for this date</div>`;
    }

    // ====================== CSV IMPORT ======================
    async function handleCSV(file) {
        showToast("Processing CSV...", "success");
        // Add your full parsing logic here
        setTimeout(() => showToast("CSV Imported Successfully!", "success"), 800);
    }

    // Setup CSV Upload
    function setupCSV() {
        const zone = document.getElementById("csvUploadZone");
        const input = document.getElementById("csvFileInput");

        zone.addEventListener("click", () => input.click());
        zone.addEventListener("drop", (e) => {
            e.preventDefault();
            if (e.dataTransfer.files[0]) handleCSV(e.dataTransfer.files[0]);
        });
        input.addEventListener("change", (e) => {
            if (e.target.files[0]) handleCSV(e.target.files[0]);
        });
    }

    // Theme
    function toggleTheme() {
        document.documentElement.classList.toggle('dark');
    }

    // Init
    window.onload = () => {
        checkAuth();
        setupCSV();
    };
</script>
</body>
</html>
