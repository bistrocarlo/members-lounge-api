<!DOCTYPE html>
<html lang="en">
<head>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <style>
        *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
        body{background:#f0f2f5;font-family:'Inter',sans-serif;}
        .app{max-width:500px;margin:0 auto;background:#f0f2f5;min-height:100vh;}
        .header{background:white;padding:14px 20px;text-align:center;border-bottom:1px solid #e9ecef;position:sticky;top:0;z-index:20;}
        .logo-icon{width:52px;height:52px;background:#1a73e8;border-radius:16px;display:inline-flex;align-items:center;justify-content:center;margin:0 auto 6px;}
        .logo-icon i{font-size:26px;color:white;}
        .header h1{font-size:18px;font-weight:700;color:#1a1a2e;}
        .user-row{background:#f1f5f9;padding:5px 14px;border-radius:40px;display:inline-flex;align-items:center;gap:10px;margin-top:6px;font-size:12px;}
        .user-row button{background:#dc3545;border:none;padding:4px 12px;border-radius:40px;color:white;font-weight:500;font-size:11px;cursor:pointer;}
        .top-nav{background:white;padding:10px 12px;display:flex;flex-wrap:wrap;justify-content:center;gap:6px;border-bottom:1px solid #e9ecef;position:sticky;top:75px;z-index:15;}
        .nav-module{background:#f0f2f5;border:none;padding:8px 14px;border-radius:40px;font-size:12px;font-weight:600;color:#5a626e;cursor:pointer;transition:all 0.2s;}
        .nav-module.active{background:#1a73e8;color:white;}
        .module-container{padding:16px;display:none;}
        .module-container.active-module{display:block;animation:fadeIn 0.25s ease;}
        @keyframes fadeIn{from{opacity:0;transform:translateY(5px);}to{opacity:1;transform:translateY(0);}}
        .card{background:white;border-radius:20px;padding:18px;margin-bottom:14px;border:1px solid #e9ecef;box-shadow:0 1px 2px rgba(0,0,0,0.03);}
        .card h2{font-size:17px;font-weight:700;margin-bottom:14px;border-left:4px solid #1a73e8;padding-left:12px;color:#1a1a2e;}
        .attendance-card{background:linear-gradient(135deg,#1a73e8,#0d5bbf);color:white;border-radius:24px;padding:24px 20px;text-align:center;margin-bottom:16px;}
        .big-buttons{display:flex;gap:14px;margin:16px 0 12px;}
        .btn-play-big{background:#28a745;flex:1;padding:14px;border-radius:60px;font-weight:700;font-size:16px;border:none;color:white;cursor:pointer;}
        .btn-sit-big{background:#dc3545;flex:1;padding:14px;border-radius:60px;font-weight:700;font-size:16px;border:none;color:white;cursor:pointer;}
        .profile-item{background:#f8f9fa;border-radius:16px;margin-bottom:10px;display:flex;align-items:center;gap:12px;padding:12px;}
        .profile-avatar{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:white;font-weight:700;font-size:18px;flex-shrink:0;}
        .player-avatar-small{width:32px;height:32px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:white;font-weight:600;font-size:12px;margin-right:5px;}
        .profile-badge{background:white;border-radius:40px;padding:3px 10px;font-size:11px;font-weight:600;display:inline-block;margin-right:6px;margin-bottom:4px;color:#495057;border:1px solid #e9ecef;}
        .edit-profile-btn{background:#6c757d;padding:5px 12px;font-size:11px;border-radius:40px;border:none;color:white;cursor:pointer;}
        .match-card{background:white;border-radius:20px;margin-bottom:14px;border:1px solid #e9ecef;overflow:hidden;}
        .match-header{background:#f8f9fa;padding:12px 16px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;border-bottom:1px solid #e9ecef;}
        .match-result{background:#1a73e8;color:white;padding:4px 14px;border-radius:40px;font-weight:600;font-size:13px;}
        .teams-section{padding:16px;background:#1a2a3a;}
        .team-row{display:flex;gap:12px;flex-wrap:wrap;}
        .team-box{flex:1;background:rgba(0,0,0,0.6);border-radius:16px;padding:12px;min-width:140px;}
        .team-yellow{background:#ffc107;color:#2c2c2c;font-weight:800;text-align:center;padding:6px;border-radius:60px;margin-bottom:8px;}
        .team-orange{background:#fd7e14;color:white;font-weight:800;text-align:center;padding:6px;border-radius:60px;margin-bottom:8px;}
        .player-list{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;}
        .player-tag{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,0.15);border-radius:40px;padding:4px 10px;font-size:11px;color:white;}
        .guest-tag-small{background:#28a74580;border-radius:40px;padding:2px 6px;font-size:9px;margin-left:4px;}
        .score-big{text-align:center;margin-top:12px;font-size:22px;font-weight:800;background:rgba(0,0,0,0.6);border-radius:60px;padding:8px;color:#ffd700;}
        .goals-section,.comments-section{padding:12px 16px;background:#fff8e7;}
        .goal-badge{background:white;border-radius:40px;padding:5px 12px;font-size:12px;font-weight:600;border-left:3px solid #eab308;margin:4px;display:inline-block;}
        .add-comment{display:flex;gap:8px;margin-top:10px;}
        .add-comment input{flex:1;padding:12px;border-radius:60px;border:1.5px solid #e9ecef;font-size:14px;}
        .comment-item{background:#f8f9fa;border-radius:16px;padding:10px;margin-bottom:8px;font-size:13px;}
        .playing-list,.guest-section{background:#e8f0fe;border-radius:20px;padding:16px;margin-bottom:14px;}
        .guest-section{background:#e6f7e6;border:1px solid #b3e6b3;}
        .attendee-tag{display:inline-flex;align-items:center;gap:8px;background:white;padding:6px 12px;border-radius:40px;font-size:13px;margin:4px;box-shadow:0 1px 2px rgba(0,0,0,0.05);}
        .remove-attendee-btn{background:#dc3545;border:none;color:white;border-radius:40px;padding:3px 8px;font-size:10px;font-weight:600;cursor:pointer;margin-left:6px;}
        .admin-team-item{display:flex;justify-content:space-between;align-items:center;margin:8px 0;background:#f8f9fa;border-radius:60px;padding:8px 16px;flex-wrap:wrap;gap:8px;}
        .modal{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.5);display:flex;align-items:center;justify-content:center;z-index:1000;}
        .modal-content{background:white;border-radius:28px;padding:24px;max-width:340px;width:90%;max-height:80vh;overflow-y:auto;}
        select,input{width:100%;padding:14px;border:1.5px solid #e9ecef;border-radius:60px;margin:8px 0;font-size:15px;background:white;}
        button{background:#1a73e8;color:white;border:none;padding:12px 20px;border-radius:60px;font-weight:600;cursor:pointer;}
        .btn-outline{background:white;color:#1a73e8;border:2px solid #1a73e8;}
        .flex-btns{display:flex;gap:12px;margin-top:12px;flex-wrap:wrap;}
        .info-bar{background:#e8f0fe;border-radius:16px;padding:12px;font-size:12px;margin-bottom:16px;text-align:center;color:#1a73e8;font-weight:500;}
        .timer-container{background:white;border-radius:24px;padding:20px;text-align:center;margin-bottom:16px;border:1px solid #e9ecef;}
        .timer-display{font-size:54px;font-weight:800;font-family:monospace;color:#1a73e8;background:#f0f2f5;border-radius:20px;padding:12px;margin-bottom:16px;}
        .timer-btn{padding:10px 20px;border-radius:60px;font-weight:600;font-size:13px;border:none;cursor:pointer;}
        .timer-btn.start{background:#28a745;color:white;}
        .timer-btn.pause{background:#ffc107;color:#2c2c2c;}
        .timer-btn.reset{background:#dc3545;color:white;}
        .whatsapp-share{background:#25D366;color:white;border:none;margin-top:8px;width:100%;}
        .stats-row{display:flex;gap:8px;margin-bottom:12px;align-items:center;flex-wrap:wrap;}
        .half-status{font-size:13px;color:#6c757d;margin-top:10px;}
        .loading{text-align:center;padding:40px;color:#6c757d;}
        .data-table{width:100%;border-collapse:collapse;font-size:13px;}
        .data-table th,.data-table td{padding:10px;text-align:left;border-bottom:1px solid #e9ecef;}
        .finance-row{display:flex;justify-content:space-between;align-items:center;padding:12px;border-bottom:1px solid #e9ecef;flex-wrap:wrap;gap:8px;}
        .debt-badge{background:#dc3545;color:white;border-radius:40px;padding:4px 12px;font-size:12px;font-weight:600;}
        .paid-badge{background:#28a745;color:white;border-radius:40px;padding:4px 12px;font-size:12px;font-weight:600;}
        .pay-btn{background:#1a73e8;font-size:12px;padding:6px 16px;}
        .finance-summary{background:linear-gradient(135deg,#28a745,#1a5a2e);color:white;border-radius:20px;padding:16px;margin-bottom:16px;text-align:center;}
        .finance-summary h3{font-size:14px;opacity:0.9;}
        .finance-summary .big-number{font-size:36px;font-weight:800;}
        @media (max-width:450px){.team-row{flex-direction:column;}}
    </style>
</head>
<body>
<div class="app" id="app"><div class="loading"><i class="fas fa-spinner fa-spin"></i> Loading Monday Night Soccer...</div></div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyCWlFqDJyENgrUOhiLXCjSEi4Mk_54SA1w",
        authDomain: "monday-night-soccer-hub.firebaseapp.com",
        projectId: "monday-night-soccer-hub",
        storageBucket: "monday-night-soccer-hub.firebasestorage.app",
        messagingSenderId: "634335208908",
        appId: "1:634335208908:web:dca705b65fc52de0606969"
    };
    
    let db = null, firebaseReady = false;
    try { 
        firebase.initializeApp(firebaseConfig); 
        db = firebase.firestore(); 
        firebaseReady = true; 
    } catch(e) { console.warn("Demo mode", e); }
    
    const FIXED_PLAYERS_LIST = [
        "Alex Rowe", "Ali Mekawy", "Carlo Pavia", "Charlie Pavia", "Chris Del Monaco", 
        "Chris Margelis", "Chris Sophocli", "Danny Sammartino", "Dante Sammartino", 
        "David", "Dimitri", "Enzo", "Farid", "Faros", "Frank Marcaccio", 
        "George Babatsikos", "George Theodoropoulos", "Ivan", "James Zoumis", 
        "James Martino", "Joe Trimboli", "Joseph", "Kiarash Piani", "Leo", "Manoli", 
        "Marco Mercuri", "Mario", "Morris Del Monte", "Nector Laskaris", "Paul Hardalas", 
        "Perri Theodorlis", "Peter Disensi", "Ralph Risoli", "Rocco Mammoliti", 
        "Paul Salustro", "Stevan Brankovic", "Theo", "Tony El Hajj", "Vasilis"
    ].sort();
    
    let players = [...FIXED_PLAYERS_LIST];
    let playerProfiles = {};
    let teamAssignments = {};
    let matchResults = {};
    let attendance = [];
    let guests = [];
    let matchComments = {};
    let paymentRecords = {}; // { week: { playerName: { paid: true, amount: 5, date } } }
    let isAdminLoggedIn = false, currentUser = null;
    let weeklyCaptain = "Football Freedom";
    let weatherData = { temp: "18°C", condition: "Clear", icon: "fa-sun", rainChance: 10 };
    let chatUnsubscribe = null;
    let timerInterval = null, currentHalf = 1, timeLeft = 45 * 60;
    const WEEKLY_FEE = 5;
    
    function getMondayDate(date) {
        const d = new Date(date);
        const day = d.getDay();
        const diff = (day === 0 ? -6 : 1) - day;
        d.setDate(d.getDate() + diff);
        d.setHours(20, 0, 0, 0);
        return d;
    }
    function getNextMondayGame() {
        const today = new Date();
        const nextMonday = getMondayDate(today);
        if (nextMonday < today) nextMonday.setDate(nextMonday.getDate() + 7);
        return nextMonday;
    }
    function getCurrentGameWeekStr(){ return getNextMondayGame().toISOString().split('T')[0]; }
    function getCurrentGameLabel(){ const m = getNextMondayGame(); return `Mon ${m.toLocaleDateString('en-AU',{day:'numeric',month:'short'})}`; }
    function getAllGameWeeks() {
        const weeks = [];
        const today = new Date();
        const startDate = new Date(today);
        startDate.setFullYear(today.getFullYear() - 1);
        let current = new Date(getMondayDate(startDate));
        const currentMonday = getMondayDate(today);
        while (current <= currentMonday) {
            weeks.push({ dateStr: current.toISOString().split('T')[0], label: `Mon ${current.toLocaleDateString('en-AU',{day:'numeric',month:'short',year:'numeric'})}` });
            current.setDate(current.getDate() + 7);
        }
        weeks.sort((a,b) => b.dateStr.localeCompare(a.dateStr));
        return weeks;
    }
    const ALL_WEEKS = getAllGameWeeks();
    const CURRENT_GAME_STR = getCurrentGameWeekStr();
    function getPastWeeks(){ return ALL_WEEKS.filter(w => w.dateStr < CURRENT_GAME_STR); }
    function getAllParticipants(gameDate){
        const playersIn = attendance.filter(a => a.gameDate === gameDate && a.status === 'in').map(a => a.player);
        const guestsIn = guests.filter(g => g.gameDate === gameDate).map(g => ({ name: g.guestName, isGuest: true, addedBy: g.addedBy }));
        return { players: playersIn, guests: guestsIn };
    }
    
    function escapeHtml(s){ return String(s).replace(/[&<>]/g, m=> ({'&':'&amp;','<':'&lt;','>':'&gt;'})[m]); }
    function getInitials(n){ return n.split(' ').map(x=>x[0]).join('').toUpperCase().substring(0,2); }
    function getAvatarColor(n){ const c=['#1a73e8','#28a745','#dc3545','#fd7e14','#6f42c1','#20c997']; let h=0; for(let i=0;i<n.length;i++) h=((h<<5)-h)+n.charCodeAt(i); return c[Math.abs(h)%c.length]; }
    function renderAvatar(n,s=50){ return `<div class="profile-avatar" style="background:${getAvatarColor(n)};width:${s}px;height:${s}px;font-size:${s/2.5}px;">${getInitials(n)}</div>`; }
    function renderMiniAvatar(n,s=28){ return `<div class="player-avatar-small" style="background:${getAvatarColor(n)};width:${s}px;height:${s}px;font-size:${s/2}px;">${getInitials(n)}</div>`; }
    
    function generateTeamSheet(yellowTeam, orangeTeam, gameLabel){
        const yellowList = yellowTeam.map(p => `${p.name}${p.isGuest ? ' (Guest)' : ''}`).join('\n');
        const orangeList = orangeTeam.map(p => `${p.name}${p.isGuest ? ' (Guest)' : ''}`).join('\n');
        return `⚽ *MONDAY NIGHT SOCCER - TEAM SHEET* ⚽\n📅 ${gameLabel} | 8:00pm Clifton Park\n\n🟡 YELLOW (${yellowTeam.length}):\n${yellowList || '—'}\n\n🟠 ORANGE (${orangeTeam.length}):\n${orangeList || '—'}\n\n👑 Captain: ${weeklyCaptain}`;
    }
    
    function generateAIMatchReport(weekLabel, yellowScore, orangeScore, goals, assists, mvp, injuries){
        const goalText = Object.entries(goals).map(([p,c])=>`• ${p}: ${c}`).join('\n') || '• None';
        const assistText = Object.entries(assists).map(([a,c])=>`• ${a}: ${c}`).join('\n') || '• None';
        return `📰 *${weekLabel.toUpperCase()} REPORT*\n🟡 ${yellowScore} - ${orangeScore} 🟠\n\n⚽ GOALS:\n${goalText}\n\n🎯 ASSISTS:\n${assistText}\n\n🏆 MVP: ${mvp || 'N/A'}\n🩺 INJURIES: ${injuries?.join(', ') || 'None'}`;
    }
    
    // FINANCIAL FUNCTIONS - Only players who played owe money
    async function loadPaymentRecords() {
        if(firebaseReady && db){
            const doc = await db.collection("config").doc("paymentRecords").get();
            if(doc.exists) paymentRecords = doc.data();
            else paymentRecords = {};
        }
    }
    async function savePaymentRecords() {
        if(firebaseReady && db) await db.collection("config").doc("paymentRecords").set(paymentRecords);
    }
    
    // Get players who played on a given week (from attendance)
    function getPlayersWhoPlayed(weekStr) {
        return attendance.filter(a => a.gameDate === weekStr && a.status === 'in').map(a => a.player);
    }
    
    // Calculate how much a player owes for a specific week (only if they played)
    function doesPlayerOweForWeek(player, weekStr) {
        const played = attendance.some(a => a.player === player && a.gameDate === weekStr && a.status === 'in');
        if (!played) return false;
        const weekPayments = paymentRecords[weekStr] || {};
        return !weekPayments[player];
    }
    
    // Get total collected across all time
    function getTotalCollected() {
        let total = 0;
        for (const week in paymentRecords) {
            const weekPayments = paymentRecords[week];
            for (const player in weekPayments) {
                if (weekPayments[player]?.paid) total += WEEKLY_FEE;
            }
        }
        return total;
    }
    
    // Get total expected (sum of all players who played each week)
    function getTotalExpected() {
        let total = 0;
        for (const week of ALL_WEEKS) {
            const playersWhoPlayed = getPlayersWhoPlayed(week.dateStr);
            total += playersWhoPlayed.length * WEEKLY_FEE;
        }
        return total;
    }
    
    // Get outstanding balance
    function getOutstandingBalance() {
        return getTotalExpected() - getTotalCollected();
    }
    
    // Mark a player as paid for a specific week
    async function markPlayerPaid(playerName, weekStr) {
        if (!isAdminLoggedIn && currentUser?.name !== playerName) {
            alert("Only admin can record payments");
            return false;
        }
        
        const played = attendance.some(a => a.player === playerName && a.gameDate === weekStr && a.status === 'in');
        if (!played) {
            alert(`${playerName} did NOT play on ${weekStr}. Cannot record payment for a week they didn't play.`);
            return false;
        }
        
        if (!paymentRecords[weekStr]) paymentRecords[weekStr] = {};
        if (paymentRecords[weekStr][playerName]?.paid) {
            alert(`${playerName} already paid for ${weekStr}`);
            return false;
        }
        
        paymentRecords[weekStr][playerName] = {
            paid: true,
            amount: WEEKLY_FEE,
            date: new Date().toISOString(),
            recordedBy: currentUser?.name || "Admin"
        };
        
        await savePaymentRecords();
        alert(`✅ Recorded $${WEEKLY_FEE} payment from ${playerName} for ${weekStr}`);
        renderFinancePage();
        return true;
    }
    
    // Get payment status for a player across all weeks they played
    function getPlayerPaymentStatus(player) {
        const weeksPlayed = attendance.filter(a => a.player === player && a.status === 'in').map(a => a.gameDate);
        const paidWeeks = [];
        const unpaidWeeks = [];
        for (const week of weeksPlayed) {
            const isPaid = paymentRecords[week]?.[player]?.paid === true;
            if (isPaid) paidWeeks.push(week);
            else unpaidWeeks.push(week);
        }
        return { paidWeeks, unpaidWeeks, totalOwed: unpaidWeeks.length * WEEKLY_FEE, totalPaid: paidWeeks.length * WEEKLY_FEE };
    }
    
    async function removeAttendee(playerName, gameDate){
        if(!isAdminLoggedIn && currentUser?.name !== playerName){ alert("Only admin or the player can remove attendance."); return false; }
        if(!confirm(`Remove ${playerName} from playing list?`)) return false;
        if(firebaseReady && db) await db.collection("attendance").doc(`${playerName}_${gameDate}`).delete();
        attendance = attendance.filter(a => !(a.player === playerName && a.gameDate === gameDate));
        if(teamAssignments[gameDate]){ delete teamAssignments[gameDate][playerName]; if(firebaseReady && db) await db.collection("config").doc("teamAssignments").set(teamAssignments); }
        refreshAll();
        alert(`${playerName} removed.`);
        return true;
    }
    
    async function loadData(){
        if(!firebaseReady || !db) return;
        try{
            const [pDoc,profDoc,tDoc,rDoc,attSnap,guestSnap,commentsSnap] = await Promise.all([
                db.collection("config").doc("players").get(),
                db.collection("config").doc("playerProfiles").get(),
                db.collection("config").doc("teamAssignments").get(),
                db.collection("config").doc("matchResults").get(),
                db.collection("attendance").get(),
                db.collection("guests").get(),
                db.collection("matchComments").get()
            ]);
            if(pDoc.exists) players = pDoc.data().list.sort();
            if(profDoc.exists) playerProfiles = profDoc.data();
            if(tDoc.exists) teamAssignments = tDoc.data();
            if(rDoc.exists) matchResults = rDoc.data();
            attendance = attSnap.docs.map(d=>d.data());
            guests = guestSnap.docs.map(d=>d.data());
            matchComments = {};
            commentsSnap.docs.forEach(doc=>{ const d=doc.data(); if(!matchComments[d.gameDate]) matchComments[d.gameDate]=[]; matchComments[d.gameDate].push(d); });
            for(let p of players) if(!playerProfiles[p]) playerProfiles[p] = { age:'—', position:'—', yearJoined:'—', gamesPlayed:0, openingBalanceGames:0 };
            await loadPaymentRecords();
        } catch(e){ console.warn(e); }
        refreshAll();
    }
    
    async function saveAttendance(a){
        if(firebaseReady&&db) await db.collection("attendance").doc(`${a.player}_${a.gameDate}`).set(a);
        const idx = attendance.findIndex(x=>x.player===a.player && x.gameDate===a.gameDate);
        if(idx!==-1) attendance[idx]=a; else attendance.push(a);
        const games = attendance.filter(att=>att.player===a.player && att.status==='in').length;
        const opening = playerProfiles[a.player]?.openingBalanceGames || 0;
        if(playerProfiles[a.player]) playerProfiles[a.player].gamesPlayed = games + opening;
        else playerProfiles[a.player] = { age:'—', position:'—', yearJoined:'—', gamesPlayed:games+opening, openingBalanceGames:0 };
        if(firebaseReady&&db) await db.collection("config").doc("playerProfiles").set(playerProfiles);
        refreshAll();
    }
    
    async function saveGuest(g){
        if(firebaseReady&&db) await db.collection("guests").doc(`${g.guestName}_${g.gameDate}`).set(g);
        guests.push(g);
        refreshAll();
    }
    
    async function saveTeamAssignments(date,assign){
        teamAssignments[date] = assign;
        if(firebaseReady&&db) await db.collection("config").doc("teamAssignments").set(teamAssignments);
        refreshAll();
    }
    
    async function saveComment(date,author,text){
        const c={ gameDate:date, author, text, timestamp:Date.now() };
        if(firebaseReady&&db) await db.collection("matchComments").add(c);
        if(!matchComments[date]) matchComments[date]=[];
        matchComments[date].push(c);
        renderHistoryPage();
    }
    
    async function saveMatchResult(date,yellow,orange,goals,assists,mvp,injuries){
        matchResults[date] = { yellowScore:yellow, orangeScore:orange, goals, assists:assists||{}, mvp, injuries:injuries||[], timestamp:Date.now() };
        if(firebaseReady&&db) await db.collection("config").doc("matchResults").set(matchResults);
        renderHistoryPage();

    async function fetchWeather(){
        try{
            const r=await fetch('https://api.open-meteo.com/v1/forecast?latitude=-37.77&longitude=144.97&hourly=temperature_2m,precipitation_probability,weathercode&timezone=Australia/Melbourne&forecast_days=7');
            const d=await r.json();
            const target=CURRENT_GAME_STR;
            for(let i=0;i<d.hourly.time.length;i++){
                const hd=d.hourly.time[i].split('T')[0];
                const hr=parseInt(d.hourly.time[i].split('T')[1].substring(0,2));
                if(hd===target && hr===20){
                    const t=Math.round(d.hourly.temperature_2m[i]);
                    const code=d.hourly.weathercode[i];
                    let cond="Clear", icon="fa-sun";
                    if(code===0){ cond="Clear"; icon="fa-sun"; }
                    else if(code===1||code===2){ cond="Partly cloudy"; icon="fa-cloud-sun"; }
                    else if(code===3){ cond="Overcast"; icon="fa-cloud"; }
                    else if(code>=51&&code<=67){ cond="Light rain"; icon="fa-cloud-rain"; }
                    else if(code>=80&&code<=99){ cond="Rain/storm"; icon="fa-cloud-bolt"; }
                    weatherData={ temp:`${t}°C`, condition:cond, icon, rainChance:d.hourly.precipitation_probability[i]||0 };
                    break;
                }
            }
        } catch(e){}
        renderWeatherPage();
    }

        appDiv.innerHTML=`<div class="header"><div class="logo-icon"><i class="fas fa-futbol"></i></div><h1>MONDAY NIGHT SOCCER</h1><div class="user-row"><span id="userNameDisplay">Not logged in</span><button id="logoutBtn" style="display:none;">Logout</button></div></div><div class="top-nav"><button class="nav-module active" data-module="home">🏠 Home</button><button class="nav-module" data-module="teamswk">⚽ Teams</button><button class="nav-module" data-module="history">📖 History</button><button class="nav-module" data-module="scoreboard">🏆 Stats</button><button class="nav-module" data-module="profiles">👤 Profiles</button><button class="nav-module" data-module="timer">⏱️ Timer</button><button class="nav-module" data-module="chat">💬 Chat</button><button class="nav-module" data-module="finance">💰 Financials</button><button class="nav-module" data-module="weather">🌤️ Weather</button><button class="nav-module" data-module="rules">📜 Rules</button><button class="nav-module" data-module="admin">🔧 Admin</button></div><div id="homeContainer" class="module-container active-module"></div><div id="page-teamswk" class="module-container"></div><div id="page-history" class="module-container"></div><div id="page-scoreboard" class="module-container"></div><div id="page-profiles" class="module-container"></div><div id="page-timer" class="module-container"></div><div id="page-chat" class="module-container"></div><div id="page-finance" class="module-container"></div><div id="page-weather" class="module-container"></div><div id="page-rules" class="module-container"></div><div id="page-admin" class="module-container"></div>`;
        document.querySelectorAll(".nav-module").forEach(btn=>{ btn.addEventListener("click",()=>{ document.querySelectorAll(".nav-module").forEach(b=>b.classList.remove("active")); btn.classList.add("active"); const mod=btn.dataset.module; document.querySelectorAll(".module-container").forEach(c=>c.classList.remove("active-module")); if(mod==="home") document.getElementById("homeContainer").classList.add("active-module"); else document.getElementById(`page-${mod}`).classList.add("active-module"); if(mod==="finance") renderFinancePage(); if(mod==="chat") renderChatPage(); }); });
        document.getElementById("logoutBtn").onclick=logout;
        if(firebaseReady) loadData().then(()=>{ showLoginModal(); fetchWeather(); }); else { showLoginModal(); fetchWeather(); refreshAll(); }
    }
    initApp();
</script>
</body>
