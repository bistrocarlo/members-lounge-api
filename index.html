<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Wedding Seating Manager | Daniel & Laura</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Georgia', 'Times New Roman', Times, serif;
            background: #faf8f3;
            padding: 20px;
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
        }

        .header {
            background: linear-gradient(135deg, #c9a84c, #e8d5a8);
            border-radius: 24px;
            padding: 25px 30px;
            margin-bottom: 25px;
            text-align: center;
            color: #2c2418;
        }

        .header h1 {
            font-size: 1.8rem;
            font-weight: 400;
            letter-spacing: 2px;
        }

        .stats-bar {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        .stat {
            background: white;
            border-radius: 16px;
            padding: 15px 25px;
            flex: 1;
            text-align: center;
            border: 1px solid #e8dcc8;
        }

        .stat-number {
            font-size: 2rem;
            font-weight: bold;
            color: #c9a84c;
        }

        .toolbar {
            background: white;
            border-radius: 20px;
            padding: 15px 20px;
            margin-bottom: 25px;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            border: 1px solid #e8dcc8;
        }

        .btn {
            background: #c9a84c;
            border: none;
            padding: 10px 20px;
            border-radius: 30px;
            cursor: pointer;
            font-family: inherit;
            font-weight: 600;
            font-size: 0.85rem;
            transition: all 0.2s;
        }

        .btn:hover {
            background: #b8953a;
            transform: translateY(-1px);
        }

        .btn-secondary {
            background: #e8dcc8;
            color: #5a4a35;
        }

        .main-layout {
            display: flex;
            gap: 25px;
            flex-wrap: wrap;
        }

        .tables-area {
            flex: 2;
            min-width: 300px;
        }

        .guests-area {
            flex: 1;
            min-width: 280px;
            background: white;
            border-radius: 20px;
            border: 1px solid #e8dcc8;
            padding: 20px;
            height: fit-content;
            position: sticky;
            top: 20px;
        }

        .tables-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 18px;
        }

        .table-card {
            background: white;
            border-radius: 20px;
            border: 1px solid #e8dcc8;
            overflow: hidden;
        }

        .table-card.bridal {
            border: 2px solid #c9a84c;
            background: #fffcf5;
        }

        .table-header {
            background: #faf5ea;
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            border-bottom: 1px solid #e8dcc8;
            font-weight: bold;
        }

        .table-guests {
            padding: 12px;
            min-height: 120px;
            max-height: 250px;
            overflow-y: auto;
        }

        .guest-chip {
            display: inline-block;
            background: #fef7e9;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            margin: 4px 6px 4px 0;
            border: 1px solid #e8dcc8;
            cursor: pointer;
            transition: 0.1s;
        }

        .guest-chip:hover {
            background: #e8dcc8;
        }

        .empty-table {
            color: #bfae8e;
            text-align: center;
            padding: 15px;
            font-style: italic;
            font-size: 0.75rem;
        }

        .guest-list-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #efe4d4;
        }

        .guest-name {
            font-weight: 500;
            font-size: 0.85rem;
        }

        .guest-group {
            font-size: 0.65rem;
            color: #c9a84c;
        }

        select, input {
            padding: 8px 12px;
            border-radius: 20px;
            border: 1px solid #e8dcc8;
            background: #fefcf8;
            font-size: 0.75rem;
        }

        .warning {
            background: #fff3e0;
            border-radius: 16px;
            padding: 10px 15px;
            margin-bottom: 20px;
            color: #b86b2c;
            font-size: 0.8rem;
        }

        .loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .loading-spinner {
            background: white;
            padding: 20px 30px;
            border-radius: 30px;
            font-size: 1rem;
        }

        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #e8dcc8;
            border-top-color: #c9a84c;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            margin-right: 10px;
            vertical-align: middle;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #2c2418;
            color: white;
            padding: 10px 24px;
            border-radius: 40px;
            font-size: 0.8rem;
            z-index: 1001;
            animation: fadeOut 2.5s forwards;
        }

        @keyframes fadeOut {
            0% { opacity: 1; }
            70% { opacity: 1; }
            100% { opacity: 0; visibility: hidden; }
        }

        @media (max-width: 700px) {
            .main-layout { flex-direction: column; }
            .guests-area { position: static; }
        }
    </style>
</head>
<body>
<div id="app"></div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, getDocs, updateDoc, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // Firebase Configuration
    const firebaseConfig = {
        apiKey: "AIzaSyAH0rBpJUh3sRpBlQgrymQM1RLBDBiAPmE",
        authDomain: "daniel-and-laura.firebaseapp.com",
        projectId: "daniel-and-laura",
        storageBucket: "daniel-and-laura.firebasestorage.app",
        messagingSenderId: "363458517473",
        appId: "1:363458517473:web:7eac683bc98623cb281aa0"
    };

    const firebaseApp = initializeApp(firebaseConfig);
    const db = getFirestore(firebaseApp);

    const GUESTS_COLLECTION = "wedding_guests";
    const RESPONSES_COLLECTION = "guest_responses";
    const SEATING_COLLECTION = "wedding_seating";

    const TOTAL_TABLES = 32;
    const BRIDAL_TABLE = "bridal";
    const MAX_PER_TABLE = 11;
    const MIN_PER_TABLE = 6;

    let allAttendees = [];      // List of individual people attending
    let tableAssignments = new Map();  // tableId -> { name, guests: [] }
    let attendeeTableMap = new Map();  // attendeeId -> tableId

    function showToast(msg) {
        const existing = document.querySelector('.toast');
        if (existing) existing.remove();
        const toast = document.createElement('div');
        toast.className = 'toast';
        toast.textContent = msg;
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 2500);
    }

    function showLoading(show) {
        let el = document.querySelector('.loading');
        if (show && !el) {
            const div = document.createElement('div');
            div.className = 'loading';
            div.innerHTML = '<div class="loading-spinner"><span class="spinner"></span> Loading...</div>';
            document.body.appendChild(div);
        } else if (!show && el) {
            el.remove();
        }
    }

    // Initialize empty tables (1-32 + bridal)
    function initTables() {
        tableAssignments.clear();
        for (let i = 1; i <= TOTAL_TABLES; i++) {
            tableAssignments.set(i.toString(), { name: `Table ${i}`, guests: [] });
        }
        tableAssignments.set(BRIDAL_TABLE, { name: "👰 Bridal Table", guests: [] });
    }

    // Load guest data from Firebase and build attendee list
    async function loadData() {
        showLoading(true);
        try {
            // Get all guests
            const guestsSnap = await getDocs(collection(db, GUESTS_COLLECTION));
            const guests = guestsSnap.docs.map(d => ({ id: d.id, ...d.data() }));
            
            // Get all responses
            const responsesSnap = await getDocs(collection(db, RESPONSES_COLLECTION));
            const responses = responsesSnap.docs.map(d => ({ id: d.id, ...d.data() }));
            
            // Build attendee list from responses
            allAttendees = [];
            
            for (const guest of guests) {
                const response = responses.find(r => r.guestCode === guest.code);
                
                if (response && response.guestNames && response.guestNames.length > 0) {
                    // Has named guests
                    for (let i = 0; i < response.guestNames.length; i++) {
                        allAttendees.push({
                            id: `${guest.code}_${i}`,
                            name: response.guestNames[i],
                            group: guest.name,
                            code: guest.code,
                            isManual: false
                        });
                    }
                } else if (response && response.fullName) {
                    // Has full name but no guestNames array
                    allAttendees.push({
                        id: `${guest.code}_main`,
                        name: response.fullName,
                        group: guest.name,
                        code: guest.code,
                        isManual: false
                    });
                } else if (guest.replied === true) {
                    // Replied but no name data
                    allAttendees.push({
                        id: `${guest.code}_default`,
                        name: guest.name,
                        group: guest.name,
                        code: guest.code,
                        isManual: false
                    });
                }
            }
            
            // Load saved seating from Firebase
            const seatingDoc = await getDoc(doc(db, SEATING_COLLECTION, "master"));
            if (seatingDoc.exists()) {
                const data = seatingDoc.data();
                if (data.tableAssignments) {
                    tableAssignments = new Map(Object.entries(data.tableAssignments));
                    // Rebuild attendeeTableMap
                    attendeeTableMap.clear();
                    for (const [tableId, table] of tableAssignments.entries()) {
                        for (const guest of table.guests) {
                            if (guest.id) attendeeTableMap.set(guest.id, tableId);
                        }
                    }
                } else {
                    initTables();
                }
            } else {
                initTables();
            }
            
            // Make sure all attendees are tracked in maps (unassigned ones not in any table)
            for (const attendee of allAttendees) {
                if (!attendeeTableMap.has(attendee.id)) {
                    // Not assigned - will appear in unassigned list
                }
            }
            
            renderUI();
        } catch (err) {
            console.error(err);
            alert("Error loading data: " + err.message);
        } finally {
            showLoading(false);
        }
    }

    // Assign attendee to a table
    function assignAttendee(attendee, tableId) {
        const table = tableAssignments.get(tableId);
        if (!table) return false;
        
        // Check capacity (bridal table has no limit)
        if (tableId !== BRIDAL_TABLE && table.guests.length >= MAX_PER_TABLE) {
            showToast(`Table ${tableId} is full (max ${MAX_PER_TABLE} guests)`);
            return false;
        }
        
        // Remove from old table if exists
        const oldTableId = attendeeTableMap.get(attendee.id);
        if (oldTableId) {
            const oldTable = tableAssignments.get(oldTableId);
            if (oldTable) {
                oldTable.guests = oldTable.guests.filter(g => g.id !== attendee.id);
            }
        }
        
        // Add to new table
        table.guests.push({ ...attendee });
        attendeeTableMap.set(attendee.id, tableId);
        
        renderUI();
        return true;
    }

    // Remove attendee from table
    function removeAttendee(attendeeId, tableId) {
        const table = tableAssignments.get(tableId);
        if (table) {
            table.guests = table.guests.filter(g => g.id !== attendeeId);
            attendeeTableMap.delete(attendeeId);
            renderUI();
        }
    }

    // Add manual guest to bridal table
    function addBridalGuest() {
        const name = prompt("Enter bridal party member name:");
        if (!name || name.trim() === "") return;
        
        const newId = `bridal_${Date.now()}_${Math.random()}`;
        const newGuest = {
            id: newId,
            name: name.trim(),
            group: "Bridal Party",
            code: "BRIDAL",
            isManual: true
        };
        
        const bridalTable = tableAssignments.get(BRIDAL_TABLE);
        bridalTable.guests.push(newGuest);
        attendeeTableMap.set(newId, BRIDAL_TABLE);
        renderUI();
        showToast(`Added ${name} to Bridal Table`);
    }

    // Save seating to Firebase
    async function saveSeating() {
        showLoading(true);
        try {
            const exportMap = {};
            for (const [key, val] of tableAssignments.entries()) {
                exportMap[key] = { name: val.name, guests: val.guests };
            }
            await setDoc(doc(db, SEATING_COLLECTION, "master"), {
                tableAssignments: exportMap,
                updatedAt: new Date().toISOString(),
                totalGuests: allAttendees.length
            });
            showToast("✓ Seating plan saved successfully!");
        } catch (err) {
            alert("Save failed: " + err.message);
        } finally {
            showLoading(false);
        }
    }

    // Get unassigned attendees
    function getUnassigned() {
        return allAttendees.filter(a => !attendeeTableMap.has(a.id));
    }

    // Get table warnings
    function getWarnings() {
        const warnings = [];
        for (const [tid, table] of tableAssignments.entries()) {
            if (tid === BRIDAL_TABLE) continue;
            const count = table.guests.length;
            if (count > 0 && count < MIN_PER_TABLE) {
                warnings.push(`${table.name} has only ${count} guests (min ${MIN_PER_TABLE})`);
            }
            if (count > MAX_PER_TABLE) {
                warnings.push(`${table.name} has ${count} guests (exceeds ${MAX_PER_TABLE})`);
            }
        }
        return warnings;
    }

    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    function renderUI() {
        const app = document.getElementById('app');
        const unassigned = getUnassigned();
        const warnings = getWarnings();
        
        let totalSeated = 0;
        for (const table of tableAssignments.values()) {
            totalSeated += table.guests.length;
        }
        
        app.innerHTML = `
            <div class="container">
                <div class="header">
                    <h1>✨ Daniel & Laura · Wedding Seating ✨</h1>
                    <p>${TOTAL_TABLES} guest tables (${MIN_PER_TABLE}-${MAX_PER_TABLE} seats) + Bridal Table</p>
                </div>
                
                <div class="stats-bar">
                    <div class="stat"><div class="stat-number">${allAttendees.length}</div><div>Total Guests</div></div>
                    <div class="stat"><div class="stat-number">${totalSeated}</div><div>Seated</div></div>
                    <div class="stat"><div class="stat-number">${unassigned.length}</div><div>Unassigned</div></div>
                    <div class="stat"><div class="stat-number">${TOTAL_TABLES}</div><div>Guest Tables</div></div>
                </div>
                
                ${warnings.length ? `<div class="warning">⚠️ ${warnings.join(' · ')}</div>` : ''}
                
                <div class="toolbar">
                    <button class="btn" id="saveBtn">💾 Save to Firebase</button>
                    <button class="btn btn-secondary" id="resetBtn">⟳ Reset All</button>
                    <button class="btn btn-secondary" id="addBridalBtn">➕ Add to Bridal Table</button>
                </div>
                
                <div class="main-layout">
                    <div class="tables-area">
                        <div class="tables-grid" id="tablesGrid"></div>
                    </div>
                    <div class="guests-area">
                        <h3>📋 Unassigned Guests</h3>
                        <p style="font-size:0.7rem; margin:8px 0 12px; color:#8b7355;">Click a guest, then choose a table</p>
                        <div id="unassignedList"></div>
                    </div>
                </div>
            </div>
        `;
        
        // Render tables
        const tablesGrid = document.getElementById('tablesGrid');
        tablesGrid.innerHTML = '';
        
        const sortedTables = Array.from(tableAssignments.keys()).sort((a, b) => {
            if (a === BRIDAL_TABLE) return 1;
            if (b === BRIDAL_TABLE) return -1;
            return parseInt(a) - parseInt(b);
        });
        
        for (const tid of sortedTables) {
            const table = tableAssignments.get(tid);
            const isBridal = tid === BRIDAL_TABLE;
            const guestCount = table.guests.length;
            
            const card = document.createElement('div');
            card.className = `table-card ${isBridal ? 'bridal' : ''}`;
            card.innerHTML = `
                <div class="table-header">
                    <span>${table.name} ${isBridal ? '⭐' : ''}</span>
                    <span style="font-size:0.7rem;">${guestCount} ${!isBridal ? `/ ${MAX_PER_TABLE}` : 'guests'}</span>
                </div>
                <div class="table-guests" id="table-${tid}">
                    ${table.guests.length === 0 ? '<div class="empty-table">— empty —</div>' : 
                        table.guests.map(g => `
                            <span class="guest-chip" data-id="${g.id}" data-table="${tid}">
                                ${escapeHtml(g.name)} ${g.isManual ? '👑' : ''} <span style="font-size:10px;">✖</span>
                            </span>
                        `).join('')
                    }
                </div>
                ${!isBridal ? `
                    <div style="padding:8px 12px 12px;">
                        <select id="assignSelect-${tid}" style="width:100%; margin-bottom:8px;">
                            <option value="">— assign guest —</option>
                            ${unassigned.map(u => `<option value="${u.id}">${escapeHtml(u.name)} (${escapeHtml(u.group)})</option>`).join('')}
                        </select>
                        <button class="btn" style="width:100%; padding:6px;" data-assign-to="${tid}">Assign</button>
                    </div>
                ` : ''}
            `;
            tablesGrid.appendChild(card);
            
            // Add remove listener to guest chips
            const chips = card.querySelectorAll('.guest-chip');
            chips.forEach(chip => {
                chip.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const guestId = chip.dataset.id;
                    const tableId = chip.dataset.table;
                    if (confirm('Remove this guest from the table?')) {
                        removeAttendee(guestId, tableId);
                    }
                });
            });
            
            // Add assign button listener for non-bridal tables
            if (!isBridal) {
                const assignBtn = card.querySelector(`[data-assign-to="${tid}"]`);
                const select = card.querySelector(`#assignSelect-${tid}`);
                if (assignBtn) {
                    assignBtn.onclick = () => {
                        const guestId = select.value;
                        if (!guestId) {
                            showToast('Select a guest first');
                            return;
                        }
                        const guest = unassigned.find(u => u.id === guestId);
                        if (guest) {
                            assignAttendee(guest, tid);
                            select.value = '';
                        }
                    };
                }
            }
        }
        
        // Render unassigned list
        const unassignedDiv = document.getElementById('unassignedList');
        if (unassigned.length === 0) {
            unassignedDiv.innerHTML = '<div style="text-align:center; padding:30px; color:#bfae8e;">✨ All guests assigned! ✨</div>';
        } else {
            unassignedDiv.innerHTML = unassigned.map(guest => `
                <div class="guest-list-item">
                    <div>
                        <div class="guest-name">${escapeHtml(guest.name)}</div>
                        <div class="guest-group">${escapeHtml(guest.group)}</div>
                    </div>
                    <select id="quickAssign-${guest.id}" style="width:130px;">
                        <option value="">Table...</option>
                        ${sortedTables.filter(t => t !== BRIDAL_TABLE).map(tid => `<option value="${tid}">Table ${tid}</option>`).join('')}
                        <option value="${BRIDAL_TABLE}">👰 Bridal</option>
                    </select>
                    <button class="btn" style="padding:4px 12px;" data-quick="${guest.id}">✔</button>
                </div>
            `).join('');
            
            // Add quick assign listeners
            for (const guest of unassigned) {
                const btn = unassignedDiv.querySelector(`[data-quick="${guest.id}"]`);
                const select = unassignedDiv.querySelector(`#quickAssign-${guest.id}`);
                if (btn) {
                    btn.onclick = () => {
                        const targetTable = select.value;
                        if (!targetTable) {
                            showToast('Select a table');
                            return;
                        }
                        assignAttendee(guest, targetTable);
                    };
                }
            }
        }
        
        // Button listeners
        document.getElementById('saveBtn').onclick = saveSeating;
        document.getElementById('resetBtn').onclick = () => {
            if (confirm('Reset all seating assignments? This cannot be undone.')) {
                initTables();
                attendeeTableMap.clear();
                renderUI();
                showToast('Seating reset');
            }
        };
        document.getElementById('addBridalBtn').onclick = addBridalGuest;
    }
    
    // Start the app
    loadData();
</script>
</body>
</html>
