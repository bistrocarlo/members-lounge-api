<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Member's Lounge – Staff Availability</title>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #f5f5f5; font-family: 'Segoe UI', sans-serif; padding: 20px; }
        .container { max-width: 1400px; margin: 0 auto; }
        .app-header { background: white; border-bottom: 3px solid #D4AF37; padding: 15px 20px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; }
        .logo-icon { background: #D4AF37; color: white; width: 50px; height: 50px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 28px; }
        .logo h1 { font-size: 1.8rem; }
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        .tab-btn { background: #f0f0f0; border: none; padding: 10px 20px; cursor: pointer; border-radius: 8px; font-weight: 500; }
        .tab-btn.active { background: #D4AF37; color: white; }
        .tab-pane { display: none; }
        .tab-pane.active { display: block; }
        .card { background: white; border-radius: 12px; padding: 20px; margin-bottom: 20px; border: 1px solid #e0e0e0; }
        .card h2 { color: #D4AF37; margin-bottom: 15px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; color: #555; font-weight: 500; }
        input, select, button { padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }
        button { background: #D4AF37; color: white; border: none; cursor: pointer; font-weight: bold; }
        .date-list { max-height: 500px; overflow-y: auto; margin-top: 15px; border: 1px solid #e0e0e0; border-radius: 8px; }
        .date-item { display: flex; justify-content: space-between; align-items: center; padding: 12px; border-bottom: 1px solid #eee; flex-wrap: wrap; gap: 10px; }
        .date-item .event-info { flex: 2; }
        .date-item input { transform: scale(1.2); width: auto; margin-right: 10px; }
        .staff-info { background: #fafafa; padding: 15px; border-radius: 8px; margin-bottom: 20px; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th, td { padding: 10px; text-align: left; border-bottom: 1px solid #eee; }
        th { background: #fafafa; color: #D4AF37; }
        .available-yes { background: #D4AF37; color: white; padding: 4px 10px; border-radius: 20px; font-size: 11px; display: inline-block; }
        .available-no { background: #e0e0e0; color: #999; padding: 4px 10px; border-radius: 20px; font-size: 11px; display: inline-block; }
        .section-filter { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 15px; }
        .filter-btn { background: #e0e0e0; padding: 5px 15px; border-radius: 20px; cursor: pointer; border: none; }
        .filter-btn.active { background: #D4AF37; color: white; }
        .success-msg, .error-msg { padding: 10px; border-radius: 6px; margin-bottom: 15px; }
        .success-msg { background: #e8f5e9; color: #2e7d32; }
        .error-msg { background: #ffebee; color: #c62828; }
        .hidden { display: none; }
        .scrollable-table { overflow-x: auto; max-height: 500px; overflow-y: auto; }
        .employee-list { display: flex; flex-wrap: wrap; gap: 15px; margin-bottom: 20px; }
        .employee-card { background: #fafafa; padding: 12px; border-radius: 8px; border: 1px solid #e0e0e0; min-width: 200px; }
        .employee-card .name { font-weight: bold; }
        .employee-card .code { font-family: monospace; background: #eee; padding: 2px 6px; border-radius: 4px; margin-left: 8px; }
        .employee-card button { padding: 4px 8px; font-size: 12px; margin-top: 8px; margin-right: 5px; }
        .delete-btn { background: #ff4444; }
        .toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: #2e7d32; color: white; padding: 12px 24px; border-radius: 50px; display: none; z-index: 9999; }
        @media (max-width: 768px) {
            .date-item { flex-direction: column; align-items: flex-start; }
            .tabs { justify-content: center; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="app-header">
        <div class="logo">
            <div class="logo-icon">ML</div>
            <h1>Member's Lounge</h1>
        </div>
        <div>Staff Availability – Live Firebase</div>
    </div>

    <div class="tabs">
        <button class="tab-btn active" data-tab="staff">Staff Availability</button>
        <button class="tab-btn" data-tab="admin">Admin Panel</button>
        <button class="tab-btn" data-tab="availability">Availability Matrix</button>
    </div>

    <!-- Staff Panel -->
    <div id="staff-pane" class="tab-pane active">
        <div class="card">
            <h2>Enter Your Employee Code</h2>
            <div id="staff-message" class="hidden"></div>
            <div class="form-group">
                <label>Employee Code</label>
                <input type="text" id="employee-code" placeholder="e.g., CARLO6" style="text-transform:uppercase">
                <button id="load-employee" style="margin-top:10px;">Load My Details</button>
            </div>
            <div id="staff-details" class="hidden">
                <div class="staff-info">
                    <div><strong>Name:</strong> <span id="display-name"></span></div>
                    <div><strong>Section:</strong> <span id="display-section"></span></div>
                </div>
                <div class="form-group">
                    <label>Select Dates You Can Work</label>
                    <div id="dates-container" class="date-list"></div>
                </div>
                <button id="submit-availability">💾 Save My Availability</button>
            </div>
        </div>
    </div>

    <!-- Admin Panel -->
    <div id="admin-pane" class="tab-pane">
        <div class="card">
            <h2>Manage Employees</h2>
            <div id="employee-list" class="employee-list"></div>
            <div style="display: flex; gap: 10px; flex-wrap: wrap; margin-top: 15px;">
                <input type="text" id="new-name" placeholder="Name" style="flex:2">
                <select id="new-section" style="flex:1">
                    <option value="kitchen">Kitchen</option>
                    <option value="floor">Floor</option>
                    <option value="bar">Bar</option>
                    <option value="manager">Manager</option>
                </select>
                <input type="text" id="new-code" placeholder="Code (auto)" style="flex:1">
                <button id="add-employee-btn">Add</button>
            </div>
        </div>
        <div class="card">
            <h2>Manage Events</h2>
            <div style="display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 15px;">
                <input type="date" id="new-event-date">
                <input type="text" id="new-event-venue" placeholder="Venue" style="flex:2">
                <button id="add-event-btn">Add Event</button>
            </div>
            <div id="event-list" style="max-height: 300px; overflow-y: auto;"></div>
        </div>
    </div>

    <!-- Availability Matrix -->
    <div id="availability-pane" class="tab-pane">
        <div class="card">
            <h2>Team Availability</h2>
            <div class="section-filter" id="section-filters">
                <button class="filter-btn active" data-section="all">All</button>
                <button class="filter-btn" data-section="kitchen">Kitchen</button>
                <button class="filter-btn" data-section="floor">Floor</button>
                <button class="filter-btn" data-section="bar">Bar</button>
                <button class="filter-btn" data-section="manager">Manager</button>
            </div>
            <div class="scrollable-table" id="availability-matrix">Loading...</div>
        </div>
    </div>
</div>

<div id="toast" class="toast">✓ Saved!</div>

<script>
    // FIREBASE CONFIG
    const firebaseConfig = {
        apiKey: "AIzaSyA0rDZ8NMo0cirWEPlIzt_Uq12qnOSBtPk",
        authDomain: "staff-roster-e0940.firebaseapp.com",
        projectId: "staff-roster-e0940",
        storageBucket: "staff-roster-e0940.firebasestorage.app",
        messagingSenderId: "176909786012",
        appId: "1:176909786012:web:be5a85f39c943915a00659"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // DATA
    let employees = [];
    let events = [];
    let submissions = {};
    let currentEmployeeId = null;
    let currentFilter = 'all';

    // DEFAULT DATA
    const DEFAULT_EMPLOYEES = [
        { name: "Carlo Pavia", section: "manager", code: "CARLO6" },
        { name: "Michelle Pavia", section: "manager", code: "MICHE0" },
        { name: "Rohitha Rawan", section: "kitchen", code: "ROHIT9" },
        { name: "Nam Lai", section: "kitchen", code: "NAMLA7" },
        { name: "Franco Schiavo", section: "kitchen", code: "FRANC3" },
        { name: "Peter Tricarico", section: "floor", code: "PETER8" },
        { name: "Claudio Bottigliero", section: "bar", code: "CLAUDI" },
        { name: "Remzi Asllanaj", section: "bar", code: "REMZIA" }
    ];

    const DEFAULT_EVENTS = [
        { date: "2026-04-18", venue: "Fior Events" },
        { date: "2026-05-09", venue: "Fior Events" },
        { date: "2026-05-17", venue: "Sala Reggio Ballroom" },
        { date: "2026-05-22", venue: "Sala Reggio Ballroom" },
        { date: "2026-05-23", venue: "Sala Reggio Ballroom" },
        { date: "2026-05-24", venue: "Sala Reggio Ballroom" },
        { date: "2026-05-29", venue: "Sala Reggio Ballroom" },
        { date: "2026-05-30", venue: "Sala Reggio Ballroom" },
        { date: "2026-05-31", venue: "Sala Reggio Ballroom" }
    ];

    // Helper functions
    function formatDate(dateStr) {
        return new Date(dateStr).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
    }

    function showToast() {
        const toast = document.getElementById('toast');
        toast.style.display = 'block';
        setTimeout(() => toast.style.display = 'none', 2000);
    }

    // SEED DATABASE (creates default data if empty)
    async function seedDatabase() {
        const employeesSnap = await db.collection('employees').get();
        if (employeesSnap.empty) {
            for (const emp of DEFAULT_EMPLOYEES) {
                await db.collection('employees').add(emp);
            }
            console.log('Employees seeded');
        }
        
        const eventsSnap = await db.collection('events').get();
        if (eventsSnap.empty) {
            for (const ev of DEFAULT_EVENTS) {
                await db.collection('events').add(ev);
            }
            console.log('Events seeded');
        }
    }

    // Load data from Firestore
    async function loadData() {
        const employeesSnap = await db.collection('employees').get();
        employees = [];
        employeesSnap.forEach(doc => employees.push({ id: doc.id, ...doc.data() }));
        
        const eventsSnap = await db.collection('events').get();
        events = [];
        eventsSnap.forEach(doc => events.push({ id: doc.id, ...doc.data() }));
        events.sort((a, b) => new Date(a.date) - new Date(b.date));
        
        const submissionsSnap = await db.collection('submissions').get();
        submissions = {};
        submissionsSnap.forEach(doc => {
            submissions[doc.id] = doc.data().eventIds || [];
        });
    }

    // Real-time listener
    function listenForUpdates() {
        db.collection('submissions').onSnapshot(async () => {
            await loadData();
            if (currentEmployeeId) await renderDates();
            await renderAvailabilityMatrix();
            renderAdminEmployees();
            renderAdminEvents();
        });
    }

    // Render dates for staff
    async function renderDates() {
        const container = document.getElementById('dates-container');
        if (!container || !currentEmployeeId) return;
        const emp = employees.find(e => e.id === currentEmployeeId);
        if (!emp) return;
        container.innerHTML = '';
        const mySubmissions = submissions[currentEmployeeId] || [];
        for (const ev of events) {
            const isChecked = mySubmissions.includes(ev.id);
            const div = document.createElement('div');
            div.className = 'date-item';
            div.innerHTML = `
                <div class="event-info">
                    <strong>${formatDate(ev.date)}</strong><br>${ev.venue}
                </div>
                <label>
                    <input type="checkbox" data-id="${ev.id}" ${isChecked ? 'checked' : ''}>
                    Available to work
                </label>
            `;
            container.appendChild(div);
        }
    }

    // Save availability
    async function submitAvailability() {
        if (!currentEmployeeId) {
            alert('Please load your employee details first');
            return;
        }
        const checkboxes = document.querySelectorAll('#dates-container input[type="checkbox"]');
        const selected = [];
        checkboxes.forEach(cb => { if (cb.checked) selected.push(cb.getAttribute('data-id')); });
        
        await db.collection('submissions').doc(currentEmployeeId).set({ eventIds: selected });
        showToast();
        const emp = employees.find(e => e.id === currentEmployeeId);
        document.getElementById('staff-message').textContent = `✓ Saved for ${emp.name}!`;
        document.getElementById('staff-message').className = 'success-msg';
        document.getElementById('staff-message').classList.remove('hidden');
        setTimeout(() => document.getElementById('staff-message').classList.add('hidden'), 3000);
    }

    // Render availability matrix
    async function renderAvailabilityMatrix() {
        const container = document.getElementById('availability-matrix');
        if (!container) return;
        let filtered = currentFilter === 'all' ? employees : employees.filter(e => e.section === currentFilter);
        if (filtered.length === 0) {
            container.innerHTML = '<p>No employees in this section.</p>';
            return;
        }
        let html = '<table style="min-width:600px;"><thead><tr><th>Event</th>';
        filtered.forEach(emp => html += `<th>${emp.name}<br><small>${emp.code}</small></th>`);
        html += '</tr></thead><tbody>';
        for (const ev of events) {
            html += `<tr><td><strong>${formatDate(ev.date)}</strong><br>${ev.venue}</td>`;
            for (const emp of filtered) {
                const isAvail = (submissions[emp.id] || []).includes(ev.id);
                html += `<td style="text-align:center;">${isAvail ? '<span class="available-yes">✓</span>' : '<span class="available-no">✗</span>'}</td>`;
            }
            html += '</tr>';
        }
        html += '</tbody></table>';
        container.innerHTML = html;
    }

    // Admin functions
    async function renderAdminEmployees() {
        const container = document.getElementById('employee-list');
        if (!container) return;
        container.innerHTML = '';
        for (const emp of employees) {
            const card = document.createElement('div');
            card.className = 'employee-card';
            card.innerHTML = `
                <div><span class="name">${emp.name}</span> <span class="code">${emp.code}</span></div>
                <div style="font-size:12px; color:#666;">${emp.section}</div>
                <button class="delete-employee" data-id="${emp.id}" style="background:#ff4444;">Delete</button>
            `;
            container.appendChild(card);
        }
        document.querySelectorAll('.delete-employee').forEach(btn => {
            btn.addEventListener('click', async () => {
                if (confirm('Delete this employee?')) {
                    await db.collection('employees').doc(btn.dataset.id).delete();
                    await loadData();
                    renderAdminEmployees();
                    renderAvailabilityMatrix();
                }
            });
        });
    }

    async function renderAdminEvents() {
        const container = document.getElementById('event-list');
        if (!container) return;
        container.innerHTML = '';
        for (const ev of events) {
            const div = document.createElement('div');
            div.style.display = 'flex';
            div.style.justifyContent = 'space-between';
            div.style.padding = '10px';
            div.style.borderBottom = '1px solid #eee';
            div.innerHTML = `
                <span><strong>${formatDate(ev.date)}</strong> – ${ev.venue}</span>
                <button class="delete-event" data-id="${ev.id}" style="background:#ff4444; padding:4px 12px;">Delete</button>
            `;
            container.appendChild(div);
        }
        document.querySelectorAll('.delete-event').forEach(btn => {
            btn.addEventListener('click', async () => {
                if (confirm('Delete this event?')) {
                    await db.collection('events').doc(btn.dataset.id).delete();
                    await loadData();
                    renderAdminEvents();
                    renderAvailabilityMatrix();
                    if (currentEmployeeId) renderDates();
                }
            });
        });
    }

    async function addEmployee() {
        const name = document.getElementById('new-name').value.trim();
        const section = document.getElementById('new-section').value;
        let code = document.getElementById('new-code').value.trim().toUpperCase();
        if (!name) { alert('Enter name'); return; }
        if (!code) code = Math.random().toString(36).substring(2, 8).toUpperCase();
        await db.collection('employees').add({ name, section, code });
        await loadData();
        renderAdminEmployees();
        renderAvailabilityMatrix();
        document.getElementById('new-name').value = '';
        document.getElementById('new-code').value = '';
        showToast();
    }

    async function addEvent() {
        const date = document.getElementById('new-event-date').value;
        const venue = document.getElementById('new-event-venue').value.trim();
        if (!date || !venue) { alert('Enter date and venue'); return; }
        await db.collection('events').add({ date, venue });
        await loadData();
        renderAdminEvents();
        renderAvailabilityMatrix();
        if (currentEmployeeId) renderDates();
        document.getElementById('new-event-date').value = '';
        document.getElementById('new-event-venue').value = '';
        showToast();
    }

    // Staff login
    function loadEmployeeByCode() {
        const code = document.getElementById('employee-code').value.trim().toUpperCase();
        const emp = employees.find(e => e.code === code);
        if (!emp) {
            alert('Code not found. Valid codes: CARLO6, MICHE0, ROHIT9, NAMLA7, FRANC3, PETER8, CLAUDI, REMZIA');
            return;
        }
        currentEmployeeId = emp.id;
        document.getElementById('display-name').innerText = emp.name;
        document.getElementById('display-section').innerText = emp.section;
        document.getElementById('staff-details').classList.remove('hidden');
        renderDates();
    }

    // Tab switching
    function switchTab(tabId) {
        document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(tabId + '-pane').classList.add('active');
        document.querySelector(`[data-tab="${tabId}"]`).classList.add('active');
        if (tabId === 'admin') {
            renderAdminEmployees();
            renderAdminEvents();
        } else if (tabId === 'availability') {
            renderAvailabilityMatrix();
        }
    }

    function initFilters() {
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentFilter = btn.dataset.section;
                renderAvailabilityMatrix();
            });
        });
    }

    // Initialize
    async function init() {
        await seedDatabase();
        await loadData();
        initFilters();
        listenForUpdates();
        
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', () => switchTab(btn.dataset.tab));
        });
        document.getElementById('load-employee').addEventListener('click', loadEmployeeByCode);
        document.getElementById('submit-availability').addEventListener('click', submitAvailability);
        document.getElementById('add-employee-btn').addEventListener('click', addEmployee);
        document.getElementById('add-event-btn').addEventListener('click', addEvent);
        
        renderAvailabilityMatrix();
    }
    
    init();
</script>
</body>
</html>
