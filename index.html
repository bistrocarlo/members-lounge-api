<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monday Night Soccer</title>
    <style>
        body{font-family:Arial;background:#eef2f5;padding:16px;max-width:500px;margin:0 auto}
        .card{background:white;border-radius:24px;padding:18px;margin-bottom:14px}
        button{background:#1a73e8;color:white;border:none;padding:12px;border-radius:60px;width:100%;margin:5px 0;cursor:pointer}
        select,input{width:100%;padding:14px;border-radius:60px;border:1px solid #ddd;margin:8px 0}
        .btn-green{background:#28a745}
        .btn-red{background:#dc3545}
        .flex{display:flex;gap:8px;flex-wrap:wrap}
        .tag{background:#e2e8f0;padding:6px 12px;border-radius:40px;margin:4px;display:inline-block}
        .header{background:white;padding:14px;text-align:center;border-radius:24px;margin-bottom:16px}
        .nav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
        .nav-btn{background:#f8fafc;color:#475569;width:auto;padding:8px 14px;font-size:12px}
        .nav-btn.active{background:#1a73e8;color:white}
        .hidden{display:none}
    </style>
</head>
<body>
<div id="app"></div>

<script>
const PLAYERS = ["Alex Rowe","Ali Mekawy","Carlo","Charlie","Chris Del Monaco","Chris M","Chris S","Danny","Dante","David","Dimitri","Enzo","Farid","Faros","Frank","George B","George T","Ivan","James Zoumis","James","Joe T","Joey","Kia","Leo","Manoli","Marco","Mario","Maurice","Nector","Paul","Perri","Peter","Ralph","Rocco","Stav","Stevan","Theo","Tony EH","Vasilis"].sort();

let currentUser = null;
let attendance = JSON.parse(localStorage.getItem("attendance") || "{}");

function getNextMonday() {
    let d = new Date();
    let day = d.getDay();
    let days = (day === 1 ? 0 : (day === 0 ? 1 : 8 - day));
    d.setDate(d.getDate() + days);
    return d;
}

function getGameLabel() {
    let d = getNextMonday();
    return 'Mon ' + d.toLocaleDateString('en-AU', {day:'numeric', month:'long'});
}

function saveAttendance(status) {
    attendance[currentUser] = status;
    localStorage.setItem("attendance", JSON.stringify(attendance));
    renderHome();
}

function getParticipants() {
    let players = [];
    for(let p in attendance) if(attendance[p] === 'in') players.push(p);
    return players;
}

function renderHome() {
    let players = getParticipants();
    let myStatus = attendance[currentUser];
    document.getElementById("home").innerHTML = `
        <div class="card">
            <h2>${getGameLabel()} • 8pm</h2>
            <p>Clifton Park, Brunswick</p>
            <div class="flex">
                <button class="btn-green" onclick="saveAttendance('in')" style="flex:1">✅ PLAYING</button>
                <button class="btn-red" onclick="saveAttendance('out')" style="flex:1">❌ CAN'T PLAY</button>
            </div>
            <p>${myStatus === 'in' ? '✓ You are PLAYING' : (myStatus === 'out' ? '✗ You are NOT PLAYING' : 'Tap above')}</p>
        </div>
        <div class="card">
            <h3>Playing (${players.length})</h3>
            <div class="flex">${players.map(p => `<span class="tag">${p}</span>`).join('') || 'None'}</div>
        </div>
    `;
}

function renderTeams() {
    document.getElementById("teams").innerHTML = `<div class="card"><h2>Teams</h2><p>Team assignments coming soon</p></div>`;
}

function renderStats() {
    document.getElementById("stats").innerHTML = `<div class="card"><h2>Stats</h2><p>Statistics coming soon</p></div>`;
}

function renderRules() {
    document.getElementById("rules").innerHTML = `<div class="card"><h2>Rules</h2><p>• 8pm SHARP at Clifton Park<br>• RSVP by Sunday 6pm<br>• No slide tackles</p></div>`;
}

function renderApp() {
    document.getElementById("app").innerHTML = `
        <div class="header">
            <h1>MONDAY NIGHT SOCCER</h1>
            <div>👤 ${currentUser} <button onclick="logout()">Exit</button></div>
        </div>
        <div class="nav">
            <button class="nav-btn" onclick="showModule('home')">HOME</button>
            <button class="nav-btn" onclick="showModule('teams')">TEAMS</button>
            <button class="nav-btn" onclick="showModule('stats')">STATS</button>
            <button class="nav-btn" onclick="showModule('rules')">RULES</button>
        </div>
        <div id="home" class="module"></div>
        <div id="teams" class="module hidden"></div>
        <div id="stats" class="module hidden"></div>
        <div id="rules" class="module hidden"></div>
    `;
    window.showModule = function(id) {
        document.querySelectorAll(".module").forEach(m => m.classList.add("hidden"));
        document.getElementById(id).classList.remove("hidden");
        if(id === "home") renderHome();
        if(id === "teams") renderTeams();
        if(id === "stats") renderStats();
        if(id === "rules") renderRules();
    };
    showModule("home");
}

function logout() {
    currentUser = null;
    localStorage.removeItem("mns_user");
    renderLogin();
}

function renderLogin() {
    document.getElementById("app").innerHTML = `
        <div class="card">
            <h2>Monday Night Soccer</h2>
            <p>8pm • Clifton Park</p>
            <select id="playerSelect">
                <option value="">-- Select Name --</option>
                ${PLAYERS.map(p => `<option value="${p}">${p}</option>`).join('')}
            </select>
            <button onclick="login()">Enter</button>
            <hr>
            <input type="password" id="adminPw" placeholder="Admin Password">
            <button onclick="adminLogin()">Admin Login</button>
        </div>
    `;
}

function login() {
    let n = document.getElementById("playerSelect").value;
    if(n) {
        currentUser = n;
        localStorage.setItem("mns_user", JSON.stringify({name:n}));
        renderApp();
    }
}

function adminLogin() {
    let pw = document.getElementById("adminPw").value;
    if(pw === "carlo123") {
        currentUser = "Admin";
        localStorage.setItem("mns_user", JSON.stringify({name:"Admin"}));
        renderApp();
    } else alert("Wrong password");
}

let stored = localStorage.getItem("mns_user");
if(stored) {
    try {
        let u = JSON.parse(stored);
        currentUser = u.name;
        renderApp();
    } catch(e) { renderLogin(); }
} else { renderLogin(); }
</script>
</body>
</html>
