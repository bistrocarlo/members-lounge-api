        select,input{width:100%;padding:14px;border:1.5px solid #e2e8f0;border-radius:60px;margin:8px 0;font-size:16px;background:white;}
        button{background:#1a73e8;color:white;border:none;padding:12px 20px;border-radius:60px;font-weight:700;cursor:pointer;}
        .flex-btns{display:flex;gap:12px;margin-top:12px;flex-wrap:wrap;}
        .btn-outline{background:white;color:#1a73e8;border:2px solid #1a73e8;}
        .chat-message{margin-bottom:12px;}
        .chat-bubble{background:#f1f5f9;padding:10px 14px;border-radius:18px;font-size:14px;}
        .chat-name{font-weight:700;font-size:12px;color:#1a73e8;margin-bottom:4px;}
        .info-bar{background:#e8f0fe;border-radius:16px;padding:12px;font-size:12px;margin-bottom:16px;text-align:center;color:#1a73e8;font-weight:500;}
        .timer-container{background:linear-gradient(135deg,#1e293b,#0f172a);border-radius:28px;padding:20px;text-align:center;margin-bottom:16px;}
        .timer-display{font-size:56px;font-weight:800;font-family:monospace;color:#10b981;letter-spacing:4px;background:#00000030;border-radius:20px;padding:12px;margin-bottom:16px;}
        .timer-controls{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;}

        .timer-btn.start{background:#10b981;color:white;}
        .timer-btn.pause{background:#f59e0b;color:white;}
        .timer-btn.reset{background:#ef4444;color:white;}
        .half-status{font-size:14px;color:#94a3b8;margin-top:10px;}
        .half-status span{color:#10b981;font-weight:700;}
        .loading{text-align:center;padding:40px;color:#64748b;}
        .goal-scorer-select{width:100%;padding:10px;border-radius:60px;border:1px solid #e2e8f0;margin:5px 0;}
        .match-report-card{background:#fef3c7;border-left:4px solid #f59e0b;}
        @media (max-width:450px){.team-row{flex-direction:column;}}

<body>
<div class="app" id="app"><div class="loading"><i class="fas fa-spinner fa-spin"></i> Loading Monday Night Soccer...</div></div>

<script>
    // ==================== FIREBASE CONFIG ====================
    const firebaseConfig = {
        apiKey: "AIzaSyCWlFqDJyENgrUOhiLXCjSEi4Mk_54SA1w",
        authDomain: "monday-night-soccer-hub.firebaseapp.com",
        projectId: "monday-night-soccer-hub",
        storageBucket: "monday-night-soccer-hub.firebasestorage.app",
        messagingSenderId: "634335208908",
        appId: "1:634335208908:web:dca705b65fc52de0606969"
    };
    
    let db = null, firebaseReady = false;
    try { firebase.initializeApp(firebaseConfig); db = firebase.firestore(); firebaseReady = true; } catch(e) { console.warn("Firebase demo mode"); }
    
    // ==================== DEFAULT PLAYERS ====================
    let players = ["Alex Rowe","Ali Mekawy","Carlo","Charlie","Chris Del Monaco","Chris M","Chris S","Danny","Dante","David","Dimitri","Enzo","Farid","Faros","Frank","George B","George T","Ivan","James Zoumis","James","Joe T","Joey","Kia","Leo","Manoli","Marco","Mario","Maurice","Nector","Paul","Perri","Peter","Ralph","Rocco","Stav","Stevan","Theo","Tony EH","Vasilis"].sort();
    let playerProfiles = {};
    let teamAssignments = {};
    let matchResults = {};
    let attendance = [];
    let guests = [];
    let payments = [];
    let matchComments = {};
    let isAdminLoggedIn = false, currentUser = null;
    let weeklyCaptain = "Carlo";
    let weatherData = { temp: "18°C", condition: "Clear", icon: "fa-sun", rainChance: 10 };
    let rulesText = "• ⏰ 8:00pm SHARP kickoff at Clifton Park\n• 💰 $5 weekly fee\n• 👑 Captain rotates\n• ✅ RSVP is mandatory\n• 🎭 Guests welcome! Players can bring guests\n• 📝 Match reports recorded by Admin";
    const POSITIONS = ["Goalkeeper","Defender","Midfielder","Striker","Winger"];
    let chatUnsubscribe = null;
    const WEEKLY_FEE = 5;
    
    // ==================== MATCH TIMER ====================
    let timerInterval = null;
    let currentHalf = 1;
    let timeLeft = 45 * 60;
    let isTimerRunning = false;
    
    function playAlarm() {
        try {
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.frequency.value = 880;
            gain.gain.value = 0.5;
            osc.start();
            gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + 1.5);
            osc.stop(audioCtx.currentTime + 1.5);
        } catch(e) { console.warn("Alarm not supported"); }
    }
    
    function formatTime(sec) { return `${Math.floor(sec/60).toString().padStart(2,'0')}:${(sec%60).toString().padStart(2,'0')}`; }
    function updateTimerDisplay() {
        const d = document.getElementById("timerDisplay");
        if(d) d.textContent = formatTime(timeLeft);
        const hs = document.getElementById("currentHalf");
        if(hs) hs.textContent = currentHalf === 1 ? "FIRST HALF" : "SECOND HALF";
    }
    function timerTick() {
        if(timeLeft <= 0) {
            if(timerInterval) clearInterval(timerInterval);
            isTimerRunning = false;
            playAlarm();
            if(currentHalf === 1) {
                alert("🔔 HALF TIME! 45 minutes completed. Click OK to start second half.");
                currentHalf = 2;
                timeLeft = 45 * 60;
                updateTimerDisplay();
            } else {
                alert("🔔 FULL TIME! Match ended.");
            }
            return;
        }
        timeLeft--;
        updateTimerDisplay();
    }
    function startTimer() { if(timerInterval) clearInterval(timerInterval); isTimerRunning = true; timerInterval = setInterval(timerTick, 1000); }
    function pauseTimer() { if(timerInterval) { clearInterval(timerInterval); timerInterval = null; isTimerRunning = false; } }
    function resetTimer() { pauseTimer(); currentHalf = 1; timeLeft = 45 * 60; updateTimerDisplay(); }
    
    // ==================== AEST GAME WEEK CALCULATION ====================
    function getNextMondayGame() {
        const now = new Date();
        const utc = now.getTime() + (now.getTimezoneOffset() * 60000);
        const aestNow = new Date(utc + (10 * 3600000));
        const currentDay = aestNow.getDay();
        const currentHour = aestNow.getHours();
        let daysUntilMonday;
        if (currentDay === 1 && currentHour >= 20) daysUntilMonday = 7;
        else if (currentDay === 1) daysUntilMonday = 0;
        else if (currentDay === 0) daysUntilMonday = 1;
        else daysUntilMonday = (8 - currentDay) % 7;
        const nextMonday = new Date(aestNow);
        nextMonday.setDate(aestNow.getDate() + daysUntilMonday);
        nextMonday.setHours(20, 0, 0, 0);
        return nextMonday;
    }
    
    function getCurrentGameWeekStr() { return getNextMondayGame().toISOString().split('T')[0]; }
    function getCurrentGameLabel() {
        const monday = getNextMondayGame();
        return `Mon ${monday.toLocaleDateString('en-AU', { day:'numeric', month:'short' })}`;
    }
    
    function getAllGameWeeks() {
        const year = new Date().getFullYear();
        let start = new Date(year, 0, 1);
        while (start.getDay() !== 1) start.setDate(start.getDate() + 1);
        let weeks = [], cur = new Date(start);
        let dec31 = new Date(year, 11, 31);
        let lastMon = new Date(dec31);
        while (lastMon.getDay() !== 1) lastMon.setDate(lastMon.getDate() - 1);
        let secondLast = new Date(lastMon);
        secondLast.setDate(secondLast.getDate() - 7);
        while (cur <= secondLast) {
            weeks.push({ dateStr: cur.toISOString().split('T')[0], label: `Mon ${cur.toLocaleDateString('en-AU', { day:'numeric', month:'short' })}` });
            cur.setDate(cur.getDate() + 7);
        }
        return weeks;
    }
    
    const ALL_WEEKS = getAllGameWeeks();
    const CURRENT_GAME_STR = getCurrentGameWeekStr();
    function getFutureWeeks() { return ALL_WEEKS.filter(w => w.dateStr >= CURRENT_GAME_STR); }
    function getPastWeeks() { return ALL_WEEKS.filter(w => w.dateStr < CURRENT_GAME_STR).reverse(); }
    
    function getAllParticipants(gameDate) {
        const playersIn = attendance.filter(a => a.gameDate === gameDate && a.status === 'in').map(a => a.player);
        const guestsIn = guests.filter(g => g.gameDate === gameDate).map(g => ({ name: g.guestName, isGuest: true, addedBy: g.addedBy }));
        return { players: playersIn, guests: guestsIn };
    }
    
    // ==================== HELPER FUNCTIONS ====================
    function escapeHtml(str) { return String(str).replace(/[&<>]/g, m => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;' }[m])); }
    function getInitials(name) { return name.split(' ').map(n=>n[0]).join('').toUpperCase().substring(0,2); }
    function getAvatarColor(name) {
        const colors = ['#1a73e8','#28a745','#dc3545','#fd7e14','#6f42c1','#20c997','#e83e8c'];
        let hash=0; for(let i=0;i<name.length;i++) hash=((hash<<5)-hash)+name.charCodeAt(i);
        return colors[Math.abs(hash)%colors.length];
    }
    function renderAvatar(name,size=50){return `<div class="profile-avatar" style="background:${getAvatarColor(name)};width:${size}px;height:${size}px;font-size:${size/2.5}px;">${getInitials(name)}</div>`;}
    function renderMiniAvatar(name,size=28){return `<div class="player-avatar-small" style="background:${getAvatarColor(name)};width:${size}px;height:${size}px;font-size:${size/2}px;">${getInitials(name)}</div>`;}
    
    // ==================== WEATHER ====================
    async function fetchWeather() {
        try {
            const r=await fetch('https://api.open-meteo.com/v1/forecast?latitude=-37.77&longitude=144.97&hourly=temperature_2m,precipitation_probability,weathercode&timezone=Australia/Melbourne&forecast_days=7');
            const d=await r.json();
            const targetDate = getCurrentGameWeekStr();
            for(let i=0;i<d.hourly.time.length;i++) {
                const hourDate = d.hourly.time[i].split('T')[0];
                const hour = parseInt(d.hourly.time[i].split('T')[1].substring(0,2));
                if(hourDate === targetDate && hour === 20) {
                    const temp=Math.round(d.hourly.temperature_2m[i]);
                    const code=d.hourly.weathercode[i];
                    let cond="Clear", icon="fa-sun";
                    if(code===0){cond="Clear"; icon="fa-sun";}
                    else if(code===1||code===2){cond="Partly cloudy"; icon="fa-cloud-sun";}
                    else if(code===3){cond="Overcast"; icon="fa-cloud";}
                    else if(code>=51&&code<=67){cond="Light rain"; icon="fa-cloud-rain";}
                    else if(code>=80&&code<=99){cond="Rain/storm"; icon="fa-cloud-bolt";}
                    weatherData={temp:`${temp}°C`, condition:cond, icon, rainChance:d.hourly.precipitation_probability[i]||0};
                    break;
                }
            }
        } catch(e){}
        renderWeatherPage();
    }
    
    // ==================== FIRESTORE CRUD ====================
    async function loadData() {
        if(!firebaseReady||!db) return;
        try {
            const [pDoc,profDoc,tDoc,rDoc,attSnap,guestSnap,paySnap,commentsSnap] = await Promise.all([
                db.collection("config").doc("players").get().catch(()=>null),
                db.collection("config").doc("playerProfiles").get().catch(()=>null),
                db.collection("config").doc("teamAssignments").get().catch(()=>null),
                db.collection("config").doc("matchResults").get().catch(()=>null),
                db.collection("attendance").get().catch(()=>({docs:[]})),
                db.collection("guests").get().catch(()=>({docs:[]})),
                db.collection("payments").get().catch(()=>({docs:[]})),
                db.collection("matchComments").get().catch(()=>({docs:[]}))
            ]);
            if(pDoc?.exists) players = pDoc.data().list.sort();
            if(profDoc?.exists) playerProfiles = profDoc.data();
            if(tDoc?.exists) teamAssignments = tDoc.data();
            if(rDoc?.exists) matchResults = rDoc.data();
            attendance = attSnap.docs.map(d=>d.data());
            guests = guestSnap.docs.map(d=>d.data());
            payments = paySnap.docs.map(d=>d.data());
            matchComments = {};
            commentsSnap.docs.forEach(doc=>{const data=doc.data(); if(!matchComments[data.gameDate]) matchComments[data.gameDate]=[]; matchComments[data.gameDate].push(data);});
            for(let p of players) if(!playerProfiles[p]) playerProfiles[p] = {age:'—',position:'—',yearJoined:'—',gamesPlayed:0,openingBalanceGames:0};
        } catch(e){console.warn(e);}
    }
    
    async function saveAttendance(a) {
        if(firebaseReady&&db) await db.collection("attendance").doc(`${a.player}_${a.gameDate}`).set(a);
        const idx = attendance.findIndex(x=>x.player===a.player&&x.gameDate===a.gameDate);
        if(idx!==-1) attendance[idx]=a; else attendance.push(a);
        const games = attendance.filter(att=>att.player===a.player&&att.status==='in').length;
        const open = playerProfiles[a.player]?.openingBalanceGames||0;
        if(playerProfiles[a.player]) playerProfiles[a.player].gamesPlayed = games+open;
        else playerProfiles[a.player] = {age:'—',position:'—',yearJoined:'—',gamesPlayed:games+open,openingBalanceGames:0};
        if(firebaseReady&&db) await db.collection("config").doc("playerProfiles").set(playerProfiles);
        refreshAll();
    }
    
    async function savePayment(p) {
        if(firebaseReady&&db) await db.collection("payments").doc(`${p.player}_${p.gameDate}`).set(p);
        const idx = payments.findIndex(pay=>pay.player===p.player&&pay.gameDate===p.gameDate);
        if(idx!==-1) payments[idx]=p; else payments.push(p);
        if(isAdminLoggedIn) renderAdminPage();
    }
    
    async function saveGuest(g) {
        if(firebaseReady&&db) await db.collection("guests").doc(`${g.guestName}_${g.gameDate}`).set(g);
        guests.push(g);
        refreshAll();
    }
    
    async function removeGuest(name,date) {
        if(!confirm(`Remove guest "${name}"?`)) return;
        if(firebaseReady&&db) await db.collection("guests").doc(`${name}_${date}`).delete();
        guests = guests.filter(g=>!(g.guestName===name&&g.gameDate===date));
        if(teamAssignments[date]){ delete teamAssignments[date][name]; delete teamAssignments[date][`guest_${name}`]; if(firebaseReady&&db) await db.collection("config").doc("teamAssignments").set(teamAssignments);}
        refreshAll();
    }
    
    async function saveTeamAssignments(date,assign) {
        teamAssignments[date] = assign;
        if(firebaseReady&&db) await db.collection("config").doc("teamAssignments").set(teamAssignments);
        refreshAll();
    }
    
    async function saveComment(date,author,text) {
        const c = {gameDate:date,author,text,timestamp:Date.now()};
        if(firebaseReady&&db) await db.collection("matchComments").add(c);
        if(!matchComments[date]) matchComments[date]=[];
        matchComments[date].push(c);
        renderHistoryPage();
    }
    
    async function saveMatchResult(date,yellowScore,orangeScore,goals,mvp) {
        matchResults[date] = {yellowScore,orangeScore,goals,mvp,timestamp:Date.now()};
        if(firebaseReady&&db) await db.collection("config").doc("matchResults").set(matchResults);
        renderHistoryPage(); renderScoreboardPage();
        if(isAdminLoggedIn) renderAdminPage();
    }
    
    async function saveChatMessage(msg) {

        if(!players.includes(playerName)){alert(`Player not in roster`); return;}
        const existing = attendance.find(a=>a.player===playerName&&a.gameDate===CURRENT_GAME_STR);
        if(existing?.status==='in'){alert(`${playerName} already playing`); return;}
        await saveAttendance({player:playerName, gameDate:CURRENT_GAME_STR, status:'in', manuallyAdded:true});
        alert(`${playerName} added to playing list for ${getCurrentGameLabel()}`);

        if(!currentUser){alert("Please login first"); return;}
        if(guests.some(g=>g.gameDate===CURRENT_GAME_STR&&g.guestName===name.trim())){alert("Guest already exists this week"); return;}

        if(inp) inp.value="";

    function showEditProfile(name) {
        // SECURITY: Only allow user to edit their own profile, or admin
        if (!isAdminLoggedIn && currentUser?.name !== name) {
            alert("You can only edit your own profile");
            return;
        }
        const ex = playerProfiles[name] || {age:'',position:POSITIONS[0],yearJoined:'',openingBalanceGames:0};
        const modal = document.createElement('div'); modal.className='modal';
        modal.innerHTML=`<div class="modal-content"><h3>✏️ Edit ${escapeHtml(name)}</h3><label>Age</label><input id="editAge" value="${escapeHtml(ex.age||'')}"><label>Position</label><select id="editPosition">${POSITIONS.map(p=>`<option ${ex.position===p?'selected':''}>${p}</option>`).join('')}</select><label>Year Joined</label><input id="editYear" value="${escapeHtml(ex.yearJoined||'')}"><label>Opening Games (History)</label><input id="editOpeningGames" type="number" value="${ex.openingBalanceGames||0}"><div class="flex-btns"><button id="saveBtn">Save</button><button id="cancelBtn" class="btn-outline">Cancel</button></div></div>`;
        document.body.appendChild(modal);
        document.getElementById('saveBtn').onclick = async()=>{
            const newAge=document.getElementById('editAge').value.trim();
            const newPos=document.getElementById('editPosition').value;
            const newYear=document.getElementById('editYear').value.trim();
            const newOpen=parseInt(document.getElementById('editOpeningGames').value)||0;
            const gamesAtt=attendance.filter(a=>a.player===name&&a.status==='in').length;
            playerProfiles[name]={age:newAge||'—',position:newPos,yearJoined:newYear||'—',gamesPlayed:gamesAtt+newOpen,openingBalanceGames:newOpen};
            if(firebaseReady&&db) await db.collection("config").doc("playerProfiles").set(playerProfiles);
            modal.remove();
            renderProfilesPage(); renderScoreboardPage();
        };
        document.getElementById('cancelBtn').onclick = ()=>modal.remove();
    }

        if(container) container.innerHTML = html;
        
        // Match Report Logic
        const reportWeekSelect = document.getElementById("reportWeekSelect");
        const matchReportForm = document.getElementById("matchReportForm");
        const goalScorersList = document.getElementById("goalScorersList");
        const mvpSelect = document.getElementById("mvpSelect");
        let goalScorers = [];
        
        function updateGoalScorersUI() {
            if(!goalScorersList) return;
            goalScorersList.innerHTML = goalScorers.map((gs,idx)=>`<div style="display:flex;gap:8px;margin-bottom:8px;"><select class="goal-scorer-select" data-idx="${idx}" style="flex:2;"><option value="">-- Select Player --</option>${players.map(p=>`<option value="${escapeHtml(p)}" ${gs.player===p?'selected':''}>${escapeHtml(p)}</option>`).join('')}</select><input type="number" class="goal-count" data-idx="${idx}" placeholder="Goals" value="${gs.count||1}" style="flex:1;min-width:70px;"><button class="remove-goal-btn" data-idx="${idx}" style="background:#dc3545;padding:5px 10px;">✖</button></div>`).join('');
            document.querySelectorAll('.goal-scorer-select').forEach(sel=>sel.addEventListener('change',(e)=>{const idx=parseInt(e.target.dataset.idx); if(!isNaN(idx)) goalScorers[idx].player=e.target.value; }));
            document.querySelectorAll('.goal-count').forEach(inp=>inp.addEventListener('change',(e)=>{const idx=parseInt(e.target.dataset.idx); if(!isNaN(idx)) goalScorers[idx].count=parseInt(e.target.value)||1; }));
            document.querySelectorAll('.remove-goal-btn').forEach(btn=>btn.addEventListener('click',(e)=>{const idx=parseInt(btn.dataset.idx); if(!isNaN(idx)){ goalScorers.splice(idx,1); updateGoalScorersUI(); }}));
        }
        
        document.getElementById("addGoalScorerBtn")?.addEventListener("click",()=>{ goalScorers.push({player:'',count:1}); updateGoalScorersUI(); });
        
        reportWeekSelect?.addEventListener("change",(e)=>{
            const selectedWeek = e.target.value;
            if(selectedWeek){
                matchReportForm.style.display="block";
                // Populate MVP dropdown with players from that week's attendance
                const weekParticipants = getAllParticipants(selectedWeek);
                const weekPlayers = [...weekParticipants.players];
                mvpSelect.innerHTML = `<option value="">-- Select MVP --</option>${weekPlayers.map(p=>`<option value="${escapeHtml(p)}">${escapeHtml(p)}</option>`).join('')}`;
                goalScorers = [];
                updateGoalScorersUI();
                // Load existing match data if any
                const existing = matchResults[selectedWeek];
                if(existing){
                    document.getElementById("reportYellowScore").value = existing.yellowScore||0;
                    document.getElementById("reportOrangeScore").value = existing.orangeScore||0;
                    if(existing.goals){
                        goalScorers = Object.entries(existing.goals).map(([player,count])=>({player,count}));
                        updateGoalScorersUI();
                    }
                    if(existing.mvp) mvpSelect.value = existing.mvp;
                } else {
                    document.getElementById("reportYellowScore").value = "";
                    document.getElementById("reportOrangeScore").value = "";
                }
            } else {
                matchReportForm.style.display="none";
            }
        });
        
        document.getElementById("submitMatchReportBtn")?.addEventListener("click",async()=>{
            const weekDate = reportWeekSelect.value;
            if(!weekDate){ alert("Select a match week"); return; }
            const yellowScore = parseInt(document.getElementById("reportYellowScore")?.value)||0;
            const orangeScore = parseInt(document.getElementById("reportOrangeScore")?.value)||0;
            const goals = {};
            for(let gs of goalScorers){
                if(gs.player && gs.count>0){
                    goals[gs.player] = (goals[gs.player]||0) + gs.count;
                }
            }
            const mvp = mvpSelect?.value || "";
            await saveMatchResult(weekDate, yellowScore, orangeScore, goals, mvp);
            alert("Match report saved! Goals and MVP recorded.");
            renderHistoryPage(); renderScoreboardPage();
        });
        
        document.querySelectorAll(".markPaidBtn").forEach(btn=>btn.addEventListener("click",()=>markPayment(btn.dataset.player,btn.dataset.date)));
        document.getElementById("manualAddBtn")?.addEventListener("click",()=>{const p=document.getElementById("manualPlayerSelect")?.value; if(p&&p!=="") adminAddManualAttendance(p);});
        document.getElementById("adminAddGuestBtn")?.addEventListener("click",async()=>{const gn=document.getElementById("adminGuestName")?.value.trim(); if(gn) await addGuest(gn); document.getElementById("adminGuestName").value=""; renderAdminPage();});
        document.querySelectorAll(".remove-guest-btn").forEach(btn=>btn.addEventListener("click",()=>removeGuest(btn.dataset.guest,btn.dataset.date)));
        document.getElementById("autoBalanceBtn")?.addEventListener("click",()=>{
            if(allList.length===0) return;
            const shuffled=[...allList];
            for(let i=shuffled.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[shuffled[i],shuffled[j]]=[shuffled[j],shuffled[i]];}
            const mid=Math.ceil(shuffled.length/2);
            const newAssign={};
            shuffled.slice(0,mid).forEach(p=>{newAssign[p.isGuest?`guest_${p.name}`:p.name]="yellow";});
            shuffled.slice(mid).forEach(p=>{newAssign[p.isGuest?`guest_${p.name}`:p.name]="orange";});
            teamAssignments[gameDate]=newAssign;
            saveTeamAssignments(gameDate,teamAssignments[gameDate]);
            renderAdminPage(); renderTeamsPage();
        });
        document.getElementById("saveTeamsBtn")?.addEventListener("click",async()=>{
            const selects=document.querySelectorAll(".team-select");
            const newAssign={};
            selects.forEach(sel=>{const name=sel.dataset.name, isGuest=sel.dataset.isguest==="true", team=sel.value; if(team) newAssign[isGuest?`guest_${name}`:name]=team;});
            teamAssignments[gameDate]=newAssign;
            await saveTeamAssignments(gameDate,teamAssignments[gameDate]);
            alert("Team assignments saved! Guests are now assigned.");
        });
    }
    
    function initNav() {
        const mods = [{id:"home",name:"🏠 HOME"},{id:"profiles",name:"👤 PROFILES"},{id:"scoreboard",name:"🏆 STATS"},{id:"teamswk",name:"⚽ THIS WEEK"},{id:"history",name:"📖 HISTORY"},{id:"weather",name:"🌤️ WEATHER"},{id:"timer",name:"⏱️ TIMER"},{id:"chat",name:"💬 CHAT"},{id:"rules",name:"📜 RULES"}];
        if(isAdminLoggedIn) mods.push({id:"admin",name:"⚙️ ADMIN"});
        const nav = document.getElementById("topNavBar");
        if(nav) nav.innerHTML = mods.map(m=>`<button class="nav-module" data-module="${m.id}">${m.name}</button>`).join('');
        document.querySelectorAll(".nav-module").forEach(btn=>{
            btn.addEventListener("click",()=>{
                const id = btn.dataset.module;
                document.querySelectorAll(".module-container").forEach(c=>c.classList.remove("active-module"));
                document.getElementById(`module-${id}`)?.classList.add("active-module");
                document.querySelectorAll(".nav-module").forEach(b=>b.classList.remove("active"));
                btn.classList.add("active");
                if(id==="chat") renderChatPage();
                if(id==="timer") renderTimerPage();
            });
        });
        document.querySelector('.nav-module[data-module="home"]')?.click();
    }
    
    async function renderApp() {
        await loadData();
        await fetchWeather();
        const app = document.getElementById("app");
        app.innerHTML = `<div class="header"><div class="logo-icon"><i class="fas fa-futbol"></i></div><h1>MONDAY NIGHT SOCCER</h1><div class="user-row"><i class="fas fa-user-circle"></i> <strong>${currentUser?.role==="admin"?"ADMIN":currentUser?.name||"Player"}</strong> <button id="logoutBtnMain">Exit</button></div></div><div class="top-nav" id="topNavBar"></div><div id="module-home" class="module-container"><div id="homeContainer"></div></div><div id="module-profiles" class="module-container"><div id="page-profiles"></div></div><div id="module-scoreboard" class="module-container"><div id="page-scoreboard"></div></div><div id="module-teamswk" class="module-container"><div id="page-teamswk"></div></div><div id="module-history" class="module-container"><div id="page-history"></div></div><div id="module-weather" class="module-container"><div id="page-weather"></div></div><div id="module-timer" class="module-container"><div id="page-timer"></div></div><div id="module-chat" class="module-container"><div id="page-chat"></div></div><div id="module-rules" class="module-container"><div id="page-rules"></div></div>${isAdminLoggedIn ? `<div id="module-admin" class="module-container"><div id="page-admin"></div></div>` : ''}`;
        document.getElementById("logoutBtnMain").onclick = () => { if(chatUnsubscribe) chatUnsubscribe(); currentUser=null; localStorage.removeItem("soccer_user"); renderLogin(); };
        renderHomePage(); renderProfilesPage(); renderScoreboardPage(); renderTeamsPage(); renderHistoryPage(); renderWeatherPage(); renderTimerPage(); renderChatPage(); renderRulesPage(); if(isAdminLoggedIn) renderAdminPage();
        initNav();
    }
    
    async function renderLogin() {
        await loadData();
        const app = document.getElementById("app");
        app.innerHTML = `<div class="login-box"><div class="login-logo"><i class="fas fa-futbol"></i></div><h2>Monday Night Soccer</h2><p>8pm Kickoff • Clifton Park, Brunswick</p><p style="font-size:12px;color:#64748b;margin-bottom:8px;">Next game: ${getCurrentGameLabel()}</p><select id="playerSelectLogin"><option value="">-- Select Your Name --</option>${players.map(p=>`<option value="${escapeHtml(p)}">${escapeHtml(p)}</option>`).join('')}</select><button id="playerLoginBtn">Enter as Player</button><hr><div style="position:relative;"><input type="password" id="adminPwLogin" placeholder="Admin Password"><i class="fas fa-eye-slash" id="togglePassword" style="position:absolute;right:20px;top:50%;transform:translateY(-50%);cursor:pointer;color:#94a3b8;"></i></div><button id="adminLoginBtn">Admin Login</button><div style="margin-top:12px;font-size:11px;color:#94a3b8;">Admin password: admin123</div></div>`;
        document.getElementById("playerLoginBtn").onclick = () => { const n = document.getElementById("playerSelectLogin")?.value; if(n && n!==""){ currentUser={name:n,role:"player"}; isAdminLoggedIn=false; localStorage.setItem("soccer_user",JSON.stringify(currentUser)); renderApp(); } else alert("Please select your name from the list"); };
        document.getElementById("adminLoginBtn").onclick = () => { const pw = document.getElementById("adminPwLogin")?.value; if(pw==="admin123"){ currentUser={name:"Admin",role:"admin"}; isAdminLoggedIn=true; localStorage.setItem("soccer_user",JSON.stringify(currentUser)); renderApp(); } else alert("Wrong password (hint: admin123)"); };
        const toggleBtn = document.getElementById("togglePassword");
        const pwInput = document.getElementById("adminPwLogin");
        if(toggleBtn && pwInput) {
            toggleBtn.onclick = () => { const type = pwInput.type === "password" ? "text" : "password"; pwInput.type = type; toggleBtn.className = type === "password" ? "fas fa-eye-slash" : "fas fa-eye"; };
        }
    }
    
    const stored = localStorage.getItem("soccer_user");
    if(stored) { try { const u = JSON.parse(stored); if(u.role==="admin"){ isAdminLoggedIn=true; currentUser={name:"Admin",role:"admin"}; } else { currentUser={name:u.name,role:"player"}; } renderApp(); } catch(e){ renderLogin(); } } else { renderLogin(); }
</script>
</body>
</html>
