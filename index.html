<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Monday Night Soccer | The Complete Hub</title>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Merriweather:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <style>
        *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
        body{background:#eef2f5;font-family:'Inter',sans-serif;}
        .app{max-width:500px;margin:0 auto;background:#eef2f5;min-height:100vh;padding-bottom:20px;}
        .header{background:white;padding:14px 20px;text-align:center;border-bottom:1px solid #e2e8f0;position:sticky;top:0;z-index:20;}
        .logo-icon{width:56px;height:56px;background:#1a73e8;border-radius:24px;display:inline-flex;align-items:center;justify-content:center;margin:0 auto 6px;}
        .logo-icon i{font-size:28px;color:white;}
        .header h1{font-size:18px;font-weight:800;color:#1e293b;}
        .user-row{background:#f1f5f9;padding:5px 12px;border-radius:60px;display:inline-flex;align-items:center;gap:8px;margin-top:6px;font-size:12px;}
        .user-row button{background:#dc3545;border:none;padding:4px 12px;border-radius:40px;color:white;font-weight:600;font-size:11px;cursor:pointer;}
        .top-nav{background:white;padding:10px 12px;display:flex;flex-wrap:wrap;justify-content:center;gap:6px;border-bottom:1px solid #e2e8f0;position:sticky;top:86px;z-index:15;}
        .nav-module{background:#f8fafc;border:none;padding:8px 14px;border-radius:60px;font-size:12px;font-weight:600;color:#475569;cursor:pointer;transition:all 0.2s;}
        .nav-module.active{background:#1a73e8;color:white;}
        .module-container{padding:16px;display:none;}
        .module-container.active-module{display:block;}
        .card{background:white;border-radius:24px;padding:18px;margin-bottom:14px;border:1px solid #e2e8f0;box-shadow:0 1px 2px rgba(0,0,0,0.05);}
        .card h2{font-size:17px;font-weight:700;margin-bottom:14px;border-left:4px solid #1a73e8;padding-left:12px;}
        .attendance-card{background:linear-gradient(135deg,#1a73e8,#0d5bbf);color:white;border-radius:28px;padding:24px 20px;text-align:center;margin-bottom:16px;}
        .big-buttons{display:flex;gap:14px;margin:16px 0 12px;}
        .btn-play-big{background:#28a745;flex:1;padding:14px;border-radius:60px;font-weight:800;font-size:17px;border:none;color:white;cursor:pointer;}
        .btn-sit-big{background:#dc3545;flex:1;padding:14px;border-radius:60px;font-weight:800;font-size:17px;border:none;color:white;cursor:pointer;}
        .profile-item{background:#f8fafc;border-radius:20px;margin-bottom:10px;display:flex;align-items:center;gap:12px;padding:14px;}
        .player-avatar-small{width:36px;height:36px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:white;font-weight:600;font-size:14px;margin-right:4px;}
        .guest-tag{background:#d4edda;color:#155724;border-radius:40px;padding:6px 12px;font-size:13px;display:inline-flex;align-items:center;gap:6px;}
        .attendee-tag{display:inline-flex;align-items:center;gap:6px;background:#e2e8f0;padding:6px 12px;border-radius:40px;font-size:13px;margin:4px;}
        .admin-team-item{display:flex;justify-content:space-between;align-items:center;margin:8px 0;background:#f1f5f9;border-radius:60px;padding:8px 16px;flex-wrap:wrap;gap:8px;}
        .goal-row, .assist-row{display:flex;gap:10px;margin-bottom:10px;align-items:center;}
        .goal-row input, .assist-row input{flex:1;padding:10px;border-radius:40px;border:1px solid #e2e8f0;}
        .newspaper-report{background:#fef9e6;border-radius:24px;padding:20px;font-family:'Merriweather',serif;border:1px solid #e9d5a1;margin-top:16px;font-size:13px;white-space:pre-wrap;line-height:1.5;}
        .whatsapp-share{background:#25D366;width:100%;margin-top:12px;}
        .timer-container{background:linear-gradient(135deg,#1e293b,#0f172a);border-radius:28px;padding:20px;text-align:center;}
        .timer-display{font-size:56px;font-weight:800;font-family:monospace;color:#10b981;}
        .timer-controls{display:flex;gap:12px;justify-content:center;margin-top:12px;}
        .chat-bubble{background:#f1f5f9;padding:10px;border-radius:18px;margin-bottom:8px;}
        .flex-btns{display:flex;gap:12px;margin-top:12px;flex-wrap:wrap;}
        .btn-outline{background:white;color:#1a73e8;border:2px solid #1a73e8;}
        .modal{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.5);display:flex;align-items:center;justify-content:center;z-index:1000;}
        .modal-content{background:white;border-radius:32px;padding:24px;max-width:340px;width:90%;}
        .login-logo{width:80px;height:80px;background:linear-gradient(135deg,#1a73e8,#0d5bbf);border-radius:30px;display:inline-flex;align-items:center;justify-content:center;margin:0 auto 20px;}
        select,input{width:100%;padding:12px;border:1.5px solid #e2e8f0;border-radius:60px;margin:8px 0;font-size:14px;}
        button{background:#1a73e8;color:white;border:none;padding:10px 18px;border-radius:60px;font-weight:600;cursor:pointer;}
        .info-bar{background:#e8f0fe;border-radius:16px;padding:10px;font-size:12px;margin-bottom:16px;text-align:center;color:#1a73e8;}
        .team-box{background:#1a1a2e;padding:12px;border-radius:20px;flex:1;}
        .team-yellow{background:#ffc107;color:#2c2c2c;font-weight:800;text-align:center;padding:6px;border-radius:60px;margin-bottom:8px;}
        .team-orange{background:#fd7e14;color:white;font-weight:800;text-align:center;padding:6px;border-radius:60px;margin-bottom:8px;}
        .player-tag{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,0.2);border-radius:40px;padding:4px 10px;font-size:11px;color:white;margin:4px;}
        .team-row{display:flex;gap:12px;flex-wrap:wrap;}
        .weather-card{background:linear-gradient(135deg,#0f2027,#203a43);color:white;border-radius:28px;padding:20px;text-align:center;}
        .loading{text-align:center;padding:40px;color:#64748b;}
    </style>
</head>
<body>
<div class="app" id="app"><div class="loading"><i class="fas fa-spinner fa-spin"></i> Loading Monday Night Soccer...</div></div>

<script>
    // ==================== FIREBASE CONFIG ====================
    const firebaseConfig = {
        apiKey: "AIzaSyCWlFqDJyENgrUOhiLXCjSEi4Mk_54SA1w",
        authDomain: "monday-night-soccer-hub.firebaseapp.com",
        projectId: "monday-night-soccer-hub",
        storageBucket: "monday-night-soccer-hub.firebasestorage.app",
        messagingSenderId: "634335208908",
        appId: "1:634335208908:web:dca705b65fc52de0606969"
    };
    
    let db = null, firebaseReady = false;
    try {
        firebase.initializeApp(firebaseConfig);
        db = firebase.firestore();
        firebaseReady = true;
        console.log("🔥 Firebase connected");
    } catch(e) { console.warn("Firebase error:", e); }
    
    // ==================== PLAYER LIST ====================
    let players = ["Alex Rowe","Ali Mekawy","Carlo","Charlie","Chris Del Monaco","Chris M","Chris S","Danny","Dante","David","Dimitri","Enzo","Farid","Faros","Frank","George B","George T","Ivan","James Zoumis","James","Joe T","Joey","Kia","Leo","Manoli","Marco","Mario","Maurice","Nector","Paul","Perri","Peter","Ralph","Rocco","Stav","Stevan","Theo","Tony EH","Vasilis"].sort();
    
    // ==================== DATA STORES ====================
    let attendance = [];
    let guests = [];
    let teamAssignments = {};
    let matchResults = {};
    let isAdminLoggedIn = false;
    let currentUser = null;
    let chatMessages = [];
    let timerInterval = null;
    let currentHalf = 1;
    let timeLeft = 45 * 60;
    let liveWeather = { temp: "18°C", condition: "Clear", icon: "fa-sun", rainChance: 10, wind: "12 km/h", humidity: "65%" };
    
    // ==================== DATE UTILITIES ====================
    function getNextMondayGame() {
        const now = new Date();
        const utc = now.getTime() + (now.getTimezoneOffset() * 60000);
        const aestNow = new Date(utc + (11 * 3600000)); // AEDT/AEST Melbourne
        const day = aestNow.getDay(), hour = aestNow.getHours();
        let daysUntilMonday;
        if (day === 1 && hour >= 20) daysUntilMonday = 7;
        else if (day === 1) daysUntilMonday = 0;
        else if (day === 0) daysUntilMonday = 1;
        else daysUntilMonday = (8 - day) % 7;
        const nextMonday = new Date(aestNow);
        nextMonday.setDate(aestNow.getDate() + daysUntilMonday);
        nextMonday.setHours(20, 0, 0, 0);
        return nextMonday;
    }
    
    function getCurrentGameWeekStr() {
        return getNextMondayGame().toISOString().split('T')[0];
    }
    
    function getCurrentGameLabel() {
        const m = getNextMondayGame();
        return `Mon ${m.toLocaleDateString('en-AU', {day:'numeric', month:'short', year:'numeric'})}`;
    }
    
    // Generate all Monday dates for the year (past 52 weeks)
    function getAllGameWeeks() {
        const weeks = [];
        const today = new Date();
        for (let i = -52; i <= 4; i++) {
            const monday = new Date(getNextMondayGame());
            monday.setDate(monday.getDate() + (i * 7));
            if (monday.getFullYear() >= 2023 && monday.getFullYear() <= 2026) {
                weeks.push({
                    dateStr: monday.toISOString().split('T')[0],
                    label: `Mon ${monday.toLocaleDateString('en-AU', {day:'numeric', month:'short', year:'numeric'})}`
                });
            }
        }
        return weeks.sort((a,b) => b.dateStr.localeCompare(a.dateStr));
    }
    
    const ALL_WEEKS = getAllGameWeeks();
    const CURRENT_GAME_STR = getCurrentGameWeekStr();
    
    function getAllParticipants(gameDate) {
        const playersIn = attendance.filter(a => a.gameDate === gameDate && a.status === 'in').map(a => a.player);
        const guestsIn = guests.filter(g => g.gameDate === gameDate).map(g => ({ name: g.guestName, isGuest: true }));
        return { players: playersIn, guests: guestsIn };
    }
    
    // ==================== BOM WEATHER (Melbourne - Clifton Park) ====================
    async function fetchWeatherForGame() {
        try {
            const targetDate = getNextMondayGame();
            const year = targetDate.getFullYear();
            const month = String(targetDate.getMonth() + 1).padStart(2, '0');
            const day = String(targetDate.getDate()).padStart(2, '0');
            const dateStr = `${year}-${month}-${day}`;
            
            // Using Open-Meteo (BOM-compatible data) for Melbourne (Clifton Park area: -37.77, 144.97)
            const url = `https://api.open-meteo.com/v1/forecast?latitude=-37.77&longitude=144.97&hourly=temperature_2m,relativehumidity_2m,precipitation_probability,weathercode,windspeed_10m&timezone=Australia/Melbourne&forecast_days=7`;
            const response = await fetch(url);
            const data = await response.json();
            
            // Find the 8pm forecast for the target date
            for (let i = 0; i < data.hourly.time.length; i++) {
                const timeStr = data.hourly.time[i];
                if (timeStr.startsWith(dateStr) && timeStr.includes('T20:00')) {
                    const temp = Math.round(data.hourly.temperature_2m[i]);
                    const humidity = data.hourly.relativehumidity_2m[i];
                    const rainChance = data.hourly.precipitation_probability[i];
                    const windSpeed = data.hourly.windspeed_10m[i];
                    const weatherCode = data.hourly.weathercode[i];
                    
                    let condition = "Clear", icon = "fa-sun";
                    if (weatherCode === 0) { condition = "Clear sky"; icon = "fa-sun"; }
                    else if (weatherCode === 1 || weatherCode === 2) { condition = "Partly cloudy"; icon = "fa-cloud-sun"; }
                    else if (weatherCode === 3) { condition = "Overcast"; icon = "fa-cloud"; }
                    else if (weatherCode >= 51 && weatherCode <= 67) { condition = "Light rain"; icon = "fa-cloud-rain"; }
                    else if (weatherCode >= 80 && weatherCode <= 99) { condition = "Rain / storm"; icon = "fa-cloud-bolt"; }
                    
                    liveWeather = {
                        temp: `${temp}°C`,
                        condition: condition,
                        icon: icon,
                        rainChance: rainChance || 0,
                        wind: `${Math.round(windSpeed)} km/h`,
                        humidity: `${humidity || 65}%`
                    };
                    break;
                }
            }
        } catch(e) { console.warn("Weather fetch failed:", e); }
        renderWeatherPage();
    }
    
    // ==================== FIREBASE OPERATIONS ====================
    async function loadAllData() {
        if (!firebaseReady || !db) return;
        try {
            const [attendanceSnap, guestsSnap, teamsSnap, resultsSnap] = await Promise.all([
                db.collection("attendance").get(),
                db.collection("guests").get(),
                db.collection("teamAssignments").get(),
                db.collection("matchResults").get()
            ]);
            attendance = attendanceSnap.docs.map(d => d.data());
            guests = guestsSnap.docs.map(d => d.data());
            teamAssignments = {};
            teamsSnap.docs.forEach(doc => { teamAssignments[doc.id] = doc.data(); });
            matchResults = {};
            resultsSnap.docs.forEach(doc => { matchResults[doc.id] = doc.data(); });
            console.log(`Loaded: ${attendance.length} records`);
            refreshAll();
        } catch(e) { console.error("Load error:", e); }
    }
    
    async function saveAttendance(player, gameDate, status) {
        if (!firebaseReady || !db) return;
        await db.collection("attendance").doc(`${player}_${gameDate}`).set({ player, gameDate, status, timestamp: Date.now() });
        await loadAllData();
    }
    
    async function saveGuest(guestName, gameDate, addedBy) {
        if (!firebaseReady || !db) return;
        await db.collection("guests").doc(`${guestName}_${gameDate}`).set({ guestName, gameDate, addedBy, timestamp: Date.now() });
        await loadAllData();
    }
    
    async function saveTeamAssignments(gameDate, assignments) {
        if (!firebaseReady || !db) return;
        await db.collection("teamAssignments").doc(gameDate).set(assignments);
        await loadAllData();
    }
    
    async function saveMatchResult(gameDate, result) {
        if (!firebaseReady || !db) return;
        await db.collection("matchResults").doc(gameDate).set(result);
        await loadAllData();
    }
    
    // ==================== SEED HISTORICAL DATA ====================
    async function seedHistoricalData() {
        if (!firebaseReady || !db) return;
        const historicalMatches = [
            { date: "2025-03-24", yellow: 3, orange: 2, mvp: "Carlo", goals: {"Carlo":2, "Danny":1}, assists: {"Mario":1, "Frank":1}, injuries: [] },
            { date: "2025-03-17", yellow: 1, orange: 1, mvp: "Chris M", goals: {"Alex Rowe":1, "Stevan":1}, assists: {}, injuries: ["Dante (cramp)"] },
            { date: "2025-03-10", yellow: 4, orange: 1, mvp: "Carlo", goals: {"Carlo":3, "James":1}, assists: {"Mario":2, "Frank":1}, injuries: [] },
            { date: "2025-03-03", yellow: 2, orange: 3, mvp: "Vasilis", goals: {"Marco":2, "Vasilis":2, "Danny":1}, assists: {"Paul":1, "Peter":1}, injuries: ["George T (ankle)"] },
            { date: "2025-02-24", yellow: 0, orange: 0, mvp: "Rocco", goals: {}, assists: {}, injuries: [] }
        ];
        for (const match of historicalMatches) {
            const existing = matchResults[match.date];
            if (!existing) {
                await saveMatchResult(match.date, {
                    yellowScore: match.yellow,
                    orangeScore: match.orange,
                    goals: match.goals,
                    assists: match.assists,
                    mvp: match.mvp,
                    injuries: match.injuries,
                    timestamp: Date.now()
                });
                console.log(`Seeded match for ${match.date}`);
            }
        }
        await loadAllData();
    }
    
    // ==================== UI HELPERS ====================
    function escapeHtml(s) { return String(s).replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'})[m]); }
    function getInitials(n) { return n.split(' ').map(x=>x[0]).join('').toUpperCase().substring(0,2); }
    function getAvatarColor(n) { const c=['#1a73e8','#28a745','#dc3545','#fd7e14','#6f42c1','#20c997']; let h=0; for(let i=0;i<n.length;i++) h=((h<<5)-h)+n.charCodeAt(i); return c[Math.abs(h)%c.length]; }
    function renderMiniAvatar(n,s=28) { return `<div class="player-avatar-small" style="background:${getAvatarColor(n)};width:${s}px;height:${s}px;display:inline-flex;align-items:center;justify-content:center;">${getInitials(n)}</div>`; }
    function formatTime(s) { return `${Math.floor(s/60).toString().padStart(2,'0')}:${(s%60).toString().padStart(2,'0')}`; }
    
    // Timer functions
    function playAlarm() { try { const ctx = new (window.AudioContext || window.webkitAudioContext)(); const o = ctx.createOscillator(), g = ctx.createGain(); o.connect(g); g.connect(ctx.destination); o.frequency.value = 880; g.gain.value = 0.3; o.start(); g.gain.exponentialRampToValueAtTime(0.00001, ctx.currentTime + 1.5); o.stop(ctx.currentTime + 1.5); } catch(e){} }
    function updateTimerDisplay() { let d = document.getElementById("timerDisplay"); if(d) d.textContent = formatTime(timeLeft); let hs = document.getElementById("currentHalf"); if(hs) hs.textContent = currentHalf === 1 ? "FIRST HALF" : "SECOND HALF"; }
    function timerTick() { if(timeLeft <= 0) { if(timerInterval) clearInterval(timerInterval); playAlarm(); if(currentHalf === 1) { alert("🔔 HALF TIME! Click OK to start second half."); currentHalf = 2; timeLeft = 45 * 60; updateTimerDisplay(); startTimer(); } else { alert("🔔 FULL TIME! Match ended."); timerInterval = null; } return; } timeLeft--; updateTimerDisplay(); }
    function startTimer() { if(timerInterval) clearInterval(timerInterval); timerInterval = setInterval(timerTick, 1000); }
    function pauseTimer() { if(timerInterval) { clearInterval(timerInterval); timerInterval = null; } }
    function resetTimer() { pauseTimer(); currentHalf = 1; timeLeft = 45 * 60; updateTimerDisplay(); }
    
    // ==================== NEWSPAPER REPORT ====================
    const pundits = [
        { name: "Ned Zelic", quote: "The transition play was breathtaking! Pure poetry on the pitch tonight." },
        { name: "Craig Foster", quote: "This is what Monday night football is all about. Passion and commitment at every turn." },
        { name: "Lucy Zelic", quote: "Unbelievable drama under the lights! Clifton Park was absolutely electric!" },
        { name: "Mark Bosnich", quote: "The goalkeeper was a human wall tonight. Those reflex saves changed the game completely." },
        { name: "Tara Rushton", quote: "Clifton Park was ROCKING! You could feel the intensity from the very first whistle." }
    ];
    const funFacts = ["🎲 Record attendance for the season!", "🚀 Longest shot of the year!", "📸 The woodwork was rattled twice!", "🎉 Celebration of the season contender!", "💨 Fastest sprint recorded on GPS!"];
    
    function generateNewspaperReport(weekLabel, yellowScore, orangeScore, goals, assists, mvp, injuries, weather) {
        const winner = yellowScore > orangeScore ? "YELLOW" : (orangeScore > yellowScore ? "ORANGE" : "DRAW");
        const winnerEmoji = yellowScore > orangeScore ? "🟡" : (orangeScore > yellowScore ? "🟠" : "🤝");
        let goalText = Object.entries(goals).map(([p,c]) => `⚽ ${p} — ${c} goal${c>1?'s':''}`).join('\n') || "⚽ No goals scored";
        let assistText = Object.entries(assists).map(([p,c]) => `🎯 ${p} — ${c} assist${c>1?'s':''}`).join('\n') || "🎯 No assists recorded";
        let injuryText = injuries?.length ? injuries.map(i => `🔸 ${i}`).join('\n') : "🔸 Clean bill of health";
        const randomPundits = [...pundits].sort(() => 0.5 - Math.random()).slice(0, 3);
        const randomFact = funFacts[Math.floor(Math.random() * funFacts.length)];
        
        return `📰 *THE MONDAY NIGHT TELEGRAPH* 📰
📍 *CLIFTON PARK, BRUNSWICK* | ${weekLabel}
🌦️ KICKOFF WEATHER: ${weather.temp}, ${weather.condition} (Wind: ${weather.wind})
━━━━━━━━━━━━━━━━━━━━━━━

🎙️ *MATCH REPORT*
A ${yellowScore === orangeScore ? 'tense stalemate' : 'thrilling contest'} unfolded under the Melbourne night sky.

📊 *FINAL SCORE*
🟡 YELLOW ${yellowScore} — ${orangeScore} 🟠
🏆 WINNER: ${winnerEmoji} ${winner}

⚽ *GOAL SCORERS*
${goalText}

🎯 *ASSISTS*
${assistText}

⭐ *MAN OF THE MATCH*
🏅 ${mvp || "The Squad"}

🩺 *INJURY WATCH*
${injuryText}

━━━━━━━━━━━━━━━━━━━━━━━
🎙️ *EXPERT ANALYSIS*

🗣️ *${randomPundits[0].name}*: "${randomPundits[0].quote}"
🗣️ *${randomPundits[1].name}*: "${randomPundits[1].quote}"
🗣️ *${randomPundits[2].name}*: "${randomPundits[2].quote}"

✨ *FUN CORNER*
${randomFact}

📅 *NEXT WEEK*: Monday 8pm sharp at Clifton Park!

#MondayNightSoccer #CliftonPark #MelbourneFootball`;
    }
    
    // ==================== RENDER PAGES ====================
    function refreshAll() { renderHomePage(); renderTeamsPage(); renderHistoryPage(); renderProfilesPage(); renderScoreboardPage(); renderTimerPage(); renderChatPage(); renderRulesPage(); if(isAdminLoggedIn) renderAdminPage(); fetchWeatherForGame(); }
    
    function renderHomePage() {
        const c = document.getElementById("homeContainer");
        if (!c) return;
        const gl = getCurrentGameLabel();
        const parts = getAllParticipants(CURRENT_GAME_STR);
        const status = attendance.find(a => a.gameDate === CURRENT_GAME_STR && a.player === currentUser?.name)?.status;
        c.innerHTML = `<div class="info-bar"><i class="fas fa-calendar-alt"></i> Next Match: ${gl} • 8pm Clifton Park</div>
        <div class="attendance-card"><h2>${gl} • 8pm</h2><div>Clifton Park, Brunswick</div>
        <div class="big-buttons"><button id="homePlayBtn" class="btn-play-big">✅ I'M PLAYING</button><button id="homeSitBtn" class="btn-sit-big">❌ CAN'T PLAY</button></div>
        <div>${status === 'in' ? '✓ You are PLAYING' : (status === 'out' ? '✗ You are NOT PLAYING' : 'Tap above to set attendance')}</div></div>
        <div class="card"><div>🟢 Players (${parts.players.length})</div><div>${parts.players.map(p => `<span class="attendee-tag">${renderMiniAvatar(p)} ${escapeHtml(p)}</span>`).join('') || 'None'}</div></div>
        <div class="card"><div>🎭 Guests (${parts.guests.length})</div><div>${parts.guests.map(g => `<span class="guest-tag">${escapeHtml(g.name)}</span>`).join('') || 'None'}</div>
        <div><input id="guestNameInput" placeholder="Guest name"><button id="addGuestBtnPlayer" style="width:100%;margin-top:8px;">➕ Bring a Guest</button></div></div>`;
        document.getElementById("homePlayBtn")?.addEventListener("click", () => saveAttendance(currentUser?.name, CURRENT_GAME_STR, "in"));
        document.getElementById("homeSitBtn")?.addEventListener("click", () => saveAttendance(currentUser?.name, CURRENT_GAME_STR, "out"));
        document.getElementById("addGuestBtnPlayer")?.addEventListener("click", () => { const gn = document.getElementById("guestNameInput")?.value.trim(); if(gn && currentUser) saveGuest(gn, CURRENT_GAME_STR, currentUser.name); });
    }
    
    function renderTeamsPage() {
        const c = document.getElementById("page-teamswk");
        if (!c) return;
        const parts = getAllParticipants(CURRENT_GAME_STR);
        const allPlayers = [...parts.players, ...parts.guests.map(g => g.name)];
        const assign = teamAssignments[CURRENT_GAME_STR] || {};
        const yellow = allPlayers.filter(p => assign[p] === "yellow");
        const orange = allPlayers.filter(p => assign[p] === "orange");
        c.innerHTML = `<div class="card"><div class="team-row"><div class="team-box"><div class="team-yellow">🟡 YELLOW (${yellow.length})</div><div>${yellow.map(p => `<div class="player-tag">${renderMiniAvatar(p)} ${escapeHtml(p)}</div>`).join('') || '—'}</div></div>
        <div class="team-box"><div class="team-orange">🟠 ORANGE (${orange.length})</div><div>${orange.map(p => `<div class="player-tag">${renderMiniAvatar(p)} ${escapeHtml(p)}</div>`).join('') || '—'}</div></div></div></div>`;
    }
    
    function renderHistoryPage() {
        const c = document.getElementById("page-history");
        if (!c) return;
        let historyHtml = `<div class="card"><h2>📖 Match History (Firebase)</h2></div>`;
        const sortedWeeks = [...ALL_WEEKS].filter(w => matchResults[w.dateStr]);
        for (let week of sortedWeeks.slice(0, 20)) {
            const m = matchResults[week.dateStr];
            historyHtml += `<div class="card"><div><strong>${week.label}</strong> 🟡 ${m.yellowScore} - ${m.orangeScore} 🟠</div>
            <div>⚽ ${Object.entries(m.goals || {}).map(([p,c]) => `${p}(${c})`).join(', ') || 'none'}</div>
            <div>🏆 MVP: ${m.mvp || '-'}</div></div>`;
        }
        c.innerHTML = historyHtml;
    }
    
    function renderProfilesPage() {
        const c = document.getElementById("page-profiles");
        if (!c) return;
        let h = `<div class="card"><h2>👤 Player Profiles</h2>`;
        for (let p of players.slice(0, 20)) h += `<div class="profile-item">${renderMiniAvatar(p,40)}<div><strong>${escapeHtml(p)}</strong></div></div>`;
        c.innerHTML = h + `</div>`;
    }
    
    function renderScoreboardPage() {
        const c = document.getElementById("page-scoreboard");
        if (!c) return;
        let stats = {}; players.forEach(p => stats[p] = 0);
        Object.values(matchResults).forEach(m => { if(m.goals) Object.entries(m.goals).forEach(([p,c]) => { if(stats[p] !== undefined) stats[p] += c; }); });
        const topScorers = Object.entries(stats).sort((a,b) => b[1] - a[1]).slice(0, 10);
        c.innerHTML = `<div class="card"><h2>🏆 All-Time Top Scorers</h2>${topScorers.map(([name, goals], i) => `<div class="admin-team-item"><span>${i+1}. ${renderMiniAvatar(name)} ${escapeHtml(name)}</span><span>⚽ ${goals}</span></div>`).join('')}</div>`;
    }
    
    function renderTimerPage() { const c = document.getElementById("page-timer"); if(c) c.innerHTML = `<div class="timer-container"><div class="timer-display" id="timerDisplay">45:00</div><div class="timer-controls"><button id="timerStartBtn">Start</button><button id="timerPauseBtn">Pause</button><button id="timerResetBtn">Reset</button></div><div>Half: <span id="currentHalf">FIRST HALF</span></div></div>`; updateTimerDisplay(); document.getElementById("timerStartBtn")?.addEventListener("click",startTimer); document.getElementById("timerPauseBtn")?.addEventListener("click",pauseTimer); document.getElementById("timerResetBtn")?.addEventListener("click",resetTimer); }
    function renderChatPage() { const c = document.getElementById("page-chat"); if(c) c.innerHTML = `<div class="card"><h2>💬 Team Chat</h2><div id="chatMessagesList" style="height:300px;overflow-y:auto;background:#f8fafc;border-radius:20px;padding:12px;"></div><div style="display:flex;gap:8px;"><input id="chatInput" placeholder="Type message..."><button id="chatSendBtn">Send</button></div></div>`; const msgDiv = document.getElementById("chatMessagesList"); if(msgDiv) msgDiv.innerHTML = chatMessages.map(m => `<div class="chat-bubble"><strong>${escapeHtml(m.name)}</strong><br>${escapeHtml(m.text)}</div>`).join(''); document.getElementById("chatSendBtn")?.addEventListener("click", () => { const inp = document.getElementById("chatInput"); if(inp?.value.trim() && currentUser){ chatMessages.push({name:currentUser.name, text:inp.value.trim()}); renderChatPage(); inp.value=""; } }); }
    function renderWeatherPage() { const c = document.getElementById("page-weather"); if(c) c.innerHTML = `<div class="card"><h2>🌤️ BOM Forecast • ${getCurrentGameLabel()} 8pm</h2><div class="weather-card"><i class="fas ${liveWeather.icon}" style="font-size:56px;"></i><h3>${liveWeather.condition}</h3><h1 style="font-size:52px;">${liveWeather.temp}</h1><p>🌧️ Rain: ${liveWeather.rainChance}% | 💨 Wind: ${liveWeather.wind} | 💧 Humidity: ${liveWeather.humidity}</p><p style="margin-top:8px;">📍 Clifton Park, Brunswick</p></div></div>`; }
    function renderRulesPage() { const c = document.getElementById("page-rules"); if(c) c.innerHTML = `<div class="card"><h2>📜 League Rules</h2><ul style="margin-left:20px;"><li>⚡ 8pm SHARP at Clifton Park</li><li>✅ RSVP before Sunday</li><li>🎭 Guests welcome (must sign waiver)</li><li>📰 Match reports saved to Firebase</li><li>🌙 Games played under lights</li></ul></div>`; }
    
    // ==================== ADMIN PAGE ====================
    function renderAdminPage() {
        const container = document.getElementById("page-admin");
        if (!container) return;
        if (!isAdminLoggedIn) {
            container.innerHTML = `<div class="card"><h2>🔒 Admin Access</h2><button id="adminLoginBtn">Login as Admin</button></div>`;
            document.getElementById("adminLoginBtn")?.addEventListener("click", () => { const pw = prompt("Enter admin password:"); if(pw === "admin123") { isAdminLoggedIn = true; renderAdminPage(); refreshAll(); } else alert("Wrong password!"); });
            return;
        }
        let adminGoals = [], adminAssists = [];
        container.innerHTML = `<div class="info-bar">🔐 ADMIN MODE • Firebase Active</div>
        <div class="card"><h2>📅 Select Match Week</h2><select id="adminWeekSelect">${ALL_WEEKS.map(w => `<option value="${w.dateStr}" ${w.dateStr === CURRENT_GAME_STR ? 'selected' : ''}>${w.label}</option>`).join('')}</select></div>
        <div class="card"><h2>⚽ Assign Teams</h2><div id="adminTeamsList"></div><button id="adminSaveTeamsBtn">💾 Save Teams</button></div>
        <div class="card"><h2>📰 Generate Report</h2><input id="adminReportWeekLabel" placeholder="Week label"><div style="display:flex;gap:12px;"><div style="flex:1"><label>🟡 Yellow</label><input type="number" id="adminYellowScore" value="0"></div><div style="flex:1"><label>🟠 Orange</label><input type="number" id="adminOrangeScore" value="0"></div></div>
        <div><label>⚽ Goals</label><div id="adminGoalsList"></div><button id="adminAddGoalBtn" style="background:#28a745;">+ Add Goal</button></div>
        <div><label>🎯 Assists</label><div id="adminAssistsList"></div><button id="adminAddAssistBtn" style="background:#28a745;">+ Add Assist</button></div>
        <div><label>🏆 MVP</label><input id="adminMVP"></div><div><label>🩺 Injuries</label><input id="adminInjuries"></div>
        <button id="adminGenerateReportBtn" style="background:#b45309;">📰 GENERATE & SAVE</button>
        <div id="adminReportPreview" class="newspaper-report" style="display:none;"></div>
        <button id="adminWhatsappBtn" class="whatsapp-share" style="display:none;"><i class="fab fa-whatsapp"></i> Share to WhatsApp</button></div>`;
        
        function loadTeamsForWeek(weekDate) {
            const assign = teamAssignments[weekDate] || {};
            const parts = getAllParticipants(weekDate);
            const allPlayers = [...parts.players, ...parts.guests.map(g => g.name)];
            const teamsDiv = document.getElementById("adminTeamsList");
            if (teamsDiv) teamsDiv.innerHTML = allPlayers.map(p => `<div class="admin-team-item"><div>${renderMiniAvatar(p)} ${escapeHtml(p)}</div><select class="team-assign" data-player="${escapeHtml(p)}"><option value="">— Team —</option><option value="yellow" ${assign[p]==="yellow" ? "selected" : ""}>🟡 Yellow</option><option value="orange" ${assign[p]==="orange" ? "selected" : ""}>🟠 Orange</option></select></div>`).join('');
            document.getElementById("adminSaveTeamsBtn")?.addEventListener("click", async () => { const newAssign = {}; document.querySelectorAll(".team-assign").forEach(sel => { const player = sel.dataset.player; const team = sel.value; if(team && player) newAssign[player] = team; }); await saveTeamAssignments(weekDate, newAssign); alert("Teams saved!"); });
        }
        
        function renderGoals() { const div = document.getElementById("adminGoalsList"); if(div) div.innerHTML = adminGoals.map((g, idx) => `<div class="goal-row"><input placeholder="Player" value="${escapeHtml(g.player)}" data-idx="${idx}" class="goal-player"><input type="number" placeholder="Goals" value="${g.count}" data-cidx="${idx}" style="width:80px;"><button onclick="window.removeGoal(${idx})">✖</button></div>`).join(''); document.querySelectorAll('.goal-player').forEach(inp => inp.addEventListener('change', (e) => { const idx = e.target.dataset.idx; if(adminGoals[idx]) adminGoals[idx].player = e.target.value; })); }
        function renderAssists() { const div = document.getElementById("adminAssistsList"); if(div) div.innerHTML = adminAssists.map((a, idx) => `<div class="assist-row"><input placeholder="Player" value="${escapeHtml(a.player)}" data-idx="${idx}" class="assist-player"><input type="number" placeholder="Assists" value="${a.count}" data-cidx="${idx}" style="width:80px;"><button onclick="window.removeAssist(${idx})">✖</button></div>`).join(''); document.querySelectorAll('.assist-player').forEach(inp => inp.addEventListener('change', (e) => { const idx = e.target.dataset.idx; if(adminAssists[idx]) adminAssists[idx].player = e.target.value; })); }
        window.removeGoal = (idx) => { adminGoals.splice(idx,1); renderGoals(); };
        window.removeAssist = (idx) => { adminAssists.splice(idx,1); renderAssists(); };
        
        document.getElementById("adminAddGoalBtn")?.addEventListener("click", () => { adminGoals.push({player:'',count:1}); renderGoals(); });
        document.getElementById("adminAddAssistBtn")?.addEventListener("click", () => { adminAssists.push({player:'',count:1}); renderAssists(); });
        document.getElementById("adminWeekSelect")?.addEventListener("change", (e) => { const week = e.target.value; loadTeamsForWeek(week); const existing = matchResults[week]; if(existing) { document.getElementById("adminYellowScore").value = existing.yellowScore||0; document.getElementById("adminOrangeScore").value = existing.orangeScore||0; document.getElementById("adminMVP").value = existing.mvp||''; document.getElementById("adminInjuries").value = (existing.injuries||[]).join(', '); adminGoals = Object.entries(existing.goals||{}).map(([p,c])=>({player:p,count:c})); adminAssists = Object.entries(existing.assists||{}).map(([p,c])=>({player:p,count:c})); renderGoals(); renderAssists(); } else { adminGoals = []; adminAssists = []; renderGoals(); renderAssists(); } document.getElementById("adminReportWeekLabel").value = ALL_WEEKS.find(w=>w.dateStr===week)?.label||week; });
        document.getElementById("adminGenerateReportBtn")?.addEventListener("click", async () => { const weekDate = document.getElementById("adminWeekSelect").value; if(!weekDate) { alert("Select a week!"); return; } const weekLabel = document.getElementById("adminReportWeekLabel").value || weekDate; const yellow = parseInt(document.getElementById("adminYellowScore").value)||0; const orange = parseInt(document.getElementById("adminOrangeScore").value)||0; const mvp = document.getElementById("adminMVP").value; const injuries = document.getElementById("adminInjuries").value.split(',').map(i=>i.trim()).filter(i=>i); const goals = {}; adminGoals.forEach(g => { if(g.player && g.count>0) goals[g.player] = (goals[g.player]||0) + g.count; }); const assists = {}; adminAssists.forEach(a => { if(a.player && a.count>0) assists[a.player] = (assists[a.player]||0) + a.count; }); const report = generateNewspaperReport(weekLabel, yellow, orange, goals, assists, mvp, injuries, liveWeather); await saveMatchResult(weekDate, { yellowScore:yellow, orangeScore:orange, goals, assists, mvp, injuries, timestamp:Date.now() }); const preview = document.getElementById("adminReportPreview"); if(preview) { preview.innerHTML = report.replace(/\n/g,'<br>'); preview.style.display = "block"; } const whatsappBtn = document.getElementById("adminWhatsappBtn"); if(whatsappBtn) { whatsappBtn.style.display = "block"; whatsappBtn.onclick = () => window.open(`https://wa.me/?text=${encodeURIComponent(report)}`,'_blank'); } alert("Report saved to Firebase!"); renderHistoryPage(); renderScoreboardPage(); });
        loadTeamsForWeek(CURRENT_GAME_STR); renderGoals(); renderAssists();
    }
    
    // ==================== LOGIN ====================
    function showLoginModal() {
        const modal = document.createElement('div'); modal.className = 'modal';
        modal.innerHTML = `<div class="modal-content"><div class="login-logo"><i class="fas fa-futbol fa-3x"></i></div><h3>Monday Night Soccer</h3><select id="loginNameSelect"><option value="">Select your name</option>${players.map(p => `<option value="${escapeHtml(p)}">${escapeHtml(p)}</option>`).join('')}</select><button id="loginBtn">Login</button><div style="margin-top:12px;"><button id="adminSwitchBtn" class="btn-outline" style="width:100%;">🔐 Admin Access</button></div></div>`;
        document.body.appendChild(modal);
        document.getElementById("loginBtn").onclick = () => { const sel = document.getElementById("loginNameSelect"); const name = sel?.value; if(name && players.includes(name)){ currentUser = {name}; isAdminLoggedIn = false; modal.remove(); document.getElementById("userNameDisplay").innerText = name; document.getElementById("logoutBtn").style.display = "inline-block"; refreshAll(); } else alert("Select your name"); };
        document.getElementById("adminSwitchBtn").onclick = () => { const pw = prompt("Admin password:"); if(pw === "admin123"){ isAdminLoggedIn = true; currentUser = {name:"Admin"}; document.getElementById("userNameDisplay").innerText = "Admin"; document.getElementById("logoutBtn").style.display = "inline-block"; modal.remove(); refreshAll(); renderAdminPage(); } else alert("Wrong password"); };
    }
    function logout(){ currentUser = null; isAdminLoggedIn = false; document.getElementById("userNameDisplay").innerText = "Not logged in"; document.getElementById("logoutBtn").style.display = "none"; showLoginModal(); refreshAll(); }
    
    // ==================== INIT ====================
    async function initApp() {
        const appDiv = document.getElementById("app");
        appDiv.innerHTML = `<div class="header"><div class="logo-icon"><i class="fas fa-futbol"></i></div><h1>MONDAY NIGHT SOCCER</h1><div class="user-row"><span id="userNameDisplay">Not logged in</span><button id="logoutBtn" style="display:none;">Logout</button></div></div>
        <div class="top-nav"><button class="nav-module active" data-module="home">🏠 Home</button><button class="nav-module" data-module="teamswk">⚽ Teams</button><button class="nav-module" data-module="history">📖 History</button><button class="nav-module" data-module="scoreboard">🏆 Stats</button><button class="nav-module" data-module="profiles">👤 Profiles</button><button class="nav-module" data-module="timer">⏱️ Timer</button><button class="nav-module" data-module="chat">💬 Chat</button><button class="nav-module" data-module="weather">🌤️ Weather</button><button class="nav-module" data-module="rules">📜 Rules</button><button class="nav-module" data-module="admin">🔧 Admin</button></div>
        <div id="homeContainer" class="module-container active-module"></div><div id="page-teamswk" class="module-container"></div><div id="page-history" class="module-container"></div><div id="page-scoreboard" class="module-container"></div><div id="page-profiles" class="module-container"></div><div id="page-timer" class="module-container"></div><div id="page-chat" class="module-container"></div><div id="page-weather" class="module-container"></div><div id="page-rules" class="module-container"></div><div id="page-admin" class="module-container"></div>`;
        document.querySelectorAll(".nav-module").forEach(btn => btn.addEventListener("click", () => { document.querySelectorAll(".nav-module").forEach(b => b.classList.remove("active")); btn.classList.add("active"); const mod = btn.dataset.module; document.querySelectorAll(".module-container").forEach(c => c.classList.remove("active-module")); if(mod === "home") document.getElementById("homeContainer").classList.add("active-module"); else document.getElementById(`page-${mod}`).classList.add("active-module"); if(mod === "chat") renderChatPage(); if(mod === "timer") renderTimerPage(); }));
        document.getElementById("logoutBtn").onclick = logout;
        if (firebaseReady) { await loadAllData(); await seedHistoricalData(); showLoginModal(); fetchWeatherForGame(); }
        else { showLoginModal(); refreshAll(); }
    }
    initApp();
</script>
</body>
</html>
