<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Members Lounge | Live Staff Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', system-ui, sans-serif; }
        .calendar-day { transition: all 0.2s; }
        .calendar-day:hover { transform: scale(1.05); }
    </style>
</head>
<body class="bg-zinc-50 dark:bg-zinc-950 text-zinc-900 dark:text-zinc-100 min-h-screen">

<!-- LOGIN (unchanged) -->
<div id="loginOverlay" class="fixed inset-0 bg-black/90 flex items-center justify-center z-50">
    <div class="bg-white dark:bg-zinc-900 rounded-3xl p-10 w-full max-w-md mx-4 text-center">
        <img src="https://via.placeholder.com/280x110/1f2937/ffffff?text=MEMBERS+LOUNGE" alt="Logo" class="mx-auto mb-6 rounded-2xl">
        <h1 class="text-3xl font-bold">Staff Portal</h1>
        <input type="text" id="loginUsername" placeholder="Username" class="w-full mt-8 bg-zinc-100 dark:bg-zinc-800 border border-zinc-300 dark:border-zinc-700 rounded-2xl px-5 py-4 mb-4">
        <input type="password" id="loginPassword" placeholder="Password" class="w-full bg-zinc-100 dark:bg-zinc-800 border border-zinc-300 dark:border-zinc-700 rounded-2xl px-5 py-4 mb-6">
        <button onclick="attemptLogin()" class="w-full bg-blue-600 hover:bg-blue-700 py-4 rounded-2xl font-semibold text-white">Login</button>
        <div id="loginError" class="text-red-500 text-center mt-4"></div>
    </div>
</div>

<div id="mainApp" class="hidden max-w-7xl mx-auto p-4 md:p-6">
    <div class="flex justify-between items-center mb-8">
        <div class="flex items-center gap-4">
            <img src="https://via.placeholder.com/240x80/1f2937/ffffff?text=MEMBERS+LOUNGE" alt="Logo" class="h-12 rounded-xl">
            <h1 class="text-2xl font-bold">Members Lounge</h1>
        </div>
        <div class="flex items-center gap-4">
            <a href="https://app.tickettailor.com/event" target="_blank" class="bg-blue-600 text-white px-5 py-3 rounded-2xl flex items-center gap-2">Ticket Tailor</a>
            <button onclick="toggleTheme()" class="p-3 bg-zinc-200 dark:bg-zinc-800 rounded-2xl">🌗</button>
            <div id="userInfo" class="bg-white dark:bg-zinc-900 px-5 py-2 rounded-3xl"></div>
            <button onclick="logout()" class="bg-red-600 text-white px-6 py-3 rounded-2xl">Logout</button>
        </div>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
        <!-- Left: Calendar + Bookings -->
        <div class="lg:col-span-7 space-y-6">
            <!-- Calendar -->
            <div class="bg-white dark:bg-zinc-900 rounded-3xl p-6 shadow">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-2xl font-semibold">Availability Calendar</h2>
                    <div class="flex gap-4 items-center">
                        <button onclick="changeMonth(-1)" class="p-3 hover:bg-zinc-100 dark:hover:bg-zinc-800 rounded-2xl">←</button>
                        <button onclick="goToToday()" class="px-5 py-2 bg-zinc-100 dark:bg-zinc-800 rounded-2xl">Today</button>
                        <button onclick="changeMonth(1)" class="p-3 hover:bg-zinc-100 dark:hover:bg-zinc-800 rounded-2xl">→</button>
                        <span id="currentMonthYear" class="font-semibold"></span>
                    </div>
                </div>
                <div id="roomTabs" class="flex flex-wrap gap-2 mb-6"></div>
                <div id="calendarGrid" class="grid grid-cols-7 gap-2"></div>
            </div>

            <!-- Bookings with Full Details -->
            <div class="bg-white dark:bg-zinc-900 rounded-3xl p-6 shadow">
                <h3 id="selectedRoomTitle" class="text-xl font-semibold mb-4">Ticket Buyers</h3>
                <input id="searchInput" placeholder="Search name, email..." 
                       onkeyup="renderBookingsList(this.value)"
                       class="w-full bg-zinc-100 dark:bg-zinc-800 border border-zinc-300 dark:border-zinc-700 rounded-2xl px-5 py-3 mb-4">
                <div id="bookingsList" class="space-y-4 max-h-[520px] overflow-auto"></div>
            </div>
        </div>

        <!-- Sidebar -->
        <div class="lg:col-span-5 space-y-6">
            <!-- CSV -->
            <div class="bg-white dark:bg-zinc-900 rounded-3xl p-6 shadow">
                <h3 class="font-semibold mb-4">📥 CSV Import</h3>
                <div id="csvUploadZone" class="border-2 border-dashed border-zinc-400 rounded-3xl p-10 text-center cursor-pointer">
                    Drop Ticket Tailor CSV here
                </div>
                <input type="file" id="csvFileInput" accept=".csv" class="hidden">
            </div>

            <!-- Staff Chat -->
            <div class="bg-white dark:bg-zinc-900 rounded-3xl p-6 shadow flex flex-col" style="height: 520px;">
                <h3 class="font-semibold mb-4">💬 Staff Chat</h3>
                <div id="chatMessages" class="flex-1 overflow-auto space-y-3 bg-zinc-100 dark:bg-zinc-950 rounded-2xl p-4 mb-4"></div>
                <div class="flex gap-2">
                    <input id="staffName" placeholder="Your Name" class="w-1/3 bg-zinc-100 dark:bg-zinc-800 rounded-2xl px-4 py-3">
                    <input id="chatMessage" placeholder="Type message..." class="flex-1 bg-zinc-100 dark:bg-zinc-800 rounded-2xl px-4 py-3"
                           onkeypress="if(event.key==='Enter') sendChatMessage()">
                    <button onclick="sendChatMessage()" class="bg-blue-600 text-white px-6 rounded-2xl">Send</button>
                </div>
            </div>
        </div>
    </div>
</div>

<div id="toastContainer" class="fixed bottom-6 right-6 z-50"></div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, onSnapshot, Timestamp, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = { /* your config */ };
    const db = getFirestore(initializeApp(firebaseConfig));

    let currentUser = null;
    let currentDate = new Date();
    let currentRoom = 'bistroteca';
    let selectedDate = null;
    let allBookings = [];
    let chatMessages = [];

    const ROOMS = [ /* your rooms */ ];

    function showToast(msg, type = "success") {
        const toast = document.createElement("div");
        toast.className = `px-6 py-4 rounded-2xl text-sm font-medium shadow-2xl ${type === "success" ? "bg-emerald-600 text-white" : "bg-red-600 text-white"}`;
        toast.textContent = msg;
        document.getElementById("toastContainer").appendChild(toast);
        setTimeout(() => toast.remove(), 4000);
    }

    // Login (same as before)
    window.attemptLogin = function() { /* ... */ };
    window.logout = function() { localStorage.removeItem("ml_user"); location.reload(); };

    // Calendar Functions
    function renderCalendar() { /* full calendar code from previous */ }
    window.selectDate = function(dateStr) {
        selectedDate = dateStr;
        document.getElementById("selectedRoomTitle").textContent = `Bookings - ${dateStr}`;
        renderBookingsList();
    };

    // ================== FULL BOOKING DETAILS ==================
    function renderBookingsList(filter = '') {
        if (!selectedDate) {
            document.getElementById("bookingsList").innerHTML = `<div class="text-center py-12 text-zinc-500">Select a date to see ticket buyers</div>`;
            return;
        }

        let bookings = allBookings.filter(b => b.roomId === currentRoom && b.eventDate === selectedDate);
        if (filter) {
            const term = filter.toLowerCase();
            bookings = bookings.filter(b => 
                (b.customerName || '').toLowerCase().includes(term) || 
                (b.customerEmail || '').toLowerCase().includes(term)
            );
        }

        const container = document.getElementById("bookingsList");
        if (bookings.length === 0) {
            container.innerHTML = `<div class="text-center py-12 text-zinc-500">No bookings found</div>`;
            return;
        }

        container.innerHTML = bookings.map(b => `
            <div class="bg-white dark:bg-zinc-800 border border-zinc-200 dark:border-zinc-700 rounded-2xl p-5">
                <div class="flex justify-between">
                    <div>
                        <div class="font-semibold text-lg">${b.customerName || 'Unknown'}</div>
                        <div class="text-zinc-500">${b.customerEmail || ''}</div>
                    </div>
                    <div class="text-right">
                        <div class="text-sm">${b.eventTime || 'TBD'}</div>
                        <div class="text-emerald-600">${b.ticketCount || 1} ticket(s)</div>
                    </div>
                </div>
                ${b.customerMobile ? `<div class="mt-2 text-sm">📱 ${b.customerMobile}</div>` : ''}
                ${b.notes ? `<div class="mt-3 p-3 bg-yellow-50 dark:bg-yellow-900/30 rounded-xl text-sm">${b.notes}</div>` : ''}
                <button onclick="addNote('${b.id}')" class="mt-4 text-blue-600 text-sm hover:underline">+ Add Note</button>
            </div>
        `).join('');
    }

    window.addNote = async function(id) {
        const note = prompt("Add note for this booking:");
        if (!note) return;
        try {
            await updateDoc(doc(db, 'bookings', id), { notes: note });
            showToast("Note saved");
            renderBookingsList();
        } catch(e) { showToast("Failed to save note", "error"); }
    };

    // ================== STAFF CHAT ==================
    function renderChat() {
        const container = document.getElementById("chatMessages");
        container.innerHTML = chatMessages.map(m => `
            <div class="bg-white dark:bg-zinc-700 rounded-2xl p-3">
                <div class="font-medium text-blue-600">${m.name}</div>
                <div>${m.text}</div>
                <div class="text-xs text-zinc-500">${m.timestamp ? new Date(m.timestamp.toDate()).toLocaleTimeString() : ''}</div>
            </div>
        `).join('');
        container.scrollTop = container.scrollHeight;
    }

    window.sendChatMessage = async function() {
        const text = document.getElementById("chatMessage").value.trim();
        const name = document.getElementById("staffName").value.trim() || currentUser?.name || "Staff";
        if (!text) return;

        try {
            await addDoc(collection(db, 'chat'), {
                name: name,
                text: text,
                timestamp: Timestamp.now()
            });
            document.getElementById("chatMessage").value = '';
        } catch(e) {
            showToast("Failed to send message", "error");
        }
    };

    // Setup real-time listeners
    function startListeners() {
        // Bookings listener
        onSnapshot(collection(db, 'bookings'), (snap) => {
            allBookings = snap.docs.map(doc => ({id: doc.id, ...doc.data()}));
            renderCalendar();
            if (selectedDate) renderBookingsList();
        });

        // Chat listener
        const chatQuery = query(collection(db, 'chat'), orderBy('timestamp', 'asc'));
        onSnapshot(chatQuery, (snap) => {
            chatMessages = snap.docs.map(doc => doc.data());
            renderChat();
        });
    }

    window.onload = () => {
        checkAuth();
        startListeners();
    };
</script>
</body>
</html>
